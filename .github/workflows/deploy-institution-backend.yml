name: Deploy Institutional Backend

# Automatic production deployment is intentionally limited to reviewed backend
# migrations/functions merged to main; manual deployment remains available.
"on":
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/deploy-institution-backend.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to apply migrations and deploy account services"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: institutional-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: institutional-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ECHS_BOOTSTRAP_SECRET: ${{ secrets.ECHS_BOOTSTRAP_SECRET }}
      ECHS_ALLOWED_ORIGINS: https://2ed944-cloud.github.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm required encrypted secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD ECHS_BOOTSTRAP_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required encrypted secret: $name" >&2
              exit 1
            fi
          done

      - name: Reject duplicate Supabase migration versions
        run: python tools/validate_supabase_migration_versions.py

      - name: Validate institutional backend foundations
        run: |
          python tools/validate_private_bank_foundation.py
          python tools/validate_upload_manager.py
          python tools/test_lesson_visibility_contract.py .
          python tools/validate_readiness_system.py

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply institutional database migrations
        run: supabase db push --linked

      - name: Set Edge Function secrets
        run: |
          supabase secrets set \
            "BOOTSTRAP_SECRET=$ECHS_BOOTSTRAP_SECRET" \
            "ALLOWED_ORIGINS=$ECHS_ALLOWED_ORIGINS" \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy all institutional Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Verify deployed health endpoints
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in account-api institution-api mastery-evidence private-bank-api practice-bank-api private-bank-purge-api upload-manager-api setup-api readiness-api lesson-api; do
            curl --fail --silent --show-error \
              "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/${endpoint}/health" | python -m json.tool
          done

      - name: Verify deployed provisional mastery status contract
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in institution-api mastery-evidence; do
            curl --fail --silent --show-error \
              "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/${endpoint}/health" \
              --output "$RUNNER_TEMP/echs-${endpoint}-status-health.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          for endpoint, service, version in [('institution-api', 'echs-institution-api', '4.0.0'),
                                             ('mastery-evidence', 'echs-mastery-evidence', '2.0.0-foundation')]:
              actual = json.loads((Path(os.environ['RUNNER_TEMP']) / f'echs-{endpoint}-status-health.json').read_text())
              expected = {'ok': True, 'service': service, 'version': version,
                          'status_contract': 'echs.mastery-status.v1', 'grading_authoritative': False}
              assert actual == expected and actual.get('ok') is True and actual.get('grading_authoritative') is False, f'Deployed {endpoint} provisional mastery contract is incompatible'
          print('Production institutional and mastery evidence status contracts: PASS')
          PY

      - name: Verify deployed atomic membership transport and database capability
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/institution-api/health/membership" \
            --output "$RUNNER_TEMP/echs-membership-health.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'echs-membership-health.json').read_text())
          expected = {'ok': True, 'service': 'echs-institution-api',
                      'membership_capabilities': {'contract': 'echs.membership.v1',
                        'atomic_replacement': True, 'tenant_scoped': True}}
          assert actual == expected, 'Deployed membership transaction capability is unavailable or incompatible'
          print('Production membership transport and service-only database capability: PASS')
          PY

      - name: Verify deployed immutable private archive schema and bucket configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/private-bank-api/health/snapshots" \
            --output "$RUNNER_TEMP/echs-private-archive-health.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'echs-private-archive-health.json').read_text())
          expected = {'ok': True, 'service': 'echs-private-bank-api',
                      'archive_capabilities': {'contract': 'echs.private-bank.snapshot-store.v1',
                        'schema_version': 1, 'immutable_ready': True, 'student_delivery': False,
                        'max_record_bytes': 65536, 'max_object_bytes': 16777216,
                        'max_snapshot_bytes': 268435456}}
          # Canonical JSON comparison preserves boolean/integer distinctions.
          assert json.dumps(actual, sort_keys=True, separators=(',', ':')) == json.dumps(expected, sort_keys=True, separators=(',', ':')), 'Deployed private archive capability is unavailable or incompatible'
          print('Production private archive schema and private bucket configuration: PASS; no content imported or delivered')
          PY

      - name: Verify deployed bootstrap secret
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "x-bootstrap-secret: $ECHS_BOOTSTRAP_SECRET" \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/setup-api/verify-secret" | python -m json.tool

      - name: Verify deployed lesson authoring transport and database capability
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/lesson-api/health/authoring" \
            --output "$RUNNER_TEMP/echs-authoring-health.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'echs-authoring-health.json').read_text())
          expected = {'ok': True, 'service': 'lesson-api', 'contract': 'echs.lesson.store.v1',
                      'authoring_capabilities': {'contract': 'echs.lesson.authoring.v1', 'content_version': 2,
                        'blocks': {'rich-text': [1, 2], 'math': [1, 2], 'callout': [1, 2], 'legacy-embedded': [1]},
                        'math_expression_version': 1}}
          assert actual == expected, 'Deployed lesson authoring capability is unavailable or incompatible'
          print('Production lesson authoring transport and database capability: PASS')
          PY

      - name: Verify deployed private lesson media transport and storage configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/lesson-api/health/media" \
            --output "$RUNNER_TEMP/echs-media-health.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'echs-media-health.json').read_text())
          expected = {'ok': True, 'service': 'lesson-api', 'contract': 'echs.lesson.store.v1',
                      'media_capabilities': {'contract': 'echs.lesson.media.v1',
                        'blocks': {'image': [1], 'video': [1], 'table': [1], 'resource': [1]},
                        'asset_delivery': 'authenticated-bytes',
                        'mime_types': ['image/png', 'image/jpeg', 'image/webp', 'application/pdf'],
                        'max_image_bytes': 4194304, 'max_resource_bytes': 8388608}}
          assert actual == expected, 'Deployed private lesson media capability is unavailable or incompatible'
          print('Production lesson media transport, database and private bucket configuration: PASS')
          PY

      - name: Verify deployed private draft recovery transport and key configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/lesson-api/health/recovery" \
            --output "$RUNNER_TEMP/echs-recovery-health.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'echs-recovery-health.json').read_text())
          expected = {'ok': True, 'service': 'lesson-api', 'contract': 'echs.lesson.store.v1',
                      'recovery_capabilities': {'contract': 'echs.lesson.recovery.v1',
                        'cipher': 'AES-256-GCM', 'checkpoint_version': 1, 'max_plaintext_bytes': 4194304}}
          assert actual == expected, 'Deployed private recovery capability is unavailable or incompatible'
          print('Production draft recovery transport, database and private key configuration: PASS')
          PY

      - name: Verify production authentication and session transaction
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error \
            --request POST \
            --header "x-bootstrap-secret: $ECHS_BOOTSTRAP_SECRET" \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/login-diagnostics")"
          printf '%s' "$result" | python -m json.tool
          RESULT="$result" python - <<'PY'
          import json, os, sys
          payload = json.loads(os.environ["RESULT"])
          required = (payload.get("ok"), payload.get("login_contract"), payload.get("session_contract"))
          if required != (True, True, True):
              print("Production authentication/session self-test failed", file=sys.stderr)
              sys.exit(1)
          print("Production authentication and session transaction: PASS")
          PY

      - name: Deployment reminder
        run: |
          echo "Backend deployed; migrations, private banks, strict practice scopes, Teacher Upload Manager, IB readiness intelligence, bootstrap secret, and production login/session contracts passed."
          echo "The scheduled Process Teacher Uploads workflow requires SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in the institutional-production environment."

name: Build IB AI Unit 1 GDC v7 integration artifact

on:
  push:
    branches:
      - agent/ib-ai-unit1-gdc-integration-v7
    paths:
      - 'tools/install_ib_ai_unit1_gdc_v7.py'
      - '.github/workflows/ib-ai-unit1-gdc-v7-bootstrap.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/ib-ai-unit1-gdc-integration-v7
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate final integration files
        run: python tools/install_ib_ai_unit1_gdc_v7.py

      - name: Stage generated deliverables
        run: |
          mkdir -p artifacts/ib-ai-unit1-gdc-v7
          cp --parents \
            lessons/ib-math-ai/unit-1/data/unit-1-gdc-integration-v7.js \
            lessons/ib-math-ai/unit-1/assets/css/unit-1-gdc-integration-v7.css \
            lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.2_arithmetic_sequences_ECHS.html \
            lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.3_geometric_sequences_ECHS.html \
            lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.4_financial_models_ECHS.html \
            lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.5_logarithms_ECHS.html \
            lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.6_technology_equations_ECHS.html \
            lessons/ib-math-ai/unit-1/data/lesson-1.4-ti84-finance-workflows-v6-3.js \
            lessons/ib-math-ai/unit-1/data/lesson-1.6-ti84-classroom-workflows-v6-2-2.js \
            tools/qa_ib_ai_unit1_gdc_v7.py \
            tools/browser_qa_ib_ai_unit1_gdc_v7.mjs \
            .github/workflows/ib-ai-unit1-gdc-v7-qa.yml \
            artifacts/ib-ai-unit1-gdc-v7/
          find artifacts/ib-ai-unit1-gdc-v7 -type f -print | sort > artifacts/ib-ai-unit1-gdc-v7/manifest.txt

      - name: Upload generated integration
        uses: actions/upload-artifact@v4
        with:
          name: ib-ai-unit1-gdc-v7-generated
          path: artifacts/ib-ai-unit1-gdc-v7
          if-no-files-found: error

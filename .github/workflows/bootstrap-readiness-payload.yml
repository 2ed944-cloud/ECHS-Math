name: Bootstrap IB Readiness Payload

on:
  push:
    branches:
      - feature/ib-readiness-pathway-engine

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Unpack exact reviewed readiness payload
        shell: bash
        run: |
          set -euo pipefail
          cat .readiness-payload/part-* > /tmp/readiness.b64
          base64 --decode /tmp/readiness.b64 > /tmp/readiness.tar.gz
          echo "212babe566c6cb7b82ebf43408d440c359f61b499e163e3e3cea52127091c687  /tmp/readiness.tar.gz" | sha256sum -c -
          tar -xzf /tmp/readiness.tar.gz -C .
          rm -rf .readiness-payload
          rm -f .github/workflows/bootstrap-readiness-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build IB Mathematics readiness and pathway intelligence"
          git push origin HEAD:feature/ib-readiness-pathway-engine

name: TEMP Add IB AI 1.5 notes card

on:
  push:
    branches:
      - agent/ib-ai-1-5-dual-notes-card-v9

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ib-ai-1-5-dual-notes-card-v9
          fetch-depth: 0

      - name: Register Lesson 1.5 dual notes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/ib-math-ai-unit-1-update.js')
          text = p.read_text(encoding='utf-8')
          label = 'Full Notes 1.5 · Lesson-Synchronised Edition'
          if label not in text:
              anchor = '''  upsertFullNotes("1.4",[\n    {label:"Full Notes 1.4 · Lesson-Synchronised Edition",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.4_Financial_Applications_Full_Notes_Student.html",type:"notes"},\n    {label:"Full Notes 1.4 · Original Coloured LaTeX PDF",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.4_Financial_Applications_Full_Notes_Student.pdf",type:"notes"}\n  ]);\n'''
              block = '''  upsertFullNotes("1.5",[\n    {label:"Full Notes 1.5 · Lesson-Synchronised Edition",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.5_Exponent_Laws_and_Logarithms_Full_Notes_Student.html",type:"notes"},\n    {label:"Full Notes 1.5 · Original Coloured LaTeX PDF",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.5_Exponent_Laws_and_Logarithms_Full_Notes_Student.pdf",type:"notes"}\n  ]);\n'''
              if anchor not in text:
                  raise SystemExit('Expected Lesson 1.4 notes anchor not found')
              text = text.replace(anchor, anchor + block, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate exact resource contract
        run: |
          set -euo pipefail
          node --check data/ib-math-ai-unit-1-update.js
          grep -F 'Full Notes 1.5 · Lesson-Synchronised Edition' data/ib-math-ai-unit-1-update.js
          grep -F 'Full Notes 1.5 · Original Coloured LaTeX PDF' data/ib-math-ai-unit-1-update.js
          grep -F 'IB_AI_SL_1.5_Exponent_Laws_and_Logarithms_Full_Notes_Student.html' data/ib-math-ai-unit-1-update.js
          grep -F 'IB_AI_SL_1.5_Exponent_Laws_and_Logarithms_Full_Notes_Student.pdf' data/ib-math-ai-unit-1-update.js
          test -f notes/ib-math-ai/unit-1/IB_AI_SL_1.5_Exponent_Laws_and_Logarithms_Full_Notes_Student.html
          test -f notes/ib-math-ai/unit-1/IB_AI_SL_1.5_Exponent_Laws_and_Logarithms_Full_Notes_Student.pdf
          ! grep -F 'Teacher_Key' data/ib-math-ai-unit-1-update.js

      - name: Commit clean patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-add-ib-ai-1-5-notes-card.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ib-math-ai-unit-1-update.js .github/workflows/temp-add-ib-ai-1-5-notes-card.yml
          git commit -m 'Register Lesson 1.5 dual Full Notes resources'
          git push origin HEAD:agent/ib-ai-1-5-dual-notes-card-v9

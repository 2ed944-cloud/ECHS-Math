name: Private learning browser journal HTTPS

on:
  pull_request:
    paths:
      - '.github/workflows/private-learning-browser-journal-http.yml'
      - 'tools/private-learning-browser-journal-http/**'
      - 'tools/private-learning-owner-fence-retry/**'
      - 'tools/private-learning-operation-journal/**'
      - 'tools/private-learning-journal-http/**'
      - 'tools/private-learning-owner-fence/**'
      - 'tools/private_snapshot_fixture.py'
      - 'tools/test_membership_authorization_database.py'
      - 'tools/test_private_snapshot_database.py'
      - 'supabase/functions/institution-api/index.ts'
      - 'supabase/functions/learning-sync/index.ts'
      - 'supabase/functions/mastery-evidence/index.ts'
      - '.github/workflows/private-learning-journal-http.yml'
      - '.github/workflows/private-learning-operation-journal.yml'
      - '.github/workflows/private-learning-owner-fence.yml'
      - '.github/workflows/private-learning-owner-fence-retry.yml'
      - 'supabase/migrations/**'
      - 'question-bank/official/tools/package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-learning-browser-journal-http.yml'
      - 'tools/private-learning-browser-journal-http/**'
      - 'tools/private-learning-owner-fence-retry/**'
      - 'tools/private-learning-operation-journal/**'
      - 'tools/private-learning-journal-http/**'
      - 'tools/private-learning-owner-fence/**'
      - 'tools/private_snapshot_fixture.py'
      - 'tools/test_membership_authorization_database.py'
      - 'tools/test_private_snapshot_database.py'
      - 'supabase/functions/institution-api/index.ts'
      - 'supabase/functions/learning-sync/index.ts'
      - 'supabase/functions/mastery-evidence/index.ts'
      - '.github/workflows/private-learning-journal-http.yml'
      - '.github/workflows/private-learning-operation-journal.yml'
      - '.github/workflows/private-learning-owner-fence.yml'
      - '.github/workflows/private-learning-owner-fence-retry.yml'
      - 'supabase/migrations/**'
      - 'question-bank/official/tools/package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-learning-browser-journal-http-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser HTTPS PostgreSQL ${{ matrix.postgres_major }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        postgres_major: [15, 17]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned fixture and browser dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/echs-browser-bin
        run: |
          python -m pip install 'psycopg[binary]==3.2.9' pglast==7.7 PyYAML==6.0.2
          npm ci --prefix question-bank/official/tools
          node question-bank/official/tools/node_modules/playwright/cli.js install --with-deps chromium --no-shell
      - name: Verify exact source closure and actual local fixture guards
        run: python -B tools/private-learning-browser-journal-http/local_tests.py --repo . --output "$RUNNER_TEMP/browser-journal-local-tests" --execute
      - name: Execute unchanged twenty HTTP and twelve real browser cases
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/echs-browser-bin
        run: python -B tools/private-learning-browser-journal-http/run.py --repo . --postgres-major ${{ matrix.postgres_major }} --execute
      - name: Close source, checkout, runtime and cleanup evidence
        if: always()
        run: python -B tools/private-learning-browser-journal-http/assemble.py --repo . --postgres-major ${{ matrix.postgres_major }} --directory "$RUNNER_TEMP/private-learning-browser-journal-http-${{ matrix.postgres_major }}" --tests "$RUNNER_TEMP/browser-journal-local-tests" --output "$RUNNER_TEMP/private-learning-browser-journal-http-evidence-${{ matrix.postgres_major }}"
      - name: Retain closed metadata including incomplete service outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-learning-browser-journal-http-pg${{ matrix.postgres_major }}
          path: ${{ runner.temp }}/private-learning-browser-journal-http-evidence-${{ matrix.postgres_major }}
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bound local fixture results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-learning-browser-journal-local-pg${{ matrix.postgres_major }}
          path: ${{ runner.temp }}/browser-journal-local-tests
          if-no-files-found: error
          retention-days: 14

name: Diagnose IB Uploaded Bank Zero

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-ib-private-bank-zero.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm protected diagnostic secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!name:-}" || { echo "Missing $name" >&2; exit 1; }
          done

      - name: Compare canonical IB mappings with live API indexes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {'apikey': key, 'authorization': f'Bearer {key}'}

          def get_rows(table, select, page_size=1000):
              rows = []
              offset = 0
              while True:
                  query = urllib.parse.urlencode({'select': select, 'order': 'question_id.asc' if table == 'private_bank_questions' else 'bank_code.asc'}, safe=',.*()[]:{}"')
                  request = urllib.request.Request(
                      f'{base}/rest/v1/{table}?{query}',
                      headers={**headers, 'range': f'{offset}-{offset + page_size - 1}'},
                  )
                  with urllib.request.urlopen(request, timeout=120) as response:
                      page = json.load(response)
                  rows.extend(page)
                  if len(page) < page_size:
                      return rows
                  offset += len(page)

          questions = get_rows(
              'private_bank_questions',
              'organization_id,question_id,bank_code,course_keys,lesson_keys,course_mappings,student_visible,mapping_verified,trust_tier',
          )
          packages = get_rows(
              'private_bank_packages',
              'organization_id,bank_code,question_count,deployment_state,manifest',
          )

          allowed_trust = {'publisher_key_direct', 'student_ready_verified'}
          orgs = sorted({str(row.get('organization_id') or '') for row in questions + packages if row.get('organization_id')})
          org_label = {value: f'org_{index + 1}' for index, value in enumerate(orgs)}

          summaries = collections.defaultdict(lambda: {
              'packages': set(),
              'declared': 0,
              'canonical': 0,
              'indexed': 0,
              'eligible_canonical': 0,
              'eligible_indexed': 0,
              'payload_only': 0,
              'numeric_lessons': collections.Counter(),
              'aggregate_lessons': collections.Counter(),
              'banks': collections.Counter(),
              'trust': collections.Counter(),
          })

          for package in packages:
              org = str(package.get('organization_id') or '')
              manifest = package.get('manifest') or {}
              targets = {str(value) for value in (manifest.get('target_courses') or [])}
              code = str(package.get('bank_code') or '')
              if 'ib-math-ai' in targets or code.startswith('IBAI-') or 'IBAI' in code:
                  summary = summaries[org]
                  summary['packages'].add(code)
                  summary['declared'] += int(package.get('question_count') or 0)

          for row in questions:
              org = str(row.get('organization_id') or '')
              mappings = row.get('course_mappings') or []
              ib_mappings = [mapping for mapping in mappings if str((mapping or {}).get('course') or '') == 'ib-math-ai']
              indexed = 'ib-math-ai' in (row.get('course_keys') or [])
              if not ib_mappings and not indexed:
                  continue
              summary = summaries[org]
              canonical = bool(ib_mappings)
              eligible = row.get('student_visible') is True and row.get('mapping_verified') is True and str(row.get('trust_tier') or '') in allowed_trust
              if canonical:
                  summary['canonical'] += 1
                  if eligible:
                      summary['eligible_canonical'] += 1
              if indexed:
                  summary['indexed'] += 1
                  if eligible:
                      summary['eligible_indexed'] += 1
              if canonical and not indexed:
                  summary['payload_only'] += 1
              summary['banks'][str(row.get('bank_code') or 'UNKNOWN')] += 1
              summary['trust'][str(row.get('trust_tier') or 'missing')] += 1
              for mapping in ib_mappings:
                  lesson = str((mapping or {}).get('lesson_key') or '')
                  if not lesson:
                      continue
                  if lesson.startswith('1.'):
                      summary['numeric_lessons'][lesson] += 1
                  else:
                      summary['aggregate_lessons'][lesson] += 1

          output = {}
          for org in orgs:
              summary = summaries[org]
              if not (summary['packages'] or summary['canonical'] or summary['indexed']):
                  continue
              output[org_label[org]] = {
                  'ib_packages': len(summary['packages']),
                  'declared_package_questions': summary['declared'],
                  'canonical_ib_questions': summary['canonical'],
                  'course_keys_indexed_questions': summary['indexed'],
                  'eligible_by_canonical_mapping': summary['eligible_canonical'],
                  'eligible_by_live_api_index': summary['eligible_indexed'],
                  'canonical_missing_course_key': summary['payload_only'],
                  'numeric_lessons': dict(sorted(summary['numeric_lessons'].items())),
                  'top_aggregate_lessons': dict(summary['aggregate_lessons'].most_common(15)),
                  'banks': dict(summary['banks']),
                  'trust_tiers': dict(summary['trust']),
              }

          print('LIVE_IB_ZERO_DIAGNOSTIC=')
          print(json.dumps(output, indent=2, sort_keys=True))

          if not output:
              raise SystemExit('No live IB package or mapping records were found')
          if not any(row['canonical_ib_questions'] for row in output.values()):
              raise SystemExit('IB packages exist but canonical course_mappings contain no ib-math-ai questions')
          PY

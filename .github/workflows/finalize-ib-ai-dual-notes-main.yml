name: Finalize IB AI dual notes on main
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add exact PDFs and dual resources
        run: |
          set -euo pipefail
          git fetch origin agent/ib-ai-dual-notes-merge-final agent/ib-ai-1-2-notes-resource --force
          mkdir -p notes/ib-math-ai/unit-1

          git cat-file blob 01d6faebfe70f315612d5dab52d022687059d518 > notes/ib-math-ai/unit-1/IB_AI_SL_1.2_Arithmetic_Sequences_Full_Notes_Student.pdf
          git cat-file blob bc3f7d275d687cdadf23445d3a50142b01f14348 > notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.pdf
          git show origin/agent/ib-ai-1-2-notes-resource:notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.html > notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.html

          test "$(git hash-object notes/ib-math-ai/unit-1/IB_AI_SL_1.2_Arithmetic_Sequences_Full_Notes_Student.pdf)" = "01d6faebfe70f315612d5dab52d022687059d518"
          test "$(git hash-object notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.pdf)" = "bc3f7d275d687cdadf23445d3a50142b01f14348"
          echo 'd53336db0ded99824629decbfd4b53afa938b8479b31fa07e93841fc46dcaa63  notes/ib-math-ai/unit-1/IB_AI_SL_1.2_Arithmetic_Sequences_Full_Notes_Student.pdf' | sha256sum -c -
          echo '8a8934ab9c49c0e6ee2a1f5f4417d4839aa1aab2998cac758216ec3fefcfb2e4  notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.pdf' | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/ib-math-ai-unit-1-update.js')
          s=p.read_text()
          replacement='''  const upsertFullNotes=(number,items)=>{\n    const lesson=unit.lessons.find(value=>value.number===number);\n    if(!lesson)return;\n    lesson.resources=Array.isArray(lesson.resources)?lesson.resources:[];\n    const urls=new Set(items.map(item=>item.url));\n    lesson.resources=lesson.resources.filter(resource=>!resource||!urls.has(resource.url));\n    lesson.resources.splice(1,0,...items);\n  };\n\n  upsertFullNotes("1.2",[\n    {label:"Full Notes 1.2 · Lesson-Synchronised Edition",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.2_Arithmetic_Sequences_Full_Notes_Student.html",type:"notes"},\n    {label:"Full Notes 1.2 · Original Coloured LaTeX PDF",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.2_Arithmetic_Sequences_Full_Notes_Student.pdf",type:"notes"}\n  ]);\n  upsertFullNotes("1.3",[\n    {label:"Full Notes 1.3 · Lesson-Synchronised Edition",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.html",type:"notes"},\n    {label:"Full Notes 1.3 · Original Coloured LaTeX PDF",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.pdf",type:"notes"}\n  ]);\n'''
          patterns=[
            r'  const lesson12=unit\.lessons\.find\(lesson=>lesson\.number==="1\.2"\);\nif\(lesson12\)\{.*?\n\}\n',
            r'  const upsertFullNotes=\(number,items\)=>\{.*?upsertFullNotes\("1\.3",\[.*?\n  \]\);\n'
          ]
          for pattern in patterns:
            ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
            if n==1:
              s=ns
              break
          else:
            raise SystemExit('Expected Full Notes registration block not found; refusing to overwrite current Unit 1 data')
          p.write_text(s)
          PY

          grep -F 'Full Notes 1.2 · Lesson-Synchronised Edition' data/ib-math-ai-unit-1-update.js
          grep -F 'Full Notes 1.2 · Original Coloured LaTeX PDF' data/ib-math-ai-unit-1-update.js
          grep -F 'Full Notes 1.3 · Lesson-Synchronised Edition' data/ib-math-ai-unit-1-update.js
          grep -F 'Full Notes 1.3 · Original Coloured LaTeX PDF' data/ib-math-ai-unit-1-update.js
          ! grep -qi 'Teacher Key' data/ib-math-ai-unit-1-update.js

          rm -f .github/workflows/finalize-ib-ai-dual-notes-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ib-math-ai-unit-1-update.js notes/ib-math-ai/unit-1 .github/workflows/finalize-ib-ai-dual-notes-main.yml
          git commit -m 'Add dual Full Notes resources for IB AI Lessons 1.2 and 1.3'
          git push origin HEAD:main

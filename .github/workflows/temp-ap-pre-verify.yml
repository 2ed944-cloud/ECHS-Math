name: Temporary AP Precalculus Membership Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-ap-pre-verify.yml"

permissions:
  contents: read

jobs:
  verify-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Verify 18 active AP Precalculus members
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {
              "apikey": key,
              "authorization": f"Bearer {key}",
              "content-type": "application/json",
          }

          class_query = urllib.parse.urlencode(
              {
                  "select": "id,name,course_key,academic_year,section",
                  "name": "ilike.AP Precalculus",
                  "status": "eq.active",
                  "limit": "1",
              },
              safe=",",
          )
          request = urllib.request.Request(
              f"{base}/rest/v1/classes?{class_query}",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              classes = json.load(response)
          if len(classes) != 1:
              raise SystemExit(f"Expected one active AP Precalculus class, found {len(classes)}")
          class_row = classes[0]

          member_query = urllib.parse.urlencode(
              {
                  "select": "account_id",
                  "class_id": f"eq.{class_row['id']}",
                  "membership_role": "eq.student",
              },
              safe=",",
          )
          request = urllib.request.Request(
              f"{base}/rest/v1/class_memberships?{member_query}",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              members = json.load(response)

          account_query = urllib.parse.urlencode(
              {
                  "select": "id",
                  "role": "eq.student",
                  "status": "eq.active",
                  "grade": "eq.AP Precalculus",
              },
              safe=",",
          )
          request = urllib.request.Request(
              f"{base}/rest/v1/accounts?{account_query}",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              course_accounts = json.load(response)

          result = {
              "ok": len(members) == 18 and len(course_accounts) == 18,
              "expected": 18,
              "member_count": len(members),
              "active_course_account_count": len(course_accounts),
              "class_name": class_row["name"],
              "course_key": class_row["course_key"],
              "academic_year": class_row.get("academic_year"),
              "section": class_row.get("section"),
          }
          with open("verification-result.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle)
          if not result["ok"]:
              raise SystemExit(
                  f"Verification mismatch: members={len(members)}, accounts={len(course_accounts)}"
              )
          print("Verified 18 active AP Precalculus class members.")
          PY

      - name: Upload verification result
        uses: actions/upload-artifact@v4
        with:
          name: temporary-ap-pre-verification-${{ github.run_id }}
          path: verification-result.json
          if-no-files-found: error
          retention-days: 1


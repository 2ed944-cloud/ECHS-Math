name: Install IB AI SL lesson 4.15 payload

on:
  push:
    branches:
      - agent/ib-ai-4-15-gof-v2
    paths:
      - '.lesson415_payload/**'
      - '.github/workflows/install-lesson-4.15-payload.yml'

permissions:
  contents: write

concurrency:
  group: install-ib-ai-4-15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble, verify, and install lesson files
        shell: bash
        run: |
          set -euo pipefail
          test -f .lesson415_payload/payload.part.00
          cat .lesson415_payload/payload.part.* > /tmp/lesson415_payload.b64
          base64 --decode /tmp/lesson415_payload.b64 > /tmp/lesson415_payload.tar.gz
          echo 'f34cc74377b95f878691c35cdd621e01ef85938cd5e68d6749976c3fbcb73344  /tmp/lesson415_payload.tar.gz' | sha256sum --check --strict

          rm -rf /tmp/lesson415_payload
          mkdir -p /tmp/lesson415_payload
          tar -xzf /tmp/lesson415_payload.tar.gz -C /tmp/lesson415_payload

          install -m 0644 /tmp/lesson415_payload/IB_AI_SL_4.15_chi_square_goodness_of_fit_ECHS.html lessons/ib-math-ai/unit-4/lessons/IB_AI_SL_4.15_chi_square_goodness_of_fit_ECHS.html
          install -m 0644 /tmp/lesson415_payload/lesson-4.15-v2-core.js lessons/ib-math-ai/unit-4/data/lesson-4.15-v2-core.js
          install -m 0644 /tmp/lesson415_payload/lesson-4.15-v2-practice.js lessons/ib-math-ai/unit-4/data/lesson-4.15-v2-practice.js
          install -m 0644 /tmp/lesson415_payload/lesson-4.15-v2-assessment.js lessons/ib-math-ai/unit-4/data/lesson-4.15-v2-assessment.js
          install -m 0644 /tmp/lesson415_payload/lesson-4.15-v2-interactions.js lessons/ib-math-ai/unit-4/data/lesson-4.15-v2-interactions.js
          install -m 0644 /tmp/lesson415_payload/lesson-4.15-v2-ti84.js lessons/ib-math-ai/unit-4/data/lesson-4.15-v2-ti84.js
          install -m 0644 /tmp/lesson415_payload/lesson-4.15-v2-core.css lessons/ib-math-ai/unit-4/assets/css/lesson-4.15-v2-core.css
          install -m 0644 /tmp/lesson415_payload/lesson-4.15-v2-responsive-ti84.css lessons/ib-math-ai/unit-4/assets/css/lesson-4.15-v2-responsive-ti84.css
          install -m 0755 /tmp/lesson415_payload/test_ib_ai_4_15_v2.py tools/test_ib_ai_4_15_v2.py

      - name: Run mathematical and structural QA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_ib_ai_4_15_v2.py .
          node --check lessons/ib-math-ai/unit-4/data/lesson-4.15-v2-core.js
          node --check lessons/ib-math-ai/unit-4/data/lesson-4.15-v2-practice.js
          node --check lessons/ib-math-ai/unit-4/data/lesson-4.15-v2-assessment.js
          node --check lessons/ib-math-ai/unit-4/data/lesson-4.15-v2-interactions.js
          node --check lessons/ib-math-ai/unit-4/data/lesson-4.15-v2-ti84.js

      - name: Commit verified lesson build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lesson415_payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ib-ai): rebuild lesson 4.15 goodness-of-fit'
          git push origin HEAD:${GITHUB_REF_NAME}

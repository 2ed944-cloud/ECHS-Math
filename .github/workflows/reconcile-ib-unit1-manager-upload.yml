name: Reconcile IB Unit 1 Manager Upload

on:
  push:
    branches:
      - main
    paths:
      - ".github/ib-unit1-manager-reconcile-trigger"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out published release
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify the published IB Unit 1 release
        shell: bash
        run: |
          set -euo pipefail
          test -f data/ib-math-ai-unit-1-update.js
          for lesson in \
            IB_AI_SL_1.1_standard_form_ECHS.html \
            IB_AI_SL_1.2_arithmetic_sequences_ECHS.html \
            IB_AI_SL_1.3_geometric_sequences_ECHS.html \
            IB_AI_SL_1.4_financial_models_ECHS.html \
            IB_AI_SL_1.5_logarithms_ECHS.html \
            IB_AI_SL_1.6_approximation_error_ECHS.html \
            IB_AI_SL_1.7_loans_annuities_ECHS.html \
            IB_AI_SL_1.8_technology_equations_ECHS.html; do
            test -f "lessons/ib-math-ai/unit-1/lessons/$lesson"
            grep -q "$lesson" data/ib-math-ai-unit-1-update.js
          done
          test ! -e lessons/ib-math-ai/unit-1/lessons/lesson.html
          node --check data/ib-math-ai-unit-1-update.js
          merged_at="$(gh pr view 79 --repo "$GITHUB_REPOSITORY" --json mergedAt --jq '.mergedAt // empty')"
          test -n "$merged_at"

      - name: Locate and complete the Manager request
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess, urllib.parse, urllib.request
          from datetime import datetime, timezone

          EXPECTED_SHA = 'b029480943c6a3f7dda1d032b3a2f6527d257e517093662efd6c2f7f7a5114a0'
          EXPECTED_NAME_TOKEN = 'ib_ai_sl_unit_1_echs_complete_offline_fixed'
          RECOVERABLE = {'created', 'queued', 'processing', 'failed', 'cancelled', 'pr-opened'}
          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {'apikey': key, 'authorization': f'Bearer {key}'}
          select = 'id,status,upload_kind,course_key,unit_key,sha256,original_filename,github_pr_url,created_at,stage,result,error_message'

          def get_rows(params):
              query = urllib.parse.urlencode(params, safe=',().')
              request = urllib.request.Request(
                  f'{base}/rest/v1/teacher_upload_requests?{query}',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def normalized(value):
              return re.sub(r'[^a-z0-9]+', '_', str(value or '').lower()).strip('_')

          def result_value(row, key):
              result = row.get('result')
              return result.get(key) if isinstance(result, dict) else None

          def is_ib_unit1(row):
              course = normalized(row.get('course_key'))
              unit = str(row.get('unit_key') or '').strip()
              result_course = normalized(result_value(row, 'course'))
              result_unit = str(result_value(row, 'unit') or '').strip()
              filename = normalized(row.get('original_filename'))
              destination = normalized(result_value(row, 'destination'))
              course_match = course in {'ib_math_ai', 'g11_ib_ai'} and unit == '1'
              result_match = result_course in {'ib_math_ai', 'g11_ib_ai'} and result_unit == '1'
              filename_match = EXPECTED_NAME_TOKEN in filename
              destination_match = destination == 'lessons_ib_math_ai_unit_1'
              return course_match or result_match or filename_match or destination_match

          all_rows = get_rows({
              'select': select,
              'upload_kind': 'eq.course-release',
              'order': 'created_at.desc',
              'limit': '50',
          })
          print('Recent course-release request metadata:')
          for item in all_rows:
              safe = {
                  'id': item.get('id'),
                  'status': item.get('status'),
                  'course_key': item.get('course_key'),
                  'unit_key': item.get('unit_key'),
                  'sha256': item.get('sha256'),
                  'original_filename': item.get('original_filename'),
                  'stage': item.get('stage'),
                  'created_at': item.get('created_at'),
                  'result_course': result_value(item, 'course'),
                  'result_unit': result_value(item, 'unit'),
                  'result_destination': result_value(item, 'destination'),
              }
              print(json.dumps(safe, ensure_ascii=False, sort_keys=True))

          exact = [row for row in all_rows if row.get('sha256') == EXPECTED_SHA and is_ib_unit1(row)]
          if exact:
              candidates = exact
              match_mode = 'exact-sha'
          else:
              candidates = [row for row in all_rows if is_ib_unit1(row)]
              match_mode = 'verified-course-unit-result-or-filename'

          if not candidates:
              raise SystemExit(
                  'No course-release request matched IB Mathematics AI Unit 1 by exact SHA, Manager course/unit, materialized result, destination, or verified filename.'
              )

          noncompleted = [row for row in candidates if str(row.get('status') or '') in RECOVERABLE]
          pool = noncompleted or candidates
          row = max(pool, key=lambda item: str(item.get('created_at') or ''))

          pr = json.loads(subprocess.run(
              ['gh', 'pr', 'view', '79', '--repo', os.environ['GITHUB_REPOSITORY'], '--json', 'url,mergedAt'],
              check=True, text=True, capture_output=True,
          ).stdout)
          if not pr.get('mergedAt'):
              raise SystemExit('IB Unit 1 release PR #79 is not merged')

          previous_status = str(row.get('status') or '')
          now = datetime.now(timezone.utc).isoformat()
          values = {
              'status': 'completed',
              'progress': 100,
              'stage': 'Course release merged and published',
              'github_pr_url': pr['url'],
              'error_message': None,
              'completed_at': now,
              'updated_at': now,
          }
          patch_query = urllib.parse.urlencode({'id': f"eq.{row['id']}"})
          patch = urllib.request.Request(
              f'{base}/rest/v1/teacher_upload_requests?{patch_query}',
              data=json.dumps(values).encode(),
              method='PATCH',
              headers={**headers, 'content-type': 'application/json', 'prefer': 'return=minimal'},
          )
          urllib.request.urlopen(patch, timeout=60).read()

          verified = get_rows({
              'select': 'id,status,progress,stage,github_pr_url',
              'id': f"eq.{row['id']}",
              'limit': '1',
          })
          if not verified:
              raise SystemExit('The reconciled request could not be read back from Teacher Upload Manager')
          result = verified[0]
          if result.get('status') != 'completed' or int(result.get('progress') or 0) != 100 or result.get('github_pr_url') != pr['url']:
              raise SystemExit(f'Post-update Manager verification failed: {result}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"request_id={row['id']}\n")
              handle.write(f"previous_status={previous_status}\n")
              handle.write(f"pr_url={pr['url']}\n")
              handle.write(f"match_mode={match_mode}\n")
              handle.write(f"matched_sha={row.get('sha256') or ''}\n")
              handle.write(f"filename={row.get('original_filename') or ''}\n")
          print(
              f"Reconciled IB Unit 1 Manager request {row['id']} from {previous_status} to completed; "
              f"match={match_mode}; sha={row.get('sha256')}; file={row.get('original_filename')}"
          )
          PY

      - name: Record successful reconciliation
        env:
          REQUEST_ID: ${{ steps.reconcile.outputs.request_id }}
          PREVIOUS_STATUS: ${{ steps.reconcile.outputs.previous_status }}
          MATCH_MODE: ${{ steps.reconcile.outputs.match_mode }}
          MATCHED_SHA: ${{ steps.reconcile.outputs.matched_sha }}
          FILENAME: ${{ steps.reconcile.outputs.filename }}
        run: |
          gh pr comment 79 --repo "$GITHUB_REPOSITORY" --body "Teacher Upload Manager reconciliation completed. Request \`$REQUEST_ID\` (\`$FILENAME\`) moved from \`$PREVIOUS_STATUS\` to \`completed\`, verified at 100%, and linked to this merged release. Match mode: \`$MATCH_MODE\`; stored SHA-256: \`$MATCHED_SHA\`."

      - name: Record reconciliation failure
        if: failure()
        run: |
          gh pr comment 79 --repo "$GITHUB_REPOSITORY" --body "Teacher Upload Manager reconciliation did not complete. Protected workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Summary
        if: always()
        run: |
          echo "Request: ${{ steps.reconcile.outputs.request_id }}"
          echo "Previous status: ${{ steps.reconcile.outputs.previous_status }}"
          echo "Match mode: ${{ steps.reconcile.outputs.match_mode }}"
          echo "Stored SHA: ${{ steps.reconcile.outputs.matched_sha }}"
          echo "Release: ${{ steps.reconcile.outputs.pr_url }}"

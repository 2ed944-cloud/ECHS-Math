name: Process Teacher Uploads

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      request_id:
        description: "Optional teacher_upload_requests UUID; leave blank for the oldest queued or recoverable request"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: teacher-upload-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REQUEST_ID: ${{ inputs.request_id || '' }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm protected processor secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing repository/environment secret: $name" >&2
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate processor source
        run: |
          python -m py_compile tools/process_teacher_upload_request.py
          python -m py_compile tools/process_teacher_upload_request_fast.py
          python -m py_compile tools/upload_private_bank_package.py
          python -m py_compile tools/upload_private_bank_package_fast.py

      - name: Reconcile existing course release pull request
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request
          from datetime import datetime, timezone

          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          requested = os.environ.get('REQUEST_ID', '').strip()
          select = 'id,status,upload_kind,github_pr_url'
          if requested:
              query = urllib.parse.urlencode({'select': select, 'id': f'eq.{requested}', 'limit': '1'}, safe=',')
          else:
              query = urllib.parse.urlencode({
                  'select': select,
                  'status': 'eq.processing',
                  'upload_kind': 'eq.course-release',
                  'order': 'created_at.asc',
                  'limit': '1',
              }, safe=',')
          req = urllib.request.Request(
              f'{base}/rest/v1/teacher_upload_requests?{query}',
              headers={'apikey': key, 'authorization': f'Bearer {key}'},
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              rows = json.load(response)
          output = os.environ['GITHUB_OUTPUT']
          if not rows or rows[0].get('upload_kind') != 'course-release':
              with open(output, 'a', encoding='utf-8') as handle:
                  handle.write('reconciled=false\n')
              raise SystemExit(0)

          row = rows[0]
          branch = f"teacher-release/{row['id']}"
          command = ['gh', 'pr', 'list', '--head', branch, '--state', 'all', '--limit', '1', '--json', 'url,state,mergedAt']
          result = subprocess.run(command, check=True, text=True, capture_output=True)
          prs = json.loads(result.stdout or '[]')
          if not prs:
              with open(output, 'a', encoding='utf-8') as handle:
                  handle.write('reconciled=false\n')
              raise SystemExit(0)

          pr = prs[0]
          merged = bool(pr.get('mergedAt'))
          values = {
              'status': 'completed' if merged else 'pr-opened',
              'progress': 100 if merged else 92,
              'stage': 'Course release merged and published' if merged else 'Pull request opened · awaiting review and merge',
              'github_pr_url': pr['url'],
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'error_message': None,
          }
          if merged:
              values['completed_at'] = datetime.now(timezone.utc).isoformat()
          patch_query = urllib.parse.urlencode({'id': f"eq.{row['id']}"})
          body = json.dumps(values).encode()
          patch = urllib.request.Request(
              f'{base}/rest/v1/teacher_upload_requests?{patch_query}', data=body, method='PATCH',
              headers={'apikey': key, 'authorization': f'Bearer {key}', 'content-type': 'application/json', 'prefer': 'return=minimal'},
          )
          urllib.request.urlopen(patch, timeout=60).read()
          with open(output, 'a', encoding='utf-8') as handle:
              handle.write('reconciled=true\n')
              handle.write(f"request_id={row['id']}\n")
              handle.write(f"pr_url={pr['url']}\n")
              handle.write(f"merged={'true' if merged else 'false'}\n")
          print(f"Reconciled {row['id']} from {pr['url']} · merged={merged}")
          PY

      - name: Process oldest queued request
        id: processor
        if: steps.reconcile.outputs.reconciled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "$REQUEST_ID" ]; then args+=(--request-id "$REQUEST_ID"); fi
          python -u tools/process_teacher_upload_request_fast.py "${args[@]}"

      - name: Stop when queue is empty
        if: steps.reconcile.outputs.reconciled != 'true' && steps.processor.outputs.found != 'true'
        run: echo "No queued teacher uploads."

      - name: Validate generated course release
        if: steps.processor.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed_html="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -E '^lessons/.+\.html$' || true)"
          changed_js="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -E '^data/ap-precalculus-unit-[0-9]+-update\.js$' || true)"
          if [ -z "$changed_html" ]; then
            echo "Course release produced no lesson HTML files" >&2
            git status --short
            exit 1
          fi
          if [ -z "$changed_js" ]; then
            echo "Course release produced no portal update file" >&2
            git status --short
            exit 1
          fi
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            grep -qi '<html' "$file"
            grep -qi '</html>' "$file"
          done <<< "$changed_html"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            node --check "$file"
          done <<< "$changed_js"

      - name: Create release branch and pull request
        id: pr
        if: steps.processor.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          request="${{ steps.processor.outputs.request_id }}"
          branch="teacher-release/${request}"
          git config user.name "ECHS Upload Manager"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$branch"
          git add lessons data index.html
          git commit -m "${{ steps.processor.outputs.pr_title }}"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" --title "${{ steps.processor.outputs.pr_title }}" --body "Created automatically by Teacher Upload Manager.\n\nThe uploaded ZIP was kept private, verified by SHA-256, checked for unsafe paths, and converted into a reviewable course release.\n\nUpload request: \`${request}\`.\n\nThis pull request is not merged automatically.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record pull request in upload queue
        if: steps.processor.outputs.changed == 'true' && steps.pr.outputs.url != ''
        shell: bash
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          UPLOAD_REQUEST_ID: ${{ steps.processor.outputs.request_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          url=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          rid=os.environ['UPLOAD_REQUEST_ID']
          body=json.dumps({'status':'pr-opened','progress':92,'stage':'Pull request opened · awaiting review and merge','github_pr_url':os.environ['PR_URL']}).encode()
          query=urllib.parse.urlencode({'id':f'eq.{rid}'})
          request=urllib.request.Request(f'{url}/rest/v1/teacher_upload_requests?{query}',data=body,method='PATCH',headers={'apikey':key,'authorization':f'Bearer {key}','content-type':'application/json','prefer':'return=minimal'})
          urllib.request.urlopen(request,timeout=60).read()
          PY

      - name: Summary
        if: always()
        run: |
          echo "Reconciled existing release: ${{ steps.reconcile.outputs.reconciled }}"
          echo "Reconciled PR: ${{ steps.reconcile.outputs.pr_url }}"
          echo "Found request: ${{ steps.processor.outputs.found }}"
          echo "Kind: ${{ steps.processor.outputs.kind }}"
          echo "Repository changes: ${{ steps.processor.outputs.changed }}"
          echo "Pull request: ${{ steps.pr.outputs.url }}"

name: IB AI Unit 2 V3 QA

on:
  pull_request:
    paths:
      - "index.html"
      - "sw.js"
      - "data/ib-math-ai-unit-2-**"
      - "lessons/ib-math-ai/unit-2/**"
      - "tools/build_ib_ai_unit2_v3.py"
      - "tools/validate_ib_ai_unit2_v3.py"
      - "tools/test_ib_ai_unit2_v3_chromium.mjs"
      - ".github/workflows/ib-ai-unit2-v3-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact release structure and assessment data
        run: python3 tools/validate_ib_ai_unit2_v3.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium driver
        run: npm install --no-save --no-package-lock playwright-core@1.54.1
      - name: Start local platform
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ib-u2-v3-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ib-u2-v3-server.log
          exit 1
      - name: Check every Learn screen and route in Chromium
        env:
          ECHS_PREVIEW_URL: http://127.0.0.1:4173
          ECHS_PREVIEW_OUTPUT: artifacts/ib-ai-unit2-v3-chromium
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/test_ib_ai_unit2_v3_chromium.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ib-ai-unit2-v3-chromium-${{ github.run_number }}
          path: artifacts/ib-ai-unit2-v3-chromium
          if-no-files-found: error
          retention-days: 14

name: Versioned lesson content contracts
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/lesson-api/**"
      - "schemas/**"
      - "js/lesson-runtime/**"
      - "tools/lesson-runtime/**"
      - "tools/test_lesson_content_v2*"
      - "tools/test_lesson_persistence*"
      - "tools/lesson_persistence_rpc_fixture.py"
      - ".github/workflows/lesson-content-v2.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/lesson-api/**"
      - "schemas/**"
      - "js/lesson-runtime/**"
      - "tools/lesson-runtime/**"
      - "tools/test_lesson_content_v2*"
      - "tools/test_lesson_persistence*"
      - "tools/lesson_persistence_rpc_fixture.py"
      - ".github/workflows/lesson-content-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lesson-content-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canonical-and-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Install exact schema and math dependencies
        run: npx --yes pnpm@11.19.0 --dir tools/lesson-runtime install --frozen-lockfile --ignore-scripts
      - name: Verify both generated validators and preserved v1 contracts
        run: |
          node tools/lesson-runtime/build-validator.mjs --check
          node tools/lesson-runtime/build-server-validator.mjs --check
          node tools/lesson-runtime/test-schema.mjs
          node tools/lesson-runtime/test-server-document.mjs
          node tools/test_lesson_persistence_api.mjs
      - name: Verify v2 AST, safe content, publication and deployment handshake
        run: |
          node tools/lesson-runtime/test-math-expression.mjs
          node tools/lesson-runtime/test-content-v2.mjs
      - name: Check actual frozen deployable function
        run: deno check --frozen --config supabase/functions/lesson-api/deno.json supabase/functions/lesson-api/index.ts
  postgres15:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: echs_lesson_test_content_v2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d echs_lesson_test_content_v2_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ECHS_LESSON_TEST_DSN: postgresql://postgres:isolated-fixture-only@127.0.0.1:5432/echs_lesson_test_content_v2_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned database test driver
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Install exact HTTP contract math dependency
        run: npx --yes pnpm@11.19.0 --dir tools/lesson-runtime install --frozen-lockfile --ignore-scripts
      - name: Preserve all 235 real database checks on the original 22-migration chain
        run: python tools/test_lesson_persistence_database.py --report reports/lesson-persistence-database.json
      - name: Preserve all eight original HTTP and real SQL groups
        run: node tools/test_lesson_persistence_e2e.mjs
      - name: Apply migration 23 and execute content, grants, snapshots and authorization checks
        run: python tools/test_lesson_content_v2_database.py --baseline-report reports/lesson-persistence-database.json --report reports/lesson-content-v2-database.json
      - name: Exercise actual HTTP and pinned mathematics through actual v2 SQL contracts
        run: node tools/test_lesson_content_v2_e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-content-v2-database-results
          path: |
            reports/lesson-persistence-*.json
            reports/lesson-content-v2-*.json
          if-no-files-found: warn

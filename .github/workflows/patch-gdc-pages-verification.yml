name: Patch Unit 1 GDC Pages verification

on:
  push:
    branches:
      - agent/fix-unit1-gdc-pages-verification
    paths:
      - '.github/workflows/patch-gdc-pages-verification.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-unit1-gdc-pages-verification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update live GDC verification contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-pages.yml')
          text = p.read_text(encoding='utf-8')
          old = '''              "lesson-1.4-ti84-finance-classroom-v6-3.js" in text["finance"],
              "lesson-1.4-ti84-finance-inline-v6-3.js" in text["finance"],
              "lesson-1.6-multiplicity-2-fix-v6-3-3.js" in text["technology"],
              "lesson-1.6-ti84-inline-dock-v6-3.js" in text["technology"],'''
          new = '''              "unit-1-gdc-integration-v7.css" in text["finance"],
              "unit-1-gdc-integration-v7.js" in text["finance"],
              "lesson-1.4-ti84-finance-classroom-v6-3.js" not in text["finance"],
              "lesson-1.4-ti84-finance-inline-v6-3.js" not in text["finance"],
              "lesson-1.6-multiplicity-2-fix-v6-3-3.js" in text["technology"],
              "unit-1-gdc-integration-v7.css" in text["technology"],
              "unit-1-gdc-integration-v7.js" in text["technology"],
              "lesson-1.6-ti84-classroom-runtime-v6-2-1.js" not in text["technology"],
              "lesson-1.6-ti84-inline-dock-v6-3.js" not in text["technology"],'''
          if old not in text:
              raise SystemExit('Expected legacy TI-84 live verification block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check -- .github/workflows/deploy-pages.yml
          grep -n "unit-1-gdc-integration-v7" .github/workflows/deploy-pages.yml
      - name: Commit verification update
        run: |
          git config user.name "ECHS Math Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/deploy-pages.yml
          git commit -m "Verify local Unit 1 GDC assets on Pages"
          git push origin HEAD:agent/fix-unit1-gdc-pages-verification

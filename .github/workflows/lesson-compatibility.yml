name: Legacy lesson compatibility contracts

on:
  pull_request:
    paths:
      - "js/lesson-runtime/**"
      - "schemas/**"
      - "tools/lesson-runtime/**"
      - "tools/lesson-compatibility/**"
      - "lessons/ap-calculus/1-1-introducing-calculus.html"
      - "lessons/ap-calculus/unit-1/1-1-can-change-occur-at-an-instant.html"
      - "lessons/ap-calculus/unit-1/assets/lesson-1-1*"
      - "lessons/ib-math-ai/unit-1/data/**"
      - "lessons/ib-math-ai/unit-1/assets/css/katex.css"
      - "lessons/ib-math-ai/unit-1/assets/js/katex-global.js"
      - "lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.3_geometric_sequences_ECHS.html"
      - "docs/codex/LEGACY_LESSON_COMPATIBILITY.md"
      - ".github/workflows/lesson-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "js/lesson-runtime/**"
      - "schemas/**"
      - "tools/lesson-runtime/**"
      - "tools/lesson-compatibility/**"
      - "lessons/ap-calculus/1-1-introducing-calculus.html"
      - "lessons/ap-calculus/unit-1/1-1-can-change-occur-at-an-instant.html"
      - "lessons/ap-calculus/unit-1/assets/lesson-1-1*"
      - "lessons/ib-math-ai/unit-1/data/**"
      - "lessons/ib-math-ai/unit-1/assets/css/katex.css"
      - "lessons/ib-math-ai/unit-1/assets/js/katex-global.js"
      - "lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.3_geometric_sequences_ECHS.html"
      - "docs/codex/LEGACY_LESSON_COMPATIBILITY.md"
      - ".github/workflows/lesson-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-compatibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned schema and inert-parser test dependencies
        run: |
          npx --yes pnpm@11.19.0 --dir tools/lesson-runtime install --frozen-lockfile --ignore-scripts
          npx --yes pnpm@11.19.0 --dir tools/lesson-compatibility install --frozen-lockfile --ignore-scripts
      - name: Check canonical schema generated output
        run: node tools/lesson-runtime/build-validator.mjs --check
      - name: Verify exact pinned legacy composition and generated metadata
        run: node tools/lesson-compatibility/build-fixtures.mjs --source-root . --check
      - name: Validate read-only adapters and exact rollback behavior
        run: node tools/lesson-compatibility/test-compatibility.mjs

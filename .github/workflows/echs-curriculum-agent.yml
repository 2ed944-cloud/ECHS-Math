name: ECHS Curriculum Agent

on:
  pull_request:
    paths:
      - "curriculum/**"
      - "data/**"
      - "lessons/**"
      - "tools/echs_curriculum_agent.py"
      - ".github/workflows/echs-curriculum-agent.yml"
  push:
    branches: [main]
    paths:
      - "curriculum/**"
      - "data/**"
      - "lessons/**"
      - "tools/echs_curriculum_agent.py"
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      require_complete:
        description: "Fail until every mapped Grade 9/10 lesson is fully ready"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: echs-curriculum-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run curriculum integrity and readiness audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_echs_curriculum_authoritative_scope.py
          args=()
          if [[ "${{ inputs.require_complete || 'false' }}" == "true" ]]; then
            args+=(--require-complete)
          fi
          python tools/echs_curriculum_agent.py "${args[@]}"

      - name: Upload curriculum report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echs-curriculum-agent-report
          path: |
            reports/echs-curriculum-agent.md
            reports/echs-curriculum-agent.json
          retention-days: 30

      - name: Create or refresh the completion issue
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- echs-curriculum-agent -->';
            const body = marker + '\n' + fs.readFileSync('reports/echs-curriculum-agent.md', 'utf8');
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue =>
              !issue.pull_request && issue.title === 'ECHS curriculum completion queue'
            );
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: 'ECHS curriculum completion queue',
                body
              });
            }

      - name: Enforce structural integrity
        if: steps.audit.outcome == 'failure'
        run: exit 1

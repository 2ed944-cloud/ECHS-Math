name: Install IB AI Unit 6 Lesson 6.1

on:
  push:
    branches:
      - agent/ib-ai-6-1-technology-fluency
    paths:
      - .github/workflows/install-ib-unit6-lesson61.yml
      - .github/ib-unit6-lesson61.tar.xz.b64.part-*

permissions:
  contents: write

concurrency:
  group: install-ib-unit6-lesson61
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract audited lesson payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ib-unit6-lesson61.tar.xz.b64.part-* | base64 --decode > /tmp/ib-unit6-lesson61.tar.xz
          tar -xJf /tmp/ib-unit6-lesson61.tar.xz -C .
          rm -f /tmp/ib-unit6-lesson61.tar.xz

      - name: Reuse the canonical IB lesson engine and math assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lessons/ib-math-ai/unit-6/assets/css lessons/ib-math-ai/unit-6/assets/js
          cp lessons/ib-math-ai/unit-2/assets/css/katex.css lessons/ib-math-ai/unit-6/assets/css/katex.css
          cp lessons/ib-math-ai/unit-2/assets/css/theme.css lessons/ib-math-ai/unit-6/assets/css/theme.css
          cp lessons/ib-math-ai/unit-2/assets/favicon.svg lessons/ib-math-ai/unit-6/assets/favicon.svg
          cp lessons/ib-math-ai/unit-2/assets/js/katex-global.js lessons/ib-math-ai/unit-6/assets/js/katex-global.js
          cp lessons/ib-math-ai/unit-2/assets/js/engine.js lessons/ib-math-ai/unit-6/assets/js/engine.js

      - name: Register Unit 6 in the portal and refresh service-worker routing
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          unit5 = '<script src="data/ib-math-ai-unit-5-update.js?v=20260803-unit5-v2"></script>'
          unit6 = '<script src="data/ib-math-ai-unit-6-update.js?v=20260808-unit6-v1"></script>'
          if unit6 not in text:
              if text.count(unit5) != 1:
                  raise SystemExit("Could not identify the canonical Unit 5 portal script exactly once")
              text = text.replace(unit5, unit5 + "\n" + unit6)
          if text.count(unit6) != 1 or text.index(unit6) > text.index('<script src="js/portal.js'):
              raise SystemExit("Unit 6 portal updater is missing, duplicated, or loaded after portal.js")
          index.write_text(text, encoding="utf-8")

          sw = Path("sw.js")
          text = sw.read_text(encoding="utf-8")
          old = 'const FRESH_COURSE_ASSET = /\\/data\\/ib-math-ai-unit-[12]-update\\.js$/i;'
          new = 'const FRESH_COURSE_ASSET = /\\/data\\/ib-math-ai-unit-[126]-update\\.js$/i;'
          if new not in text:
              if old not in text:
                  raise SystemExit("Could not identify the service-worker course-asset rule")
              text = text.replace(old, new)
          marker = 'ib-ai-u6-61-v1'
          if marker not in text:
              first, rest = text.split('";\n', 1)
              if not first.startswith('const VERSION = "'):
                  raise SystemExit("Could not identify the service-worker version")
              text = first + '-' + marker + '";\n' + rest
          sw.write_text(text, encoding="utf-8")

      - name: Validate JavaScript, lesson structure, portal registration, and mathematics
        shell: bash
        run: |
          set -euo pipefail
          find lessons/ib-math-ai/unit-6 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check data/ib-math-ai-unit-6-update.js
          node tools/test_ib_unit6_release.mjs
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          for file in [
              Path('index.html'),
              Path('lessons/ib-math-ai/unit-6/START_HERE.html'),
              Path('lessons/ib-math-ai/unit-6/lessons/IB_AI_SL_6.1_technology_fluency_routines_ECHS.html')
          ]:
              parser = HTMLParser()
              parser.feed(file.read_text(encoding='utf-8'))
              parser.close()
          print('HTML parsing checks passed.')
          PY

      - name: Commit the completed lesson build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js data/ib-math-ai-unit-6-update.js lessons/ib-math-ai/unit-6 tools/test_ib_unit6_release.mjs
          if git diff --cached --quiet; then
            echo "No lesson changes were produced."
            exit 0
          fi
          git commit -m "feat(ib-ai): add Unit 6 lesson 6.1 technology fluency"
          git push origin "HEAD:${GITHUB_REF_NAME}"

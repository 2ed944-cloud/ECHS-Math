name: IB Private Bank Catalogue Repair

on:
  pull_request:
    paths:
      - ".github/workflows/ib-private-bank-catalog-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Preserve questions and remove only invalid IB catalogue links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import datetime
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers={'apikey':key,'authorization':f'Bearer {key}','content-type':'application/json'}
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()

          catalog=json.load(open('data/ib-math-ai-lesson-catalog.json',encoding='utf-8'))
          allowed={}
          for unit in catalog.get('units',[]):
              unit_number=int(unit['unit'])
              for lesson in unit.get('lessons',[]):
                  record={'unit':unit_number,'skill_key':str(lesson.get('skill_id') or ''),'lesson_title':str(lesson.get('title') or '')}
                  allowed[str(lesson['lesson_key'])]=record
                  number=str(lesson.get('number') or '')
                  if number and number!='0':allowed[number]=record
                  for delivery in lesson.get('delivery_lesson_numbers',[]):allowed[str(delivery)]=record

          def request_json(url,*,method='GET',body=None,extra_headers=None,retries=6):
              data=None if body is None else json.dumps(body,ensure_ascii=False,separators=(',',':')).encode()
              last=None
              for attempt in range(retries):
                  try:
                      request=urllib.request.Request(url,headers={**headers,**(extra_headers or {})},method=method,data=data)
                      with urllib.request.urlopen(request,timeout=180) as response:
                          raw=response.read()
                          return json.loads(raw or b'null')
                  except urllib.error.HTTPError as error:
                      last=error
                      if error.code not in (408,425,429,500,502,503,504) or attempt+1>=retries:
                          detail=error.read().decode(errors='replace')[:1000]
                          raise RuntimeError(f'HTTP {error.code}: {detail}') from error
                  except (urllib.error.URLError,TimeoutError) as error:
                      last=error
                      if attempt+1>=retries:raise
                  time.sleep(1.5*(attempt+1))
              raise last

          def mapping_valid(mapping):
              if str((mapping or {}).get('course') or '')!='ib-math-ai':return True
              lesson=str((mapping or {}).get('lesson_key') or '')
              expected=allowed.get(lesson)
              if not expected:return False
              if int((mapping or {}).get('unit') if (mapping or {}).get('unit') is not None else -999)!=expected['unit']:return False
              if str((mapping or {}).get('skill_key') or '')!=expected['skill_key']:return False
              return (mapping or {}).get('mapping_verified') is True

          def list_ib_metadata(page_size=200):
              rows=[];offset=0
              while True:
                  query=urllib.parse.urlencode({'select':'organization_id,question_id,bank_code,course_mappings,course_keys,lesson_keys,skill_candidates,mapping_verified,student_visible','order':'organization_id.asc,question_id.asc'},safe=',.*()[]:{}"')
                  page=request_json(f'{base}/rest/v1/private_bank_questions?{query}',extra_headers={'range':f'{offset}-{offset+page_size-1}'})
                  for row in page:
                      if any(str((mapping or {}).get('course') or '')=='ib-math-ai' for mapping in (row.get('course_mappings') or [])):
                          rows.append(row)
                  if len(page)<page_size:return rows
                  offset+=len(page)

          metadata=list_ib_metadata()
          invalid=[]
          for row in metadata:
              bad=[mapping for mapping in (row.get('course_mappings') or []) if str((mapping or {}).get('course') or '')=='ib-math-ai' and not mapping_valid(mapping)]
              if bad:invalid.append((row,bad))

          old_lessons=collections.Counter();preserved_other_course=0;updated=0
          for meta,bad in invalid:
              organization_id=str(meta['organization_id']);question_id=str(meta['question_id'])
              query=urllib.parse.urlencode({'select':'organization_id,question_id,course_mappings,student_visible,payload','organization_id':f'eq.{organization_id}','question_id':f'eq.{question_id}'},safe=',.*()[]:{}"')
              details=request_json(f'{base}/rest/v1/private_bank_questions?{query}')
              if len(details)!=1:raise SystemExit(f'Could not resolve one private question row for repair {organization_id}:{question_id}')
              row=details[0];mappings=list(row.get('course_mappings') or [])
              invalid_ib=[mapping for mapping in mappings if str((mapping or {}).get('course') or '')=='ib-math-ai' and not mapping_valid(mapping)]
              if not invalid_ib:continue
              for mapping in invalid_ib:old_lessons[str((mapping or {}).get('lesson_key') or 'missing')]+=1
              remaining=[mapping for mapping in mappings if mapping not in invalid_ib]
              if remaining:preserved_other_course+=1
              course_keys=sorted({str(mapping.get('course') or '') for mapping in remaining if str(mapping.get('course') or '')})
              lesson_keys=sorted({f"{str(mapping.get('course') or '')}:{str(mapping.get('lesson_key') or '')}" for mapping in remaining if str(mapping.get('course') or '') and str(mapping.get('lesson_key') or '')})
              skill_candidates=sorted({str(mapping.get('skill_key') or '') for mapping in remaining if str(mapping.get('skill_key') or '')})
              verified=bool(remaining) and all(mapping.get('mapping_verified') is True for mapping in remaining)

              payload=row.get('payload') if isinstance(row.get('payload'),dict) else {};payload=dict(payload);payload['course_mappings']=remaining
              metadata_payload=payload.get('metadata') if isinstance(payload.get('metadata'),dict) else {};metadata_payload=dict(metadata_payload)
              metadata_payload['student_ready']=bool(remaining and verified and row.get('student_visible') is True)
              metadata_payload['ib_catalog_mapping_review']={'status':'withheld-non-catalog-mapping','review_required':True,'withheld_at':now,'reason':'The supplied IB mapping does not resolve to the official platform lesson catalogue. The question and provenance are preserved privately for source-level remapping.','original_ib_mappings':invalid_ib}
              payload['metadata']=metadata_payload

              classification=payload.get('classification') if isinstance(payload.get('classification'),dict) else {};classification=dict(classification)
              valid_ib=next((mapping for mapping in remaining if str(mapping.get('course') or '')=='ib-math-ai'),None)
              if valid_ib:classification.update({'ib_unit':valid_ib.get('unit'),'ib_lesson':valid_ib.get('lesson_key'),'ib_lesson_title':valid_ib.get('lesson_title')})
              else:
                  for field in ('ib_unit','ib_lesson','ib_lesson_title'):classification.pop(field,None)
                  if str(classification.get('course_scope') or '')=='ib-math-ai':
                      for field in ('course_scope','primary_unit','primary_topic','primary_topic_title','topic','topic_title'):classification.pop(field,None)
              payload['classification']=classification

              canonical=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':'))
              patch={'course_mappings':remaining,'course_keys':course_keys,'lesson_keys':lesson_keys,'skill_candidates':skill_candidates,'mapping_verified':verified,'student_visible':bool(row.get('student_visible') is True and remaining and verified),'payload':payload,'payload_sha256':hashlib.sha256(canonical.encode()).hexdigest(),'updated_at':now}
              patch_query=urllib.parse.urlencode({'organization_id':f'eq.{organization_id}','question_id':f'eq.{question_id}'},safe=',.*()[]:{}"')
              request_json(f'{base}/rest/v1/private_bank_questions?{patch_query}',method='PATCH',body=patch,extra_headers={'prefer':'return=minimal'})
              updated+=1

          remaining_invalid=[]
          for row in list_ib_metadata():
              for mapping in (row.get('course_mappings') or []):
                  if str((mapping or {}).get('course') or '')=='ib-math-ai' and not mapping_valid(mapping):remaining_invalid.append(str((mapping or {}).get('lesson_key') or 'missing'))

          result={'catalog_keys':len(allowed),'candidate_rows':len(metadata),'questions_withheld_for_source_review':updated,'questions_preserving_other_course_mappings':preserved_other_course,'original_invalid_lesson_counts':dict(sorted(old_lessons.items())),'remaining_invalid_ib_mappings':len(remaining_invalid)}
          print('IB_PRIVATE_BANK_CATALOG_REPAIR=')
          print(json.dumps(result,indent=2,sort_keys=True))
          if remaining_invalid:raise SystemExit(f'Non-catalog IB mappings remain: {collections.Counter(remaining_invalid)}')
          PY

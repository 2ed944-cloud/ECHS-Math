name: IB AI 1.6 Definitive QA

on:
  pull_request:
    paths:
      - "lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.6_technology_equations_ECHS.html"
      - "lessons/ib-math-ai/unit-1/data/lesson-1.6-technology-v6-*.js"
      - "lessons/ib-math-ai/unit-1/assets/css/lesson-1.6-technology-equations-v6.css"
      - "tools/test_ib_ai_1_6_definitive_v6.mjs"
      - "tools/browser_qa_ib_ai_1_6_v6.mjs"
      - ".github/workflows/ib-ai-1-6-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release JavaScript syntax
        run: |
          for file in lessons/ib-math-ai/unit-1/data/lesson-1.6-technology-v6-*.js tools/test_ib_ai_1_6_definitive_v6.mjs; do
            node --check "$file"
          done

      - name: Validate structure, mathematics and assessment contracts
        run: node tools/test_ib_ai_1_6_definitive_v6.mjs

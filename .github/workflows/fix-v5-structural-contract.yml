name: Fix V5 Structural UI Contracts

on:
  push:
    paths:
      - '.github/workflows/fix-v5-structural-contract.yml'

permissions:
  contents: write

jobs:
  fix-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace copy-dependent UI checks with structural checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          contract = Path('tools/test_learning_access_contract.py')
          text = contract.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    require\(practice_shell, \[\n.*?\n    \], "Practice shell", errors\)',
              flags=re.S,
          )
          replacement = '''    require(practice_shell, [
        'data-require-account="student teacher admin"', "Learn → Practise → Master",
        'id="practiceRoleBadge"', 'id="practiceBuilder"', 'id="builderControls"',
        'id="course"', 'id="bank"', 'id="scope"', 'id="bundle"', 'id="mode"', 'id="start"',
        "routeSteps", "builderCompactSummary", "Adjust filters",
        "js/portal-access.js", "practice-builder-compact.css", "practice-scope-access.css",
        "practice-course-isolation.js", "mapped-private-bank-practice.js", "mapped-practice.js",
        "practice-single-bank.js", "practice-builder.js",
    ], "Practice shell", errors)'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace practice-shell contract block exactly once')
          contract.write_text(text, encoding='utf-8')

          validator = Path('tools/validate_pages_artifact.py')
          v = validator.read_text(encoding='utf-8')
          old = '"question-bank/teacher.html": ["Teaching Command Center", "studentRows", "teacher-cloud.js"],'
          new = '"question-bank/teacher.html": [\'data-premium-page="teacher"\', "studentRows", "teacher-cloud.js"],'
          if old not in v:
              raise SystemExit('Teacher artifact marker not found')
          v = v.replace(old, new, 1)
          validator.write_text(v, encoding='utf-8')

          # Remove temporary invisible compatibility comments; tests no longer depend on UI wording.
          for rel, marker in [
              ('question-bank/practice.html', r'\s*<!-- learning-access-contract: Course-safe practice \| Verified question bank \| No cross-course mixing \| Exact lesson mapping -->\s*'),
              ('question-bank/teacher.html', r'\s*<!-- pages-artifact-contract: Teaching Command Center -->\s*'),
          ]:
              p = Path(rel)
              body = p.read_text(encoding='utf-8')
              body = re.sub(marker, '\n', body)
              p.write_text(body, encoding='utf-8')

          subprocess.run(['python', 'tools/test_learning_access_contract.py', '.'], check=True)

          # Confirm user-facing V5 resources remain attached.
          for rel in ['index.html','question-bank/student.html','question-bank/teacher.html','question-bank/practice.html','question-bank/mistakes.html','question-bank/exam.html']:
              body = Path(rel).read_text(encoding='utf-8')
              if 'echs-design-system-v5.css' not in body:
                  raise SystemExit(f'Missing Design System V5 in {rel}')
              if 'visible-copy-guard-v5.js' not in body:
                  raise SystemExit(f'Missing copy guard in {rel}')

          # Re-run a rendered-copy audit, excluding scripts/styles/comments and mathematical question content.
          banned = [
              'production environment','production build','release candidate','staging environment',
              'deployment','debugging','internal build','build id','backend','frontend','server-side',
              'supabase','localhost','api endpoint','course-safe practice','verified question bank',
              'verified bank','no cross-course mixing','exact lesson mapping','mapped pathway',
              'mapped targets','withheld questions'
          ]
          findings=[]
          for rel in ['index.html','question-bank/student.html','question-bank/teacher.html','question-bank/practice.html','question-bank/mistakes.html','question-bank/exam.html']:
              raw=Path(rel).read_text(encoding='utf-8')
              raw=re.sub(r'<!--.*?-->',' ',raw,flags=re.S)
              raw=re.sub(r'<head\b[^>]*>.*?</head>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<style\b[^>]*>.*?</style>',' ',raw,flags=re.I|re.S)
              visible=re.sub(r'<[^>]+>',' ',raw)
              visible=re.sub(r'\s+',' ',visible).lower()
              for term in banned:
                  if term in visible:
                      findings.append(f'{rel}: {term}')
          if findings:
              raise SystemExit('Visible copy audit failed: ' + '; '.join(findings))

          Path('docs/UI_COPY_AUDIT_V5.md').write_text(
              '# ECHS UI Copy Audit V5\n\n'
              'Scope: public portal and learner/teacher application chrome. Lesson and mathematical question content is excluded.\n\n'
              'Design System V5 is linked across the core school workspaces.\n\n'
              'Visible UI terminology audit: PASS. No restricted implementation, release, or internal-routing phrases were found.\n\n'
              'Deployment validation now uses structural UI contracts rather than user-facing wording.\n',
              encoding='utf-8'
          )
          print('Structural UI contract: PASS')
          print('Visible copy audit: PASS')
          PY
      - name: Commit structural contract fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ECHS Design System"
          git config user.email "actions@users.noreply.github.com"
          git add tools/test_learning_access_contract.py tools/validate_pages_artifact.py question-bank/practice.html question-bank/teacher.html docs/UI_COPY_AUDIT_V5.md
          git commit -m "Use structural contracts for ECHS design v5"
          git push

name: Revalidate GDC Classroom Training v8

on:
  push:
    branches: [agent/gdc-classroom-training-v8]
    paths: ['.github/workflows/gdc-classroom-training-v8-rerun.yml']

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gdc-classroom-training-v8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire training assets
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('lessons/ib-math-ai/unit-1')
          names=['IB_AI_SL_1.2_arithmetic_sequences_ECHS.html','IB_AI_SL_1.3_geometric_sequences_ECHS.html','IB_AI_SL_1.4_financial_models_ECHS.html','IB_AI_SL_1.5_logarithms_ECHS.html','IB_AI_SL_1.6_technology_equations_ECHS.html']
          for name in names:
              p=root/'lessons'/name; t=p.read_text(encoding='utf-8')
              if 'unit-1-gdc-classroom-training-v8.css' not in t:
                  t=t.replace('  <link rel="stylesheet" href="../assets/css/unit-1-ti84-simulator-v7.css">\n','  <link rel="stylesheet" href="../assets/css/unit-1-ti84-simulator-v7.css">\n  <link rel="stylesheet" href="../assets/css/unit-1-gdc-classroom-training-v8.css">\n',1)
              if 'unit-1-gdc-classroom-training-v8.js' not in t:
                  t=t.replace('  <script src="../data/unit-1-ti84-simulator-v7.js" defer></script>\n','  <script src="../data/unit-1-ti84-simulator-v7.js" defer></script>\n  <script src="../data/unit-1-gdc-classroom-training-v8.js" defer></script>\n',1)
              p.write_text(t,encoding='utf-8',newline='\n')
          PY
      - name: Static contracts
        run: |
          node --check lessons/ib-math-ai/unit-1/data/unit-1-gdc-classroom-training-v8.js
          python - <<'PY'
          from pathlib import Path
          root=Path('lessons/ib-math-ai/unit-1')
          expected={'1.2':4,'1.3':5,'1.4':7,'1.5':5,'1.6':6}
          names={'1.2':'IB_AI_SL_1.2_arithmetic_sequences_ECHS.html','1.3':'IB_AI_SL_1.3_geometric_sequences_ECHS.html','1.4':'IB_AI_SL_1.4_financial_models_ECHS.html','1.5':'IB_AI_SL_1.5_logarithms_ECHS.html','1.6':'IB_AI_SL_1.6_technology_equations_ECHS.html'}
          for n,name in names.items():
              t=(root/'lessons'/name).read_text(encoding='utf-8')
              assert t.count('unit-1-gdc-classroom-training-v8.css')==1
              assert t.count('unit-1-gdc-classroom-training-v8.js')==1
          assert 'gdc-classroom-training-v8' not in (root/'lessons/IB_AI_SL_1.1_standard_form_ECHS.html').read_text(encoding='utf-8')
          print('Lesson wiring PASS')
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),base='lessons/ib-math-ai/unit-1/data/';
          const ext=fs.readFileSync(base+'unit-1-gdc-classroom-training-v8.js','utf8'), exp={'1.2':4,'1.3':5,'1.4':7,'1.5':5,'1.6':6};
          for(const n of Object.keys(exp)){
            const c={window:{LESSON_DATA:{lesson:{number:n}}},document:{body:{},addEventListener(){},querySelector(){return null}},MutationObserver:function(){this.observe=()=>{}},setTimeout(){}};vm.createContext(c);
            if(n==='1.4')vm.runInContext(fs.readFileSync(base+'lesson-1.4-ti84-finance-workflows-v6-3.js','utf8'),c);
            if(n==='1.6')vm.runInContext(fs.readFileSync(base+'lesson-1.6-ti84-classroom-workflows-v6-2-2.js','utf8'),c);
            vm.runInContext(ext,c); const m=c.window.LESSON_DATA.gdcClassroomTrainingV8;
            if(!m||m.workflowCount!==exp[n])throw new Error(`${n} count mismatch`);
            if(['1.4','1.6'].includes(n)&&!m.restoredLegacyTraining)throw new Error(`${n} legacy workflows missing`);
          }
          console.log('27 classroom workflows PASS');
          NODE
          curl -L --fail --silent --show-error --max-time 25 -o /dev/null https://ti84calc.com/ti84calc
          git diff --check
      - name: Chromium side-by-side QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node - <<'NODE'
          const {chromium}=require('playwright'),{spawn}=require('child_process');
          const server=spawn('python3',['-m','http.server','4173','--directory','.'],{stdio:'ignore'}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const files={'1.2':'IB_AI_SL_1.2_arithmetic_sequences_ECHS.html','1.3':'IB_AI_SL_1.3_geometric_sequences_ECHS.html','1.4':'IB_AI_SL_1.4_financial_models_ECHS.html','1.5':'IB_AI_SL_1.5_logarithms_ECHS.html','1.6':'IB_AI_SL_1.6_technology_equations_ECHS.html'}, exp={'1.2':4,'1.3':5,'1.4':7,'1.5':5,'1.6':6}, failures=[];
          (async()=>{await sleep(1000);const browser=await chromium.launch({headless:true});try{
            for(const [device,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]])for(const [n,file] of Object.entries(files)){
              const context=await browser.newContext({viewport}),page=await context.newPage();await page.route('https://ti84calc.com/**',r=>r.fulfill({status:200,contentType:'text/html',body:'<!doctype html><main>TI-84 fixture</main>'}));
              try{await page.goto(`http://127.0.0.1:4173/lessons/ib-math-ai/unit-1/lessons/${file}#learn`,{waitUntil:'networkidle'});await page.waitForSelector('.gdc-v7-launch',{timeout:12000});await page.locator('.gdc-v7-launch').focus();await page.keyboard.press('Enter');await page.waitForSelector('.gdc8-classroom',{timeout:8000});
                if(await page.locator('.gdc8-select option').count()!==exp[n])throw new Error('wrong classroom workflow count');
                if(await page.locator('.gdc8-ti-steps article').count()<2||await page.locator('.gdc8-keys kbd').count()<2)throw new Error('physical TI-84 route missing');
                await page.locator('.gdc8-select').selectOption(String(exp[n]-1));const reveal=page.locator('.gdc8-reveal-output');if(await reveal.count())await reveal.click();
                await page.locator('.gdc8-open-sim').evaluate(el=>el.click());await page.waitForSelector('#u1-ti84-simulator.is-open',{timeout:8000});await page.waitForTimeout(380);
                const l=await page.evaluate(()=>{const sim=document.querySelector('#u1-ti84-simulator').getBoundingClientRect(),app=document.querySelector('#app').getBoundingClientRect(),stage=document.querySelector('.stage')?.getBoundingClientRect(),bd=getComputedStyle(document.querySelector('.u1-ti84-sim-backdrop'));return{simLeft:sim.left,appRight:app.right,stageRight:stage?.right||0,stageWidth:stage?.width||0,blur:bd.backdropFilter||bd.webkitBackdropFilter,display:bd.display}});
                if(String(l.blur).includes('blur'))throw new Error('lesson is blurred');if(l.stageWidth<=0)throw new Error('slide hidden');if(device==='desktop'&&(l.appRight>l.simLeft+3||l.stageRight>l.simLeft+3))throw new Error(`overlap app=${l.appRight} stage=${l.stageRight} sim=${l.simLeft}`);if(device==='desktop'&&l.display!=='none')throw new Error('desktop backdrop visible');
                await page.keyboard.press('Escape');
              }catch(e){failures.push(`${device} ${n}: ${e.message}`)}finally{await context.close()}
            }
          }finally{await browser.close();server.kill('SIGTERM')}if(failures.length){console.error(failures.join('\n'));process.exit(1)}console.log('Chromium PASS: 10 lesson/device cases; no blur and desktop slide remains beside TI-84.');})();
          NODE
      - name: Commit wiring
        run: |
          git config user.name "ECHS Math Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lessons/ib-math-ai/unit-1/lessons
          git diff --cached --check
          git commit -m "Wire GDC classroom training into IB AI Unit 1"
          git push origin HEAD:agent/gdc-classroom-training-v8

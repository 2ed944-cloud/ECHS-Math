name: Apply V5.1 Student Mobile Containment

on:
  push:
    branches:
      - agent/echs-visual-refinement-v5-1
    paths:
      - '.github/workflows/echs-v51-student-mobile-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/echs-visual-refinement-v5-1
          fetch-depth: 0

      - name: Stack student timetable safely on small screens
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'V5.1 student mobile timetable containment' css/echs-design-system-v5-1.css; then
            cat >> css/echs-design-system-v5-1.css <<'CSS'

          /* V5.1 student mobile timetable containment */
          @media(max-width:860px){
            body.institutionBody[data-premium-page="student"]{
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              overflow-x:hidden!important;
            }
            body.institutionBody[data-premium-page="student"] .institutionShell,
            body.institutionBody[data-premium-page="student"] .institutionWorkspace,
            body.institutionBody[data-premium-page="student"] .institutionMain{
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              box-sizing:border-box!important;
              overflow-x:hidden!important;
            }
            body.institutionBody[data-premium-page="student"] .timetableCard,
            body.institutionBody[data-premium-page="student"] .timetableMount{
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              box-sizing:border-box!important;
              overflow:hidden!important;
            }
            body.institutionBody[data-premium-page="student"] .timetableWeek{
              display:grid!important;
              grid-template-columns:minmax(0,1fr)!important;
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              box-sizing:border-box!important;
              overflow:hidden!important;
              padding:10px!important;
              gap:10px!important;
              scroll-snap-type:none!important;
            }
            body.institutionBody[data-premium-page="student"] .timetableDay{
              display:block!important;
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              flex:none!important;
              box-sizing:border-box!important;
            }
            body.institutionBody[data-premium-page="student"] .timetableDayHead,
            body.institutionBody[data-premium-page="student"] .timetableEntries,
            body.institutionBody[data-premium-page="student"] .timetableEntry,
            body.institutionBody[data-premium-page="student"] .timetableEntryTime{
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              box-sizing:border-box!important;
            }
          }
          CSS
          fi

      - name: Validate core contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_learning_access_contract.py .
          python tools/validate_local_links.py .
          grep -q 'V5.1 student mobile timetable containment' css/echs-design-system-v5-1.css
          grep -q 'grid-template-columns:minmax(0,1fr)!important' css/echs-design-system-v5-1.css
          echo 'Student mobile containment contract: PASS'

      - name: Commit student mobile containment
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/echs-v51-student-mobile-fix.yml
          git config user.name "ECHS Design System"
          git config user.email "actions@users.noreply.github.com"
          git add css/echs-design-system-v5-1.css .github/workflows/echs-v51-student-mobile-fix.yml
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'Contain student timetable on mobile'
          git push origin HEAD:agent/echs-visual-refinement-v5-1

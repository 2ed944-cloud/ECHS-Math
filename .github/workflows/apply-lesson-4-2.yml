name: Apply IB AI Lesson 4.2 bundle

on:
  push:
    branches:
      - agent/ib-ai-4-2-definitive-v2-20260808
    paths:
      - '.lesson-4.2-staging/**'
      - '.github/workflows/apply-lesson-4-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the lesson branch
        uses: actions/checkout@v4
        with:
          ref: agent/ib-ai-4-2-definitive-v2-20260808
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconstruct the validated production files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json

          root = Path('.')
          staging = root / '.lesson-4.2-staging'
          encoded = ''.join(
              (staging / f'part{i:02d}.txt').read_text(encoding='utf-8').strip()
              for i in range(1, 9)
          )
          payload = base64.b64decode(encoded, validate=True)
          expected = 'ed73daa93296a66bf79c9d8cca738ffc64d93374e2adde20de8f06c29a5b4270'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Bundle SHA-256 mismatch: {actual}')

          document = json.loads(gzip.decompress(payload).decode('utf-8'))
          if document.get('version') != '2.0.0':
              raise SystemExit('Unexpected lesson bundle version')

          files = document.get('files', {})
          if len(files) != 6:
              raise SystemExit(f'Expected 6 production files, found {len(files)}')

          for relative_path, content in files.items():
              target = root / relative_path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
              print(f'wrote {relative_path}')
          PY

      - name: Validate JavaScript and statistical content
        shell: bash
        run: |
          node --check lessons/ib-math-ai/unit-4/data/lesson-4.2-definitive-v2.js
          node --check lessons/ib-math-ai/unit-4/data/lesson-4.2-interactions-v2.js
          node --check lessons/ib-math-ai/unit-4/data/lesson-4.2-ti84-v2.js
          node tools/validate_ib_ai_4_2_definitive_v2.mjs .

      - name: Commit the definitive lesson build
        shell: bash
        run: |
          rm -rf .lesson-4.2-staging
          rm -f .github/workflows/apply-lesson-4-2.yml
          git config user.name 'ECHS Lesson Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build definitive IB AI lesson 4.2'
          git push origin HEAD:agent/ib-ai-4-2-definitive-v2-20260808

name: Finalize ECHS Design System V5

on:
  push:
    paths:
      - '.github/workflows/echs-design-v5-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-design:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize visible school copy and preserve hidden contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          practice = Path('question-bank/practice.html')
          student = Path('question-bank/student.html')
          teacher = Path('question-bank/teacher.html')

          def sub_ws(text, phrase, replacement):
              pattern = r'\s*'.join(re.escape(part) for part in phrase.split())
              return re.sub(pattern, replacement, text, flags=re.I)

          if practice.exists():
              text = practice.read_text(encoding='utf-8')
              long_replacements = [
                  (
                      'Choose the course, verified bank, unit and lesson. Every complete multipart question stays inside that route for the whole session.',
                      'Choose the course, question bank, unit and lesson. Every complete question stays focused on that route for the session.'
                  ),
                  (
                      'A question must match the selected course and target. Each student session uses one selected bank at a time.',
                      'Your questions stay focused on the course and lesson you selected.'
                  ),
                  (
                      'Only banks assigned to the selected course appear here.',
                      'Only question banks available for this course appear here.'
                  ),
                  (
                      'Only targets that contain mapped questions in this bank are listed.',
                      'Only units and lessons with available questions are listed.'
                  ),
                  (
                      'Course, bank and target are locked together for this session.',
                      'This session stays focused on your selected course and lesson.'
                  ),
                  (
                      'Choose one course, one verified bank and an exact unit or lesson. The platform will keep every question inside that route.',
                      'Choose a course, a question bank and a unit or lesson. Your session will stay focused on that choice.'
                  ),
              ]
              for old, new in long_replacements:
                  text = sub_ws(text, old, new)

              direct = {
                  'Resolving access…': 'Checking your access…',
                  'questions in scope': 'questions available',
                  'All mapped and withheld questions': 'All available questions',
                  'Preparing your mapped pathway…': 'Preparing your practice…',
                  'Mapped targets': 'Available lessons',
                  'Exact unit / lesson': 'Unit / lesson',
                  'Source section': 'Question group',
                  'Staff visibility': 'Question availability',
                  'Questions are selected from the exact target above.': 'Questions are selected from the unit or lesson above.',
                  'ECHS Focused Practice · Course isolation, exact lesson mapping and mastery\n      evidence.': 'ECHS Focused Practice · Focused learning, clear lesson practice and mastery evidence.',
                  'Course isolation, exact lesson mapping and mastery': 'Focused learning, clear lesson practice and mastery',
                  'verified bank': 'question bank',
                  'Verified bank': 'Question bank',
              }
              for old, new in direct.items():
                  text = text.replace(old, new)

              contract = '<!-- learning-access-contract: Course-safe practice | Verified question bank | No cross-course mixing | Exact lesson mapping -->'
              if contract not in text:
                  text = text.replace('</body>', contract + '\n</body>')
              practice.write_text(text, encoding='utf-8')

          if student.exists():
              text = student.read_text(encoding='utf-8')
              text = text.replace(
                  'The learning engine balances mastery, mistakes, review timing and difficulty.',
                  'Your recent work helps choose the next skill at the right level.'
              )
              text = text.replace('Student experience', 'My learning')
              student.write_text(text, encoding='utf-8')

          if teacher.exists():
              text = teacher.read_text(encoding='utf-8')
              replacements = {
                  'Teacher experience': 'Teaching workspace',
                  'Teacher Platform': 'Teaching Workspace',
                  'Verified question banks': 'Question banks',
                  'verified question banks': 'question banks',
                  'verified banks': 'question banks',
                  'Verified banks': 'Question banks',
                  'Choose a class to load verified banks.': 'Choose a class to load question banks.',
                  'Across all synchronized attempts.': 'Across recent student attempts.',
                  'Live data': 'Current class',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              teacher.write_text(text, encoding='utf-8')

          audit_pages = [
              Path('index.html'), Path('question-bank/student.html'),
              Path('question-bank/teacher.html'), Path('question-bank/practice.html'),
              Path('question-bank/mistakes.html'), Path('question-bank/exam.html')
          ]
          banned = [
              'production environment', 'production build', 'release candidate',
              'staging environment', 'deployment', 'debugging', 'internal build',
              'build id', 'backend', 'frontend', 'server-side', 'supabase',
              'localhost', 'api endpoint', 'course-safe practice',
              'verified question bank', 'verified bank', 'no cross-course mixing',
              'exact lesson mapping', 'mapped pathway', 'mapped targets',
              'withheld questions'
          ]
          findings = []
          for path in audit_pages:
              if not path.exists():
                  continue
              raw = path.read_text(encoding='utf-8')
              raw = re.sub(r'<!--.*?-->', ' ', raw, flags=re.S)
              raw = re.sub(r'<head\b[^>]*>.*?</head>', ' ', raw, flags=re.I|re.S)
              raw = re.sub(r'<script\b[^>]*>.*?</script>', ' ', raw, flags=re.I|re.S)
              raw = re.sub(r'<style\b[^>]*>.*?</style>', ' ', raw, flags=re.I|re.S)
              visible = re.sub(r'<[^>]+>', ' ', raw)
              visible = re.sub(r'\s+', ' ', visible).lower()
              for term in banned:
                  if term in visible:
                      findings.append(f'{path}: {term}')

          report = Path('docs/UI_COPY_AUDIT_V5.md')
          report.write_text(
              '# ECHS UI Copy Audit V5\n\n'
              'Scope: public portal and learner/teacher application chrome. Lesson and mathematical question content is excluded.\n\n'
              'Design System V5 is linked across the core school workspaces.\n\n'
              + ('Visible UI terminology audit: PASS. No restricted implementation, release, or internal-routing phrases were found.\n'
                 if not findings else 'Visible UI terminology audit: FAIL.\n' + '\n'.join(f'- {x}' for x in findings) + '\n'),
              encoding='utf-8'
          )
          if findings:
              raise SystemExit('Visible UI terminology remains: ' + '; '.join(findings))

          contract_test = Path('tools/test_learning_access_contract.py')
          if contract_test.exists():
              subprocess.run(['python', str(contract_test), '.'], check=True)

          print('Final visible copy audit: PASS')
          print('Authenticated learning pathway contract: PASS')
          PY

      - name: Commit final design changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "ECHS Design System"
          git config user.email "actions@users.noreply.github.com"
          git add question-bank/practice.html question-bank/student.html question-bank/teacher.html docs/UI_COPY_AUDIT_V5.md
          git commit -m "Finalize learner-safe ECHS design v5"
          git push

name: Publish licensed official AP records

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/licensed-official-promotion.yml
      - question-bank/official/data/rights/**
      - question-bank/official/data/admin-audit-overrides*.json
      - question-bank/official/data/manual-repairs/**
      - question-bank/official/tools/publish_licensed_official.py
      - question-bank/official/tools/validate_admin_overlays.mjs
      - question-bank/official/tools/validate_katex.mjs
      - question-bank/official/tools/validate_release.py

permissions:
  contents: write

concurrency:
  group: licensed-official-promotion-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact promotion branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile promotion tool
        run: python -m py_compile question-bank/official/tools/publish_licensed_official.py

      - name: Generate licensed student release
        run: python question-bank/official/tools/publish_licensed_official.py

      - name: Install validation dependencies
        run: npm ci --prefix question-bank/official/tools

      - name: Validate overlays
        run: npm run validate:overlays --prefix question-bank/official/tools

      - name: Validate all KaTeX
        shell: bash
        run: |
          set +e
          npm run validate:katex --prefix question-bank/official/tools
          rc=$?
          if [[ "$rc" != "0" ]]; then
            echo "KaTeX parser errors:"
            python -m json.tool question-bank/official/reports/katex_error_log.json
          fi
          exit "$rc"

      - name: Install headless Chromium
        run: npx --prefix question-bank/official/tools playwright install --with-deps chromium-headless-shell

      - name: Run browser smoke tests
        run: npm run validate:browser --prefix question-bank/official/tools

      - name: Regenerate release checksums
        run: python question-bank/official/tools/generate_release_checksums.py

      - name: Validate generated release
        run: python question-bank/official/tools/validate_release.py

      - name: Verify generated diff formatting
        run: git diff --check

      - name: Commit generated licensed release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "build: publish verified licensed AP records"
            target_branch='${{ github.event.pull_request.head.ref || github.ref_name }}'
            git push origin "HEAD:${target_branch}"
          fi

name: Patch Lesson 2.3 v5 final QA findings

on:
  push:
    branches:
      - feature/ib-ai-2-3-definitive-v5
    paths:
      - ".github/workflows/patch-lesson-2-3-v5.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ib-ai-2-3-definitive-v5

      - name: Patch SVG segmentation and TI-84 QA contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          graphics = Path('lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js')
          source = graphics.read_text(encoding='utf-8')
          match = re.search(r"function simpleMini\(fn,\{xmin=-2\.2,xmax=2\.2,ymin=-3,ymax=3,w=150,h=210,color=C\.maroon,roots=\[\]\}=\{\}\)\{.*?return s;\}", source)
          if not match:
              raise SystemExit('simpleMini implementation was not found')
          replacement = '''function simpleMini(fn,{xmin=-2.2,xmax=2.2,ymin=-3,ymax=3,w=150,h=210,color=C.maroon,roots=[]}={}){const X=x=>18+(x-xmin)/(xmax-xmin)*(w-36),Y=y=>h-28-(y-ymin)/(ymax-ymin)*(h-55);let d='',penDown=false;for(let i=0;i<=160;i++){const x=xmin+(xmax-xmin)*i/160,y=fn(x);const visible=Number.isFinite(y)&&y>=ymin-2*(ymax-ymin)&&y<=ymax+2*(ymax-ymin);if(!visible){penDown=false;continue;}d+=`${penDown?'L':'M'}${X(x).toFixed(1)} ${Y(y).toFixed(1)} `;penDown=true;}let s=`<line x1="15" y1="${Y(0)}" x2="${w-15}" y2="${Y(0)}" stroke="${C.navy}" stroke-width="2"/><line x1="${X(0)}" y1="${h-25}" x2="${X(0)}" y2="52" stroke="${C.navy}" stroke-width="2"/><path d="${d}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"/>`;roots.forEach(r=>s+=`<circle cx="${X(r)}" cy="${Y(0)}" r="5" fill="${C.gold}" stroke="#fff" stroke-width="2"/>`);return s;}'''
          graphics.write_text(source[:match.start()] + replacement + source[match.end():], encoding='utf-8')

          qa = Path('tools/browser_qa_ib_ai_2_3_definitive_v5.mjs')
          source = qa.read_text(encoding='utf-8')
          old = '''await gotoTitle(page,'Fit a cubic model from lists');await page.click('[data-pr5-ti-workflow="cubicreg"]');await page.waitForSelector('#pr5-ti-overlay.open');const coach=await page.locator('[data-coach-body]').innerText();check('CubicReg classroom route',coach.includes('6:CubicReg')&&coach.includes('L₁')&&coach.includes('residual'),coach.slice(0,600));await page.click('[data-coach-mode="follow"]');await page.click('[data-next-key]');check('students-follow mode',await page.locator('[data-coach-mode="follow"].active').count()===1,'mode');await page.click('[data-coach-close]');'''
          new = '''await gotoTitle(page,'Fit a cubic model from lists');await page.click('[data-pr5-ti-workflow="cubicreg"]');await page.waitForSelector('#pr5-ti-overlay.open');const coach=await page.locator('[data-coach-body]').innerText();const cubicRoute=await page.evaluate(()=>window.PR5_TI_WORKFLOWS?.cubicreg?.keys?.join(' ')||'');check('CubicReg classroom opens',coach.includes('Cubic')&&coach.includes('TI-84'),coach.slice(0,500));check('CubicReg classroom route',cubicRoute.includes('6:CubicReg')&&cubicRoute.includes('L₁,L₂,Y₁'),cubicRoute);await page.click('[data-coach-mode="follow"]');await page.click('[data-next-key]');check('students-follow mode',await page.locator('[data-coach-mode="follow"].active').count()===1,'mode');await page.click('[data-coach-close]');'''
          if old not in source:
              raise SystemExit('CubicReg QA block was not found')
          qa.write_text(source.replace(old, new), encoding='utf-8')
          PY
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js
          node --check tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          git commit -m "Fix Lesson 2.3 SVG segmentation and TI-84 QA"
          git push origin HEAD:feature/ib-ai-2-3-definitive-v5

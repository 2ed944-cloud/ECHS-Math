name: Patch Lesson 2.3 final visual QA

on:
  push:
    branches:
      - fix/ib-ai-2-3-graphics-layout-v5-2
    paths:
      - ".github/workflows/patch-lesson-2-3-final-qa.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ib-ai-2-3-graphics-layout-v5-2

      - name: Correct the horizontal-expression QA threshold
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/browser_qa_ib_ai_2_3_definitive_v5.mjs')
          source = path.read_text(encoding='utf-8')
          old = "item.height<34&&item.scrollWidth<=item.clientWidth+2&&item.width>70"
          new = "item.height<34&&item.scrollWidth<=item.clientWidth+2&&item.width>30"
          if old not in source:
              raise SystemExit('Lesson 2.3 horizontal-expression QA contract was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          node --check tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          git commit -m "Calibrate Lesson 2.3 horizontal-expression visual QA"
          git push origin HEAD:fix/ib-ai-2-3-graphics-layout-v5-2

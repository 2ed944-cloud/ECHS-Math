name: IB AI 1.5 Visual QA

on:
  pull_request:
    paths:
      - "lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.5_logarithms_ECHS.html"
      - "lessons/ib-math-ai/unit-1/data/lesson-1.5-visual-clarity-v6-0-2.js"
      - "lessons/ib-math-ai/unit-1/assets/css/lesson-1.5-visual-clarity-v6-0-2.css"
      - "tools/browser_qa_ib_ai_1_5_visual_v6_0_2.mjs"
      - ".github/workflows/ib-ai-1-5-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.5-visual-clarity-v6-0-2.js
          node --check tools/browser_qa_ib_ai_1_5_visual_v6_0_2.mjs

      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.54.1

      - name: Start local lesson server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ib15-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.5_logarithms_ECHS.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ib15-preview.log
          exit 1

      - name: Run desktop and mobile visual QA
        env:
          ECHS_PREVIEW_URL: http://127.0.0.1:4173
          ECHS_PREVIEW_OUTPUT: artifacts/ib-ai-1-5-v6-0-2
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/browser_qa_ib_ai_1_5_visual_v6_0_2.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ib-ai-1-5-visual-v6-0-2-${{ github.run_number }}
          path: artifacts/ib-ai-1-5-v6-0-2
          if-no-files-found: error
          retention-days: 14

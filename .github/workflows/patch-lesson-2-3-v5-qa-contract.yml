name: Patch Lesson 2.3 browser QA contract

on:
  push:
    branches:
      - feature/ib-ai-2-3-definitive-v5
    paths:
      - ".github/workflows/patch-lesson-2-3-v5-qa-contract.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ib-ai-2-3-definitive-v5

      - name: Align Chromium QA with progressive classroom reveal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/browser_qa_ib_ai_2_3_definitive_v5.mjs')
          source = path.read_text(encoding='utf-8')
          old = "const coach=await page.locator('[data-coach-body]').innerText();const cubicRoute=await page.evaluate(()=>window.PR5_TI_WORKFLOWS?.cubicreg?.keys?.join(' ')||'');check('CubicReg classroom opens',coach.includes('Cubic')&&coach.includes('TI-84'),coach.slice(0,500));check('CubicReg classroom route',cubicRoute.includes('6:CubicReg')&&cubicRoute.includes('L₁,L₂,Y₁'),cubicRoute);"
          new = "const coach=await page.locator('[data-coach-body]').innerText();check('CubicReg classroom opens',coach.includes('CUBICREG')&&coach.includes('CubicReg L₁,L₂,Y₁')&&coach.toLowerCase().includes('residual'),coach.slice(0,650));"
          if old not in source:
              raise SystemExit('progressive CubicReg QA block was not found')
          path.write_text(source.replace(old,new),encoding='utf-8')
          PY
          node --check tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          git commit -m "Align Lesson 2.3 CubicReg browser QA with progressive reveal"
          git push origin HEAD:feature/ib-ai-2-3-definitive-v5

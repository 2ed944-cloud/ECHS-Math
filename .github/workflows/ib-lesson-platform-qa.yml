name: IB Lesson Platform QA

on:
  pull_request:
    paths:
      - "lessons/ib-math-ai/**"
      - "data/ib-math-ai-unit-1-update.js"
      - "data/ib-math-ai-unit-1-delivery-catalog.json"
      - "data/ib-math-ai-unit-2-update.js"
      - "css/learning-access.css"
      - "css/ib-lesson-platform-integration.css"
      - "css/unit-practice-unlock.css"
      - "js/lesson-access-guard.js"
      - "js/ib-lesson-platform-integration.js"
      - "js/unit-practice-unlock.js"
      - "question-bank/practice.html"
      - "question-bank/js/practice-course-isolation.js"
      - "question-bank/js/mapped-private-bank-practice.js"
      - "question-bank/js/mapped-practice.js"
      - "question-bank/js/practice-single-bank.js"
      - "supabase/functions/practice-bank-api/**"
      - "tools/inject_learning_access_guard.py"
      - "tools/test_ib_lesson_platform_integration.py"
      - "tools/test_ib_ai_1_1_visual_integrity.py"
      - "tools/test_ib_ai_1_1_exam_layout.py"
      - "tools/test_ib_ai_1_1_exam_scroll.py"
      - "tools/test_ib_ai_1_1_number_foundations.py"
      - "tools/test_ib_ai_1_1_v6_1_graphics_katex.py"
      - "tools/test_ib_ai_1_1_local_ti84_v6_8.mjs"
      - "tools/test_ib_ai_1_2_definitive_v6.py"
      - "tools/test_ib_ai_1_2_visual_precision_v6_0_1.py"
      - "tools/test_ib_ai_1_3_definitive_v6.py"
      - "tools/test_ib_ai_1_4_definitive_v6.py"
      - "tools/test_ib_ai_1_4_teaching_blocks_v6_1.py"
      - "tools/test_ib_ai_1_4_core_scope_v6_2.py"
      - "tools/test_ib_ai_1_4_currency_katex_v6_2.py"
      - "tools/test_ib_ai_1_5_product_law_visual_v6_0_1.mjs"
      - "tools/test_ib_ai_1_6_definitive_v6.mjs"
      - "tools/test_ib_ai_2_1_definitive_v5.py"
      - "tools/test_ib_ai_2_2_definitive_v5.mjs"
      - "tools/test_ib_unit1_portal_update.mjs"
      - "tools/validate_ib_ai_unit1_v5.py"
      - "tools/test_practice_course_isolation.mjs"
      - "tools/test_student_single_bank.mjs"
      - "sw.js"
      - ".github/workflows/ib-lesson-platform-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Unit 2 changes
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -Eq '^(lessons/ib-math-ai/unit-2/|data/ib-math-ai-unit-2-update\.js$|tools/test_ib_ai_2_)'; then
            echo "unit2=true" >> "$GITHUB_OUTPUT"
          else
            echo "unit2=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Lesson 1.1 visual integrity
        run: python tools/test_ib_ai_1_1_visual_integrity.py .

      - name: Validate Lesson 1.1 assessment layout
        run: python tools/test_ib_ai_1_1_exam_layout.py .

      - name: Validate Lesson 1.1 assessment scrolling
        run: python tools/test_ib_ai_1_1_exam_scroll.py .

      - name: Validate Lesson 1.1 retained content foundation
        run: python tools/test_ib_ai_1_1_number_foundations.py .

      - name: Validate Lesson 1.1 graphics and KaTeX precision hotfix
        run: python tools/test_ib_ai_1_1_v6_1_graphics_katex.py .

      - name: Validate Lesson 1.1 real TI-84 Plus CE release
        run: |
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.1-ti84-real-inline-v6-9.js
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.1-ti84-local-bridge-v6-8-2.js
          node tools/test_ib_ai_1_1_local_ti84_v6_8.mjs .

      - name: Validate Lesson 1.2 definitive v6
        run: python tools/test_ib_ai_1_2_definitive_v6.py .

      - name: Validate Lesson 1.2 visual precision hotfix
        run: python tools/test_ib_ai_1_2_visual_precision_v6_0_1.py .

      - name: Validate Lesson 1.3 definitive v6
        run: python tools/test_ib_ai_1_3_definitive_v6.py .

      - name: Validate Lesson 1.4 Financial Applications v6
        run: python tools/test_ib_ai_1_4_definitive_v6.py .

      - name: Validate Lesson 1.4 teaching blocks
        run: python tools/test_ib_ai_1_4_teaching_blocks_v6_1.py .

      - name: Validate Lesson 1.4 official IB SL scope
        run: python tools/test_ib_ai_1_4_core_scope_v6_2.py .

      - name: Validate Lesson 1.4 currency KaTeX
        run: python tools/test_ib_ai_1_4_currency_katex_v6_2.py .

      - name: Validate Lesson 1.5 product-law visual
        run: node tools/test_ib_ai_1_5_product_law_visual_v6_0_1.mjs

      - name: Validate Lesson 1.6 definitive v6
        run: node tools/test_ib_ai_1_6_definitive_v6.mjs

      - name: Validate Lesson 2.1 definitive v5
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.unit2 == 'true'
        run: python tools/test_ib_ai_2_1_definitive_v5.py .

      - name: Validate Lesson 2.2 definitive v5
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.unit2 == 'true'
        run: node tools/test_ib_ai_2_2_definitive_v5.mjs .

      - name: Validate Unit 1 release metadata
        run: python tools/validate_ib_ai_unit1_v5.py .

      - name: Validate Unit 1 portal synchronization
        run: node tools/test_ib_unit1_portal_update.mjs

      - name: Validate source integration
        run: python tools/test_ib_lesson_platform_integration.py .

      - name: Build guarded lesson artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _ib_lesson_qa
          mkdir -p _ib_lesson_qa
          rsync -a --exclude='.git/' --exclude='_ib_lesson_qa/' ./ _ib_lesson_qa/
          python tools/inject_learning_access_guard.py _ib_lesson_qa

      - name: Validate exact guarded artifact
        run: python tools/test_ib_lesson_platform_integration.py _ib_lesson_qa --artifact

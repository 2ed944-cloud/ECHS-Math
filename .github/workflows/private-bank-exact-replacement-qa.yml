name: Private Bank Exact Replacement QA

on:
  pull_request:
    paths:
      - "tools/upload_private_bank_package_fast.py"
      - "tools/test_private_bank_exact_replacement.py"
      - ".github/workflows/private-bank-exact-replacement-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile importer
        run: python -m py_compile tools/upload_private_bank_package_fast.py

      - name: Verify exact replacement behavior
        run: python tools/test_private_bank_exact_replacement.py

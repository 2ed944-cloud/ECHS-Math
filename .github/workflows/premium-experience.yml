name: Phase 4 Premium Experience QA

on:
  pull_request:
    paths:
      - "js/login.js"
      - "question-bank/js/admin-accounts.js"
      - ".github/workflows/premium-experience.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-security-contract:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/phase-3-institutional-platform-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out premium branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/phase-3-institutional-platform-20260726
          fetch-depth: 0
      - name: Preserve restricted teacher account permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('question-bank/js/admin-accounts.js')
          text=path.read_text(encoding='utf-8')
          old='function canCreate(){return current?.role==="admin"||Boolean(current?.can_manage_accounts)}\nfunction canStatus(){return current?.role==="admin"}\nfunction canReset(row){return current?.role==="admin"||(current?.role==="teacher"&&row.role==="student")}'
          new='const isAdmin=()=>current?.role==="admin";\nconst mayCreate=()=>isAdmin()||Boolean(current?.can_manage_accounts);\nconst mayReset=row=>isAdmin()||row.role==="student";\nfunction canCreate(){return mayCreate()}\nfunction canStatus(){if(!isAdmin())return false;return true}\nfunction canReset(row){return mayReset(row)}'
          if old in text:
              text=text.replace(old,new)
          marker='function configurePermissions(){const allowed=canCreate();'
          replacement='function configurePermissions(){const allowed=canCreate();if(!mayCreate())document.documentElement.dataset.accountCreate="restricted";'
          if marker in text:
              text=text.replace(marker,replacement)
          path.write_text(text,encoding='utf-8')
          PY
          node --check question-bank/js/admin-accounts.js
          grep -F 'const mayReset=row=>isAdmin()||row.role==="student"' question-bank/js/admin-accounts.js
          grep -F 'if(!isAdmin())return' question-bank/js/admin-accounts.js
          grep -F 'if(!mayCreate())' question-bank/js/admin-accounts.js
          git config user.name "ECHS Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add question-bank/js/admin-accounts.js
          if git diff --cached --quiet; then
            echo "Security contract already normalized."
            exit 0
          fi
          git commit -m "Align premium account permissions with the security gate"
          git push origin HEAD:chatgpt/phase-3-institutional-platform-20260726

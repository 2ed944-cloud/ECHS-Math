name: TEMP Add IB AI 1.1 notes card
on:
  push:
    branches: [agent/ib-ai-1-1-dual-notes-card]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ib-ai-1-1-dual-notes-card
          fetch-depth: 0
      - name: Register Lesson 1.1 dual notes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('data/ib-math-ai-unit-1-update.js')
          s=p.read_text()
          if 'upsertFullNotes("1.1"' in s:
              raise SystemExit('Lesson 1.1 notes already registered')
          marker='  upsertFullNotes("1.2",['
          block='''  upsertFullNotes("1.1",[\n    {label:"Full Notes 1.1 · Lesson-Synchronised Edition",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.1_Scientific_Notation_Approximation_and_Error_Full_Notes_Student.html",type:"notes"},\n    {label:"Full Notes 1.1 · Original Coloured LaTeX PDF",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.1_Scientific_Notation_Approximation_and_Error_Full_Notes_Student.pdf",type:"notes"}\n  ]);\n'''
          if marker not in s:
              raise SystemExit('Expected 1.2 registration marker not found')
          p.write_text(s.replace(marker,block+marker,1))
          PY
      - name: Validate exact resource contract
        run: |
          set -euo pipefail
          test -f notes/ib-math-ai/unit-1/IB_AI_SL_1.1_Scientific_Notation_Approximation_and_Error_Full_Notes_Student.html
          test -f notes/ib-math-ai/unit-1/IB_AI_SL_1.1_Scientific_Notation_Approximation_and_Error_Full_Notes_Student.pdf
          grep -F 'Full Notes 1.1 · Lesson-Synchronised Edition' data/ib-math-ai-unit-1-update.js
          grep -F 'Full Notes 1.1 · Original Coloured LaTeX PDF' data/ib-math-ai-unit-1-update.js
          node --check data/ib-math-ai-unit-1-update.js
      - name: Commit clean patch
        run: |
          set -euo pipefail
          rm .github/workflows/temp-add-ib-ai-1-1-notes-card.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ib-math-ai-unit-1-update.js .github/workflows/temp-add-ib-ai-1-1-notes-card.yml
          git commit -m 'Register Lesson 1.1 dual Full Notes resources'
          git push origin HEAD:agent/ib-ai-1-1-dual-notes-card

name: Apply Lesson 1.4 SL Scope Package

on:
  push:
    branches:
      - fix/ib-ai-1-4-sl-core-scope-v6-2

permissions:
  contents: write
  issues: read

jobs:
  apply-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/ib-ai-1-4-sl-core-scope-v6-2
          fetch-depth: 0

      - name: Reassemble verified payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re, tarfile, urllib.request
          from pathlib import Path

          url='https://api.github.com/repos/2ed944-cloud/ECHS-Math/issues/176/comments?per_page=100'
          req=urllib.request.Request(url,headers={
              'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
          })
          with urllib.request.urlopen(req) as response:
              comments=json.load(response)
          chunks=[]
          pattern=re.compile(r'^ECHS_PACKAGE_CHUNK_(\d{3})_OF_007\n([A-Za-z0-9+/=]+)$')
          for item in comments:
              match=pattern.match(item.get('body','').strip())
              if match:
                  chunks.append((int(match.group(1)),match.group(2)))
          chunks.sort()
          if [index for index,_ in chunks]!=list(range(1,8)):
              raise SystemExit(f'Expected chunks 1–7; found {[index for index,_ in chunks]}')
          archive=base64.b64decode(''.join(chunk for _,chunk in chunks),validate=True)
          digest=hashlib.sha256(archive).hexdigest()
          expected='b75235af66ab4835982666d4dfe17e0b86a4bd12d651c2270f5b985292272c2f'
          if digest!=expected:
              raise SystemExit(f'Payload digest mismatch: {digest}')
          archive_path=Path('/tmp/lesson14-v62.tar.gz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path,'r:gz') as package:
              root=Path.cwd().resolve()
              for member in package.getmembers():
                  target=(root/member.name).resolve()
                  if root not in target.parents and target!=root:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
              package.extractall(root)
          PY

      - name: Validate scoped lesson before commit
        run: |
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.4-sl-core-v6-2-copy-a.js
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.4-sl-core-v6-2-copy-b.js
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.4-sl-core-v6-2-copy-c.js
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.4-sl-core-v6-2-apply.js
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.4-scope-runtime-v6-2.js
          python tools/test_ib_ai_1_4_sl_scope_v6_2.py .
          node tools/test_ib_unit1_portal_update.mjs
          python tools/validate_ib_ai_unit1_v5.py .

      - name: Commit production files without workflow changes
        run: |
          git checkout HEAD -- .github/workflows/apply-lesson14-v62.yml .github/workflows/ib-lesson-platform-qa.yml
          git config user.name 'ECHS Production Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Align IB AI 1.4 with SL core scope'
          git push origin HEAD:fix/ib-ai-1-4-sl-core-scope-v6-2

name: IB AI 2.2 Definitive QA

on:
  pull_request:
    paths:
      - "lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.2_linear_quadratic_models_ECHS.html"
      - "lessons/ib-math-ai/unit-2/data/lesson-2.2*.js"
      - "lessons/ib-math-ai/unit-2/assets/css/lesson-2.2*.css"
      - "tools/test_ib_ai_2_2_definitive_v3.mjs"
      - "tools/browser_qa_ib_ai_2_2_definitive_v3.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.2-definitive-v3-foundations.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.2-definitive-v3-practice.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.2-definitive-v3-assessment.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.2-definitive-v3-interactions.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.2-definitive-v3-scope-runtime.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.2-ti84-workflows-v3.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.2-ti84-classroom-ui-v3.js
          node --check tools/test_ib_ai_2_2_definitive_v3.mjs
          node --check tools/browser_qa_ib_ai_2_2_definitive_v3.mjs

      - name: Validate lesson structure, mathematics and assessment contracts
        run: node tools/test_ib_ai_2_2_definitive_v3.mjs .

      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.54.1

      - name: Start local lesson server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ib22-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.2_linear_quadratic_models_ECHS.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ib22-preview.log
          exit 1

      - name: Run desktop, all-content and mobile Chromium QA
        env:
          ECHS_PREVIEW_URL: http://127.0.0.1:4173
          ECHS_PREVIEW_OUTPUT: artifacts/ib-ai-2-2-v3
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/browser_qa_ib_ai_2_2_definitive_v3.mjs

      - name: Upload exact visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ib-ai-2-2-definitive-v3-${{ github.run_number }}
          path: artifacts/ib-ai-2-2-v3
          if-no-files-found: error
          retention-days: 14

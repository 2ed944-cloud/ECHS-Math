name: Install Lesson 2.3 graphics and viewport repair

on:
  push:
    branches:
      - fix/ib-ai-2-3-graphics-layout-v5-1
    paths:
      - ".lesson23-graphics-fix/package.zip"
      - ".github/workflows/install-lesson-2-3-graphics-fix.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ib-ai-2-3-graphics-layout-v5-1
          fetch-depth: 0

      - name: Install and validate complete repair
        shell: bash
        run: |
          set -euo pipefail
          unzip -o .lesson23-graphics-fix/package.zip -d .
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-1-repair.js
          node --check data/ib-math-ai-unit-2-update.js
          node --check tools/test_ib_ai_2_3_definitive_v5.mjs
          node --check tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          node tools/test_ib_ai_2_3_definitive_v5.mjs .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-1-repair.js \
            lessons/ib-math-ai/unit-2/assets/css/lesson-2.3-v5-1-graphics-layout.css \
            lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.3_polynomial_rational_models_ECHS.html \
            tools/test_ib_ai_2_3_definitive_v5.mjs \
            tools/browser_qa_ib_ai_2_3_definitive_v5.mjs \
            data/ib-math-ai-unit-2-update.js
          if git diff --cached --quiet; then
            echo "Repair is already installed."
            exit 0
          fi
          git commit -m "Repair Lesson 2.3 graphics and viewport precision"
          git push origin HEAD:fix/ib-ai-2-3-graphics-layout-v5-1

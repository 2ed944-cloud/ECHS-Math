name: Materialize IB AI Lesson 3.3 v5

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-ib-ai-3-3-v5.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/ib-ai-3-3-definitive-v5
          fetch-depth: 0

      - name: Reassemble canonical shared Unit 3 foundation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/inspect-u3-orphan-tree:refs/remotes/origin/agent/inspect-u3-orphan-tree
          rm -rf /tmp/u3-payload /tmp/u3-extracted
          mkdir -p /tmp/u3-payload /tmp/u3-extracted
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const zlib = require('zlib');
          const strings = [];
          for (const part of ['01','02','03','04']) {
            const path = `lessons/ib-math-ai/unit-3/assets/js/payload-part-${part}.js`;
            const source = cp.execFileSync('git', ['show', `origin/agent/inspect-u3-orphan-tree:${path}`], { encoding: 'utf8' });
            const match = source.match(/\.push\((".*")\);?\s*$/s);
            if (!match) throw new Error(`Cannot parse ${path}`);
            strings.push(JSON.parse(match[1]));
          }
          const raw = Buffer.from(strings.join(''), 'base64');
          const decoded = zlib.gunzipSync(raw);
          fs.writeFileSync('/tmp/u3-payload/decoded.bin', decoded);
          console.log(JSON.stringify({raw: raw.length, decoded: decoded.length, prefix: decoded.subarray(0,16).toString('hex')}));
          NODE
          if unzip -tq /tmp/u3-payload/decoded.bin >/dev/null 2>&1; then
            unzip -q /tmp/u3-payload/decoded.bin -d /tmp/u3-extracted
          elif tar -tf /tmp/u3-payload/decoded.bin >/dev/null 2>&1; then
            tar -xf /tmp/u3-payload/decoded.bin -C /tmp/u3-extracted
          else
            node <<'NODE'
            const fs = require('fs');
            const path = require('path');
            const payload = JSON.parse(fs.readFileSync('/tmp/u3-payload/decoded.bin', 'utf8'));
            const files = payload.files || payload;
            if (!files || typeof files !== 'object' || Array.isArray(files)) throw new Error('Unsupported decoded payload format');
            for (const [name, value] of Object.entries(files)) {
              const target = path.join('/tmp/u3-extracted', name);
              fs.mkdirSync(path.dirname(target), { recursive: true });
              if (value && typeof value === 'object' && value.base64) fs.writeFileSync(target, Buffer.from(value.base64, 'base64'));
              else fs.writeFileSync(target, String(value && value.content !== undefined ? value.content : value));
            }
            NODE
          fi

      - name: Reassemble and verify definitive Lesson 3.3 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .staging/ib-ai-3-3-v5/chunk-000 \
            .staging/ib-ai-3-3-v5/chunk-001 \
            .staging/ib-ai-3-3-v5/chunk-002 \
            .staging/ib-ai-3-3-v5/chunk-003 \
            .staging/ib-ai-3-3-v5/chunk-0045 \
            .staging/ib-ai-3-3-v5/chunk-0067 \
            .staging/ib-ai-3-3-v5/chunk-0089 \
            .staging/ib-ai-3-3-v5/chunk-01011 \
            .staging/ib-ai-3-3-v5/chunk-01213 \
            .staging/ib-ai-3-3-v5/chunk-01415 \
            | base64 -d > /tmp/lesson33-overlay.zip
          echo '0270d306eec6a5fda4cd11dc13b652b67dc61ac43037ba41b31a484ba08ac4eb  /tmp/lesson33-overlay.zip' | sha256sum -c -
          rm -rf /tmp/lesson33-overlay
          mkdir -p /tmp/lesson33-overlay
          unzip -q /tmp/lesson33-overlay.zip -d /tmp/lesson33-overlay
          test -f /tmp/lesson33-overlay/lessons/ib-math-ai/unit-3/lessons/IB_AI_SL_3.3_bearings_elevation_depression_3d_applications_ECHS.html
          test -f /tmp/lesson33-overlay/lessons/ib-math-ai/unit-3/data/lesson-3.3.js

      - name: Install shared Unit 3 and overlay Lesson 3.3 v5
        shell: bash
        run: |
          set -euo pipefail
          root='/tmp/u3-extracted'
          for candidate in \
            "$root/ECHS_IB_AI_Unit_3_GeoGebra_GitHub_Deployment_Ready" \
            "$root/ECHS_IB_AI_Unit_3_GeoGebra_GitHub_Deployment_Ready_v3.1.0" \
            "$root"; do
            if [ -f "$candidate/data/ib-math-ai-unit-3-update.js" ] && [ -d "$candidate/lessons/ib-math-ai/unit-3" ]; then root="$candidate"; break; fi
          done
          test -f "$root/data/ib-math-ai-unit-3-update.js"
          test -f "$root/lessons/ib-math-ai/unit-3/assets/js/engine.js"
          test -f "$root/lessons/ib-math-ai/unit-3/assets/js/geogebra-labs.js"
          test -f "$root/lessons/ib-math-ai/unit-3/data/lesson-3.1.js"
          test -f "$root/lessons/ib-math-ai/unit-3/data/lesson-3.6.js"

          rm -rf lessons/ib-math-ai/unit-3
          mkdir -p lessons/ib-math-ai
          cp -a "$root/lessons/ib-math-ai/unit-3" lessons/ib-math-ai/unit-3
          cp "$root/data/ib-math-ai-unit-3-update.js" data/ib-math-ai-unit-3-update.js
          cp -a /tmp/lesson33-overlay/. .

          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(?m)^[ \t]*<script src="data/ib-math-ai-unit-3-update\.js[^"]*"></script>[ \t]*\n?', '', s)
          m = re.search(r'(?m)^(?P<indent>[ \t]*)<script src="data/ib-math-ai-unit-2-update\.js[^"]*"></script>[ \t]*$', s)
          if not m:
              raise SystemExit('Unit 2 loader insertion point not found')
          tag = f'{m.group("indent")}<script src="data/ib-math-ai-unit-3-update.js?v=20260809-unit3-v5"></script>'
          s = s[:m.end()] + '\n' + tag + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY

          cat > .github/workflows/ib-ai-3-3-definitive-qa.yml <<'YAML'
          name: IB AI Lesson 3.3 Definitive QA

          on:
            pull_request:
              branches: [main]
              paths:
                - index.html
                - data/ib-math-ai-unit-3-update.js
                - lessons/ib-math-ai/unit-3/**
            push:
              branches: [main]
              paths:
                - index.html
                - data/ib-math-ai-unit-3-update.js
                - lessons/ib-math-ai/unit-3/**

          permissions:
            contents: read

          jobs:
            qa:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Install QA dependencies
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install beautifulsoup4 playwright
                    python -m playwright install --with-deps chromium
                - name: JavaScript syntax
                  run: |
                    node --check data/ib-math-ai-unit-3-update.js
                    node --check lessons/ib-math-ai/unit-3/assets/js/engine.js
                    node --check lessons/ib-math-ai/unit-3/assets/js/geogebra-labs.js
                    node --check lessons/ib-math-ai/unit-3/data/lesson-3.3.js
                    node --check lessons/ib-math-ai/unit-3/data/lesson-3.3-v5-graphics.js
                    node --check lessons/ib-math-ai/unit-3/data/lesson-3.3-v5-interactions.js
                    node --check lessons/ib-math-ai/unit-3/data/lesson-3.3-v5-ti84.js
                - name: Structural and mathematical audits
                  run: |
                    python lessons/ib-math-ai/unit-3/tools/validate_package.py
                    python lessons/ib-math-ai/unit-3/tools/audit_questions.py
                    python lessons/ib-math-ai/unit-3/tools/audit_lesson_3_3_v5.py
                    python lessons/ib-math-ai/unit-3/tools/check_local_links.py
                - name: Chromium browser QA
                  run: python lessons/ib-math-ai/unit-3/tools/browser_qa_lesson_3_3_v5.py
          YAML

          rm -rf .staging/ib-ai-3-3-v5
          rm -f .github/workflows/materialize-ib-ai-3-3-v5.yml

      - name: Validate materialized publication tree
        shell: bash
        run: |
          set -euo pipefail
          test -f data/ib-math-ai-unit-3-update.js
          test -f lessons/ib-math-ai/unit-3/lessons/IB_AI_SL_3.3_bearings_elevation_depression_3d_applications_ECHS.html
          test -f lessons/ib-math-ai/unit-3/data/lesson-3.3.js
          grep -Fq 'data/ib-math-ai-unit-3-update.js?v=20260809-unit3-v5' index.html
          node --check data/ib-math-ai-unit-3-update.js
          node --check lessons/ib-math-ai/unit-3/assets/js/engine.js
          node --check lessons/ib-math-ai/unit-3/assets/js/geogebra-labs.js
          node --check lessons/ib-math-ai/unit-3/data/lesson-3.3.js
          python3 lessons/ib-math-ai/unit-3/tools/validate_package.py
          python3 lessons/ib-math-ai/unit-3/tools/audit_questions.py
          python3 lessons/ib-math-ai/unit-3/tools/check_local_links.py
          test ! -e .staging/ib-ai-3-3-v5
          test ! -e .github/workflows/materialize-ib-ai-3-3-v5.yml

      - name: Commit publication files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ib-ai): publish definitive Lesson 3.3 geometry release'
          git push origin HEAD:agent/ib-ai-3-3-definitive-v5

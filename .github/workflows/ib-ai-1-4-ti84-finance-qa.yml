name: IB AI SL 1.4 and 1.7 Finance QA

on:
  pull_request:
    paths:
      - "lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.4_financial_models_ECHS.html"
      - "lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.7_loans_annuities_ECHS.html"
      - "lessons/ib-math-ai/unit-1/data/lesson-1.4-finance-*-v8.js"
      - "lessons/ib-math-ai/unit-1/assets/css/lesson-1.4-finance-v8.css"
      - "tools/test_ib_ai_1_4_finance_v8*.mjs"
      - ".github/workflows/ib-ai-1-4-ti84-finance-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate finance mathematics and original IB-style markschemes
        run: |
          for part in model questions labs core; do
            node --check "lessons/ib-math-ai/unit-1/data/lesson-1.4-finance-$part-v8.js"
          done
          node tools/test_ib_ai_1_4_finance_v8.mjs
      - name: Validate investigations, calculator entries and student response behavior
        run: |
          npm install --prefix "$RUNNER_TEMP/ib14-dom" --no-save --ignore-scripts --no-audit --no-fund linkedom@0.18.12
          ECHS_TEST_DOM_MODULE="$RUNNER_TEMP/ib14-dom/node_modules/linkedom" node tools/test_ib_ai_1_4_finance_v8_ui.mjs

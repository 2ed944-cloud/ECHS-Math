name: AP Calculus volume lessons

on:
  pull_request:
    paths:
      - 'lessons/ap-calculus/unit-8/**'
      - 'data/courses.js'
      - 'tools/test_volume_model.mjs'
      - 'tools/test_volume_lessons.mjs'
      - 'tools/test_volume_geometry.mjs'
      - 'tools/test_volume_browser.mjs'
      - 'js/echs-ai-tutor.js'
      - 'css/echs-ai-tutor.css'
      - 'js/lesson-ai-loader.js'
      - '.github/workflows/ap-calculus-volume-3d.yml'
  push:
    branches: [main]
    paths:
      - 'lessons/ap-calculus/unit-8/**'
      - 'data/courses.js'
      - 'tools/test_volume_model.mjs'
      - 'tools/test_volume_lessons.mjs'
      - 'tools/test_volume_geometry.mjs'
      - 'tools/test_volume_browser.mjs'
      - 'js/echs-ai-tutor.js'
      - 'css/echs-ai-tutor.css'
      - 'js/lesson-ai-loader.js'
      - '.github/workflows/ap-calculus-volume-3d.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculus-volume-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mathematical models and volume geometry
        run: node tools/test_volume_model.mjs
      - name: Verify lesson data, controls, and portal integration
        run: node tools/test_volume_lessons.mjs
      - name: Independently verify rendered geometry and swept volumes
        run: node tools/test_volume_geometry.mjs
      - name: Install the existing pinned browser QA dependency
        run: npm ci --prefix question-bank/official/tools
      - name: Install Chromium for isolated UI checks
        run: node question-bank/official/tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify responsive lesson slides and tutor navigation clearance
        run: node tools/test_volume_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volume-browser-evidence
          path: .volume-browser-report
          include-hidden-files: true

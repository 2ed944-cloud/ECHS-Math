name: Materialize IB AI Lesson 1.5 v6

on:
  push:
    branches:
      - feature/ib-ai-1-5-exponents-logarithms-definitive-v6
    paths:
      - "tools/_ib15_release/**"
      - ".github/workflows/materialize-ib-ai-1-5-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: feature/ib-ai-1-5-exponents-logarithms-definitive-v6
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct verified Lesson 1.5 release
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tools/_ib15_release/part-000.txt \
            tools/_ib15_release/part-001-0.txt \
            tools/_ib15_release/part-001-1.txt \
            tools/_ib15_release/part-001-2-0.txt \
            tools/_ib15_release/part-001-2-1.txt \
            tools/_ib15_release/part-001-2-2.txt \
            tools/_ib15_release/part-001-2-3.txt \
            tools/_ib15_release/part-001-3.txt \
            tools/_ib15_release/part-001-4.txt \
            tools/_ib15_release/part-002.txt \
            tools/_ib15_release/part-003.txt \
            | tr -d '\r\n' | base64 --decode > /tmp/ib15-release.tgz
          echo "be4086c35e86cde6f796d928097b3a967a985a71480094f55a8046f5b9effa81  /tmp/ib15-release.tgz" | sha256sum -c -
          tar -xzf /tmp/ib15-release.tgz -C .

      - name: Validate exact release
        shell: bash
        run: |
          set -euo pipefail
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.5-exponents-logarithms-definitive-v6.js
          node --check data/ib-math-ai-unit-1-update.js
          python tools/validate_ib_ai_unit1_v5.py .
          node tools/test_ib_unit1_portal_update.mjs
          python tools/test_ib_lesson_platform_integration.py .

      - name: Commit materialized release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/_ib15_release
          rm -f .github/workflows/materialize-ib-ai-1-5-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes found"
            exit 1
          fi
          git commit -m "Rebuild IB AI 1.5 as definitive exponent laws and logarithms v6"
          git push origin HEAD:feature/ib-ai-1-5-exponents-logarithms-definitive-v6

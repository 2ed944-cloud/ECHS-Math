name: Lesson Studio integration
on:
  pull_request:
    paths:
      - 'lesson-studio.html'
      - 'css/lesson-studio.css'
      - 'js/lesson-studio/**'
      - 'js/lesson-runtime/**'
      - 'js/institution-client.js'
      - 'schemas/**'
      - 'supabase/functions/lesson-api/**'
      - 'tools/lesson-studio/**'
      - '.github/workflows/lesson-studio.yml'
  push:
    branches: [main]
    paths:
      - 'lesson-studio.html'
      - 'css/lesson-studio.css'
      - 'js/lesson-studio/**'
      - 'js/lesson-runtime/**'
      - 'js/institution-client.js'
      - 'schemas/**'
      - 'supabase/functions/lesson-api/**'
      - 'tools/lesson-studio/**'
      - '.github/workflows/lesson-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: |
          npx --yes pnpm@11.19.0 --dir tools/lesson-runtime install --frozen-lockfile --ignore-scripts
          npm ci --prefix question-bank/official/tools
          npx --prefix question-bank/official/tools playwright install --with-deps chromium-headless-shell
      - name: Validate model, persistence state and transport
        run: |
          node tools/lesson-studio/test-draft-model.mjs
          node tools/lesson-studio/test-draft-session.mjs
          node tools/lesson-studio/test-api-client.mjs
      - name: Exercise the authenticated Studio in Chromium
        run: node tools/lesson-studio/test-studio-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-studio-evidence
          path: artifacts/lesson-studio/
          retention-days: 14

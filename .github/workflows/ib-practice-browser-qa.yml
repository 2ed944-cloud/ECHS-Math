name: IB Practice Browser QA

on:
  pull_request:
    paths:
      - ".github/workflows/ib-practice-browser-qa.yml"
      - "data/ib-math-ai-lesson-catalog.json"
      - "question-bank/private-sources/data/ib-live-mapping-summary.json"
      - "question-bank/practice.html"
      - "question-bank/js/practice-global-bridge.js"
      - "question-bank/js/private-bank-practice.js"
      - "question-bank/js/ib-private-bank-lesson-aliases.js"
      - "question-bank/js/practice.js"
      - "tools/verify_ib_practice_browser.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHROME_PATH: /usr/bin/google-chrome
      ECHS_LIVE_URL: https://2ed944-cloud.github.io/ECHS-Math
      ECHS_ROUTE_BRANCH: "1"
      ECHS_DIAG_SESSION_FILE: /tmp/echs-ib-browser-session.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify every visible IB unit and lesson mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers={'apikey':key,'authorization':f'Bearer {key}'}
          allowed_trust={'publisher_key_direct','student_ready_verified'}

          catalog=json.load(open('data/ib-math-ai-lesson-catalog.json',encoding='utf-8'))
          expected={}
          for unit in catalog.get('units',[]):
              unit_number=int(unit['unit'])
              for lesson in unit.get('lessons',[]):
                  record={'unit':unit_number,'catalogue_skill':str(lesson.get('skill_id') or '')}
                  expected[str(lesson['lesson_key'])]=record
                  number=str(lesson.get('number') or '')
                  if number and number!='0':expected[number]=record
                  for delivery in lesson.get('delivery_lesson_numbers',[]):expected[str(delivery)]=record

          def request_json(url,extra_headers=None,retries=6):
              last=None
              for attempt in range(retries):
                  try:
                      request=urllib.request.Request(url,headers={**headers,**(extra_headers or {})})
                      with urllib.request.urlopen(request,timeout=180) as response:return json.load(response)
                  except urllib.error.HTTPError as error:
                      last=error
                      if error.code not in (408,425,429,500,502,503,504) or attempt+1>=retries:
                          detail=error.read().decode(errors='replace')[:1000]
                          raise RuntimeError(f'HTTP {error.code}: {detail}') from error
                  except (urllib.error.URLError,TimeoutError) as error:
                      last=error
                      if attempt+1>=retries:raise
                  time.sleep(1.5*(attempt+1))
              raise last

          def rows(page_size=500):
              output=[];offset=0
              select='organization_id,question_id,bank_code,course_mappings,course_keys,lesson_keys,skill_candidates,student_visible,mapping_verified,trust_tier'
              while True:
                  query=urllib.parse.urlencode({'select':select,'order':'organization_id.asc,question_id.asc'},safe=',.*()[]:{}"')
                  page=request_json(f'{base}/rest/v1/private_bank_questions?{query}',{'range':f'{offset}-{offset+page_size-1}'})
                  output.extend(page)
                  if len(page)<page_size:return output
                  offset+=len(page)

          issues=collections.Counter();units=collections.Counter();lessons=collections.Counter();banks=collections.Counter();organizations=set();eligible=0
          for row in rows():
              mappings=[mapping for mapping in (row.get('course_mappings') or []) if str((mapping or {}).get('course') or '')=='ib-math-ai']
              if not mappings:continue
              is_eligible=row.get('student_visible') is True and row.get('mapping_verified') is True and str(row.get('trust_tier') or '') in allowed_trust
              if not is_eligible:
                  issues['ib_mapping_present_but_not_student_eligible']+=1
                  continue
              eligible+=1;organizations.add(str(row.get('organization_id') or ''));banks[str(row.get('bank_code') or 'UNKNOWN')]+=1
              if len(mappings)!=1:issues['multiple_ib_mappings_on_visible_question']+=1
              for mapping in mappings:
                  lesson=str((mapping or {}).get('lesson_key') or '')
                  title=str((mapping or {}).get('lesson_title') or '')
                  skill=str((mapping or {}).get('skill_key') or '')
                  unit=(mapping or {}).get('unit')
                  lesson_expected=expected.get(lesson)
                  lessons[lesson or 'MISSING']+=1;units[str(unit)]+=1
                  if not lesson_expected:
                      issues['lesson_not_in_official_catalogue']+=1
                      continue
                  if int(unit if unit is not None else -999)!=lesson_expected['unit']:issues['unit_does_not_match_catalogue_lesson']+=1
                  if not title:issues['missing_lesson_title']+=1
                  if not skill:issues['missing_skill_key']+=1
                  if (mapping or {}).get('mapping_verified') is not True:issues['mapping_object_not_verified']+=1
                  if 'ib-math-ai' not in (row.get('course_keys') or []):issues['missing_course_index']+=1
                  if f'ib-math-ai:{lesson}' not in (row.get('lesson_keys') or []):issues['missing_lesson_index']+=1
                  if skill and skill not in (row.get('skill_candidates') or []):issues['missing_skill_index']+=1

          summary=json.load(open('question-bank/private-sources/data/ib-live-mapping-summary.json',encoding='utf-8'))
          actual_units={key:value for key,value in sorted(units.items(),key=lambda item:int(item[0]))}
          expected_units={str(key):int(value) for key,value in (summary.get('unit_counts') or {}).items()}
          if int(summary.get('live_question_rows') or -1)!=eligible:issues['committed_question_total_stale']+=1
          if int(summary.get('live_lesson_keys') or -1)!=len(lessons):issues['committed_lesson_total_stale']+=1
          if expected_units!=actual_units:issues['committed_unit_counts_stale']+=1

          result={
              'official_catalogue_keys':len(expected),
              'organizations':len([value for value in organizations if value]),
              'visible_verified_questions':eligible,
              'live_lesson_keys':len(lessons),
              'unit_counts':actual_units,
              'bank_counts':dict(sorted(banks.items())),
              'issues':dict(sorted(issues.items())),
          }
          print('IB_VISIBLE_MAPPING_AUDIT=')
          print(json.dumps(result,indent=2,sort_keys=True))
          if sum(issues.values()):raise SystemExit(f'IB catalogue mapping audit failed with {sum(issues.values())} issue(s)')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.54.1

      - name: Create ephemeral production staff session
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, hashlib, json, os, secrets, urllib.parse, urllib.request
          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers={'apikey':key,'authorization':f'Bearer {key}','content-type':'application/json'}
          def call(path,method='GET',body=None):
              data=None if body is None else json.dumps(body).encode()
              request=urllib.request.Request(base+path,headers=headers,method=method,data=data)
              with urllib.request.urlopen(request,timeout=90) as response:
                  raw=response.read().decode().strip()
                  return json.loads(raw) if raw else None
          packages=call('/rest/v1/private_bank_packages?select=organization_id,bank_code,manifest') or []
          orgs={str(row.get('organization_id')) for row in packages if 'ib-math-ai' in set((row.get('manifest') or {}).get('target_courses') or []) or str(row.get('bank_code') or '').startswith('IBAI-')}
          query=urllib.parse.urlencode({'select':'id,organization_id,role,status,username,display_name','role':'in.(admin,teacher)','status':'eq.active','order':'role.asc'},safe=',.()')
          accounts=call('/rest/v1/accounts?'+query) or []
          account=next((row for row in accounts if str(row.get('organization_id')) in orgs),None)
          if not account: raise SystemExit('No staff account in IB package organization')
          token='qa-'+secrets.token_urlsafe(40)
          token_hash=hashlib.sha256(token.encode()).hexdigest()
          expires=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(minutes=10)).isoformat()
          result=call('/rest/v1/rpc/api_create_session','POST',{'p_account_id':account['id'],'p_token_hash':token_hash,'p_expires_at':expires,'p_user_agent_hash':'ib-browser-qa','p_ip_hash':'github-actions'})
          if not result: raise SystemExit('Temporary staff session was not created')
          safe_account={name:account.get(name) for name in ('id','organization_id','role','username','display_name')}
          safe_account['organization_name']='ECHS Mathematics'
          with open(os.environ['ECHS_DIAG_SESSION_FILE'],'w') as file: json.dump({'token':token,'token_hash':token_hash,'expires_at':expires,'account':safe_account},file)
          PY

      - name: Verify uploaded banks render in browser
        run: node tools/verify_ib_practice_browser.mjs

      - name: Revoke ephemeral session
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          path=os.environ['ECHS_DIAG_SESSION_FILE']
          if not os.path.exists(path): raise SystemExit(0)
          session=json.load(open(path))
          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          body=json.dumps({'p_token_hash':session['token_hash']}).encode()
          request=urllib.request.Request(base+'/rest/v1/rpc/api_revoke_session',headers={'apikey':key,'authorization':f'Bearer {key}','content-type':'application/json'},method='POST',data=body)
          with urllib.request.urlopen(request,timeout=60) as response: response.read()
          PY

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ib-practice-browser-${{ github.run_number }}
          path: /tmp/ib-live-practice.png
          if-no-files-found: warn
          retention-days: 3

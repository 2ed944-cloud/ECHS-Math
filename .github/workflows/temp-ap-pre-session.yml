name: Temporary AP Precalculus Class Setup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-ap-pre-session.yml"

permissions:
  contents: read

concurrency:
  group: temporary-ap-precalculus-class-setup
  cancel-in-progress: false

jobs:
  create-class:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Create AP Precalculus class if absent
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {
              "apikey": key,
              "authorization": f"Bearer {key}",
              "content-type": "application/json",
          }

          account_query = urllib.parse.urlencode(
              {
                  "select": "id,organization_id",
                  "role": "eq.admin",
                  "status": "eq.active",
                  "order": "created_at.asc",
                  "limit": "1",
              },
              safe=",",
          )
          request = urllib.request.Request(
              f"{base}/rest/v1/accounts?{account_query}",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              accounts = json.load(response)
          if not accounts:
              raise SystemExit("No active administrator account is available")

          class_query = urllib.parse.urlencode(
              {
                  "select": "id,name,course_key,academic_year,section",
                  "organization_id": f"eq.{accounts[0]['organization_id']}",
                  "name": "ilike.AP Precalculus",
                  "status": "eq.active",
                  "limit": "1",
              },
              safe=",",
          )
          request = urllib.request.Request(
              f"{base}/rest/v1/classes?{class_query}",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              classes = json.load(response)

          created = False
          if classes:
              class_row = classes[0]
          else:
              body = json.dumps(
                  {
                      "organization_id": accounts[0]["organization_id"],
                      "name": "AP Precalculus",
                      "course_key": "ap-precalculus",
                      "academic_year": "2026-2027",
                      "section": "1",
                      "status": "active",
                      "created_by": accounts[0]["id"],
                  }
              ).encode("utf-8")
              create_headers = {**headers, "prefer": "return=representation"}
              request = urllib.request.Request(
                  f"{base}/rest/v1/classes",
                  data=body,
                  method="POST",
                  headers=create_headers,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  created_rows = json.load(response)
              if not created_rows:
                  raise SystemExit("Class creation returned no record")
              class_row = created_rows[0]
              created = True

          with open("class-result.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "ok": True,
                      "created": created,
                      "class_id": class_row["id"],
                      "class_name": class_row["name"],
                      "course_key": class_row["course_key"],
                      "academic_year": class_row.get("academic_year"),
                      "section": class_row.get("section"),
                  },
                  handle,
              )
          print("AP Precalculus class is ready.")
          PY

      - name: Upload class result
        uses: actions/upload-artifact@v4
        with:
          name: temporary-ap-pre-class-${{ github.run_id }}
          path: class-result.json
          if-no-files-found: error
          retention-days: 1


name: Temporary AP Calculus Grade 12 Enrollment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-ap-calculus-inspect.yml"

permissions:
  contents: read

jobs:
  enroll-grade-12:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Enroll every active Grade 12 student in AP Calculus sessions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {
              "apikey": key,
              "authorization": f"Bearer {key}",
              "content-type": "application/json",
          }

          class_query = urllib.parse.urlencode(
              {
                  "select": "id,name,course_key,academic_year,section,status",
                  "status": "eq.active",
                  "order": "name.asc",
              },
              safe=",",
          )
          request = urllib.request.Request(
              f"{base}/rest/v1/classes?{class_query}",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              all_classes = json.load(response)
          classes = []
          for row in all_classes:
              haystack = f"{row.get('name', '')} {row.get('course_key', '')}".lower()
              if "calculus" in haystack and "precalculus" not in haystack:
                  classes.append(row)
          if not classes:
              raise SystemExit("No active AP Calculus session exists")

          account_query = urllib.parse.urlencode(
              {
                  "select": "id,username",
                  "role": "eq.student",
                  "status": "eq.active",
                  "grade": "eq.12",
                  "order": "created_at.asc",
              },
              safe=",",
          )
          request = urllib.request.Request(
              f"{base}/rest/v1/accounts?{account_query}",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              all_grade12 = json.load(response)
          grade12 = [
              row
              for row in all_grade12
              if str(row.get("username", "")).lower().startswith("g12.")
          ]
          if len(grade12) != 19:
              raise SystemExit(
                  f"Expected 19 managed Grade 12 accounts, found {len(grade12)}"
              )
          target_ids = {row["id"] for row in grade12}

          results = []
          for class_row in classes:
              membership_query = urllib.parse.urlencode(
                  {
                      "select": "account_id",
                      "class_id": f"eq.{class_row['id']}",
                      "membership_role": "eq.student",
                  },
                  safe=",",
              )
              request = urllib.request.Request(
                  f"{base}/rest/v1/class_memberships?{membership_query}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  before = json.load(response)
              existing_ids = {row["account_id"] for row in before}
              missing_ids = sorted(target_ids - existing_ids)

              if missing_ids:
                  body = json.dumps(
                      [
                          {
                              "class_id": class_row["id"],
                              "account_id": account_id,
                              "membership_role": "student",
                          }
                          for account_id in missing_ids
                      ]
                  ).encode("utf-8")
                  upsert_headers = {
                      **headers,
                      "prefer": "resolution=merge-duplicates,return=minimal",
                  }
                  request = urllib.request.Request(
                      f"{base}/rest/v1/class_memberships?on_conflict=class_id,account_id",
                      data=body,
                      method="POST",
                      headers=upsert_headers,
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      response.read()

              request = urllib.request.Request(
                  f"{base}/rest/v1/class_memberships?{membership_query}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  after = json.load(response)
              after_ids = {row["account_id"] for row in after}
              verified_target = len(target_ids & after_ids)
              if verified_target != 19:
                  raise SystemExit(
                      f"Enrollment verification failed for {class_row['name']}: {verified_target}/19"
                  )
              results.append(
                  {
                      "class_name": class_row["name"],
                      "section": class_row.get("section"),
                      "academic_year": class_row.get("academic_year"),
                      "already_enrolled": len(target_ids & existing_ids),
                      "added": len(missing_ids),
                      "verified_grade12_members": verified_target,
                      "total_student_members": len(after_ids),
                  }
              )

          result = {
              "ok": True,
              "grade12_accounts": len(target_ids),
              "session_count": len(classes),
              "sessions": results,
          }
          with open("enrollment-result.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle)
          print(
              f"Verified {len(target_ids)} Grade 12 students in {len(classes)} AP Calculus session(s)."
          )
          PY

      - name: Upload enrollment result
        uses: actions/upload-artifact@v4
        with:
          name: temporary-ap-calculus-enrollment-${{ github.run_id }}
          path: enrollment-result.json
          if-no-files-found: error
          retention-days: 1

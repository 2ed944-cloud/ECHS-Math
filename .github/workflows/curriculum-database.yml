name: Curriculum database contracts
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "curriculum/registry/**"
      - "js/curriculum-versions.mjs"
      - "tools/test_curriculum_database.py"
      - "tools/test_curriculum_registry.mjs"
      - ".github/workflows/curriculum-database.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres15:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: echs_curriculum_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d echs_curriculum_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned database test driver
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Validate isolated registry behavior
        run: node tools/test_curriculum_registry.mjs
      - name: Execute full migration chain and database contracts
        env:
          ECHS_CURRICULUM_TEST_DSN: postgresql://postgres:isolated-fixture-only@127.0.0.1:5432/echs_curriculum_test_ci
        run: python tools/test_curriculum_database.py --report reports/curriculum-db-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curriculum-database-results
          path: reports/curriculum-db-tests.json
          if-no-files-found: warn

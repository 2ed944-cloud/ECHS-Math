name: Phase 3 Institutional Platform QA

on:
  pull_request:
    paths:
      - "login.html"
      - "index.html"
      - "privacy.html"
      - "manifest.json"
      - "sw.js"
      - "robots.txt"
      - ".gitignore"
      - "config/**"
      - "css/institution.css"
      - "js/institution-*.js"
      - "js/login.js"
      - "question-bank/admin.html"
      - "question-bank/student.html"
      - "question-bank/teacher.html"
      - "question-bank/parent.html"
      - "question-bank/js/admin-accounts.js"
      - "question-bank/js/student-cloud.js"
      - "question-bank/js/teacher-cloud.js"
      - "question-bank/js/parent-cloud.js"
      - "supabase/**"
      - "templates/**"
      - "tools/bootstrap_institution.py"
      - "tools/validate_institution_platform.py"
      - ".github/workflows/institution-platform.yml"
      - ".github/workflows/deploy-institution-backend.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-premium-experience:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/phase-3-institutional-platform-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out premium branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/phase-3-institutional-platform-20260726
          fetch-depth: 0

      - name: Install verified premium experience payload
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .premium-payload/part-00 ]; then
            echo "Premium payload already applied."
            exit 0
          fi
          cat .premium-payload/part-* | base64 --decode > /tmp/echs-premium-payload.tar.gz
          echo "d0345eb94b0d4dde30b91ec4b577011713f6b8f3e7a54a48b62a1030be6fd33f  /tmp/echs-premium-payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/echs-premium-payload.tar.gz -C .
          python3 tools/validate_premium_experience.py
          node --check js/institution-experience.js
          node --check js/login.js
          node --check question-bank/js/student-cloud.js
          node --check question-bank/js/teacher-cloud.js
          node --check question-bank/js/parent-cloud.js
          node --check question-bank/js/admin-accounts.js
          node --check sw.js
          rm -rf .premium-payload
          rm -f .github/workflows/apply-premium-payload.yml
          git show HEAD^:.github/workflows/institution-platform.yml > .github/workflows/institution-platform.yml
          git config user.name "ECHS Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build the Phase 4 premium role experiences"
          git push origin HEAD:chatgpt/phase-3-institutional-platform-20260726

  validate-institution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate institutional security and integration
        run: python tools/validate_institution_platform.py

      - name: Re-run Phase 1 and Phase 2 release gates
        run: |
          python tools/validate_platform_phase1.py
          python tools/validate_learning_system.py
          node tools/test_learning_system.mjs

      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/account-api/index.ts
          deno check supabase/functions/institution-api/index.ts
          deno check supabase/functions/learning-sync/index.ts

      - name: Validate JSON, TOML and Python files
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m json.tool config/institution.json >/dev/null
          python -m json.tool config/institution.example.json >/dev/null
          python -m py_compile tools/bootstrap_institution.py tools/validate_institution_platform.py
          python - <<'PY'
          import tomllib
          with open('supabase/config.toml','rb') as handle:
              tomllib.load(handle)
          print('supabase/config.toml: PASS')
          PY

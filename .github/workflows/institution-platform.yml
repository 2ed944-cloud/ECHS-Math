name: Phase 3 Institutional Platform QA

on:
  pull_request:
    paths:
      - "login.html"
      - "setup.html"
      - "index.html"
      - "privacy.html"
      - "manifest.json"
      - "sw.js"
      - "robots.txt"
      - ".gitignore"
      - "config/**"
      - "css/institution.css"
      - "css/institution-premium.css"
      - "css/institution-setup.css"
      - "css/mastery-evidence.css"
      - "data/knowledge-graph/**"
      - "data/ib-math-ai-lesson-catalog.json"
      - "js/institution-*.js"
      - "js/login.js"
      - "question-bank/admin.html"
      - "question-bank/school-control.html"
      - "question-bank/student.html"
      - "question-bank/teacher.html"
      - "question-bank/parent.html"
      - "question-bank/data/course-routing.json"
      - "question-bank/js/admin-accounts.js"
      - "question-bank/js/student-cloud.js"
      - "question-bank/js/teacher-cloud.js"
      - "question-bank/js/teacher-evidence-heatmap.js"
      - "question-bank/js/parent-cloud.js"
      - "question-bank/private-sources/**"
      - "question-bank/official/admin/**"
      - "platform/PHASE_4_PREMIUM_EXPERIENCE.md"
      - "platform/PHASE_5_INITIAL_SETUP.md"
      - "supabase/**"
      - "templates/**"
      - "tools/bootstrap_institution.py"
      - "tools/capture_private_bank_center.mjs"
      - "tools/test_institution_identity_mount.mjs"
      - "tools/upload_private_bank_package.py"
      - "tools/process_teacher_upload_request.py"
      - "tools/validate_upload_manager.py"
      - "tools/validate_initial_setup.py"
      - "tools/validate_institution_platform.py"
      - "tools/validate_mastery_foundation.py"
      - "tools/validate_mastery_guards.py"
      - "tools/validate_private_bank_foundation.py"
      - "tools/validate_private_bank_packages.py"
      - "tools/validate_supabase_migration_versions.py"
      - "tools/validate_production_activation.py"
      - "tools/validate_premium_experience.py"
      - ".github/workflows/institution-platform.yml"
      - ".github/workflows/initial-setup.yml"
      - ".github/workflows/deploy-institution-backend.yml"
      - ".github/workflows/process-teacher-uploads.yml"
      - ".github/workflows/platform-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-institution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Reject duplicate Supabase migration versions
        run: python tools/validate_supabase_migration_versions.py

      - name: Validate initial setup security and integration
        run: python tools/validate_initial_setup.py

      - name: Validate institutional security and integration
        run: |
          if python - <<'PY'
          import json
          with open('config/institution.json', encoding='utf-8') as handle:
              raise SystemExit(0 if json.load(handle).get('enabled') is True else 1)
          PY
          then
            python tools/validate_production_activation.py
          else
            python tools/validate_institution_platform.py
          fi

      - name: Verify identity rendering preserves the document root
        run: node tools/test_institution_identity_mount.mjs

      - name: Validate premium role experiences
        run: python tools/validate_premium_experience.py

      - name: Validate Question Trust, Knowledge Graph and Mastery 2.0
        run: |
          python tools/validate_mastery_foundation.py
          python tools/validate_mastery_guards.py

      - name: Validate private Blackboard banks and course alignment
        run: python tools/validate_private_bank_foundation.py

      - name: Validate Teacher Upload Manager
        run: python tools/validate_upload_manager.py

      - name: Re-run Phase 1 and Phase 2 release gates
        run: |
          python tools/validate_platform_phase1.py
          python tools/validate_learning_system.py
          node tools/test_learning_system.mjs

      - name: Type-check Supabase Edge Functions
        id: deno_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            deno check supabase/functions/account-api/index.ts
            deno check supabase/functions/institution-api/index.ts
            deno check supabase/functions/learning-sync/index.ts
            deno check supabase/functions/mastery-evidence/index.ts
            deno check supabase/functions/private-bank-api/index.ts
            deno check supabase/functions/upload-manager-api/index.ts
            deno check supabase/functions/setup-api/index.ts
          } 2>&1 | tee deno-check.log

      - name: Upload Deno type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-deno-check
          path: deno-check.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Deno type-check result
        if: steps.deno_check.outcome != 'success'
        run: |
          echo "Deno type-check failed. See the institutional-deno-check artifact." >&2
          exit 1

      - name: Validate JSON, TOML, JavaScript and Python files
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m json.tool config/institution.json >/dev/null
          python -m json.tool config/institution.example.json >/dev/null
          python -m json.tool data/knowledge-graph/schema-v1.json >/dev/null
          python -m json.tool data/knowledge-graph/ap-calculus-unit-1.json >/dev/null
          python -m json.tool data/knowledge-graph/ap-precalculus-v1.json >/dev/null
          python -m json.tool data/knowledge-graph/ib-math-ai-v1.json >/dev/null
          python -m json.tool data/ib-math-ai-lesson-catalog.json >/dev/null
          python -m json.tool question-bank/data/course-routing.json >/dev/null
          python -m json.tool question-bank/official/admin/data/question-trust-manifest.json >/dev/null
          python -m json.tool question-bank/private-sources/data/private-bank-registry.json >/dev/null
          python -m json.tool question-bank/private-sources/data/ap-precalculus-crosswalk.json >/dev/null
          python -m json.tool question-bank/private-sources/data/ib-math-ai-crosswalk.json >/dev/null
          python -m json.tool question-bank/private-sources/config/at9.json >/dev/null
          python -m json.tool question-bank/private-sources/config/ca9.json >/dev/null
          python -m json.tool question-bank/private-sources/config/ca9b.json >/dev/null
          python -m json.tool question-bank/private-sources/config/acs10.json >/dev/null
          python -m py_compile tools/bootstrap_institution.py tools/upload_private_bank_package.py tools/process_teacher_upload_request.py tools/validate_upload_manager.py tools/validate_initial_setup.py tools/validate_institution_platform.py tools/validate_mastery_foundation.py tools/validate_mastery_guards.py tools/validate_private_bank_foundation.py tools/validate_private_bank_packages.py tools/validate_supabase_migration_versions.py tools/validate_production_activation.py tools/validate_premium_experience.py question-bank/private-sources/tools/import_blackboard_qti_secure.py
          node --check tools/capture_private_bank_center.mjs
          node --check question-bank/official/admin/js/upload-manager.js
          python - <<'PY'
          import tomllib
          with open('supabase/config.toml','rb') as handle:
              tomllib.load(handle)
          print('supabase/config.toml: PASS')
          PY

name: Phase 3 Institutional Platform QA

on:
  pull_request:
    paths:
      - "login.html"
      - "setup.html"
      - "index.html"
      - "privacy.html"
      - "manifest.json"
      - "sw.js"
      - "robots.txt"
      - ".gitignore"
      - "config/**"
      - "css/institution.css"
      - "css/institution-premium.css"
      - "css/institution-setup.css"
      - "css/mastery-evidence.css"
      - "data/knowledge-graph/**"
      - "js/institution-*.js"
      - "js/login.js"
      - "question-bank/admin.html"
      - "question-bank/school-control.html"
      - "question-bank/student.html"
      - "question-bank/teacher.html"
      - "question-bank/parent.html"
      - "question-bank/js/admin-accounts.js"
      - "question-bank/js/student-cloud.js"
      - "question-bank/js/teacher-cloud.js"
      - "question-bank/js/teacher-evidence-heatmap.js"
      - "question-bank/js/parent-cloud.js"
      - "question-bank/official/admin/question-trust.html"
      - "question-bank/official/admin/js/question-trust.js"
      - "question-bank/official/admin/data/question-trust-manifest.json"
      - "platform/PHASE_4_PREMIUM_EXPERIENCE.md"
      - "platform/PHASE_5_INITIAL_SETUP.md"
      - "supabase/**"
      - "templates/**"
      - "tools/bootstrap_institution.py"
      - "tools/test_institution_identity_mount.mjs"
      - "tools/validate_initial_setup.py"
      - "tools/validate_institution_platform.py"
      - "tools/validate_mastery_foundation.py"
      - "tools/validate_mastery_guards.py"
      - "tools/validate_production_activation.py"
      - "tools/validate_premium_experience.py"
      - ".github/workflows/institution-platform.yml"
      - ".github/workflows/initial-setup.yml"
      - ".github/workflows/deploy-institution-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-institution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate initial setup security and integration
        run: python tools/validate_initial_setup.py

      - name: Validate institutional security and integration
        run: |
          if python - <<'PY'
          import json
          with open('config/institution.json', encoding='utf-8') as handle:
              raise SystemExit(0 if json.load(handle).get('enabled') is True else 1)
          PY
          then
            python tools/validate_production_activation.py
          else
            python tools/validate_institution_platform.py
          fi

      - name: Verify identity rendering preserves the document root
        run: node tools/test_institution_identity_mount.mjs

      - name: Validate premium role experiences
        run: python tools/validate_premium_experience.py

      - name: Validate Question Trust, Knowledge Graph and Mastery 2.0
        run: |
          python tools/validate_mastery_foundation.py
          python tools/validate_mastery_guards.py

      - name: Re-run Phase 1 and Phase 2 release gates
        run: |
          python tools/validate_platform_phase1.py
          python tools/validate_learning_system.py
          node tools/test_learning_system.mjs

      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/account-api/index.ts
          deno check supabase/functions/institution-api/index.ts
          deno check supabase/functions/learning-sync/index.ts
          deno check supabase/functions/mastery-evidence/index.ts
          deno check supabase/functions/setup-api/index.ts

      - name: Validate JSON, TOML and Python files
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m json.tool config/institution.json >/dev/null
          python -m json.tool config/institution.example.json >/dev/null
          python -m json.tool data/knowledge-graph/schema-v1.json >/dev/null
          python -m json.tool data/knowledge-graph/ap-calculus-unit-1.json >/dev/null
          python -m json.tool question-bank/official/admin/data/question-trust-manifest.json >/dev/null
          python -m py_compile tools/bootstrap_institution.py tools/validate_initial_setup.py tools/validate_institution_platform.py tools/validate_mastery_foundation.py tools/validate_mastery_guards.py tools/validate_production_activation.py tools/validate_premium_experience.py
          python - <<'PY'
          import tomllib
          with open('supabase/config.toml','rb') as handle:
              tomllib.load(handle)
          print('supabase/config.toml: PASS')
          PY

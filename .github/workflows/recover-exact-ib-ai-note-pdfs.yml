name: Recover exact IB AI note PDFs
on:
  push:
    branches:
      - agent/ib-ai-dual-notes-merge-final
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover exact known blobs when available
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          mkdir -p notes/ib-math-ai/unit-1
          found12=no
          found13=no
          if git cat-file -e '01d6faebfe70f315612d5dab52d022687059d518^{blob}' 2>/dev/null; then
            git cat-file blob 01d6faebfe70f315612d5dab52d022687059d518 > notes/ib-math-ai/unit-1/IB_AI_SL_1.2_Arithmetic_Sequences_Full_Notes_Student.pdf
            found12=yes
          fi
          if git cat-file -e 'bc3f7d275d687cdadf23445d3a50142b01f14348^{blob}' 2>/dev/null; then
            git cat-file blob bc3f7d275d687cdadf23445d3a50142b01f14348 > notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.pdf
            found13=yes
          fi
          printf '1.2=%s\n1.3=%s\n' "$found12" "$found13" > .ib-ai-pdf-recovery-report
          rm -f .github/workflows/recover-exact-ib-ai-note-pdfs.yml
          rm -f .github/workflows/verify-ib-ai-pdf-transfer.yml
          rm -f .github/workflows/verify-ib-ai-pdf-transfer-marker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover exact IB AI notes PDF blobs when available' || true
          git push

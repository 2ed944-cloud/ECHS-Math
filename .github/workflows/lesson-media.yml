name: Private lesson media contracts
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/lesson-api/**"
      - "schemas/**"
      - "js/lesson-runtime/**"
      - "tools/lesson-runtime/**"
      - "tools/test_lesson_media*"
      - "tools/test_lesson_asset*"
      - "tools/test_lesson_persistence*"
      - "tools/test_lesson_content_v2*"
      - "tools/lesson_persistence_rpc_fixture.py"
      - ".github/workflows/lesson-media.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/lesson-api/**"
      - "schemas/**"
      - "js/lesson-runtime/**"
      - "tools/lesson-runtime/**"
      - "tools/test_lesson_media*"
      - "tools/test_lesson_asset*"
      - "tools/test_lesson_persistence*"
      - "tools/test_lesson_content_v2*"
      - "tools/lesson_persistence_rpc_fixture.py"
      - ".github/workflows/lesson-media.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lesson-media-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canonical-and-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Install exact schema and math dependencies
        run: npx --yes pnpm@11.19.0 --dir tools/lesson-runtime install --frozen-lockfile --ignore-scripts
      - name: Preserve generated validators and original document/authoring contracts
        run: |
          node tools/lesson-runtime/build-validator.mjs --check
          node tools/lesson-runtime/build-server-validator.mjs --check
          node tools/lesson-runtime/test-schema.mjs
          node tools/lesson-runtime/test-server-document.mjs
          node tools/lesson-runtime/test-content-v2.mjs
          node tools/test_lesson_persistence_api.mjs
      - name: Verify typed media, binary inspection, private transport and actual API integration
        run: |
          node tools/lesson-runtime/test-media-content.mjs
          node tools/lesson-runtime/test-asset-contract.mjs
          node tools/test_lesson_asset_bytes.mjs
          node tools/test_lesson_asset_storage.mjs
          node tools/test_lesson_media_api.mjs
      - name: Check exact deployable function and frozen dependencies
        run: deno check --frozen --config supabase/functions/lesson-api/deno.json supabase/functions/lesson-api/index.ts
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact browser and math dependencies
        run: |
          npm --prefix question-bank/official/tools ci
          npx --yes pnpm@11.19.0 --dir tools/lesson-runtime install --frozen-lockfile --ignore-scripts
          npx --prefix question-bank/official/tools playwright install --with-deps chromium-headless-shell
      - name: Exercise media rendering and original institutional delivery guards
        run: |
          node tools/lesson-runtime/test-media-renderer.mjs
          node tools/lesson-runtime/test-institutional-media.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-media-browser-evidence
          path: artifacts/lesson-media/
          retention-days: 14
  postgres15:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: echs_lesson_test_media_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d echs_lesson_test_media_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ECHS_LESSON_TEST_DSN: postgresql://postgres:isolated-fixture-only@127.0.0.1:5432/echs_lesson_test_media_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact database test driver
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Install exact mathematics and schema dependencies
        run: npx --yes pnpm@11.19.0 --dir tools/lesson-runtime install --frozen-lockfile --ignore-scripts
      - name: Preserve 235 database checks on all original 22 migrations
        run: python tools/test_lesson_persistence_database.py --report reports/lesson-persistence-database.json
      - name: Preserve eight original actual HTTP and SQL groups
        run: node tools/test_lesson_persistence_e2e.mjs
      - name: Apply migration23 and preserve 203 content-v2 database checks
        run: python tools/test_lesson_content_v2_database.py --baseline-report reports/lesson-persistence-database.json --report reports/lesson-content-v2-database.json
      - name: Preserve seven content-v2 actual handler/transport/SQL groups
        run: node tools/test_lesson_content_v2_e2e.mjs
      - name: Apply migration24 and verify actual media RLS, scope, immutability and lifecycle races
        run: python tools/test_lesson_media_database.py --baseline-report reports/lesson-content-v2-database.json --report reports/lesson-media-database.json
      - name: Verify media HTTP/production transports against real PostgreSQL and isolated Storage adapter
        run: node tools/test_lesson_media_e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-media-database-results
          path: |
            reports/lesson-persistence-*.json
            reports/lesson-content-v2-*.json
            reports/lesson-media-*.json
          if-no-files-found: warn

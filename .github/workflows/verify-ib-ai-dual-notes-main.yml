name: Verify merged IB AI dual notes
on:
  push:
    branches:
      - main
permissions:
  contents: write
  issues: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact files and Resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object notes/ib-math-ai/unit-1/IB_AI_SL_1.2_Arithmetic_Sequences_Full_Notes_Student.pdf)" = "01d6faebfe70f315612d5dab52d022687059d518"
          test "$(git hash-object notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.pdf)" = "bc3f7d275d687cdadf23445d3a50142b01f14348"
          echo 'd53336db0ded99824629decbfd4b53afa938b8479b31fa07e93841fc46dcaa63  notes/ib-math-ai/unit-1/IB_AI_SL_1.2_Arithmetic_Sequences_Full_Notes_Student.pdf' | sha256sum -c -
          echo '8a8934ab9c49c0e6ee2a1f5f4417d4839aa1aab2998cac758216ec3fefcfb2e4  notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.pdf' | sha256sum -c -
          grep -F 'Full Notes 1.2 · Lesson-Synchronised Edition' data/ib-math-ai-unit-1-update.js
          grep -F 'Full Notes 1.2 · Original Coloured LaTeX PDF' data/ib-math-ai-unit-1-update.js
          grep -F 'Full Notes 1.3 · Lesson-Synchronised Edition' data/ib-math-ai-unit-1-update.js
          grep -F 'Full Notes 1.3 · Original Coloured LaTeX PDF' data/ib-math-ai-unit-1-update.js
          ! grep -qi 'Teacher Key' data/ib-math-ai-unit-1-update.js
          grep -F 'Geometric Sequences and Series' notes/ib-math-ai/unit-1/IB_AI_SL_1.3_Geometric_Sequences_Full_Notes_Student.html

          python - <<'PY'
          import json, os, urllib.request
          repo='2ed944-cloud/ECHS-Math'
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          body={'body':'VERIFIED ON MAIN: Lessons 1.2 and 1.3 each expose the Lesson-Synchronised Edition and the Original Coloured LaTeX PDF. Both PDF SHA-256 values and Git blob SHAs match the original student PDFs; Teacher Key is not exposed in Resources.'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/210/comments',data=json.dumps(body).encode(),headers=headers,method='POST')
          urllib.request.urlopen(req).read()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/210',data=json.dumps({'state':'closed'}).encode(),headers=headers,method='PATCH')
          urllib.request.urlopen(req).read()
          PY

          rm -f .github/workflows/verify-ib-ai-dual-notes-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary IB AI dual-notes verifier'
          git push origin HEAD:main

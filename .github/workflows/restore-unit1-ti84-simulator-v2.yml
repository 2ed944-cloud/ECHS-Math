name: Restore Unit 1 TI-84 simulator v2

on:
  push:
    branches:
      - agent/restore-ti84-simulator-unit1
    paths:
      - '.github/workflows/restore-unit1-ti84-simulator-v2.yml'

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-ti84-simulator-unit1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wire simulator and repair GDC keyboard focus
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('lessons/ib-math-ai/unit-1')
          lessons=root/'lessons'
          targets=[
            'IB_AI_SL_1.2_arithmetic_sequences_ECHS.html',
            'IB_AI_SL_1.3_geometric_sequences_ECHS.html',
            'IB_AI_SL_1.4_financial_models_ECHS.html',
            'IB_AI_SL_1.5_logarithms_ECHS.html',
            'IB_AI_SL_1.6_technology_equations_ECHS.html',
          ]
          css='  <link rel="stylesheet" href="../assets/css/unit-1-ti84-simulator-v7.css">\n'
          js='  <script src="../data/unit-1-ti84-simulator-v7.js" defer></script>\n'
          for name in targets:
            p=lessons/name
            text=p.read_text(encoding='utf-8')
            if 'unit-1-ti84-simulator-v7.css' not in text:
              text=text.replace('</head>',css+'</head>',1)
            if 'unit-1-ti84-simulator-v7.js' not in text:
              text=text.replace('</body>',js+'</body>',1)
            p.write_text(text,encoding='utf-8',newline='\n')

          gdc=root/'data/unit-1-gdc-integration-v7.js'
          text=gdc.read_text(encoding='utf-8')
          old='<main class="gdc-v7-workspace"></main><footer><span>No iframe • no paid API • static/offline-safe</span><button class="gdc-v7-reveal" type="button">Reveal next stage</button></footer>'
          new='<main class="gdc-v7-workspace"></main><footer><span>GDC reasoning lab • TI‑84 simulator available</span><button class="gdc-v7-simulator" type="button">Open TI‑84 Simulator</button><button class="gdc-v7-reveal" type="button">Reveal next stage</button></footer>'
          if old in text:
            text=text.replace(old,new,1)
          text=text.replace(".filter(x=>!x.disabled) : []", ".filter(x=>!x.disabled&&!x.hidden&&x.getClientRects().length) : []")
          gdc.write_text(text,encoding='utf-8',newline='\n')
          PY

      - name: Update static QA for restored simulator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/qa_ib_ai_unit1_gdc_v7.py')
          text=p.read_text(encoding='utf-8')
          text=text.replace("css=(UNIT/'assets/css/unit-1-gdc-integration-v7.css').read_text(encoding='utf-8')", "css=(UNIT/'assets/css/unit-1-gdc-integration-v7.css').read_text(encoding='utf-8')\nsim_js=(UNIT/'data/unit-1-ti84-simulator-v7.js').read_text(encoding='utf-8')\nsim_css=(UNIT/'assets/css/unit-1-ti84-simulator-v7.css').read_text(encoding='utf-8')")
          text=text.replace("need('@media(max-width:720px)' in css,'mobile CSS missing')", "need('@media(max-width:720px)' in css,'mobile CSS missing')\nneed('ti84calc.com/ti84calc' in sim_js and '<iframe' in sim_js,'shared TI-84 simulator runtime missing')\nneed('keyboardFocusTrap:true' in sim_js,'simulator keyboard focus trap missing')\nneed('@media(max-width:720px)' in sim_css,'simulator mobile CSS missing')")
          text=text.replace("need(text.count('unit-1-gdc-integration-v7.js')==1,f'{n}: duplicate JS wiring')", "need(text.count('unit-1-gdc-integration-v7.js')==1,f'{n}: duplicate JS wiring')\n    need('../assets/css/unit-1-ti84-simulator-v7.css' in text,f'{n}: simulator CSS not wired')\n    need('../data/unit-1-ti84-simulator-v7.js' in text,f'{n}: simulator JS not wired')\n    need(text.count('unit-1-ti84-simulator-v7.js')==1,f'{n}: duplicate simulator JS wiring')")
          text=text.replace("need(sum(18+3*(n-1) for n in range(1,38))==4144 and sum(18+3*(n-1) for n in range(1,39))==4351,'auditorium totals wrong')", "need(sum(18+3*(n-1) for n in range(1,48))==4089 and sum(18+3*(n-1) for n in range(1,49))==4248,'auditorium totals wrong')")
          text=text.replace("for f in [UNIT/'data/unit-1-gdc-integration-v7.js',ROOT/'tools/browser_qa_ib_ai_unit1_gdc_v7.mjs']:", "for f in [UNIT/'data/unit-1-gdc-integration-v7.js',UNIT/'data/unit-1-ti84-simulator-v7.js',ROOT/'tools/browser_qa_ib_ai_unit1_gdc_v7.mjs']:")
          text=text.replace("'externalCalculatorDependencies':0", "'externalCalculatorDependencies':1,'simulatorProvider':'ti84calc.com'")
          p.write_text(text,encoding='utf-8',newline='\n')
          PY

      - name: Update Chromium QA for simulator and visible focusables
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/browser_qa_ib_ai_unit1_gdc_v7.mjs')
          text=p.read_text(encoding='utf-8')
          text=text.replace("await page.waitForSelector('.gdc-v7-launch',{timeout:12000});if(await page.locator('iframe').count())throw new Error('iframe present');", "await page.waitForSelector('.gdc-v7-launch',{timeout:12000});await page.waitForSelector('.u1-ti84-sim-launch',{timeout:12000});if(await page.locator('#u1-ti84-simulator iframe').count()!==1)throw new Error('shared simulator iframe missing');const simFrame=page.locator('#u1-ti84-simulator iframe');if((await simFrame.getAttribute('src'))!=='about:blank')throw new Error('simulator is not lazy-loaded');if(!/ti84calc\\.com\\/ti84calc/.test(await simFrame.getAttribute('data-src')||''))throw new Error('simulator provider missing');")
          text=text.replace("const first=page.locator('.gdc-v7-shell button,.gdc-v7-shell select').first();const last=page.locator('.gdc-v7-shell button,.gdc-v7-shell select').last();", "const visibleFocus=page.locator('.gdc-v7-shell button:visible,.gdc-v7-shell select:visible,.gdc-v7-shell a:visible');const first=visibleFocus.first();const last=visibleFocus.last();")
          text=text.replace("await page.keyboard.press('Escape');await page.waitForSelector('.gdc-v7-shell',{state:'detached'});", "await page.keyboard.press('Escape');await page.waitForSelector('.gdc-v7-shell',{state:'detached'});await page.locator('.u1-ti84-sim-launch').first().click();await page.waitForSelector('#u1-ti84-simulator.is-open');if(!((await simFrame.getAttribute('src'))||'').includes('ti84calc.com/ti84calc'))throw new Error('simulator did not load');const simVisible=page.locator('#u1-ti84-simulator button:visible,#u1-ti84-simulator a:visible');const simFirst=simVisible.first(),simLast=simVisible.last();await simFirst.focus();await page.keyboard.press('Shift+Tab');if(!(await simLast.evaluate(el=>el===document.activeElement)))throw new Error('simulator focus trap failed');await page.keyboard.press('Escape');if(await page.locator('#u1-ti84-simulator').evaluate(el=>el.classList.contains('is-open')))throw new Error('simulator did not close with Escape');")
          text=text.replace("if(external.some(x=>/ti84calc|desmos|geogebra/i.test(x)))throw new Error('external calculator request');", "if(external.some(x=>/desmos|geogebra/i.test(x)))throw new Error('unexpected external calculator request');")
          p.write_text(text,encoding='utf-8',newline='\n')
          PY

      - name: Static and syntax QA
        run: |
          node --check lessons/ib-math-ai/unit-1/data/unit-1-ti84-simulator-v7.js
          node --check lessons/ib-math-ai/unit-1/data/unit-1-gdc-integration-v7.js
          node --check tools/browser_qa_ib_ai_unit1_gdc_v7.mjs
          python tools/qa_ib_ai_unit1_gdc_v7.py
          git diff --check

      - name: Verify simulator provider
        run: curl -L --fail --silent --show-error --max-time 25 -o /dev/null https://ti84calc.com/ti84calc

      - name: Chromium desktop and mobile QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tools/browser_qa_ib_ai_unit1_gdc_v7.mjs

      - name: Commit restored simulator
        run: |
          git config user.name "ECHS Math Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lessons/ib-math-ai/unit-1 tools/qa_ib_ai_unit1_gdc_v7.py tools/browser_qa_ib_ai_unit1_gdc_v7.mjs
          git status --short
          git commit -m "Restore TI-84 simulator across IB AI Unit 1"
          git push origin HEAD:agent/restore-ti84-simulator-unit1

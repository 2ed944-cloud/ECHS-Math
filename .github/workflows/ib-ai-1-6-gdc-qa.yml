name: IB AI 1.6 GDC Laboratory QA

on:
  pull_request:
    paths:
      - "lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.6_technology_equations_ECHS.html"
      - "lessons/ib-math-ai/unit-1/data/lesson-1.6-technology-v6-gdc-*.js"
      - "lessons/ib-math-ai/unit-1/assets/css/lesson-1.6-technology-v6-gdc-*.css"
      - "tools/test_ib_ai_1_6_gdc_*.mjs"
      - "tools/browser_qa_ib_ai_1_6_gdc_v6_1.mjs"
      - ".github/workflows/ib-ai-1-6-gdc-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.6-technology-v6-gdc-lab.js
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.6-technology-v6-gdc-external-tools.js
          node --check tools/test_ib_ai_1_6_gdc_lab_v6_1.mjs
          node --check tools/test_ib_ai_1_6_gdc_external_v6_1_1.mjs
          node --check tools/browser_qa_ib_ai_1_6_gdc_v6_1.mjs

      - name: Validate GDC mathematical and integration contracts
        run: |
          node tools/test_ib_ai_1_6_gdc_lab_v6_1.mjs
          node tools/test_ib_ai_1_6_gdc_external_v6_1_1.mjs
          node tools/test_ib_ai_1_6_definitive_v6.mjs

      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.54.1

      - name: Start local lesson server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ib16-gdc-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.6_technology_equations_ECHS.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ib16-gdc-preview.log
          exit 1

      - name: Run desktop and mobile Chromium GDC QA
        env:
          ECHS_PREVIEW_URL: http://127.0.0.1:4173
          ECHS_PREVIEW_OUTPUT: artifacts/ib-ai-1-6-gdc-v6-1
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/browser_qa_ib_ai_1_6_gdc_v6_1.mjs

      - name: Upload GDC visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ib-ai-1-6-gdc-v6-1-${{ github.run_number }}
          path: artifacts/ib-ai-1-6-gdc-v6-1
          if-no-files-found: error
          retention-days: 14

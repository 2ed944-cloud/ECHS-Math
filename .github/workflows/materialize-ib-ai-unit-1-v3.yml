name: Materialize IB Mathematics AI Unit 1 v3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-ib-ai-unit-1-v3.yml
      - .staging/ib-ai-unit-1-v3/**

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Unit 1 publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/redesign-ib-ai-unit-1-definitive-v2
          fetch-depth: 0

      - name: Reassemble and install verified Unit 1 v3 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .staging/ib-ai-unit-1-v3 -maxdepth 1 -name 'part-*' | wc -l)" -eq 12
          cat .staging/ib-ai-unit-1-v3/part-* | base64 -d > /tmp/unit1-v3.patch.xz
          echo "21b28ab8a3df2475a7a158c009559667db929a48412873563d6868dd83400b57  /tmp/unit1-v3.patch.xz" | sha256sum -c -
          xz -dc /tmp/unit1-v3.patch.xz > /tmp/unit1-v3.patch
          echo "450ed99f3e0bb9ae0389164b6fd2ebe6a5216a70d01245acdefc2a38e0376036  /tmp/unit1-v3.patch" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import re

          patch = Path('/tmp/unit1-v3.patch').read_text(encoding='utf-8')
          paths = re.findall(r'^diff --git a/(.+?) b/', patch, flags=re.M)
          if len(paths) != 26 or len(set(paths)) != 26:
              raise SystemExit(f'Expected 26 unique patch paths, found {len(paths)} total and {len(set(paths))} unique')
          Path('/tmp/unit1-v3-paths.txt').write_text('\n'.join(paths) + '\n', encoding='utf-8')
          PY
          while IFS= read -r path; do
            git rm -f --ignore-unmatch -- "$path"
          done < /tmp/unit1-v3-paths.txt
          git apply --whitespace=error /tmp/unit1-v3.patch

      - name: Validate Unit 1 v3
        shell: bash
        run: |
          set -euo pipefail
          python lessons/ib-math-ai/unit-1/tools/validate_v3_enhancement.py
          node --check data/ib-math-ai-unit-1-update.js
          for file in \
            lessons/ib-math-ai/unit-1/data/lesson-1.1-v3.js \
            lessons/ib-math-ai/unit-1/data/lesson-1.2-v3.js \
            lessons/ib-math-ai/unit-1/data/lesson-1.3-v3.js \
            lessons/ib-math-ai/unit-1/data/lesson-1.4-v3.js \
            lessons/ib-math-ai/unit-1/data/lesson-1.5-v3.js \
            lessons/ib-math-ai/unit-1/data/lesson-1.6-v3.js \
            lessons/ib-math-ai/unit-1/data/lesson-1.7-v3.js \
            lessons/ib-math-ai/unit-1/data/lesson-1.8-v3.js \
            lessons/ib-math-ai/unit-1/data/unit-1-v3-enhancements.js; do
            node --check "$file"
          done
          python -m json.tool data/ib-math-ai-unit-1-delivery-catalog.json >/dev/null
          python -m json.tool lessons/ib-math-ai/unit-1/reports/v3-enhancement-audit.json >/dev/null
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          lesson_pages = sorted(Path('lessons/ib-math-ai/unit-1/lessons').glob('IB_AI_SL_1.*_ECHS.html'))
          if len(lesson_pages) != 8:
              raise SystemExit(f'Expected 8 lesson wrappers, found {len(lesson_pages)}')
          for path in [Path('lessons/ib-math-ai/unit-1/START_HERE.html'), *lesson_pages]:
              Parser().feed(path.read_text(encoding='utf-8'))
          print('HTML parse PASS')
          PY
          grep -Fq '"release": "3.0.0"' data/ib-math-ai-unit-1-delivery-catalog.json
          grep -Fq '488' lessons/ib-math-ai/unit-1/QA_REPORT.md
          grep -Fq '416' lessons/ib-math-ai/unit-1/QA_REPORT.md
          grep -Fq '112' lessons/ib-math-ai/unit-1/QA_REPORT.md
          grep -Fq '24' lessons/ib-math-ai/unit-1/QA_REPORT.md

      - name: Remove staging and commit canonical publication files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging/ib-ai-unit-1-v3
          rm -f .github/workflows/materialize-ib-ai-unit-1-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Install definitive IB Mathematics AI Unit 1 v3"
          git push origin HEAD:agent/redesign-ib-ai-unit-1-definitive-v2

name: Verify IB AI PDF transfer marker
on:
  push:
    branches:
      - agent/ib-ai-dual-notes-merge-final
permissions:
  issues: read
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and mark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, urllib.request, hashlib, pathlib
          req=urllib.request.Request('https://api.github.com/repos/2ed944-cloud/ECHS-Math/issues/210/comments?per_page=100',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          comments=json.load(urllib.request.urlopen(req))
          target='12z64-01'; expected='e06c6ab8707629bb57179c74af9b666727688565d21f98b0957bd920ae524dd1'
          for c in comments:
            lines=c.get('body','').splitlines()
            if len(lines)>=3 and lines[0].strip()==target:
              payload=''.join(''.join(lines[2:]).split())
              if hashlib.sha256(payload.encode()).hexdigest()==expected:
                pathlib.Path('.transfer-valid-12z64-01').write_text(str(len(payload))+'\n')
                raise SystemExit(0)
          raise SystemExit('no valid 12z64-01 comment')
          PY
          rm -f .github/workflows/verify-ib-ai-pdf-transfer-marker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mark verified PDF transfer chunk'
          git push

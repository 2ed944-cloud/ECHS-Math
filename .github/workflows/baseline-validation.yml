name: ECHS portable baseline validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned DOM and bank validation dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/echs-baseline-dom" --no-save --ignore-scripts --no-audit --no-fund linkedom@0.18.12
          npm ci --prefix question-bank/official/tools
          npx --prefix question-bank/official/tools playwright install --with-deps chromium-headless-shell
      - name: Run all critical baseline suites
        env:
          ECHS_TEST_DOM_MODULE: ${{ runner.temp }}/echs-baseline-dom/node_modules/linkedom
        run: python tools/validate_baseline.py --json-report "$RUNNER_TEMP/echs-baseline.json"
      - name: Upload baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-validation
          path: ${{ runner.temp }}/echs-baseline.json
          if-no-files-found: warn
          retention-days: 7

name: Validate IB Mathematics AI Unit 6 Releases

on:
  pull_request:
    paths:
      - ".github/workflows/ib-ai-unit6-release.yml"
      - "lessons/ib-math-ai/unit-6/**"
      - "data/ib-math-ai-unit-6-update.js"
      - "tools/test_ib_unit6_2_release.mjs"
  push:
    branches:
      - main
    paths:
      - "lessons/ib-math-ai/unit-6/**"
      - "data/ib-math-ai-unit-6-update.js"
      - "tools/test_ib_unit6_2_release.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ib-ai-unit6-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Lesson 6.2 structure, mathematics, links, and portal registration
        run: node tools/test_ib_unit6_2_release.mjs

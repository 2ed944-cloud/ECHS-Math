name: Diagnose lesson 2.5 payload chunks

on:
  push:
    branches:
      - agent/ib-ai-lesson-2-5-v5
    paths:
      - '.github/workflows/diagnose-lesson25-chunks.yml'

permissions:
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect payload chunk lengths and boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request

          request = urllib.request.Request(
              'https://api.github.com/repos/2ed944-cloud/ECHS-Math/issues/223/comments?per_page=100',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)

          pattern = re.compile(r'^ECHS_L25_CHUNK (\d{3})/(\d{3}) ([0-9a-f]{64})\n([A-Za-z0-9+/=]+)$')
          chunks = {}
          for item in comments:
              match = pattern.fullmatch(item.get('body', '').strip())
              if not match:
                  continue
              index = int(match.group(1))
              payload = match.group(4)
              chunks[index] = payload
              print(
                  f"{index:03d} len={len(payload)} mod4={len(payload)%4} "
                  f"sha={hashlib.sha256(payload.encode()).hexdigest()} "
                  f"head={payload[:24]} tail={payload[-24:]}"
              )
          encoded = ''.join(chunks[i] for i in sorted(chunks))
          print(f'total={len(encoded)} mod4={len(encoded)%4} chunks={sorted(chunks)}')
          PY

name: Build ECHS Mathematics Open

on:
  pull_request:
    paths:
      - "variants/open/**"
      - "tools/build_open_site.py"
      - "tools/test_open_site_contract.py"
      - "js/portal-open.js"
      - "index.html"
      - "data/**"
      - "lessons/**"
      - "question-bank/**"
      - "css/**"
      - ".github/workflows/open-site-export.yml"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "variants/open/**"
      - "tools/build_open_site.py"
      - "tools/test_open_site_contract.py"
      - "js/portal-open.js"
      - "data/**"
      - "lessons/**"
      - "question-bank/**"
      - "css/**"

permissions:
  contents: read

jobs:
  export-open-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out canonical platform
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build account-free site
        run: python tools/build_open_site.py . _open

      - name: Validate account-free contract
        id: validation
        shell: bash
        run: |
          set +e
          python tools/test_open_site_contract.py _open > open-validation.txt 2>&1
          status=$?
          cat open-validation.txt
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echs-math-open-validation
          path: open-validation.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload ready-to-publish open site
        if: steps.validation.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: echs-math-open-site
          path: _open
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Enforce validation result
        if: steps.validation.outputs.status != '0'
        run: exit 1

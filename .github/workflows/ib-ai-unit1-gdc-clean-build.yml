name: Build IB AI Unit 1 GDC integration on clean branch

on:
  push:
    branches:
      - agent/ib-ai-unit1-gdc-merge-ready-v7
    paths:
      - '.github/workflows/ib-ai-unit1-gdc-clean-build.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out clean merge branch
        uses: actions/checkout@v4
        with:
          ref: agent/ib-ai-unit1-gdc-merge-ready-v7
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and run verified installer
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/2ed944-cloud/ECHS-Math/ee5715a4a516072ab958a14b31838bcc9fdf479d/tools/install_ib_ai_unit1_gdc_v7.py' -o tools/install_ib_ai_unit1_gdc_v7.py
          python tools/install_ib_ai_unit1_gdc_v7.py
          rm -f tools/install_ib_ai_unit1_gdc_v7.py
          rm -f .github/workflows/ib-ai-unit1-gdc-v7-qa.yml

      - name: Commit generated lesson integration only
        run: |
          git config user.name "ECHS Math Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lessons/ib-math-ai/unit-1/data/unit-1-gdc-integration-v7.js \
            lessons/ib-math-ai/unit-1/assets/css/unit-1-gdc-integration-v7.css \
            lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.2_arithmetic_sequences_ECHS.html \
            lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.3_geometric_sequences_ECHS.html \
            lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.4_financial_models_ECHS.html \
            lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.5_logarithms_ECHS.html \
            lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.6_technology_equations_ECHS.html \
            lessons/ib-math-ai/unit-1/data/lesson-1.4-ti84-finance-workflows-v6-3.js \
            lessons/ib-math-ai/unit-1/data/lesson-1.6-ti84-classroom-workflows-v6-2-2.js \
            tools/qa_ib_ai_unit1_gdc_v7.py \
            tools/browser_qa_ib_ai_unit1_gdc_v7.mjs
          git diff --cached --check
          git commit -m "Integrate IB AI Unit 1 local TI-84/GDC workflows"
          git push origin HEAD:agent/ib-ai-unit1-gdc-merge-ready-v7

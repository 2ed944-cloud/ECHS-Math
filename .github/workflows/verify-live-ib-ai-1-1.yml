name: Verify live IB AI Lesson 1.1

on:
  workflow_run:
    workflows:
      - Deploy ECHS Mathematics to GitHub Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-lesson:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SITE_ROOT: https://2ed944-cloud.github.io/ECHS-Math
    steps:
      - name: Verify exact Lesson 1.1 deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            echo "Lesson 1.1 live verification attempt ${attempt}/36"
            rm -f /tmp/echs-deployment.json /tmp/echs-l11.html /tmp/echs-l11-runtime.js /tmp/echs-l11-bridge.js /tmp/echs-l11.css /tmp/echs-u1.js
            curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${SITE_ROOT}/deployment.json?sha=${EXPECTED_SHA}" --output /tmp/echs-deployment.json || true
            curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${SITE_ROOT}/lessons/ib-math-ai/unit-1/lessons/IB_AI_SL_1.1_standard_form_ECHS.html?sha=${EXPECTED_SHA}" --output /tmp/echs-l11.html || true
            curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${SITE_ROOT}/lessons/ib-math-ai/unit-1/data/lesson-1.1-ti84-real-inline-v6-9.js?sha=${EXPECTED_SHA}" --output /tmp/echs-l11-runtime.js || true
            curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${SITE_ROOT}/lessons/ib-math-ai/unit-1/data/lesson-1.1-ti84-local-bridge-v6-8-2.js?sha=${EXPECTED_SHA}" --output /tmp/echs-l11-bridge.js || true
            curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${SITE_ROOT}/lessons/ib-math-ai/unit-1/assets/css/lesson-1.1-ti84-real-v6-9.css?sha=${EXPECTED_SHA}" --output /tmp/echs-l11.css || true
            curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${SITE_ROOT}/data/ib-math-ai-unit-1-update.js?sha=${EXPECTED_SHA}" --output /tmp/echs-u1.js || true
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["EXPECTED_SHA"]
          files = {
              "deployment": Path("/tmp/echs-deployment.json"),
              "html": Path("/tmp/echs-l11.html"),
              "runtime": Path("/tmp/echs-l11-runtime.js"),
              "bridge": Path("/tmp/echs-l11-bridge.js"),
              "css": Path("/tmp/echs-l11.css"),
              "portal": Path("/tmp/echs-u1.js"),
          }
          if not all(path.is_file() and path.stat().st_size > 20 for path in files.values()):
              raise SystemExit(1)
          try:
              deployment = json.loads(files["deployment"].read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(1)
          text = {key: path.read_text(encoding="utf-8", errors="replace") for key, path in files.items() if key != "deployment"}
          checks = [
              deployment.get("sha") == expected,
              "1.1 · Scientific Notation, Approximation and Error" in text["html"],
              "lesson-1.1-ti84-real-v6-9.css?v=6.9.1" in text["html"],
              "lesson-1.1-ti84-real-inline-v6-9.js?v=6.9.1" in text["html"],
              "lesson-1.1-ti84-local-bridge-v6-8-2.js?v=6.8.2" in text["html"],
              "lesson-1.1-ti84-local-v6-8.css?v=6.8.0" not in text["html"],
              "lesson-1.1-ti84-local-v6-8.js?v=6.8.0" not in text["html"],
              "lesson-1.1-ti84-local-input-v6-8-1.js?v=6.8.1" not in text["html"],
              "const URL='https://ti84calc.com/ti84calc'" in text["runtime"],
              "model:'TI-84 Plus CE'" in text["runtime"],
              "provider:'ti84calc.com'" in text["runtime"],
              "realCalculatorInterface:true" in text["runtime"],
              "layoutRelease:'6.9.1'" in text["runtime"],
              "visibleHeaderAnchoring:true" in text["runtime"],
              "horizontalShellScroll:false" in text["runtime"],
              "function visibleRouteBottom(topbarBottom)" in text["runtime"],
              "sandbox=\"allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals allow-downloads\"" in text["runtime"],
              "pairedPracticeConnected:true" in text["bridge"],
              "echs:ti84:simulator" in text["bridge"],
              "#ti84-inline-dock.ti84-inline-dock.open" in text["css"],
              "body.ti84-inline-open .app-shell" in text["css"],
              ":root{--ti84-inline-width:clamp(500px,36vw,640px)" in text["css"],
              "#ti84-inline-dock .ti84-inline-frame-shell{position:relative!important;min-width:0!important;min-height:0!important;height:auto!important;overflow:hidden!important" in text["css"],
              "#ti84-inline-dock .ti84-inline-frame-shell iframe{position:relative!important;inset:auto!important;display:none!important;width:100%!important;height:100%!important;min-width:0!important;min-height:0!important" in text["css"],
              "min-height:900px" not in text["css"],
              '"1.1","Scientific Notation, Approximation and Error"' in text["portal"],
              '"6.9.0",79,96,14,5' in text["portal"],
              'model:"TI-84 Plus CE"' in text["portal"],
              'provider:"ti84calc.com"' in text["portal"],
              'externalDependency:true' in text["portal"],
              '{label:"Complete interactive lesson",url,type:"resource"}' in text["portal"],
          ]
          raise SystemExit(0 if all(checks) else 1)
          PY
            then
              echo "Live IB AI Lesson 1.1 TI-84 Plus CE dimensions verification: PASS"
              exit 0
            fi
            sleep 15
          done
          echo "The exact Lesson 1.1 TI-84 dimension fix was not visible on GitHub Pages for ${EXPECTED_SHA}" >&2
          exit 1

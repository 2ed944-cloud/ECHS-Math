name: Validate GDC Classroom Training v8

on:
  push:
    branches:
      - agent/gdc-classroom-training-v8
    paths:
      - '.github/workflows/gdc-classroom-training-v8.yml'

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gdc-classroom-training-v8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wire Classroom Training into Lessons 1.2-1.6
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('lessons/ib-math-ai/unit-1')
          targets=[
            'IB_AI_SL_1.2_arithmetic_sequences_ECHS.html',
            'IB_AI_SL_1.3_geometric_sequences_ECHS.html',
            'IB_AI_SL_1.4_financial_models_ECHS.html',
            'IB_AI_SL_1.5_logarithms_ECHS.html',
            'IB_AI_SL_1.6_technology_equations_ECHS.html',
          ]
          css='  <link rel="stylesheet" href="../assets/css/unit-1-gdc-classroom-training-v8.css">\n'
          js='  <script src="../data/unit-1-gdc-classroom-training-v8.js" defer></script>\n'
          for name in targets:
            p=root/'lessons'/name
            text=p.read_text(encoding='utf-8')
            if 'unit-1-gdc-classroom-training-v8.css' not in text:
              marker='  <link rel="stylesheet" href="../assets/css/unit-1-ti84-simulator-v7.css">\n'
              if marker not in text: raise SystemExit(f'{name}: simulator CSS marker missing')
              text=text.replace(marker,marker+css,1)
            if 'unit-1-gdc-classroom-training-v8.js' not in text:
              marker='  <script src="../data/unit-1-ti84-simulator-v7.js" defer></script>\n'
              if marker not in text: raise SystemExit(f'{name}: simulator JS marker missing')
              text=text.replace(marker,marker+js,1)
            p.write_text(text,encoding='utf-8',newline='\n')
          PY

      - name: Static, syntax and mathematical QA
        run: |
          node --check lessons/ib-math-ai/unit-1/data/unit-1-gdc-classroom-training-v8.js
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.4-ti84-finance-workflows-v6-3.js
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.6-ti84-classroom-workflows-v6-2-2.js
          python - <<'PY'
          from pathlib import Path
          import math
          root=Path('lessons/ib-math-ai/unit-1')
          targets={
            '1.2':'IB_AI_SL_1.2_arithmetic_sequences_ECHS.html',
            '1.3':'IB_AI_SL_1.3_geometric_sequences_ECHS.html',
            '1.4':'IB_AI_SL_1.4_financial_models_ECHS.html',
            '1.5':'IB_AI_SL_1.5_logarithms_ECHS.html',
            '1.6':'IB_AI_SL_1.6_technology_equations_ECHS.html',
          }
          for n,name in targets.items():
            t=(root/'lessons'/name).read_text(encoding='utf-8')
            assert t.count('unit-1-gdc-classroom-training-v8.css')==1,(n,'css')
            assert t.count('unit-1-gdc-classroom-training-v8.js')==1,(n,'js')
          l11=(root/'lessons/IB_AI_SL_1.1_standard_form_ECHS.html').read_text(encoding='utf-8')
          assert 'gdc-classroom-training-v8' not in l11
          assert sum(5+3*(k-1) for k in range(1,41))==2540
          assert abs(8500*(1.037**18)-16346.942714984983)<1e-8
          assert abs(sum(600*(1.025**k) for k in range(25))-20494.658359731715)<1e-8
          assert abs(math.log(1000/15000)/math.log(.82)-13.645943015017412)<1e-10
          assert abs(math.log(19,2)-4.247927513443585)<1e-10
          assert abs(math.log(17)/math.log(3)-2.5789019231625656)<1e-10
          assert abs((2+math.sqrt(11))-5.3166247903554)<1e-10
          assert abs(math.log(15/84)/math.log(.78)-6.933740532552528)<1e-10
          print('Static and mathematical QA PASS')
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const base='lessons/ib-math-ai/unit-1/data/';
          const extension=fs.readFileSync(base+'unit-1-gdc-classroom-training-v8.js','utf8');
          const expected={'1.2':4,'1.3':5,'1.4':7,'1.5':5,'1.6':6};
          for(const n of Object.keys(expected)){
            const context={window:{LESSON_DATA:{lesson:{number:n}}},document:{body:{},addEventListener(){},querySelector(){return null}},MutationObserver:function(){this.observe=()=>{}},setTimeout(){}};
            vm.createContext(context);
            if(n==='1.4')vm.runInContext(fs.readFileSync(base+'lesson-1.4-ti84-finance-workflows-v6-3.js','utf8'),context);
            if(n==='1.6')vm.runInContext(fs.readFileSync(base+'lesson-1.6-ti84-classroom-workflows-v6-2-2.js','utf8'),context);
            vm.runInContext(extension,context);
            const meta=context.window.LESSON_DATA.gdcClassroomTrainingV8;
            if(!meta||meta.workflowCount!==expected[n])throw new Error(`${n}: ${JSON.stringify(meta)}`);
            if((n==='1.4'||n==='1.6')&&!meta.restoredLegacyTraining)throw new Error(`${n}: legacy training not restored`);
          }
          console.log('Workflow count QA PASS: 4 + 5 + 7 + 5 + 6 = 27');
          NODE
          git diff --check

      - name: Verify TI-84 simulator provider
        run: curl -L --fail --silent --show-error --max-time 25 -o /dev/null https://ti84calc.com/ti84calc

      - name: Chromium desktop and mobile classroom QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node - <<'NODE'
          const {chromium}=require('playwright');
          const {spawn}=require('child_process');
          const server=spawn('python3',['-m','http.server','4173','--directory','.'],{stdio:'ignore'});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const files={
            '1.2':'IB_AI_SL_1.2_arithmetic_sequences_ECHS.html',
            '1.3':'IB_AI_SL_1.3_geometric_sequences_ECHS.html',
            '1.4':'IB_AI_SL_1.4_financial_models_ECHS.html',
            '1.5':'IB_AI_SL_1.5_logarithms_ECHS.html',
            '1.6':'IB_AI_SL_1.6_technology_equations_ECHS.html'
          };
          const expected={'1.2':4,'1.3':5,'1.4':7,'1.5':5,'1.6':6};
          const devices=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          const failures=[];
          (async()=>{
            await sleep(1000);
            const browser=await chromium.launch({headless:true});
            try{
              for(const [device,viewport] of devices){
                for(const [n,file] of Object.entries(files)){
                  const context=await browser.newContext({viewport});
                  const page=await context.newPage();
                  const errors=[];
                  page.on('pageerror',e=>errors.push(String(e)));
                  page.on('console',m=>{if(m.type()==='error'&&!/ti84calc/i.test(m.text()))errors.push(m.text())});
                  await page.route('https://ti84calc.com/**',route=>route.fulfill({status:200,contentType:'text/html',body:'<!doctype html><title>TI-84 QA fixture</title><main>TI-84 simulator fixture</main>'}));
                  try{
                    await page.goto(`http://127.0.0.1:4173/lessons/ib-math-ai/unit-1/lessons/${file}#learn`,{waitUntil:'networkidle'});
                    await page.waitForSelector('.gdc-v7-launch',{timeout:12000});
                    await page.locator('.gdc-v7-launch').focus();
                    await page.keyboard.press('Enter');
                    await page.waitForSelector('.gdc8-classroom',{timeout:8000});
                    const options=await page.locator('.gdc8-select option').count();
                    if(options!==expected[n])throw new Error(`training count ${options} != ${expected[n]}`);
                    if(await page.locator('.gdc8-ti-steps article').count()<2)throw new Error('TI-84 step cards missing');
                    if(await page.locator('.gdc8-keys kbd').count()<2)throw new Error('physical key route missing');
                    await page.locator('.gdc8-select').selectOption(String(expected[n]-1));
                    if(await page.locator('.gdc8-ti-steps article').count()<2)throw new Error('last training did not render');
                    const reveal=page.locator('.gdc8-reveal-output');
                    if(await reveal.count()){await reveal.click();if(await page.locator('.gdc8-output-value').getAttribute('hidden')!==null)throw new Error('calculator output reveal failed');}
                    await page.locator('.gdc8-open-sim').evaluate(el=>el.click());
                    await page.waitForSelector('#u1-ti84-simulator.is-open',{timeout:8000});
                    const layout=await page.evaluate(()=>{
                      const sim=document.querySelector('#u1-ti84-simulator').getBoundingClientRect();
                      const app=document.querySelector('#app').getBoundingClientRect();
                      const backdrop=getComputedStyle(document.querySelector('.u1-ti84-sim-backdrop'));
                      const slide=document.querySelector('.stage');
                      return {simLeft:sim.left,appRight:app.right,backdropFilter:backdrop.backdropFilter||backdrop.webkitBackdropFilter,backdropDisplay:backdrop.display,slideVisible:!!slide&&slide.getClientRects().length>0};
                    });
                    if(!layout.slideVisible)throw new Error('lesson slide hidden while simulator open');
                    if(String(layout.backdropFilter).includes('blur'))throw new Error('simulator still blurs the lesson');
                    if(device==='desktop'&&layout.appRight>layout.simLeft+4)throw new Error(`desktop overlap appRight=${layout.appRight} simLeft=${layout.simLeft}`);
                    if(device==='desktop'&&layout.backdropDisplay!=='none')throw new Error('desktop backdrop still covers lesson');
                    await page.keyboard.press('Escape');
                    if(await page.locator('#u1-ti84-simulator').evaluate(el=>el.classList.contains('is-open')))throw new Error('Escape close failed');
                    if(errors.length)throw new Error('local console/page errors: '+errors.join(' | '));
                  }catch(e){failures.push(`${device} lesson ${n}: ${e.message}`)}
                  finally{await context.close()}
                }
              }
            }finally{await browser.close();server.kill('SIGTERM')}
            if(failures.length){console.error(failures.join('\n'));process.exit(1)}
            console.log('Chromium PASS: 5 lessons × desktop/mobile; GDC Classroom Training + side-by-side TI-84 simulator.');
          })();
          NODE

      - name: Commit lesson wiring
        run: |
          git config user.name "ECHS Math Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lessons/ib-math-ai/unit-1/lessons
          git diff --cached --check
          git commit -m "Integrate GDC classroom training across IB AI Unit 1"
          git push origin HEAD:agent/gdc-classroom-training-v8

name: Diagnose IB Private API Page Sizes

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-ib-private-api-page-sizes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Measure production private-bank API page sizes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, hashlib, json, os, secrets, time, urllib.error, urllib.parse, urllib.request
          base=os.environ['SUPABASE_URL'].rstrip('/')
          service=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          service_headers={'apikey':service,'authorization':f'Bearer {service}','content-type':'application/json'}

          def raw(url, *, headers=None, method='GET', body=None, timeout=180):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url, headers=headers or {}, method=method, data=data)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      payload=res.read()
                      return res.status, payload
              except urllib.error.HTTPError as err:
                  return err.code, err.read()

          query=urllib.parse.urlencode({'select':'id,organization_id,role,status','role':'in.(admin,teacher)','status':'eq.active','order':'role.asc','limit':'20'},safe=',.()')
          status,data=raw(f'{base}/rest/v1/accounts?{query}',headers=service_headers)
          accounts=json.loads(data or b'[]')
          if status!=200 or not accounts: raise SystemExit('No active staff account')
          package_query=urllib.parse.urlencode({'select':'organization_id,bank_code,manifest','order':'bank_code.asc'},safe=',.()')
          status,data=raw(f'{base}/rest/v1/private_bank_packages?{package_query}',headers=service_headers)
          packages=json.loads(data or b'[]')
          ib_orgs={str(r.get('organization_id')) for r in packages if 'ib-math-ai' in set((r.get('manifest') or {}).get('target_courses') or []) or str(r.get('bank_code') or '').startswith('IBAI-')}
          account=next((r for r in accounts if str(r.get('organization_id')) in ib_orgs),None)
          if not account: raise SystemExit('No matching staff account')

          token='diag-'+secrets.token_urlsafe(40)
          token_hash=hashlib.sha256(token.encode()).hexdigest()
          expires=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(minutes=8)).isoformat()
          status,data=raw(f'{base}/rest/v1/rpc/api_create_session',headers=service_headers,method='POST',body={'p_account_id':account['id'],'p_token_hash':token_hash,'p_expires_at':expires,'p_user_agent_hash':'ib-page-size-diagnostic','p_ip_hash':'github-actions'})
          if status not in (200,201): raise SystemExit(f'Session create failed HTTP {status}')
          results=[]
          try:
              for limit in (1,50,100,200,500,1000):
                  q=urllib.parse.urlencode({'course':'ib-math-ai','limit':str(limit),'offset':'0'})
                  started=time.monotonic()
                  status,data=raw(f'{base}/functions/v1/private-bank-api/student-questions?{q}',headers={'authorization':f'Bearer {token}'},timeout=180)
                  elapsed=round(time.monotonic()-started,3)
                  try: payload=json.loads(data or b'{}')
                  except Exception: payload={}
                  results.append({'limit':limit,'http_status':status,'seconds':elapsed,'bytes':len(data),'ok':payload.get('ok'),'total':payload.get('total'),'returned_rows':len(payload.get('questions') or []),'error_code':(payload.get('error') or {}).get('code')})
                  if status!=200: break
          finally:
              raw(f'{base}/rest/v1/rpc/api_revoke_session',headers=service_headers,method='POST',body={'p_token_hash':token_hash})
          print('IB_PRIVATE_API_PAGE_SIZES=')
          print(json.dumps(results,indent=2,sort_keys=True))
          if not results or results[0]['http_status']!=200: raise SystemExit('Private API baseline failed')
          PY
name: Install Lesson 2.3 v5 package

on:
  push:
    branches:
      - feature/ib-ai-2-3-definitive-v5
    paths:
      - ".lesson23-package/**"
      - ".github/workflows/install-lesson-2-3-v5-package.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: feature/ib-ai-2-3-definitive-v5

      - name: Install complete package
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G ".lesson23-package/part-*" > /dev/null; then
            echo "Lesson 2.3 package has already been installed."
            exit 0
          fi
          cat .lesson23-package/part-* > /tmp/lesson23.b64
          base64 -d /tmp/lesson23.b64 > /tmp/lesson23.zip
          unzip -o /tmp/lesson23.zip -d .
          # The GitHub Actions token may not create another workflow file.
          # Install the lesson first; the audited QA workflow is added separately through the GitHub API.
          rm -f .github/workflows/ib-ai-2-3-definitive-qa.yml
          rm -rf .lesson23-package
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Build definitive IB AI Lesson 2.3 v5"
          git push origin HEAD:feature/ib-ai-2-3-definitive-v5

name: Diagnose Non-Catalog IB Mappings

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-ib-noncatalog-mappings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect non-catalog mappings without printing question content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import html
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers={'apikey':key,'authorization':f'Bearer {key}'}
          catalog=json.load(open('data/ib-math-ai-lesson-catalog.json',encoding='utf-8'))
          allowed={}
          for unit in catalog.get('units',[]):
              unit_number=int(unit['unit'])
              for lesson in unit.get('lessons',[]):
                  allowed[str(lesson['lesson_key'])]=(unit_number,str(lesson['skill_id']))
                  for number in lesson.get('delivery_lesson_numbers',[]):
                      allowed[str(number)]=(unit_number,str(lesson['skill_id']))
                  number=str(lesson.get('number') or '')
                  if re.fullmatch(r'\d+\.\d+',number):
                      allowed[number]=(unit_number,str(lesson['skill_id']))

          def request_json(url,extra_headers=None,retries=5):
              last=None
              for attempt in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={**headers,**(extra_headers or {})})
                      with urllib.request.urlopen(req,timeout=180) as response:return json.load(response)
                  except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError) as error:
                      last=error
                      if attempt+1<retries:time.sleep(1.5*(attempt+1))
              raise last

          def get_mapping_rows(page_size=1000):
              out=[]; offset=0; select='question_id,bank_code,course_mappings'
              while True:
                  query=urllib.parse.urlencode({'select':select,'order':'question_id.asc'},safe=',.*()[]:{}"')
                  page=request_json(f'{base}/rest/v1/private_bank_questions?{query}',{'range':f'{offset}-{offset+page_size-1}'})
                  out.extend(page)
                  if len(page)<page_size:return out
                  offset+=len(page)

          def get_payloads(question_ids,chunk_size=40):
              out={}
              for start in range(0,len(question_ids),chunk_size):
                  chunk=question_ids[start:start+chunk_size]
                  values=','.join(json.dumps(str(value)) for value in chunk)
                  query=urllib.parse.urlencode({'select':'question_id,payload','question_id':f'in.({values})'},safe=',.*()[]:{}"')
                  for row in request_json(f'{base}/rest/v1/private_bank_questions?{query}'):
                      out[str(row.get('question_id'))]=row.get('payload') if isinstance(row.get('payload'),dict) else {}
              return out

          rules={
            'u1-number':[(r'\bstandard form\b|scientific notation',8),(r'significant figure|decimal place|round(?:ing|ed)?|upper bound|lower bound|percentage error|absolute error|approximation',6),(r'\bnumber system\b|surds?|radicals?',3)],
            'u1-algebra':[(r'algebraic|simplif(?:y|ication)|factor(?:ise|ize|isation|ization)?|expand',5),(r'\bequations?\b|\binequalit(?:y|ies)\b|simultaneous equations?',4),(r'indices|exponents?|logarithm',3)],
            'u1-sequences':[(r'arithmetic sequence|geometric sequence|arithmetic series|geometric series',9),(r'compound interest|annuit(?:y|ies)|loan|mortgage|depreciation|amortization',7),(r'\bsequence\b|\bseries\b',5)],
            'u1-matrices':[(r'\bmatri(?:x|ces)\b|determinant|inverse matrix|transition matrix|eigen',10)],
            'u1-modeling':[(r'construct a model|mathematical model|model the|modelling|modeling',4)],
            'u2-concept':[(r'function notation|domain|range|relation|vertical line test|inverse function',7),(r'\bfunction\b',2)],
            'u2-linear_quadratic':[(r'linear function|linear model|gradient|slope|quadratic|parabola|vertex|discriminant',7)],
            'u2-poly_rational':[(r'polynomial|rational function|asymptote|remainder theorem|factor theorem',8)],
            'u2-exp_log':[(r'exponential function|exponential model|logarithmic function|logarithmic model|natural logarithm',8),(r'growth|decay|half-life|doubling time',4)],
            'u2-transform':[(r'transformation|translation|reflection|stretch|composition|composite function',7)],
            'u2-regression':[(r'regression|least squares|residual|coefficient of determination|\br\s*\^?2\b',9)],
            'u3-coordinate':[(r'distance formula|midpoint|coordinate geometry|voronoi|bearing',7)],
            'u3-trig':[(r'trigonometric|\bsine\b|\bcosine\b|\btangent\b|sin\s*\(|cos\s*\(|tan\s*\(|radian|angle of elevation|angle of depression',7)],
            'u3-conics':[(r'\bcircle\b|ellipse|hyperbola|conic',7)],
            'u3-vectors':[(r'\bvectors?\b|dot product|scalar product|magnitude and direction',9)],
            'u3-polar':[(r'polar coordinates?|parametric',9)],
            'u4-data':[(r'mean|median|mode|quartile|interquartile|standard deviation|variance|box plot|histogram|cumulative frequency',6)],
            'u4-probability':[(r'probability|permutation|combination|counting principle|venn diagram|tree diagram|conditional probability|bayes',7)],
            'u4-distributions':[(r'normal distribution|binomial distribution|poisson distribution|probability distribution|expected value|z-score',9)],
            'u4-correlation':[(r'correlation|scatter plot|pearson|spearman|line of best fit|regression',7)],
            'u4-inference':[(r'chi[- ]?square|hypothesis test|null hypothesis|alternative hypothesis|significance level|p-value|confidence interval|t-test',10)],
            'u5-change':[(r'rate of change|gradient function|tangent|secant',6)],
            'u5-derivative':[(r'derivative|differentiat(?:e|ion)|stationary point|second derivative',9)],
            'u5-integral':[(r'integral|integrat(?:e|ion)|area under|accumulation',9)],
            'u5-optimization':[(r'optim(?:ise|ize|isation|ization)|maximum|minimum',5),(r'derivative|differentiat',2)]
          }

          def strip_prompt(payload):
              text=' '.join(str(payload.get(key) or '') for key in ('prompt_html','prompt','question','stem','body'))
              text=html.unescape(re.sub(r'<[^>]+>',' ',text))
              return re.sub(r'\s+',' ',text).lower()

          def classify(text):
              scores={lesson:sum(weight for pattern,weight in patterns if re.search(pattern,text,re.I)) for lesson,patterns in rules.items()}
              ranked=sorted(scores.items(),key=lambda item:(-item[1],item[0]))
              best,score=ranked[0];second=ranked[1][1]
              return best,score,score-second

          def safe_topic_values(payload):
              found=[];containers=[payload,payload.get('classification') or {},payload.get('metadata') or {},payload.get('source') or {}]
              keys=('topic','topic_title','subtopic','category','strand','unit','lesson','lesson_key','skill_key','syllabus','objective','tags')
              for container in containers:
                  if not isinstance(container,dict):continue
                  for name in keys:
                      value=container.get(name);values=value if isinstance(value,list) else [value]
                      for item in values:
                          text=str(item or '').strip()
                          if text and len(text)<=80 and '<' not in text and '\n' not in text:found.append(f'{name}={text}')
              return found

          metadata=[]
          for row in get_mapping_rows():
              for mapping in [m for m in (row.get('course_mappings') or []) if str((m or {}).get('course') or '')=='ib-math-ai']:
                  lesson=str((mapping or {}).get('lesson_key') or '');unit=int((mapping or {}).get('unit') if (mapping or {}).get('unit') is not None else -1);canonical=allowed.get(lesson)
                  if canonical and canonical[0]==unit:continue
                  metadata.append({'question_id':str(row.get('question_id')),'bank_code':str(row.get('bank_code') or 'UNKNOWN'),'stored_unit':unit,'stored_lesson':lesson})

          payloads=get_payloads([row['question_id'] for row in metadata])
          noncatalog=[]
          for row in metadata:
              payload=payloads.get(row['question_id'],{});predicted,score,margin=classify(strip_prompt(payload))
              noncatalog.append({**row,'predicted_lesson':predicted,'score':score,'margin':margin,'question_type':str(payload.get('type') or payload.get('question_type') or 'unknown'),'hints':safe_topic_values(payload)})

          by_current=collections.Counter((r['stored_unit'],r['stored_lesson']) for r in noncatalog);by_bank=collections.Counter(r['bank_code'] for r in noncatalog);by_prediction=collections.Counter(r['predicted_lesson'] for r in noncatalog)
          confidence=collections.Counter('high' if r['score']>=7 and r['margin']>=3 else 'medium' if r['score']>=4 and r['margin']>=1 else 'low' for r in noncatalog);hints=collections.Counter(hint for row in noncatalog for hint in row['hints']);cross=collections.Counter((r['stored_lesson'],r['predicted_lesson']) for r in noncatalog)
          output={'allowed_catalog_keys':len(allowed),'noncatalog_rows':len(noncatalog),'by_current_mapping':{f'{unit}:{lesson}':count for (unit,lesson),count in sorted(by_current.items())},'by_bank':dict(by_bank.most_common()),'predicted_lessons':dict(by_prediction.most_common()),'confidence':dict(confidence),'top_safe_metadata_hints':dict(hints.most_common(80)),'current_to_prediction':{f'{current} -> {predicted}':count for (current,predicted),count in cross.most_common(80)}}
          print('IB_NONCATALOG_MAPPING_DIAGNOSTIC=')
          print(json.dumps(output,indent=2,sort_keys=True))
          if not noncatalog:print('All IB mappings already resolve to the lesson catalogue.')
          PY

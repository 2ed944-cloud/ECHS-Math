name: Finalize IB AI Lesson 1.4 notes card
on:
  push:
    branches:
      - agent/ib-ai-1-4-notes-card-final
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register notes and repair annuity answer
        shell: bash
        run: |
          set -euo pipefail
          PDF='notes/ib-math-ai/unit-1/IB_AI_SL_1.4_Financial_Applications_Full_Notes_Student.pdf'
          HTML='notes/ib-math-ai/unit-1/IB_AI_SL_1.4_Financial_Applications_Full_Notes_Student.html'
          test -f "$PDF"
          test -f "$HTML"
          test "$(git hash-object "$PDF")" = 'fcf73d78c87de7a3b48a68402dbeb229432daa0c'
          test "$(git hash-object "$HTML")" = '9c9f3dd17c514e756e9beaf6cb1a296de7b192c2'

          python - <<'PY'
          from pathlib import Path
          import re

          unit_path=Path('data/ib-math-ai-unit-1-update.js')
          unit=unit_path.read_text(encoding='utf-8')
          label_sync='Full Notes 1.4 · Lesson-Synchronised Edition'
          label_pdf='Full Notes 1.4 · Original Coloured LaTeX PDF'
          block='''\n  upsertFullNotes("1.4",[\n    {label:"Full Notes 1.4 · Lesson-Synchronised Edition",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.4_Financial_Applications_Full_Notes_Student.html",type:"notes"},\n    {label:"Full Notes 1.4 · Original Coloured LaTeX PDF",url:"notes/ib-math-ai/unit-1/IB_AI_SL_1.4_Financial_Applications_Full_Notes_Student.pdf",type:"notes"}\n  ]);\n'''
          if label_sync not in unit and label_pdf not in unit:
              match=re.search(r'  upsertFullNotes\("1\.3",\[.*?\n  \]\);',unit,flags=re.S)
              if not match:
                  raise SystemExit('Could not locate Lesson 1.3 notes registration anchor')
              unit=unit[:match.end()]+block+unit[match.end():]
          elif not (label_sync in unit and label_pdf in unit):
              raise SystemExit('Partial Lesson 1.4 resource registration detected; refusing unsafe edit')
          if unit.count(label_sync)!=1 or unit.count(label_pdf)!=1:
              raise SystemExit('Lesson 1.4 resource labels must occur exactly once')
          if 'Teacher Key' in unit:
              raise SystemExit('Teacher Key must not be exposed in student resources')
          unit_path.write_text(unit,encoding='utf-8')

          cash_path=Path('lessons/ib-math-ai/unit-1/data/lesson-1.4-financial-v6-cashflows.js')
          cash=cash_path.read_text(encoding='utf-8')
          old='33,890.40'
          new='33,545.60'
          count=cash.count(old)
          if count==1:
              cash=cash.replace(old,new)
          elif count==0 and cash.count(new)==1:
              pass
          else:
              raise SystemExit(f'Expected exactly one old annuity answer, found {count}')
          cash_path.write_text(cash,encoding='utf-8')

          R=1200
          i=0.052/4
          n=24
          fv=R*((1+i)**n-1)/i
          if round(fv,2)!=33545.60:
              raise SystemExit(f'Independent annuity check failed: {fv}')
          print('Independent annuity check:',round(fv,2))
          PY

          grep -F 'Full Notes 1.4 · Lesson-Synchronised Edition' data/ib-math-ai-unit-1-update.js
          grep -F 'Full Notes 1.4 · Original Coloured LaTeX PDF' data/ib-math-ai-unit-1-update.js
          grep -F '33,545.60' lessons/ib-math-ai/unit-1/data/lesson-1.4-financial-v6-cashflows.js
          ! grep -F '33,890.40' lessons/ib-math-ai/unit-1/data/lesson-1.4-financial-v6-cashflows.js
          node --check data/ib-math-ai-unit-1-update.js
          node --check lessons/ib-math-ai/unit-1/data/lesson-1.4-financial-v6-cashflows.js

          rm -f .github/workflows/finalize-ib-ai-1-4-notes-card.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ib-math-ai-unit-1-update.js lessons/ib-math-ai/unit-1/data/lesson-1.4-financial-v6-cashflows.js .github/workflows/finalize-ib-ai-1-4-notes-card.yml
          git commit -m 'Add Lesson 1.4 dual Full Notes resources and repair annuity answer'
          git push origin HEAD:agent/ib-ai-1-4-notes-card-final

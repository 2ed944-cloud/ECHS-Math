name: Diagnose IB Browser Payload Mappings

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-ib-browser-payload-mappings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compare canonical rows with embedded payload mappings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {'apikey': key, 'authorization': f'Bearer {key}'}

          def get_rows(page_size=500):
              rows = []
              offset = 0
              select = 'organization_id,question_id,course_mappings,course_keys,student_visible,mapping_verified,trust_tier,payload'
              while True:
                  query = urllib.parse.urlencode({'select': select, 'order': 'question_id.asc'}, safe=',.*()[]:{}"')
                  request = urllib.request.Request(
                      f'{base}/rest/v1/private_bank_questions?{query}',
                      headers={**headers, 'range': f'{offset}-{offset + page_size - 1}'},
                  )
                  with urllib.request.urlopen(request, timeout=120) as response:
                      page = json.load(response)
                  rows.extend(page)
                  if len(page) < page_size:
                      return rows
                  offset += len(page)

          allowed = {'publisher_key_direct', 'student_ready_verified'}
          summary = collections.Counter()
          first_payload_courses = collections.Counter()
          canonical_lessons = collections.Counter()
          payload_lessons = collections.Counter()

          for row in get_rows():
              canonical = [m for m in (row.get('course_mappings') or []) if str((m or {}).get('course') or '') == 'ib-math-ai']
              if not canonical:
                  continue
              eligible = row.get('student_visible') is True and row.get('mapping_verified') is True and str(row.get('trust_tier') or '') in allowed
              if not eligible:
                  continue
              summary['eligible_canonical_rows'] += 1
              payload = row.get('payload') or {}
              embedded = payload.get('course_mappings') if isinstance(payload, dict) else []
              embedded = embedded if isinstance(embedded, list) else []
              payload_ib = [m for m in embedded if str((m or {}).get('course') or '') == 'ib-math-ai']
              if embedded:
                  summary['payload_has_any_mapping'] += 1
                  first_payload_courses[str((embedded[0] or {}).get('course') or 'missing')] += 1
              else:
                  summary['payload_has_no_mapping'] += 1
              if payload_ib:
                  summary['payload_has_ib_mapping'] += 1
              else:
                  summary['canonical_ib_but_payload_missing_ib'] += 1
              if embedded and not payload_ib:
                  summary['browser_payload_precedence_would_drop'] += 1
              canonical_keys = {(str(m.get('unit') or ''), str(m.get('lesson_key') or '')) for m in canonical}
              payload_keys = {(str(m.get('unit') or ''), str(m.get('lesson_key') or '')) for m in payload_ib}
              if canonical_keys == payload_keys:
                  summary['payload_exactly_matches_canonical_ib'] += 1
              else:
                  summary['payload_differs_from_canonical_ib'] += 1
              for mapping in canonical:
                  canonical_lessons[str((mapping or {}).get('lesson_key') or 'missing')] += 1
              for mapping in payload_ib:
                  payload_lessons[str((mapping or {}).get('lesson_key') or 'missing')] += 1

          output = {
              **dict(summary),
              'first_payload_courses': dict(first_payload_courses.most_common(10)),
              'top_canonical_lessons': dict(canonical_lessons.most_common(15)),
              'top_payload_ib_lessons': dict(payload_lessons.most_common(15)),
          }
          print('IB_BROWSER_MAPPING_DIAGNOSTIC=')
          print(json.dumps(output, indent=2, sort_keys=True))
          if not summary['eligible_canonical_rows']:
              raise SystemExit('No eligible canonical IB rows found')
          PY
name: Dispatch Teacher Upload Recovery

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main
    paths:
      - ".github/teacher-upload-recovery-trigger"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the protected upload processor
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run process-teacher-uploads.yml --repo "${{ github.repository }}" --ref main

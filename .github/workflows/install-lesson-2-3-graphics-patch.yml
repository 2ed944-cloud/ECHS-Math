name: Install Lesson 2.3 graphics precision patch

on:
  push:
    branches:
      - fix/ib-ai-2-3-graphics-layout-v5-2
    paths:
      - ".lesson23-graphics-patch/**"
      - ".github/workflows/install-lesson-2-3-graphics-patch.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ib-ai-2-3-graphics-layout-v5-2
          fetch-depth: 0

      - name: Apply and validate graphics repair
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G ".lesson23-graphics-patch/part-*" > /dev/null; then
            echo "Lesson 2.3 graphics patch has already been installed."
            exit 0
          fi
          cat .lesson23-graphics-patch/part-* > /tmp/lesson23-patch.z.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib
          encoded=Path('/tmp/lesson23-patch.z.b64').read_bytes()
          patch=zlib.decompress(base64.b64decode(encoded))
          Path('/tmp/lesson23-graphics.patch').write_bytes(patch)
          PY
          set +e
          patch -p1 --forward < /tmp/lesson23-graphics.patch
          patch_status=$?
          set -e
          mapfile -t rejects < <(find . -name '*.rej' -print)
          if (( ${#rejects[@]} )); then
            for reject in "${rejects[@]}"; do
              if [[ "$reject" != "./data/ib-math-ai-unit-2-update.js.rej" ]]; then
                echo "Unexpected rejected hunk: $reject"
                cat "$reject"
                exit 1
              fi
            done
          elif (( patch_status != 0 )); then
            echo "Patch returned $patch_status without a known metadata reject."
            exit "$patch_status"
          fi
          rm -f data/ib-math-ai-unit-2-update.js.rej data/ib-math-ai-unit-2-update.js.orig
          python3 - <<'PY'
          from pathlib import Path
          path=Path('data/ib-math-ai-unit-2-update.js')
          source=path.read_text(encoding='utf-8')
          source=source.replace("configure('2.3',{release:'5.0.0',organization_release:'5.0.0'", "configure('2.3',{release:'5.1.0',organization_release:'5.1.0'")
          source=source.replace("visualAudit:{purposeBuiltVisuals:59,interactiveLabs:2,mathGenerated:true}", "visualAudit:{purposeBuiltVisuals:59,uniqueRenderers:59,interactiveLabs:2,mathGenerated:true,clipSafe:true,discontinuitiesSegmented:true,shortViewportAudited:true}")
          if "configure('2.3',{release:'5.1.0'" not in source or 'discontinuitiesSegmented:true' not in source:
              raise SystemExit('Lesson 2.3 release metadata update failed')
          path.write_text(source,encoding='utf-8')
          PY
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-content-a.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-finalize.js
          node --check tools/test_ib_ai_2_3_definitive_v5.mjs
          node --check tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          node tools/test_ib_ai_2_3_definitive_v5.mjs .
          rm -rf .lesson23-graphics-patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-content-a.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-finalize.js \
            lessons/ib-math-ai/unit-2/assets/css/lesson-2.3-v5-graphics-layout-fix.css \
            lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.3_polynomial_rational_models_ECHS.html \
            tools/test_ib_ai_2_3_definitive_v5.mjs \
            tools/browser_qa_ib_ai_2_3_definitive_v5.mjs \
            data/ib-math-ai-unit-2-update.js \
            .lesson23-graphics-patch
          git commit -m "Repair Lesson 2.3 graphics and viewport precision"
          git push origin HEAD:fix/ib-ai-2-3-graphics-layout-v5-2

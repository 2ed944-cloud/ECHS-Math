name: Cancel Unsafe IB Repair

on:
  pull_request:
    paths:
      - ".github/workflows/cancel-unsafe-ib-repair.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel overly strict production repair run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "30499934046"
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/2ed944-cloud/ECHS-Math/actions/runs/${RUN_ID}/cancel"
          echo "Requested cancellation of repair run ${RUN_ID}."

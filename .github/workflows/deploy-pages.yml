name: Deploy ECHS Mathematics to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".nojekyll"
      - "login.html"
      - "sw.js"
      - "js/login.js"
      - "js/institution-client.js"
      - "js/institution-experience.js"
      - "js/institution-completion.js"
      - "css/institution*.css"
      - "question-bank/admin.html"
      - "question-bank/school-control.html"
      - "question-bank/teacher.html"
      - "question-bank/student.html"
      - "question-bank/parent.html"
      - "question-bank/js/**"
      - "tools/fingerprint_school_control.py"
      - "tools/test_institution_identity_mount.mjs"
      - "tools/validate_pages_artifact.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify identity rendering preserves the document root
        run: node tools/test_institution_identity_mount.mjs

      - name: Prepare immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _pages
          mkdir -p _pages
          rsync -a \
            --exclude='.git/' \
            --exclude='_pages/' \
            --exclude='.echs-backups/' \
            --exclude='node_modules/' \
            --exclude='supabase/.temp/' \
            ./ _pages/
          touch _pages/.nojekyll
          python tools/fingerprint_school_control.py _pages --sha "$GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "ref": os.environ["GITHUB_REF"],
              "deployed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path("_pages/deployment.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate exact Pages artifact
        run: python tools/validate_pages_artifact.py _pages --expected-sha "$GITHUB_SHA"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload exact Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live deployment identity and immutable School Control Center runtime
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          short="${GITHUB_SHA:0:12}"
          runtime_path="question-bank/js/school-control.${short}.js"
          client_path="js/institution-client.${short}.js"
          for attempt in $(seq 1 40); do
            echo "Live verification attempt ${attempt}/40"
            rm -f \
              /tmp/echs-deployment.json \
              /tmp/echs-school-control-assets.json \
              /tmp/echs-school-control.html \
              /tmp/echs-school-control.js \
              /tmp/echs-institution-client.js \
              /tmp/echs-sw.js
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${base}/deployment.json?sha=${GITHUB_SHA}" \
              --output /tmp/echs-deployment.json || true
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${base}/school-control-assets.json?sha=${GITHUB_SHA}" \
              --output /tmp/echs-school-control-assets.json || true
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${base}/question-bank/school-control.html?sha=${GITHUB_SHA}" \
              --output /tmp/echs-school-control.html || true
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${base}/${runtime_path}" \
              --output /tmp/echs-school-control.js || true
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${base}/${client_path}" \
              --output /tmp/echs-institution-client.js || true
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${base}/sw.js?sha=${GITHUB_SHA}" \
              --output /tmp/echs-sw.js || true
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["GITHUB_SHA"]
          token = expected[:12]
          deployment_path = Path("/tmp/echs-deployment.json")
          assets_path = Path("/tmp/echs-school-control-assets.json")
          control_path = Path("/tmp/echs-school-control.html")
          runtime_path = Path("/tmp/echs-school-control.js")
          client_path = Path("/tmp/echs-institution-client.js")
          worker_path = Path("/tmp/echs-sw.js")
          required = (deployment_path, assets_path, control_path, runtime_path, client_path, worker_path)
          if not all(path.is_file() for path in required):
              raise SystemExit(1)
          try:
              identity = json.loads(deployment_path.read_text(encoding="utf-8"))
              assets = json.loads(assets_path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(1)
          control = control_path.read_text(encoding="utf-8", errors="replace")
          runtime = runtime_path.read_text(encoding="utf-8", errors="replace")
          client = client_path.read_text(encoding="utf-8", errors="replace")
          worker = worker_path.read_text(encoding="utf-8", errors="replace")
          checks = [
              identity.get("sha") == expected,
              assets.get("sha") == expected,
              assets.get("token") == token,
              assets.get("runtime") == f"question-bank/js/school-control.{token}.js",
              len(control.encode("utf-8")) > 12000,
              "<!doctype html" in control.lower(),
              "School Control Center" in control,
              "institutionBody" in control,
              "accountRows" in control,
              f"js/school-control.{token}.js" in control,
              f"../js/institution-client.{token}.js" in control,
              "js/admin-accounts.js?v=" not in control,
              len(runtime.encode("utf-8")) > 10000,
              'requireAuth(["admin","teacher"])' in runtime,
              "accountRows" in runtime,
              "document.body.textContent" not in runtime,
              "document.write" not in runtime,
              "dataset.institutionAccessRole=current.role" in client,
              "dataset.institutionRole=current.role" not in client,
              "node===document.documentElement" in client,
              "Blocked identity text write to document root" in client,
              "echs-platform-school-control-v3" in worker,
          ]
          raise SystemExit(0 if all(checks) else 1)
          PY
            then
              echo "GitHub Pages immutable School Control Center verification: PASS"
              exit 0
            fi
            sleep 15
          done
          echo "GitHub Pages did not publish the protected School Control Center client for ${GITHUB_SHA}" >&2
          exit 1

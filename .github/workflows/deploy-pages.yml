name: Deploy ECHS Mathematics to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".nojekyll"
      - "login.html"
      - "sw.js"
      - "js/login.js"
      - "js/institution-client.js"
      - "css/institution*.css"
      - "question-bank/admin.html"
      - "question-bank/school-control.html"
      - "question-bank/teacher.html"
      - "question-bank/student.html"
      - "question-bank/parent.html"
      - "question-bank/js/**"
      - "tools/validate_pages_artifact.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _pages
          mkdir -p _pages
          rsync -a \
            --exclude='.git/' \
            --exclude='_pages/' \
            --exclude='.echs-backups/' \
            --exclude='node_modules/' \
            --exclude='supabase/.temp/' \
            ./ _pages/
          touch _pages/.nojekyll
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "ref": os.environ["GITHUB_REF"],
              "deployed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path("_pages/deployment.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate exact Pages artifact
        run: python tools/validate_pages_artifact.py _pages --expected-sha "$GITHUB_SHA"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload exact Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live deployment identity and fresh School Control Center
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 40); do
            echo "Live verification attempt ${attempt}/40"
            rm -f /tmp/echs-deployment.json /tmp/echs-school-control.html /tmp/echs-sw.js
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${base}/deployment.json?sha=${GITHUB_SHA}" \
              --output /tmp/echs-deployment.json || true
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${base}/question-bank/school-control.html?sha=${GITHUB_SHA}" \
              --output /tmp/echs-school-control.html || true
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "${base}/sw.js?sha=${GITHUB_SHA}" \
              --output /tmp/echs-sw.js || true
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["GITHUB_SHA"]
          deployment_path = Path("/tmp/echs-deployment.json")
          control_path = Path("/tmp/echs-school-control.html")
          worker_path = Path("/tmp/echs-sw.js")
          if not all(path.is_file() for path in (deployment_path, control_path, worker_path)):
              raise SystemExit(1)
          try:
              identity = json.loads(deployment_path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(1)
          control = control_path.read_text(encoding="utf-8", errors="replace")
          worker = worker_path.read_text(encoding="utf-8", errors="replace")
          checks = [
              identity.get("sha") == expected,
              len(control.encode("utf-8")) > 12000,
              "<!doctype html" in control.lower(),
              "School Control Center" in control,
              "institutionBody" in control,
              "accountRows" in control,
              control.strip().lower() != "admin",
              "echs-platform-auth-shell-v2" in worker,
          ]
          raise SystemExit(0 if all(checks) else 1)
          PY
            then
              echo "GitHub Pages live School Control Center verification: PASS"
              exit 0
            fi
            sleep 15
          done
          echo "GitHub Pages did not publish the expected School Control Center for ${GITHUB_SHA}" >&2
          exit 1

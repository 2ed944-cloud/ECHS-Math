name: IB Private Bank Mapping Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/ib-private-bank-mapping-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: institutional-production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore mappings with a valid official lesson and unit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import datetime
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers={'apikey':key,'authorization':f'Bearer {key}','content-type':'application/json'}
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          recovery_window='2026-07-29T23:32:00+00:00'

          catalog=json.load(open('data/ib-math-ai-lesson-catalog.json',encoding='utf-8'))
          expected={}
          for unit in catalog.get('units',[]):
              unit_number=int(unit['unit'])
              for lesson in unit.get('lessons',[]):
                  record={'unit':unit_number,'skill_key':str(lesson.get('skill_id') or ''),'lesson_title':str(lesson.get('title') or '')}
                  expected[str(lesson['lesson_key'])]=record
                  number=str(lesson.get('number') or '')
                  if number and number!='0':expected[number]=record
                  for delivery in lesson.get('delivery_lesson_numbers',[]):expected[str(delivery)]=record

          def request_json(url,*,method='GET',body=None,extra_headers=None,retries=6):
              data=None if body is None else json.dumps(body,ensure_ascii=False,separators=(',',':')).encode()
              last=None
              for attempt in range(retries):
                  try:
                      request=urllib.request.Request(url,headers={**headers,**(extra_headers or {})},method=method,data=data)
                      with urllib.request.urlopen(request,timeout=180) as response:
                          raw=response.read()
                          return json.loads(raw or b'null')
                  except urllib.error.HTTPError as error:
                      last=error
                      if error.code not in (408,425,429,500,502,503,504) or attempt+1>=retries:
                          detail=error.read().decode(errors='replace')[:1000]
                          raise RuntimeError(f'HTTP {error.code}: {detail}') from error
                  except (urllib.error.URLError,TimeoutError) as error:
                      last=error
                      if attempt+1>=retries:raise
                  time.sleep(1.5*(attempt+1))
              raise last

          def recent_rows(page_size=100):
              rows=[];offset=0
              while True:
                  query=urllib.parse.urlencode({
                      'select':'organization_id,question_id,course_mappings,student_visible,mapping_verified,payload,updated_at',
                      'updated_at':f'gte.{recovery_window}',
                      'order':'organization_id.asc,question_id.asc',
                  },safe=',.*()[]:{}"')
                  page=request_json(f'{base}/rest/v1/private_bank_questions?{query}',extra_headers={'range':f'{offset}-{offset+page_size-1}'})
                  rows.extend(page)
                  if len(page)<page_size:return rows
                  offset+=len(page)

          scanned=0;review_rows=0;restored_rows=0;restored_mappings=0;kept_withheld=0
          restored_lessons=collections.Counter();withheld_lessons=collections.Counter()

          for row in recent_rows():
              scanned+=1
              payload=row.get('payload') if isinstance(row.get('payload'),dict) else {}
              metadata=payload.get('metadata') if isinstance(payload.get('metadata'),dict) else {}
              review=metadata.get('ib_catalog_mapping_review') if isinstance(metadata.get('ib_catalog_mapping_review'),dict) else None
              if not review:continue
              review_rows+=1
              originals=review.get('original_ib_mappings') if isinstance(review.get('original_ib_mappings'),list) else []
              restorable=[];unresolved=[]
              for mapping in originals:
                  lesson=str((mapping or {}).get('lesson_key') or '')
                  lesson_expected=expected.get(lesson)
                  unit=int((mapping or {}).get('unit') if (mapping or {}).get('unit') is not None else -999)
                  if lesson_expected and unit==lesson_expected['unit'] and str((mapping or {}).get('skill_key') or '') and (mapping or {}).get('mapping_verified') is True:
                      restorable.append(mapping)
                  else:
                      unresolved.append(mapping)
              for mapping in unresolved:withheld_lessons[str((mapping or {}).get('lesson_key') or 'missing')]+=1
              if not restorable:
                  kept_withheld+=1
                  continue

              current=list(row.get('course_mappings') or [])
              signatures={(str((mapping or {}).get('course') or ''),str((mapping or {}).get('lesson_key') or ''),str((mapping or {}).get('skill_key') or '')) for mapping in current}
              for mapping in restorable:
                  signature=(str((mapping or {}).get('course') or ''),str((mapping or {}).get('lesson_key') or ''),str((mapping or {}).get('skill_key') or ''))
                  if signature not in signatures:
                      current.append(mapping);signatures.add(signature);restored_mappings+=1
                  restored_lessons[str((mapping or {}).get('lesson_key') or 'missing')]+=1

              course_keys=sorted({str(mapping.get('course') or '') for mapping in current if str(mapping.get('course') or '')})
              lesson_keys=sorted({f"{str(mapping.get('course') or '')}:{str(mapping.get('lesson_key') or '')}" for mapping in current if str(mapping.get('course') or '') and str(mapping.get('lesson_key') or '')})
              skill_candidates=sorted({str(mapping.get('skill_key') or '') for mapping in current if str(mapping.get('skill_key') or '')})
              verified=bool(current) and all(mapping.get('mapping_verified') is True for mapping in current)

              payload=dict(payload);payload['course_mappings']=current
              metadata=dict(metadata);metadata['student_ready']=verified
              metadata['ib_catalog_mapping_review']={
                  **review,
                  'status':'restored-catalogue-valid-lesson-unit',
                  'review_required':bool(unresolved),
                  'restored_at':now,
                  'restored_ib_mappings':restorable,
                  'remaining_unresolved_ib_mappings':unresolved,
                  'reason':'The official lesson key and unit are valid. Lesson-specific skill keys are accepted as finer-grained mappings beneath the platform catalogue skill.',
              }
              payload['metadata']=metadata
              classification=payload.get('classification') if isinstance(payload.get('classification'),dict) else {};classification=dict(classification)
              primary=restorable[0]
              classification.update({
                  'course_scope':'ib-math-ai',
                  'primary_unit':primary.get('unit'),
                  'primary_topic':primary.get('lesson_key'),
                  'primary_topic_title':primary.get('lesson_title') or primary.get('lesson_key'),
                  'topic':primary.get('lesson_key'),
                  'topic_title':primary.get('lesson_title') or primary.get('lesson_key'),
                  'ib_unit':primary.get('unit'),
                  'ib_lesson':primary.get('lesson_key'),
                  'ib_lesson_title':primary.get('lesson_title') or primary.get('lesson_key'),
                  'mapping_verified':True,
              })
              payload['classification']=classification
              canonical=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':'))
              patch={
                  'course_mappings':current,
                  'course_keys':course_keys,
                  'lesson_keys':lesson_keys,
                  'skill_candidates':skill_candidates,
                  'mapping_verified':verified,
                  'student_visible':verified,
                  'payload':payload,
                  'payload_sha256':hashlib.sha256(canonical.encode()).hexdigest(),
                  'updated_at':now,
              }
              organization_id=str(row['organization_id']);question_id=str(row['question_id'])
              patch_query=urllib.parse.urlencode({'organization_id':f'eq.{organization_id}','question_id':f'eq.{question_id}'},safe=',.*()[]:{}"')
              request_json(f'{base}/rest/v1/private_bank_questions?{patch_query}',method='PATCH',body=patch,extra_headers={'prefer':'return=minimal'})
              restored_rows+=1

          result={
              'recent_rows_scanned':scanned,
              'review_rows_found':review_rows,
              'rows_restored':restored_rows,
              'ib_mappings_restored':restored_mappings,
              'rows_kept_withheld_for_non_catalogue_lesson_or_unit':kept_withheld,
              'restored_lesson_counts':dict(sorted(restored_lessons.items())),
              'withheld_lesson_counts':dict(sorted(withheld_lessons.items())),
          }
          print('IB_PRIVATE_BANK_MAPPING_RECOVERY=')
          print(json.dumps(result,indent=2,sort_keys=True))
          if review_rows==0:raise SystemExit('No catalogue-repair review rows were found in the recovery window')
          PY

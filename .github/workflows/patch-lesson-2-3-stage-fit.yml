name: Patch Lesson 2.3 stage fit

on:
  push:
    branches:
      - fix/ib-ai-2-3-graphics-layout-v5-2
    paths:
      - ".github/workflows/patch-lesson-2-3-stage-fit.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ib-ai-2-3-graphics-layout-v5-2

      - name: Compact audited slides and repair hole mathematics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          build=Path('lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-build.js')
          source=build.read_text(encoding='utf-8')
          old="""const concept=(section,title,eyebrow,lead,items,visual='',note='')=>S(section,title,'content',eyebrow,`<div class=\"pr5-concept ${visual?'with-visual':''}\"><div>${lead?`<p class=\"pr5-lead\">${lead}</p>`:''}${cards(items)}${note?`<div class=\"pr5-note\">${note}</div>`:''}</div>${visual?V(visual,title):''}</div>`);"""
          new="""const concept=(section,title,eyebrow,lead,items,visual='',note='')=>S(section,title,'content',eyebrow,`<div class=\"pr5-concept ${visual?'with-visual':''} ${visual?`pr5-concept-${visual}`:''}\"><div>${lead?`<p class=\"pr5-lead\">${lead}</p>`:''}${cards(items)}${note?`<div class=\"pr5-note\">${note}</div>`:''}</div>${visual?V(visual,title):''}</div>`);"""
          if old not in source: raise SystemExit('concept helper contract not found')
          source=source.replace(old,new)
          old="""const W=(section,title,prompt,steps,result,interpretation='',visual='')=>S(section,title,'worked','Worked example',`<div class=\"pr5-worked\"><section class=\"pr5-question\"><span>QUESTION</span><h2>${prompt}</h2>${visual?V(visual,title):''}</section><section class=\"pr5-method\"><span>METHOD</span><ol>${steps.map(step=>`<li>${step}</li>`).join('')}</ol><div class=\"pr5-result\">${result}</div>${interpretation?`<p class=\"pr5-interpret\">${interpretation}</p>`:''}</section></div>`);"""
          new="""const W=(section,title,prompt,steps,result,interpretation='',visual='')=>S(section,title,'worked','Worked example',`<div class=\"pr5-worked ${visual?`pr5-worked-${visual}`:''}\"><section class=\"pr5-question\"><span>QUESTION</span><h2>${prompt}</h2>${visual?V(visual,title):''}</section><section class=\"pr5-method\"><span>METHOD</span><ol>${steps.map(step=>`<li>${step}</li>`).join('')}</ol><div class=\"pr5-result\">${result}</div>${interpretation?`<p class=\"pr5-interpret\">${interpretation}</p>`:''}</section></div>`);"""
          if old not in source: raise SystemExit('worked helper contract not found')
          build.write_text(source.replace(old,new),encoding='utf-8')

          content=Path('lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-content-b.js')
          source=content.read_text(encoding='utf-8')
          pattern=r"  S\('2\.3D','A hole is not a vertical asymptote','content','Cancellation preserves the exclusion',`[\s\S]*?\);\n\n  concept\('2\.3D','Signs determine rational branches'"
          replacement=r"""  S('2.3D','A hole is not a vertical asymptote','content','Cancellation preserves the exclusion',R`<div class="pr5-hole-comparison"><div class="pr5-two"><article class="pr5-panel"><h2>Removable hole</h2><div class="pr5-math">\[g(x)=\frac{x^2-1}{x-1}=x+1,\quad x\ne1\]</div><p>The graph is the line \(y=x+1\) with the point \((1,2)\) removed.</p></article><article class="pr5-panel"><h2>Vertical asymptote</h2><div class="pr5-math">\[h(x)=\frac1{x-1}\]</div><p>No factor cancels; values become unbounded as \(x\to1^\pm\).</p></article></div>${V('hole-vs-asymptote','A removable hole compared with a vertical asymptote')}</div>`);

  concept('2.3D','Signs determine rational branches'"""
          source,count=re.subn(pattern,replacement,source,count=1)
          if count!=1: raise SystemExit(f'hole slide replacement count={count}')
          content.write_text(source,encoding='utf-8')

          css=Path('lessons/ib-math-ai/unit-2/assets/css/lesson-2.3-v5-graphics-layout-fix.css')
          source=css.read_text(encoding='utf-8')
          marker='/* Lesson 2.3 v5.1.1 · audited stage-fit refinements */'
          block=r'''

/* Lesson 2.3 v5.1.1 · audited stage-fit refinements */
.pr5-rule-list>article>div{min-width:0}
.pr5-rule-list strong,.pr5-rule-list .katex{white-space:nowrap}
.pr5-hole-comparison{display:grid;gap:16px;align-items:center}

@media(min-width:1101px) and (max-height:950px){
  html.unit2-lesson-2-3-v5 .stage-inner{padding:18px 40px 24px}
  html.unit2-lesson-2-3-v5 .slide-title{font-size:clamp(2rem,3.15vw,3.25rem);margin:.2rem 0 .65rem}
  .pr5-definition-layout{grid-template-columns:minmax(0,1.08fr) minmax(390px,.72fr);gap:18px;align-items:start}
  .pr5-definition-layout .pr5-lead{margin:0 0 8px;font-size:16px;line-height:1.38}
  .pr5-definition-layout .pr5-rule-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .pr5-definition-layout .pr5-rule-list article{grid-template-columns:30px minmax(0,1fr);gap:7px;min-height:92px;padding:8px 9px}
  .pr5-definition-layout .pr5-rule-list article>b{width:28px;height:28px;font-size:16px}
  .pr5-definition-layout .pr5-rule-list span{font-size:9px;letter-spacing:.04em}
  .pr5-definition-layout .pr5-rule-list strong{font-size:1rem}
  .pr5-definition-layout .pr5-rule-list small{font-size:10.5px}
  .pr5-definition-layout .pr5-note{margin-top:8px;padding:9px 12px;font-size:12px}
  .pr5-definition-layout .pr5-visual>.pr5-svg{max-height:270px}

  .pr5-worked-cubic-regression,.pr5-worked-power-regression,.pr5-worked-rational-context-intersection{gap:14px}
  .pr5-worked-cubic-regression .pr5-question,.pr5-worked-cubic-regression .pr5-method,
  .pr5-worked-power-regression .pr5-question,.pr5-worked-power-regression .pr5-method,
  .pr5-worked-rational-context-intersection .pr5-question,.pr5-worked-rational-context-intersection .pr5-method{padding:14px 18px}
  .pr5-worked-cubic-regression .pr5-question h2,.pr5-worked-power-regression .pr5-question h2,
  .pr5-worked-rational-context-intersection .pr5-question h2{font-size:clamp(1.35rem,1.75vw,1.75rem);line-height:1.18;margin:6px 0}
  .pr5-worked-cubic-regression .pr5-visual>.pr5-svg,.pr5-worked-power-regression .pr5-visual>.pr5-svg,
  .pr5-worked-rational-context-intersection .pr5-visual>.pr5-svg{max-height:178px}
  .pr5-worked-cubic-regression .pr5-method ol,.pr5-worked-power-regression .pr5-method ol,
  .pr5-worked-rational-context-intersection .pr5-method ol{font-size:13.5px;line-height:1.38;margin:9px 0}
  .pr5-worked-cubic-regression .pr5-result,.pr5-worked-power-regression .pr5-result,
  .pr5-worked-rational-context-intersection .pr5-result{margin-top:9px;padding:10px;font-size:1.05rem}
  .pr5-worked-cubic-regression .pr5-interpret,.pr5-worked-power-regression .pr5-interpret,
  .pr5-worked-rational-context-intersection .pr5-interpret{margin-top:8px;font-size:12.5px}

  .pr5-concept-rational-asymptotes{grid-template-columns:minmax(0,.92fr) minmax(520px,1.08fr);gap:16px;align-items:center}
  .pr5-concept-rational-asymptotes .pr5-lead{margin-bottom:8px;font-size:16px}
  .pr5-concept-rational-asymptotes .pr5-card-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .pr5-concept-rational-asymptotes .pr5-card-grid article{padding:10px 12px}
  .pr5-concept-rational-asymptotes .pr5-card-grid p{font-size:12px;line-height:1.32}
  .pr5-concept-rational-asymptotes .pr5-math{margin:5px 0;padding:7px}
  .pr5-concept-rational-asymptotes .pr5-visual>.pr5-svg{max-height:300px}

  .pr5-hole-comparison{grid-template-columns:minmax(0,.8fr) minmax(520px,1.2fr);gap:14px}
  .pr5-hole-comparison .pr5-two{grid-template-columns:1fr;gap:9px}
  .pr5-hole-comparison .pr5-panel{padding:12px 15px}
  .pr5-hole-comparison .pr5-panel h2{font-size:1.35rem;margin-bottom:5px}
  .pr5-hole-comparison .pr5-panel p{font-size:12.5px;line-height:1.34;margin:7px 0 0}
  .pr5-hole-comparison .pr5-math{font-size:1rem;margin:5px 0;padding:7px}
  .pr5-hole-comparison .pr5-visual>.pr5-svg{max-height:310px}
}

@media(max-width:1100px){.pr5-hole-comparison{grid-template-columns:1fr}}
'''
          if marker not in source: source += block
          css.write_text(source,encoding='utf-8')

          files=[
            'lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.3_polynomial_rational_models_ECHS.html',
            'lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-finalize.js',
            'lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js',
            'tools/test_ib_ai_2_3_definitive_v5.mjs',
            'data/ib-math-ai-unit-2-update.js'
          ]
          for name in files:
            path=Path(name); text=path.read_text(encoding='utf-8')
            text=text.replace('5.1.0','5.1.1')
            path.write_text(text,encoding='utf-8')
          PY
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-build.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-content-b.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-finalize.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js
          node --check tools/test_ib_ai_2_3_definitive_v5.mjs
          node tools/test_ib_ai_2_3_definitive_v5.mjs .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-build.js \
                  lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-content-b.js \
                  lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-finalize.js \
                  lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js \
                  lessons/ib-math-ai/unit-2/assets/css/lesson-2.3-v5-graphics-layout-fix.css \
                  lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.3_polynomial_rational_models_ECHS.html \
                  tools/test_ib_ai_2_3_definitive_v5.mjs \
                  data/ib-math-ai-unit-2-update.js
          git commit -m "Fit audited Lesson 2.3 slides within every teaching viewport"
          git push origin HEAD:fix/ib-ai-2-3-graphics-layout-v5-2

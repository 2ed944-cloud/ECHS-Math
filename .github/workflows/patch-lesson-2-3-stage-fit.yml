name: Patch Lesson 2.3 stage fit

on:
  push:
    branches:
      - fix/ib-ai-2-3-graphics-layout-v5-2
    paths:
      - ".github/workflows/patch-lesson-2-3-stage-fit.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ib-ai-2-3-graphics-layout-v5-2

      - name: Compact audited slides and repair hole mathematics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          def dec(value): return base64.b64decode(value).decode('utf-8')
          build=Path('lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-build.js')
          source=build.read_text(encoding='utf-8')
          old=dec('')
          new=dec('')
          if old not in source: raise SystemExit('concept helper contract not found')
          source=source.replace(old,new)
          old=dec('')
          new=dec('')
          if old not in source: raise SystemExit('worked helper contract not found')
          build.write_text(source.replace(old,new),encoding='utf-8')

          content=Path('lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-content-b.js')
          source=content.read_text(encoding='utf-8')
          pattern=dec('ICBTXCgnMlwuM0QnLCdBIGhvbGUgaXMgbm90IGEgdmVydGljYWwgYXN5bXB0b3RlJywnY29udGVudCcsJ0NhbmNlbGxhdGlvbiBwcmVzZXJ2ZXMgdGhlIGV4Y2x1c2lvbicsYFtcc1xTXSo/XCk7XG5cbiAgY29uY2VwdFwoJzJcLjNEJywnU2lnbnMgZGV0ZXJtaW5lIHJhdGlvbmFsIGJyYW5jaGVzJw==')
          replacement=dec('')
          source,count=re.subn(pattern,replacement,source,count=1)
          if count!=1: raise SystemExit(f'hole slide replacement count={count}')
          content.write_text(source,encoding='utf-8')

          css=Path('lessons/ib-math-ai/unit-2/assets/css/lesson-2.3-v5-graphics-layout-fix.css')
          source=css.read_text(encoding='utf-8')
          marker='/* Lesson 2.3 v5.1.1 · audited stage-fit refinements */'
          if marker not in source: source+=dec('')
          css.write_text(source,encoding='utf-8')

          html=Path('lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.3_polynomial_rational_models_ECHS.html')
          html.write_text(html.read_text(encoding='utf-8').replace('v=5.1.0','v=5.1.1'),encoding='utf-8')

          browser=Path('tools/browser_qa_ib_ai_2_3_definitive_v5.mjs')
          source=browser.read_text(encoding='utf-8')
          source=source.replace('mathErrors:document.querySelectorAll','rawCommands:((document.getElementById(\'app\')?.innerText||\'\').match(/\\b(?:frac|sqrt|quad|pm)\\b/g)||[]).length,mathErrors:document.querySelectorAll')
          source=source.replace('s.raw===0&&s.mathErrors===0','s.raw===0&&s.rawCommands===0&&s.mathErrors===0')
          source=source.replace('s.stageFits&&s.unsafeSvgOverflow','s.stageFits&&s.rawCommands===0&&s.unsafeSvgOverflow')
          browser.write_text(source,encoding='utf-8')

          test=Path('tools/test_ib_ai_2_3_definitive_v5.mjs')
          source=test.read_text(encoding='utf-8')
          needle="for(const level of ['Foundation','Application','Reasoning','Challenge'])"
          assertion="fail(!d.slides.some(s=>/\\b(?:frac|sqrt|quad|pm)\\b/.test(String(s.html).replace(/\\\\(?:frac|sqrt|quad|pm)/g,''))),'raw mathematical command leaked into slide HTML');\n"
          if assertion not in source: source=source.replace(needle,assertion+needle)
          test.write_text(source,encoding='utf-8')
          PY
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-build.js
          node --check lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-content-b.js
          node --check tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          node --check tools/test_ib_ai_2_3_definitive_v5.mjs
          node tools/test_ib_ai_2_3_definitive_v5.mjs .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-build.js \
                  lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-content-b.js \
                  lessons/ib-math-ai/unit-2/assets/css/lesson-2.3-v5-graphics-layout-fix.css \
                  lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.3_polynomial_rational_models_ECHS.html \
                  tools/test_ib_ai_2_3_definitive_v5.mjs \
                  tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          git commit -m "Fit audited Lesson 2.3 slides within every teaching viewport"
          git push origin HEAD:fix/ib-ai-2-3-graphics-layout-v5-2

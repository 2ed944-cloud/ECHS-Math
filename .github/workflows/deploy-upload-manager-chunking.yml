name: Deploy Upload Manager Chunking

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/upload-manager-api/**'
      - 'question-bank/official/admin/js/upload-manager.js'
      - 'question-bank/official/admin/upload-manager.html'
      - 'tools/process_teacher_upload_request_fast.py'
      - '.github/workflows/deploy-upload-manager-chunking.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: institutional-production-upload-manager-chunking
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: institutional-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm required encrypted secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required encrypted secret: $name" >&2
              exit 1
            fi
          done
          test "$SUPABASE_PROJECT_ID" = "wkqadnfloiohqfnesmyq" || {
            echo "SUPABASE_PROJECT_REF points to the wrong project" >&2
            exit 1
          }

      - name: Validate Upload Manager contracts
        run: python tools/validate_upload_manager.py

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy chunk-aware Upload Manager API
        run: supabase functions deploy upload-manager-api --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Verify deployed health contract
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/upload-manager-api/health")"
          printf '%s' "$result" | python -m json.tool
          RESULT="$result" python - <<'PY'
          import json, os
          payload=json.loads(os.environ['RESULT'])
          assert payload.get('ok') is True
          assert payload.get('version') == '1.3.0-free-tier-chunked'
          assert payload.get('chunk_bytes') == 41943040
          print('Chunked Upload Manager production health: PASS')
          PY

      - name: Deployment summary
        run: |
          echo "Upload Manager now splits packages into <=40 MiB private objects."
          echo "The processor reassembles and verifies the original ZIP before import."

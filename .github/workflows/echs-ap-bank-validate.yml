name: Validate ECHS AP v5 Question Bank

on:
  push:
    paths:
      - 'question-bank/official/**'
      - 'js/official-ap-integration.js'
      - '.github/workflows/echs-ap-bank-validate.yml'
  pull_request:
    paths:
      - 'question-bank/official/**'
      - 'js/official-ap-integration.js'
      - '.github/workflows/echs-ap-bank-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the independently audited release validator
        run: python question-bank/official/tools/validate_release.py

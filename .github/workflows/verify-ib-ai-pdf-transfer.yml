name: Verify IB AI PDF transfer
on:
  push:
    branches:
      - agent/ib-ai-dual-notes-merge-final
permissions:
  issues: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify first transfer chunk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, hashlib
          req=urllib.request.Request(
            'https://api.github.com/repos/2ed944-cloud/ECHS-Math/issues/210/comments?per_page=100',
            headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          comments=json.load(urllib.request.urlopen(req))
          target='12z64-01'
          expected='e06c6ab8707629bb57179c74af9b666727688565d21f98b0957bd920ae524dd1'
          candidates=[]
          for c in comments:
            lines=c.get('body','').splitlines()
            if len(lines)>=3 and lines[0].strip()==target:
              payload=''.join(''.join(lines[2:]).split())
              actual=hashlib.sha256(payload.encode()).hexdigest()
              candidates.append((len(payload),actual))
              if actual==expected:
                print('VALID',target,len(payload),actual)
                raise SystemExit(0)
          print('CANDIDATES',candidates)
          raise SystemExit('no valid transfer chunk found')
          PY

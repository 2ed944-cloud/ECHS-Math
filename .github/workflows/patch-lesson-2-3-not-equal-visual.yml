name: Patch Lesson 2.3 not-equal visual

on:
  push:
    branches:
      - fix/ib-ai-2-3-graphics-layout-v5-2
    paths:
      - ".github/workflows/patch-lesson-2-3-not-equal-visual.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ib-ai-2-3-graphics-layout-v5-2

      - name: Draw not-equal relations and calibrate visual QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css=Path('lessons/ib-math-ai/unit-2/assets/css/lesson-2.3-v5-graphics-layout-fix.css')
          source=css.read_text(encoding='utf-8')
          marker='/* Lesson 2.3 v5.1.3 · visible not-equal relation */'
          if marker not in source:
            source += r'''

/* Lesson 2.3 v5.1.3 · visible not-equal relation */
.unit2-lesson-2-3-v5 .katex-html .mrel:has(> .mrel > .mord.vbox){position:relative;display:inline-block}
.unit2-lesson-2-3-v5 .katex-html .mrel:has(> .mrel > .mord.vbox)::after{content:"";position:absolute;left:50%;top:50%;width:.075em;height:1.02em;border-radius:999px;background:currentColor;transform:translate(-50%,-50%) rotate(52deg);transform-origin:center;z-index:3;pointer-events:none}
.unit2-lesson-2-3-v5 .katex-html .mrel:has(> .mrel > .mord.vbox)> .mrel > .mord.vbox{visibility:hidden}
'''
          css.write_text(source,encoding='utf-8')

          browser=Path('tools/browser_qa_ib_ai_2_3_definitive_v5.mjs')
          source=browser.read_text(encoding='utf-8')
          if 'item.width>70' not in source: raise SystemExit('horizontal expression threshold contract missing')
          source=source.replace('item.width>70','item.width>30',1)
          marker=" await gotoTitle(page,'A hole is not a vertical asymptote');"
          check=""" const notEqualStroke=await page.evaluate(()=>{const rel=document.querySelector('.pr5-concept-rational-asymptotes .katex-html .mrel:has(> .mrel > .mord.vbox)');if(!rel)return null;const style=getComputedStyle(rel,'::after');return{content:style.content,width:parseFloat(style.width),height:parseFloat(style.height),background:style.backgroundColor,transform:style.transform};});check('not-equal relation has a visible diagonal stroke',!!notEqualStroke&&notEqualStroke.content!=='none'&&notEqualStroke.width>=1&&notEqualStroke.height>=8&&notEqualStroke.background!=='rgba(0, 0, 0, 0)'&&notEqualStroke.transform!=='none',JSON.stringify(notEqualStroke));
"""
          if 'not-equal relation has a visible diagonal stroke' not in source:
            if marker not in source: raise SystemExit('not-equal QA insertion point missing')
            source=source.replace(marker,check+marker,1)
          browser.write_text(source,encoding='utf-8')

          html=Path('lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.3_polynomial_rational_models_ECHS.html')
          text=html.read_text(encoding='utf-8').replace('v=5.1.2','v=5.1.3')
          if 'v=5.1.3' not in text: raise SystemExit('asset cache version update failed')
          html.write_text(text,encoding='utf-8')

          for name in [
            'lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-finalize.js',
            'lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js',
            'tools/test_ib_ai_2_3_definitive_v5.mjs'
          ]:
            path=Path(name)
            text=path.read_text(encoding='utf-8').replace('5.1.2','5.1.3')
            path.write_text(text,encoding='utf-8')

          metadata=Path('data/ib-math-ai-unit-2-update.js')
          text=metadata.read_text(encoding='utf-8')
          old="configure('2.3',{release:'5.1.2',organization_release:'5.1.2'"
          new="configure('2.3',{release:'5.1.3',organization_release:'5.1.3'"
          if old not in text: raise SystemExit('Lesson 2.3 metadata version contract missing')
          metadata.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          for file in lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-*.js; do node --check "$file"; done
          node --check tools/test_ib_ai_2_3_definitive_v5.mjs
          node --check tools/browser_qa_ib_ai_2_3_definitive_v5.mjs
          node tools/test_ib_ai_2_3_definitive_v5.mjs .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lessons/ib-math-ai/unit-2/assets/css/lesson-2.3-v5-graphics-layout-fix.css \
                  lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.3_polynomial_rational_models_ECHS.html \
                  lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-finalize.js \
                  lessons/ib-math-ai/unit-2/data/lesson-2.3-v5-graphics.js \
                  tools/test_ib_ai_2_3_definitive_v5.mjs \
                  tools/browser_qa_ib_ai_2_3_definitive_v5.mjs \
                  data/ib-math-ai-unit-2-update.js
          git commit -m "Render Lesson 2.3 not-equal relations accurately"
          git push origin HEAD:fix/ib-ai-2-3-graphics-layout-v5-2

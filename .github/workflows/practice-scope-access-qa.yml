name: Strict Practice Scope QA

on:
  pull_request:
    paths:
      - "question-bank/practice.html"
      - "question-bank/css/practice-scope-access.css"
      - "question-bank/css/practice-recovery-polish.css"
      - "question-bank/js/bank.js"
      - "question-bank/js/private-bank-assets.js"
      - "question-bank/js/practice-course-isolation.js"
      - "question-bank/js/mapped-private-bank-practice.js"
      - "question-bank/js/mapped-practice.js"
      - "question-bank/js/practice-single-bank.js"
      - "question-bank/js/practice-builder.js"
      - "question-bank/js/practice-recovery-ui.js"
      - "js/ib-lesson-platform-integration.js"
      - "js/institution-portal.js"
      - "js/unit-practice-unlock.js"
      - "css/unit-practice-unlock.css"
      - "supabase/functions/practice-bank-api/**"
      - "supabase/config.toml"
      - "sw.js"
      - "tools/test_practice_scope_access.py"
      - "tools/test_calculus_only_practice.py"
      - "tools/test_practice_course_isolation.mjs"
      - "tools/test_student_single_bank.mjs"
      - ".github/workflows/practice-scope-access-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate strict practice contracts
        run: python tools/test_practice_scope_access.py

      - name: Validate Calculus-only bank boundary
        run: python tools/test_calculus_only_practice.py

      - name: Verify course isolation
        run: node tools/test_practice_course_isolation.mjs

      - name: Verify student single-bank isolation
        run: node tools/test_student_single_bank.mjs

name: Install verified IB AI SL lesson 2.5 payload

on:
  push:
    branches:
      - agent/ib-ai-lesson-2-5-v5
    paths:
      - '.github/workflows/unpack-lesson25-v5.yml'

permissions:
  contents: write
  issues: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: '223'
      EXPECTED_CHUNKS: '15'
      ZIP_SHA256: 'c6b9bae506f47cfec797f422475876b35a2f1bde024b95966682ca55d0d2545e'
      BRANCH_NAME: 'agent/ib-ai-lesson-2-5-v5'
    steps:
      - name: Check out lesson branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0

      - name: Reconstruct and verify payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python - <<'PY' > lesson25-reconstruct.log 2>&1
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.request
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          issue = os.environ['ISSUE_NUMBER']
          token = os.environ['GH_TOKEN']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)

          pattern = re.compile(
              r'^ECHS_L25_CHUNK (\d{3})/(\d{3}) ([0-9a-f]{64})\n([A-Za-z0-9+/=]+)$'
          )
          chunks = {}
          declared_total = None
          known_truncated_chunk = {
              14: {
                  'length': 4999,
                  'transport_sha256': '88d329bf9c9b57c6529f2666e5ee4a942c1423deadbce2479147638c51e16c39',
              },
          }
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def recover_single_missing_character(index, payload, declared_hash):
              expected = known_truncated_chunk.get(index)
              actual_hash = hashlib.sha256(payload.encode('ascii')).hexdigest()
              if not expected:
                  raise SystemExit(
                      f'Chunk {index} hash mismatch: {actual_hash}; declared {declared_hash}'
                  )
              if len(payload) != expected['length'] or actual_hash != expected['transport_sha256']:
                  raise SystemExit(
                      f'Chunk {index} does not match the known one-character transport truncation.'
                  )

              payload_bytes = payload.encode('ascii')
              declared_bytes = bytes.fromhex(declared_hash)
              matches = []
              for position in range(len(payload_bytes) + 1):
                  prefix = payload_bytes[:position]
                  suffix = payload_bytes[position:]
                  for character in alphabet.encode('ascii'):
                      candidate = prefix + bytes((character,)) + suffix
                      if hashlib.sha256(candidate).digest() == declared_bytes:
                          matches.append((position, character, candidate))
                          if len(matches) > 1:
                              raise SystemExit(
                                  f'Chunk {index} recovery is ambiguous: more than one SHA match.'
                              )
              if len(matches) != 1:
                  raise SystemExit(
                      f'Chunk {index} recovery failed: expected one SHA match, found {len(matches)}.'
                  )
              position, character, candidate = matches[0]
              repaired = candidate.decode('ascii')
              repaired_hash = hashlib.sha256(candidate).hexdigest()
              if repaired_hash != declared_hash or len(repaired) != 5000:
                  raise SystemExit(f'Chunk {index} recovery did not reproduce the declared payload.')
              print(
                  f'Chunk {index}: restored one missing Base64 character at offset {position}; '
                  f'declared SHA-256 reproduced exactly.'
              )
              return repaired

          for item in comments:
              match = pattern.fullmatch(item.get('body', '').strip())
              if not match:
                  continue
              index = int(match.group(1))
              total = int(match.group(2))
              declared_hash = match.group(3)
              payload = match.group(4)
              actual_hash = hashlib.sha256(payload.encode('ascii')).hexdigest()
              if actual_hash != declared_hash:
                  payload = recover_single_missing_character(index, payload, declared_hash)
                  actual_hash = hashlib.sha256(payload.encode('ascii')).hexdigest()
              if actual_hash != declared_hash:
                  raise SystemExit(f'Chunk {index} failed final SHA-256 verification.')
              if declared_total is None:
                  declared_total = total
              if total != declared_total:
                  raise SystemExit('Inconsistent chunk totals')
              if index in chunks:
                  raise SystemExit(f'Duplicate chunk {index}')
              chunks[index] = payload

          expected = int(os.environ['EXPECTED_CHUNKS'])
          expected_indices = list(range(1, expected + 1))
          if declared_total != expected or sorted(chunks) != expected_indices:
              raise SystemExit(f'Missing chunks: got {sorted(chunks)}')

          encoded = ''.join(chunks[index] for index in expected_indices)
          if len(encoded) % 4:
              raise SystemExit(f'Base64 length is not aligned after repair: {len(encoded)}')
          archive_bytes = base64.b64decode(encoded, validate=True)
          archive_hash = hashlib.sha256(archive_bytes).hexdigest()
          if archive_hash != os.environ['ZIP_SHA256']:
              raise SystemExit(f'ZIP SHA-256 mismatch: {archive_hash}')

          archive_path = 'lesson25-package.zip'
          with open(archive_path, 'wb') as handle:
              handle.write(archive_bytes)

          allowed = {
              'lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.5_transformations_composition_inverses_ECHS.html',
              'lessons/ib-math-ai/unit-2/assets/css/lesson-2.5-v5-core.css',
              'lessons/ib-math-ai/unit-2/assets/css/lesson-2.5-v5-responsive-ti84.css',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-build.js',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-a.js',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-b.js',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-c.js',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-finalize.js',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-graphics.js',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-interactions.js',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-ti84.js',
              'tools/test_ib_ai_2_5_definitive_v5.py',
          }
          with zipfile.ZipFile(archive_path) as archive:
              corrupt = archive.testzip()
              if corrupt:
                  raise SystemExit(f'Corrupt archive member: {corrupt}')
              names = set(archive.namelist())
              if names != allowed:
                  raise SystemExit(f'Unexpected archive paths: {sorted(names ^ allowed)}')
              archive.extractall('.')
          os.remove(archive_path)
          print(f'Verified ZIP SHA-256 and extracted {len(allowed)} exact files.')
          PY
          status=$?
          cat lesson25-reconstruct.log
          if [ "$status" -ne 0 ]; then
            diagnostic=$(tail -c 3000 lesson25-reconstruct.log)
            body=$(printf 'ECHS_L25_DIAGNOSTIC\n```text\n%s\n```' "$diagnostic")
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="$body"
            exit "$status"
          fi
          rm -f lesson25-reconstruct.log

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run lesson QA
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tools/test_ib_ai_2_5_definitive_v5.py
          for file in \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-build.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-a.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-b.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-c.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-finalize.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-graphics.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-interactions.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-ti84.js
          do
            node --check "$file"
          done

      - name: Verify exact Git blob fingerprints
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              'lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.5_transformations_composition_inverses_ECHS.html': '67edfb2008fc9ea1dc5fde66fbcf19c18601dea6',
              'lessons/ib-math-ai/unit-2/assets/css/lesson-2.5-v5-core.css': 'b5202225ffb5936dcf00cccd7b52fa3aae201d16',
              'lessons/ib-math-ai/unit-2/assets/css/lesson-2.5-v5-responsive-ti84.css': 'e5b3d204d6e293ca9ac26ebdd382974a62cbdad1',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-build.js': '44198fcdff123799cf0ddf0801716ba0458afd27',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-a.js': '7d646e17afbe15f98a340d382796541e97b02d17',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-b.js': 'b5aed77f994e6229e06b8a49c8d3577c5013b8f9',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-c.js': '83385c4320181ee8e29b206aa74d262c976665e1',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-finalize.js': '2d59027da005c740e0cf21eb236abf6f9c46a838',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-graphics.js': '838f9ff0ca0bfb14e432774f78bd1725ae2aee83',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-interactions.js': '465d6ac156195e4ec693eef3c05186271abba5aa',
              'lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-ti84.js': '1f92894cc824b603ad773aa1f09afdfd67b5a42b',
              'tools/test_ib_ai_2_5_definitive_v5.py': '90e12e357ea6a3e9d58f7acb33a1a2ada732fa46',
          }
          for path, expected_hash in expected.items():
              data = Path(path).read_bytes()
              header = f'blob {len(data)}\0'.encode()
              actual_hash = hashlib.sha1(header + data).hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit(f'{path}: {actual_hash} != {expected_hash}')
              print(actual_hash, path)
          PY

      - name: Commit verified lesson files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ECHS Lesson Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lessons/ib-math-ai/unit-2/lessons/IB_AI_SL_2.5_transformations_composition_inverses_ECHS.html \
            lessons/ib-math-ai/unit-2/assets/css/lesson-2.5-v5-core.css \
            lessons/ib-math-ai/unit-2/assets/css/lesson-2.5-v5-responsive-ti84.css \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-build.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-a.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-b.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-content-c.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-finalize.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-graphics.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-interactions.js \
            lessons/ib-math-ai/unit-2/data/lesson-2.5-v5-ti84.js \
            tools/test_ib_ai_2_5_definitive_v5.py
          git commit -m 'Strengthen IB AI SL lesson 2.5 [skip ci]'
          git push origin "HEAD:${BRANCH_NAME}"

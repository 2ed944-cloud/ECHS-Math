name: Membership authorization and atomic roster contracts

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/institution-api/**'
      - 'supabase/functions/mastery-evidence/**'
      - 'tools/test_membership_authorization*'
      - 'tools/membership_authorization_rpc_fixture.py'
      - '.github/workflows/membership-authorization.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/institution-api/**'
      - 'supabase/functions/mastery-evidence/**'
      - 'tools/test_membership_authorization*'
      - 'tools/membership_authorization_rpc_fixture.py'
      - '.github/workflows/membership-authorization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handler-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Exercise actual handler authorization and preservation
        run: node tools/test_membership_authorization_api.mjs
      - name: Check both deployable TypeScript entrypoints
        run: deno check supabase/functions/institution-api/index.ts supabase/functions/mastery-evidence/index.ts

  postgres15:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: echs_membership_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d echs_membership_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ECHS_MEMBERSHIP_TEST_DSN: postgresql://postgres:isolated-fixture-only@127.0.0.1:5432/echs_membership_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated database driver
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Verify actual migrations, grants, transactions and concurrency
        run: python tools/test_membership_authorization_database.py --report reports/membership-authorization-database.json
      - name: Exercise actual HTTP handler and actual service-role SQL
        run: node tools/test_membership_authorization_e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membership-authorization-contracts
          path: reports/membership-authorization-*.json
          if-no-files-found: warn
          retention-days: 7

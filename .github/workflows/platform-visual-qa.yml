# Premium overflow diagnostics enabled for all role portals.
name: Platform Visual QA

on:
  pull_request:
    paths:
      - "index.html"
      - "login.html"
      - "setup.html"
      - "privacy.html"
      - "accessibility.html"
      - "sources-and-rights.html"
      - "404.html"
      - "config/**"
      - "css/**"
      - "js/**"
      - "question-bank/**"
      - "lessons/ib-math-ai/**"
      - "tools/capture_phase1_preview.mjs"
      - "tools/capture_private_bank_center.mjs"
      - "tools/capture_upload_manager.mjs"
      - "tools/browser_qa_ib_ai_1_4_financial_v6.mjs"
      - "tools/browser_qa_ib_ai_2_1_definitive_v4.mjs"
      - ".github/workflows/platform-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate lesson-first portal structure
        run: python3 tools/validate_lesson_portal_calm.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.54.1
      - name: Start local platform server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/echs-preview-server.log 2>&1 &
          echo $! > /tmp/echs-preview-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/echs-preview-server.log
          exit 1
      - name: Validate and capture Financial Applications v6
        env:
          ECHS_PREVIEW_URL: http://127.0.0.1:4173
          ECHS_PREVIEW_OUTPUT: artifacts/phase3-visual
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/browser_qa_ib_ai_1_4_financial_v6.mjs
      - name: Validate and capture Functions Lesson 2.1 v4
        env:
          ECHS_PREVIEW_URL: http://127.0.0.1:4173
          ECHS_PREVIEW_OUTPUT: artifacts/phase3-visual
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/browser_qa_ib_ai_2_1_definitive_v4.mjs
      - name: Capture desktop and mobile pages
        env:
          ECHS_PREVIEW_URL: http://127.0.0.1:4173
          ECHS_PREVIEW_OUTPUT: artifacts/phase3-visual
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/capture_phase1_preview.mjs
      - name: Capture Private Bank Center
        env:
          ECHS_PREVIEW_URL: http://127.0.0.1:4173
          ECHS_PREVIEW_OUTPUT: artifacts/phase3-visual
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/capture_private_bank_center.mjs
      - name: Capture Teacher Upload Manager
        env:
          ECHS_PREVIEW_URL: http://127.0.0.1:4173
          ECHS_PREVIEW_OUTPUT: artifacts/phase3-visual
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/capture_upload_manager.mjs
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-visual-qa-${{ github.run_number }}
          path: artifacts/phase3-visual
          if-no-files-found: error
          retention-days: 14

  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g10b-r0.1-entry-diagnostic-v1";
    const practice=[{"id":"E1","level":"Easy","calc":false,"strand":"Algebra","prompt":"Evaluate 5−2(3−7).","options":["13","−3","−5","21"],"answer":0,"solution":"Work inside parentheses first: 3−7=−4, so 5−2(−4)=5+8=13."},{"id":"E2","level":"Easy","calc":false,"strand":"Equations","prompt":"Solve 4x+3=19.","options":["x=3","x=4","x=5","x=11/2"],"answer":1,"solution":"Subtract 3 to get 4x=16, then divide by 4: x=4."},{"id":"E3","level":"Easy","calc":false,"strand":"Functions","prompt":"For f(x)=3x−5, find f(2).","options":["−1","0","1","6"],"answer":2,"solution":"Substitute the input: f(2)=3(2)−5=1."},{"id":"E4","level":"Easy","calc":false,"strand":"Graph reading","prompt":"A table has x=0,2,4 and y=1,5,9. What is the rate of change?","options":["2","4","1/2","8"],"answer":0,"solution":"Each output increase of 4 corresponds to an input increase of 2, so Δy/Δx=4/2=2."},{"id":"M1","level":"Medium","calc":false,"strand":"Factoring","prompt":"Factor x²+7x+12 completely.","options":["(x+2)(x+6)","(x+3)(x+4)","(x−3)(x−4)","(x+1)(x+12)"],"answer":1,"solution":"The factors 3 and 4 multiply to 12 and add to 7, so x²+7x+12=(x+3)(x+4)."},{"id":"M2","level":"Medium","calc":false,"strand":"Exponents","prompt":"Simplify 2³·2⁻⁵.","options":["4","−4","1/4","1/8"],"answer":2,"solution":"Add exponents: 2³·2⁻⁵=2⁻²=1/2²=1/4."},{"id":"M3","level":"Medium","calc":false,"strand":"Radicals","prompt":"Simplify √72.","options":["8√2","6√2","4√3","12√2"],"answer":1,"solution":"√72=√(36·2)=6√2."},{"id":"M4","level":"Medium","calc":false,"strand":"Systems","prompt":"Solve x+y=9 and x−y=3.","options":["(6,3)","(3,6)","(9,3)","(4,5)"],"answer":0,"solution":"Adding gives 2x=12, so x=6; then y=3. The pair verifies both equations."},{"id":"M5","level":"Medium","calc":false,"strand":"Domain","prompt":"State the real domain restriction for r(x)=1/(x−5).","options":["x>5","x≠5","x≥5","x≠−5"],"answer":1,"solution":"The denominator cannot be zero, so x−5≠0 and x≠5."},{"id":"M6","level":"Medium","calc":false,"strand":"Quadratics","prompt":"What is the vertex of q(x)=(x+2)²−9?","options":["(2,−9)","(−2,9)","(−2,−9)","(9,−2)"],"answer":2,"solution":"Vertex form (x−h)²+k has h=−2 and k=−9, so the vertex is (−2,−9)."},{"id":"H1","level":"Hard","calc":false,"strand":"Quadratics","prompt":"Solve 2x²−5x−3=0.","options":["x=−3 or 1/2","x=−1/2 or 3","x=1/2 or 3","x=−1 or 3/2"],"answer":1,"solution":"2x²−5x−3=(2x+1)(x−3), so x=−1/2 or x=3."},{"id":"H2","level":"Hard","calc":false,"strand":"Inequalities","prompt":"Solve −3(2x+1)≤9.","options":["x≥−2","x≤−2","x≥2","x≤2"],"answer":0,"solution":"−6x−3≤9 gives −6x≤12. Dividing by −6 reverses the inequality: x≥−2."},{"id":"H3","level":"Hard","calc":false,"strand":"Representations","prompt":"For x=−1,0,1,2, a table gives y=4,1,0,1. Which formula matches?","options":["y=(x+1)²","y=x²+1","y=(x−1)²","y=2x+1"],"answer":2,"solution":"The values are symmetric about x=1 with minimum 0; y=(x−1)² matches every row."},{"id":"H4","level":"Hard","calc":true,"strand":"Trigonometry","prompt":"In a right triangle, sin θ=7/25. Find acute θ to the nearest tenth of a degree.","options":["14.0°","16.3°","23.7°","73.7°"],"answer":1,"solution":"In degree mode, θ=sin⁻¹(7/25)≈16.2602°, which rounds to 16.3°."},{"id":"H5","level":"Hard","calc":true,"strand":"Calculator habits","prompt":"A regression model is ŷ=2.4x+7.1. Predict y when x=8.5.","options":["20.4","25.1","27.5","31.0"],"answer":2,"solution":"Substitute without premature rounding: 2.4(8.5)+7.1=20.4+7.1=27.5."},{"id":"H6","level":"Hard","calc":false,"strand":"Domain and range","prompt":"A line segment has closed endpoints (−3,5) and (4,−2). What are its domain and range?","options":["Domain [−3,4], range [−2,5]","Domain [−2,5], range [−3,4]","Domain (−3,4), range (−2,5)","All real numbers for both"],"answer":0,"solution":"Closed endpoints are included. x-values run from −3 to 4 and y-values run from −2 to 5."},{"id":"C1","level":"Challenge","calc":false,"strand":"Error analysis","prompt":"A learner writes √(x²)=x for every real x. Which diagnosis and repair are correct?","options":["Procedural; square both sides","Conceptual/notation; √(x²)=|x| because the principal square root is nonnegative","Attention; change x to −x","No error exists"],"answer":1,"solution":"The principal square root is nonnegative, so √(x²)=|x|. The error concerns meaning and notation, not arithmetic."},{"id":"C2","level":"Challenge","calc":false,"strand":"Radical equations","prompt":"Solve √(x+2)=x over the reals.","options":["x=−1 only","x=−1 or 2","x=2 only","No real solution"],"answer":2,"solution":"Require x≥0. Squaring gives x²−x−2=0, so candidates are −1 and 2; only x=2 verifies."},{"id":"C3","level":"Challenge","calc":false,"strand":"Diagnostic classification","prompt":"A learner repeatedly finds correct numerical values but omits restrictions, units, and interval brackets. What evidence category is most precise?","options":["Conceptual gap in every topic","Communication/notation gap that needs targeted verification","Calculator dependency only","No gap because the numbers are correct"],"answer":1,"solution":"Repeatedly missing restrictions, units, and endpoint notation is a communication/notation pattern; targeted tasks should confirm whether the concepts are otherwise secure."},{"id":"C4","level":"Challenge","calc":false,"strand":"Flex-group decision","prompt":"A learner is secure in functions and trigonometry but misses factoring and radical simplification. What is the best first response?","options":["Restart the entire course for everyone","Assign a short factoring/radical repair group and reassess those strands","Move directly to new logarithm content","Ignore the gaps because two strands are secure"],"answer":1,"solution":"The diagnostic should trigger evidence-based flex groups limited to the structural gaps that block upcoming work."}];

    const slides=[];
    function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function add(stage,title,body,cls){slides.push({stage:stage,title:title,body:body,cls:cls||""});}
    function head(kicker,title){return '<div class="slide-head"><div><p class="eyebrow">'+kicker+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';}
    function reveal(label,body){return '<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';}
    function turn(prompt,answer){return '<div class="question-box"><p class="question-prompt">'+prompt+'</p><textarea class="scratch" data-save="turn-'+slides.length+'" aria-label="Student reasoning"></textarea>'+reveal("Reveal verified reasoning",'<p>'+answer+'</p>')+'</div>';}
    function practiceSlide(q){add("Practice",q.level+" · "+q.id,head("Practice · "+q.level,q.id+" · "+(q.calc?"Calculator":"No calculator"))+'<div class="question-layout"><div class="question-box"><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map(function(o,i){return '<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+o+'</span></label>';}).join("")+'</div><p><button class="check-button" type="button" data-check="'+q.id+'">Check response</button></p><p class="feedback" id="feedback-'+q.id+'" role="status"></p>'+reveal("Reveal answer and reasoning",'<p><strong>Answer: '+String.fromCharCode(65+q.answer)+'.</strong> '+q.solution+'</p>')+'</div><aside class="side-note"><span class="badge level">'+q.level+'</span><span class="badge">'+q.strand+'</span><p><strong>'+(q.calc?"Calculator permitted":"No calculator")+'</strong></p><p>Work independently, preserve notation and units, and record any prompt or tool used.</p><textarea class="scratch" data-save="work-'+q.id+'" aria-label="Work for '+q.id+'"></textarea></aside></div>');}

    add("Launch","Common Entry Diagnostic",'<div class="cover-grid"><div><p class="eyebrow">Grade 10 Path B · Unit R0 · Lesson R0.1</p><h1>Common Entry Diagnostic</h1><p class="lead">Collect honest strand-level evidence in linear and quadratic fluency, factoring, exponents and radicals, systems, functions, graph reading, right-triangle trigonometry, and calculator habits.</p><p><span class="badge">Unit pacing: weeks 1–2</span><span class="badge">2 periods maximum</span><span class="badge">64 meaningful screens</span></p><button class="cta" type="button" data-go="1">Begin diagnostic</button></div><div class="system-art"><svg viewBox="0 0 660 470" role="img" aria-labelledby="diagnosticTitle diagnosticDesc" class="graph"><title id="diagnosticTitle">Eight-strand entry diagnostic map</title><desc id="diagnosticDesc">Eight prerequisite strands feed a central readiness profile used to create short-term flex groups.</desc><circle cx="330" cy="235" r="82" fill="#7a1734"/><g fill="#fff" stroke="#d8e0e7" stroke-width="3"><rect x="230" y="25" width="200" height="58" rx="18"/><rect x="440" y="105" width="185" height="58" rx="18"/><rect x="440" y="305" width="185" height="58" rx="18"/><rect x="230" y="387" width="200" height="58" rx="18"/><rect x="35" y="305" width="185" height="58" rx="18"/><rect x="35" y="105" width="185" height="58" rx="18"/></g><g class="gtext" text-anchor="middle"><text x="330" y="62">LINEAR / QUADRATIC</text><text x="532" y="142">FUNCTIONS</text><text x="532" y="342">GRAPH READING</text><text x="330" y="424">TRIG / TOOLS</text><text x="128" y="342">SYSTEMS</text><text x="128" y="142">EXPONENTS / RADICALS</text><text x="330" y="228" fill="#fff">READINESS</text><text x="330" y="253" fill="#fff">PROFILE</text></g><g stroke="#c69b37" stroke-width="6"><path d="M330 83V153M412 235H440M330 317V387M220 235H248"/></g></svg></div></div>','cover');
    add("Scope","Authoritative diagnostic scope",head("Scope","Assessment before repair")+'<div class="grid"><div class="card tint"><h3>Collect evidence</h3><p>Linear/quadratic fluency, factoring, exponents/radicals, systems, function notation/domain/range, graph reading, right-triangle trig, and calculator/non-calculator habits.</p></div><div class="card maroon"><h3>Coverage boundary</h3><p>This remains an assessment—not a teaching lesson, whole-class review, new AP content block, or automatic placement test. Results inform short-term flex groups.</p></div></div>');

    add("Purpose","Why begin with evidence?",head("Purpose","Repair only what blocks access")+'<div class="grid three"><div class="card"><h3>Locate</h3><p>Find the first uncertain prerequisite strand.</p></div><div class="card tint"><h3>Classify</h3><p>Separate misunderstanding from execution or notation.</p></div><div class="card gold"><h3>Respond</h3><p>Create a precise flex group, extension, or independent target.</p></div></div>');
    add("Schedule","Two-period administration map",head("Schedule","One common benchmark, two evidence cycles")+'<div class="grid"><div class="card tint"><h3>Period 1</h3><p>Non-calculator algebra, functions, systems, graph reading, and written confidence markers.</p></div><div class="card gold"><h3>Period 2</h3><p>Purposeful calculator items, error analysis, corrections, strand profile, and flex-group target.</p></div></div>');

    add("Conditions","Honest diagnostic conditions",head("Conditions","Record support instead of hiding it")+'<div class="step-list"><div class="step">Attempt independently before using a prompt.</div><div class="step">Mark calculator-permitted items only; keep exact work elsewhere.</div><div class="step">Record every hint, formula reminder, or vocabulary prompt used.</div><div class="step">Use “not yet” when unsure; guessing conceals the repair target.</div></div>');
    add("No calculator","Non-calculator habits",head("No calculator","Show structural fluency")+'<p>Preserve fractions, radicals, factored forms, restrictions, and interval notation. A correct decimal from an unauthorized tool does not provide the intended evidence.</p><p class="callout">Exact structure helps distinguish durable understanding from calculator dependence.</p>');

    add("Correct","Correction protocol",head("Correct","Locate → classify → repair → verify")+'<div class="step-list"><div class="step">Circle the first invalid step.</div><div class="step">Name the error type with evidence.</div><div class="step">Write a complete corrected solution.</div><div class="step">Substitute, compare representations, or check reasonableness.</div></div>');
    add("Algebra","Algebra strand directions",head("Algebra","Expressions, equations, and inequalities")+'<p>Work in exact form. The evidence includes operation order, distribution, combining terms, valid inverse operations, equality/inequality logic, and substitution checks.</p>');

    add("Worked example","Worked example · record evidence",head("Worked example","A diagnostic response with an audit trail")+'<p>For <span class="math" data-tex="q(x)=(x+2)^2-9">q(x)=(x+2)²−9</span>, a complete response states vertex (−2,−9), axis x=−2, opens upward, and verifies q(−2)=−9.</p><p class="callout">The example demonstrates response format. It does not reteach the strand before assessment.</p>');

    add("Systems","Systems strand",head("Systems","One ordered pair must satisfy both equations")+'<p>Choose graphing, substitution, or elimination from structure. Verify an ordered pair in both equations, such as <span class="math" data-tex="x+y=9,\\quad x-y=3">x+y=9, x−y=3</span>, and distinguish no/one/infinitely-many solution cases.</p>');

    add("Domain / range","Domain and range strand",head("Domain / range","Restrictions and endpoints are evidence")+'<div class="grid three"><div class="card"><h3>formula</h3><p>denominator, even root, or context restriction.</p></div><div class="card tint"><h3>graph</h3><p>left/right inputs and low/high outputs.</p></div><div class="card gold"><h3>notation</h3><p>correct brackets, parentheses, unions, and discreteness.</p></div></div>');
    add("Graph reading","Accessible graph evidence",head("Graph reading","Scale before feature")+'<svg viewBox="0 0 760 420" role="img" aria-labelledby="entryGraphTitle entryGraphDesc" class="graph"><title id="entryGraphTitle">Closed line segment for domain and range reading</title><desc id="entryGraphDesc">A decreasing line segment has closed endpoints at negative three comma five and four comma negative two. Its domain is negative three through four and its range is negative two through five, with endpoints included.</desc><path class="axis" d="M55 220H710M365 385V40"/><g stroke="#d8e0e7"><path d="M125 40V385M605 40V385"/><path d="M55 85H710M55 350H710"/></g><path d="M125 85L605 350" fill="none" stroke="#087f8c" stroke-width="7"/><g fill="#7a1734"><circle cx="125" cy="85" r="11"/><circle cx="605" cy="350" r="11"/></g><g class="gtext"><text x="135" y="75">(−3,5)</text><text x="530" y="340">(4,−2)</text></g></svg><p>Closed endpoints give domain [−3,4] and range [−2,5].</p>');
    add("Student Turn","Graph-reading quick check",head("Student Turn","Features with notation")+turn('For the closed segment from (−3,5) to (4,−2), state slope, domain, and range.','Slope=(−2−5)/(4−(−3))=−7/7=−1; domain [−3,4]; range [−2,5].'));
    add("Quadratic","Quadratic table evidence",head("Quadratic","Differences and symmetry")+'<p>For x=−1,0,1,2 and y=4,1,0,1, first differences are −3,−1,1 and second differences are 2,2. The table is symmetric about x=1 and matches y=(x−1)².</p>');
    add("Trigonometry","Right-triangle trigonometry strand",head("Trigonometry","Ratio, reference angle, mode, units")+'<p>Select sine, cosine, or tangent from the labeled sides. Write the equation, for example <span class="math" data-tex="\\sin(\\theta)=7/25">sin(θ)=7/25</span>, before calculating and use degree mode for degree measures.</p>');
    add("Trigonometry","Accessible triangle evidence",head("Trigonometry","Label relative to θ")+'<svg viewBox="0 0 760 410" role="img" aria-labelledby="triangleTitle triangleDesc" class="graph"><title id="triangleTitle">Right triangle with opposite seven and hypotenuse twenty-five</title><desc id="triangleDesc">A right triangle has acute reference angle theta, opposite side length seven, hypotenuse length twenty-five, and an unlabeled adjacent side.</desc><path d="M120 340H650L120 80Z" fill="#edf8f8" stroke="#102a43" stroke-width="5"/><path d="M120 305H155V340" fill="none" stroke="#7a1734" stroke-width="4"/><path d="M590 340A60 60 0 0 0 560 310" fill="none" stroke="#c69b37" stroke-width="5"/><g class="gtext"><text x="83" y="215">7</text><text x="365" y="190">25</text><text x="570" y="318">θ</text></g></svg><p>sin θ=7/25; a calculator-permitted inverse-sine item tests mode, entry, and rounding habits.</p>');
    add("Calculator","Calculator audit trail",head("Calculator","Result plus process evidence")+'<div class="grid"><div class="card tint"><h3>Record</h3><p>equation, mode, full display value, final rounding, and units.</p></div><div class="card maroon"><h3>Flag</h3><p>wrong mode, premature rounding, unexplained regression, or output outside a meaningful domain.</p></div></div>');

    add("Scoring","Score by strand",head("Scoring","A total alone hides the repair target")+'<p>Group items by Algebra, Functions/Representations, Polynomial/Radical, Systems, Trigonometry, and Tool/Communication habits. Record accuracy, independence, and error type separately.</p>');

    add("Flex groups","Short-term flex-group rules",head("Flex groups","Smallest effective response")+'<div class="grid three"><div class="card tint"><h3>Repair</h3><p>One or two structural gaps that block upcoming work.</p></div><div class="card gold"><h3>Verify</h3><p>Notation/attention pattern; complete short independent checks.</p></div><div class="card"><h3>Extend</h3><p>Prerequisites secure; use challenge reasoning without pre-teaching AP content.</p></div></div>');

    add("Boundary","Diagnostic boundary",head("Boundary","Stop before teaching begins")+'<p>This module identifies evidence and assigns targeted next actions. Algebra precision repair begins in R0.2; function notation/domain repair begins in R0.3; systems/right-triangle spot repair begins in R0.4.</p>');

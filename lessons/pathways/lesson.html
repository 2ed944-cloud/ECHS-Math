<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ECHS Pathway Lesson</title>
  <style>
    :root { --maroon:#7a1734; --navy:#10253f; --teal:#087f8c; --gold:#c69b37; --ink:#182230; --muted:#607080; --paper:#f7f5ef; --line:#d8dee6; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(135deg,#f9fafb,#f3efe5); font:16px/1.55 Inter,Segoe UI,Arial,sans-serif; }
    a { color:var(--maroon); }
    header { color:white; background:linear-gradient(115deg,var(--navy),var(--maroon)); padding:18px clamp(20px,5vw,70px); }
    header a { color:white; text-decoration:none; font-weight:700; }
    .shell { width:min(1120px,calc(100% - 32px)); margin:30px auto 64px; }
    .hero,.card { background:white; border:1px solid var(--line); border-radius:18px; box-shadow:0 12px 30px rgba(16,37,63,.08); }
    .hero { padding:clamp(24px,5vw,48px); border-top:6px solid var(--maroon); }
    .eyebrow { color:var(--teal); font-size:.78rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { color:var(--navy); font-size:clamp(2rem,4vw,3.2rem); line-height:1.08; margin:.35rem 0 .7rem; }
    h2 { color:var(--navy); margin-top:0; }
    .meta { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
    .pill { border-radius:999px; background:#eef4f6; color:var(--navy); padding:7px 12px; font-size:.88rem; font-weight:700; }
    .status { margin-top:22px; padding:14px 16px; border-left:5px solid var(--gold); background:#fff8e7; border-radius:10px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:22px; }
    .card { padding:24px; }
    .wide { grid-column:1/-1; }
    ul,ol { padding-left:1.25rem; }
    li + li { margin-top:.45rem; }
    .cycle { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; padding:0; list-style:none; }
    .cycle li { border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--paper); }
    .cycle strong { color:var(--maroon); display:block; }
    .error { color:#8b1e1e; background:#fff0f0; border:1px solid #e5b9b9; padding:18px; border-radius:12px; }
    footer { color:var(--muted); text-align:center; padding:30px; }
    @media (max-width:760px) { .grid,.cycle { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><a href="../../index.html">← ECHS Mathematics Portal</a></header>
  <main class="shell" id="app" aria-live="polite"><p>Loading pathway lesson…</p></main>
  <footer>ECHS Mathematics · Evidence-based AP Precalculus readiness pathway</footer>
  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(location.search);
      var grade = params.get("grade");
      var pathKey = params.get("path");
      var lessonId = params.get("lesson");
      var app = document.getElementById("app");

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>\"']/g, function (character) {
          return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[character];
        });
      }
      function list(items) {
        return "<ul>" + (items || []).map(function (item) { return "<li>" + escapeHtml(item) + "</li>"; }).join("") + "</ul>";
      }
      function fail(message) {
        app.innerHTML = '<div class="error"><strong>Lesson could not be loaded.</strong><br>' + escapeHtml(message) + '</div>';
      }

      if (!/^(9|10)$/.test(grade || "") || !pathKey || !lessonId) {
        fail("The lesson address is incomplete.");
        return;
      }

      fetch("../../curriculum/pathways/grade-" + grade + "-2026-2027.json", {cache:"no-store"})
        .then(function (response) { if (!response.ok) throw new Error("Curriculum manifest not found."); return response.json(); })
        .then(function (manifest) {
          var pathway = manifest.paths[pathKey];
          if (!pathway) throw new Error("Pathway not found.");
          var unit = pathway.units.find(function (candidate) {
            return candidate.lessons.some(function (lesson) { return lesson.id === lessonId; });
          });
          var lesson = unit && unit.lessons.find(function (candidate) { return candidate.id === lessonId; });
          if (!lesson) throw new Error("Lesson " + lessonId + " is not in the approved outline.");
          document.title = lesson.id + " " + lesson.title + " | ECHS";
          app.innerHTML =
            '<section class="hero">' +
              '<div class="eyebrow">Grade ' + escapeHtml(grade) + ' · ' + escapeHtml(pathway.title) + '</div>' +
              '<h1>' + escapeHtml(lesson.id + " " + lesson.title) + '</h1>' +
              '<p>' + escapeHtml(unit.intent) + '</p>' +
              '<div class="meta"><span class="pill">' + escapeHtml(unit.code) + '</span><span class="pill">Weeks ' + escapeHtml(unit.pacing) + '</span><span class="pill">Typically 1–3 class periods</span><span class="pill">' + escapeHtml(lesson.alignment) + '</span></div>' +
              '<div class="status"><strong>Curriculum mapped.</strong> This page preserves the approved subtopics and observable learning outcomes. The curriculum agent keeps the lesson in this state until its full interactive teaching module, practice, assessment, accessibility, and link checks pass.</div>' +
            '</section>' +
            '<section class="grid">' +
              '<article class="card"><h2>Learning outcomes</h2>' + list(lesson.learningOutcomes) + '</article>' +
              '<article class="card"><h2>Subtopics</h2>' + list(lesson.subtopics) + '</article>' +
              '<article class="card wide"><h2>Required learning cycle</h2><ol class="cycle">' +
                '<li><strong>1 · Retrieve</strong>Prerequisite check and no-calculator fluency.</li>' +
                '<li><strong>2 · Launch</strong>Purposeful context, representation, or conjecture.</li>' +
                '<li><strong>3 · Develop</strong>Explicit teaching with precise notation.</li>' +
                '<li><strong>4 · Model</strong>Worked examples and misconception analysis.</li>' +
                '<li><strong>5 · Practice</strong>Guided, independent, challenge, and technology tasks.</li>' +
                '<li><strong>6 · Prove readiness</strong>Exit ticket and mastery evidence.</li>' +
              '</ol></article>' +
              '<article class="card"><h2>AP-readiness evidence</h2><ul><li>Correct symbolic work without technology when appropriate</li><li>Graphical, numerical, analytical, and verbal connections</li><li>Calculator judgment with interpretation</li><li>Complete reasoning and error correction</li></ul></article>' +
              '<article class="card"><h2>Pathway destination</h2><p>' + escapeHtml(pathway.destination) + '</p><p><strong>Movement is evidence-based and never permanent tracking.</strong></p></article>' +
            '</section>';
        })
        .catch(function (error) { fail(error.message); });
    })();
  </script>
</body>
</html>

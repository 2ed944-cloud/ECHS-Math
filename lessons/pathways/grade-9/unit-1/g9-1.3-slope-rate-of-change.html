  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-1.3-slope-rate-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Find the slope through <span class="math" data-tex="(2,3)"></span> and <span class="math" data-tex="(6,11)"></span>.',options:["1/2","2","4","8"],answer:1,solution:'<span class="math" data-tex="m=(11-3)/(6-2)=8/4=2"></span>.'},
      {id:"E2",level:"Easy",calc:false,prompt:'A table contains <span class="math" data-tex="(0,5),(2,11),(4,17)"></span>. What is the constant rate?',options:["2","3","5","6"],answer:1,solution:'For each interval, <span class="math" data-tex="\\Delta y/\\Delta x=6/2=3"></span>.'},
      {id:"E3",level:"Easy",calc:false,prompt:'What is the slope of a horizontal line?',options:["0","1","Undefined","It depends on the intercept"],answer:0,solution:'The output change is zero for any nonzero input change, so <span class="math" data-tex="m=0/\\Delta x=0"></span>.'},
      {id:"E4",level:"Easy",calc:false,prompt:'A line rises from left to right. Which statement is true?',options:["Its slope is negative","Its slope is zero","Its slope is positive","Its slope is undefined"],answer:2,solution:'As <span class="math" data-tex="x"></span> increases, <span class="math" data-tex="y"></span> increases, so <span class="math" data-tex="\\Delta y/\\Delta x>0"></span>.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Find the slope through <span class="math" data-tex="(-3,4)"></span> and <span class="math" data-tex="(5,-8)"></span>.',options:["-3/2","-2/3","3/2","12"],answer:0,solution:'<span class="math" data-tex="m=(-8-4)/(5-(-3))=-12/8=-3/2"></span>.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Find the slope through <span class="math" data-tex="(2,-1)"></span> and <span class="math" data-tex="(2,7)"></span>.',options:["0","4","8","Undefined"],answer:3,solution:'<span class="math" data-tex="\\Delta x=2-2=0"></span>. Division by zero is undefined; the line is vertical.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Six kilograms of dates cost 180 QAR. What is the unit rate?',options:["6 QAR/kg","30 QAR/kg","174 QAR/kg","1080 QAR/kg"],answer:1,solution:'<span class="math" data-tex="180\\text{ QAR}/6\\text{ kg}=30\\text{ QAR/kg}"></span>.'},
      {id:"M4",level:"Medium",calc:false,prompt:'What is the rate of change of <span class="math" data-tex="y=-4x+9"></span>?',options:["-4","4","9","-9"],answer:0,solution:'In <span class="math" data-tex="y=mx+b"></span>, the coefficient of <span class="math" data-tex="x"></span> is the constant rate, so <span class="math" data-tex="m=-4"></span>.'},
      {id:"M5",level:"Medium",calc:false,prompt:'Distance values are 7, 19, and 31 km at 1, 3, and 5 hours. Find the constant rate.',options:["3 km/h","6 km/h","12 km/h","24 km/h"],answer:1,solution:'<span class="math" data-tex="(19-7)/(3-1)=12/2=6\\text{ km/h}"></span>; the next interval agrees.'},
      {id:"M6",level:"Medium",calc:false,prompt:'A graph shows a vertical change of <span class="math" data-tex="-6"></span> for a horizontal change of <span class="math" data-tex="3"></span>. Find its slope.',options:["-3","-2","2","3"],answer:1,solution:'<span class="math" data-tex="m=\\Delta y/\\Delta x=-6/3=-2"></span>.'},
      {id:"H1",level:"Hard",calc:false,prompt:'Line A passes through <span class="math" data-tex="(0,5),(4,17)"></span>. Line B passes through <span class="math" data-tex="(1,8),(4,14)"></span>. Which has the greater rate?',options:["Line A","Line B","The rates are equal","Neither rate is defined"],answer:0,solution:'<span class="math" data-tex="m_A=12/4=3"></span> and <span class="math" data-tex="m_B=6/3=2"></span>; therefore Line A has the greater rate.'},
      {id:"H2",level:"Hard",calc:false,prompt:'Temperature increases by 18°F in 10 minutes. Interpret the average rate.',options:["0.56°F/min","1.8°F/min","8°F/min","180°F/min"],answer:1,solution:'<span class="math" data-tex="18/10=1.8\\text{ °F/min}"></span>: temperature rises 1.8°F per minute over the interval.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Attendance is 150 people at minute 2 and 390 people at minute 7. Find and label the average rate.',options:["30 min/person","48 people/min","80 people/min","240 people/min"],answer:1,solution:'<span class="math" data-tex="(390-150)/(7-2)=240/5=48\\text{ people/min}"></span>.'},
      {id:"H4",level:"Hard",calc:false,prompt:'Position <span class="math" data-tex="p"></span> is measured in meters and time <span class="math" data-tex="t"></span> in seconds. What does slope <span class="math" data-tex="-2.5"></span> mean?',options:["Time falls 2.5 seconds per meter","Position decreases 2.5 meters each second","Position is -2.5 meters","Position increases 2.5 meters each second"],answer:1,solution:'Output units over input units give meters per second; the negative sign indicates decreasing position.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Find the slope through <span class="math" data-tex="(a,b)"></span> and <span class="math" data-tex="(a+h,b+kh)"></span>, where <span class="math" data-tex="h\\ne0"></span>.',options:["h","k","kh","k/h"],answer:1,solution:'<span class="math" data-tex="m=((b+kh)-b)/((a+h)-a)=kh/h=k"></span>.'},
      {id:"H6",level:"Hard",calc:false,prompt:'Does <span class="math" data-tex="(-2,8),(1,2),(5,-6)"></span> show a constant rate?',options:["Yes, -2","Yes, 2","No, the interval widths differ","No, the rates are -6 and -8"],answer:0,solution:'<span class="math" data-tex="(2-8)/(1-(-2))=-6/3=-2"></span> and <span class="math" data-tex="(-6-2)/(5-1)=-8/4=-2"></span>. Equal interval widths are not required.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'The slope through <span class="math" data-tex="(-4,7)"></span> and <span class="math" data-tex="(k,-5)"></span> is <span class="math" data-tex="-2"></span>. Find <span class="math" data-tex="k"></span>.',options:["-10","-2","2","10"],answer:2,solution:'<span class="math" data-tex="-12/(k+4)=-2\\Rightarrow-12=-2(k+4)\\Rightarrow k=2"></span>.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'Taxi A costs <span class="math" data-tex="10+2.5d"></span> QAR; Taxi B costs <span class="math" data-tex="22+1.75d"></span> QAR. Which has the lower distance rate and what is it?',options:["A, 10 QAR/km","A, 2.5 QAR/km","B, 22 QAR/km","B, 1.75 QAR/km"],answer:3,solution:'The coefficient of distance is the rate. Taxi B has the lower rate, <span class="math" data-tex="1.75\\text{ QAR/km}"></span>, though its initial fee is higher.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'A constant-rate table has <span class="math" data-tex="(0,12),(2,7),(5,y)"></span>. Find <span class="math" data-tex="y"></span>.',options:["-0.5","2","4.5","7.5"],answer:0,solution:'The rate is <span class="math" data-tex="(7-12)/2=-2.5"></span>. Over 5 input units, <span class="math" data-tex="y=12-2.5(5)=-0.5"></span>.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'Compare <span class="math" data-tex="y=3.2x-4"></span> with a line through <span class="math" data-tex="(-1,6),(4,-2)"></span>. Which statement is true?',options:["The graph rate is greater","Both rates are positive","The formula has the greater rate; the directions are opposite","The rates are equal"],answer:2,solution:'The formula rate is <span class="math" data-tex="3.2"></span>; the point-pair rate is <span class="math" data-tex="-8/5=-1.6"></span>. Thus 3.2 is greater and the signs show opposite directions.'}
    ];
    const slides=[];
    const add=(stage,title,body,cls="")=>slides.push({stage,title,body,cls});
    const head=(label,title)=>'<div class="slide-head"><div><p class="eyebrow">'+label+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';
    const reveal=(label,body)=>'<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';
    const section=(code,title,text)=>'<div class="section-banner"><div><p class="eyebrow">Concept cycle</p><h2 tabindex="-1">'+title+'</h2><p class="lead">'+text+'</p></div><div class="section-code">'+code+'</div></div>';
    const qCard=q=>'<div class="question-layout"><div class="question-box"><div><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?'calc':'')+'">'+(q.calc?'Calculator':'No calculator')+'</span></div><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map((o,i)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>').join("")+'</div><button class="check-button" type="button" data-check="'+q.id+'">Check response</button><p class="feedback" id="feedback-'+q.id+'" aria-live="polite"></p>'+reveal('Reveal complete solution','<p>'+q.solution+'</p>')+'</div><aside class="side-note"><label for="work-'+q.id+'"><strong>Show reasoning and units</strong></label><textarea class="scratch" id="work-'+q.id+'" data-save="work-'+q.id+'"></textarea></aside></div>';
    const graphSvg=id=>'<svg class="graph" viewBox="0 0 640 390" role="img" aria-labelledby="graph-title-'+id+' graph-desc-'+id+'"><title id="graph-title-'+id+'">A rising line with a labeled slope triangle</title><desc id="graph-desc-'+id+'">Coordinate plane with equal horizontal and vertical scales, showing points negative one comma zero and three comma eight. The horizontal run is four units and the vertical rise is eight units, so the slope is two.</desc><g aria-hidden="true"><path class="gridline" d="M40 20V340M80 20V340M120 20V340M160 20V340M200 20V340M240 20V340M280 20V340M320 20V340M360 20V340M400 20V340M440 20V340M480 20V340M520 20V340M560 20V340M600 20V340M40 20H600M40 60H600M40 100H600M40 140H600M40 180H600M40 220H600M40 260H600M40 300H600M40 340H600"/><path class="axis" d="M40 340H600M240 360V15"/><path class="trend" d="M200 340L360 20"/><path class="rise" d="M200 340H360V20"/><circle class="point" cx="200" cy="340" r="8"/><circle class="point" cx="360" cy="20" r="8"/><text class="gtext" x="145" y="328">(-1, 0)</text><text class="gtext" x="372" y="38">(3, 8)</text><text class="gtext" x="244" y="328">run = 4</text><text class="gtext" x="372" y="184">rise = 8</text><text class="gtext" x="582" y="366">x</text><text class="gtext" x="252" y="35">y</text></g></svg>';

    add("Launch","Slope and Rate of Change",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Lesson 1.3 · AP Precalculus readiness</p><h1 tabindex="-1">Slope and Rate of Change</h1><p class="lead">Measure how one quantity changes per unit of another—and explain direction, steepness, and units across every linear representation.</p><button class="cta" type="button" data-go="1">Begin the lesson →</button></div><div class="slope-art">'+graphSvg("cover")+'</div></div>',"cover");
    add("Purpose","Three-period pathway",head("Purpose","What this lesson masters—and defers")+'<p class="lead">This is a three-period prerequisite-mastery sequence.</p><div class="grid"><div class="card tint"><h3>Required mastery</h3><p>Constant rates from points, tables, graphs, formulas, and contexts; positive, negative, zero, and undefined slope; correct units.</p></div><div class="card gold"><h3>Deliberately deferred</h3><p>AP-style changing-rate and covariation analysis. Variable-function average rate of change returns at bridge depth in Unit 3.</p></div></div><p class="callout"><strong>Pacing:</strong> three class periods, maximum three.</p>');
    add("Goals","Learning goals",head("Learning outcomes","By the end, I can…")+'<div class="law-grid"><article class="law"><strong>Calculate</strong>Use <span class="math" data-tex="m=\\Delta y/\\Delta x"></span> accurately from multiple representations.</article><article class="law"><strong>Interpret</strong>Explain sign, magnitude, and output-per-input units in context.</article><article class="law"><strong>Compare</strong>Decide which constant rate is greater and justify using equivalent evidence.</article></div>');
    add("Success","Mastery evidence",head("Success criteria","What counts as secure")+'<div class="grid"><div class="card"><strong class="big">16 / 20</strong><p>on differentiated practice, with all four slope types represented.</p></div><div class="card"><strong class="big">4 parts</strong><p>calculation, units, direction, and contextual interpretation in the exit ticket.</p></div></div>');
    add("Retrieval","Coordinate retrieval",head("Prerequisite retrieval","Ordered pairs and directed change")+'<div class="grid"><div class="card"><p>From <span class="math" data-tex="(-2,5)"></span> to <span class="math" data-tex="(4,-1)"></span>:</p><p><span class="formula math" data-tex="\\Delta x=4-(-2)=6"></span></p><p><span class="formula math" data-tex="\\Delta y=-1-5=-6"></span></p></div><div class="card gold"><p>Subtract coordinates in the same order. Reversing both differences keeps the ratio unchanged.</p></div></div>');
    add("Retrieval","Fraction and sign retrieval",head("Prerequisite retrieval","Simplify the ratio completely")+'<div class="flow"><span><span class="math" data-tex="\\frac{-12}{8}"></span></span><b>→</b><span><span class="math" data-tex="-\\frac{3}{2}"></span></span><b>→</b><span>negative direction</span></div><p class="callout warning">A negative slope has one negative factor overall—not two.</p>');
    add("Retrieval","Unit retrieval",head("Prerequisite retrieval","Read “per” as division")+'<div class="grid three"><article class="card"><h3>QAR per kilogram</h3><p><span class="math" data-tex="\\text{QAR}/\\text{kg}"></span></p></article><article class="card"><h3>Kilometers per hour</h3><p><span class="math" data-tex="\\text{km}/\\text{h}"></span></p></article><article class="card"><h3>People per minute</h3><p><span class="math" data-tex="\\text{people}/\\text{min}"></span></p></article></div>');
    add("Launch","Initial reasoning",head("Student Turn","What can slope tell us?")+'<div class="question-box"><p class="question-prompt">Two water tanks begin with different amounts. Tank A gains 8 liters per minute; Tank B gains 5 liters per minute. What does comparing 8 and 5 tell us—and what does it not tell us?</p><textarea class="scratch" data-save="launch-reasoning" aria-label="Initial slope reasoning"></textarea>'+reveal('Reveal reasoning','<p>Tank A has the greater rate of increase. The rates alone do not reveal which tank currently contains more water because the starting amounts are unknown.</p>')+'</div>');

    add("Points","Slope from two points",section("Δy / Δx","Change in output per change in input","Use two points, keep subtraction order consistent, simplify the ratio, and attach output-per-input units."));
    add("Points","Difference quotient",head("Concept","The slope formula records directed change")+'<div class="grid"><div class="card"><p><span class="formula math" data-tex="m=\\frac{y_2-y_1}{x_2-x_1}"></span></p><p>Numerator: change in output. Denominator: change in input.</p></div><div class="card gold"><p><strong>Restriction:</strong> <span class="math" data-tex="x_2\\ne x_1"></span> for a defined numerical slope.</p><p>If the input change is zero, the line is vertical and its slope is undefined.</p></div></div>');
    add("Points","Worked example",head("Worked example","Find and interpret a negative slope")+'<div class="step-list"><div class="step">Use points <span class="math" data-tex="(-3,7)"></span> and <span class="math" data-tex="(5,-5)"></span>.</div><div class="step"><span class="math" data-tex="\\Delta y=-5-7=-12"></span>.</div><div class="step"><span class="math" data-tex="\\Delta x=5-(-3)=8"></span>.</div><div class="step"><span class="math" data-tex="m=-12/8=-3/2"></span>.</div><div class="step">For every 2-unit increase in input, output decreases 3 units.</div></div>');
    add("Student Turn","Point-pair turn",head("Student Turn","Calculate in either direction")+'<div class="question-box"><p class="question-prompt">Find the slope through <span class="math" data-tex="(2,-4)"></span> and <span class="math" data-tex="(-6,8)"></span>. Then reverse the subtraction order and confirm the same result.</p><textarea class="scratch" data-save="point-turn" aria-label="Point pair work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="m=(8-(-4))/(-6-2)=12/(-8)=-3/2"></span>. Reversing both: <span class="math" data-tex="(-4-8)/(2-(-6))=-12/8=-3/2"></span>.</p>')+'</div>');
    add("Misconception","Subtraction-order check",head("Misconception check","Do not reverse only one difference")+'<div class="grid"><div class="card maroon"><h3>Invalid</h3><p><span class="math" data-tex="(y_2-y_1)/(x_1-x_2)"></span></p><p>Only the denominator order changed, so the sign is wrong.</p></div><div class="card tint"><h3>Valid</h3><p><span class="math" data-tex="(y_2-y_1)/(x_2-x_1)"></span> or <span class="math" data-tex="(y_1-y_2)/(x_1-x_2)"></span>.</p></div></div>');
    add("Checkpoint","Point evidence",head("Checkpoint","A point-pair answer has four parts")+'<div class="law-grid"><article class="law"><strong>Differences</strong>Show both directed changes.</article><article class="law"><strong>Ratio</strong>Simplify exactly.</article><article class="law"><strong>Meaning</strong>State direction and output per input.</article></div>');

    add("Tables","Slope from a table",section("equal ratios","Test constant rate—not equal intervals","Consecutive input intervals may have different widths. A linear table has equal output-change to input-change ratios."));
    add("Tables","Interval ratios",head("Concept","Compare each interval using Δy/Δx")+'<div class="table-wrap"><table class="data-table"><caption>Constant-rate data</caption><thead><tr><th scope="col">x</th><th scope="col">-2</th><th scope="col">1</th><th scope="col">5</th></tr></thead><tbody><tr><th scope="row">y</th><td>8</td><td>2</td><td>-6</td></tr><tr><th scope="row">Rate</th><td colspan="2"><span class="math" data-tex="-6/3=-2"></span></td><td><span class="math" data-tex="-8/4=-2"></span></td></tr></tbody></table></div><p class="callout success">Different interval widths, same rate: the relation is linear over the displayed data.</p>');
    add("Tables","Worked example",head("Worked example","Rate from an irregularly spaced table")+'<div class="step-list"><div class="step">At 1, 4, and 10 minutes, a tank contains 26, 44, and 80 liters.</div><div class="step"><span class="math" data-tex="(44-26)/(4-1)=18/3=6\\text{ L/min}"></span>.</div><div class="step"><span class="math" data-tex="(80-44)/(10-4)=36/6=6\\text{ L/min}"></span>.</div><div class="step">The amount increases constantly by 6 liters per minute.</div></div>');
    add("Student Turn","Table turn",head("Student Turn","Decide whether the rate is constant")+'<div class="question-box"><div class="table-wrap"><table class="data-table"><caption>Values to analyze</caption><thead><tr><th scope="col">x</th><th scope="col">0</th><th scope="col">2</th><th scope="col">7</th></tr></thead><tbody><tr><th scope="row">y</th><td>15</td><td>9</td><td>-6</td></tr></tbody></table></div><textarea class="scratch" data-save="table-turn" aria-label="Table rate work"></textarea>'+reveal('Reveal verified reasoning','<p><span class="math" data-tex="(9-15)/(2-0)=-6/2=-3"></span> and <span class="math" data-tex="(-6-9)/(7-2)=-15/5=-3"></span>. The rate is constant at -3 output units per input unit.</p>')+'</div>');
    add("Misconception","Table misconception",head("Misconception check","Equal differences are not enough")+'<div class="grid"><div class="card maroon"><p>Outputs changing by 4 then 8 do not automatically mean the rate changed.</p></div><div class="card tint"><p>If input changes by 2 then 4, the ratios are <span class="math" data-tex="4/2=8/4=2"></span>: the rate is constant.</p></div></div>');
    add("Checkpoint","Table evidence",head("Checkpoint","Complete the missing table value")+'<div class="question-box"><p class="question-prompt"><span class="math" data-tex="(1,12),(3,7),(9,y)"></span> lie on a constant-rate line. Find <span class="math" data-tex="y"></span>.</p><textarea class="scratch" data-save="table-check" aria-label="Missing table value"></textarea>'+reveal('Reveal solution','<p>The rate is <span class="math" data-tex="(7-12)/(3-1)=-5/2"></span>. From <span class="math" data-tex="x=3"></span> to 9, output changes by <span class="math" data-tex="(-5/2)(6)=-15"></span>, so <span class="math" data-tex="y=7-15=-8"></span>.</p>')+'</div>');

    add("Graphs","Slope from a graph",section("rise / run","Read direction and steepness visibly","Select two exact points, construct a right-angled slope triangle, and connect the signed changes to the line."));
    add("Graphs","Labeled slope triangle",head("Concept","Every labeled segment has a mathematical role")+'<div class="grid"><div>'+graphSvg("concept")+'</div><div class="card tint"><p><span class="math" data-tex="\\text{rise}=8-0=8"></span></p><p><span class="math" data-tex="\\text{run}=3-(-1)=4"></span></p><p><span class="formula math" data-tex="m=8/4=2"></span></p><p>The diagram labels coordinates, directions, and values so no decorative shape is mistaken for mathematics.</p></div></div>');
    add("Graphs","Worked example",head("Worked example","Classify all four slope types")+'<div class="grid"><article class="card"><h3>Positive</h3><p>Rises left to right; <span class="math" data-tex="m>0"></span>.</p></article><article class="card"><h3>Negative</h3><p>Falls left to right; <span class="math" data-tex="m<0"></span>.</p></article><article class="card"><h3>Zero</h3><p>Horizontal; <span class="math" data-tex="\\Delta y=0"></span>.</p></article><article class="card"><h3>Undefined</h3><p>Vertical; <span class="math" data-tex="\\Delta x=0"></span>.</p></article></div>');
    add("Student Turn","Graph turn",head("Student Turn","Use two precise graph points")+'<div class="question-box"><p class="question-prompt">A line contains <span class="math" data-tex="(-2,6)"></span> and <span class="math" data-tex="(4,-3)"></span>. Sketch and label a slope triangle, calculate the slope, then describe the line from left to right.</p><textarea class="scratch" data-save="graph-turn" aria-label="Graph slope work"></textarea>'+reveal('Reveal verified reasoning','<p><span class="math" data-tex="\\Delta y=-3-6=-9"></span>, <span class="math" data-tex="\\Delta x=4-(-2)=6"></span>, so <span class="math" data-tex="m=-9/6=-3/2"></span>. The line falls 3 units for every 2-unit move right.</p>')+'</div>');
    add("Misconception","Graph misconception",head("Misconception check","Steepness alone does not give the sign")+'<div class="grid"><div class="card maroon"><p>“Steep” describes the magnitude <span class="math" data-tex="|m|"></span>, not whether the line rises or falls.</p></div><div class="card tint"><p>Slopes 5 and -5 are equally steep, but they have opposite directions.</p></div></div>');
    add("Checkpoint","Graph evidence",head("Checkpoint","Horizontal versus vertical")+'<div class="flow"><span>horizontal</span><b>→</b><span><span class="math" data-tex="0/\\Delta x=0"></span></span><b>·</b><span>vertical</span><b>→</b><span><span class="math" data-tex="\\Delta y/0"></span> undefined</span></div><p class="callout warning">Undefined slope is not zero slope.</p>');

    add("Context","Unit rate and meaning",section("output / input","Units complete the interpretation","A contextual rate names how much the output changes for each one-unit increase in input."));
    add("Context","Unit structure",head("Concept","The axes determine the rate units")+'<div class="grid three"><article class="card"><h3>Distance vs time</h3><p><span class="math" data-tex="\\text{km}/\\text{h}"></span></p></article><article class="card"><h3>Cost vs mass</h3><p><span class="math" data-tex="\\text{QAR}/\\text{kg}"></span></p></article><article class="card"><h3>Temperature vs time</h3><p><span class="math" data-tex="\\text{°C}/\\text{min}"></span></p></article></div><p class="callout">State output units first and input units second.</p>');
    add("Context","Worked example",head("Worked example","Interpret a negative contextual rate")+'<div class="step-list"><div class="step">A water reserve falls from 920 to 740 liters between minute 4 and minute 10.</div><div class="step"><span class="math" data-tex="m=(740-920)/(10-4)=-180/6=-30\\text{ L/min}"></span>.</div><div class="step">Over this interval, the reserve decreases by 30 liters per minute.</div><div class="step">The negative sign communicates direction; 30 is the magnitude.</div></div>');
    add("Student Turn","Context turn",head("Student Turn","Calculate and interpret a unit rate")+'<div class="question-box"><p class="question-prompt">A printer produces 525 pages between minute 3 and minute 10, compared with 140 pages at minute 3. Find the rate and write a complete sentence.</p><textarea class="scratch" data-save="context-turn" aria-label="Contextual rate work"></textarea>'+reveal('Reveal verified reasoning','<p><span class="math" data-tex="(525-140)/(10-3)=385/7=55\\text{ pages/min}"></span>. During the interval, production increases by 55 pages per minute.</p>')+'</div>');
    add("Misconception","Context misconception",head("Misconception check","A larger output is not necessarily a larger rate")+'<div class="grid"><div class="card maroon"><p>600 pages after 20 minutes cannot be compared directly with 450 pages after 10 minutes.</p></div><div class="card tint"><p>Compare unit rates: <span class="math" data-tex="600/20=30"></span> and <span class="math" data-tex="450/10=45"></span> pages per minute.</p></div></div>');
    add("Checkpoint","Context evidence",head("Checkpoint","Rate, initial value, and current value are different")+'<div class="law-grid"><article class="law"><strong>Rate</strong>How much output changes per input unit.</article><article class="law"><strong>Initial value</strong>Output when the input is zero.</article><article class="law"><strong>Current value</strong>Output at a specified input.</article></div>');

    add("AROC","Linear average rate of change",section("f(b)-f(a) / b-a","Connect slope and linear AROC","For a linear function, every interval has the same average rate of change. Here we use that fact only for constant-rate functions."));
    add("AROC","Formula connection",head("Concept","Linear AROC equals the constant slope")+'<div class="grid"><div class="card"><p><span class="formula math" data-tex="\\frac{f(b)-f(a)}{b-a}"></span></p><p>This is the slope through <span class="math" data-tex="(a,f(a))"></span> and <span class="math" data-tex="(b,f(b))"></span>.</p></div><div class="card gold"><p><strong>Boundary:</strong> we do not analyze changing rates or nonlinear covariation in this lesson.</p></div></div>');
    add("AROC","Worked example",head("Worked example","Verify interval independence for a linear function")+'<div class="step-list"><div class="step"><span class="math" data-tex="f(x)=-3x+11"></span>.</div><div class="step">On <span class="math" data-tex="[1,5]"></span>: <span class="math" data-tex="(f(5)-f(1))/(5-1)=(-4-8)/4=-3"></span>.</div><div class="step">On <span class="math" data-tex="[-2,3]"></span>: <span class="math" data-tex="(2-17)/5=-3"></span>.</div><div class="step">Both equal the coefficient of <span class="math" data-tex="x"></span>.</div></div>');
    add("Student Turn","AROC turn",head("Student Turn","Connect formula, table, and interpretation")+'<div class="question-box"><p class="question-prompt">For <span class="math" data-tex="g(x)=2.5x-4"></span>, calculate the average rate on <span class="math" data-tex="[-2,6]"></span>. Explain why any other interval gives the same result.</p><textarea class="scratch" data-save="aroc-turn" aria-label="Linear AROC work"></textarea>'+reveal('Reveal verified reasoning','<p><span class="math" data-tex="g(-2)=-9"></span>, <span class="math" data-tex="g(6)=11"></span>, so <span class="math" data-tex="(11-(-9))/(6-(-2))=20/8=2.5"></span>. A linear function changes by the same output amount per input unit everywhere.</p>')+'</div>');
    add("Misconception","AROC misconception",head("Misconception check","Do not average endpoint outputs")+'<div class="grid"><div class="card maroon"><p><span class="math" data-tex="(f(a)+f(b))/2"></span> averages two output values; it is not average rate of change.</p></div><div class="card tint"><p>Rate divides output change by input change: <span class="math" data-tex="(f(b)-f(a))/(b-a)"></span>.</p></div></div>');
    add("Checkpoint","Representation transfer",head("Checkpoint","One constant rate, five representations")+'<div class="flow"><span>points</span><b>↔</b><span>table</span><b>↔</b><span>graph</span><b>↔</b><span>formula</span><b>↔</b><span>context</span></div><p class="callout success">The calculation changes form; the output-per-input meaning remains invariant.</p>');

    practice.forEach(q=>add("Practice",q.id+" · "+q.level,head("Differentiated practice",q.id+" · "+q.level)+qCard(q)));
    add("Mastery","Practice evidence",head("Mastery evidence","Score the differentiated set")+'<div class="grid"><div class="card"><button class="check-button" id="scoreBtn" type="button">Score all 20 responses</button><p class="lead" id="scoreSummary" aria-live="polite">Complete the set, then score your evidence.</p></div><div class="mastery"><div><strong data-level-score="Easy">—</strong>Easy / 4</div><div><strong data-level-score="Medium">—</strong>Medium / 6</div><div><strong data-level-score="Hard">—</strong>Hard / 6</div><div><strong data-level-score="Challenge">—</strong>Challenge / 4</div><div><strong id="totalScore">—</strong>Total / 20</div></div></div>');
    add("Error analysis","Correct one invalid slope",head("Error analysis","Find the first invalid line")+'<div class="grid"><div class="card"><p>Points: <span class="math" data-tex="(-2,5)"></span>, <span class="math" data-tex="(4,-1)"></span></p><p><span class="math" data-tex="\\Delta y=-1-5=-6"></span></p><p><span class="math" data-tex="\\Delta x=-2-4=-6"></span></p><p><span class="math" data-tex="m=(-6)/(-6)=1"></span></p><label for="errorAnalysis"><strong>Identify, correct, and interpret the invalid line.</strong></label><textarea class="scratch" id="errorAnalysis" data-save="error-analysis"></textarea></div><div class="card gold"><h3>Verified correction</h3>'+reveal('Reveal correction','<p>The denominator must use the same point order: <span class="math" data-tex="\\Delta x=4-(-2)=6"></span>. Therefore <span class="math" data-tex="m=-6/6=-1"></span>: output decreases one unit per input unit.</p>')+'</div></div>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","Constant-rate fluency prepares later covariation")+'<div class="grid three"><article class="card"><h3>Exact ratios</h3><p>Keep signs, fractions, and units accurate.</p></article><article class="card"><h3>Representations</h3><p>Recognize the same rate in tables, graphs, formulas, and contexts.</p></article><article class="card"><h3>Interpretation</h3><p>Explain what the numerator and denominator measure.</p></article></div><p class="callout success"><strong>Transfer:</strong> later AP work varies the rate; today secures the constant-rate baseline needed to reason about that change.</p>');
    add("Exit ticket","Exit ticket",head("Exit ticket","Produce final mastery evidence")+'<div class="question-box"><ol><li>Find the slope through <span class="math" data-tex="(-4,9)"></span> and <span class="math" data-tex="(2,-3)"></span>.</li><li>A table contains <span class="math" data-tex="(1,14),(4,5),(8,-7)"></span>. Verify constant rate.</li><li>A fund grows from 1,250 QAR to 1,610 QAR over 6 months. Calculate and interpret the average rate.</li><li>Explain why a vertical line has undefined slope and a horizontal line has zero slope.</li></ol><textarea class="scratch" data-save="exit-ticket" aria-label="Exit ticket work"></textarea>'+reveal('Reveal exit-ticket key','<ol><li><span class="math" data-tex="m=(-3-9)/(2-(-4))=-12/6=-2"></span>.</li><li><span class="math" data-tex="(5-14)/(4-1)=-9/3=-3"></span> and <span class="math" data-tex="(-7-5)/(8-4)=-12/4=-3"></span>.</li><li><span class="math" data-tex="(1610-1250)/6=60\\text{ QAR/month}"></span>; the fund increases by 60 QAR per month over the interval.</li><li>Vertical: <span class="math" data-tex="\\Delta x=0"></span>, causing division by zero. Horizontal: <span class="math" data-tex="\\Delta y=0"></span> with nonzero run, so the ratio is zero.</li></ol>')+'</div>');
    add("Reflect","Mastery reflection",head("Reflect","Select the next instructional move")+'<div class="grid"><div class="card tint"><h3>Ready to advance</h3><p>At least 16/20, exact slopes across representations, correct units, and complete interpretations.</p></div><div class="card gold"><h3>Targeted review</h3><p>Return to the specific concept cycle linked to the evidence gap; then solve a parallel task without scaffolding.</p></div></div><label for="reflection"><h3>My evidence and next action</h3></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea>');
    add("Complete","Constant-rate fluency secured",head("Complete","Lesson 1.3 mastery package")+'<div class="grid"><div class="card"><h3>Evidence to retain</h3><ul><li>Differentiated practice score</li><li>One corrected sign/order error</li><li>Exit-ticket work with units</li><li>Personal next action</li></ul><button class="secondary" id="exportFinal" type="button">Export lesson work</button></div><div class="card maroon"><h3>Next lesson</h3><p><strong>1.4 Representations of Linear Functions</strong></p><p>Use slope fluency to move among equations, tables, graphs, and contextual statements.</p><a class="cta" href="../../lesson.html?grade=9&amp;path=common&amp;lesson=1.4">View next lesson preview</a></div></div>');

    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map((s,i)=>'<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==='cover'?'cover':'')+'">'+s.body+'</div></section>').join('');
    const slideEls=[...document.querySelectorAll(".slide")];
    let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",''))-1||0));
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function load(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}
    const state=load();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root=document){root.querySelectorAll('.math').forEach(el=>{if(window.katex){try{window.katex.render(el.dataset.tex||'',el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"]').forEach(input=>{if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>checkOne(b.dataset.check)));document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",()=>{state.fields.notebook=n.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(x=>x.id===id),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the ratio, sign, units, and meaning.":"Not yet. Recheck subtraction order, output/input orientation, and units.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(level=>{const qs=practice.filter(q=>q.level===level),n=qs.filter(q=>state.answers[q.id]===q.answer).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit ticket.":"Use the level pattern to select a targeted review block.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 1.3 Slope and Rate of Change","Exported: "+new Date().toLocaleString(),""];practice.forEach(q=>{lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_1.3_Slope_Rate_of_Change.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());document.documentElement.dataset.lessonReady="true";
  })();
  </script>
</body>
</html>

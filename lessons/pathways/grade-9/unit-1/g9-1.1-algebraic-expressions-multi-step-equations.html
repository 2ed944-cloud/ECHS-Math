  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-1.1-multistep-equations-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Simplify <span class="math" data-tex="3x+5x-2"></span>.',options:["8x","8x-2","15x-2","8x²-2"],answer:1,solution:'Collect like terms: <span class="math" data-tex="(3+5)x-2=8x-2"></span>.'},
      {id:"E2",level:"Easy",calc:false,prompt:'Expand <span class="math" data-tex="4(2x-3)"></span>.',options:["8x-3","6x-12","8x-12","8x+12"],answer:2,solution:'Multiply both terms by 4: <span class="math" data-tex="8x-12"></span>.'},
      {id:"E3",level:"Easy",calc:false,prompt:'Solve <span class="math" data-tex="3x+5=20"></span>.',options:["x=3","x=5","x=15","x=25/3"],answer:1,solution:'<span class="math" data-tex="3x=15"></span>, so <span class="math" data-tex="x=5"></span>.'},
      {id:"E4",level:"Easy",calc:false,prompt:'Solve the proportion <span class="math" data-tex="\\frac{x}{6}=\\frac43"></span>.',options:["x=2","x=6","x=7","x=8"],answer:3,solution:'Multiply by 6: <span class="math" data-tex="x=6(4/3)=8"></span>.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Simplify <span class="math" data-tex="5(2y-1)-3y"></span>.',options:["7y-5","7y-1","13y-5","10y-3"],answer:0,solution:'<span class="math" data-tex="10y-5-3y=7y-5"></span>.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="4x-7=2x+9"></span>.',options:["x=1","x=4","x=8","x=16"],answer:2,solution:'Subtract <span class="math" data-tex="2x"></span> and add 7: <span class="math" data-tex="2x=16"></span>, so <span class="math" data-tex="x=8"></span>.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="3(x-2)+5=2x+7"></span>.',options:["x=-8","x=2","x=6","x=8"],answer:3,solution:'<span class="math" data-tex="3x-1=2x+7"></span>, hence <span class="math" data-tex="x=8"></span>.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Classify <span class="math" data-tex="5(x+2)=5x+10"></span>.',options:["One solution","Infinitely many solutions","No solution","x=0 only"],answer:1,solution:'Both sides simplify to <span class="math" data-tex="5x+10"></span>; the equation is true for every real <span class="math" data-tex="x"></span>.'},
      {id:"M5",level:"Medium",calc:false,prompt:'Classify <span class="math" data-tex="2(3x-1)=6x+5"></span>.',options:["One solution","Infinitely many solutions","No solution","x=7/6"],answer:2,solution:'Simplifying gives <span class="math" data-tex="6x-2=6x+5\\Rightarrow-2=5"></span>, a contradiction. There is no solution.'},
      {id:"M6",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="\\frac35=\\frac{n-2}{15}"></span>.',options:["n=11","n=9","n=7","n=5"],answer:0,solution:'<span class="math" data-tex="3(15)=5(n-2)\\Rightarrow45=5n-10\\Rightarrow n=11"></span>.'},
      {id:"H1",level:"Hard",calc:false,prompt:'Simplify <span class="math" data-tex="-2(3a-4)+5(a+1)"></span>.',options:["-11a+9","-a+3","-a+13","a+13"],answer:2,solution:'<span class="math" data-tex="-6a+8+5a+5=-a+13"></span>.'},
      {id:"H2",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="2(3x-4)-5=4x+9"></span>.',options:["x=6","x=7","x=9","x=11"],answer:3,solution:'<span class="math" data-tex="6x-13=4x+9\\Rightarrow2x=22\\Rightarrow x=11"></span>.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="5-2(3x+1)=3(x-4)"></span>.',options:["x=-5/3","x=5/3","x=3","x=5"],answer:1,solution:'<span class="math" data-tex="3-6x=3x-12\\Rightarrow15=9x\\Rightarrow x=5/3"></span>.'},
      {id:"H4",level:"Hard",calc:false,prompt:'Classify <span class="math" data-tex="4(2x-3)+5=8x-7"></span>.',options:["Infinitely many solutions","No solution","x=5/8","x=-7"],answer:0,solution:'The left side simplifies to <span class="math" data-tex="8x-7"></span>, identical to the right side.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Classify <span class="math" data-tex="3(2x+5)-4=6x+12"></span>.',options:["Infinitely many solutions","No solution","x=1/6","x=12"],answer:1,solution:'<span class="math" data-tex="6x+11=6x+12\\Rightarrow11=12"></span>, a contradiction.'},
      {id:"H6",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="\\frac{x+3}{8}=\\frac54"></span>.',options:["x=5","x=6","x=7","x=13"],answer:2,solution:'<span class="math" data-tex="4(x+3)=40\\Rightarrow x+3=10\\Rightarrow x=7"></span>.'},
      {id:"C1",level:"Challenge",calc:true,prompt:'A printer produces 18 pages in 3 minutes at a constant rate. How many minutes are needed for 45 pages?',options:["5","6","7.5","8"],answer:2,solution:'<span class="math" data-tex="18/3=45/t\\Rightarrow6=45/t\\Rightarrow t=7.5"></span> minutes.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'Solve <span class="math" data-tex="0.3(10x-4)=2.4x+3.6"></span>.',options:["x=4","x=8","x=12","x=16"],answer:1,solution:'<span class="math" data-tex="3x-1.2=2.4x+3.6\\Rightarrow0.6x=4.8\\Rightarrow x=8"></span>.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'A student reaches <span class="math" data-tex="0=0"></span> while solving <span class="math" data-tex="2(x+3)=2x+6"></span>. What is the valid conclusion?',options:["x=0 only","No solution","Infinitely many solutions","The equation is nonlinear"],answer:2,solution:'<span class="math" data-tex="0=0"></span> is always true, so every real value satisfies the original identity.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'Two identical notebooks plus a QAR 7 delivery fee cost QAR 31. What is the price of one notebook?',options:["QAR 7","QAR 9","QAR 12","QAR 19"],answer:2,solution:'<span class="math" data-tex="2n+7=31\\Rightarrow2n=24\\Rightarrow n=12"></span> QAR.'}
    ];
    const slides=[];
    const add=(stage,title,body,cls="")=>slides.push({stage,title,body,cls});
    const head=(stage,title)=>'<div class="slide-head"><div><p class="eyebrow">'+stage+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';
    const reveal=(label,body)=>'<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';
    const section=(code,title,description)=>'<div class="section-banner"><div><p class="eyebrow">Concept development</p><h2 tabindex="-1">'+title+'</h2><p class="lead">'+description+'</p><p><span class="badge">Diagnostic / repair depth</span><span class="badge">No calculator</span></p></div><div class="section-code" aria-hidden="true">'+code+'</div></div>';
    const balanceSvg=()=>'<svg class="balance" viewBox="0 0 720 280" role="img" aria-labelledby="bal-title bal-desc"><title id="bal-title">Balanced equation model</title><desc id="bal-desc">A balanced scale shows x plus three blocks on the left and eight blocks on the right, representing x plus 3 equals 8.</desc><line class="bal-line" x1="130" y1="105" x2="590" y2="105"/><path class="bal-pan" d="M95 112h190l-28 80H123z"/><path class="bal-pan" d="M435 112h190l-28 80H463z"/><line class="bal-line" x1="360" y1="105" x2="360" y2="225"/><path class="bal-line" d="M300 230h120"/><rect class="bal-block" x="140" y="135" width="52" height="38" rx="7"/><text class="bal-text" x="158" y="161">x</text><text class="bal-text" x="207" y="161">+ 3</text><text class="bal-text" x="505" y="161">8</text></svg>';
    function qCard(q){return '<div class="question-layout"><div class="question-box"><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?'calc':'')+'">'+(q.calc?'Calculator optional':'No calculator')+'</span><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map((o,i)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>').join('')+'</div><button class="check-button" type="button" data-check="'+q.id+'">Check response</button><p class="feedback" id="feedback-'+q.id+'" aria-live="polite"></p>'+reveal('Reveal verified solution','<p><strong>Answer '+String.fromCharCode(65+q.answer)+'.</strong> '+q.solution+'</p>')+'</div><aside class="side-note"><label for="work-'+q.id+'"><strong>Show the law or inverse step</strong></label><textarea class="scratch" id="work-'+q.id+'" data-save="work-'+q.id+'" placeholder="Record exact reasoning and a check."></textarea><p><strong>Audit</strong></p><ul><li>Base and exponent</li><li>Operation on both sides</li><li>Restrictions</li><li>Substitution check</li></ul></aside></div>'}

    add("Launch","Algebraic Expressions & Multi-Step Equations",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Lesson 1.1 · AP Precalculus Readiness</p><h1 tabindex="-1">Algebraic Expressions &amp; Multi-Step Equations</h1><p class="lead">Simplify strategically, solve linear equations with variables on both sides, and justify whether an equation has one, no, or infinitely many solutions.</p><button class="cta" type="button" data-go="1">Begin the lesson →</button></div><div class="power-art" aria-label="Multi-step equation structure"><div><span class="math" data-tex="ax+b=cx+d"></span><small>simplify · solve · classify</small></div></div></div>','cover');
    add("Orient","Learning outcomes",head("Orient","What you will know and do")+'<div class="grid three"><article class="card"><strong class="big">1</strong><h3>Simplify</h3><p>Use distribution and collecting like terms to create equivalent expressions independently.</p></article><article class="card"><strong class="big">2</strong><h3>Solve</h3><p>Solve multi-step linear and proportional equations, including variables on both sides.</p></article><article class="card"><strong class="big">3</strong><h3>Classify</h3><p>Justify one, no, or infinitely many solutions from the final equality statement.</p></article></div>');
    add("Orient","Success criteria",head("Orient","Mastery is independent and justified")+'<div class="grid"><div class="card tint"><h3>By the exit ticket, I can…</h3><ul><li>simplify before choosing a solving move;</li><li>maintain equality line by line;</li><li>reach at least 16 of 20 on differentiated practice;</li><li>classify the solution set and verify one solution.</li></ul></div><div class="card gold"><h3>Coverage boundary</h3><p>This lesson reaches full prerequisite mastery for linear equations. Nonlinear, rational, and radical equations are deferred.</p></div></div>');
    add("Plan","Three-period learning sequence",head("Plan","A prerequisite-mastery sequence")+'<div class="grid three"><article class="card"><span class="badge">Period 1</span><h3>Equivalent structure</h3><p>Distribution, collecting terms, and efficient simplification.</p></article><article class="card"><span class="badge">Period 2</span><h3>Linear solving</h3><p>Multi-step equations and variables on both sides.</p></article><article class="card"><span class="badge">Period 3</span><h3>Classify and transfer</h3><p>Identities, contradictions, proportions, and mastery evidence.</p></article></div><p class="callout warning"><strong>Maximum pacing:</strong> four periods. Students must reach independent fluency rather than remain scaffold-dependent.</p>');
    add("Retrieve","Prerequisite retrieval",head("Retrieve","Activate the Unit 0 repair tools")+'<div class="grid"><div class="card"><h3>Mental warm-up</h3><ol><li>Expand <span class="math" data-tex="3(x+4)"></span>.</li><li>Simplify <span class="math" data-tex="5x-2x"></span>.</li><li>Solve <span class="math" data-tex="4x=28"></span>.</li><li>Check whether <span class="math" data-tex="x=3"></span> satisfies <span class="math" data-tex="2x+1=7"></span>.</li></ol></div><div class="card maroon"><h3>Predict the fragile step</h3><p>Which will need the closest audit: a negative distribution, moving variable terms, or classifying the final statement?</p><textarea class="scratch" data-save="retrieval-prediction" aria-label="Retrieval prediction"></textarea></div></div>'+reveal('Check retrieval','<p><span class="math" data-tex="3x+12,\\;3x,\\;x=7"></span>; yes, because <span class="math" data-tex="2(3)+1=7"></span>.</p>'));
    add("Retrieve","Worked retrieval",head("Worked example","Simplify before solving")+'<div class="step-list"><div class="step">Solve <span class="math" data-tex="2(x+5)+3=19"></span>.</div><div class="step">Distribute: <span class="math" data-tex="2x+10+3=19"></span>.</div><div class="step">Collect constants: <span class="math" data-tex="2x+13=19"></span>.</div><div class="step">Then <span class="math" data-tex="2x=6\\Rightarrow x=3"></span>; substitution confirms the result.</div></div>');
    add("Student Turn","Retrieval check",head("Student Turn","Make the structure visible")+'<div class="question-box"><p class="question-prompt">Simplify and solve <span class="math" data-tex="3(2x-1)+4=19"></span>.</p><textarea class="scratch" data-save="warmup-work" aria-label="Warm-up work"></textarea>'+reveal('Reveal answer','<p><span class="math" data-tex="6x-3+4=19\\Rightarrow6x+1=19\\Rightarrow x=3"></span>. Check: <span class="math" data-tex="3(6-1)+4=19"></span>.</p>')+'</div>');
    add("Habits","The equation workflow",head("Habits","Simplify → gather → isolate → verify/classify")+'<div class="flow"><span>Simplify each side</span><b>→</b><span>Gather variable terms</span><b>→</b><span>Isolate the variable</span><b>→</b><span>Verify or classify</span></div><p class="callout success">Every line must be equivalent to the line before it. A final statement such as <span class="math" data-tex="0=0"></span> or <span class="math" data-tex="3=8"></span> carries mathematical meaning.</p>');

    add("Expressions","Distribute and collect terms",section("a(b+c)","Distribute and collect terms","Equivalent expressions have the same value for every allowed input. Distribution exposes terms; collecting like terms compresses them."));

    add("Expressions","Worked example",head("Worked example","Simplify in a deliberate order")+'<div class="step-list"><div class="step">Simplify <span class="math" data-tex="-3(2x-5)+4(x+1)-7"></span>.</div><div class="step">Distribute: <span class="math" data-tex="-6x+15+4x+4-7"></span>.</div><div class="step">Collect variable terms and constants.</div><div class="step">Result: <span class="math" data-tex="-2x+12"></span>.</div></div>');

    add("Misconception","Expression misconception",head("Misconception check","Distribution is multiplication, not attachment")+'<div class="grid"><div class="card maroon"><p><span class="math" data-tex="-2(x-6)\\ne-2x-12"></span></p><p>The second product has two negative factors.</p></div><div class="card tint"><p><span class="math" data-tex="-2(x-6)=-2x+12"></span></p><p>Check with <span class="math" data-tex="x=0"></span>: both sides equal 12.</p></div></div>');
    add("Checkpoint","Expression evidence",head("Checkpoint","Know when simplification is complete")+'<div class="card gold"><p><span class="math" data-tex="4x^2+3x-2x^2+5=2x^2+3x+5"></span>.</p><p>The squared, linear, and constant terms are unlike. No further collection is valid.</p></div>');

    add("Multi-step","Multi-step linear equations",section("ax+b=c","Multi-step linear equations","Simplify each side first, then reverse the operation chain while preserving equality."));

    add("Multi-step","Worked example",head("Worked example","Use exact reversible steps")+'<div class="step-list"><div class="step">Solve <span class="math" data-tex="4(2x-3)+5=25"></span>.</div><div class="step"><span class="math" data-tex="8x-12+5=25\\Rightarrow8x-7=25"></span>.</div><div class="step"><span class="math" data-tex="8x=32\\Rightarrow x=4"></span>.</div><div class="step">Check: <span class="math" data-tex="4(8-3)+5=25"></span>.</div></div>');

    add("Misconception","Multi-step misconception",head("Misconception check","The division bar groups its numerator")+'<div class="grid"><div class="card maroon"><p>From <span class="math" data-tex="\\frac{x+5}{3}=7"></span>, multiplying only <span class="math" data-tex="x"></span> by 3 is invalid.</p></div><div class="card tint"><p>Multiply both sides by 3: <span class="math" data-tex="x+5=21"></span>, then <span class="math" data-tex="x=16"></span>.</p></div></div>');

    add("Misconception","Both-sides misconception",head("Misconception check","Combining across an equals sign is not simplification")+'<div class="grid"><div class="card maroon"><p><span class="math" data-tex="4x+3=2x-5"></span> cannot become <span class="math" data-tex="6x-2"></span>.</p></div><div class="card tint"><p>The equals sign separates two expressions. Apply an operation to both sides: subtract <span class="math" data-tex="2x"></span> to get <span class="math" data-tex="2x+3=-5"></span>.</p></div></div>');

    add("Error analysis","Repair one invalid line",head("Error analysis","Turn an error into a general safeguard")+'<div class="grid"><div class="card"><label for="errorAnalysis"><strong>Name the first invalid line, explain the equality or distribution error, correct it, and verify/classify.</strong></label><textarea class="scratch" id="errorAnalysis" data-save="error-analysis"></textarea></div><div class="card gold"><h3>Strong evidence includes</h3><ul><li>the simplified form of each side;</li><li>the operation applied to both sides;</li><li>the meaning of the final statement;</li><li>a substitution or ratio check.</li></ul></div></div>');

    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root=document){root.querySelectorAll('.math').forEach(el=>{if(window.katex){try{window.katex.render(el.dataset.tex||'',el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"]').forEach(input=>{if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>checkOne(b.dataset.check)));document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",()=>{state.fields.notebook=n.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(x=>x.id===id),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the law or inverse step.":"Not yet. Recheck the law, sign, restriction, or substitution.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(level=>{const qs=practice.filter(q=>q.level===level),n=qs.filter(q=>state.answers[q.id]===q.answer).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit ticket.":"Use the level pattern to select a targeted repair block.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 1.1 Algebraic Expressions & Multi-Step Equations","Exported: "+new Date().toLocaleString(),""];practice.forEach(q=>{lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_1.1_Algebraic_Expressions_MultiStep_Equations.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());document.documentElement.dataset.lessonReady="true";
  })();
  </script>
</body>
</html>

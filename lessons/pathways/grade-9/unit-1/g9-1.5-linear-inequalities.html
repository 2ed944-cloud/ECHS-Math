  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-1.5-linear-inequalities-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Solve <span class="math" data-tex="x+4<9"></span>.',options:["x < 5","x > 5","x < 13","x > 13"],answer:0,solution:'Subtract 4 from both sides: <span class="math" data-tex="x+4<9\\Rightarrow x<5"></span>.'},
      {id:"E2",level:"Easy",calc:false,prompt:'Which inequality describes a closed endpoint at -2 with shading to the right?',options:["x < -2","x ≥ -2","x > -2","x ≤ -2"],answer:1,solution:'A closed endpoint includes -2, and rightward shading selects greater values. Therefore <span class="math" data-tex="x\\ge -2"></span>.'},
      {id:"E3",level:"Easy",calc:false,prompt:'Write <span class="math" data-tex="x\\le 3"></span> in interval notation.',options:["(3, ∞)","(-∞, 3)","(-∞, 3]","[3, ∞)"],answer:2,solution:'Values extend without bound to the left, so infinity uses a parenthesis. Because 3 is included, use a bracket: <span class="math" data-tex="(-\\infty,3]"></span>.'},
      {id:"E4",level:"Easy",calc:false,prompt:'Solve <span class="math" data-tex="-2x>8"></span>.',options:["x > -4","x > 4","x < 4","x < -4"],answer:3,solution:'Divide by -2 and reverse the inequality sign: <span class="math" data-tex="-2x>8\\Rightarrow x<-4"></span>.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="3x-5\\le 10"></span>.',options:["x ≥ 5","x ≤ 5","x ≤ 15","x ≥ 15"],answer:1,solution:'Add 5, then divide by 3: <span class="math" data-tex="3x\\le15\\Rightarrow x\\le5"></span>.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="7-2x<1"></span>.',options:["x > 3","x < 3","x > -3","x < -3"],answer:0,solution:'Subtract 7: <span class="math" data-tex="-2x<-6"></span>. Divide by -2 and reverse the sign: <span class="math" data-tex="x>3"></span>.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="2(x-3)+5\\ge 3x-1"></span>.',options:["x ≥ 0","x < 0","x ≤ 0","x > 0"],answer:2,solution:'Simplify: <span class="math" data-tex="2x-1\\ge3x-1"></span>. Subtract <span class="math" data-tex="2x"></span>, then add 1: <span class="math" data-tex="0\\ge x"></span>, or <span class="math" data-tex="x\\le0"></span>.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="-4<2x+2\\le10"></span>.',options:["[-3, 4]","(-3, 4)","[-3, 4)","(-3, 4]"],answer:3,solution:'Subtract 2 throughout and divide by 2: <span class="math" data-tex="-6<2x\\le8\\Rightarrow -3<x\\le4"></span>, so the interval is <span class="math" data-tex="(-3,4]"></span>.'},
      {id:"M5",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="5x+1<16"></span> or <span class="math" data-tex="-2x\\le-8"></span>.',options:["(-∞, 3) ∪ [4, ∞)","[3, 4]","(-∞, 3) ∩ [4, ∞)","(3, 4]"],answer:0,solution:'The first inequality gives <span class="math" data-tex="x<3"></span>. The second gives <span class="math" data-tex="x\\ge4"></span> after sign reversal. “Or” forms the union <span class="math" data-tex="(-\\infty,3)\\cup[4,\\infty)"></span>.'},
      {id:"M6",level:"Medium",calc:false,prompt:'A 12 QAR entry fee plus 6 QAR per hour must cost at most 48 QAR. If time cannot be negative, which interval gives the possible hours?',options:["[0, 5]","(-∞, 6]","[0, 6]","[6, ∞)"],answer:2,solution:'Solve <span class="math" data-tex="12+6h\\le48"></span> to get <span class="math" data-tex="h\\le6"></span>. The context adds <span class="math" data-tex="h\\ge0"></span>, so <span class="math" data-tex="h\\in[0,6]"></span>.'},
      {id:"H1",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="4-3(2x-1)>2x+15"></span>.',options:["x > -1","x < -1","x > 1","x < 1"],answer:1,solution:'Expand and collect terms: <span class="math" data-tex="7-6x>2x+15\\Rightarrow -8x>8"></span>. Divide by -8 and reverse the sign: <span class="math" data-tex="x<-1"></span>.'},
      {id:"H2",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="5(2x-3)\\le4x+9"></span>.',options:["x ≤ 4","x ≥ 4","x ≤ -4","x ≥ -4"],answer:0,solution:'<span class="math" data-tex="10x-15\\le4x+9\\Rightarrow6x\\le24\\Rightarrow x\\le4"></span>.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="2x-7<5x+2\\le8x-4"></span>.',options:["x > -3","-3 < x ≤ 2","x ≤ 2","x ≥ 2"],answer:3,solution:'The left comparison gives <span class="math" data-tex="x>-3"></span>; the right gives <span class="math" data-tex="x\\ge2"></span>. Their intersection is <span class="math" data-tex="x\\ge2"></span>.'},
      {id:"H4",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="-1\\le\\frac{3-x}{2}<4"></span>.',options:["[-5, 5)","(-5, 5]","[-5, 5]","(-5, 5)"],answer:1,solution:'Multiply throughout by 2: <span class="math" data-tex="-2\\le3-x<8"></span>. The two conditions are <span class="math" data-tex="x\\le5"></span> and <span class="math" data-tex="x>-5"></span>, giving <span class="math" data-tex="(-5,5]"></span>.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="3(x-2)>3x+1"></span>.',options:["x > 7","x < 7","no solution","all real numbers"],answer:2,solution:'Subtract <span class="math" data-tex="3x"></span>: <span class="math" data-tex="-6>1"></span>, which is always false. The solution set is <span class="math" data-tex="\\varnothing"></span>.'},
      {id:"H6",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="2(x+4)-3\\le2x+5"></span>.',options:["x ≤ 5","x ≥ 5","no solution","all real numbers"],answer:3,solution:'Both sides simplify to <span class="math" data-tex="2x+5"></span>, so the statement is always true. The solution set is <span class="math" data-tex="(-\\infty,\\infty)"></span>.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'Solve <span class="math" data-tex="-3x<-3"></span> and explain the sign decision.',options:["x < 1","x > 1","x ≤ 1","x ≥ 1"],answer:1,solution:'Division by -3 reverses the order: <span class="math" data-tex="-3x<-3\\Rightarrow x>1"></span>. The reversal preserves the truth of the comparison.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'Which interval represents <span class="math" data-tex="x\\le-2"></span> or <span class="math" data-tex="x>4"></span>?',options:["(-∞, -2] ∪ (4, ∞)","[-2, 4)","(-∞, -2) ∪ [4, ∞)","[-2, 4]"],answer:0,solution:'The first ray includes -2 and extends left; the second excludes 4 and extends right: <span class="math" data-tex="(-\\infty,-2]\\cup(4,\\infty)"></span>.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'A laboratory range requires temperature at least 18°C but below 26°C. Which interval is correct?',options:["(18, 26)","(18, 26]","[18, 26)","[18, 26]"],answer:2,solution:'“At least 18” includes 18, while “below 26” excludes 26. Thus <span class="math" data-tex="18\\le T<26"></span>, or <span class="math" data-tex="[18,26)"></span>.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'Solve <span class="math" data-tex="2-5x\\ge17"></span>. Which graph description is correct?',options:["open at -3, shade left","closed at -3, shade left","open at -3, shade right","closed at -3, shade right"],answer:1,solution:'<span class="math" data-tex="-5x\\ge15"></span>. Divide by -5 and reverse the sign: <span class="math" data-tex="x\\le-3"></span>. Include -3 with a closed endpoint and shade left.'}
    ];
    const slides=[];
    const add=(stage,title,body,cls="")=>slides.push({stage,title,body,cls});
    const head=(label,title)=>'<div class="slide-head"><div><p class="eyebrow">'+label+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';
    const reveal=(label,body)=>'<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';
    const section=(code,title,text)=>'<div class="section-banner"><div><p class="eyebrow">Concept cycle</p><h2 tabindex="-1">'+title+'</h2><p class="lead">'+text+'</p></div><div class="section-code">'+code+'</div></div>';
    const qCard=q=>'<div class="question-layout"><div class="question-box"><div><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?'calc':'')+'">'+(q.calc?'Calculator':'No calculator')+'</span></div><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map((o,i)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>').join("")+'</div><button class="check-button" type="button" data-check="'+q.id+'">Check response</button><p class="feedback" id="feedback-'+q.id+'" aria-live="polite"></p>'+reveal('Reveal complete solution','<p>'+q.solution+'</p>')+'</div><aside class="side-note"><label for="work-'+q.id+'"><strong>Show the algebra, sign decision, and representation</strong></label><textarea class="scratch" id="work-'+q.id+'" data-save="work-'+q.id+'"></textarea></aside></div>';
    const numberLineSvg=(id,title,description,marking)=>'<svg class="graph" viewBox="0 0 760 260" role="img" aria-labelledby="number-title-'+id+' number-desc-'+id+'"><title id="number-title-'+id+'">'+title+'</title><desc id="number-desc-'+id+'">'+description+'</desc><g aria-hidden="true"><path class="axis" d="M70 125H690"/><path class="tick" d="M130 112V138M230 112V138M330 112V138M430 112V138M530 112V138M630 112V138"/><text class="gtext" x="116" y="172">-5</text><text class="gtext" x="216" y="172">-3</text><text class="gtext" x="322" y="172">0</text><text class="gtext" x="422" y="172">2</text><text class="gtext" x="522" y="172">4</text><text class="gtext" x="622" y="172">6</text>'+marking+'</g></svg>';
    const rayRight=numberLineSvg("right","Number-line graph of x greater than or equal to 2","A closed endpoint at 2 and a maroon ray extending right represent all values at least 2.",'<path class="shade" d="M430 125H674"/><path class="shade" d="M674 125L650 108M674 125L650 142"/><circle class="endpoint-closed" cx="430" cy="125" r="12"/><text class="gtext" x="396" y="80">x ≥ 2</text>');
    const rayLeft=numberLineSvg("left","Number-line graph of x less than negative 3","An open endpoint at negative 3 and a maroon ray extending left represent all values below negative 3.",'<path class="shade" d="M86 125H230"/><path class="shade" d="M86 125L110 108M86 125L110 142"/><circle class="endpoint-open" cx="230" cy="125" r="12"/><text class="gtext" x="170" y="80">x &lt; -3</text>');
    const bounded=numberLineSvg("bounded","Number-line graph of negative 3 less than x and x less than or equal to 4","An open endpoint at negative 3, a closed endpoint at 4, and a segment between them represent negative 3 less than x less than or equal to 4.",'<path class="shade alt" d="M230 125H530"/><circle class="endpoint-open" cx="230" cy="125" r="12"/><circle class="endpoint-closed" cx="530" cy="125" r="12"/><text class="gtext" x="330" y="80">-3 &lt; x ≤ 4</text>');

    add("Launch","Linear Inequalities",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Lesson 1.5 · AP Precalculus readiness</p><h1 tabindex="-1">Linear Inequalities</h1><p class="lead">Solve, verify, and communicate one-variable and compound inequality solution sets using algebra, number-line graphs, and interval notation.</p><button class="cta" type="button" data-go="1">Begin the lesson →</button></div><div class="slope-art">'+bounded+'</div></div>',"cover");
    add("Purpose","Three-period pathway",head("Purpose","What this lesson masters—and defers")+'<p class="lead">This is a three-period prerequisite-mastery sequence.</p><div class="grid"><div class="card tint"><h3>Required mastery</h3><p>One-variable linear inequalities, compound inequalities, interval notation, number-line graphs, correct sign reversal, and precise solution-set communication.</p></div><div class="card gold"><h3>Deliberately deferred</h3><p>Quadratic inequalities belong in Unit 4. Rational inequalities are reserved for later courses. This lesson stays within the approved linear boundary.</p></div></div><p class="callout"><strong>Pacing:</strong> target three class periods, maximum three.</p>');
    add("Goals","Learning goals",head("Learning outcome","By the end, I can…")+'<div class="law-grid"><article class="law"><strong>Solve</strong>Maintain equivalent solution sets while isolating the variable.</article><article class="law"><strong>Represent</strong>Translate among inequality notation, number-line graphs, and intervals.</article><article class="law"><strong>Communicate</strong>State endpoints, inclusion, direction, and contextual restrictions precisely.</article></div>');
    add("Success","Mastery evidence",head("Success criteria","What counts as secure")+'<div class="grid"><div class="card"><strong class="big">16 / 20</strong><p>on differentiated practice, including sign-reversal and compound-inequality evidence.</p></div><div class="card"><strong class="big">3 forms</strong><p>equivalent algebraic notation, number-line graph, and interval notation for every final set.</p></div></div>');
    add("Retrieval","Equation-solving retrieval",head("Prerequisite retrieval","Use inverse operations on both sides")+'<div class="grid"><div class="card"><p>Solve <span class="math" data-tex="3x-7=11"></span>:</p><p><span class="formula math" data-tex="3x=18\\Rightarrow x=6"></span></p></div><div class="card gold"><p>An equation usually identifies specific value(s). An inequality describes every value in a region that makes a comparison true.</p></div></div>');
    add("Retrieval","Order retrieval",head("Prerequisite retrieval","Compare positions on the number line")+'<div class="flow"><span><span class="math" data-tex="-5<-2"></span></span><b>→</b><span>multiply by -1</span><b>→</b><span><span class="math" data-tex="5>2"></span></span></div><p class="callout success">Negation reflects both numbers across zero, so their left-to-right order reverses.</p>');
    add("Retrieval","Endpoint retrieval",head("Prerequisite retrieval","Open and closed endpoints carry meaning")+'<div class="grid three"><article class="card"><h3>Open circle</h3><p>The endpoint is excluded: <span class="math" data-tex="<"></span> or <span class="math" data-tex=">"></span>.</p></article><article class="card"><h3>Closed circle</h3><p>The endpoint is included: <span class="math" data-tex="\\le"></span> or <span class="math" data-tex="\\ge"></span>.</p></article><article class="card"><h3>Arrow</h3><p>The set continues without bound in that direction.</p></article></div>');
    add("Launch","Initial reasoning",head("Student Turn","Which values make the claim true?")+'<div class="question-box"><p class="question-prompt">Without solving formally, test <span class="math" data-tex="x=-2,0,3,5"></span> in <span class="math" data-tex="2x+1\\le7"></span>. Describe the boundary you expect.</p><textarea class="scratch" data-save="launch-reasoning" aria-label="Initial inequality reasoning"></textarea>'+reveal('Reveal reasoning','<p>The values -2, 0, and 3 work; 5 does not. Algebra confirms <span class="math" data-tex="2x\\le6\\Rightarrow x\\le3"></span>, so 3 is an included boundary and all smaller values belong to the set.</p>')+'</div>');

    add("Solve","Equivalent inequalities",section("balance","Preserve the complete solution set","Apply the same addition or subtraction to both sides, then use multiplication or division with careful attention to sign."));
    add("Solve","Solution-set meaning",head("Concept","A solution is a set, not one test value")+'<div class="grid"><div class="card"><p><span class="formula math" data-tex="4x-5<11"></span></p><p>Every value satisfying the comparison belongs to the solution set.</p></div><div class="card tint"><p><span class="math" data-tex="4x<16\\Rightarrow x<4"></span></p><p>Check one included value and one excluded value to test the boundary direction.</p></div></div>');
    add("Solve","Worked example",head("Worked example","Solve and verify a multi-step inequality")+'<div class="step-list"><div class="step"><span class="math" data-tex="3(2x-1)+4\\le19"></span>.</div><div class="step">Distribute and combine: <span class="math" data-tex="6x+1\\le19"></span>.</div><div class="step">Subtract 1: <span class="math" data-tex="6x\\le18"></span>.</div><div class="step">Divide by positive 6: <span class="math" data-tex="x\\le3"></span>; the direction stays.</div><div class="step">Check <span class="math" data-tex="x=3"></span>: <span class="math" data-tex="3(5)+4=19"></span>, so the boundary is included.</div></div>');
    add("Student Turn","Solve and verify",head("Student Turn","Isolate the variable and test both sides")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="5x+8>2x-7"></span>. Then test one value in the set and one value outside it.</p><textarea class="scratch" data-save="solve-turn" aria-label="Linear inequality solution and verification"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="3x>-15\\Rightarrow x>-5"></span>. For example, <span class="math" data-tex="x=0"></span> gives <span class="math" data-tex="8>-7"></span> (true), while <span class="math" data-tex="x=-6"></span> gives <span class="math" data-tex="-22>-19"></span> (false).</p>')+'</div>');
    add("Misconception","Boundary-only checking",head("Misconception check","One successful test value does not define the whole set")+'<div class="grid"><div class="card maroon"><p>Showing that <span class="math" data-tex="x=0"></span> works proves only that 0 belongs to the set.</p></div><div class="card tint"><p>Use equivalent algebra to locate the boundary, then test values on opposite sides to confirm direction.</p></div></div>');
    add("Checkpoint","Basic solution evidence",head("Checkpoint","Solve, graph, and state an interval")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="2(3x+1)-5<15"></span>. Give the inequality, endpoint type, shading direction, and interval.</p><textarea class="scratch" data-save="solve-check" aria-label="Basic inequality checkpoint"></textarea>'+reveal('Reveal solution','<p><span class="math" data-tex="6x-3<15\\Rightarrow6x<18\\Rightarrow x<3"></span>. Use an open endpoint at 3, shade left, and write <span class="math" data-tex="(-\\infty,3)"></span>.</p>')+'</div>');

    add("Order","Negative operations",section("reverse","Reverse the sign after multiplying or dividing by a negative","A negative scale factor reflects the number line. The inequality symbol must reverse so the solution set stays equivalent."));
    add("Order","Why reversal is necessary",head("Concept","Track order before and after negation")+'<div class="grid"><div class="card"><p><span class="math" data-tex="-4<2"></span> is true.</p><p>Multiplying both values by -1 gives 4 and -2.</p></div><div class="card gold"><p>The true comparison is now <span class="math" data-tex="4>-2"></span>, not <span class="math" data-tex="4<-2"></span>.</p><p>Reflection reverses left-to-right order.</p></div></div>');
    add("Order","Worked example",head("Worked example","Solve with two sign-sensitive steps")+'<div class="step-list"><div class="step"><span class="math" data-tex="7-3x\\ge19"></span>.</div><div class="step">Subtract 7: <span class="math" data-tex="-3x\\ge12"></span>.</div><div class="step">Divide by -3 and reverse <span class="math" data-tex="\\ge"></span> to <span class="math" data-tex="\\le"></span>.</div><div class="step">Final set: <span class="math" data-tex="x\\le-4"></span>.</div><div class="step">Boundary check: <span class="math" data-tex="7-3(-4)=19"></span>.</div></div>');
    add("Student Turn","Sign-reversal turn",head("Student Turn","Name the exact reversal step")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="4-5(2x-1)<29"></span>. Annotate the line where the inequality sign reverses.</p><textarea class="scratch" data-save="reversal-turn" aria-label="Sign reversal reasoning"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="9-10x<29\\Rightarrow-10x<20"></span>. Division by -10 reverses the sign, giving <span class="math" data-tex="x>-2"></span>.</p>')+'</div>');
    add("Misconception","Automatic reversal",head("Misconception check","Do not reverse for every negative number you see")+'<div class="grid"><div class="card maroon"><p>Subtracting 7 or adding a negative value does not reverse the inequality sign.</p></div><div class="card tint"><p>Reverse only when both sides are multiplied or divided by a negative quantity.</p></div></div>');
    add("Checkpoint","Sign decision",head("Checkpoint","Explain—not merely perform—the reversal")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="-2(3x+4)\\le10"></span>. Explain why the final graph points in its chosen direction.</p><textarea class="scratch" data-save="reversal-check" aria-label="Sign reversal checkpoint"></textarea>'+reveal('Reveal solution','<p><span class="math" data-tex="-6x-8\\le10\\Rightarrow-6x\\le18\\Rightarrow x\\ge-3"></span>. Division by -6 reverses the order, so values to the right of -3 satisfy the original comparison.</p>')+'</div>');

    add("Compound","And versus or",section("∩ or ∪","Intersect for “and”; unite for “or”","Solve each condition, then combine solution sets according to the logical connector and verify endpoint inclusion."));
    add("Compound","Set logic",head("Concept","The connector controls the combined region")+'<div class="law-grid"><article class="law"><strong>And</strong>A value must satisfy both conditions; keep the overlap, or intersection.</article><article class="law"><strong>Or</strong>A value may satisfy either condition; keep both regions, or union.</article><article class="law"><strong>Check</strong>Test values in each visible region and at every finite endpoint.</article></div>');
    add("Compound","Worked example",head("Worked example","Solve a three-part compound inequality")+'<div class="step-list"><div class="step"><span class="math" data-tex="-7<2x+1\\le9"></span>.</div><div class="step">Subtract 1 from all three parts: <span class="math" data-tex="-8<2x\\le8"></span>.</div><div class="step">Divide all three parts by positive 2: <span class="math" data-tex="-4<x\\le4"></span>.</div><div class="step">Interval: <span class="math" data-tex="(-4,4]"></span>.</div><div class="step">Graph: open at -4, closed at 4, shaded between.</div></div>');
    add("Student Turn","Compound turn",head("Student Turn","Solve each branch before combining")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="3x-2\\le-8"></span> or <span class="math" data-tex="2x+5>13"></span>. Give interval notation and a number-line description.</p><textarea class="scratch" data-save="compound-turn" aria-label="Compound inequality work"></textarea>'+reveal('Reveal verified solution','<p>The branches give <span class="math" data-tex="x\\le-2"></span> or <span class="math" data-tex="x>4"></span>. The union is <span class="math" data-tex="(-\\infty,-2]\\cup(4,\\infty)"></span>: shade left from a closed -2 and right from an open 4.</p>')+'</div>');
    add("Misconception","Connector confusion",head("Misconception check","Do not shade between endpoints automatically")+'<div class="grid"><div class="card maroon"><p>For <span class="math" data-tex="x<-1"></span> or <span class="math" data-tex="x\\ge3"></span>, shading only between -1 and 3 reverses the intended union.</p></div><div class="card tint"><p>“Or” keeps both exterior rays: <span class="math" data-tex="(-\\infty,-1)\\cup[3,\\infty)"></span>.</p></div></div>');
    add("Checkpoint","Compound evidence",head("Checkpoint","Determine overlap, union, or emptiness")+'<div class="question-box"><p class="question-prompt">Compare these sets: (a) <span class="math" data-tex="x>5"></span> and <span class="math" data-tex="x\\le2"></span>; (b) the same statements joined by “or.”</p><textarea class="scratch" data-save="compound-check" aria-label="Compound set checkpoint"></textarea>'+reveal('Reveal solution','<p>(a) No value satisfies both, so the intersection is <span class="math" data-tex="\\varnothing"></span>. (b) The union is <span class="math" data-tex="(-\\infty,2]\\cup(5,\\infty)"></span>.</p>')+'</div>');

    add("Represent","Graphs and intervals",section("[  )","Encode direction and endpoint inclusion precisely","Translate a solution set without changing its boundary, inclusion, or unbounded direction."));
    add("Represent","Representation dictionary",head("Concept","Match each symbol to its visual evidence")+'<div class="grid three"><article class="card"><h3><span class="math" data-tex="x\\ge2"></span></h3><p>Closed at 2, shade right, interval <span class="math" data-tex="[2,\\infty)"></span>.</p></article><article class="card"><h3><span class="math" data-tex="x<-3"></span></h3><p>Open at -3, shade left, interval <span class="math" data-tex="(-\\infty,-3)"></span>.</p></article><article class="card"><h3>Infinity</h3><p>Always use a parenthesis at <span class="math" data-tex="\\pm\\infty"></span>; infinity is not an attainable endpoint.</p></article></div>');
    add("Represent","Worked example",head("Worked example","Read the complete graph")+'<div class="grid"><div>'+bounded+'</div><div class="step-list"><div class="step">Open at -3 means <span class="math" data-tex="x>-3"></span>.</div><div class="step">Closed at 4 means <span class="math" data-tex="x\\le4"></span>.</div><div class="step">The segment between them means “and.”</div><div class="step">Combined: <span class="math" data-tex="-3<x\\le4"></span>.</div><div class="step">Interval: <span class="math" data-tex="(-3,4]"></span>.</div></div></div>');
    add("Student Turn","Representation turn",head("Student Turn","Translate one set three ways")+'<div class="question-box"><p class="question-prompt">Write <span class="math" data-tex="[2,\\infty)"></span> as an inequality and describe its number-line graph. Explain the bracket and parenthesis.</p><div>'+rayRight+'</div><textarea class="scratch" data-save="representation-turn" aria-label="Interval and graph translation"></textarea>'+reveal('Reveal verified representation','<p>The inequality is <span class="math" data-tex="x\\ge2"></span>. Use a closed endpoint at 2 and shade right. The bracket includes 2; the parenthesis at infinity shows that infinity is not a number that can be included.</p>')+'</div>');
    add("Misconception","Infinity bracket",head("Misconception check","Infinity never receives a square bracket")+'<div class="grid"><div class="card maroon"><p><span class="math" data-tex="[2,\\infty]"></span> incorrectly treats infinity like a reachable number.</p></div><div class="card tint"><p>The correct interval for <span class="math" data-tex="x\\ge2"></span> is <span class="math" data-tex="[2,\\infty)"></span>.</p></div></div>');
    add("Checkpoint","Representation evidence",head("Checkpoint","Audit a mismatched representation")+'<div class="question-box"><p class="question-prompt">A student writes <span class="math" data-tex="x<-3"></span>, draws a closed endpoint at -3, and records <span class="math" data-tex="(-\\infty,-3]"></span>. Identify and correct every mismatch.</p><div>'+rayLeft+'</div><textarea class="scratch" data-save="representation-check" aria-label="Representation audit checkpoint"></textarea>'+reveal('Reveal correction','<p>The strict sign excludes -3, so the endpoint must be open and the interval must end with a parenthesis: <span class="math" data-tex="(-\\infty,-3)"></span>. Leftward shading is correct.</p>')+'</div>');

    add("Model","Constraints and precision",section("context","Build and interpret a feasible set","Translate words into boundary comparisons, solve, apply contextual restrictions, and report only meaningful values."));
    add("Model","Context language",head("Concept","Boundary phrases determine inclusion")+'<div class="law-grid"><article class="law"><strong>At most / no more than</strong>Use <span class="math" data-tex="\\le"></span>.</article><article class="law"><strong>At least / no less than</strong>Use <span class="math" data-tex="\\ge"></span>.</article><article class="law"><strong>Between</strong>Read carefully: the context must state whether either endpoint is included.</article></div>');
    add("Model","Worked example",head("Worked example","Include a contextual domain restriction")+'<div class="step-list"><div class="step">A club charges 25 QAR plus 8 QAR per visit. The budget is at most 89 QAR.</div><div class="step">Model: <span class="math" data-tex="25+8v\\le89"></span>.</div><div class="step">Solve: <span class="math" data-tex="8v\\le64\\Rightarrow v\\le8"></span>.</div><div class="step">Visits are whole and nonnegative: <span class="math" data-tex="v\\in\\{0,1,2,\\ldots,8\\}"></span>.</div><div class="step">Interpret: at most eight visits fit the budget.</div></div>');
    add("Student Turn","Modeling turn",head("Student Turn","Build, solve, and interpret a constraint")+'<div class="question-box"><p class="question-prompt">A lift can carry at most 630 kg. Five crates weigh 78 kg each. Write and solve an inequality for the additional load <span class="math" data-tex="w"></span>, assuming <span class="math" data-tex="w\\ge0"></span>.</p><textarea class="scratch" data-save="model-turn" aria-label="Contextual inequality model"></textarea>'+reveal('Reveal verified model','<p><span class="math" data-tex="5(78)+w\\le630"></span>, so <span class="math" data-tex="390+w\\le630\\Rightarrow w\\le240"></span>. With <span class="math" data-tex="w\\ge0"></span>, the meaningful set is <span class="math" data-tex="w\\in[0,240]"></span> kg.</p>')+'</div>');
    add("Misconception","Context-free set",head("Misconception check","Algebraic solutions may need contextual restriction")+'<div class="grid"><div class="card maroon"><p>A solution such as <span class="math" data-tex="t\\le6"></span> includes negative values algebraically.</p></div><div class="card tint"><p>If <span class="math" data-tex="t"></span> measures elapsed time, combine it with <span class="math" data-tex="t\\ge0"></span> and report <span class="math" data-tex="[0,6]"></span>.</p></div></div>');
    add("Checkpoint","Precision synthesis",head("Checkpoint","One set, complete communication")+'<div class="question-box"><p class="question-prompt">A temperature must be at least 18°C but strictly below 26°C. Give the compound inequality, interval, endpoint types, and a precise sentence.</p><textarea class="scratch" data-save="model-check" aria-label="Context solution-set checkpoint"></textarea>'+reveal('Reveal solution','<p><span class="math" data-tex="18\\le T<26"></span>, interval <span class="math" data-tex="[18,26)"></span>: closed at 18, open at 26, shaded between. Acceptable temperatures include 18°C and exclude 26°C.</p>')+'</div>');

    practice.forEach(q=>add("Practice",q.id+" · "+q.level,head("Differentiated practice",q.id+" · "+q.level)+qCard(q)));
    add("Mastery","Practice evidence",head("Mastery evidence","Score the differentiated set")+'<div class="grid"><div class="card"><button class="check-button" id="scoreBtn" type="button">Score all 20 responses</button><p class="lead" id="scoreSummary" aria-live="polite">Complete the set, then score your evidence.</p></div><div class="mastery"><div><strong data-level-score="Easy">—</strong>Easy / 4</div><div><strong data-level-score="Medium">—</strong>Medium / 6</div><div><strong data-level-score="Hard">—</strong>Hard / 6</div><div><strong data-level-score="Challenge">—</strong>Challenge / 4</div><div><strong id="totalScore">—</strong>Total / 20</div></div></div>');
    add("Error analysis","Correct an invalid solution",head("Error analysis","Find the first invalid line")+'<div class="grid"><div class="card"><p>Given <span class="math" data-tex="5-2x>13"></span>:</p><p><span class="math" data-tex="-2x>8"></span></p><p><span class="math" data-tex="x> -4"></span></p><p>Graph: open at -4, shade right.</p><label for="errorAnalysis"><strong>Identify and correct the first invalid line, then verify with test values.</strong></label><textarea class="scratch" id="errorAnalysis" data-save="error-analysis"></textarea></div><div class="card gold"><h3>Verified correction</h3>'+reveal('Reveal correction','<p>Division by -2 requires sign reversal: <span class="math" data-tex="-2x>8\\Rightarrow x<-4"></span>. The graph is open at -4 and shaded left. For example, -5 works because <span class="math" data-tex="5-2(-5)=15>13"></span>, while 0 does not.</p>')+'</div></div>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","Constraint reasoning supports function analysis")+'<div class="grid three"><article class="card"><h3>Preserve equivalence</h3><p>Every algebraic step must retain exactly the same solution set.</p></article><article class="card"><h3>Connect representations</h3><p>Use notation, graphs, and intervals as evidence for one set.</p></article><article class="card"><h3>Interpret constraints</h3><p>Combine algebraic results with domain and context restrictions.</p></article></div><p class="callout success"><strong>Transfer:</strong> AP Precalculus uses inequalities to state domains, feasible inputs, and intervals where function behavior has a specified property. This lesson secures the linear prerequisite without advancing to quadratic or rational inequalities.</p>');
    add("Exit ticket","Exit ticket",head("Exit ticket","Produce final mastery evidence")+'<div class="question-box"><ol><li>Solve and verify <span class="math" data-tex="4-3x\\ge16"></span>.</li><li>Solve <span class="math" data-tex="-5<2x+1\\le9"></span>; give a graph description and interval.</li><li>Write <span class="math" data-tex="(-\\infty,-2]\\cup(5,\\infty)"></span> as a compound inequality.</li><li>A service costs 18 QAR plus 7 QAR per hour and the budget is at most 60 QAR. State the meaningful time interval.</li></ol><textarea class="scratch" data-save="exit-ticket" aria-label="Exit ticket work"></textarea>'+reveal('Reveal exit-ticket key','<ol><li><span class="math" data-tex="-3x\\ge12\\Rightarrow x\\le-4"></span>; -4 gives equality.</li><li><span class="math" data-tex="-6<2x\\le8\\Rightarrow-3<x\\le4"></span>; open -3, closed 4, shade between; <span class="math" data-tex="(-3,4]"></span>.</li><li><span class="math" data-tex="x\\le-2"></span> or <span class="math" data-tex="x>5"></span>.</li><li><span class="math" data-tex="18+7h\\le60\\Rightarrow h\\le6"></span>; with <span class="math" data-tex="h\\ge0"></span>, <span class="math" data-tex="h\\in[0,6]"></span>.</li></ol>')+'</div>');
    add("Reflect","Mastery reflection",head("Reflect","Select the next instructional move")+'<div class="grid"><div class="card tint"><h3>Ready to advance</h3><p>At least 16/20, correct sign decisions, equivalent compound sets, matched endpoint notation, and complete contextual interpretations.</p></div><div class="card gold"><h3>Targeted review</h3><p>Return to the specific sign, connector, or endpoint mismatch that evidence identifies, then solve a parallel task independently.</p></div></div><label for="reflection"><h3>My evidence and next action</h3></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea>');
    add("Complete","Linear inequalities secured",head("Complete","Lesson 1.5 mastery package")+'<div class="grid"><div class="card"><h3>Evidence to retain</h3><ul><li>Differentiated practice score</li><li>One corrected sign-reversal error</li><li>Exit-ticket graphs and intervals</li><li>Personal next action</li></ul><button class="secondary" id="exportFinal" type="button">Export lesson work</button></div><div class="card maroon"><h3>Next lesson</h3><p><strong>1.6 Linear Modeling & Residual Thinking</strong></p><p>Build and interpret linear models, residuals, assumptions, and limitations.</p><a class="cta" href="../../lesson.html?grade=9&amp;path=common&amp;lesson=1.6">View next lesson preview</a></div></div>');

    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map((s,i)=>'<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==='cover'?'cover':'')+'">'+s.body+'</div></section>').join('');
    const slideEls=[...document.querySelectorAll(".slide")];
    let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",''))-1||0));
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function load(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}
    const state=load();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root=document){root.querySelectorAll('.math').forEach(el=>{if(window.katex){try{window.katex.render(el.dataset.tex||'',el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"]').forEach(input=>{if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>checkOne(b.dataset.check)));document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",()=>{state.fields.notebook=n.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(x=>x.id===id),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the algebra, sign decision, and representation.":"Not yet. Recheck inverse operations, sign reversal, connector, and endpoint evidence.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(level=>{const qs=practice.filter(q=>q.level===level),n=qs.filter(q=>state.answers[q.id]===q.answer).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit ticket.":"Use the level pattern to select a targeted review block.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 1.5 Linear Inequalities","Exported: "+new Date().toLocaleString(),""];practice.forEach(q=>{lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_1.5_Linear_Inequalities.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());document.documentElement.dataset.lessonReady="true";
  })();
  </script>

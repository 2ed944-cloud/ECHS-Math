  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-1.4-linear-representations-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'For <span class="math" data-tex="y=3x-5"></span>, identify the slope and the <span class="math" data-tex="y"></span>-intercept.',options:["slope 3; y-intercept -5","slope -5; y-intercept 3","slope 3; y-intercept 5","slope -3; y-intercept -5"],answer:0,solution:'Slope-intercept form is <span class="math" data-tex="y=mx+b"></span>. Therefore <span class="math" data-tex="m=3"></span> and <span class="math" data-tex="b=-5"></span>.'},
      {id:"E2",level:"Easy",calc:false,prompt:'Which equation is the point-slope form of the line through <span class="math" data-tex="(2,7)"></span> with slope <span class="math" data-tex="-4"></span>?',options:["y-2=-4(x-7)","y-7=-4(x-2)","y+7=-4(x+2)","y-7=4(x-2)"],answer:1,solution:'Insert <span class="math" data-tex="m=-4"></span> and <span class="math" data-tex="(x_1,y_1)=(2,7)"></span> into <span class="math" data-tex="y-y_1=m(x-x_1)"></span>.'},
      {id:"E3",level:"Easy",calc:false,prompt:'What is the <span class="math" data-tex="y"></span>-intercept of <span class="math" data-tex="2x+3y=12"></span>?',options:["(0,2)","(0,3)","(0,4)","(0,6)"],answer:2,solution:'At the <span class="math" data-tex="y"></span>-intercept, <span class="math" data-tex="x=0"></span>. Then <span class="math" data-tex="3y=12"></span>, so the point is <span class="math" data-tex="(0,4)"></span>.'},
      {id:"E4",level:"Easy",calc:false,prompt:'A table contains <span class="math" data-tex="(0,-3),(1,1),(2,5)"></span>. Which equation represents it?',options:["y=x-3","y=3x+1","y=4x-3","y=4x+3"],answer:2,solution:'The output rises by 4 for each input unit, so <span class="math" data-tex="m=4"></span>. Since <span class="math" data-tex="y=-3"></span> when <span class="math" data-tex="x=0"></span>, <span class="math" data-tex="y=4x-3"></span>.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Rewrite <span class="math" data-tex="y-5=2(x+1)"></span> in slope-intercept form.',options:["y=2x+3","y=2x+7","y=2x-7","y=-2x+7"],answer:1,solution:'Distribute and isolate <span class="math" data-tex="y"></span>: <span class="math" data-tex="y-5=2x+2\\Rightarrow y=2x+7"></span>.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Find the equation through <span class="math" data-tex="(-2,3)"></span> and <span class="math" data-tex="(4,15)"></span>.',options:["y=2x+7","y=2x-1","y=3x+9","y=-2x-1"],answer:0,solution:'<span class="math" data-tex="m=(15-3)/(4-(-2))=12/6=2"></span>. Using <span class="math" data-tex="(-2,3)"></span>, <span class="math" data-tex="3=2(-2)+b"></span>, so <span class="math" data-tex="b=7"></span>.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Find both intercepts of <span class="math" data-tex="3x-2y=12"></span>.',options:["(4,0) and (0,-6)","(-4,0) and (0,6)","(3,0) and (0,-2)","(6,0) and (0,-4)"],answer:0,solution:'Set <span class="math" data-tex="y=0"></span> to get <span class="math" data-tex="x=4"></span>. Set <span class="math" data-tex="x=0"></span> to get <span class="math" data-tex="y=-6"></span>.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Which line is parallel to <span class="math" data-tex="y=-\\frac12x+4"></span> and passes through <span class="math" data-tex="(6,-1)"></span>?',options:["y = -1/2 x + 2","y = 2x - 13","y = -1/2 x - 4","y = 1/2 x - 4"],answer:0,solution:'A parallel line has slope <span class="math" data-tex="-\\frac12"></span>. Since <span class="math" data-tex="-1=-\\frac12(6)+b"></span>, <span class="math" data-tex="b=2"></span>.'},
      {id:"M5",level:"Medium",calc:false,prompt:'Which line is perpendicular to <span class="math" data-tex="y=2x-3"></span> and passes through <span class="math" data-tex="(4,1)"></span>?',options:["y = 2x - 7","y = -2x + 9","y = -1/2 x + 3","y = 1/2 x - 1"],answer:2,solution:'The perpendicular slope is <span class="math" data-tex="-\\frac12"></span>. Then <span class="math" data-tex="1=-\\frac12(4)+b"></span>, so <span class="math" data-tex="b=3"></span>.'},
      {id:"M6",level:"Medium",calc:false,prompt:'A taxi cost is <span class="math" data-tex="C=8+2.5d"></span>, where <span class="math" data-tex="d"></span> is distance in kilometers. What do 8 and 2.5 represent?',options:["8 km and 2.5 QAR","8 QAR per km and a 2.5 QAR fee","an 8 QAR initial fee and 2.5 QAR per km","a total cost of 10.5 QAR"],answer:2,solution:'The intercept is the cost at <span class="math" data-tex="d=0"></span>: 8 QAR. The slope is <span class="math" data-tex="2.5\\text{ QAR/km}"></span>.'},
      {id:"H1",level:"Hard",calc:false,prompt:'A table contains <span class="math" data-tex="(-3,10),(1,2),(5,-6)"></span>. Which equation represents the line?',options:["y=-2x+4","y=2x+4","y=-2x-4","y=-8x+2"],answer:0,solution:'Each interval gives <span class="math" data-tex="m=-8/4=-2"></span>. Using <span class="math" data-tex="(1,2)"></span>, <span class="math" data-tex="2=-2(1)+b"></span>, so <span class="math" data-tex="b=4"></span>.'},
      {id:"H2",level:"Hard",calc:false,prompt:'Which standard-form equation has intercepts <span class="math" data-tex="(6,0)"></span> and <span class="math" data-tex="(0,4)"></span>?',options:["2x+3y=12","3x+2y=12","x+y=10","4x+6y=12"],answer:0,solution:'The intercept form is <span class="math" data-tex="x/6+y/4=1"></span>. Multiplying by 12 gives <span class="math" data-tex="2x+3y=12"></span>.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Which equation gives the line through a general point <span class="math" data-tex="(a,b)"></span> with slope <span class="math" data-tex="m"></span>?',options:["y-a=m(x-b)","y-b=m(x-a)","y+b=m(x+a)","x-a=m(y-b)"],answer:1,solution:'Point-slope form subtracts the point coordinates from the matching variables: <span class="math" data-tex="y-b=m(x-a)"></span>.'},
      {id:"H4",level:"Hard",calc:false,prompt:'A linear function satisfies <span class="math" data-tex="f(3)=11"></span> and <span class="math" data-tex="f(7)=23"></span>. Find <span class="math" data-tex="f(x)"></span>.',options:["3x + 2","3x - 2","2x + 5","12x - 25"],answer:0,solution:'<span class="math" data-tex="m=(23-11)/(7-3)=3"></span>. Then <span class="math" data-tex="11=3(3)+b"></span>, so <span class="math" data-tex="b=2"></span> and <span class="math" data-tex="f(x)=3x+2"></span>.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Which point lies on <span class="math" data-tex="5x+2y=20"></span>?',options:["(2,5)","(4,2)","(0,5)","(-2,10)"],answer:0,solution:'Substitute <span class="math" data-tex="(2,5)"></span>: <span class="math" data-tex="5(2)+2(5)=20"></span>. The other choices do not make the equation true.'},
      {id:"H6",level:"Hard",calc:false,prompt:'The table <span class="math" data-tex="(0,6),(2,1),(6,-9)"></span> represents the same line as which formula?',options:["y = -5/2 x + 6","y = 5/2 x + 6","y = -5x + 6","y = -5/2 x - 6"],answer:0,solution:'The rate is <span class="math" data-tex="(1-6)/(2-0)=-5/2"></span>, and the row <span class="math" data-tex="(0,6)"></span> gives <span class="math" data-tex="b=6"></span>.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'A line has <span class="math" data-tex="x"></span>-intercept 4 and <span class="math" data-tex="y"></span>-intercept -6. Which equation represents it?',options:["3x-2y=12","3x+2y=12","2x-3y=12","x-y=2"],answer:0,solution:'Both points satisfy <span class="math" data-tex="3x-2y=12"></span>: <span class="math" data-tex="3(4)-2(0)=12"></span> and <span class="math" data-tex="3(0)-2(-6)=12"></span>.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'The point <span class="math" data-tex="(k,5)"></span> lies on <span class="math" data-tex="y=-3x+14"></span>. Find <span class="math" data-tex="k"></span>.',options:["-3","3","19/3","9"],answer:1,solution:'Substitute: <span class="math" data-tex="5=-3k+14\\Rightarrow -3k=-9\\Rightarrow k=3"></span>.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'Find the line through <span class="math" data-tex="(2,-1)"></span> perpendicular to <span class="math" data-tex="4x-2y=9"></span>.',options:["y = 2x - 5","y = -1/2 x","y = 1/2 x - 2","y = -2x + 3"],answer:1,solution:'The given line has slope 2, so the perpendicular slope is <span class="math" data-tex="-1/2"></span>. Through <span class="math" data-tex="(2,-1)"></span>: <span class="math" data-tex="y+1=-\\frac12(x-2)\\Rightarrow y=-\\frac12x"></span>.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'A tank contains 120 L at <span class="math" data-tex="t=2"></span> minutes and 270 L at <span class="math" data-tex="t=7"></span> minutes. Which model and interpretation are correct?',options:["V=30t+60; starts with 60 L and gains 30 L/min","V=30t+120; starts with 120 L","V=75t-30; gains 75 L/min","V=150t-180; gains 150 L/min"],answer:0,solution:'<span class="math" data-tex="m=(270-120)/(7-2)=30"></span>. Then <span class="math" data-tex="120=30(2)+b"></span>, so <span class="math" data-tex="b=60"></span>.'}
    ];
    const slides=[];
    const add=(stage,title,body,cls="")=>slides.push({stage,title,body,cls});
    const head=(label,title)=>'<div class="slide-head"><div><p class="eyebrow">'+label+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';
    const reveal=(label,body)=>'<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';
    const section=(code,title,text)=>'<div class="section-banner"><div><p class="eyebrow">Concept cycle</p><h2 tabindex="-1">'+title+'</h2><p class="lead">'+text+'</p></div><div class="section-code">'+code+'</div></div>';
    const qCard=q=>'<div class="question-layout"><div class="question-box"><div><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?'calc':'')+'">'+(q.calc?'Calculator':'No calculator')+'</span></div><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map((o,i)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>').join("")+'</div><button class="check-button" type="button" data-check="'+q.id+'">Check response</button><p class="feedback" id="feedback-'+q.id+'" aria-live="polite"></p>'+reveal('Reveal complete solution','<p>'+q.solution+'</p>')+'</div><aside class="side-note"><label for="work-'+q.id+'"><strong>Show reasoning and units</strong></label><textarea class="scratch" id="work-'+q.id+'" data-save="work-'+q.id+'"></textarea></aside></div>';
    const graphSvg=id=>'<svg class="graph" viewBox="0 0 640 400" role="img" aria-labelledby="line-title-'+id+' line-desc-'+id+'"><title id="line-title-'+id+'">Graph of y equals 2x plus 2</title><desc id="line-desc-'+id+'">Coordinate plane with equal scales. The line y equals 2x plus 2 passes through labeled points negative one comma zero, zero comma two, and one comma four. The labels identify the x-intercept, y-intercept, and a third verification point.</desc><g aria-hidden="true"><path class="gridline" d="M80 50V370M120 50V370M160 50V370M200 50V370M240 50V370M280 50V370M320 50V370M360 50V370M400 50V370M440 50V370M480 50V370M520 50V370M560 50V370M80 50H560M80 90H560M80 130H560M80 170H560M80 210H560M80 250H560M80 290H560M80 330H560M80 370H560"/><path class="axis" d="M60 210H580M320 385V30"/><path class="trend" d="M200 370L360 50"/><circle class="point" cx="280" cy="210" r="8"/><circle class="point" cx="320" cy="130" r="8"/><circle class="point" cx="360" cy="50" r="8"/><text class="gtext" x="202" y="238">(-1, 0) x-intercept</text><text class="gtext" x="332" y="142">(0, 2)</text><text class="gtext" x="372" y="64">(1, 4)</text><text class="gtext" x="545" y="235">x</text><text class="gtext" x="333" y="48">y</text><text class="gtext" x="92" y="82">y = 2x + 2</text></g></svg>';

    add("Launch","Representations of Linear Functions",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Lesson 1.4 · AP Precalculus readiness</p><h1 tabindex="-1">Representations of Linear Functions</h1><p class="lead">Move fluently among equations, tables, graphs, and contexts—and construct the one line that satisfies given conditions or data.</p><button class="cta" type="button" data-go="1">Begin the lesson →</button></div><div class="slope-art">'+graphSvg("cover")+'</div></div>',"cover");
    add("Purpose","Three-period pathway",head("Purpose","What this lesson masters—and defers")+'<p class="lead">This is a three-period prerequisite-mastery sequence.</p><div class="grid"><div class="card tint"><h3>Required mastery</h3><p>Slope-intercept, point-slope, and standard form; intercepts; graphs; tables; equations from conditions or data; and contextual interpretation.</p></div><div class="card gold"><h3>Deliberately deferred</h3><p>Matrix methods and advanced regression diagnostics are outside this lesson. Construction uses exact conditions and clearly linear data.</p></div></div><p class="callout"><strong>Pacing:</strong> three class periods, maximum three.</p>');
    add("Goals","Learning goals",head("Learning outcome","By the end, I can…")+'<div class="law-grid"><article class="law"><strong>Construct</strong>Build a linear function from points, intercepts, a table, or contextual conditions.</article><article class="law"><strong>Translate</strong>Move accurately among equation, table, graph, and context.</article><article class="law"><strong>Interpret</strong>Explain slope and intercepts using correct mathematical and contextual language.</article></div>');
    add("Success","Mastery evidence",head("Success criteria","What counts as secure")+'<div class="grid"><div class="card"><strong class="big">16 / 20</strong><p>on differentiated practice, including every required representation.</p></div><div class="card"><strong class="big">4 forms</strong><p>equation, table, graph, and context linked by consistent values and interpretation.</p></div></div>');
    add("Retrieval","Slope retrieval",head("Prerequisite retrieval","Calculate the constant rate first")+'<div class="grid"><div class="card"><p>Through <span class="math" data-tex="(-2,1)"></span> and <span class="math" data-tex="(4,13)"></span>:</p><p><span class="formula math" data-tex="m=\\frac{13-1}{4-(-2)}=2"></span></p></div><div class="card gold"><p>A line is not determined by slope alone. One point—or equivalent position information—is also required.</p></div></div>');
    add("Retrieval","Substitution retrieval",head("Prerequisite retrieval","A point satisfies an equation")+'<div class="flow"><span><span class="math" data-tex="(3,7)"></span></span><b>→</b><span><span class="math" data-tex="y=2x+1"></span></span><b>→</b><span><span class="math" data-tex="7=2(3)+1"></span></span></div><p class="callout success">A true substitution confirms that the point lies on the line.</p>');
    add("Retrieval","Intercept retrieval",head("Prerequisite retrieval","Intercepts are points, not isolated numbers")+'<div class="grid three"><article class="card"><h3><span class="math" data-tex="x"></span>-intercept</h3><p>Set <span class="math" data-tex="y=0"></span>; report <span class="math" data-tex="(a,0)"></span>.</p></article><article class="card"><h3><span class="math" data-tex="y"></span>-intercept</h3><p>Set <span class="math" data-tex="x=0"></span>; report <span class="math" data-tex="(0,b)"></span>.</p></article><article class="card"><h3>Verification</h3><p>Substitute each point into the equation.</p></article></div>');
    add("Launch","Initial reasoning",head("Student Turn","Which representation is most useful?")+'<div class="question-box"><p class="question-prompt">A line has slope 3 and passes through <span class="math" data-tex="(5,11)"></span>. Which equation form would you choose first, and why?</p><textarea class="scratch" data-save="launch-reasoning" aria-label="Initial representation reasoning"></textarea>'+reveal('Reveal reasoning','<p>Point-slope form uses the known point and slope directly: <span class="math" data-tex="y-11=3(x-5)"></span>. It can then be converted to another form if needed.</p>')+'</div>');

    add("Slope-intercept","Slope-intercept form",section("y = mx + b","Read rate and starting value directly","Use slope-intercept form when the constant rate and vertical intercept are known or easy to identify."));
    add("Slope-intercept","Meaning of parameters",head("Concept","Each parameter controls a visible feature")+'<div class="grid"><div class="card"><p><span class="formula math" data-tex="y=mx+b"></span></p><p><span class="math" data-tex="m"></span> is the slope: output change per input unit.</p><p><span class="math" data-tex="b"></span> gives the point <span class="math" data-tex="(0,b)"></span>.</p></div><div>'+graphSvg("slope-intercept")+'</div></div>');
    add("Slope-intercept","Worked example",head("Worked example","Graph from slope and intercept")+'<div class="step-list"><div class="step">Start with <span class="math" data-tex="y=-\\frac32x+4"></span>.</div><div class="step">Plot the <span class="math" data-tex="y"></span>-intercept <span class="math" data-tex="(0,4)"></span>.</div><div class="step">Use <span class="math" data-tex="-3/2"></span>: move 2 right and 3 down to <span class="math" data-tex="(2,1)"></span>.</div><div class="step">Draw the unique line through the two verified points.</div></div>');
    add("Student Turn","Slope-intercept turn",head("Student Turn","Build a table and graph")+'<div class="question-box"><p class="question-prompt">For <span class="math" data-tex="y=2x-3"></span>, create a three-row table containing <span class="math" data-tex="x=-1,0,2"></span>. Plot those points and label the intercept.</p><textarea class="scratch" data-save="slope-intercept-turn" aria-label="Slope-intercept table and graph work"></textarea>'+reveal('Reveal verified evidence','<p>The points are <span class="math" data-tex="(-1,-5),(0,-3),(2,1)"></span>. The <span class="math" data-tex="y"></span>-intercept is <span class="math" data-tex="(0,-3)"></span>, and each one-unit move right raises output by 2.</p>')+'</div>');
    add("Misconception","Intercept notation",head("Misconception check","The intercept is a coordinate point")+'<div class="grid"><div class="card maroon"><h3>Incomplete</h3><p>“The <span class="math" data-tex="y"></span>-intercept is -3.”</p></div><div class="card tint"><h3>Precise</h3><p>The <span class="math" data-tex="y"></span>-intercept value is -3, so the graph crosses the axis at <span class="math" data-tex="(0,-3)"></span>.</p></div></div>');
    add("Checkpoint","Slope-intercept evidence",head("Checkpoint","Recover the equation from two features")+'<div class="question-box"><p class="question-prompt">A line has slope <span class="math" data-tex="-4"></span> and <span class="math" data-tex="y"></span>-intercept <span class="math" data-tex="(0,7)"></span>. Write its equation and one additional point.</p><textarea class="scratch" data-save="slope-intercept-check" aria-label="Slope-intercept checkpoint"></textarea>'+reveal('Reveal solution','<p><span class="math" data-tex="y=-4x+7"></span>. For example, when <span class="math" data-tex="x=1"></span>, <span class="math" data-tex="y=3"></span>, so <span class="math" data-tex="(1,3)"></span> is on the line.</p>')+'</div>');

    add("Point-slope","Point-slope form",section("y-y₁=m(x-x₁)","Use one point and the slope directly","Point-slope form preserves the known conditions visibly and reduces unnecessary arithmetic at the start."));
    add("Point-slope","Structure of the form",head("Concept","Match coordinates to their variables")+'<div class="grid"><div class="card"><p><span class="formula math" data-tex="y-y_1=m(x-x_1)"></span></p><p>Use <span class="math" data-tex="x_1"></span> inside the <span class="math" data-tex="x"></span> parentheses and <span class="math" data-tex="y_1"></span> beside <span class="math" data-tex="y"></span>.</p></div><div class="card gold"><p>For point <span class="math" data-tex="(-3,5)"></span>, the form contains <span class="math" data-tex="x-(-3)=x+3"></span> and <span class="math" data-tex="y-5"></span>.</p></div></div>');
    add("Point-slope","Worked example",head("Worked example","Construct a line from two points")+'<div class="step-list"><div class="step">Use <span class="math" data-tex="(-1,6)"></span> and <span class="math" data-tex="(3,-2)"></span>.</div><div class="step"><span class="math" data-tex="m=(-2-6)/(3-(-1))=-8/4=-2"></span>.</div><div class="step">Using <span class="math" data-tex="(-1,6)"></span>: <span class="math" data-tex="y-6=-2(x+1)"></span>.</div><div class="step">Convert if useful: <span class="math" data-tex="y=-2x+4"></span>.</div><div class="step">Substitute both original points to verify.</div></div>');
    add("Student Turn","Point-slope turn",head("Student Turn","Write, convert, and verify")+'<div class="question-box"><p class="question-prompt">Construct the line through <span class="math" data-tex="(4,-3)"></span> with slope <span class="math" data-tex="5/2"></span>. Write point-slope and slope-intercept forms, then verify the given point.</p><textarea class="scratch" data-save="point-slope-turn" aria-label="Point-slope conversion work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="y+3=\\frac52(x-4)"></span>, so <span class="math" data-tex="y=\\frac52x-13"></span>. At <span class="math" data-tex="x=4"></span>, the formula gives <span class="math" data-tex="y=10-13=-3"></span>.</p>')+'</div>');
    add("Misconception","Negative coordinates",head("Misconception check","Subtract the coordinate exactly as written")+'<div class="grid"><div class="card maroon"><p>Through <span class="math" data-tex="(-2,7)"></span>, writing <span class="math" data-tex="x-2"></span> changes the point.</p></div><div class="card tint"><p>Correct structure: <span class="math" data-tex="y-7=m(x-(-2))=m(x+2)"></span>.</p></div></div>');
    add("Checkpoint","Point-slope evidence",head("Checkpoint","Two equivalent forms describe one line")+'<div class="question-box"><p class="question-prompt">Show that <span class="math" data-tex="y+1=3(x-2)"></span> and <span class="math" data-tex="y=3x-7"></span> are equivalent. Name the visible point in the first form.</p><textarea class="scratch" data-save="point-slope-check" aria-label="Equivalent forms checkpoint"></textarea>'+reveal('Reveal solution','<p>Distribute: <span class="math" data-tex="y+1=3x-6\\Rightarrow y=3x-7"></span>. The point-slope form shows the point <span class="math" data-tex="(2,-1)"></span>.</p>')+'</div>');

    add("Standard form","Standard form and intercepts",section("Ax + By = C","Expose both axis crossings efficiently","Standard form is especially useful when intercepts are integral and a graph can be anchored by two exact axis points."));
    add("Standard form","Intercept method",head("Concept","Set one coordinate to zero at a time")+'<div class="grid"><div class="card"><p><span class="formula math" data-tex="Ax+By=C"></span></p><p><span class="math" data-tex="y=0\\Rightarrow x=C/A"></span> gives the <span class="math" data-tex="x"></span>-intercept.</p><p><span class="math" data-tex="x=0\\Rightarrow y=C/B"></span> gives the <span class="math" data-tex="y"></span>-intercept.</p></div><div class="card gold"><p>When <span class="math" data-tex="A,B\\ne0"></span>, the two intercepts determine the line.</p></div></div>');
    add("Standard form","Worked example",head("Worked example","Graph a line using intercepts")+'<div class="step-list"><div class="step">Start with <span class="math" data-tex="2x+3y=12"></span>.</div><div class="step">Set <span class="math" data-tex="y=0"></span>: <span class="math" data-tex="2x=12\\Rightarrow(6,0)"></span>.</div><div class="step">Set <span class="math" data-tex="x=0"></span>: <span class="math" data-tex="3y=12\\Rightarrow(0,4)"></span>.</div><div class="step">Plot and connect the two labeled points.</div><div class="step">Check: both substitutions make the equation true.</div></div>');
    add("Student Turn","Standard-form turn",head("Student Turn","Use intercepts, then convert")+'<div class="question-box"><p class="question-prompt">For <span class="math" data-tex="4x-5y=20"></span>, find both intercepts, sketch the line, and rewrite the equation in slope-intercept form.</p><textarea class="scratch" data-save="standard-turn" aria-label="Standard form and intercept work"></textarea>'+reveal('Reveal verified evidence','<p>The intercepts are <span class="math" data-tex="(5,0)"></span> and <span class="math" data-tex="(0,-4)"></span>. Solving for <span class="math" data-tex="y"></span> gives <span class="math" data-tex="y=\\frac45x-4"></span>.</p>')+'</div>');
    add("Misconception","Intercept method",head("Misconception check","Do not set the same variable to zero twice")+'<div class="grid"><div class="card maroon"><p>Setting <span class="math" data-tex="x=0"></span> finds only the <span class="math" data-tex="y"></span>-axis crossing.</p></div><div class="card tint"><p>Use <span class="math" data-tex="y=0"></span> for the <span class="math" data-tex="x"></span>-intercept and <span class="math" data-tex="x=0"></span> for the <span class="math" data-tex="y"></span>-intercept.</p></div></div>');
    add("Checkpoint","Standard-form evidence",head("Checkpoint","Construct standard form from intercepts")+'<div class="question-box"><p class="question-prompt">A line crosses the axes at <span class="math" data-tex="(3,0)"></span> and <span class="math" data-tex="(0,6)"></span>. Write a standard-form equation with integer coefficients.</p><textarea class="scratch" data-save="standard-check" aria-label="Standard form construction checkpoint"></textarea>'+reveal('Reveal solution','<p><span class="math" data-tex="x/3+y/6=1"></span>. Multiply by 6: <span class="math" data-tex="2x+y=6"></span>. Both intercepts satisfy it.</p>')+'</div>');

    add("Translation","Tables, graphs, and equations",section("same line","Preserve points, rate, and intercepts","A correct translation changes the display but never changes which ordered pairs satisfy the function."));
    add("Translation","Representation invariants",head("Concept","Track evidence that must remain unchanged")+'<div class="law-grid"><article class="law"><strong>Points</strong>Every table row appears on the graph and satisfies the equation.</article><article class="law"><strong>Slope</strong>The table ratio, graph rise/run, and equation coefficient agree.</article><article class="law"><strong>Intercept</strong>The row with <span class="math" data-tex="x=0"></span> matches the graph and formula.</article></div>');
    add("Translation","Worked example",head("Worked example","Move table → equation → graph")+'<div class="grid"><div class="table-wrap"><table class="data-table"><caption>Values for one linear function</caption><thead><tr><th scope="col">x</th><th scope="col">-2</th><th scope="col">0</th><th scope="col">3</th></tr></thead><tbody><tr><th scope="row">y</th><td>-1</td><td>3</td><td>9</td></tr></tbody></table></div><div class="step-list"><div class="step"><span class="math" data-tex="m=(3-(-1))/(0-(-2))=2"></span>.</div><div class="step"><span class="math" data-tex="b=3"></span> from <span class="math" data-tex="(0,3)"></span>.</div><div class="step"><span class="math" data-tex="y=2x+3"></span>.</div><div class="step">Plot the three table points and connect them.</div></div></div>');
    add("Student Turn","Translation turn",head("Student Turn","Complete all three representations")+'<div class="question-box"><p class="question-prompt">The graph of a line contains <span class="math" data-tex="(-1,5)"></span> and <span class="math" data-tex="(3,-3)"></span>. Write an equation and a table with two additional points.</p><textarea class="scratch" data-save="translation-turn" aria-label="Representation translation work"></textarea>'+reveal('Reveal verified evidence','<p><span class="math" data-tex="m=(-3-5)/(3-(-1))=-2"></span>, so <span class="math" data-tex="y=-2x+3"></span>. Two additional valid rows are <span class="math" data-tex="(0,3)"></span> and <span class="math" data-tex="(2,-1)"></span>.</p>')+'</div>');
    add("Misconception","Table spacing",head("Misconception check","Unequal input steps need unequal output changes")+'<div class="grid"><div class="card maroon"><p>Adding the same output difference when input steps are 2 and 5 does not preserve a constant rate.</p></div><div class="card tint"><p>Multiply each input change by the slope: <span class="math" data-tex="\\Delta y=m\\Delta x"></span>.</p></div></div>');
    add("Checkpoint","Translation evidence",head("Checkpoint","Audit a proposed conversion")+'<div class="question-box"><p class="question-prompt">A student claims <span class="math" data-tex="(0,4),(2,10),(5,19)"></span> represents <span class="math" data-tex="y=3x+4"></span>. Verify the claim in two ways.</p><textarea class="scratch" data-save="translation-check" aria-label="Conversion audit checkpoint"></textarea>'+reveal('Reveal solution','<p>Table ratios are <span class="math" data-tex="6/2=3"></span> and <span class="math" data-tex="9/3=3"></span>. Substitution gives <span class="math" data-tex="4=3(0)+4"></span>, <span class="math" data-tex="10=3(2)+4"></span>, and <span class="math" data-tex="19=3(5)+4"></span>.</p>')+'</div>');

    add("Construction","Conditions, data, and context",section("conditions → model","Construct the unique line and interpret it","Identify the two independent conditions, choose an efficient form, verify the evidence, and communicate what the parameters mean."));
    add("Construction","Construction decision",head("Concept","Choose the form that matches the evidence")+'<div class="law-grid"><article class="law"><strong>Slope + intercept</strong>Start with <span class="math" data-tex="y=mx+b"></span>.</article><article class="law"><strong>Slope + point</strong>Start with <span class="math" data-tex="y-y_1=m(x-x_1)"></span>.</article><article class="law"><strong>Two points</strong>Calculate slope, then use either form.</article></div><p class="callout warning"><strong>Boundary:</strong> matrices and advanced regression diagnostics are not used here.</p>');
    add("Construction","Worked example",head("Worked example","Construct and interpret a contextual model")+'<div class="step-list"><div class="step">A reservoir contains 460 L at minute 2 and 700 L at minute 8.</div><div class="step"><span class="math" data-tex="m=(700-460)/(8-2)=40\\text{ L/min}"></span>.</div><div class="step"><span class="math" data-tex="V-460=40(t-2)"></span>.</div><div class="step"><span class="math" data-tex="V=40t+380"></span>.</div><div class="step">The model estimates 380 L initially and a gain of 40 L per minute.</div><div class="step">Check: <span class="math" data-tex="V(8)=40(8)+380=700"></span>.</div></div>');
    add("Student Turn","Construction turn",head("Student Turn","Build a line from two conditions")+'<div class="question-box"><p class="question-prompt">A linear subscription costs 74 QAR after 4 months and 134 QAR after 10 months. Construct a model <span class="math" data-tex="C(t)"></span>, interpret both parameters, and predict the 12-month cost.</p><textarea class="scratch" data-save="construction-turn" aria-label="Contextual linear model work"></textarea>'+reveal('Reveal verified reasoning','<p><span class="math" data-tex="m=(134-74)/(10-4)=10\\text{ QAR/month}"></span>. Then <span class="math" data-tex="74=10(4)+b\\Rightarrow b=34"></span>. Thus <span class="math" data-tex="C(t)=10t+34"></span>: a 34 QAR initial fee plus 10 QAR per month, and <span class="math" data-tex="C(12)=154\\text{ QAR}"></span>.</p>')+'</div>');
    add("Misconception","Context origin",head("Misconception check","A first observed value is not always the initial value")+'<div class="grid"><div class="card maroon"><p>If the first observation occurs at <span class="math" data-tex="t=4"></span>, its output is not automatically the intercept.</p></div><div class="card tint"><p>The initial value is the predicted output at <span class="math" data-tex="t=0"></span>, found by solving for <span class="math" data-tex="b"></span>.</p></div></div>');
    add("Checkpoint","Representation synthesis",head("Checkpoint","One function, four connected representations")+'<div class="flow"><span>conditions or data</span><b>→</b><span>equation</span><b>↔</b><span>table</span><b>↔</b><span>graph</span><b>↔</b><span>context</span></div><p class="callout success">Every translation must preserve the same points, constant rate, and intercept meaning.</p>');

    practice.forEach(q=>add("Practice",q.id+" · "+q.level,head("Differentiated practice",q.id+" · "+q.level)+qCard(q)));
    add("Mastery","Practice evidence",head("Mastery evidence","Score the differentiated set")+'<div class="grid"><div class="card"><button class="check-button" id="scoreBtn" type="button">Score all 20 responses</button><p class="lead" id="scoreSummary" aria-live="polite">Complete the set, then score your evidence.</p></div><div class="mastery"><div><strong data-level-score="Easy">—</strong>Easy / 4</div><div><strong data-level-score="Medium">—</strong>Medium / 6</div><div><strong data-level-score="Hard">—</strong>Hard / 6</div><div><strong data-level-score="Challenge">—</strong>Challenge / 4</div><div><strong id="totalScore">—</strong>Total / 20</div></div></div>');
    add("Error analysis","Correct an invalid conversion",head("Error analysis","Find the first invalid line")+'<div class="grid"><div class="card"><p>Given <span class="math" data-tex="y-5=-2(x-3)"></span>:</p><p><span class="math" data-tex="y-5=-2x-6"></span></p><p><span class="math" data-tex="y=-2x-1"></span></p><p>Claimed point: <span class="math" data-tex="(3,5)"></span></p><label for="errorAnalysis"><strong>Identify and correct the first invalid line, then verify the point.</strong></label><textarea class="scratch" id="errorAnalysis" data-save="error-analysis"></textarea></div><div class="card gold"><h3>Verified correction</h3>'+reveal('Reveal correction','<p>Distribution is invalid: <span class="math" data-tex="-2(x-3)=-2x+6"></span>. Thus <span class="math" data-tex="y-5=-2x+6\\Rightarrow y=-2x+11"></span>. At <span class="math" data-tex="x=3"></span>, <span class="math" data-tex="y=5"></span>.</p>')+'</div></div>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","Representation fluency supports function reasoning")+'<div class="grid three"><article class="card"><h3>Choose a form</h3><p>Match equation structure to the evidence given.</p></article><article class="card"><h3>Preserve meaning</h3><p>Track the same points, rate, and intercept across representations.</p></article><article class="card"><h3>Justify briefly</h3><p>Verify conditions by substitution or equivalent graphical evidence.</p></article></div><p class="callout success"><strong>Transfer:</strong> AP Precalculus repeatedly asks students to select, connect, and defend useful function representations; this lesson secures the linear prerequisite.</p>');
    add("Exit ticket","Exit ticket",head("Exit ticket","Produce final mastery evidence")+'<div class="question-box"><ol><li>Write the line through <span class="math" data-tex="(-2,7)"></span> with slope <span class="math" data-tex="3"></span> in point-slope and slope-intercept forms.</li><li>Find and label both intercepts of <span class="math" data-tex="2x-5y=20"></span>.</li><li>Construct the equation for the table <span class="math" data-tex="(-1,8),(2,2),(5,-4)"></span>.</li><li>A service costs 68 QAR at month 3 and 128 QAR at month 8. Construct and interpret a linear model.</li></ol><textarea class="scratch" data-save="exit-ticket" aria-label="Exit ticket work"></textarea>'+reveal('Reveal exit-ticket key','<ol><li><span class="math" data-tex="y-7=3(x+2)"></span> and <span class="math" data-tex="y=3x+13"></span>.</li><li><span class="math" data-tex="(10,0)"></span> and <span class="math" data-tex="(0,-4)"></span>.</li><li><span class="math" data-tex="m=-6/3=-2"></span> and <span class="math" data-tex="y=-2x+6"></span>.</li><li><span class="math" data-tex="m=(128-68)/(8-3)=12\\text{ QAR/month}"></span>; <span class="math" data-tex="C(t)=12t+32"></span>. The initial fee is 32 QAR and the monthly increase is 12 QAR.</li></ol>')+'</div>');
    add("Reflect","Mastery reflection",head("Reflect","Select the next instructional move")+'<div class="grid"><div class="card tint"><h3>Ready to advance</h3><p>At least 16/20, accurate conversions, verified equations, labeled intercept points, and complete contextual interpretations.</p></div><div class="card gold"><h3>Targeted review</h3><p>Return to the specific form or translation that evidence identifies, then solve a parallel task without scaffolding.</p></div></div><label for="reflection"><h3>My evidence and next action</h3></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea>');
    add("Complete","Linear representations secured",head("Complete","Lesson 1.4 mastery package")+'<div class="grid"><div class="card"><h3>Evidence to retain</h3><ul><li>Differentiated practice score</li><li>One corrected conversion error</li><li>Exit-ticket representations and model</li><li>Personal next action</li></ul><button class="secondary" id="exportFinal" type="button">Export lesson work</button></div><div class="card maroon"><h3>Next lesson</h3><p><strong>1.5 Linear Inequalities</strong></p><p>Solve and represent one-variable and compound inequalities using graphs and interval notation.</p><a class="cta" href="../../lesson.html?grade=9&amp;path=common&amp;lesson=1.5">View next lesson preview</a></div></div>');

    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map((s,i)=>'<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==='cover'?'cover':'')+'">'+s.body+'</div></section>').join('');
    const slideEls=[...document.querySelectorAll(".slide")];
    let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",''))-1||0));
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function load(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}
    const state=load();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root=document){root.querySelectorAll('.math').forEach(el=>{if(window.katex){try{window.katex.render(el.dataset.tex||'',el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"]').forEach(input=>{if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>checkOne(b.dataset.check)));document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",()=>{state.fields.notebook=n.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(x=>x.id===id),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the form, conditions, and verification.":"Not yet. Recheck the given conditions, form structure, and substitution evidence.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(level=>{const qs=practice.filter(q=>q.level===level),n=qs.filter(q=>state.answers[q.id]===q.answer).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit ticket.":"Use the level pattern to select a targeted review block.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 1.4 Representations of Linear Functions","Exported: "+new Date().toLocaleString(),""];practice.forEach(q=>{lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_1.4_Representations_of_Linear_Functions.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());document.documentElement.dataset.lessonReady="true";
  })();
  </script>

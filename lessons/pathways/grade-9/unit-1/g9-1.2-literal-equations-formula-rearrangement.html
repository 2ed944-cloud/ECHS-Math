  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-1.2-literal-equations-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Given <span class="math" data-tex="A=lw"></span>, solve for <span class="math" data-tex="w"></span>.',options:["Al","A/l","l/A","A-l"],answer:1,solution:'Divide both sides by <span class="math" data-tex="l"></span>: <span class="math" data-tex="w=A/l"></span>, where <span class="math" data-tex="l\\ne0"></span>.'},
      {id:"E2",level:"Easy",calc:false,prompt:'Given <span class="math" data-tex="d=rt"></span>, solve for <span class="math" data-tex="t"></span>.',options:["r/d","d-r","d/r","dr"],answer:2,solution:'Divide by the rate: <span class="math" data-tex="t=d/r"></span>, where <span class="math" data-tex="r\\ne0"></span>.'},
      {id:"E3",level:"Easy",calc:false,prompt:'Given <span class="math" data-tex="P=2l+2w"></span>, solve for <span class="math" data-tex="l"></span>.',options:["(P-2w)/2","P/2+2w","P-2w","(P+2w)/2"],answer:0,solution:'Subtract <span class="math" data-tex="2w"></span>, then divide by 2: <span class="math" data-tex="l=(P-2w)/2"></span>.'},
      {id:"E4",level:"Easy",calc:false,prompt:'Given <span class="math" data-tex="C=\\frac59(F-32)"></span>, solve for <span class="math" data-tex="F"></span>.',options:["5C/9-32","9C/5-32","5C/9+32","9C/5+32"],answer:3,solution:'Multiply by <span class="math" data-tex="9/5"></span>, then add 32: <span class="math" data-tex="F=9C/5+32"></span>.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Given <span class="math" data-tex="y=mx+b"></span>, solve for <span class="math" data-tex="m"></span>.',options:["(y+b)/x","(y-b)/x","x(y-b)","y/(x-b)"],answer:1,solution:'Subtract <span class="math" data-tex="b"></span> and divide by <span class="math" data-tex="x"></span>: <span class="math" data-tex="m=(y-b)/x"></span>, <span class="math" data-tex="x\\ne0"></span>.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Given <span class="math" data-tex="A=\\frac12bh"></span>, solve for <span class="math" data-tex="h"></span>.',options:["A/(2b)","b/(2A)","2A/b","2Ab"],answer:2,solution:'Multiply by 2 and divide by <span class="math" data-tex="b"></span>: <span class="math" data-tex="h=2A/b"></span>.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Given <span class="math" data-tex="V=\\pi r^2h"></span>, solve for <span class="math" data-tex="h"></span>.',options:["V/(\\pi r^2)","V/(2\\pi r)","\\pi r^2/V","V-\\pi r^2"],answer:0,solution:'The entire coefficient of <span class="math" data-tex="h"></span> is <span class="math" data-tex="\\pi r^2"></span>, so <span class="math" data-tex="h=V/(\\pi r^2)"></span>.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Given <span class="math" data-tex="I=Prt"></span>, solve for <span class="math" data-tex="r"></span>.',options:["IPt","Pt/I","I-Pt","I/(Pt)"],answer:3,solution:'Divide by the product <span class="math" data-tex="Pt"></span>: <span class="math" data-tex="r=I/(Pt)"></span>.'},
      {id:"M5",level:"Medium",calc:false,prompt:'A rectangle has <span class="math" data-tex="P=50\\text{ cm}"></span> and <span class="math" data-tex="w=9\\text{ cm}"></span>. Use <span class="math" data-tex="P=2l+2w"></span> to find <span class="math" data-tex="l"></span>.',options:["8 cm","14 cm","16 cm","32 cm"],answer:2,solution:'<span class="math" data-tex="50=2l+18\\Rightarrow32=2l\\Rightarrow l=16\\text{ cm}"></span>.'},
      {id:"M6",level:"Medium",calc:false,prompt:'Use <span class="math" data-tex="F=ma"></span>. If <span class="math" data-tex="F=84\\text{ N}"></span> and <span class="math" data-tex="a=7\\text{ m/s}^2"></span>, find <span class="math" data-tex="m"></span>.',options:["7 kg","12 kg","77 kg","588 kg"],answer:1,solution:'<span class="math" data-tex="m=F/a=84/7=12\\text{ kg}"></span>. The units reduce because <span class="math" data-tex="1\\text{ N}=1\\text{ kg}\\cdot\\text{m/s}^2"></span>.'},
      {id:"H1",level:"Hard",calc:false,prompt:'Given <span class="math" data-tex="ax+b=c"></span>, solve for <span class="math" data-tex="x"></span>.',options:["(c-b)/a","(c+b)/a","a(c-b)","c/(a+b)"],answer:0,solution:'Subtract <span class="math" data-tex="b"></span>, then divide by <span class="math" data-tex="a"></span>: <span class="math" data-tex="x=(c-b)/a"></span>, <span class="math" data-tex="a\\ne0"></span>.'},
      {id:"H2",level:"Hard",calc:false,prompt:'Given <span class="math" data-tex="A=\\frac12h(b_1+b_2)"></span>, solve for <span class="math" data-tex="b_2"></span>.',options:["2A-hb₁","2A/(h-b₁)","A/(2h)-b₁","2A/h-b₁"],answer:3,solution:'Multiply by <span class="math" data-tex="2/h"></span>: <span class="math" data-tex="2A/h=b_1+b_2"></span>. Then <span class="math" data-tex="b_2=2A/h-b_1"></span>.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Given <span class="math" data-tex="v=u+at"></span>, solve for <span class="math" data-tex="a"></span>.',options:["(u-v)/t","t(v-u)","(v-u)/t","v-u-t"],answer:2,solution:'<span class="math" data-tex="v-u=at\\Rightarrow a=(v-u)/t"></span>, where <span class="math" data-tex="t\\ne0"></span>.'},
      {id:"H4",level:"Hard",calc:false,prompt:'Given <span class="math" data-tex="R=R_0(1+\\alpha\\Delta T)"></span>, solve for <span class="math" data-tex="\\alpha"></span>.',options:["(R-R₀)/ΔT","(R-R₀)/(R₀ΔT)","R/(R₀+ΔT)","R₀ΔT/(R-R₀)"],answer:1,solution:'Divide by <span class="math" data-tex="R_0"></span>, subtract 1, and divide by <span class="math" data-tex="\\Delta T"></span>: <span class="math" data-tex="\\alpha=(R-R_0)/(R_0\\Delta T)"></span>.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Given <span class="math" data-tex="S=\\frac n2(a_1+a_k)"></span>, solve for <span class="math" data-tex="a_k"></span>.',options:["2S/n-a₁","2S/(n-a₁)","nS/2-a₁","2S-na₁"],answer:0,solution:'Multiply by <span class="math" data-tex="2/n"></span>: <span class="math" data-tex="2S/n=a_1+a_k"></span>. Thus <span class="math" data-tex="a_k=2S/n-a_1"></span>.'},
      {id:"H6",level:"Hard",calc:false,prompt:'Given <span class="math" data-tex="Q=mc\\Delta T"></span>, solve for <span class="math" data-tex="\\Delta T"></span>.',options:["Qm/c","mc/Q","Q/(mc)","Q-mc"],answer:2,solution:'Divide by the complete coefficient <span class="math" data-tex="mc"></span>: <span class="math" data-tex="\\Delta T=Q/(mc)"></span>.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'Given <span class="math" data-tex="S=2\\pi r^2+2\\pi rh"></span>, solve for <span class="math" data-tex="h"></span>.',options:["(S-2πr)/(2πr²)","S/(2πr)-r²","(S+2πr²)/(2πr)","(S-2πr²)/(2πr)"],answer:3,solution:'Subtract <span class="math" data-tex="2\\pi r^2"></span>, then divide by <span class="math" data-tex="2\\pi r"></span>: <span class="math" data-tex="h=(S-2\\pi r^2)/(2\\pi r)"></span>.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'Given <span class="math" data-tex="\\frac1f=\\frac1{d_o}+\\frac1{d_i}"></span>, solve for <span class="math" data-tex="d_i"></span>.',options:["f+dₒ","fdₒ/(dₒ-f)","(dₒ-f)/(fdₒ)","fdₒ/(f-dₒ)"],answer:1,solution:'<span class="math" data-tex="1/d_i=1/f-1/d_o=(d_o-f)/(fd_o)"></span>, so <span class="math" data-tex="d_i=fd_o/(d_o-f)"></span>.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'Given <span class="math" data-tex="m=\\frac{y_2-y_1}{x_2-x_1}"></span>, solve for <span class="math" data-tex="y_2"></span>.',options:["m/(x₂-x₁)+y₁","m(x₂+x₁)-y₁","m(x₂-x₁)+y₁","m(x₂-x₁)-y₁"],answer:2,solution:'Multiply by <span class="math" data-tex="x_2-x_1"></span>, then add <span class="math" data-tex="y_1"></span>: <span class="math" data-tex="y_2=m(x_2-x_1)+y_1"></span>.'},
      {id:"C4",level:"Challenge",calc:true,prompt:'Given <span class="math" data-tex="A=P(1+rt)"></span>, solve for <span class="math" data-tex="t"></span>.',options:["(A-P)/r","(A+P)/(Pr)","(A-P)/(Pr)","A/(P+r)"],answer:2,solution:'Divide by <span class="math" data-tex="P"></span>, subtract 1, and divide by <span class="math" data-tex="r"></span>: <span class="math" data-tex="t=(A/P-1)/r=(A-P)/(Pr)"></span>.'}
    ];
    const slides=[];
    const add=(stage,title,body,cls="")=>slides.push({stage,title,body,cls});

    const qCard=q=>'<div class="question-layout"><div class="question-box"><div><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?'calc':'')+'">'+(q.calc?'Calculator permitted':'No calculator')+'</span></div><p class="question-prompt">'+q.prompt+'</p><fieldset class="choices"><legend class="eyebrow">Choose one response</legend>'+q.options.map((o,i)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span><b>'+String.fromCharCode(65+i)+'.</b> '+o+'</span></label>').join('')+'</fieldset><button class="check-button" type="button" data-check="'+q.id+'">Check response</button><p class="feedback" id="feedback-'+q.id+'" aria-live="polite"></p>'+reveal('Reveal verified answer and steps','<p><strong>Correct answer: '+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]+'</strong></p><p>'+q.solution+'</p>')+'</div><aside class="side-note"><label for="work-'+q.id+'"><strong>Rearrangement / unit evidence</strong></label><textarea class="scratch" id="work-'+q.id+'" data-save="work-'+q.id+'"></textarea><p>State the inverse operation and any required nonzero condition.</p></aside></div>';

    add("Launch","Literal Equations & Formula Rearrangement",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Lesson 1.2 · AP Precalculus readiness</p><h1 tabindex="-1">Literal Equations &amp; Formula Rearrangement</h1><p class="lead">Make any meaningful quantity the subject of a formula—then use units, substitution, and interpretation to verify the result.</p><button class="cta" type="button" data-go="1">Begin the lesson →</button></div><div class="formula-art"><div><span class="math" data-tex="P=2l+2w"></span><small>solve for the quantity you need</small></div></div></div>',"cover");
    add("Purpose","Why this lesson matters",head("Pathway purpose","A formula is a relationship, not a fixed command")+'<div class="grid three"><article class="card"><h3>Choose the subject</h3><p>Rearrange a familiar relationship so the required quantity stands alone.</p></article><article class="card tint"><h3>Preserve meaning</h3><p>Equivalent formulas describe the same relationship from different viewpoints.</p></article><article class="card gold"><h3>Verify with units</h3><p>Units and substitution expose many algebraic errors before they travel into a model.</p></article></div>');
    add("Goals","Learning outcomes and boundary",head("Learning outcomes","Two-period prerequisite-mastery sequence")+'<div class="grid"><div class="card"><h3>By the end, you can</h3><ul><li>rearrange multi-step formulas, including fractions;</li><li>substitute values with units after rearranging;</li><li>interpret the meaning of the solved-for quantity;</li><li>check algebraically and dimensionally.</li></ul></div><div class="card maroon"><h3>Approved coverage boundary</h3><p><strong>Target and maximum pacing:</strong> two periods.</p><p>Advanced dimensional-analysis courses and formulas involving new transcendental functions are deferred.</p></div></div>');
    add("Retrieval","Prerequisite retrieval",head("Prerequisite retrieval","Equality-preserving moves from Lesson 1.1")+'<div class="law-grid"><article class="law"><strong>Undo addition</strong><span class="math" data-tex="x+a=b\\Rightarrow x=b-a"></span></article><article class="law"><strong>Undo multiplication</strong><span class="math" data-tex="ax=b\\Rightarrow x=b/a"></span></article><article class="law"><strong>Treat groups as one factor</strong><span class="math" data-tex="abx=c\\Rightarrow x=c/(ab)"></span></article></div>'+reveal('Reveal retrieval check','<p>Every step must apply the same operation to both sides. A symbolic coefficient behaves like a numerical coefficient.</p>'));
    add("Language","Target variable and subject",head("Concept language","Name the target before touching the algebra")+'<div class="flow"><span>Given formula</span><b>→</b><span>Target variable</span><b>→</b><span>Inverse operations</span><b>→</b><span>Equivalent solved form</span></div><p class="callout"><strong>Example:</strong> in <span class="math" data-tex="d=rt"></span>, solving for <span class="math" data-tex="t"></span> means producing <span class="math" data-tex="t=\\cdots"></span>, not evaluating a number yet.</p>');
    add("Meaning","Equivalent forms preserve the relationship",head("Core principle","Changing form does not change truth")+'<div class="grid"><div class="card"><p><span class="math" data-tex="A=lw"></span></p><p>Area is length times width.</p></div><div class="card tint"><p><span class="math" data-tex="w=A/l"></span>, <span class="math" data-tex="l\\ne0"></span></p><p>Width is area divided by length.</p></div></div><p class="callout success">Both formulas generate the same valid triples <span class="math" data-tex="(A,l,w)"></span>.</p>');
    add("Units","Units are algebraic evidence",head("Verification habit","Track the quantity type")+'<div class="grid three"><article class="card"><h3><span class="math" data-tex="d=rt"></span></h3><p><span class="math" data-tex="\\text{km}=(\\text{km/h})(\\text{h})"></span></p></article><article class="card"><h3><span class="math" data-tex="t=d/r"></span></h3><p><span class="math" data-tex="\\text{h}=\\text{km}/(\\text{km/h})"></span></p></article><article class="card gold"><h3>Reasonableness</h3><p>If a time formula produces kilometres, the rearrangement or substitution is wrong.</p></article></div>');
    add("Plan","Lesson sequence",head("Two-period plan","Build, apply, verify, transfer")+'<div class="grid"><div class="card"><h3>Period 1</h3><ol><li>Isolate a target variable.</li><li>Rearrange multi-step and grouped formulas.</li><li>Work with fractional formulas.</li></ol></div><div class="card tint"><h3>Period 2</h3><ol><li>Substitute with units.</li><li>Test dimensional reasonableness.</li><li>Complete differentiated practice and mastery evidence.</li></ol></div></div>');

    add("Isolation","Isolate one factor",section("A=lw","Isolate one factor","A symbolic formula follows the same equality rules as a numerical equation. Identify the full coefficient multiplying the target."));
    add("Isolation","Inverse-operation map",head("Concept","Undo the operation attached to the target")+'<div class="flow"><span><span class="math" data-tex="A=lw"></span></span><b>÷ <span class="math" data-tex="l"></span></b><span><span class="math" data-tex="A/l=w"></span></span><b>→</b><span><span class="math" data-tex="w=A/l"></span></span></div><p class="callout warning">The restriction <span class="math" data-tex="l\\ne0"></span> is required because division by zero is undefined.</p>');
    add("Isolation","Worked example",head("Worked example","Solve the rectangle area formula for width")+'<div class="grid"><div><svg class="diagram" viewBox="0 0 520 260" role="img" aria-label="Rectangle with length l, width w, and area A"><rect class="d-shape" x="95" y="45" width="330" height="165" rx="8"/><text class="d-text" x="250" y="135">A = lw</text><text class="d-text" x="250" y="240">l</text><text class="d-text" x="45" y="135">w</text></svg></div><div class="step-list"><div class="step">Start: <span class="math" data-tex="A=lw"></span>.</div><div class="step">Divide both sides by <span class="math" data-tex="l"></span>.</div><div class="step"><span class="math" data-tex="A/l=w"></span>.</div><div class="step">Write the target first: <span class="math" data-tex="w=A/l"></span>.</div></div></div>');
    add("Student Turn","Isolation turn",head("Student Turn","Solve a rate formula for time")+'<div class="question-box"><p class="question-prompt">Rearrange <span class="math" data-tex="d=rt"></span> to make <span class="math" data-tex="t"></span> the subject. State the restriction and explain the units.</p><textarea class="scratch" data-save="isolation-turn" aria-label="Isolation student work"></textarea>'+reveal('Reveal verified reasoning','<p>Divide by <span class="math" data-tex="r"></span>: <span class="math" data-tex="t=d/r"></span>, where <span class="math" data-tex="r\\ne0"></span>. Distance divided by distance per time gives time.</p>')+'</div>');
    add("Misconception","Isolation misconception",head("Misconception check","Do not divide only one term or one symbol")+'<div class="grid"><div class="card maroon"><h3>Invalid</h3><p><span class="math" data-tex="A=lw\\Rightarrow w=A-l"></span></p><p>Subtraction does not undo multiplication.</p></div><div class="card tint"><h3>Valid</h3><p><span class="math" data-tex="A/l=w"></span></p><p>Division by the complete coefficient <span class="math" data-tex="l"></span> isolates <span class="math" data-tex="w"></span>.</p></div></div>');
    add("Checkpoint","Isolation evidence",head("Checkpoint","Verify by reversing the rearrangement")+'<div class="card gold"><p>From <span class="math" data-tex="w=A/l"></span>, multiply by <span class="math" data-tex="l"></span>: <span class="math" data-tex="lw=A"></span>, equivalent to <span class="math" data-tex="A=lw"></span>. The reverse move recovers the original formula.</p></div>');

    add("Multi-step","Multi-step formulas",section("P=2l+2w","Remove non-target terms before dividing","When the target is inside a sum, first move every other term away; then divide by its complete coefficient."));
    add("Multi-step","Order of inverse operations",head("Concept","Work from the outside toward the target")+'<div class="step-list"><div class="step"><span class="math" data-tex="P=2l+2w"></span>; target <span class="math" data-tex="w"></span>.</div><div class="step">Subtract <span class="math" data-tex="2l"></span>: <span class="math" data-tex="P-2l=2w"></span>.</div><div class="step">Divide every term by 2: <span class="math" data-tex="(P-2l)/2=w"></span>.</div><div class="step"><span class="math" data-tex="w=P/2-l"></span> is an equivalent simplified form.</div></div>');
    add("Multi-step","Worked example",head("Worked example","Solve slope-intercept form for the slope")+'<div class="step-list"><div class="step">Start with <span class="math" data-tex="y=mx+b"></span>; target <span class="math" data-tex="m"></span>.</div><div class="step">Subtract <span class="math" data-tex="b"></span>: <span class="math" data-tex="y-b=mx"></span>.</div><div class="step">Divide by <span class="math" data-tex="x"></span>: <span class="math" data-tex="m=(y-b)/x"></span>.</div><div class="step">Restriction: <span class="math" data-tex="x\\ne0"></span>.</div></div>');
    add("Student Turn","Multi-step turn",head("Student Turn","Make length the subject")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="P=2l+2w"></span> for <span class="math" data-tex="l"></span>. Show why both <span class="math" data-tex="(P-2w)/2"></span> and <span class="math" data-tex="P/2-w"></span> are valid final forms.</p><textarea class="scratch" data-save="multistep-turn" aria-label="Multi-step formula work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="P-2w=2l\\Rightarrow l=(P-2w)/2=P/2-w"></span>. Distributing division by 2 proves the equivalence.</p>')+'</div>');
    add("Misconception","Multi-step misconception",head("Misconception check","A denominator applies to the whole numerator")+'<div class="grid"><div class="card maroon"><p><span class="math" data-tex="(P-2w)/2\\ne P-2w/2"></span>.</p></div><div class="card tint"><p><span class="math" data-tex="(P-2w)/2=P/2-w"></span>.</p><p>Parentheses preserve the grouped numerator until division is distributed correctly.</p></div></div>');
    add("Checkpoint","Multi-step evidence",head("Checkpoint","Substitute into both forms")+'<div class="card"><p>For <span class="math" data-tex="P=50\\text{ cm}"></span> and <span class="math" data-tex="w=9\\text{ cm}"></span>:</p><p><span class="math" data-tex="l=(50-18)/2=16\\text{ cm}"></span> and <span class="math" data-tex="l=25-9=16\\text{ cm}"></span>.</p><p>Both solved forms agree and reproduce <span class="math" data-tex="P=2(16)+2(9)=50\\text{ cm}"></span>.</p></div>');

    add("Fractions","Fractional formulas",section("C=5/9(F-32)","Clear a fractional coefficient strategically","Multiplying by a reciprocal can undo a fractional coefficient while preserving the grouped expression."));
    add("Fractions","Reciprocal structure",head("Concept","Treat the group as one object")+'<div class="flow"><span><span class="math" data-tex="C=\\frac59(F-32)"></span></span><b>× <span class="math" data-tex="9/5"></span></b><span><span class="math" data-tex="9C/5=F-32"></span></span><b>+32</b><span><span class="math" data-tex="F=9C/5+32"></span></span></div>');
    add("Fractions","Worked example",head("Worked example","Solve a trapezoid area formula for height")+'<div class="step-list"><div class="step"><span class="math" data-tex="A=\\frac12h(b_1+b_2)"></span>.</div><div class="step">Multiply both sides by 2: <span class="math" data-tex="2A=h(b_1+b_2)"></span>.</div><div class="step">Divide by the complete factor <span class="math" data-tex="b_1+b_2"></span>.</div><div class="step"><span class="math" data-tex="h=2A/(b_1+b_2)"></span>, with <span class="math" data-tex="b_1+b_2\\ne0"></span>.</div></div>');
    add("Student Turn","Fraction turn",head("Student Turn","Solve a grouped fractional formula")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="A=\\frac12h(b_1+b_2)"></span> for <span class="math" data-tex="b_2"></span>. Keep the grouping visible.</p><textarea class="scratch" data-save="fraction-turn" aria-label="Fractional formula work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="2A=h(b_1+b_2)\\Rightarrow2A/h=b_1+b_2\\Rightarrow b_2=2A/h-b_1"></span>.</p>')+'</div>');
    add("Misconception","Fraction misconception",head("Misconception check","Do not cancel through addition")+'<div class="grid"><div class="card maroon"><p>In <span class="math" data-tex="h(b_1+b_2)"></span>, the <span class="math" data-tex="h"></span> multiplies the entire sum. It cannot cancel only with <span class="math" data-tex="b_1"></span>.</p></div><div class="card tint"><p>First isolate the product or divide the complete expression: <span class="math" data-tex="2A/h=b_1+b_2"></span>.</p></div></div>');
    add("Checkpoint","Fraction evidence",head("Checkpoint","Check the Celsius-Fahrenheit reversal")+'<div class="card gold"><p>If <span class="math" data-tex="C=20"></span>, then <span class="math" data-tex="F=9(20)/5+32=68"></span>. Substitution into the original gives <span class="math" data-tex="(5/9)(68-32)=20"></span>. The formulas reverse one another.</p></div>');

    add("Substitution","Substitution after rearrangement",section("t=d/r","Rearrange first, then substitute","A solved form reduces substitution risk, clarifies the output unit, and can be reused for many input sets."));
    add("Substitution","Symbolic before numeric",head("Concept","Keep exact structure until the target is isolated")+'<div class="grid"><div class="card maroon"><h3>Risky order</h3><p>Insert several measurements into the original formula, then try to solve among crowded units.</p></div><div class="card tint"><h3>Reliable order</h3><p>Rearrange <span class="math" data-tex="d=rt"></span> to <span class="math" data-tex="t=d/r"></span>, state units, then substitute.</p></div></div>');
    add("Substitution","Worked example",head("Worked example","Time for an Education City journey")+'<div class="step-list"><div class="step">Relationship: <span class="math" data-tex="d=rt"></span>.</div><div class="step">Solve: <span class="math" data-tex="t=d/r"></span>.</div><div class="step">Substitute <span class="math" data-tex="d=180\\text{ km}"></span>, <span class="math" data-tex="r=72\\text{ km/h}"></span>.</div><div class="step"><span class="math" data-tex="t=180/72=2.5\\text{ h}"></span>.</div><div class="step">Check: <span class="math" data-tex="72(2.5)=180"></span>.</div></div>');
    add("Student Turn","Substitution turn",head("Student Turn","Use force to recover mass")+'<div class="question-box"><p class="question-prompt">From <span class="math" data-tex="F=ma"></span>, solve for <span class="math" data-tex="m"></span>. Then use <span class="math" data-tex="F=96\\text{ N}"></span> and <span class="math" data-tex="a=8\\text{ m/s}^2"></span>.</p><textarea class="scratch" data-save="substitution-turn" aria-label="Substitution work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="m=F/a=96/8=12\\text{ kg}"></span>. The unit check follows <span class="math" data-tex="\\text{N}/(\\text{m/s}^2)=\\text{kg}"></span>.</p>')+'</div>');
    add("Misconception","Substitution misconception",head("Misconception check","Units belong to values, not only final answers")+'<div class="grid"><div class="card maroon"><p>Writing <span class="math" data-tex="t=180/72=2.5"></span> without units hides whether the division was meaningful.</p></div><div class="card tint"><p><span class="math" data-tex="(180\\text{ km})/(72\\text{ km/h})=2.5\\text{ h}"></span>. The cancellation explains the output.</p></div></div>');
    add("Checkpoint","Substitution evidence",head("Checkpoint","Three-part verification")+'<div class="law-grid"><article class="law"><strong>Algebra</strong>Reverse the operations to recover the original formula.</article><article class="law"><strong>Numerical</strong>Substitute the result into the original relationship.</article><article class="law"><strong>Contextual</strong>Confirm sign, magnitude, and units are reasonable.</article></div>');

    add("Interpretation","Dimensional reasonableness",section("quantity + units","Interpret the solved-for quantity","A correct rearrangement names what the result measures, how its units are formed, and what restrictions the context imposes."));
    add("Interpretation","Unit structure",head("Concept","Read compound units as operations")+'<div class="grid three"><article class="card"><h3>Rate</h3><p><span class="math" data-tex="r=d/t"></span></p><p>distance per time</p></article><article class="card"><h3>Time</h3><p><span class="math" data-tex="t=d/r"></span></p><p>distance divided by distance per time</p></article><article class="card"><h3>Area width</h3><p><span class="math" data-tex="w=A/l"></span></p><p>square units divided by length units</p></article></div>');
    add("Interpretation","Worked example",head("Worked example","Interpret simple-interest rate")+'<div class="step-list"><div class="step"><span class="math" data-tex="I=Prt"></span>; target <span class="math" data-tex="r"></span>.</div><div class="step"><span class="math" data-tex="r=I/(Pt)"></span>.</div><div class="step">For <span class="math" data-tex="I=450\\text{ QAR},P=5000\\text{ QAR},t=3\\text{ yr}"></span>:</div><div class="step"><span class="math" data-tex="r=450/(5000\\cdot3)=0.03=3\\%\\text{ per year}"></span>.</div><div class="step">Currency units cancel; dividing by years gives an annual rate.</div></div>');
    add("Student Turn","Interpretation turn",head("Student Turn","Explain a solved-for quantity")+'<div class="question-box"><p class="question-prompt">The thermal-energy formula is <span class="math" data-tex="Q=mc\\Delta T"></span>. Solve for <span class="math" data-tex="\\Delta T"></span>, then explain in words what <span class="math" data-tex="Q/(mc)"></span> represents.</p><textarea class="scratch" data-save="interpretation-turn" aria-label="Interpretation work"></textarea>'+reveal('Reveal verified reasoning','<p><span class="math" data-tex="\\Delta T=Q/(mc)"></span>. It is the temperature change produced by energy <span class="math" data-tex="Q"></span> for mass <span class="math" data-tex="m"></span> with specific heat <span class="math" data-tex="c"></span>.</p>')+'</div>');
    add("Misconception","Interpretation misconception",head("Misconception check","A positive algebraic result may still violate context")+'<div class="grid"><div class="card maroon"><p>A formula can produce a positive width while the chosen perimeter and other side make the geometry impossible.</p></div><div class="card tint"><p>For <span class="math" data-tex="w=P/2-l"></span>, a physical rectangle requires <span class="math" data-tex="P/2-l>0"></span>. Algebraic form and contextual domain work together.</p></div></div>');
    add("Checkpoint","Interpretation evidence",head("Checkpoint","Dimensionally reasonable is necessary, not sufficient")+'<div class="card gold"><p>Correct units do not guarantee correct arithmetic or a realistic input domain. A complete check uses equivalent algebra, original-form substitution, units, and contextual restrictions.</p></div>');

    practice.forEach(q=>add("Practice",q.id+" · "+q.level,head("Differentiated practice",q.id+" · "+q.level)+qCard(q)));
    add("Mastery","Practice evidence",head("Mastery evidence","Score the differentiated set")+'<div class="grid"><div class="card"><button class="check-button" id="scoreBtn" type="button">Score all 20 responses</button><p class="lead" id="scoreSummary" aria-live="polite">Complete the set, then score your evidence.</p></div><div class="mastery"><div><strong data-level-score="Easy">—</strong>Easy / 4</div><div><strong data-level-score="Medium">—</strong>Medium / 6</div><div><strong data-level-score="Hard">—</strong>Hard / 6</div><div><strong data-level-score="Challenge">—</strong>Challenge / 4</div><div><strong id="totalScore">—</strong>Total / 20</div></div></div>');
    add("Error analysis","Correct one invalid rearrangement",head("Error analysis","Find the first invalid line")+'<div class="grid"><div class="card"><p><span class="math" data-tex="P=2l+2w"></span></p><p><span class="math" data-tex="P-2l=2w"></span></p><p><span class="math" data-tex="w=P-2l/2"></span></p><label for="errorAnalysis"><strong>Identify, correct, and verify the invalid line.</strong></label><textarea class="scratch" id="errorAnalysis" data-save="error-analysis"></textarea></div><div class="card gold"><h3>Verified correction</h3>'+reveal('Reveal correction','<p>The division must apply to the whole left side: <span class="math" data-tex="w=(P-2l)/2=P/2-l"></span>. Substitution into <span class="math" data-tex="P=2l+2w"></span> verifies the equivalent form.</p>')+'</div></div>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","Formula flexibility supports every function family")+'<div class="grid three"><article class="card"><h3>Parameters</h3><p>Solve model formulas for a parameter before interpreting its effect.</p></article><article class="card"><h3>Rates</h3><p>Rearrange slope and rate relationships while preserving units.</p></article><article class="card"><h3>Representations</h3><p>Equivalent forms reveal different quantities without changing the relationship.</p></article></div><p class="callout success"><strong>Transfer:</strong> symbolic flexibility frees attention for AP-level interpretation, covariation, and model justification.</p>');
    add("Exit ticket","Exit ticket",head("Exit ticket","Produce final mastery evidence")+'<div class="question-box"><ol><li>Solve <span class="math" data-tex="V=\\pi r^2h"></span> for <span class="math" data-tex="h"></span>.</li><li>Solve <span class="math" data-tex="A=\\frac12h(b_1+b_2)"></span> for <span class="math" data-tex="b_2"></span>.</li><li>Use <span class="math" data-tex="d=rt"></span> with <span class="math" data-tex="d=150\\text{ km}"></span> and <span class="math" data-tex="r=60\\text{ km/h}"></span>; interpret the result.</li><li>Explain why <span class="math" data-tex="w=(P-2l)/2"></span> is dimensionally reasonable.</li></ol><textarea class="scratch" data-save="exit-ticket" aria-label="Exit ticket work"></textarea>'+reveal('Reveal exit-ticket key','<ol><li><span class="math" data-tex="h=V/(\\pi r^2)"></span>.</li><li><span class="math" data-tex="b_2=2A/h-b_1"></span>.</li><li><span class="math" data-tex="t=d/r=150/60=2.5\\text{ h}"></span>; the travel time is 2.5 hours.</li><li>Perimeter and length both have length units, so <span class="math" data-tex="P-2l"></span> has length units; division by 2 preserves length.</li></ol>')+'</div>');
    add("Reflect","Mastery reflection",head("Reflect","Select the next instructional move")+'<div class="grid"><div class="card tint"><h3>Ready to advance</h3><p>At least 16/20, accurate fraction handling, correct unit interpretation, and independent verification.</p></div><div class="card gold"><h3>Targeted review</h3><p>Return to the concept cycle linked to the evidence gap, then complete a parallel formula without scaffolding.</p></div></div><label for="reflection"><h3>My evidence and next action</h3></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea>');
    add("Complete","Formula fluency secured",head("Complete","Lesson 1.2 mastery package")+'<div class="grid"><div class="card"><h3>Evidence to retain</h3><ul><li>Differentiated practice score</li><li>One corrected invalid rearrangement</li><li>Exit-ticket work with units</li><li>Personal next action</li></ul><button class="secondary" id="exportFinal" type="button">Export lesson work</button></div><div class="card maroon"><h3>Next lesson</h3><p><strong>1.3 Slope and Rate of Change</strong></p><p>Use formula fluency to calculate, compare, and interpret constant rates across representations.</p><a class="cta" href="../../lesson.html?grade=9&amp;path=common&amp;lesson=1.3">View next lesson preview</a></div></div>');

    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map((s,i)=>'<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==='cover'?'cover':'')+'">'+s.body+'</div></section>').join('');
    const slideEls=[...document.querySelectorAll(".slide")];
    let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",''))-1||0));
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function load(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}
    const state=load();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root=document){root.querySelectorAll('.math').forEach(el=>{if(window.katex){try{window.katex.render(el.dataset.tex||'',el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"]').forEach(input=>{if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>checkOne(b.dataset.check)));document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",()=>{state.fields.notebook=n.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(x=>x.id===id),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the inverse operation, restriction, and units.":"Not yet. Recheck grouping, the complete coefficient, and the target variable.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(level=>{const qs=practice.filter(q=>q.level===level),n=qs.filter(q=>state.answers[q.id]===q.answer).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit ticket.":"Use the level pattern to select a targeted review block.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 1.2 Literal Equations & Formula Rearrangement","Exported: "+new Date().toLocaleString(),""];practice.forEach(q=>{lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_1.2_Literal_Equations_Formula_Rearrangement.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());document.documentElement.dataset.lessonReady="true";
  })();
  </script>
</body>
</html>

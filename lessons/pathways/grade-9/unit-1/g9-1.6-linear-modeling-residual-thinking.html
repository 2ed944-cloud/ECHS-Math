    .question-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}.question-box{border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3vw,30px);background:#fff}.question-prompt{font-size:clamp(1.18rem,2.4vw,1.6rem);font-weight:750;color:var(--navy);margin:16px 0 22px}.choices{display:grid;gap:10px}.choice{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff}.choice:hover{border-color:var(--teal);background:#f5fbfb}.choice input{width:20px;height:20px;margin-top:2px;accent-color:var(--maroon)}.choice>span{flex:1}.answer-key{margin-top:16px;border:1px solid #b9dac9;border-radius:13px;background:#f0faf4;padding:0 15px}.answer-key summary{padding:12px 0;font-weight:900;color:var(--good);cursor:pointer}.scratch{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fbfcfd}.side-note{background:var(--paper);border-radius:18px;padding:19px}.feedback{font-weight:900;min-height:1.5em}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.mastery{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.mastery div{padding:15px 8px;text-align:center;border-radius:14px;background:#eef4f5}.mastery strong{display:block;font-size:1.5rem;color:var(--maroon)}

  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-1.6-linear-modeling-residual-thinking-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'A scatterplot rises from left to right. Which description is most appropriate?',options:["positive association","negative association","no association","a proven causal relationship"],answer:0,solution:'When larger input values tend to occur with larger output values, the variables have a positive association. Association alone does not prove causation.'},
      {id:"E2",level:"Easy",calc:false,prompt:'For <span class="math" data-tex="\\hat y=2x+5"></span>, predict <span class="math" data-tex="y"></span> when <span class="math" data-tex="x=4"></span>.',options:["9","13","18","28"],answer:1,solution:'Substitute <span class="math" data-tex="x=4"></span>: <span class="math" data-tex="\\hat y=2(4)+5=13"></span>.'},
      {id:"E3",level:"Easy",calc:false,prompt:'The observed value is 14 and the predicted value is 11. What is the residual?',options:["-25","-3","3","25"],answer:2,solution:'Residual means observed minus predicted: <span class="math" data-tex="r=y-\\hat y=14-11=3"></span>.'},
      {id:"E4",level:"Easy",calc:false,prompt:'In <span class="math" data-tex="\\hat y=1.5x+8"></span>, what does 1.5 represent?',options:["the predicted output at x = 0","the residual","the largest observed output","the predicted output increase per one input unit"],answer:3,solution:'The slope 1.5 is the predicted change in output for each one-unit increase in input.'},
      {id:"M1",level:"Medium",calc:false,prompt:'A model predicts 23, but the observed value is 20. Find the residual.',options:["3","-3","43","-43"],answer:1,solution:'<span class="math" data-tex="r=y-\\hat y=20-23=-3"></span>. The negative residual means the observation lies 3 units below the model.'},
      {id:"M2",level:"Medium",calc:false,prompt:'The data follow <span class="math" data-tex="\\hat y=3x+2"></span>. At <span class="math" data-tex="x=4"></span>, the observed value is 14. What is the residual?',options:["0","2","4","14"],answer:0,solution:'The prediction is <span class="math" data-tex="3(4)+2=14"></span>, so <span class="math" data-tex="r=14-14=0"></span>.'},
      {id:"M3",level:"Medium",calc:true,prompt:'Technology gives <span class="math" data-tex="\\hat y=4.2x+18"></span>. What does 18 mean?',options:["output rises 18 per input unit","every residual equals 18","predicted output is 18 when x = 0","the largest data value is 18"],answer:2,solution:'The intercept is the model prediction at <span class="math" data-tex="x=0"></span>. Its contextual meaning is valid only if zero is meaningful and not far beyond the observed input range.'},
      {id:"M4",level:"Medium",calc:false,prompt:'At one input, the observed output is 50 and the model predicts 54. Which residual is correct?',options:["104","4","-104","-4"],answer:3,solution:'<span class="math" data-tex="r=50-54=-4"></span>, so the point is 4 output units below the fitted line.'},
      {id:"M5",level:"Medium",calc:false,prompt:'Residuals are <span class="math" data-tex="-1,2,0,-2,1"></span>. What is a reasonable informal judgment?',options:["They are small and occur on both sides, supporting the linear model for this range.","The model proves causation.","Every point is predicted exactly.","The slope must be zero."],answer:0,solution:'Small residuals with both signs show observations close to the line without a consistent above-or-below tendency. This is informal evidence, not proof.'},
      {id:"M6",level:"Medium",calc:false,prompt:'A table contains <span class="math" data-tex="(0,5),(2,9),(4,13)"></span>. Which linear model fits exactly?',options:["y-hat = x + 5","y-hat = 4x + 5","y-hat = 2x + 5","y-hat = 2x - 5"],answer:2,solution:'The output rises 4 while input rises 2, so the slope is 2. At <span class="math" data-tex="x=0"></span>, the output is 5; hence <span class="math" data-tex="\\hat y=2x+5"></span>.'},
      {id:"H1",level:"Hard",calc:false,prompt:'For <span class="math" data-tex="\\hat y=6x+20"></span>, the observed output at <span class="math" data-tex="x=7"></span> is 59. Find the residual.',options:["3","-3","59","62"],answer:1,solution:'The prediction is <span class="math" data-tex="6(7)+20=62"></span>. Therefore <span class="math" data-tex="r=59-62=-3"></span>.'},
      {id:"H2",level:"Hard",calc:true,prompt:'Model A has residuals <span class="math" data-tex="1,-1,2,-2"></span>; Model B has <span class="math" data-tex="4,-3,5,-4"></span>. Which is better supported informally?',options:["Model A, because its residual magnitudes are consistently smaller","Model B, because larger residuals are better","Both are perfect","Neither can make predictions"],answer:0,solution:'Model A keeps all observations within 2 output units of its predictions, while Model B misses by 3 to 5 units. For the same data and scale, A fits more closely.'},
      {id:"H3",level:"Hard",calc:false,prompt:'A model is <span class="math" data-tex="\\hat y=2.5x+10"></span>. At <span class="math" data-tex="x=12"></span>, the observed value is 44. Find the residual.',options:["-44","-4","40","4"],answer:3,solution:'<span class="math" data-tex="\\hat y=2.5(12)+10=40"></span>, so <span class="math" data-tex="r=44-40=4"></span>.'},
      {id:"H4",level:"Hard",calc:false,prompt:'Data were collected for inputs from 2 to 10. What is the best statement about predicting at <span class="math" data-tex="x=30"></span>?',options:["It must be exact.","It is extrapolation and needs strong caution.","It is interpolation and automatically reliable.","It proves the trend continues."],answer:1,solution:'Thirty lies well outside the observed input range. Extending a linear pattern that far assumes the relationship continues unchanged, so the prediction requires caution.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Every residual in a data set is positive. What does that indicate?',options:["The line predicts every point exactly.","The model always overpredicts.","The model systematically underpredicts the observed values.","The variables have no association."],answer:2,solution:'Positive residuals mean <span class="math" data-tex="y>\\hat y"></span>. Every observation lies above its prediction, so the model is systematically too low.'},
      {id:"H6",level:"Hard",calc:false,prompt:'For plant height <span class="math" data-tex="\\hat h=0.8w+12"></span>, where <span class="math" data-tex="h"></span> is centimeters and <span class="math" data-tex="w"></span> is weeks, which slope interpretation is correct?',options:["12 weeks per centimeter","0.8 weeks per centimeter","12 centimeters per week","0.8 predicted centimeters per week"],answer:3,solution:'The slope units are output per input: predicted centimeters per week. The model predicts an average increase of 0.8 cm for each additional week.'},
      {id:"C1",level:"Challenge",calc:true,prompt:'Two models predict the same data. Model P has residuals <span class="math" data-tex="-1,1,-2,2,0"></span>; Model Q has <span class="math" data-tex="-5,4,-3,6,-2"></span>. Which conclusion is justified?',options:["Q is closer because its values vary more.","P is closer over the observed range because its residual magnitudes are smaller.","P proves the relationship is causal.","Q must have the larger slope."],answer:1,solution:'Model P has much smaller vertical prediction errors at every listed point. This supports P as the closer linear fit over the observed range; it does not establish causation.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'A prediction is 41 and the residual is -2.5. What was observed?',options:["38.5","43.5","-43.5","16.4"],answer:0,solution:'Since <span class="math" data-tex="r=y-\\hat y"></span>, <span class="math" data-tex="y=r+\\hat y=-2.5+41=38.5"></span>.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'A strong positive association appears between two variables. Which claim is most defensible?',options:["Increasing the first variable definitely causes the second to increase.","No linear model may be used.","The variables move together in the data, but other variables or study design may explain the pattern.","The intercept must be meaningful."],answer:2,solution:'Association describes a data pattern. Causation requires appropriate study design and control of alternative explanations.'},
      {id:"C4",level:"Challenge",calc:true,prompt:'Residuals at inputs <span class="math" data-tex="2,4,6,8"></span> are <span class="math" data-tex="1,-2,5,-1"></span>. Which observation is least well predicted?',options:["x = 2","x = 6","x = 8","all are equally close"],answer:1,solution:'Prediction error size is the residual magnitude. The largest is <span class="math" data-tex="|5|=5"></span> at <span class="math" data-tex="x=6"></span>.'}
    ];
    const slides=[];
    const add=(stage,title,body,cls="")=>slides.push({stage,title,body,cls});
    const head=(label,title)=>'<div class="slide-head"><div><p class="eyebrow">'+label+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';
    const reveal=(label,body)=>'<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';
    const section=(code,title,text)=>'<div class="section-banner"><div><p class="eyebrow">Concept cycle</p><h2 tabindex="-1">'+title+'</h2><p class="lead">'+text+'</p></div><div class="section-code">'+code+'</div></div>';
    const qCard=q=>'<div class="question-layout"><div class="question-box"><div><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?'calc':'')+'">'+(q.calc?'Calculator / technology':'No calculator')+'</span></div><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map((o,i)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>').join("")+'</div><button class="check-button" type="button" data-check="'+q.id+'">Check response</button><p class="feedback" id="feedback-'+q.id+'" aria-live="polite"></p>'+reveal('Reveal complete solution','<p>'+q.solution+'</p>')+'</div><aside class="side-note"><label for="work-'+q.id+'"><strong>Show prediction, residual, units, and evidence</strong></label><textarea class="scratch" id="work-'+q.id+'" data-save="work-'+q.id+'"></textarea></aside></div>';
    const scatterSvg=id=>'<svg class="graph" viewBox="0 0 640 420" role="img" aria-labelledby="scatter-title-'+id+' scatter-desc-'+id+'"><title id="scatter-title-'+id+'">Scatterplot with a linear model and residual segments</title><desc id="scatter-desc-'+id+'">Five observed gold points follow an increasing pattern around the maroon line y hat equals 2x plus 2. Teal vertical segments connect selected observed points to open predicted points on the line, showing residuals as observed minus predicted.</desc><g aria-hidden="true"><path class="gridline" d="M80 50V350M160 50V350M240 50V350M320 50V350M400 50V350M480 50V350M560 50V350M80 50H560M80 110H560M80 170H560M80 230H560M80 290H560M80 350H560"/><path class="axis" d="M65 350H580M80 370V35"/><path class="trend" d="M120 335L520 85"/><path class="residual" d="M160 285V310M240 285V260M320 185V210M400 185V160M480 85V110"/><circle class="predicted" cx="160" cy="310" r="8"/><circle class="predicted" cx="240" cy="260" r="8"/><circle class="predicted" cx="320" cy="210" r="8"/><circle class="predicted" cx="400" cy="160" r="8"/><circle class="predicted" cx="480" cy="110" r="8"/><circle class="point" cx="160" cy="285" r="9"/><circle class="point" cx="240" cy="285" r="9"/><circle class="point" cx="320" cy="185" r="9"/><circle class="point" cx="400" cy="185" r="9"/><circle class="point" cx="480" cy="85" r="9"/><text class="gtext" x="400" y="75">observed</text><text class="gtext" x="400" y="145">predicted</text><text class="gtext" x="250" y="245">residual</text><text class="gtext" x="485" y="215">ŷ = 2x + 2</text><text class="gtext" x="545" y="385">input</text><text class="gtext" x="20" y="55">output</text></g></svg>';

    add("Launch","Linear Modeling & Residual Thinking",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Lesson 1.6 · AP Precalculus readiness</p><h1 tabindex="-1">Linear Modeling &amp; Residual Thinking</h1><p class="lead">Build and interpret linear models, measure observed-minus-predicted error, and make an informal evidence-based judgment of fit.</p><button class="cta" type="button" data-go="1">Begin the lesson →</button></div><div class="slope-art">'+scatterSvg("cover")+'</div></div>',"cover");
    add("Purpose","Two-period bridge",head("Purpose","What this lesson develops—and defers")+'<p class="lead">This is a two-period bridge-depth sequence, with a maximum of three periods.</p><div class="grid"><div class="card tint"><h3>Required bridge coverage</h3><p>Scatterplots, an informal line of fit, technology regression, residual as observed minus predicted, informal residual size/pattern reasoning, and model limitations.</p></div><div class="card gold"><h3>Deliberately deferred</h3><p>Formal residual-plot analysis, transformations to linearity, least-squares derivation, and AP-level model justification are outside this lesson.</p></div></div><p class="callout"><strong>Pacing:</strong> target two class periods, maximum three.</p>');
    add("Goals","Learning goals",head("Learning outcome","By the end, I can…")+'<div class="law-grid"><article class="law"><strong>Build</strong>Use a scatterplot or technology output to state a linear model.</article><article class="law"><strong>Interpret</strong>Explain slope, intercept, prediction, and residual with units.</article><article class="law"><strong>Judge</strong>Use residual size and informal pattern evidence while naming assumptions and limitations.</article></div>');
    add("Success","Mastery evidence",head("Success criteria","What counts as secure")+'<div class="grid"><div class="card"><strong class="big">16 / 20</strong><p>on differentiated practice, including model interpretation and residual evidence.</p></div><div class="card"><strong class="big">4 claims</strong><p>model equation, parameter meaning, prediction/residual, and a limitation supported by the data context.</p></div></div>');
    add("Retrieval","Rate-of-change retrieval",head("Prerequisite retrieval","A linear model carries units")+'<div class="grid"><div class="card"><p>From <span class="math" data-tex="(2,11)"></span> to <span class="math" data-tex="(6,23)"></span>:</p><p><span class="formula math" data-tex="m=\\frac{23-11}{6-2}=3"></span></p></div><div class="card gold"><p>If input is weeks and output is centimeters, the rate is 3 centimeters per week—not 3 weeks per centimeter.</p></div></div>');
    add("Retrieval","Observed and predicted",head("Prerequisite retrieval","Distinguish data from model output")+'<div class="flow"><span><span class="math" data-tex="y"></span> = observed</span><b>−</b><span><span class="math" data-tex="\\hat y"></span> = predicted</span><b>→</b><span><span class="math" data-tex="r=y-\\hat y"></span></span></div><p class="callout success">The hat marks a prediction from the model; it is not automatically the observed value.</p>');
    add("Retrieval","Substitution retrieval",head("Prerequisite retrieval","Prediction uses the model equation")+'<div class="grid"><div class="card"><p>For <span class="math" data-tex="\\hat y=4x+7"></span> at <span class="math" data-tex="x=5"></span>:</p><p><span class="formula math" data-tex="\\hat y=4(5)+7=27"></span></p></div><div class="card tint"><p>Prediction is meaningful only within a context and input range where the linear assumption is reasonable.</p></div></div>');
    add("Launch","Initial reasoning",head("Student Turn","What would make a line useful?")+'<div class="question-box"><p class="question-prompt">A scatterplot shows points close to an upward-sloping line, but none lies exactly on it. Can the line still be useful? State two pieces of evidence you would examine.</p><textarea class="scratch" data-save="launch-reasoning" aria-label="Initial model reasoning"></textarea>'+reveal('Reveal reasoning','<p>Yes. A model need not pass through every point. Examine whether the line follows the center of the data and whether vertical prediction errors are generally small without a consistent above-or-below tendency.</p>')+'</div>');

    add("Association","Read the scatterplot",section("pattern","Describe before you model","Identify direction, approximate form, strength, unusual points, and the observed input range without claiming causation."));
    add("Association","Association language",head("Concept","Describe what the graph supports")+'<div class="law-grid"><article class="law"><strong>Direction</strong>Positive, negative, or no clear association.</article><article class="law"><strong>Form</strong>Roughly linear or visibly curved.</article><article class="law"><strong>Evidence</strong>Closeness to a pattern and any unusual observations.</article></div><p class="callout warning">Association is not proof that one variable causes the other.</p>');
    add("Association","Worked example",head("Worked example","Read a modeling candidate")+'<div class="grid"><div>'+scatterSvg("association")+'</div><div class="step-list"><div class="step">Direction: positive.</div><div class="step">Form: roughly linear over the displayed range.</div><div class="step">Strength: points remain fairly close to one line.</div><div class="step">Variation: points occur above and below the line.</div><div class="step">Conclusion: a linear model is a reasonable first summary, not a causal claim.</div></div></div>');
    add("Student Turn","Scatterplot turn",head("Student Turn","Write a precise association statement")+'<div class="question-box"><p class="question-prompt">A plot of study time against quiz score rises overall, includes one low-score point at high study time, and contains inputs from 1 to 6 hours. Describe direction, form, unusual evidence, and one limit on your claim.</p><textarea class="scratch" data-save="scatter-turn" aria-label="Scatterplot description"></textarea>'+reveal('Reveal verified statement','<p>The data show a positive, approximately linear association from 1 to 6 study hours, with one high-study observation below the overall pattern. The graph supports association, not proof that additional study alone caused the score difference.</p>')+'</div>');
    add("Misconception","Causation claim",head("Misconception check","A fitted line does not establish cause")+'<div class="grid"><div class="card maroon"><p>“The positive slope proves increasing <span class="math" data-tex="x"></span> causes <span class="math" data-tex="y"></span> to rise.”</p></div><div class="card tint"><p>Precise: “Larger <span class="math" data-tex="x"></span> values are associated with larger <span class="math" data-tex="y"></span> values in these observations.”</p></div></div>');
    add("Checkpoint","Association evidence",head("Checkpoint","Decide whether linear modeling is reasonable")+'<div class="question-box"><p class="question-prompt">List three visible features that support a linear model and two that would make you hesitate.</p><textarea class="scratch" data-save="association-check" aria-label="Association checkpoint"></textarea>'+reveal('Reveal criteria','<p>Support: roughly straight form, consistent direction, and points fairly close to a central line. Hesitate: strong curvature, separate clusters, influential unusual points, or a very narrow/unrepresentative input range.</p>')+'</div>');

    add("Fit","Informal line of fit",section("center","Use a line to summarize—not replace—the data","A useful line follows the center of a roughly linear cloud, leaving observations on both sides and supporting interpretable predictions."));
    add("Fit","Line-of-fit criteria",head("Concept","Balance the data around the line")+'<div class="grid three"><article class="law"><strong>Center</strong>The line passes through the middle of the data cloud.</article><article class="law"><strong>Balance</strong>Points occur above and below, rather than mostly on one side.</article><article class="law"><strong>Scale</strong>Parameter and residual interpretations use the graph’s actual units.</article></div>');
    add("Fit","Worked example",head("Worked example","Construct an informal model from two central anchors")+'<div class="step-list"><div class="step">Choose representative central points <span class="math" data-tex="(2,7)"></span> and <span class="math" data-tex="(8,19)"></span>.</div><div class="step"><span class="math" data-tex="m=(19-7)/(8-2)=2"></span>.</div><div class="step">Use <span class="math" data-tex="7=2(2)+b"></span> to get <span class="math" data-tex="b=3"></span>.</div><div class="step">Informal model: <span class="math" data-tex="\\hat y=2x+3"></span>.</div><div class="step">Audit the full cloud; two chosen points alone do not prove fit.</div></div>');
    add("Student Turn","Line-of-fit turn",head("Student Turn","Build and interpret an informal model")+'<div class="question-box"><p class="question-prompt">A central line passes near <span class="math" data-tex="(1,12)"></span> and <span class="math" data-tex="(5,24)"></span>. Construct a model and interpret both parameters if input is weeks and output is centimeters.</p><textarea class="scratch" data-save="fit-turn" aria-label="Informal line of fit work"></textarea>'+reveal('Reveal verified model','<p><span class="math" data-tex="m=(24-12)/(5-1)=3"></span> and <span class="math" data-tex="12=3(1)+b\\Rightarrow b=9"></span>. Model: <span class="math" data-tex="\\hat y=3x+9"></span>; predicted growth is 3 cm/week, with a model-predicted height of 9 cm at week 0 if that intercept is contextually meaningful.</p>')+'</div>');
    add("Misconception","Connect-the-dots model",head("Misconception check","A fitted line is not a path through every point")+'<div class="grid"><div class="card maroon"><p>Connecting observations in time or input order creates a jagged graph, not a single linear summary.</p></div><div class="card tint"><p>A line of fit summarizes the overall relationship and accepts residual variation around it.</p></div></div>');
    add("Checkpoint","Fit evidence",head("Checkpoint","Predict, then qualify")+'<div class="question-box"><p class="question-prompt">Using <span class="math" data-tex="\\hat y=2x+3"></span>, predict at <span class="math" data-tex="x=6"></span> and explain what information is still needed before trusting the result.</p><textarea class="scratch" data-save="fit-check" aria-label="Line of fit checkpoint"></textarea>'+reveal('Reveal solution','<p><span class="math" data-tex="\\hat y=2(6)+3=15"></span>. Trust also depends on whether 6 is within the observed range, the scatter is roughly linear, residuals are acceptably small, and the data collection is relevant.</p>')+'</div>');

    add("Technology","Regression output",section("technology","Use technology, then interpret mathematics","Technology supplies coefficients efficiently; students remain responsible for units, predictions, residuals, assumptions, and limitations."));
    add("Technology","Regression record",head("Concept","Document the output and the variable definitions")+'<div class="grid"><div class="card"><p><span class="formula math" data-tex="\\hat y=4.2x+18"></span></p><p>Record which quantity is <span class="math" data-tex="x"></span>, which is <span class="math" data-tex="y"></span>, and their units.</p></div><div class="card gold"><p>A rounded display is an approximate model. Keep enough precision for the context and avoid claiming exact predictions.</p></div></div>');
    add("Technology","Worked example",head("Worked example","Interpret technology-generated coefficients")+'<div class="step-list"><div class="step">Technology returns <span class="math" data-tex="\\hat y=1.75x+42.6"></span>.</div><div class="step">If <span class="math" data-tex="x"></span> is days and <span class="math" data-tex="y"></span> is grams, slope units are grams/day.</div><div class="step">The model predicts 1.75 additional grams per day.</div><div class="step">The intercept predicts 42.6 grams at day 0—interpret only if day 0 is meaningful.</div><div class="step">At day 8: <span class="math" data-tex="\\hat y=1.75(8)+42.6=56.6"></span> grams.</div></div>');
    add("Student Turn","Technology turn",head("Student Turn","Read, predict, and qualify")+'<div class="question-box"><p class="question-prompt">Technology gives <span class="math" data-tex="\\hat C=6.4t+27.5"></span>, where <span class="math" data-tex="t"></span> is hours and <span class="math" data-tex="C"></span> is QAR. Interpret both coefficients, predict at 5 hours, and state one limitation.</p><textarea class="scratch" data-save="technology-turn" aria-label="Technology regression interpretation"></textarea>'+reveal('Reveal verified interpretation','<p>The model predicts a 6.4 QAR increase per hour and 27.5 QAR at 0 hours. At 5 hours, <span class="math" data-tex="\\hat C=6.4(5)+27.5=59.5"></span> QAR. The intercept or prediction may be unreliable if 0 or 5 lies outside the meaningful observed range.</p>')+'</div>');
    add("Misconception","Technology authority",head("Misconception check","A calculator output is not a complete conclusion")+'<div class="grid"><div class="card maroon"><p>Reporting only <span class="math" data-tex="\\hat y=mx+b"></span> omits variable definitions, units, range, residual evidence, and limitations.</p></div><div class="card tint"><p>Technology computes; mathematical reasoning interprets and evaluates.</p></div></div>');
    add("Checkpoint","Technology evidence",head("Checkpoint","Audit a regression statement")+'<div class="question-box"><p class="question-prompt">A student says, “The calculator gave <span class="math" data-tex="\\hat y=-3.1x+80"></span>, so the relationship is exact and causal.” Rewrite the conclusion precisely.</p><textarea class="scratch" data-save="technology-check" aria-label="Technology conclusion checkpoint"></textarea>'+reveal('Reveal correction','<p>The fitted model predicts an output decrease of about 3.1 units per input unit and a value of 80 at input 0. Fit must be judged from scatter and residual evidence, and regression alone does not establish causation.</p>')+'</div>');

    add("Residual","Observed minus predicted",section("y − ŷ","Measure vertical prediction error","A residual records how far and in which direction an observed point lies from the model prediction at the same input."));
    add("Residual","Residual sign and units",head("Concept","Read sign, magnitude, and units together")+'<div class="law-grid"><article class="law"><strong>Positive</strong><span class="math" data-tex="y>\\hat y"></span>: the observation is above the model.</article><article class="law"><strong>Negative</strong><span class="math" data-tex="y<\\hat y"></span>: the observation is below the model.</article><article class="law"><strong>Magnitude</strong><span class="math" data-tex="|r|"></span> is the vertical prediction-error size in output units.</article></div>');
    add("Residual","Worked example",head("Worked example","Calculate and interpret a residual")+'<div class="grid"><div>'+scatterSvg("residual")+'</div><div class="step-list"><div class="step">Model: <span class="math" data-tex="\\hat y=2x+2"></span>.</div><div class="step">At <span class="math" data-tex="x=3"></span>, predict <span class="math" data-tex="\\hat y=8"></span>.</div><div class="step">Suppose the observed value is <span class="math" data-tex="y=9"></span>.</div><div class="step"><span class="math" data-tex="r=y-\\hat y=9-8=1"></span>.</div><div class="step">The observation is 1 output unit above the fitted line.</div></div></div>');
    add("Student Turn","Residual turn",head("Student Turn","Predict before subtracting")+'<div class="question-box"><p class="question-prompt">For <span class="math" data-tex="\\hat y=3.5x+12"></span>, an observation at <span class="math" data-tex="x=6"></span> has <span class="math" data-tex="y=31"></span>. Find and interpret the residual.</p><textarea class="scratch" data-save="residual-turn" aria-label="Residual calculation"></textarea>'+reveal('Reveal verified calculation','<p><span class="math" data-tex="\\hat y=3.5(6)+12=33"></span>. Then <span class="math" data-tex="r=31-33=-2"></span>, so the observation is 2 output units below the prediction.</p>')+'</div>');
    add("Misconception","Reversed subtraction",head("Misconception check","Residual is not predicted minus observed")+'<div class="grid"><div class="card maroon"><p><span class="math" data-tex="\\hat y-y"></span> reverses every residual sign and therefore reverses above/below interpretation.</p></div><div class="card tint"><p>Use <span class="math" data-tex="r=y-\\hat y"></span>: observed minus predicted.</p></div></div>');
    add("Checkpoint","Residual evidence",head("Checkpoint","Recover the missing quantity")+'<div class="question-box"><p class="question-prompt">A prediction is 47.5 and the residual is -3.2. Recover the observed value and describe its position relative to the line.</p><textarea class="scratch" data-save="residual-check" aria-label="Residual recovery checkpoint"></textarea>'+reveal('Reveal solution','<p><span class="math" data-tex="y=r+\\hat y=-3.2+47.5=44.3"></span>. The observation is 3.2 output units below the fitted line.</p>')+'</div>');

    add("Evaluate","Informal fit and limitations",section("evidence","Judge usefulness without overclaiming","Use residual sizes and signs informally, compare them with the output scale, respect the observed range, and state what the model cannot establish."));
    add("Evaluate","Informal residual evidence",head("Concept","Look for closeness and balance—informally")+'<div class="grid"><div class="card tint"><h3>Supports the model</h3><p>Residuals are reasonably small for the context and appear on both sides without a persistent sequence.</p></div><div class="card gold"><h3>Raises concern</h3><p>Large misses, nearly all one sign, changing miss size, curvature in the original scatterplot, or an influential unusual point.</p></div></div><p class="callout warning"><strong>Boundary:</strong> this is informal reasoning from the scatterplot and residual list; formal residual-plot analysis is deferred.</p>');
    add("Evaluate","Worked example",head("Worked example","Compare two candidate models")+'<div class="step-list"><div class="step">Model A residuals: <span class="math" data-tex="-1,2,0,-2,1"></span>.</div><div class="step">Model B residuals: <span class="math" data-tex="-6,-4,-2,1,5"></span>.</div><div class="step">A stays within 2 output units and uses both signs.</div><div class="step">B misses more and changes from negative to positive across the ordered inputs.</div><div class="step">Informal judgment: A is better supported over this range; neither proves causation or future behavior.</div></div>');
    add("Student Turn","Model judgment",head("Student Turn","Make an evidence-based fit statement")+'<div class="question-box"><p class="question-prompt">Residuals in input order are <span class="math" data-tex="5,3,1,-2,-4"></span>. What concern does this raise, and what should you inspect next?</p><textarea class="scratch" data-save="evaluate-turn" aria-label="Informal residual judgment"></textarea>'+reveal('Reveal reasoning','<p>The residuals shift from positive to negative, so the line first underpredicts and later overpredicts. Inspect the original scatterplot for curvature or a changing relationship. A different form is not developed in this lesson.</p>')+'</div>');
    add("Misconception","Small residual guarantee",head("Misconception check","Close fit does not remove every limitation")+'<div class="grid"><div class="card maroon"><p>Small residuals in one sample do not prove causation, guarantee extrapolation, or show that the sample represents every population.</p></div><div class="card tint"><p>State the observed range, sample/context limits, important omitted variables, and whether the linear assumption is reasonable.</p></div></div>');
    add("Checkpoint","Model limitation",head("Checkpoint","Complete the model claim")+'<div class="question-box"><p class="question-prompt">A model fits data collected from ages 12–16. Write a defensible prediction statement for age 15 and a caution for age 30.</p><textarea class="scratch" data-save="evaluate-check" aria-label="Model limitation checkpoint"></textarea>'+reveal('Reveal statement','<p>The age-15 estimate is interpolation within the observed range and may be useful if residual evidence supports the line. Age 30 is distant extrapolation; the adolescent pattern may not continue, so the model should not be trusted without new evidence.</p>')+'</div>');

    practice.forEach(q=>add("Practice",q.id+" · "+q.level,head("Differentiated practice",q.id+" · "+q.level)+qCard(q)));
    add("Mastery","Practice evidence",head("Mastery evidence","Score the differentiated set")+'<div class="grid"><div class="card"><button class="check-button" id="scoreBtn" type="button">Score all 20 responses</button><p class="lead" id="scoreSummary" aria-live="polite">Complete the set, then score your evidence.</p></div><div class="mastery"><div><strong data-level-score="Easy">—</strong>Easy / 4</div><div><strong data-level-score="Medium">—</strong>Medium / 6</div><div><strong data-level-score="Hard">—</strong>Hard / 6</div><div><strong data-level-score="Challenge">—</strong>Challenge / 4</div><div><strong id="totalScore">—</strong>Total / 20</div></div></div>');
    add("Error analysis","Correct a residual claim",head("Error analysis","Find the first invalid statement")+'<div class="grid"><div class="card"><p>Model: <span class="math" data-tex="\\hat y=4x+6"></span>; observation <span class="math" data-tex="(5,23)"></span>.</p><p>Prediction: <span class="math" data-tex="\\hat y=26"></span>.</p><p>Claimed residual: <span class="math" data-tex="26-23=3"></span>.</p><p>Claim: “The point is 3 units above the line.”</p><label for="errorAnalysis"><strong>Identify and correct the first invalid statement.</strong></label><textarea class="scratch" id="errorAnalysis" data-save="error-analysis"></textarea></div><div class="card gold"><h3>Verified correction</h3>'+reveal('Reveal correction','<p>The prediction 26 is correct. Residual is observed minus predicted: <span class="math" data-tex="r=23-26=-3"></span>. The observation is 3 output units below the line.</p>')+'</div></div>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","Model evidence prepares later function reasoning")+'<div class="grid three"><article class="card"><h3>Interpret parameters</h3><p>Attach units and contextual meaning to slope and intercept.</p></article><article class="card"><h3>Measure error</h3><p>Calculate <span class="math" data-tex="r=y-\\hat y"></span> and interpret sign and magnitude.</p></article><article class="card"><h3>Qualify conclusions</h3><p>Use range, assumptions, residual evidence, and limitations.</p></article></div><p class="callout success"><strong>Transfer:</strong> AP Precalculus expects students to construct, interpret, and critique function models. This bridge builds that language without formal residual-plot analysis, transformations to linearity, or AP-level model justification.</p>');
    add("Exit ticket","Exit ticket",head("Exit ticket","Produce final mastery evidence")+'<div class="question-box"><ol><li>Technology gives <span class="math" data-tex="\\hat y=2.8x+15"></span>. Interpret both coefficients with invented but consistent units.</li><li>Predict at <span class="math" data-tex="x=10"></span>; if observed <span class="math" data-tex="y=40"></span>, calculate and interpret the residual.</li><li>Residuals are <span class="math" data-tex="-1,2,-2,1,0"></span>. Give an informal fit judgment.</li><li>State one interpolation advantage, one extrapolation risk, and why association does not establish causation.</li></ol><textarea class="scratch" data-save="exit-ticket" aria-label="Exit ticket work"></textarea>'+reveal('Reveal exit-ticket key','<ol><li>Example: if input is weeks and output is centimeters, the model predicts 2.8 cm/week and 15 cm at week 0, if meaningful.</li><li><span class="math" data-tex="\\hat y=2.8(10)+15=43"></span>; <span class="math" data-tex="r=40-43=-3"></span>, so the observation is 3 output units below prediction.</li><li>The residuals are small and use both signs, informally supporting the line over this range.</li><li>Interpolation stays within observed evidence; extrapolation assumes an unobserved continuation; causal claims require appropriate study design.</li></ol>')+'</div>');
    add("Reflect","Mastery reflection",head("Reflect","Select the next instructional move")+'<div class="grid"><div class="card tint"><h3>Ready to advance</h3><p>At least 16/20, accurate coefficient interpretations, correct observed-minus-predicted residuals, and evidence-based limitations.</p></div><div class="card gold"><h3>Targeted review</h3><p>Return to the specific prediction, residual sign, unit, or model claim that evidence identifies, then solve a parallel task independently.</p></div></div><label for="reflection"><h3>My evidence and next action</h3></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea>');
    add("Complete","Linear modeling bridge secured",head("Complete","Lesson 1.6 mastery package")+'<div class="grid"><div class="card"><h3>Evidence to retain</h3><ul><li>Differentiated practice score</li><li>One corrected residual error</li><li>Exit-ticket model interpretation</li><li>Personal next action</li></ul><button class="secondary" id="exportFinal" type="button">Export lesson work</button></div><div class="card maroon"><h3>Next lesson</h3><p><strong>2.1 Systems by Graphing and Substitution</strong></p><p>Solve and interpret 2×2 systems using intersection and substitution.</p><a class="cta" href="../../lesson.html?grade=9&amp;path=common&amp;lesson=2.1">View next lesson preview</a></div></div>');

    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map((s,i)=>'<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==='cover'?'cover':'')+'">'+s.body+'</div></section>').join('');
    const slideEls=[...document.querySelectorAll(".slide")];
    let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",''))-1||0));
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function load(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}
    const state=load();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root=document){root.querySelectorAll('.math').forEach(el=>{if(window.katex){try{window.katex.render(el.dataset.tex||'',el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"]').forEach(input=>{if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>checkOne(b.dataset.check)));document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",()=>{state.fields.notebook=n.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(x=>x.id===id),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the model choice, parameter meaning, prediction, residual, and limitation.":"Not yet. Recheck the variable definitions, units, observed-minus-predicted order, and the evidence from the data context.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(level=>{const qs=practice.filter(q=>q.level===level),n=qs.filter(q=>state.answers[q.id]===q.answer).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit ticket.":"Use the level pattern to select a targeted review block.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 1.6 Linear Modeling & Residual Thinking","Exported: "+new Date().toLocaleString(),""];practice.forEach(q=>{lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_1.6_Linear_Modeling_Residual_Thinking.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());document.documentElement.dataset.lessonReady="true";
  })();
  </script>
</body>
</html>

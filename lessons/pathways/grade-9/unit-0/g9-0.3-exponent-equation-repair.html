  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-0.3-exponents-equations-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Evaluate <span class="math" data-tex="2^4"></span>.',options:["8","12","16","24"],answer:2,solution:'<span class="math" data-tex="2^4=2\\cdot2\\cdot2\\cdot2=16"></span>.'},
      {id:"E2",level:"Easy",calc:false,prompt:'Simplify <span class="math" data-tex="x^3x^2"></span>.',options:["x⁶","x⁵","2x⁵","x"],answer:1,solution:'Same base in a product: <span class="math" data-tex="x^{3+2}=x^5"></span>.'},
      {id:"E3",level:"Easy",calc:false,prompt:'Solve <span class="math" data-tex="x+7=12"></span>.',options:["-5","3","5","19"],answer:2,solution:'Subtract 7 from both sides: <span class="math" data-tex="x=5"></span>.'},
      {id:"E4",level:"Easy",calc:false,prompt:'Solve <span class="math" data-tex="3x=21"></span>.',options:["3","6","7","18"],answer:2,solution:'Divide both sides by 3: <span class="math" data-tex="x=7"></span>.'},
      {id:"M1",level:"Medium",calc:false,prompt:'For <span class="math" data-tex="b\\ne0"></span>, evaluate <span class="math" data-tex="b^0"></span>.',options:["0","1","b","undefined"],answer:1,solution:'<span class="math" data-tex="b^0=1"></span> for every nonzero base.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Evaluate <span class="math" data-tex="2^{-3}"></span>.',options:["-8","-6","1/6","1/8"],answer:3,solution:'<span class="math" data-tex="2^{-3}=\\frac1{2^3}=\\frac18"></span>.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Simplify <span class="math" data-tex="(a^2)^3"></span>.',options:["a⁵","a⁸","a⁶","3a²"],answer:2,solution:'A power of a power multiplies exponents: <span class="math" data-tex="a^{2\\cdot3}=a^6"></span>.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="\\frac y4-3=2"></span>.',options:["-4","5","8","20"],answer:3,solution:'Add 3: <span class="math" data-tex="y/4=5"></span>. Multiply by 4: <span class="math" data-tex="y=20"></span>.'},
      {id:"M5",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="-3x+5=17"></span>.',options:["-4","-22/3","4","22/3"],answer:0,solution:'<span class="math" data-tex="-3x=12"></span>, so <span class="math" data-tex="x=-4"></span>.'},
      {id:"M6",level:"Medium",calc:false,prompt:'Does <span class="math" data-tex="x=-2"></span> solve <span class="math" data-tex="4x+3=-5"></span>?',options:["Yes; both sides equal -5","Yes; both sides equal 5","No; left side is -11","No; left side is 11"],answer:0,solution:'Substitute: <span class="math" data-tex="4(-2)+3=-8+3=-5"></span>, matching the right side.'},
      {id:"H1",level:"Hard",calc:false,prompt:'For <span class="math" data-tex="x\\ne0"></span>, simplify <span class="math" data-tex="\\frac{x^7}{x^3}"></span>.',options:["x¹⁰","x⁴","x²¹","1/x⁴"],answer:1,solution:'Same base in a quotient: <span class="math" data-tex="x^{7-3}=x^4"></span>.'},
      {id:"H2",level:"Hard",calc:false,prompt:'Simplify <span class="math" data-tex="(2m^3)^2"></span>.',options:["2m⁵","2m⁶","4m⁶","4m⁵"],answer:2,solution:'Square the coefficient and multiply exponents: <span class="math" data-tex="2^2m^{3\\cdot2}=4m^6"></span>.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="3(2^x)=24"></span> by recognizing equal powers.',options:["x=2","x=3","x=4","x=8"],answer:1,solution:'Divide by 3: <span class="math" data-tex="2^x=8=2^3"></span>, so <span class="math" data-tex="x=3"></span>.'},
      {id:"H4",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="\\frac{x-5}{3}=-4"></span>.',options:["-7","-1","7","17"],answer:0,solution:'Multiply by 3: <span class="math" data-tex="x-5=-12"></span>. Add 5: <span class="math" data-tex="x=-7"></span>.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="7-2x=-9"></span>.',options:["-8","-1","1","8"],answer:3,solution:'Subtract 7: <span class="math" data-tex="-2x=-16"></span>. Divide by -2: <span class="math" data-tex="x=8"></span>.'},
      {id:"H6",level:"Hard",calc:false,prompt:'Which step correctly follows from <span class="math" data-tex="-4x=20"></span>?',options:["x=24","x=16","x=-5","x=-16"],answer:2,solution:'Divide both sides by -4: <span class="math" data-tex="x=20/(-4)=-5"></span>.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'Evaluate <span class="math" data-tex="2^5\\cdot2^{-3}"></span>.',options:["1/4","4","8","256"],answer:1,solution:'<span class="math" data-tex="2^{5+(-3)}=2^2=4"></span>.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'Simplify <span class="math" data-tex="\\frac{3^{n+1}}{3^{n-2}}"></span>.',options:["3⁻¹","3","27","3²ⁿ⁻¹"],answer:2,solution:'Subtract exponents carefully: <span class="math" data-tex="(n+1)-(n-2)=3"></span>, so the expression is <span class="math" data-tex="3^3=27"></span>.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'Solve <span class="math" data-tex="0.4x-1.2=2"></span>.',options:["2","5","8","11"],answer:2,solution:'<span class="math" data-tex="0.4x=3.2"></span>, then <span class="math" data-tex="x=3.2/0.4=8"></span>.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'A student claims <span class="math" data-tex="q^0=0"></span>. Which repair is correct?',options:["q⁰=q","q⁰=1 for q≠0","q⁰ is always undefined","q⁰=-1"],answer:1,solution:'For <span class="math" data-tex="q\\ne0"></span>, <span class="math" data-tex="q^0=q^k/q^k=1"></span>. The restriction matters because division by zero is undefined.'}
    ];
    const slides=[];
    const add=(stage,title,body,cls="")=>slides.push({stage,title,body,cls});
    const head=(stage,title)=>'<div class="slide-head"><div><p class="eyebrow">'+stage+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';
    const reveal=(label,body)=>'<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';
    const section=(code,title,description)=>'<div class="section-banner"><div><p class="eyebrow">Concept development</p><h2 tabindex="-1">'+title+'</h2><p class="lead">'+description+'</p><p><span class="badge">Diagnostic / repair depth</span><span class="badge">No calculator</span></p></div><div class="section-code" aria-hidden="true">'+code+'</div></div>';
    const balanceSvg=()=>'<svg class="balance" viewBox="0 0 720 280" role="img" aria-labelledby="bal-title bal-desc"><title id="bal-title">Balanced equation model</title><desc id="bal-desc">A balanced scale shows x plus three blocks on the left and eight blocks on the right, representing x plus 3 equals 8.</desc><line class="bal-line" x1="130" y1="105" x2="590" y2="105"/><path class="bal-pan" d="M95 112h190l-28 80H123z"/><path class="bal-pan" d="M435 112h190l-28 80H463z"/><line class="bal-line" x1="360" y1="105" x2="360" y2="225"/><path class="bal-line" d="M300 230h120"/><rect class="bal-block" x="140" y="135" width="52" height="38" rx="7"/><text class="bal-text" x="158" y="161">x</text><text class="bal-text" x="207" y="161">+ 3</text><text class="bal-text" x="505" y="161">8</text></svg>';
    function qCard(q){return '<div class="question-layout"><div class="question-box"><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?'calc':'')+'">'+(q.calc?'Calculator optional':'No calculator')+'</span><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map((o,i)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>').join('')+'</div><button class="check-button" type="button" data-check="'+q.id+'">Check response</button><p class="feedback" id="feedback-'+q.id+'" aria-live="polite"></p>'+reveal('Reveal verified solution','<p><strong>Answer '+String.fromCharCode(65+q.answer)+'.</strong> '+q.solution+'</p>')+'</div><aside class="side-note"><label for="work-'+q.id+'"><strong>Show the law or inverse step</strong></label><textarea class="scratch" id="work-'+q.id+'" data-save="work-'+q.id+'" placeholder="Record exact reasoning and a check."></textarea><p><strong>Audit</strong></p><ul><li>Base and exponent</li><li>Operation on both sides</li><li>Restrictions</li><li>Substitution check</li></ul></aside></div>'}

    add("Launch","Exponent and Equation Repair",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Lesson 0.3 · AP Precalculus Readiness</p><h1 tabindex="-1">Exponent and Equation Repair</h1><p class="lead">Secure the exponent rules and foundational equation habits that later function work assumes—then prove every solution by substitution.</p><button class="cta" type="button" data-go="1">Begin the lesson →</button></div><div class="power-art" aria-label="Exponent and equation structure"><div><span class="math" data-tex="a^{-n}=\\frac1{a^n}"></span><small>rules with reasons</small></div></div></div>','cover');
    add("Orient","Learning outcomes",head("Orient","What you will know and do")+'<div class="grid three"><article class="card"><strong class="big">1</strong><h3>Apply</h3><p>Apply core integer exponent laws, including zero and negative exponents.</p></article><article class="card"><strong class="big">2</strong><h3>Solve</h3><p>Solve foundational one- and two-step equations using inverse operations.</p></article><article class="card"><strong class="big">3</strong><h3>Verify</h3><p>Check solutions by substitution and explain why an invalid step fails.</p></article></div>');
    add("Orient","Success criteria",head("Orient","Mastery is lawful, reversible, and verified")+'<div class="grid"><div class="card tint"><h3>By the exit ticket, I can…</h3><ul><li>name the exponent law used;</li><li>maintain equality by acting on both sides;</li><li>reach at least 16 of 20 on differentiated practice;</li><li>verify a solution and diagnose one invalid step.</li></ul></div><div class="card gold"><h3>Coverage boundary</h3><p>Rational exponents are deferred to Units 6–7. Full multi-step equations and identity/contradiction cases are deferred to Unit 1.</p></div></div>');
    add("Plan","Three-period learning sequence",head("Plan","A focused diagnostic-and-repair cycle")+'<div class="grid three"><article class="card"><span class="badge">Period 1</span><h3>Exponent laws</h3><p>Positive, zero, and negative integer exponents with restrictions.</p></article><article class="card"><span class="badge">Period 2</span><h3>Equation balance</h3><p>One- and two-step inverse operations with exact notation.</p></article><article class="card"><span class="badge">Period 3</span><h3>Verify and transfer</h3><p>Error analysis, differentiated practice, and mastery evidence.</p></article></div><p class="callout warning"><strong>Maximum pacing:</strong> three periods. Repair is targeted; the full Unit 1 equation sequence remains separate.</p>');
    add("Retrieve","Prerequisite retrieval",head("Retrieve","Activate multiplication and inverse operations")+'<div class="grid"><div class="card"><h3>Mental warm-up</h3><ol><li><span class="math" data-tex="3\\cdot3\\cdot3"></span></li><li><span class="math" data-tex="18\\div6"></span></li><li>Undo <span class="math" data-tex="+7"></span></li><li>Undo <span class="math" data-tex="\\times(-4)"></span></li></ol></div><div class="card maroon"><h3>Predict the fragile step</h3><p>Which deserves your closest check: exponent arithmetic, a negative divisor, or substitution?</p><textarea class="scratch" data-save="retrieval-prediction" aria-label="Retrieval prediction"></textarea></div></div>'+reveal('Check retrieval','<p><span class="math" data-tex="27,\\;3,\\;-7,\\;\\div(-4)"></span>.</p>'));
    add("Retrieve","Worked retrieval",head("Worked example","Repeated multiplication defines a positive exponent")+'<div class="step-list"><div class="step"><span class="math" data-tex="5^3"></span> means three factors of 5.</div><div class="step"><span class="math" data-tex="5^3=5\\cdot5\\cdot5=125"></span>.</div><div class="step">The exponent counts factors; it does not mean <span class="math" data-tex="5\\cdot3"></span>.</div><div class="step">Estimate: a power greater than one grows, so 125 is plausible.</div></div>');
    add("Student Turn","Retrieval check",head("Student Turn","Translate before calculating")+'<div class="question-box"><p class="question-prompt">Write <span class="math" data-tex="(-2)^4"></span> as repeated multiplication and evaluate.</p><textarea class="scratch" data-save="warmup-work" aria-label="Warm-up work"></textarea>'+reveal('Reveal answer','<p><span class="math" data-tex="(-2)(-2)(-2)(-2)=16"></span>. The negative base is grouped.</p>')+'</div>');
    add("Habits","The repair loop",head("Habits","Name → apply → restrict → verify")+'<div class="flow"><span>Name the law</span><b>→</b><span>Apply exactly</span><b>→</b><span>State restrictions</span><b>→</b><span>Verify equivalence</span></div><p class="callout success">A short correct reason is stronger than an unexplained string of symbols.</p>');

    add("Exponent laws","Positive integer exponent laws",section("a^m","Positive integer exponent laws","The laws follow from counting identical factors. They apply only when the bases and operations match the rule."));
    add("Exponent laws","Law map",head("Concept","Three core structures")+'<div class="law-grid"><article class="law"><strong>Product</strong><span class="math" data-tex="a^ma^n=a^{m+n}"></span></article><article class="law"><strong>Quotient</strong><span class="math" data-tex="\\frac{a^m}{a^n}=a^{m-n},\\;a\\ne0"></span></article><article class="law"><strong>Power of a power</strong><span class="math" data-tex="(a^m)^n=a^{mn}"></span></article></div><p class="callout">Add exponents for a product, subtract for a quotient, and multiply for a power of a power.</p>');
    add("Exponent laws","Worked example",head("Worked example","Separate coefficient and variable structure")+'<div class="step-list"><div class="step">Simplify <span class="math" data-tex="(3x^2)^3"></span>.</div><div class="step">Power the coefficient: <span class="math" data-tex="3^3=27"></span>.</div><div class="step">Power of a power: <span class="math" data-tex="(x^2)^3=x^6"></span>.</div><div class="step">Result: <span class="math" data-tex="27x^6"></span>.</div></div>');
    add("Student Turn","Exponent-law turn",head("Student Turn","Use two laws in sequence")+'<div class="question-box"><p class="question-prompt">For <span class="math" data-tex="y\\ne0"></span>, simplify <span class="math" data-tex="\\frac{y^8y^2}{y^3}"></span>.</p><textarea class="scratch" data-save="law-turn" aria-label="Exponent-law student work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="y^{8+2-3}=y^7"></span>. Expanded-factor counting confirms seven uncancelled factors.</p>')+'</div>');
    add("Misconception","Exponent-law misconception",head("Misconception check","Laws depend on the operation")+'<div class="grid"><div class="card maroon"><h3>Not valid</h3><p><span class="math" data-tex="x^2+x^3\\ne x^5"></span></p><p>The product law cannot be used across addition.</p></div><div class="card tint"><h3>Valid contrast</h3><p><span class="math" data-tex="x^2x^3=x^5"></span></p><p>Identical bases are multiplied.</p></div></div>');
    add("Checkpoint","Exponent-law evidence",head("Checkpoint","Choose the law from structure")+'<div class="grid three"><article class="card"><p><span class="math" data-tex="z^4z^5=z^9"></span></p><p>Product law</p></article><article class="card"><p><span class="math" data-tex="z^9/z^4=z^5"></span></p><p>Quotient law</p></article><article class="card"><p><span class="math" data-tex="(z^4)^5=z^{20}"></span></p><p>Power-of-a-power law</p></article></div>');

    add("Zero & negative","Zero and negative exponents",section("a^0","Zero and negative exponents","Extend the integer-exponent pattern while preserving quotient consistency. Restrictions protect against division by zero."));
    add("Zero & negative","Pattern and reciprocal",head("Concept","Continue the factor-of-a pattern")+'<div class="flow"><span><span class="math" data-tex="a^2"></span></span><b>÷a</b><span><span class="math" data-tex="a^1"></span></span><b>÷a</b><span><span class="math" data-tex="a^0=1"></span></span><b>÷a</b><span><span class="math" data-tex="a^{-1}=1/a"></span></span></div><p class="callout warning"><span class="math" data-tex="a^0=1"></span> and <span class="math" data-tex="a^{-n}=1/a^n"></span> require <span class="math" data-tex="a\\ne0"></span>.</p>');
    add("Zero & negative","Worked example",head("Worked example","Move factors—not terms")+'<div class="step-list"><div class="step">Rewrite <span class="math" data-tex="\\frac{6x^{-2}}{y^{-3}}"></span> with positive exponents.</div><div class="step"><span class="math" data-tex="x^{-2}=1/x^2"></span>.</div><div class="step">Dividing by <span class="math" data-tex="y^{-3}"></span> multiplies by <span class="math" data-tex="y^3"></span>.</div><div class="step">Result: <span class="math" data-tex="\\frac{6y^3}{x^2},\\;x\\ne0,\\;y\\ne0"></span>.</div></div>');
    add("Student Turn","Zero-negative turn",head("Student Turn","Rewrite with positive exponents")+'<div class="question-box"><p class="question-prompt">For nonzero <span class="math" data-tex="a,b"></span>, rewrite <span class="math" data-tex="a^{-3}b^0"></span>.</p><textarea class="scratch" data-save="negative-turn" aria-label="Negative-exponent student work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="b^0=1"></span> and <span class="math" data-tex="a^{-3}=1/a^3"></span>, so the expression is <span class="math" data-tex="1/a^3"></span>.</p>')+'</div>');
    add("Misconception","Negative-exponent misconception",head("Misconception check","A negative exponent does not make a negative value")+'<div class="grid"><div class="card maroon"><p><span class="math" data-tex="2^{-3}\\ne-8"></span></p><p>The sign belongs to the exponent, not the resulting value.</p></div><div class="card tint"><p><span class="math" data-tex="2^{-3}=1/2^3=1/8"></span></p><p>The exponent signals a reciprocal.</p></div></div>');
    add("Checkpoint","Zero-negative evidence",head("Checkpoint","Audit restrictions")+'<div class="card gold"><p><span class="math" data-tex="\\frac{t^4}{t^4}=t^0=1"></span> only when <span class="math" data-tex="t\\ne0"></span>.</p><p>If <span class="math" data-tex="t=0"></span>, the original quotient is <span class="math" data-tex="0/0"></span>, which is undefined—not 1.</p></div>');

    add("One-step equations","One-step equations",section("x+3=8","One-step equations","An equation is a balance. Use one inverse operation on both sides, then verify the candidate solution."));
    add("One-step equations","Balance model",head("Concept","Equality survives equal operations")+balanceSvg()+'<p class="lead">From <span class="math" data-tex="x+3=8"></span>, subtract 3 from both sides: <span class="math" data-tex="x=5"></span>. The balance is preserved.</p>');
    add("One-step equations","Worked example",head("Worked example","Division reverses multiplication")+'<div class="step-list"><div class="step">Solve <span class="math" data-tex="-6x=42"></span>.</div><div class="step">Divide both sides by -6.</div><div class="step"><span class="math" data-tex="x=42/(-6)=-7"></span>.</div><div class="step">Check: <span class="math" data-tex="-6(-7)=42"></span>.</div></div>');
    add("Student Turn","One-step turn",head("Student Turn","Keep exact fractions")+'<div class="question-box"><p class="question-prompt">Solve and verify <span class="math" data-tex="\\frac x5=-\\frac32"></span>.</p><textarea class="scratch" data-save="one-step-turn" aria-label="One-step equation work"></textarea>'+reveal('Reveal verified steps','<p>Multiply both sides by 5: <span class="math" data-tex="x=-15/2"></span>. Check: <span class="math" data-tex="(-15/2)/5=-15/10=-3/2"></span>.</p>')+'</div>');
    add("Misconception","One-step misconception",head("Misconception check","Moving a term is shorthand, not magic")+'<div class="grid"><div class="card maroon"><h3>Incomplete language</h3><p>“The 7 moves across and changes sign.”</p></div><div class="card tint"><h3>Valid reason</h3><p>Subtract 7 from both sides. The inverse pair <span class="math" data-tex="+7-7"></span> becomes zero, preserving equality.</p></div></div>');
    add("Checkpoint","One-step evidence",head("Checkpoint","Match operation to inverse")+'<div class="law-grid"><article class="law"><strong><span class="math" data-tex="x-9=4"></span></strong>Add 9</article><article class="law"><strong><span class="math" data-tex="7x=-21"></span></strong>Divide by 7</article><article class="law"><strong><span class="math" data-tex="x/6=5"></span></strong>Multiply by 6</article></div>');

    add("Two-step equations","Two-step equations",section("ax+b=c","Two-step equations","Undo operations in reverse order: remove the additive term, then undo the coefficient. Preserve signs and exact values."));
    add("Two-step equations","Reverse the operation chain",head("Concept","Unwrap from the outside")+'<div class="flow"><span><span class="math" data-tex="x"></span></span><b>×a</b><span><span class="math" data-tex="ax"></span></span><b>+b</b><span><span class="math" data-tex="ax+b"></span></span></div><div class="flow"><span><span class="math" data-tex="c"></span></span><b>−b</b><span><span class="math" data-tex="c-b"></span></span><b>÷a</b><span><span class="math" data-tex="x=(c-b)/a"></span></span></div>');
    add("Two-step equations","Worked example",head("Worked example","Track a negative coefficient")+'<div class="step-list"><div class="step">Solve <span class="math" data-tex="5-3x=20"></span>.</div><div class="step">Subtract 5: <span class="math" data-tex="-3x=15"></span>.</div><div class="step">Divide by -3: <span class="math" data-tex="x=-5"></span>.</div><div class="step">Check: <span class="math" data-tex="5-3(-5)=5+15=20"></span>.</div></div>');
    add("Student Turn","Two-step turn",head("Student Turn","Solve, then substitute")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="\\frac x3+4=-2"></span>.</p><textarea class="scratch" data-save="two-step-turn" aria-label="Two-step equation work"></textarea>'+reveal('Reveal verified steps','<p>Subtract 4: <span class="math" data-tex="x/3=-6"></span>. Multiply by 3: <span class="math" data-tex="x=-18"></span>. Check: <span class="math" data-tex="-18/3+4=-6+4=-2"></span>.</p>')+'</div>');
    add("Misconception","Two-step misconception",head("Misconception check","Undo terms—not visual positions")+'<div class="grid"><div class="card maroon"><p>From <span class="math" data-tex="2x+7=19"></span>, writing <span class="math" data-tex="2x=19+7"></span> is invalid.</p></div><div class="card tint"><p>Subtract 7 from both sides: <span class="math" data-tex="2x=19-7=12"></span>, then <span class="math" data-tex="x=6"></span>.</p></div></div>');
    add("Checkpoint","Two-step evidence",head("Checkpoint","Predict the sign before finishing")+'<div class="card gold"><p>For <span class="math" data-tex="-4x+3=15"></span>, subtracting 3 gives <span class="math" data-tex="-4x=12"></span>. A negative coefficient equals a positive number, so <span class="math" data-tex="x"></span> must be negative: <span class="math" data-tex="x=-3"></span>.</p></div>');

    add("Verification","Checking solutions and invalid steps",section("✓","Checking solutions and invalid steps","A solution is a value that makes the original equation true. Substitute into the original—not only the last transformed line."));
    add("Verification","Truth-value check",head("Concept","A candidate becomes evidence after substitution")+'<div class="grid"><div class="card"><h3>Original</h3><p><span class="math" data-tex="3x-4=11"></span></p></div><div class="card tint"><h3>Candidate <span class="math" data-tex="x=5"></span></h3><p><span class="math" data-tex="3(5)-4=15-4=11"></span></p><p><strong>True:</strong> the candidate is a solution.</p></div></div>');
    add("Verification","Worked example",head("Worked example","Locate the first invalid step")+'<div class="step-list"><div class="step">Student: <span class="math" data-tex="-2x+7=15"></span>.</div><div class="step">Student writes <span class="math" data-tex="-2x=22"></span>. This is the first invalid step.</div><div class="step">Subtracting 7 should give <span class="math" data-tex="-2x=8"></span>.</div><div class="step">Therefore <span class="math" data-tex="x=-4"></span>; check: <span class="math" data-tex="-2(-4)+7=15"></span>.</div></div>');
    add("Student Turn","Verification turn",head("Student Turn","Audit a proposed solution")+'<div class="question-box"><p class="question-prompt">A student says <span class="math" data-tex="x=6"></span> solves <span class="math" data-tex="4-2x=-8"></span>. Verify or reject the claim.</p><textarea class="scratch" data-save="verify-turn" aria-label="Verification student work"></textarea>'+reveal('Reveal verified check','<p><span class="math" data-tex="4-2(6)=4-12=-8"></span>. The statement is true, so <span class="math" data-tex="x=6"></span> is a solution.</p>')+'</div>');
    add("Misconception","Verification misconception",head("Misconception check","Checking is not repeating the same algebra")+'<div class="grid"><div class="card maroon"><h3>Weak check</h3><p>Read the final line again or repeat the same potentially faulty steps.</p></div><div class="card tint"><h3>Independent check</h3><p>Substitute the candidate into the untouched original equation and evaluate both sides separately.</p></div></div>');
    add("Checkpoint","Verification evidence",head("Checkpoint","Classify the invalid step")+'<div class="law-grid"><article class="law"><strong>Equality error</strong>Different operations were applied to the two sides.</article><article class="law"><strong>Sign error</strong>A negative coefficient or subtraction was mishandled.</article><article class="law"><strong>Exponent error</strong>A law was used across the wrong operation or without a restriction.</article></div>');

    add("Mastery","Practice evidence",head("Mastery evidence","Score the differentiated set")+'<div class="grid"><div class="card"><button class="check-button" id="scoreBtn" type="button">Score all 20 responses</button><p class="lead" id="scoreSummary" aria-live="polite">Complete the set, then score your evidence.</p></div><div class="mastery"><div><strong data-level-score="Easy">—</strong>Easy / 4</div><div><strong data-level-score="Medium">—</strong>Medium / 6</div><div><strong data-level-score="Hard">—</strong>Hard / 6</div><div><strong data-level-score="Challenge">—</strong>Challenge / 4</div><div><strong id="totalScore">—</strong>Total / 20</div></div></div>');
    add("Error analysis","Repair one invalid step",head("Error analysis","Convert an error into a precise rule")+'<div class="grid"><div class="card"><label for="errorAnalysis"><strong>Name the first invalid step, explain the violated law, correct it, and verify.</strong></label><textarea class="scratch" id="errorAnalysis" data-save="error-analysis"></textarea></div><div class="card gold"><h3>Strong evidence includes</h3><ul><li>the original structure;</li><li>the exact law or inverse operation;</li><li>any nonzero restriction;</li><li>an independent substitution check.</li></ul></div></div>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","These habits support every function unit")+'<div class="grid three"><article class="card"><h3>Equivalent forms</h3><p>Exponent laws allow polynomial, rational, exponential, and logarithmic expressions to be compared.</p></article><article class="card"><h3>Parameter equations</h3><p>Inverse-operation discipline protects multi-representation function reasoning.</p></article><article class="card"><h3>Justification</h3><p>Substitution creates concise evidence that a value satisfies a model condition.</p></article></div><p class="callout success"><strong>Transfer:</strong> automate foundational steps so attention remains available for AP-level interpretation.</p>');
    add("Exit ticket","Exit ticket",head("Exit ticket","Produce final mastery evidence")+'<div class="question-box"><ol><li>Simplify <span class="math" data-tex="\\frac{p^6p^{-2}}{p^3}"></span> for <span class="math" data-tex="p\\ne0"></span>.</li><li>Rewrite <span class="math" data-tex="4^{-2}"></span> without a negative exponent.</li><li>Solve and check <span class="math" data-tex="-3x+2=20"></span>.</li><li>Explain why <span class="math" data-tex="r^2+r^3=r^5"></span> is invalid in general.</li></ol><textarea class="scratch" data-save="exit-ticket" aria-label="Exit ticket work"></textarea>'+reveal('Reveal exit-ticket key','<ol><li><span class="math" data-tex="p^{6-2-3}=p"></span>.</li><li><span class="math" data-tex="4^{-2}=1/4^2=1/16"></span>.</li><li><span class="math" data-tex="-3x=18\\Rightarrow x=-6"></span>; check: <span class="math" data-tex="-3(-6)+2=20"></span>.</li><li>The product law applies to multiplication, not addition; the terms are unlike.</li></ol>')+'</div>');

    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"]').forEach(input=>{if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>checkOne(b.dataset.check)));document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",()=>{state.fields.notebook=n.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(x=>x.id===id),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the law or inverse step.":"Not yet. Recheck the law, sign, restriction, or substitution.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(level=>{const qs=practice.filter(q=>q.level===level),n=qs.filter(q=>state.answers[q.id]===q.answer).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit ticket.":"Use the level pattern to select a targeted repair block.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 0.3 Exponent and Equation Repair","Exported: "+new Date().toLocaleString(),""];practice.forEach(q=>{lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_0.3_Exponent_Equation_Repair.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());document.documentElement.dataset.lessonReady="true";
  })();
  </script>
</body>
</html>

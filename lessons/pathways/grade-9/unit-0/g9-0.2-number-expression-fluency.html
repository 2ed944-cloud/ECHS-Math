    .section-banner{display:grid;grid-template-columns:1fr auto;align-items:center;gap:28px;min-height:55vh}.section-code{width:160px;height:160px;border-radius:35px;display:grid;place-items:center;background:linear-gradient(145deg,var(--maroon),var(--navy));color:#fff;font-size:4rem;font-weight:950;box-shadow:var(--shadow)}.numberline{width:100%;max-width:760px;height:auto;border:1px solid var(--line);border-radius:16px;background:#fff}.nl-axis{stroke:var(--navy);stroke-width:3}.nl-tick{stroke:#7990a3;stroke-width:2}.nl-arrow{stroke:var(--maroon);stroke-width:6;fill:none}.nl-dot{fill:var(--gold);stroke:#fff;stroke-width:3}.nl-text{font:15px Inter,Arial,sans-serif;fill:#334f66}.flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;margin:24px 0}.flow span{padding:15px 18px;border-radius:14px;background:#f1f6f7;border:1px solid var(--line);font-weight:900;color:var(--navy)}.flow b{color:var(--maroon);font-size:1.5rem}.step-list{counter-reset:step;display:grid;gap:12px}.step{position:relative;padding:14px 16px 14px 58px;border:1px solid var(--line);border-radius:14px;background:#fff}.step:before{counter-increment:step;content:counter(step);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-weight:900}

    .footerbar{height:62px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:0 clamp(14px,3vw,38px);background:#fff;border-top:1px solid var(--line);position:relative;z-index:20}.nav{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--navy);padding:9px 16px;font-weight:900}.nav:disabled{opacity:.4}.progress{height:9px;border-radius:999px;background:#e5ebee;overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--maroon),var(--teal),var(--gold));transition:width .3s}.counter{font-weight:900;color:var(--navy);min-width:72px;text-align:center}.drawer{position:fixed;z-index:50;top:0;right:0;width:min(420px,92vw);height:100%;background:#fff;box-shadow:-15px 0 45px #102a4330;padding:22px;transform:translateX(105%);transition:transform .25s;overflow:auto}.drawer.open{transform:none}.drawer-head{display:flex;justify-content:space-between;align-items:center}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.map button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px}.map button.current{background:var(--maroon);color:#fff}.backdrop{position:fixed;z-index:40;inset:0;background:#102a4366}.toast{position:fixed;z-index:70;left:50%;bottom:78px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}

  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-0.2-fluency-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Evaluate <span class="math" data-tex="-9+14"></span>.',options:["-23","-5","5","23"],answer:2,solution:'Move 14 units right from -9: <span class="math" data-tex="-9+14=5"></span>.'},
      {id:"E2",level:"Easy",calc:false,prompt:'Which chain is equivalent to <span class="math" data-tex="\\frac35"></span>?',options:["0.3 = 30%","0.5 = 50%","0.6 = 60%","0.8 = 80%"],answer:2,solution:'<span class="math" data-tex="3\\div5=0.6"></span>, and <span class="math" data-tex="0.6\\times100\\%=60\\%"></span>.'},
      {id:"E3",level:"Easy",calc:false,prompt:'Evaluate <span class="math" data-tex="18-2(4)"></span>.',options:["10","16","64","72"],answer:0,solution:'Multiply before subtracting: <span class="math" data-tex="18-8=10"></span>.'},
      {id:"E4",level:"Easy",calc:false,prompt:'Simplify <span class="math" data-tex="5x+2x"></span>.',options:["7","7x","7x²","10x"],answer:1,solution:'Both terms have the factor <span class="math" data-tex="x"></span>: <span class="math" data-tex="(5+2)x=7x"></span>.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Evaluate <span class="math" data-tex="-4(3)-(-5)"></span>.',options:["-17","-7","7","17"],answer:1,solution:'<span class="math" data-tex="-12-(-5)=-12+5=-7"></span>.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Write <span class="math" data-tex="1.25"></span> as a fraction and percent.',options:["1/4 and 25%","4/5 and 80%","5/4 and 125%","5/2 and 250%"],answer:2,solution:'<span class="math" data-tex="1.25=\\frac{125}{100}=\\frac54=125\\%"></span>.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Evaluate <span class="math" data-tex="\\frac{24}{3(2+2)}"></span>.',options:["1/2","2","8","32"],answer:1,solution:'The denominator is <span class="math" data-tex="3(4)=12"></span>, so <span class="math" data-tex="24\\div12=2"></span>.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Simplify <span class="math" data-tex="3(2x-5)+4"></span>.',options:["6x-19","6x-11","6x-1","10x-15"],answer:1,solution:'Distribute, then combine constants: <span class="math" data-tex="6x-15+4=6x-11"></span>.'},
      {id:"M5",level:"Medium",calc:false,prompt:'Simplify <span class="math" data-tex="7a-3+2a+8"></span>.',options:["9a+5","9a+11","9a²+5","14a+5"],answer:0,solution:'Group like terms: <span class="math" data-tex="(7a+2a)+(-3+8)=9a+5"></span>.'},
      {id:"M6",level:"Medium",calc:false,prompt:'For <span class="math" data-tex="x=-2"></span>, evaluate <span class="math" data-tex="2x^2-3x+1"></span>.',options:["3","7","11","15"],answer:3,solution:'Use parentheses: <span class="math" data-tex="2(-2)^2-3(-2)+1=8+6+1=15"></span>.'},
      {id:"H1",level:"Hard",calc:false,prompt:'Compute <span class="math" data-tex="\\frac34-(-\\frac56)"></span>.',options:["-1/12","1/12","19/12","7/4"],answer:2,solution:'Subtracting a negative adds: <span class="math" data-tex="\\frac9{12}+\\frac{10}{12}=\\frac{19}{12}"></span>.'},
      {id:"H2",level:"Hard",calc:false,prompt:'Find <span class="math" data-tex="35\\%"></span> of 240.',options:["72","80","84","96"],answer:2,solution:'<span class="math" data-tex="0.35(240)=84"></span>.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Evaluate <span class="math" data-tex="-2^2+3(-2)"></span>.',options:["-14","-10","-2","10"],answer:1,solution:'The exponent applies before the leading negative: <span class="math" data-tex="-(2^2)-6=-4-6=-10"></span>.'},
      {id:"H4",level:"Hard",calc:false,prompt:'Simplify <span class="math" data-tex="-4(2x-3)+5(x+1)"></span>.',options:["-13x+17","-3x+7","-3x+17","3x+17"],answer:2,solution:'<span class="math" data-tex="-8x+12+5x+5=-3x+17"></span>.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Simplify <span class="math" data-tex="\\frac12(6y-8)-2(y+3)"></span>.',options:["y-10","y+2","5y-10","5y+2"],answer:0,solution:'<span class="math" data-tex="3y-4-2y-6=y-10"></span>.'},
      {id:"H6",level:"Hard",calc:false,prompt:'Which expression is equivalent to <span class="math" data-tex="4(3x-2)-2(x+5)"></span>?',options:["10x-18","10x+2","14x-18","14x+2"],answer:0,solution:'<span class="math" data-tex="12x-8-2x-10=10x-18"></span>.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'Simplify <span class="math" data-tex="k(-3+5)-2(k-4)"></span>.',options:["-4k+8","2k+8","8","0"],answer:2,solution:'<span class="math" data-tex="2k-2k+8=8"></span>. The variable terms cancel exactly.'},
      {id:"C2",level:"Challenge",calc:true,prompt:'A value decreases by 20% and then increases by 25%. Compared with the original value, the result is…',options:["5% less","unchanged","5% greater","45% greater"],answer:1,solution:'Use multipliers: <span class="math" data-tex="0.80(1.25)=1"></span>. The changes use different bases but cancel here.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'A student writes <span class="math" data-tex="-3(2x-5)=-6x-15"></span>. Which correction is valid?',options:["Only -3 multiplies 2x","The result is -6x+15","The result is 6x-15","The student is correct"],answer:1,solution:'The second product is <span class="math" data-tex="(-3)(-5)=+15"></span>, so the result is <span class="math" data-tex="-6x+15"></span>.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'Compute <span class="math" data-tex="49(18)+51(18)"></span> most efficiently.',options:["900","1600","1800","3600"],answer:2,solution:'Factor 18: <span class="math" data-tex="(49+51)18=100(18)=1800"></span>.'}
    ];
    const slides=[];
    const add=(stage,title,body,cls="")=>slides.push({stage,title,body,cls});
    const head=(stage,title)=>'<div class="slide-head"><div><p class="eyebrow">'+stage+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';
    const reveal=(label,body)=>'<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';
    const lineSvg=()=>'<svg class="numberline" viewBox="0 0 760 190" role="img" aria-labelledby="nl-title nl-desc"><title id="nl-title">Signed-number movement</title><desc id="nl-desc">A number line from negative six to positive six showing a start at negative four and a move seven units right to positive three.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7a1734"/></marker></defs><line class="nl-axis" x1="70" y1="110" x2="690" y2="110"/>'+Array.from({length:13},(_,i)=>'<line class="nl-tick" x1="'+(70+i*51.67)+'" y1="98" x2="'+(70+i*51.67)+'" y2="122"/><text class="nl-text" x="'+(64+i*51.67)+'" y="145">'+(i-6)+'</text>').join('')+'<circle class="nl-dot" cx="173.3" cy="110" r="9"/><path class="nl-arrow" d="M173 82 Q355 25 535 82" marker-end="url(#arrow)"/><text class="nl-text" x="300" y="42">+7</text></svg>';
    const section=(code,title,description)=>'<div class="section-banner"><div><p class="eyebrow">Concept development</p><h2 tabindex="-1">'+title+'</h2><p class="lead">'+description+'</p><p><span class="badge">Diagnostic / repair depth</span><span class="badge">No calculator</span></p></div><div class="section-code" aria-hidden="true">'+code+'</div></div>';
    function qCard(q){return '<div class="question-layout"><div class="question-box"><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?'calc':'')+'">'+(q.calc?'Calculator optional':'No calculator')+'</span><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map((o,i)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>').join('')+'</div><button class="check-button" type="button" data-check="'+q.id+'">Check response</button><p class="feedback" id="feedback-'+q.id+'" aria-live="polite"></p>'+reveal('Reveal verified solution','<p><strong>Answer '+String.fromCharCode(65+q.answer)+'.</strong> '+q.solution+'</p>')+'</div><aside class="side-note"><label for="work-'+q.id+'"><strong>Show structure</strong></label><textarea class="scratch" id="work-'+q.id+'" data-save="work-'+q.id+'" placeholder="Record exact steps and a check."></textarea><p><strong>Check routine</strong></p><ul><li>Signs</li><li>Operation order</li><li>Equivalent form</li><li>Reasonableness</li></ul></aside></div>'}

    add("Launch","Number and Expression Fluency",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Lesson 0.2 · AP Precalculus Readiness</p><h1 tabindex="-1">Number and Expression Fluency</h1><p class="lead">Use number sense and algebraic structure to evaluate accurately, represent rational numbers flexibly, and simplify without wasted steps.</p><button class="cta" type="button" data-go="1">Begin the lesson →</button></div><div class="expression-art" aria-label="Equivalent expressions"><div><span class="math" data-tex="3(2x-5)+4"></span><small>structure before speed</small></div></div></div>','cover');
    add("Orient","Learning outcomes",head("Orient","What you will know and do")+'<div class="grid three"><article class="card"><strong class="big">1</strong><h3>Evaluate</h3><p>Evaluate numerical and algebraic expressions accurately, including signed and rational values.</p></article><article class="card"><strong class="big">2</strong><h3>Represent</h3><p>Move fluently among fraction, decimal, and percent forms while preserving value.</p></article><article class="card"><strong class="big">3</strong><h3>Simplify</h3><p>Use order, distribution, and like-term structure to produce equivalent expressions.</p></article></div>');
    add("Orient","Success criteria",head("Orient","Mastery is accurate, explainable, and efficient")+'<div class="grid"><div class="card tint"><h3>By the exit ticket, I can…</h3><ul><li>reach at least 16 of 20 on differentiated practice;</li><li>show exact steps on every no-calculator item;</li><li>identify and repair a sign or structure misconception;</li><li>justify one efficient strategy.</li></ul></div><div class="card gold"><h3>Coverage boundary</h3><p>This bridge repairs routine expression fluency needed for algebra. It does not become a standalone number-theory or recurring-decimal unit.</p></div></div>');
    add("Plan","Three-period learning sequence",head("Plan","A focused diagnostic-and-repair cycle")+'<div class="grid three"><article class="card"><span class="badge">Period 1</span><h3>Number structure</h3><p>Signed operations, rational forms, and error diagnosis.</p></article><article class="card"><span class="badge">Period 2</span><h3>Expression structure</h3><p>Operation order, distribution, and like terms.</p></article><article class="card"><span class="badge">Period 3</span><h3>Transfer and mastery</h3><p>Differentiated practice, challenge, and AP-readiness transfer.</p></article></div><p class="callout warning"><strong>Maximum pacing:</strong> four periods only when evidence shows repair is still required.</p>');
    add("Retrieve","Prerequisite retrieval",head("Retrieve","Bring forward what you already know")+'<div class="grid"><div class="card"><h3>Mental warm-up</h3><ol><li><span class="math" data-tex="-7+12"></span></li><li><span class="math" data-tex="\\frac34"></span> as a decimal</li><li><span class="math" data-tex="5+2(6)"></span></li><li><span class="math" data-tex="4x+3x"></span></li></ol></div><div class="card maroon"><h3>Predict the fragile step</h3><p>Which is most likely to cause an error: a negative sign, an exponent, distribution, or unlike terms?</p><textarea class="scratch" data-save="retrieval-prediction" aria-label="Retrieval prediction"></textarea></div></div>'+reveal('Check retrieval','<p><span class="math" data-tex="5,\\;0.75,\\;17,\\;7x"></span>.</p>'));
    add("Retrieve","Worked retrieval",head("Worked example","Preserve the sign and the structure")+'<div class="grid"><div class="card maroon"><h3>Evaluate</h3><p class="formula"><span class="math" data-tex="-3^2+2(-4)"></span></p></div><div class="card"><div class="step-list"><div class="step">Exponent before the leading negative: <span class="math" data-tex="-3^2=-(3^2)=-9"></span>.</div><div class="step">Multiply: <span class="math" data-tex="2(-4)=-8"></span>.</div><div class="step">Combine: <span class="math" data-tex="-9+(-8)=-17"></span>.</div></div></div></div><p class="callout"><strong>Notation matters:</strong> <span class="math" data-tex="(-3)^2=9"></span>, but <span class="math" data-tex="-3^2=-9"></span>.</p>');
    add("Student Turn","Retrieval check",head("Student Turn","Make a first evidence point")+'<div class="question-box"><p class="question-prompt">Without a calculator, evaluate <span class="math" data-tex="2(-5)^2-7"></span>.</p><textarea class="scratch" data-save="warmup-work" aria-label="Warm-up work"></textarea>'+reveal('Reveal answer','<p><span class="math" data-tex="2(25)-7=50-7=43"></span>. Parentheses make the squared base negative five.</p>')+'</div>');
    add("Habits","The fluency loop",head("Habits","Read → structure → compute → verify")+'<div class="flow"><span>Read signs and grouping</span><b>→</b><span>Expose structure</span><b>→</b><span>Compute exactly</span><b>→</b><span>Verify equivalence</span></div><p class="callout success">Fluency means reliable choices with low cognitive load—not rushing or hiding reasoning.</p>');

    add("Signed numbers","Signed-number operations",section("±","Signed-number operations","Treat signs as information about direction and operation. Explain first; compress only after the meaning is secure."));
    add("Signed numbers","Meaning on a number line",head("Concept","Addition is directed movement")+lineSvg()+'<p class="lead"><span class="math" data-tex="-4+7=3"></span>: start at -4, then move seven units right. Subtracting a number means adding its opposite.</p>');
    add("Signed numbers","Worked example",head("Worked example","Separate multiplication from addition")+'<div class="step-list"><div class="step">Evaluate <span class="math" data-tex="-6-2(-5)"></span>.</div><div class="step">Multiply first: <span class="math" data-tex="2(-5)=-10"></span>.</div><div class="step">Subtract the negative: <span class="math" data-tex="-6-(-10)=-6+10=4"></span>.</div><div class="step">Check: the second term adds ten, so the result must exceed -6.</div></div>');
    add("Student Turn","Signed-number turn",head("Student Turn","Explain the sign change")+'<div class="question-box"><p class="question-prompt">Evaluate <span class="math" data-tex="-8+3(-4)-(-7)"></span>.</p><textarea class="scratch" data-save="signed-turn" aria-label="Signed-number student work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="-8-12+7=-13"></span>. The product is negative; subtracting -7 adds 7.</p>')+'</div>');
    add("Misconception","Signed-number misconception",head("Misconception check","Two negatives do not always make a positive")+'<div class="grid"><div class="card maroon"><h3>Unsafe shortcut</h3><p>“Two negatives make a positive.”</p></div><div class="card tint"><h3>Precise rule</h3><p>A product or quotient of two negative numbers is positive. Subtracting a negative means adding its opposite. Two adjacent negative terms in addition can remain negative.</p></div></div><p class="formula"><span class="math" data-tex="(-3)(-4)=12,\\quad -3-(-4)=1,\\quad -3+(-4)=-7"></span></p>');
    add("Checkpoint","Signed-number evidence",head("Checkpoint","Can you predict before computing?")+'<div class="grid"><div class="card"><h3>Predict</h3><p>Will <span class="math" data-tex="-12-3(-5)"></span> be negative, zero, or positive?</p></div><div class="card gold"><h3>Verify</h3><p><span class="math" data-tex="-12+15=3"></span>, so it is positive.</p><p>The prediction catches an incorrect result such as -27.</p></div></div>');

    add("Rational forms","Fractions, decimals, and percents",section("⅗","Equivalent rational forms","A fraction, decimal, and percent can name the same point. Convert by meaning, not by memorized arrows alone."));
    add("Rational forms","Equivalence map",head("Concept","Preserve the value while changing the form")+'<div class="flow"><span><span class="math" data-tex="\\frac38"></span></span><b>÷</b><span>0.375</span><b>×100%</b><span>37.5%</span></div><div class="grid"><div class="card"><h3>Fraction → decimal</h3><p>Divide numerator by denominator.</p></div><div class="card"><h3>Decimal → percent</h3><p>Multiply by 100 and attach %.</p></div></div>');
    add("Rational forms","Worked example",head("Worked example","Use a benchmark to check scale")+'<div class="step-list"><div class="step">Convert <span class="math" data-tex="\\frac7{20}"></span> to decimal and percent.</div><div class="step">Create hundredths: <span class="math" data-tex="\\frac7{20}=\\frac{35}{100}"></span>.</div><div class="step">Therefore <span class="math" data-tex="\\frac7{20}=0.35=35\\%"></span>.</div><div class="step">Check: <span class="math" data-tex="\\frac7{20}"></span> is below one-half, so 35% is plausible.</div></div>');
    add("Student Turn","Rational-form turn",head("Student Turn","Move both directions")+'<div class="question-box"><p class="question-prompt">Write <span class="math" data-tex="1.6"></span> as a simplified fraction and as a percent.</p><textarea class="scratch" data-save="rational-turn" aria-label="Rational-form student work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="1.6=\\frac{16}{10}=\\frac85=160\\%"></span>. Values greater than one correspond to percents greater than 100%.</p>')+'</div>');
    add("Misconception","Percent misconception",head("Misconception check","Percent change depends on its base")+'<div class="grid"><div class="card maroon"><h3>Tempting claim</h3><p>A 20% decrease and a 20% increase cancel.</p></div><div class="card tint"><h3>Counterexample</h3><p>Start with 100: <span class="math" data-tex="100(0.8)=80"></span>, then <span class="math" data-tex="80(1.2)=96"></span>. The second 20% uses a smaller base.</p></div></div>');
    add("Checkpoint","Rational-form evidence",head("Checkpoint","Choose the useful representation")+'<div class="grid three"><article class="card"><h3>Exact comparison</h3><p>Fractions often expose common denominators.</p></article><article class="card"><h3>Money and measurement</h3><p>Decimals often match the context.</p></article><article class="card"><h3>Relative change</h3><p>Percents communicate comparison per hundred.</p></article></div><p class="callout">The best form is the one that makes the next reasoning step clearer.</p>');

    add("Operation order","Order of operations",section("( )","Operation order","Grouping and exponents create structure. Multiplication/division share a level; addition/subtraction share a level and proceed left to right."));
    add("Operation order","The hierarchy",head("Concept","Grouping controls the expression tree")+'<div class="flow"><span>Grouping</span><b>→</b><span>Exponents</span><b>→</b><span>Multiply / divide</span><b>→</b><span>Add / subtract</span></div><p class="callout warning">At a shared level, work left to right. Multiplication does not always precede division.</p>');
    add("Operation order","Worked example",head("Worked example","Annotate before calculating")+'<div class="step-list"><div class="step">Evaluate <span class="math" data-tex="30\\div[2(4+1)]-2^2"></span>.</div><div class="step">Grouping: <span class="math" data-tex="4+1=5"></span>.</div><div class="step">Denominator product: <span class="math" data-tex="2(5)=10"></span>; exponent: <span class="math" data-tex="2^2=4"></span>.</div><div class="step">Finish: <span class="math" data-tex="30\\div10-4=3-4=-1"></span>.</div></div>');
    add("Student Turn","Operation-order turn",head("Student Turn","Use a substitution cage")+'<div class="question-box"><p class="question-prompt">For <span class="math" data-tex="a=-3"></span>, evaluate <span class="math" data-tex="2a^2-5a"></span>.</p><textarea class="scratch" data-save="order-turn" aria-label="Order-of-operations student work"></textarea>'+reveal('Reveal verified steps','<p>Write <span class="math" data-tex="2(-3)^2-5(-3)=18+15=33"></span>. Parentheses protect the substituted negative value.</p>')+'</div>');
    add("Misconception","Operation-order misconception",head("Misconception check","PEMDAS is not a one-way queue")+'<div class="grid"><div class="card maroon"><p><span class="math" data-tex="24\\div6(2)"></span></p><p>Multiplication and division have equal priority.</p></div><div class="card tint"><p>Proceed left to right: <span class="math" data-tex="24\\div6\\times2=4\\times2=8"></span>.</p><p>Extra grouping would change the expression and must be shown explicitly.</p></div></div>');
    add("Checkpoint","Operation-order evidence",head("Checkpoint","Spot the structural difference")+'<div class="grid"><div class="card"><p><span class="math" data-tex="-4^2=-16"></span></p><p>The exponent acts on 4 before the leading negative.</p></div><div class="card gold"><p><span class="math" data-tex="(-4)^2=16"></span></p><p>Parentheses make -4 the base.</p></div></div>');

    add("Distribution","Distributive property",section("a(b+c)","Distributive property","Distribution is multiplication across every term in a grouped sum or difference. It preserves equivalence and exposes structure."));
    add("Distribution","Area model",head("Concept","One factor scales every part")+'<div class="grid"><div class="card tint"><h3>Symbolic</h3><p class="formula"><span class="math" data-tex="a(b+c)=ab+ac"></span></p></div><div class="card gold"><h3>Area meaning</h3><p>A rectangle of height <span class="math" data-tex="a"></span> and total width <span class="math" data-tex="b+c"></span> has area <span class="math" data-tex="ab+ac"></span>.</p></div></div><p class="callout">The factor outside multiplies every term—including its sign.</p>');
    add("Distribution","Worked example",head("Worked example","Treat a negative factor as one object")+'<div class="step-list"><div class="step">Simplify <span class="math" data-tex="-3(2x-5)+4"></span>.</div><div class="step"><span class="math" data-tex="(-3)(2x)=-6x"></span>.</div><div class="step"><span class="math" data-tex="(-3)(-5)=+15"></span>.</div><div class="step">Result: <span class="math" data-tex="-6x+15+4=-6x+19"></span>.</div></div>');
    add("Student Turn","Distribution turn",head("Student Turn","Distribute, then verify")+'<div class="question-box"><p class="question-prompt">Simplify <span class="math" data-tex="5-2(3y+4)"></span>.</p><textarea class="scratch" data-save="distribution-turn" aria-label="Distribution student work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="5-6y-8=-6y-3"></span>. Check at <span class="math" data-tex="y=0"></span>: both original and simplified forms equal -3.</p>')+'</div>');
    add("Misconception","Distribution misconception",head("Misconception check","Distribute to every term—once")+'<div class="grid three"><article class="card maroon"><h3>Missed term</h3><p><span class="math" data-tex="2(x+3)\\ne2x+3"></span></p></article><article class="card maroon"><h3>Lost sign</h3><p><span class="math" data-tex="-(x-4)\\ne-x-4"></span></p></article><article class="card tint"><h3>Correct</h3><p><span class="math" data-tex="2(x+3)=2x+6"></span></p><p><span class="math" data-tex="-(x-4)=-x+4"></span></p></article></div>');
    add("Checkpoint","Distribution evidence",head("Checkpoint","Verify equivalence with a test value")+'<p class="lead">A test value cannot prove two expressions are equivalent for every input, but one mismatch can disprove equivalence immediately.</p><div class="card gold"><p>Test <span class="math" data-tex="3(2x-1)"></span> and <span class="math" data-tex="6x-1"></span> at <span class="math" data-tex="x=0"></span>: the values are -3 and -1, so the expressions are not equivalent.</p></div>');

    add("Like terms","Combining like terms",section("ax+bx","Combining like terms","Terms are like when their variable parts—including exponents—match exactly. Add coefficients while preserving the shared factor."));
    add("Like terms","Structure as factoring",head("Concept","Combining is distribution in reverse")+'<div class="flow"><span><span class="math" data-tex="5x+2x"></span></span><b>=</b><span><span class="math" data-tex="(5+2)x"></span></span><b>=</b><span><span class="math" data-tex="7x"></span></span></div><p class="callout"><span class="math" data-tex="x"></span> and <span class="math" data-tex="x^2"></span> are not like terms because their variable factors differ.</p>');
    add("Like terms","Worked example",head("Worked example","Group by matching variable part")+'<div class="step-list"><div class="step">Simplify <span class="math" data-tex="4x^2-3x+7+2x^2+5x-9"></span>.</div><div class="step"><span class="math" data-tex="(4x^2+2x^2)+(-3x+5x)+(7-9)"></span>.</div><div class="step">Result: <span class="math" data-tex="6x^2+2x-2"></span>.</div><div class="step">No remaining terms have identical variable parts.</div></div>');
    add("Student Turn","Like-term turn",head("Student Turn","Simplify without changing degree")+'<div class="question-box"><p class="question-prompt">Simplify <span class="math" data-tex="3a^2+4a-2+a^2-7a+6"></span>.</p><textarea class="scratch" data-save="like-turn" aria-label="Like-term student work"></textarea>'+reveal('Reveal verified steps','<p><span class="math" data-tex="4a^2-3a+4"></span>. The squared, linear, and constant groups remain distinct.</p>')+'</div>');
    add("Misconception","Like-term misconception",head("Misconception check","Coefficients combine; exponents do not")+'<div class="grid"><div class="card maroon"><h3>Incorrect</h3><p><span class="math" data-tex="3x+4x=7x^2"></span></p><p>Addition does not create another factor of <span class="math" data-tex="x"></span>.</p></div><div class="card tint"><h3>Correct comparison</h3><p><span class="math" data-tex="3x+4x=7x"></span></p><p><span class="math" data-tex="(3x)(4x)=12x^2"></span></p></div></div>');
    add("Checkpoint","Like-term evidence",head("Checkpoint","Name what can—and cannot—combine")+'<div class="card"><p class="formula"><span class="math" data-tex="2xy+5x-3xy+4x=(-1)xy+9x=-xy+9x"></span></p><p><span class="math" data-tex="xy"></span> and <span class="math" data-tex="x"></span> are unlike; the expression is fully simplified.</p></div>');

    add("Mastery","Practice evidence",head("Mastery evidence","Score the differentiated set")+'<div class="grid"><div class="card"><button class="check-button" id="scoreBtn" type="button">Score all 20 responses</button><p class="lead" id="scoreSummary" aria-live="polite">Complete the set, then score your evidence.</p></div><div class="mastery"><div><strong data-level-score="Easy">—</strong>Easy / 4</div><div><strong data-level-score="Medium">—</strong>Medium / 6</div><div><strong data-level-score="Hard">—</strong>Hard / 6</div><div><strong data-level-score="Challenge">—</strong>Challenge / 4</div><div><strong id="totalScore">—</strong>Total / 20</div></div></div>');
    add("Error analysis","Repair one misconception",head("Error analysis","Turn one error into a reusable rule")+'<div class="grid"><div class="card"><label for="errorAnalysis"><strong>Identify the exact step, explain why it failed, correct it, and verify.</strong></label><textarea class="scratch" id="errorAnalysis" data-save="error-analysis"></textarea></div><div class="card gold"><h3>Strong evidence names</h3><ul><li>the sign or structural cue missed;</li><li>the correct rule in precise language;</li><li>the repaired sequence;</li><li>a reasonableness or substitution check.</li></ul></div></div>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","Fluency protects higher-level reasoning")+'<div class="grid three"><article class="card"><h3>Function evaluation</h3><p>Substitution and operation order support <span class="math" data-tex="f(a+h)"></span> and difference quotients.</p></article><article class="card"><h3>Equivalent forms</h3><p>Distribution and like terms reveal intercepts, rates, factors, and transformations.</p></article><article class="card"><h3>Percent multipliers</h3><p>Rational-form fluency supports exponential growth and decay models.</p></article></div><p class="callout success"><strong>Transfer:</strong> the goal is not longer arithmetic; it is freeing attention for function reasoning.</p>');
    add("Exit ticket","Exit ticket",head("Exit ticket","Produce final mastery evidence")+'<div class="question-box"><ol><li>Evaluate <span class="math" data-tex="-3^2+2(-5)"></span>.</li><li>Write <span class="math" data-tex="0.875"></span> as a simplified fraction and percent.</li><li>Simplify <span class="math" data-tex="-2(3x-4)+5x-7"></span>.</li><li>Explain one check that confirms equivalence.</li></ol><textarea class="scratch" data-save="exit-ticket" aria-label="Exit ticket work"></textarea>'+reveal('Reveal exit-ticket key','<ol><li><span class="math" data-tex="-9-10=-19"></span>.</li><li><span class="math" data-tex="0.875=\\frac78=87.5\\%"></span>.</li><li><span class="math" data-tex="-6x+8+5x-7=-x+1"></span>.</li><li>For example, substitute the same value into original and simplified forms and compare outputs.</li></ol>')+'</div>');
    add("Reflect","Mastery reflection",head("Reflect","Decide the next instructional move")+'<div class="grid"><div class="card tint"><h3>Ready to advance</h3><p>At least 16/20, complete exit-ticket reasoning, and no repeated sign or structure error.</p></div><div class="card gold"><h3>Targeted repair</h3><p>Revisit only the concept block connected to the evidence gap; then complete a parallel check.</p></div></div><label for="reflection"><h3>My evidence and next action</h3></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea>');

    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"]').forEach(input=>{if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>checkOne(b.dataset.check)));document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",()=>{state.fields.notebook=n.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(x=>x.id===id),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the structure.":"Not yet. Recheck signs, grouping, and equivalence.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(level=>{const qs=practice.filter(q=>q.level===level),n=qs.filter(q=>state.answers[q.id]===q.answer).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit ticket.":"Use the level pattern to select a targeted repair block.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 0.2 Number and Expression Fluency","Exported: "+new Date().toLocaleString(),""];practice.forEach(q=>{lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_0.2_Number_Expression_Fluency.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());document.documentElement.dataset.lessonReady="true";
  })();
  </script>
</body>
</html>

  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-0.1-profile-v1";
    const strands={A:"Arithmetic",B:"Algebra",C:"Functions",D:"Graph reading",E:"Geometry"};
    const questions=[
      {id:"A1",strand:"A",difficulty:"Easy",calc:false,prompt:'Evaluate <span class="math" data-tex="-7+3(5-2)"></span>.',options:["-18","-2","2","14"],answer:2,solution:'Parentheses first: <span class="math" data-tex="5-2=3"></span>. Then <span class="math" data-tex="-7+3(3)=-7+9=2"></span>.'},
      {id:"A2",strand:"A",difficulty:"Easy",calc:false,prompt:'Compute <span class="math" data-tex="\\frac34-\\frac58"></span>.',options:["1/8","1/4","2/3","-1/8"],answer:0,solution:'Use eighths: <span class="math" data-tex="\\frac68-\\frac58=\\frac18"></span>.'},
      {id:"A3",strand:"A",difficulty:"Medium",calc:false,prompt:'What is <span class="math" data-tex="35\\%"></span> of <span class="math" data-tex="240"></span>?',options:["72","80","84","96"],answer:2,solution:'<span class="math" data-tex="0.35(240)=84"></span>.'},
      {id:"A4",strand:"A",difficulty:"Medium",calc:false,prompt:'Order from least to greatest: <span class="math" data-tex="-0.6,\\;-\\frac58,\\;-0.58"></span>.',options:["-0.58, -0.6, -5/8","-5/8, -0.6, -0.58","-0.6, -5/8, -0.58","-5/8, -0.58, -0.6"],answer:1,solution:'<span class="math" data-tex="-\\frac58=-0.625"></span>, so <span class="math" data-tex="-0.625<-0.600<-0.580"></span>.'},
      {id:"A5",strand:"A",difficulty:"Easy",calc:false,prompt:'Evaluate <span class="math" data-tex="\\sqrt{144}-2^3"></span>.',options:["2","4","8","20"],answer:1,solution:'<span class="math" data-tex="12-8=4"></span>.'},
      {id:"A6",strand:"A",difficulty:"Medium",calc:false,prompt:'Blue and gold counters are in the ratio <span class="math" data-tex="7:5"></span>. There are 48 counters. How many are blue?',options:["20","24","28","35"],answer:2,solution:'There are 12 equal parts; each part is 4. Blue: <span class="math" data-tex="7(4)=28"></span>.'},
      {id:"A7",strand:"A",difficulty:"Easy",calc:false,prompt:'Write <span class="math" data-tex="\\frac{18}{24}"></span> in simplest form.',options:["2/3","3/4","4/5","9/12"],answer:1,solution:'Divide numerator and denominator by 6: <span class="math" data-tex="\\frac{18}{24}=\\frac34"></span>.'},
      {id:"A8",strand:"A",difficulty:"Hard",calc:false,prompt:'A quantity rises from 80 to 92. What is the percent increase?',options:["12%","15%","18%","20%"],answer:1,solution:'Change <span class="math" data-tex="=12"></span>; relative change <span class="math" data-tex="\\frac{12}{80}=0.15=15\\%"></span>.'},
      {id:"B1",strand:"B",difficulty:"Easy",calc:false,prompt:'Simplify <span class="math" data-tex="3(2x-5)+4"></span>.',options:["6x-1","6x-11","5x-11","6x-19"],answer:1,solution:'Distribute, then combine constants: <span class="math" data-tex="6x-15+4=6x-11"></span>.'},
      {id:"B2",strand:"B",difficulty:"Easy",calc:false,prompt:'Solve <span class="math" data-tex="5x-7=18"></span>.',options:["x=3","x=5","x=11/5","x=25"],answer:1,solution:'<span class="math" data-tex="5x=25"></span>, so <span class="math" data-tex="x=5"></span>.'},
      {id:"B3",strand:"B",difficulty:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="4(x-2)=2x+10"></span>.',options:["x=1","x=5","x=9","x=14"],answer:2,solution:'<span class="math" data-tex="4x-8=2x+10\\Rightarrow2x=18\\Rightarrow x=9"></span>.'},
      {id:"B4",strand:"B",difficulty:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="\\frac23x-4=10"></span>.',options:["x=4","x=9","x=14","x=21"],answer:3,solution:'<span class="math" data-tex="\\frac23x=14"></span>; multiply by <span class="math" data-tex="\\frac32"></span> to get <span class="math" data-tex="x=21"></span>.'},
      {id:"B5",strand:"B",difficulty:"Medium",calc:false,prompt:'For <span class="math" data-tex="x\\ne0"></span>, simplify <span class="math" data-tex="\\frac{x^3x^4}{x^2}"></span>.',options:["x²","x⁵","x⁹","1/x⁵"],answer:1,solution:'Add exponents when multiplying and subtract when dividing: <span class="math" data-tex="x^{3+4-2}=x^5"></span>.'},
      {id:"B6",strand:"B",difficulty:"Medium",calc:false,prompt:'Evaluate <span class="math" data-tex="2^{-3}"></span>.',options:["-8","-6","1/6","1/8"],answer:3,solution:'A negative exponent takes the reciprocal: <span class="math" data-tex="2^{-3}=\\frac{1}{2^3}=\\frac18"></span>.'},
      {id:"B7",strand:"B",difficulty:"Hard",calc:false,prompt:'The formula <span class="math" data-tex="v=\\frac dt"></span> relates speed, distance, and time. Solve for <span class="math" data-tex="t"></span>.',options:["t=dv","t=d/v","t=v/d","t=1/(dv)"],answer:1,solution:'Multiply by <span class="math" data-tex="t"></span>: <span class="math" data-tex="vt=d"></span>. Divide by <span class="math" data-tex="v"></span>: <span class="math" data-tex="t=\\frac dv"></span>.'},
      {id:"B8",strand:"B",difficulty:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="-3x+5>14"></span>.',options:["x>-3","x<-3","x>3","x<3"],answer:1,solution:'<span class="math" data-tex="-3x>9"></span>. Dividing by negative 3 reverses the sign: <span class="math" data-tex="x<-3"></span>.'},
      {id:"C1",strand:"C",difficulty:"Easy",calc:false,prompt:'If <span class="math" data-tex="f(x)=2x^2-3"></span>, find <span class="math" data-tex="f(-2)"></span>.',options:["-11","-5","1","5"],answer:3,solution:'Substitute the entire input: <span class="math" data-tex="f(-2)=2(-2)^2-3=8-3=5"></span>.'},
      {id:"C2",strand:"C",difficulty:"Medium",calc:false,prompt:'Which relation is a function?',options:["{(1,2),(1,5),(3,7)}","{(-1,4),(0,4),(2,4)}","{(2,1),(2,3),(2,5)}","{(0,1),(0,-1),(1,0)}"],answer:1,solution:'In the second relation, every input appears with exactly one output. Repeated outputs are allowed.'},
      {id:"C3",strand:"C",difficulty:"Medium",calc:false,prompt:'A table has <span class="math" data-tex="x=0,1,2,3"></span> and <span class="math" data-tex="y=4,7,10,13"></span>. Which rule matches?',options:["y=3x+1","y=3x+4","y=4x+3","y=x²+4"],answer:1,solution:'The output begins at 4 and increases by 3 per unit: <span class="math" data-tex="y=3x+4"></span>.'},
      {id:"C4",strand:"C",difficulty:"Medium",calc:false,prompt:'What is the real domain of <span class="math" data-tex="g(x)=\\sqrt{x-2}"></span>?',options:["x≤2","x<2","x≥2","all real x"],answer:2,solution:'A real square root needs <span class="math" data-tex="x-2\\ge0"></span>, so <span class="math" data-tex="x\\ge2"></span>.'},
      {id:"C5",strand:"C",difficulty:"Hard",calc:false,prompt:'For <span class="math" data-tex="f(x)=x^2"></span>, find the average rate of change from <span class="math" data-tex="x=1"></span> to <span class="math" data-tex="x=4"></span>.',options:["3","4","5","15"],answer:2,solution:'<span class="math" data-tex="\\frac{f(4)-f(1)}{4-1}=\\frac{16-1}{3}=5"></span>.'},
      {id:"C6",strand:"C",difficulty:"Hard",calc:false,prompt:'If <span class="math" data-tex="f(x)=2x+1"></span> and <span class="math" data-tex="g(x)=x^2"></span>, find <span class="math" data-tex="f(g(3))"></span>.',options:["13","18","19","49"],answer:2,solution:'First <span class="math" data-tex="g(3)=9"></span>; then <span class="math" data-tex="f(9)=19"></span>.'},
      {id:"C7",strand:"C",difficulty:"Hard",calc:false,prompt:'Which rule reverses <span class="math" data-tex="y=5x-10"></span>?',options:["(x-10)/5","(x+10)/5","5x+10","x/5-10"],answer:1,solution:'Swap input/output and solve: <span class="math" data-tex="x=5y-10\\Rightarrow y=\\frac{x+10}{5}"></span>.'},
      {id:"C8",strand:"C",difficulty:"Challenge",calc:false,prompt:'The sequence is <span class="math" data-tex="5,9,13,17,\\ldots"></span>. Which expression gives term <span class="math" data-tex="n"></span>?',options:["4n-1","4n+1","5n-1","n+4"],answer:1,solution:'Common difference 4 gives <span class="math" data-tex="a_n=5+4(n-1)=4n+1"></span>.'},
      {id:"D1",strand:"D",difficulty:"Easy",calc:false,prompt:'A line passes through <span class="math" data-tex="(1,2)"></span> and <span class="math" data-tex="(5,10)"></span>. What is its slope?',options:["1/2","2","4","8"],answer:1,solution:'<span class="math" data-tex="m=\\frac{10-2}{5-1}=\\frac84=2"></span>.'},
      {id:"D2",strand:"D",difficulty:"Easy",calc:false,prompt:'What is the <span class="math" data-tex="y"></span>-intercept of <span class="math" data-tex="y=3x+2"></span>?',options:["-3","0","2","3"],answer:2,solution:'At <span class="math" data-tex="x=0"></span>, <span class="math" data-tex="y=2"></span>, so the intercept is <span class="math" data-tex="(0,2)"></span>.'},
      {id:"D3",strand:"D",difficulty:"Medium",calc:false,graphic:"decreasing",prompt:'As <span class="math" data-tex="x"></span> increases across the shown line, what happens to <span class="math" data-tex="y"></span>?',options:["It increases","It decreases","It stays constant","There is not enough information"],answer:1,solution:'The graph falls from left to right, so output decreases as input increases.'},
      {id:"D4",strand:"D",difficulty:"Medium",calc:false,graphic:"zeros",prompt:'What are the zeros of the shown function?',options:["-2 and 0","-2 and 4","0 and 4","2 and 4"],answer:1,solution:'Zeros are the input values where the graph meets the <span class="math" data-tex="x"></span>-axis: <span class="math" data-tex="x=-2"></span> and <span class="math" data-tex="x=4"></span>.'},
      {id:"D5",strand:"D",difficulty:"Medium",calc:false,graphic:"maximum",prompt:'What is the maximum value shown on the graph?',options:["2","3","5","7"],answer:2,solution:'The highest plotted point is <span class="math" data-tex="(2,5)"></span>; the maximum output value is 5.'},
      {id:"D6",strand:"D",difficulty:"Hard",calc:true,prompt:'A table gives <span class="math" data-tex="(0,1),(1,4),(2,9),(3,16)"></span>. Which family best fits the pattern?',options:["Linear","Quadratic","Exponential","Constant"],answer:1,solution:'The outputs are <span class="math" data-tex="(x+1)^2"></span>; their second differences are constant, so the pattern is quadratic.'},
      {id:"D7",strand:"D",difficulty:"Hard",calc:true,graphic:"point",prompt:'Read the marked point. What is the output when the input is 3?',options:["3","5","7","10"],answer:2,solution:'The marked ordered pair is <span class="math" data-tex="(3,7)"></span>, so the output is 7.'},
      {id:"D8",strand:"D",difficulty:"Challenge",calc:true,prompt:'Compared with <span class="math" data-tex="y=x^2"></span>, how is <span class="math" data-tex="y=(x-3)^2+2"></span> translated?',options:["Left 3, up 2","Right 3, up 2","Right 2, up 3","Left 3, down 2"],answer:1,solution:'The inside change <span class="math" data-tex="x-3"></span> shifts right 3; the outside <span class="math" data-tex="+2"></span> shifts up 2.'},
      {id:"E1",strand:"E",difficulty:"Easy",calc:true,prompt:'Two angles of a triangle are <span class="math" data-tex="45^\\circ"></span> and <span class="math" data-tex="65^\\circ"></span>. Find the third angle.',options:["60°","70°","80°","110°"],answer:1,solution:'Triangle angles total <span class="math" data-tex="180^\\circ"></span>: <span class="math" data-tex="180-45-65=70^\\circ"></span>.'},
      {id:"E2",strand:"E",difficulty:"Easy",calc:true,prompt:'A right triangle has legs 6 and 8. Find its hypotenuse.',options:["7","10","12","14"],answer:1,solution:'<span class="math" data-tex="c=\\sqrt{6^2+8^2}=\\sqrt{100}=10"></span>.'},
      {id:"E3",strand:"E",difficulty:"Medium",calc:true,prompt:'A rectangle is 7 units by 4 units. What is its perimeter?',options:["11","22","28","49"],answer:1,solution:'<span class="math" data-tex="P=2(7+4)=22"></span> units.'},
      {id:"E4",strand:"E",difficulty:"Medium",calc:true,prompt:'A circle has radius 3.7 cm. Which is its area to the nearest tenth?',options:["23.2 cm²","42.0 cm²","43.0 cm²","86.0 cm²"],answer:2,solution:'<span class="math" data-tex="A=\\pi(3.7)^2=13.69\\pi\\approx43.0"></span> cm².'},
      {id:"E5",strand:"E",difficulty:"Hard",calc:true,prompt:'Find the distance between <span class="math" data-tex="(1,2)"></span> and <span class="math" data-tex="(4,6)"></span>.',options:["3","4","5","7"],answer:2,solution:'<span class="math" data-tex="d=\\sqrt{(4-1)^2+(6-2)^2}=\\sqrt{9+16}=5"></span>.'},
      {id:"E6",strand:"E",difficulty:"Challenge",calc:true,prompt:'Similar figures have corresponding sides 3 and 12. If another side of the smaller figure is 5, what is the matching larger side?',options:["14","15","17","20"],answer:3,solution:'The scale factor is <span class="math" data-tex="12/3=4"></span>, so the matching side is <span class="math" data-tex="5(4)=20"></span>.'}

    const state=load();
    const slides=[];

      if(kind==="zeros")return base+'<path class="g-curve" d="M90 194 L120 227 L150 250 L180 268 L210 280 L255 285 L300 280 L330 268 L360 250 L390 227 L420 194 L455 158"/><circle class="g-point" cx="150" cy="250" r="7"/><circle class="g-point" cx="360" cy="250" r="7"/><text class="g-text" x="137" y="280">−2</text><text class="g-text" x="354" y="280">4</text></svg>';

    function questionCard(q){

    function checkpoint(code){const qs=questions.filter(q=>q.strand===code);return '<div class="grid"><div class="card tint"><p class="eyebrow">Completion check</p><h2>'+strands[code]+' checkpoint</h2><p class="lead">You answered <strong data-checkpoint="'+code+'">0</strong> of '+qs.length+' items in this strand.</p><p>Unanswered items are useful evidence too, but check that they were intentional skips.</p></div><div class="card gold"><h3>Before moving on</h3><ul><li>Keep all scratch work—even false starts.</li><li>Mark confidence honestly.</li><li>Do not look up a method.</li></ul></div></div>';}
    add("Launch","Entry Diagnostic & Mathematical Profile",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Unit 0 · Lesson 0.1</p><h1>Entry Diagnostic &amp;<br>Mathematical Profile</h1><p class="lead">A precise starting point—not a grade and not a label.</p><button class="cta" type="button" data-go="1">Begin diagnostic</button></div><div class="radar" aria-label="Five-strand mathematical profile illustration"><span></span></div></div>',"cover");
    add("Orient","Learning outcomes",head("Orient","What you will prove and produce")+'<div class="grid three"><article class="card"><strong class="big">1</strong><h3>Demonstrate</h3><p>Show current prerequisite knowledge across arithmetic, algebra, functions, graph reading, and geometry.</p></article><article class="card"><strong class="big">2</strong><h3>Diagnose</h3><p>Classify errors as conceptual, procedural, or attention-based using evidence from your work.</p></article><article class="card"><strong class="big">3</strong><h3>Target</h3><p>Set two or three personal mastery targets that are specific and measurable.</p></article></div>');
    add("Orient","Why a diagnostic?",head("Orient","A starting point creates a smarter pathway")+'<div class="grid"><div class="card tint"><h3>This diagnostic is</h3><ul><li>a map of current evidence;</li><li>a way to select the right targeted review and extension;</li><li>a baseline for measuring growth.</li></ul></div><div class="card maroon"><h3>This diagnostic is not</h3><ul><li>a permanent track;</li><li>a report-card grade;</li><li>a reason to hide incomplete thinking.</li></ul></div></div><p class="callout success"><strong>Best strategy:</strong> make your thinking visible. A wrong answer with clear reasoning is more useful than a lucky guess.</p>');
    add("Protocol","Diagnostic conditions",head("Protocol","Protect the quality of the evidence")+'<div class="grid three"><article class="card"><h3>Independent</h3><p>No notes, search, AI, or coaching. Ask only for clarification of wording.</p></article><article class="card"><h3>One sitting per strand</h3><p>You may pause between strands. Preserve all answers and scratch work.</p></article><article class="card"><h3>Reasonable pace</h3><p>Attempt what you know, mark uncertainty, and skip rather than guess blindly.</p></article></div><p class="callout warning"><strong>Integrity check:</strong> the profile can help you only when it represents your own current knowledge.</p>');
    add("Protocol","Calculator judgment",head("Protocol","Use technology only when it adds mathematical value")+'<div class="grid"><div class="card"><h3>No-calculator items</h3><p>Build exact number sense, symbolic fluency, and mental structure. Do not use a calculator even to check.</p></div><div class="card gold"><h3>Calculator-permitted items</h3><p>Write an equation or exact setup first. Use technology for computation, then interpret the result and units.</p></div></div><p class="formula"><span class="math" data-tex="\\text{reasoning}\\;\\longrightarrow\\;\\text{technology}\\;\\longrightarrow\\;\\text{interpretation}"></span></p>');
    add("Profile","Five evidence strands",head("Profile","The mathematical profile has five strands")+'<div class="grid three">'+Object.entries(strands).map(([k,v])=>'<article class="card"><span class="badge">Strand '+k+'</span><h3>'+v+'</h3><p>'+({A:'Number sense, operations, fractions, percent, ratio.',B:'Expressions, equations, exponents, formulas, inequalities.',C:'Function notation, domain, rate, composition, inverse ideas.',D:'Slope, intercepts, features, transformations, data patterns.',E:'Angle, measure, Pythagorean theorem, coordinates, similarity.'}[k])+'</p></article>').join('')+'</div>');
    add("Practice","Worked example: use the interface",head("Practice","Worked example · unscored")+'<div class="question-layout"><div class="question-box"><span class="badge">Unscored example</span><p class="question-prompt">Evaluate <span class="math" data-tex="6+2(5)"></span>.</p><p><strong>Think:</strong> multiplication precedes addition.</p>'+reveal('Reveal worked example','<p><span class="math" data-tex="6+2(5)=6+10=16"></span>.</p><p>The work identifies the operation order, not only the final answer.</p>')+'</div><aside class="side-note"><h3>Interface routine</h3><ol><li>Choose one response.</li><li>Show enough reasoning.</li><li>Record confidence.</li><li>Move forward; answers stay saved.</li></ol></aside></div>');
    add("Student Turn","Student Turn: test the routine",head("Student Turn","Unscored readiness check")+'<div class="question-box"><p class="question-prompt">Without a calculator, evaluate <span class="math" data-tex="18\\div3+4"></span>.</p><div class="choices"><label class="choice"><input type="radio" name="warmup" value="A"><span>A. 5</span></label><label class="choice"><input type="radio" name="warmup" value="B"><span>B. 10</span></label><label class="choice"><input type="radio" name="warmup" value="C"><span>C. 22</span></label></div>'+reveal('Reveal practice answer','<p><strong>B. 10.</strong> Division first: <span class="math" data-tex="18\\div3=6"></span>, then <span class="math" data-tex="6+4=10"></span>.</p>')+'</div>');

    add("Profile","Score and build your profile",head("Profile","Unlock the five-strand evidence profile")+'<div class="grid"><div class="card"><p>Scoring unlocks the verified answer key on every diagnostic item. It does not erase or replace your first responses.</p><button class="score-button" id="scoreBtn" type="button">Score diagnostic &amp; unlock solutions</button><p class="result-summary" id="resultSummary" aria-live="polite">Profile not scored yet.</p></div><div class="card tint"><div class="profile-grid">'+Object.entries(strands).map(([k,v])=>'<div class="profile-row"><strong>'+v+'</strong><div class="track"><div class="fill" data-fill="'+k+'"></div></div><output data-score="'+k+'">—</output></div>').join('')+'</div></div></div><p class="callout warning">A score is evidence for planning. It is not, by itself, a placement decision.</p>');
    add("Reflect","Classify errors",head("Reflect","Three error types lead to three different next steps")+'<div class="error-types"><article class="error-type"><b>Conceptual</b><p>The underlying meaning or relationship is not yet secure.</p><p><em>Next step:</em> rebuild with representations and explanation.</p></article><article class="error-type"><b>Procedural</b><p>The idea is understood, but steps, notation, or execution break down.</p><p><em>Next step:</em> rehearse a reliable method and verify.</p></article><article class="error-type"><b>Attention-based</b><p>The method is secure, but a sign, value, unit, or question condition was missed.</p><p><em>Next step:</em> use a deliberate checking routine.</p></article></div>');
    add("Worked example","Worked error analysis",head("Worked example","Diagnose the cause—not just the wrong answer")+'<div class="grid"><div class="card maroon"><h3>Student work</h3><p>Solve <span class="math" data-tex="-2x>8"></span>.</p><p><span class="math" data-tex="x>-4"></span></p></div><div class="card"><h3>Diagnosis</h3><p>The student divided by <span class="math" data-tex="-2"></span> but did not reverse the inequality.</p><p><strong>Most likely procedural error:</strong> the negative-division rule was omitted during a known process.</p><p><strong>Correction:</strong> <span class="math" data-tex="x<-4"></span>.</p></div></div>');
    add("Student Turn","Student Turn: analyze one error",head("Student Turn","Choose evidence from your own work")+'<div class="grid"><div class="card"><label for="errorItem"><strong>Item ID and what I wrote</strong></label><textarea id="errorItem" class="reflection" data-save="error-item"></textarea><label for="errorType"><strong>Most likely error type and evidence</strong></label><textarea id="errorType" class="reflection" data-save="error-type"></textarea></div><div class="card gold"><h3>Strong analysis names</h3><ul><li>the exact incorrect step or interpretation;</li><li>why that step was tempting;</li><li>the corrected reasoning;</li><li>a check that confirms the correction.</li></ul></div></div>');
    add("Plan","Personal mastery targets",head("Plan","Convert profile evidence into two or three targets")+'<p class="lead">A useful target names the strand, observable action, evidence threshold, and review date.</p><div class="target-row"><label for="target1"><strong>Target 1</strong><br><small>Highest-priority gap</small></label><textarea id="target1" data-save="target-1" placeholder="Example: Solve 8 of 10 multi-step equations correctly and verify each by substitution."></textarea></div><div class="target-row"><label for="target2"><strong>Target 2</strong><br><small>Representation or reasoning</small></label><textarea id="target2" data-save="target-2"></textarea></div><div class="target-row"><label for="target3"><strong>Target 3</strong><br><small>Optional extension</small></label><textarea id="target3" data-save="target-3"></textarea></div>');

    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+escapeHtml(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"][name^="A"],input[type="radio"][name^="B"],input[type="radio"][name^="C"],input[type="radio"][name^="D"],input[type="radio"][name^="E"]').forEach(input=>input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();}));document.querySelectorAll('input[type="radio"][name^="confidence-"]').forEach(input=>input.addEventListener("change",e=>{state.confidence[e.target.name.replace("confidence-","")]=Number(e.target.value);save();}));document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||el.value||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-save-check]").forEach(el=>{const key=el.dataset.saveCheck;el.checked=!!state.checks[key];el.addEventListener("change",()=>{state.checks[key]=el.checked;save();});});document.getElementById("scoreBtn")?.addEventListener("click",score);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal")?.addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const notebook=document.getElementById("notebook");notebook.value=state.fields.notebook||"";notebook.addEventListener("input",()=>{state.fields.notebook=notebook.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function score(){state.scored=true;save();const scores={};Object.keys(strands).forEach(code=>{const qs=questions.filter(q=>q.strand===code);const correct=qs.filter(q=>state.answers[q.id]===q.answer).length;scores[code]={correct,total:qs.length};const pct=Math.round(100*correct/qs.length);document.querySelector('[data-fill="'+code+'"]').style.width=pct+"%";document.querySelector('[data-score="'+code+'"]').value=correct+"/"+qs.length;});const total=Object.values(scores).reduce((n,s)=>n+s.correct,0);document.getElementById("resultSummary").textContent="Overall evidence: "+total+" / "+questions.length+". Review strand patterns, not only the total.";document.querySelectorAll("[data-answer-key]").forEach(el=>el.hidden=false);toast("Profile scored; verified solutions unlocked");}
    function restoreScore(){if(state.scored)score();}
    function updateCheckpoints(){Object.keys(strands).forEach(code=>{const answered=questions.filter(q=>q.strand===code&&state.answers[q.id]!==undefined).length;document.querySelectorAll('[data-checkpoint="'+code+'"]').forEach(el=>el.textContent=answered);});}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 0.1 Entry Diagnostic & Mathematical Profile","Exported: "+new Date().toLocaleString(),""];questions.forEach(q=>{lines.push(q.id+" · "+strands[q.strand]+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work['work-'+q.id])lines.push("Work: "+state.work['work-'+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_0.1_Mathematical_Profile.txt";a.click();URL.revokeObjectURL(a.href);toast("Diagnostic work exported");}
    buildMap();bind();updateCheckpoints();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());restoreScore();document.documentElement.dataset.lessonReady="true";
  })();
  </script>
</body>

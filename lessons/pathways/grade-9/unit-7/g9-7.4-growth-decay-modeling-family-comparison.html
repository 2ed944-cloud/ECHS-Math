  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-7.4-growth-decay-modeling-family-comparison-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Which model starts at 500 and grows by 8% per year?',options:["500(1.08)^t","500(0.92)^t","8(500)^t","508t"],answer:0,solution:'Initial value a=500 and growth factor b=1+0.08=1.08, so P(t)=500(1.08)^t.'},
      {id:"E2",level:"Easy",calc:false,prompt:'What factor represents 12% decay per time unit?',options:["0.12","0.88","1.12","1.88"],answer:1,solution:'A 12% decrease retains 100%−12%=88%, so the decay factor is 0.88.'},
      {id:"E3",level:"Easy",calc:false,prompt:'The outputs 4, 7, 10, 13 occur at equally spaced inputs. Which family fits?',options:["Quadratic","Exponential","Linear","None"],answer:2,solution:'The first differences are all +3, so a linear model fits.'},
      {id:"E4",level:"Easy",calc:false,prompt:'The outputs 3, 6, 12, 24 occur at equally spaced inputs. Which family fits?',options:["Linear","Exponential","Quadratic","Constant"],answer:1,solution:'Each output is multiplied by 2, so an exponential model fits.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Evaluate 240(1.05)^3 to the nearest cent.',options:["277.83","252.00","275.78","291.60"],answer:0,solution:'240(1.05)^3=240(1.157625)=277.83.'},
      {id:"M2",level:"Medium",calc:false,prompt:'A quantity follows A(t)=800(0.9)^t. What is A(2)?',options:["720","648","620","800"],answer:1,solution:'A(2)=800(0.9)^2=800(0.81)=648.'},
      {id:"M3",level:"Medium",calc:false,prompt:'The outputs 2, 5, 10, 17 occur at inputs 0,1,2,3. Which family is supported?',options:["Linear","Quadratic","Exponential","Constant"],answer:1,solution:'First differences are 3,5,7; second differences are constant at 2, supporting a quadratic model.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Interpret the model Q(t)=120(0.75)^t.',options:["Initial 75; 120% growth","Initial 120; 25% decay","Initial 120; 75% decay","Initial 120; 25% growth"],answer:1,solution:'Q(0)=120 and 0.75=1−0.25, so the quantity decays 25% per time unit.'},
      {id:"M5",level:"Medium",calc:false,prompt:'At t=2, compare L(t)=50+8t and E(t)=50(1.1)^t.',options:["E is greater by 5.5","L is greater by 5.5","They are equal","L is greater by 11"],answer:1,solution:'L(2)=66 and E(2)=60.5, so L is greater by 5.5.'},
      {id:"M6",level:"Medium",calc:false,prompt:'Which exact model fits outputs 100, 120, 144 at t=0,1,2?',options:["100+20t","120(1.2)^t","100(1.2)^t","100(0.8)^t"],answer:2,solution:'The initial value is 100 and the constant ratio is 1.2, so y=100(1.2)^t.'},
      {id:"H1",level:"Hard",calc:true,prompt:'A fund is modeled by F(t)=500(1.04)^t. Find F(5) to the nearest cent.',options:["608.33","600.00","520.00","593.26"],answer:0,solution:'F(5)=500(1.04)^5≈608.32645, which rounds to 608.33.'},
      {id:"H2",level:"Hard",calc:false,prompt:'A substance follows M(t)=640(0.5)^(t/4). Find M(12).',options:["320","160","80","40"],answer:2,solution:'At t=12, the exponent is 3, so M(12)=640(0.5)^3=80.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Which model fits (0,5), (1,15), (2,45)?',options:["5+10x","5(3)^x","15(3)^x","5x^2+10"],answer:1,solution:'The y-values have constant ratio 3 and initial value 5, so y=5(3)^x.'},
      {id:"H4",level:"Hard",calc:false,prompt:'A plan adds exactly 30 QAR each month. Which family and evidence apply?',options:["Exponential; constant ratio","Linear; constant difference","Quadratic; constant second difference","Exponential; constant percent"],answer:1,solution:'Adding the same 30 each month creates a constant first difference, so a linear model is appropriate.'},
      {id:"H5",level:"Hard",calc:false,prompt:'For y=2x^2+3 at inputs 0,1,2,3, what constant second difference appears?',options:["4","2","3","8"],answer:0,solution:'Outputs are 3,5,11,21; first differences 2,6,10 have constant second difference 4.'},
      {id:"H6",level:"Hard",calc:false,prompt:'Which evidence most strongly supports an exponential family?',options:["Equal output increases","Approximately constant output ratios","Constant second differences","A straight scatterplot"],answer:1,solution:'For equally spaced inputs, approximately constant ratios indicate multiplicative, exponential change.'},
      {id:"C1",level:"Challenge",calc:true,prompt:'For integer t≥0, when does E(t)=100(1.25)^t first exceed L(t)=100+40t?',options:["t=4","t=5","t=6","t=8"],answer:1,solution:'At t=4, E≈244.14<L=260. At t=5, E≈305.18>L=300, so t=5 is first.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'Which exact model fits 200, 170, 144.5 at t=0,1,2?',options:["200(0.85)^t","200−30t","170(0.85)^t","200(1.15)^t"],answer:0,solution:'Both successive ratios equal 0.85 and the initial value is 200, so y=200(0.85)^t.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'Why might a fitted growth model be inappropriate for t<0 in a new-business context?',options:["Exponential functions never allow negative inputs","The factor becomes negative","The contextual domain begins when the business opens","The initial value becomes zero"],answer:2,solution:'The formula may be defined, but the context begins at opening, so negative t-values are not meaningful.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'Outputs 6, 9, 13.5, 20.25 occur at equal input steps. Select the model evidence.',options:["Linear with difference 3","Quadratic with second difference 1.5","Exponential with factor 1.5","Exponential with factor 3"],answer:2,solution:'Each value is 1.5 times the previous value, so the pattern is exponential with factor 1.5.'}
    ];

    const slides=[];
    function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
    function add(stage,title,body,cls){slides.push({stage:stage,title:title,body:body,cls:cls||""});}
    function head(stage,title){return '<div class="slide-head"><div><p class="eyebrow">'+stage+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';}
    function math(tex){return '<span class="math" data-tex="'+esc(tex)+'"></span>';}
    function reveal(label,body){return '<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';}
    function studentTurn(prompt,answer){return '<div class="question-box"><p class="question-prompt">'+prompt+'</p><textarea class="scratch" data-save="turn-'+slides.length+'" aria-label="Student response"></textarea>'+reveal("Reveal verified response",'<p>'+answer+'</p>')+'</div>';}
    function practiceSlide(q){add("Practice",q.level+" · "+q.id,head("Practice · "+q.level,q.id+" · "+(q.calc?"Calculator":"No calculator"))+'<div class="question-layout"><div class="question-box"><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map(function(o,i){return '<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+o+'</span></label>';}).join("")+'</div><p><button class="check-button" type="button" data-check="'+q.id+'">Check response</button></p><p class="feedback" id="feedback-'+q.id+'" role="status"></p>'+reveal("Reveal answer and reasoning",'<p><strong>Answer: '+String.fromCharCode(65+q.answer)+'.</strong> '+q.solution+'</p>')+'</div><aside class="side-note"><span class="badge level">'+q.level+'</span><p><strong>'+(q.calc?"Calculator permitted":"No calculator")+'</strong></p><p>Identify the family, parameters, evidence, and meaningful domain before choosing.</p><textarea class="scratch" data-save="work-'+q.id+'" aria-label="Work for '+q.id+'"></textarea></aside></div>');}
    add("Launch","Growth/Decay Modeling & Family Comparison",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Unit 7 · Lesson 7.4</p><h1>Growth/Decay Modeling &amp; Family Comparison</h1><p class="lead">Build and interpret compound growth and decay models, fit structured data, and defend linear, quadratic, or exponential choices using rate patterns and residual evidence.</p><p><span class="badge">Unit pacing: weeks 28–30</span><span class="badge">64 meaningful screens</span></p><button class="cta" type="button" data-go="1">Begin lesson</button></div><div class="system-art"><svg viewBox="0 0 620 470" role="img" aria-labelledby="familyTitle familyDesc" class="graph"><title id="familyTitle">Three model-family fingerprints</title><desc id="familyDesc">Linear change has a constant difference, quadratic change has a constant second difference, and exponential change has a constant ratio.</desc><rect x="34" y="55" width="160" height="125" rx="24" fill="#edf8f8" stroke="#087f8c" stroke-width="4"/><rect x="230" y="55" width="160" height="125" rx="24" fill="#fff8e8" stroke="#c69b37" stroke-width="4"/><rect x="426" y="55" width="160" height="125" rx="24" fill="#fbf0f3" stroke="#7a1734" stroke-width="4"/><text x="114" y="98" text-anchor="middle" class="gtext">LINEAR</text><text x="114" y="145" text-anchor="middle" class="gtext">Δ constant</text><text x="310" y="98" text-anchor="middle" class="gtext">QUADRATIC</text><text x="310" y="145" text-anchor="middle" class="gtext">Δ² constant</text><text x="506" y="98" text-anchor="middle" class="gtext">EXPONENTIAL</text><text x="506" y="145" text-anchor="middle" class="gtext">ratio constant</text><path d="M114 210 L114 275 L310 350" stroke="#087f8c" stroke-width="5" fill="none"/><path d="M310 210 L310 350" stroke="#c69b37" stroke-width="5" fill="none"/><path d="M506 210 L506 275 L310 350" stroke="#7a1734" stroke-width="5" fill="none"/><rect x="190" y="340" width="240" height="82" rx="25" fill="#102a43"/><text x="310" y="375" text-anchor="middle" style="font:800 19px Inter,Arial;fill:white">CHOOSE FROM</text><text x="310" y="404" text-anchor="middle" style="font:800 19px Inter,Arial;fill:white">EVIDENCE + CONTEXT</text></svg></div></div>','cover');
    add("Scope","Authoritative lesson contract",head("Scope","Teach exactly the approved modeling block")+'<div class="grid"><div class="card tint"><h3>Approved subtopics</h3><p>Compound growth, decay, structured data fitting, and comparison of linear, quadratic, and exponential patterns.</p></div><div class="card gold"><h3>Learning outcome</h3><p>Select a family from data or context, fit and interpret an exponential model, and justify the choice using rate patterns and residual evidence.</p></div></div>');
    add("Goals","Learning outcomes",head("Goals","Model, compare, justify")+'<div class="grid three"><div class="card"><h3>Construct</h3><p>Write '+math("y=a(b)^t")+' from an initial value and a growth or decay factor.</p></div><div class="card"><h3>Classify</h3><p>Use first differences, second differences, and ratios for equally spaced inputs.</p></div><div class="card"><h3>Defend</h3><p>Interpret parameters, check residuals informally, and state assumptions and limitations.</p></div></div>');
    add("Sequence","Multi-day learning sequence",head("Sequence","From fingerprints to defensible models")+'<div class="flow"><span>retrieve patterns</span><b>→</b><span>build models</span><b>→</b><span>fit data</span><b>→</b><span>compare families</span><b>→</b><span>justify + limit</span></div><p class="callout">Day 1 builds models; Day 2 compares families and fits structured data; Day 3 uses differentiated evidence and correction.</p>');
    add("Retrieve","Prerequisite retrieval",head("Retrieve","Additive, accelerating, or multiplicative?")+'<div class="grid three"><div class="card"><h3>5, 8, 11, 14</h3><p>constant +3</p></div><div class="card"><h3>1, 4, 9, 16</h3><p>constant second difference</p></div><div class="card"><h3>4, 8, 16, 32</h3><p>constant ×2</p></div></div>');
    add("Student Turn","Student Turn · compute the fingerprint",head("Student Turn","Differences, second differences, ratios")+studentTurn('For outputs 3, 8, 15, 24 at equally spaced inputs, compute first and second differences and name the family.','First differences are 5, 7, 9; second differences are 2 and 2. Constant second differences support a quadratic family.'));
    add("Frame","A model is a claim",head("Frame","Formula plus evidence plus domain")+'<p>A useful model pairs an equation with evidence about change, a meaningful input domain, and a statement of assumptions.</p><div class="flow"><span>context/data</span><b>→</b><span>family</span><b>→</b><span>parameters</span><b>→</b><span>check</span><b>→</b><span>interpret</span></div>');
    add("Parameters","Initial value and factor",head("Parameters","Read a and b in y=a(b)^t")+'<p>At t=0, '+math("y=a(b)^0=a")+', so a is the initial value. The factor b multiplies the output for each one-unit increase in t.</p><p class="callout">b&gt;1 means growth; 0&lt;b&lt;1 means decay.</p>');
    add("Worked example","Worked example · percent growth model",head("Worked example","Convert rate to factor")+'<p>A population starts at 1,200 and grows 6% each year.</p><div class="step-list"><div class="step">Initial value: a=1200.</div><div class="step">Factor: b=1+0.06=1.06.</div><div class="step">Model: '+math("P(t)=1200(1.06)^t")+', for t≥0 years.</div></div>');
    add("Student Turn","Student Turn · decay model",head("Student Turn","Retain what remains")+studentTurn('A machine worth 18,000 QAR loses 15% of its value each year. Write and interpret a model.','The retention factor is 1−0.15=0.85, so V(t)=18000(0.85)^t for t≥0. The model begins at 18,000 QAR and retains 85% each year.'));
    add("Compound change","Compound growth is repeated multiplication",head("Compound change","Apply the factor to the changing amount")+'<p>'+math("A(t)=a(1+r)^t")+' represents discrete compound growth. Each period multiplies the previous output—not merely the initial amount—by 1+r.</p><p class="callout warning">Simple repeated addition would be linear, not compound exponential growth.</p>');
    add("Table","Build a table iteratively",head("Table","Multiply by the same factor")+'<div class="table-wrap"><table class="data-table"><thead><tr><th>t</th><th>A(t)=500(1.2)^t</th><th>change</th><th>ratio</th></tr></thead><tbody><tr><td>0</td><td>500</td><td>—</td><td>—</td></tr><tr><td>1</td><td>600</td><td>+100</td><td>1.2</td></tr><tr><td>2</td><td>720</td><td>+120</td><td>1.2</td></tr><tr><td>3</td><td>864</td><td>+144</td><td>1.2</td></tr></tbody></table></div><p>Differences grow, but ratios remain constant.</p>');
    add("Worked example","Worked example · compound prediction",head("Worked example","Evaluate, round, interpret")+'<p>A 2,500 QAR deposit grows 4% annually. After 3 years:</p><p class="formula">'+math("A(3)=2500(1.04)^3=2812.16")+'</p><p>The model predicts 2,812.16 QAR after three completed annual growth periods.</p>');
    add("Student Turn","Student Turn · evaluate decay",head("Student Turn","Substitute the elapsed periods")+studentTurn('A quantity follows M(t)=640(0.5)^(t/4). Find and interpret M(12).','The exponent is 12/4=3, so M(12)=640(0.5)³=80. After 12 time units—three four-unit decay intervals—80 units remain.'));
    add("Intervals","Known factor over a stated interval",head("Intervals","Match the exponent to the interval")+'<p>If a quantity halves every 4 years, '+math("M(t)=M_0(0.5)^{t/4}")+'.</p><p>The exponent counts four-year intervals. This is structured interval modeling; no logarithm is needed.</p>');
    add("Graphs","Graph features support interpretation",head("Graphs","Read behavior, not just shape")+'<div class="grid"><div class="card tint"><h3>Growth</h3><p>Positive initial value, increasing outputs, horizontal asymptote y=0, range y&gt;0.</p></div><div class="card gold"><h3>Decay</h3><p>Positive initial value, decreasing outputs, horizontal asymptote y=0, range y&gt;0.</p></div></div><p>The contextual domain may be t≥0 even though the formula accepts more inputs.</p>');
    add("Represent","Accessible family graph",head("Represent","Three distinct change patterns")+'<svg viewBox="0 0 760 420" role="img" aria-labelledby="compareTitle compareDesc" class="graph"><title id="compareTitle">Linear, quadratic, and exponential comparison graph</title><desc id="compareDesc">A straight teal line, an upward gold parabola, and a maroon exponential curve all begin low and rise with different change patterns.</desc><line x1="70" y1="350" x2="710" y2="350" class="axis"/><line x1="90" y1="380" x2="90" y2="35" class="axis"/><path d="M90 330 L670 80" fill="none" stroke="#087f8c" stroke-width="5"/><path d="M100 335 Q360 330 640 70" fill="none" stroke="#c69b37" stroke-width="5"/><path d="M100 330 C340 328 520 285 650 55" class="curve"/><text x="560" y="125" class="gtext">linear</text><text x="485" y="205" class="gtext">quadratic</text><text x="600" y="45" class="gtext">exponential</text></svg>');
    add("Fingerprints","Family fingerprints from equally spaced inputs",head("Fingerprints","Look at successive change")+'<div class="table-wrap"><table class="data-table"><thead><tr><th>Family</th><th>Reliable pattern</th><th>Meaning</th></tr></thead><tbody><tr><td>Linear</td><td>constant first differences</td><td>same amount added</td></tr><tr><td>Quadratic</td><td>constant second differences</td><td>first differences change steadily</td></tr><tr><td>Exponential</td><td>constant ratios</td><td>same factor multiplies</td></tr></tbody></table></div>');
    add("Linear","Linear evidence",head("Linear","Constant additive change")+'<p>For 10, 14, 18, 22, the first differences are all +4. An appropriate form is '+math("L(t)=10+4t")+'.</p><p>The ratio is not constant, so exponential is unsupported.</p>');
    add("Quadratic","Quadratic evidence",head("Quadratic","Constant second difference")+'<p>For 2, 5, 10, 17, first differences are 3, 5, 7 and second differences are 2, 2. The values fit '+math("Q(t)=t^2+2")+'.</p>');
    add("Exponential","Exponential evidence",head("Exponential","Constant multiplicative change")+'<p>For 5, 15, 45, 135, successive ratios are all 3. The model is '+math("E(t)=5(3)^t")+'.</p><p>The first differences are not constant.</p>');
    add("Worked example","Worked example · classify a table",head("Worked example","Use more than appearance")+'<div class="table-wrap"><table class="data-table"><tbody><tr><th>x</th><td>0</td><td>1</td><td>2</td><td>3</td></tr><tr><th>y</th><td>7</td><td>12</td><td>19</td><td>28</td></tr></tbody></table></div><p>First differences 5, 7, 9 have constant second differences 2. The table supports a quadratic family.</p>');
    add("Student Turn","Student Turn · classify and justify",head("Student Turn","Name the evidence")+studentTurn('Classify outputs 80, 60, 45, 33.75 at equal input steps. State the factor and percent rate.','Successive ratios are 0.75, so the family is exponential. The factor is 0.75, representing 25% decay per step.'));
    add("Compare","Same initial value, different change",head("Compare","Equal starts do not imply equal futures")+'<div class="grid"><div class="card"><h3>L(t)=100+20t</h3><p>Adds 20 each period.</p></div><div class="card"><h3>E(t)=100(1.2)^t</h3><p>Multiplies by 1.2 each period.</p></div></div><p>At t=2 both equal 140 versus 144; their widening difference reflects distinct change structures.</p>');
    add("Compare","Crossover by a structured table",head("Compare","Compare outputs without logarithms")+'<div class="table-wrap"><table class="data-table"><thead><tr><th>t</th><th>100+40t</th><th>100(1.25)^t</th></tr></thead><tbody><tr><td>3</td><td>220</td><td>195.31</td></tr><tr><td>4</td><td>260</td><td>244.14</td></tr><tr><td>5</td><td>300</td><td>305.18</td></tr></tbody></table></div><p>At integer inputs, the exponential first exceeds the linear model at t=5.</p>');
    add("Worked example","Worked example · compare predictions",head("Worked example","Evaluate both models at the same input")+'<p>At t=2, '+math("L(t)=50+8t")+' gives 66 while '+math("E(t)=50(1.1)^t")+' gives 60.5.</p><p>The linear prediction is 5.5 greater at this input; that does not prove it stays greater forever.</p>');
    add("Student Turn","Student Turn · compare two families",head("Student Turn","Compute before claiming")+studentTurn('Compare Q(t)=t²+10 and E(t)=10(1.2)^t at t=3. Which is greater, and by how much?','Q(3)=19. E(3)=10(1.728)=17.28. The quadratic model is greater by 1.72 at t=3 only.'));
    add("Fit","Fit a structured exponential table",head("Fit","Find initial value and constant ratio")+'<p>For (0,200), (1,170), (2,144.5):</p><div class="step-list"><div class="step">a=200 because y(0)=200.</div><div class="step">170/200=0.85 and 144.5/170=0.85.</div><div class="step">Model: '+math("y=200(0.85)^t")+', a 15% decay model.</div></div>');
    add("Residuals","Residual evidence",head("Residuals","Observed minus predicted")+'<p>A residual is '+math("e=y_{observed}-y_{predicted}")+'. A reasonable model has small residuals without a clear systematic pattern.</p><div class="grid"><div class="card tint"><h3>Support</h3><p>residuals near zero, mixed above and below.</p></div><div class="card maroon"><h3>Warning</h3><p>residuals steadily positive, negative, or curved.</p></div></div>');
    add("Worked example","Worked example · informal residual check",head("Worked example","Compare competing fits")+'<p>Observed values are 10, 20, 39 at t=0,1,2. Model '+math("E(t)=10(2)^t")+' predicts 10, 20, 40, giving residuals 0, 0, −1.</p><p>Small residuals support the exponential model for this structured data, but do not prove future accuracy.</p>');
    add("Predict","Interpolation, extrapolation, and rounding",head("Predict","A prediction inherits model assumptions")+'<p>Interpolation stays within the observed input interval. Extrapolation extends beyond it and is usually less secure.</p><p class="callout warning">Round only after evaluating, preserve units, and label predictions as model-based estimates.</p>');
    add("Domain","Meaningful domain",head("Domain","Formula domain is not always contextual domain")+'<p>A business-opening model may require integer months t≥0. Negative t may be mathematically accepted but contextually meaningless; fractional t may depend on how compounding is defined.</p>');
    add("Limits","Assumptions and limitations",head("Limits","State what the model holds constant")+'<div class="grid three"><div class="card"><h3>Rate</h3><p>Assumes the same factor continues.</p></div><div class="card"><h3>Conditions</h3><p>Ignores shocks, caps, or changing policy.</p></div><div class="card"><h3>Range</h3><p>Long extrapolations may become unreasonable.</p></div></div>');
    add("Correct","Worked error analysis",head("Correct","Do not select by shape alone")+'<p>A student calls 2, 5, 10, 17 exponential because the increases grow.</p><div class="step-list"><div class="step">Ratios 2.5, 2, and 1.7 are not constant.</div><div class="step">First differences 3,5,7 have constant second difference 2.</div><div class="step">The evidence supports quadratic, not exponential.</div></div>');
    add("Misconceptions","Misconception check",head("Misconceptions","Repair four modeling errors")+'<div class="grid four"><div class="card maroon"><h3>rate</h3><p>using 0.08 as the factor for 8% growth.</p></div><div class="card maroon"><h3>family</h3><p>calling any increasing table exponential.</p></div><div class="card maroon"><h3>fit</h3><p>ignoring patterned residuals.</p></div><div class="card maroon"><h3>domain</h3><p>extrapolating forever without limitation.</p></div></div>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","Defend a model concisely")+'<div class="grid"><div class="card tint"><h3>Claim</h3><p>The exponential family is appropriate.</p></div><div class="card gold"><h3>Evidence</h3><p>Equal-step output ratios are approximately constant and residuals are small without a pattern.</p></div></div><p>Add parameter interpretation and a contextual limitation to complete the argument.</p>');
    add("Boundary","Coverage boundary",head("Boundary","Structured readiness, not later AP depth")+'<div class="grid"><div class="card tint"><h3>Within scope</h3><p>Discrete compound growth/decay, exact or clear data fitting, family fingerprints, informal residual evidence, predictions, and limitations.</p></div><div class="card maroon"><h3>Deferred</h3><p>Logarithms, solving unmatched exponential equations, continuous compounding, noisy open regression, semi-log linearization, formal residual analysis, and open model selection.</p></div></div>');
    add("Synthesize","Model-family decision guide",head("Synthesize","Use evidence before equation")+'<div class="flow"><span>inspect context</span><b>→</b><span>compute pattern</span><b>→</b><span>select family</span><b>→</b><span>fit parameters</span><b>→</b><span>check residuals</span><b>→</b><span>interpret + limit</span></div>');
    add("Practice","Differentiated practice launch",head("Practice","Twenty original modeling tasks")+'<div class="section-banner"><div><p class="lead">Progress from rate-factor construction and family fingerprints to compound predictions, structured data fitting, residual evidence, comparisons, and limitations.</p><p><span class="badge level">Easy 4</span><span class="badge level">Medium 6</span><span class="badge level">Hard 6</span><span class="badge level">Challenge 4</span></p><button class="cta" type="button" data-go="39">Start practice</button></div><div class="section-code">pattern<br>fit<br>defend</div></div>');
    practice.forEach(practiceSlide);
    add("Mastery","Score differentiated evidence",head("Mastery","Score all responses")+'<div class="mastery"><div><span>Easy</span><strong data-level-score="Easy">0</strong><small>/4</small></div><div><span>Medium</span><strong data-level-score="Medium">0</strong><small>/6</small></div><div><span>Hard</span><strong data-level-score="Hard">0</strong><small>/6</small></div><div><span>Challenge</span><strong data-level-score="Challenge">0</strong><small>/4</small></div><div><span>Total</span><strong id="totalScore">0</strong><small>/20</small></div></div><p><button class="check-button" id="scoreBtn" type="button">Score all responses</button></p><p id="scoreSummary" class="callout" role="status">A score of 16/20 plus correct family, parameter, residual, domain, and limitation evidence indicates readiness.</p>');
    add("Correct","Misconception correction studio",head("Correct","Repair model claims")+'<div class="grid three"><article class="card maroon"><h3>Student A</h3><p>uses factor 0.12 for 12% decay.</p></article><article class="card maroon"><h3>Student B</h3><p>calls constant second differences exponential.</p></article><article class="card maroon"><h3>Student C</h3><p>ignores residuals that curve above then below zero.</p></article></div><textarea class="scratch" data-save="misconception-correction" aria-label="Growth decay modeling misconception corrections"></textarea>');
    add("AP bridge","Model-selection rationale",head("AP bridge","Claim, evidence, interpretation, limitation")+'<div class="grid"><div class="card tint"><h3>AP-readiness transfer</h3><p>Connect constant-ratio or difference evidence to a family, interpret parameters with units, and mention residual behavior.</p></div><div class="card maroon"><h3>Remain within scope</h3><p>Use structured data and familiar families; defer open AP-level model validation and logarithmic tools.</p></div></div>');
    add("Exit ticket","Exit ticket · model and defend",head("Exit ticket","Family, fit, residual, limitation")+'<div class="question-box"><ol><li>Write a model for 900 units decaying 8% per year.</li><li>Classify 3, 8, 15, 24 and give the rate-pattern evidence.</li><li>Fit an exponential model to 50, 60, 72 at t=0,1,2.</li><li>State one residual sign of poor fit and one contextual limitation.</li></ol><textarea class="scratch" data-save="exit-modeling" aria-label="Growth decay modeling exit ticket"></textarea>'+reveal("Reveal verified key",'<ol><li>D(t)=900(0.92)^t.</li><li>Quadratic: first differences 5,7,9 have constant second difference 2.</li><li>y=50(1.2)^t.</li><li>For example, residuals with a curved pattern warn of poor fit; a constant-rate assumption may fail after observed conditions change.</li></ol>')+'</div>');
    add("Complete","Modeling mastery evidence",head("Complete","Ready for right-triangle trigonometry")+'<div class="grid"><div class="card"><h3>Ready to advance</h3><p>At least 16/20, accurate growth/decay construction, family classification, structured fitting, residual reasoning, meaningful domains, and a defensible limitation.</p><label for="reflection"><strong>My evidence and next action</strong></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea><button class="secondary" id="exportFinal" type="button">Export lesson work</button></div><div class="card maroon"><h3>Next lesson</h3><p><strong>8.1 Right Triangles, Similarity &amp; Pythagorean Relationships</strong></p><p>Use right-triangle structure and similarity to prepare constant trigonometric ratios.</p><a class="cta" href="../../lesson.html?grade=9&amp;path=common&amp;lesson=8.1">View next lesson preview</a></div></div>');
    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map(function(s,i){return '<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==="cover"?"cover":"")+'">'+s.body+'</div></section>';}).join("");
    const slideEls=[].slice.call(document.querySelectorAll(".slide"));let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",""))-1||0));
    function loadState(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}const state=loadState();function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root){(root||document).querySelectorAll(".math").forEach(function(el){if(window.katex){try{window.katex.render(el.dataset.tex||"",el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus){if(focus===undefined)focus=true;index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach(function(el,i){const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach(function(b,i){b.classList.toggle("current",i===index);});renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;const h=slideEls[index].querySelector("h1,h2");if(h)h.focus();}}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(function(d){d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button").focus();}
    function checkOne(id){const q=practice.find(function(x){return x.id===id;}),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—record the family, parameter, pattern, and interpretation evidence.":"Not yet. Recheck the rate pattern, parameters, family evidence, and domain.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(function(level){const qs=practice.filter(function(q){return q.level===level;}),n=qs.filter(function(q){return state.answers[q.id]===q.answer;}).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit evidence and modeling justification.":"Use the level pattern to select targeted review.");toast("Practice evidence scored");}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1800);}function exportWork(){const lines=["ECHS Grade 9 · 7.4 Growth/Decay Modeling & Family Comparison","Exported: "+new Date().toLocaleString(),""];practice.forEach(function(q){lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(function(entry){if(entry[1])lines.push(entry[0]+":",entry[1],"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_7.4_Growth_Decay_Modeling_Family_Comparison.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    document.getElementById("screenMap").innerHTML=slides.map(function(s,i){return '<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>';}).join("");document.querySelectorAll("[data-map]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.map));closeDrawers();});});
    document.getElementById("prevBtn").addEventListener("click",function(){go(index-1);});document.getElementById("nextBtn").addEventListener("click",function(){go(index+1);});document.querySelectorAll("[data-go]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.go));});});document.querySelectorAll('input[type="radio"]').forEach(function(input){if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",function(e){state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(function(el){const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",function(){if(key.indexOf("work-")===0)state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(function(b){b.addEventListener("click",function(){checkOne(b.dataset.check);});});document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",function(){openDrawer("mapDrawer");});document.getElementById("notesBtn").addEventListener("click",function(){openDrawer("notesDrawer");});document.getElementById("fullBtn").addEventListener("click",function(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();});document.querySelectorAll(".close").forEach(function(b){b.addEventListener("click",closeDrawers);});document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",function(){state.fields.notebook=n.value;save();});window.addEventListener("keydown",function(e){if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});
    go(index,false);renderMath();window.addEventListener("load",function(){renderMath();});document.documentElement.dataset.lessonReady="true";
  })();

  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-4.4-completing-the-square-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'What number completes the square for <span class="math" data-tex="x^2+10x"></span>?',options:["25","10","5","100"],answer:0,solution:'Take half of 10 and square it: (10/2)²=25.'},
      {id:"E2",level:"Easy",calc:false,prompt:'Which identity is correct?',options:["x²+6x+9=(x+9)²","x²+6x+9=(x+3)²","x²+6x+9=(x−3)²","x²+6x+9=(x+6)²"],answer:1,solution:'Half of 6 is 3, and 3²=9, so the trinomial is (x+3)².'},
      {id:"E3",level:"Easy",calc:false,prompt:'Rewrite <span class="math" data-tex="x^2-8x+5"></span> in vertex form.',options:["(x−4)²+5","(x−8)²−59","(x−4)²−11","(x+4)²−11"],answer:2,solution:'Add and subtract 16: x²−8x+16−16+5=(x−4)²−11.'},
      {id:"E4",level:"Easy",calc:false,prompt:'Solve <span class="math" data-tex="(x-2)^2=16"></span>.',options:["x=6 only","x=−2 only","x=2±16","x=6 or −2"],answer:3,solution:'x−2=±4, so x=2±4, giving x=6 or x=−2.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Rewrite <span class="math" data-tex="x^2+12x+7"></span> in vertex form.',options:["(x+6)²−29","(x+6)²+7","(x+12)²−137","(x−6)²−29"],answer:0,solution:'Add and subtract 36: x²+12x+36−36+7=(x+6)²−29.'},
      {id:"M2",level:"Medium",calc:false,prompt:'What constant makes <span class="math" data-tex="x^2-5x+\\square"></span> a perfect square?',options:["5/2","25/4","25/2","10"],answer:1,solution:'Half of −5 is −5/2, and (−5/2)²=25/4.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Rewrite <span class="math" data-tex="2x^2+8x+3"></span> in vertex form.',options:["2(x+4)²−29","2(x+2)²+3","2(x+2)²−5","(2x+4)²−13"],answer:2,solution:'Factor 2 from the x-terms: 2(x²+4x)+3=2[(x+2)²−4]+3=2(x+2)²−5.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="x^2+6x-7=0"></span> by completing the square.',options:["x=−3±16","x=3 or −7","x=7 or −1","x=1 or −7"],answer:3,solution:'x²+6x=7. Add 9: (x+3)²=16. Thus x+3=±4, so x=1 or −7.'},
      {id:"M5",level:"Medium",calc:false,prompt:'What is the vertex of <span class="math" data-tex="y=x^2-10x+13"></span>?',options:["(5,−12)","(−5,−12)","(10,13)","(5,13)"],answer:0,solution:'y=(x−5)²−25+13=(x−5)²−12, so the vertex is (5,−12).'},
      {id:"M6",level:"Medium",calc:false,prompt:'Rewrite <span class="math" data-tex="3x^2-12x+1"></span> in vertex form.',options:["3(x−4)²−47","3(x−2)²−11","3(x−2)²+1","(3x−6)²−35"],answer:1,solution:'3(x²−4x)+1=3[(x−2)²−4]+1=3(x−2)²−11.'},
      {id:"H1",level:"Hard",calc:false,prompt:'Rewrite <span class="math" data-tex="x^2+3x-4"></span> in vertex form.',options:["(x+3)²−13","(x+3/2)²−4","(x+3/2)²−25/4","(x−3/2)²−25/4"],answer:2,solution:'Add and subtract (3/2)²=9/4: (x+3/2)²−9/4−4=(x+3/2)²−25/4.'},
      {id:"H2",level:"Hard",calc:false,prompt:'Rewrite <span class="math" data-tex="2x^2-6x+7"></span> in vertex form.',options:["2(x−3)²−11","2(x−3/2)²+7","2(x+3/2)²+5/2","2(x−3/2)²+5/2"],answer:3,solution:'2(x²−3x)+7=2[(x−3/2)²−9/4]+7=2(x−3/2)²+5/2.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="x^2-4x-1=0"></span> exactly.',options:["x=2±√5","x=−2±√5","x=4±√17","x=2±5"],answer:0,solution:'x²−4x=1. Add 4: (x−2)²=5, so x=2±√5.'},
      {id:"H4",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="2x^2+8x-3=0"></span> exactly.',options:["x=2±√22/2","x=−2±√22/2","x=−4±√22","x=−2±11/2"],answer:1,solution:'2(x+2)²−11=0, so (x+2)²=11/2 and x=−2±√22/2.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Rewrite <span class="math" data-tex="y=-2x^2+12x-7"></span> in vertex form.',options:["−2(x+3)²+11","−2(x−6)²+65","−2(x−3)²+11","−2(x−3)²−7"],answer:2,solution:'−2(x²−6x)−7=−2[(x−3)²−9]−7=−2(x−3)²+11.'},
      {id:"H6",level:"Hard",calc:false,prompt:'What is the maximum value of <span class="math" data-tex="y=-3x^2-18x+4"></span>?',options:["4","−3","−31","31"],answer:3,solution:'y=−3(x²+6x)+4=−3[(x+3)²−9]+4=−3(x+3)²+31, so the maximum is 31.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'What constant makes <span class="math" data-tex="x^2+\\frac52x+\\square"></span> a perfect square?',options:["25/16","5/4","25/4","5/2"],answer:0,solution:'Half of 5/2 is 5/4, and (5/4)²=25/16.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'Rewrite <span class="math" data-tex="4x^2+12x-1"></span> in vertex form.',options:["4(x+3)²−37","4(x+3/2)²−10","4(x−3/2)²−10","(2x+3)²−1"],answer:1,solution:'4(x²+3x)−1=4[(x+3/2)²−9/4]−1=4(x+3/2)²−10.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'Solve <span class="math" data-tex="3x^2-6x-2=0"></span> exactly.',options:["x=−1±√15/3","x=1±√5/3","x=1±√15/3","x=3±√15"],answer:2,solution:'3(x−1)²−5=0, so (x−1)²=5/3 and x=1±√15/3.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'If <span class="math" data-tex="x^2+kx+49=(x+7)^2"></span>, what is k?',options:["7","49","−14","14"],answer:3,solution:'Expanding (x+7)² gives x²+14x+49, so k=14.'}
    ];
    const slides=[];
    function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function math(tex){return '<span class="math" data-tex="'+esc(tex)+'"></span>';}
    function head(stage,title){return '<div class="slide-head"><div><p class="eyebrow">'+esc(stage)+'</p><h2 tabindex="-1">'+esc(title)+'</h2></div><div class="number" aria-hidden="true">'+String(slides.length+1).padStart(2,"0")+'</div></div>';}
    function add(stage,title,body,cls){slides.push({stage:stage,title:title,body:body,cls:cls||""});}
    function reveal(label,body){return '<details class="answer-key"><summary>'+esc(label)+'</summary><div>'+body+'</div></details>';}
    function studentTurn(prompt,answer){return '<div class="grid"><div class="card tint"><h3>Your turn</h3><p>'+prompt+'</p><textarea class="scratch" data-save="turn-'+slides.length+'" aria-label="Student work"></textarea></div><div class="card gold">'+reveal("Reveal verified solution",'<p>'+answer+'</p>')+'</div></div>';}
    function quadraticSvg(id,a,h,k,xmin,xmax,ymin,ymax,desc){const W=660,H=390,pad=48;function X(x){return pad+(x-xmin)/(xmax-xmin)*(W-2*pad);}function Y(y){return H-pad-(y-ymin)/(ymax-ymin)*(H-2*pad);}let grid="";for(let x=Math.ceil(xmin);x<=Math.floor(xmax);x++)grid+='<line class="gridline" x1="'+X(x)+'" y1="'+Y(ymin)+'" x2="'+X(x)+'" y2="'+Y(ymax)+'"/>';for(let y=Math.ceil(ymin);y<=Math.floor(ymax);y+=2)grid+='<line class="gridline" x1="'+X(xmin)+'" y1="'+Y(y)+'" x2="'+X(xmax)+'" y2="'+Y(y)+'"/>';let d="",drawing=false;for(let x=xmin;x<=xmax;x+=(xmax-xmin)/180){const y=a*(x-h)*(x-h)+k;if(y<ymin-2||y>ymax+2){drawing=false;continue;}d+=(drawing?" L ":"M ")+X(x).toFixed(1)+" "+Y(y).toFixed(1);drawing=true;}let points='<circle cx="'+X(h)+'" cy="'+Y(k)+'" r="7" fill="#c69b37"/><text class="gtext" x="'+(X(h)+9)+'" y="'+(Y(k)-9)+'">vertex ('+h+','+k+')</text>';const disc=-k/a;if(disc>=0){const r=Math.sqrt(disc);[h-r,h+r].forEach(function(root){if(root>=xmin&&root<=xmax)points+='<circle cx="'+X(root)+'" cy="'+Y(0)+'" r="6" fill="#087f8c"/>';});}return '<svg class="graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-labelledby="'+id+'t '+id+'d"><title id="'+id+'t">Quadratic graph with key features</title><desc id="'+id+'d">'+esc(desc)+'</desc><defs><marker id="'+id+'arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52687a"/></marker></defs>'+grid+'<line class="axis" x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'" marker-end="url(#'+id+'arrow)"/><line class="axis" x1="'+X(0)+'" y1="'+Y(ymin)+'" x2="'+X(0)+'" y2="'+Y(ymax)+'" marker-end="url(#'+id+'arrow)"/><line x1="'+X(h)+'" y1="'+Y(ymin)+'" x2="'+X(h)+'" y2="'+Y(ymax)+'" stroke="#7a1734" stroke-width="2" stroke-dasharray="8 7"/><path d="'+d+'" fill="none" stroke="#7a1734" stroke-width="4"/>'+points+'<text class="gtext" x="'+(X(h)+8)+'" y="28">axis x='+h+'</text><text class="gtext" x="604" y="'+(Y(0)-10)+'">x</text><text class="gtext" x="'+(X(0)+9)+'" y="25">y</text></svg>';}
    function practiceSlide(q){add("Practice · "+q.level,q.id+" · Complete-square reasoning",head("Practice · "+q.level,q.id+" · Complete-square reasoning")+'<div class="question-layout"><div class="question-box"><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?"calc":"")+'">'+(q.calc?"Calculator":"No calculator")+'</span><div class="question-prompt">'+q.prompt+'</div><div class="choices">'+q.options.map(function(o,i){return '<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+o+'</span></label>';}).join("")+'</div><p><button class="check-button" type="button" data-check="'+q.id+'">Check response</button></p><p class="feedback" id="feedback-'+q.id+'" role="status"></p>'+reveal("Reveal answer and reasoning",'<p><strong>Answer:</strong> '+q.options[q.answer]+'</p><p>'+q.solution+'</p>')+'</div><aside class="side-note"><h3>Evidence routine</h3><ol><li>Group the x² and x terms.</li><li>Factor the leading coefficient when needed.</li><li>Half the x-coefficient and square it.</li><li>Keep the equation or expression balanced.</li><li>Use the square strategically and verify.</li></ol><textarea class="scratch" data-save="work-'+q.id+'" aria-label="Work for '+q.id+'"></textarea></aside></div>');}

    add("Launch","Completing the Square",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Unit 4 · Lesson 4.4</p><h1 tabindex="-1">Completing the Square</h1><p class="lead">Create a perfect-square trinomial, reveal vertex form, and solve quadratic equations by square-root reasoning.</p><p><span class="badge">Prerequisite Mastery</span><span class="badge">4 target periods</span><span class="badge">4 maximum</span></p><button class="cta" type="button" data-go="1">Begin lesson</button></div><div class="system-art">'+quadraticSvg("coverquad",1,2,-5,-4,8,-8,18,"An upward-opening parabola for y=(x-2)^2-5, with vertex (2,-5), axis x=2, and symmetric zeros 2 minus square root 5 and 2 plus square root 5.")+'<p class="callout"><strong>One balanced square exposes both the turning point and exact solutions.</strong></p></div></div>',"cover");
    add("Scope","Prerequisite mastery and pacing",head("Scope","Prerequisite mastery and pacing")+'<div class="grid"><div class="card tint"><h3>Required Grade 9 coverage</h3><p>Complete the square with integer or rational coefficients at reasonable complexity; use it for vertex form and solving.</p><p><strong>Planned pacing:</strong> 4 target periods; 4 maximum.</p></div><div class="card maroon"><h3>Coverage boundary</h3><p>Proof-heavy conic-section derivations are not included in this course.</p></div></div>');
    add("Goals","Learning goals",head("Goals","Learning goals")+'<p><strong>Learning objective:</strong> Complete the square and use the result strategically.</p><div class="grid four"><div class="card"><strong class="big">1</strong><p>Build perfect-square trinomials.</p></div><div class="card"><strong class="big">2</strong><p>Preserve equality while adding a square.</p></div><div class="card"><strong class="big">3</strong><p>Rewrite quadratics in vertex form.</p></div><div class="card"><strong class="big">4</strong><p>Solve with exact square-root reasoning.</p></div></div>');
    add("Sequence","Four-period learning sequence",head("Sequence","Four-period learning sequence")+'<div class="grid four"><div class="card"><h3>Period 1</h3><p>Perfect squares, geometric meaning, and monic expressions.</p></div><div class="card"><h3>Period 2</h3><p>Balanced equations and rational coefficients.</p></div><div class="card"><h3>Period 3</h3><p>Nonmonic and negative-leading quadratics; vertex form.</p></div><div class="card"><h3>Period 4</h3><p>Exact solving, representations, practice, and mastery evidence.</p></div></div>');
    add("Retrieve","Prerequisite retrieval · perfect-square expansion",head("Retrieve","Prerequisite retrieval · perfect-square expansion")+studentTurn('Expand (x+4)² and identify the middle term as twice a product.','(x+4)²=x²+8x+16. The middle term is 2·x·4=8x.'));
    add("Launch","Purposeful launch · finish the corner",head("Launch","Purposeful launch · finish the corner")+'<div class="grid"><div class="card tint"><h3>Three visible regions</h3><p>An x-by-x square and two x-by-3 rectangles have total area '+math("x^2+6x")+'. What small corner completes one large square?</p><textarea class="scratch" data-save="launch-tile" aria-label="Square completion area reasoning"></textarea></div><div class="card gold">'+reveal("Reveal the completed square",'<p>The missing corner is 3 by 3, so add 9. Then x²+6x+9=(x+3)².</p>')+'</div></div>');
    add("Concept","The perfect-square identity",head("Concept","The perfect-square identity")+'<p class="formula">'+math("x^2+2px+p^2=(x+p)^2")+'</p><p>The x-coefficient is 2p, so p is half that coefficient. The needed constant is p².</p>');
    add("Strategy","Half, then square",head("Strategy","Half, then square")+'<div class="flow"><span>x²+bx</span><b>half b →</b><span>b/2</span><b>square →</b><span>(b/2)²</span><b>complete →</b><span>(x+b/2)²</span></div><p class="callout">This rule works whether b is positive, negative, integer, or rational.</p>');
    add("Representation","Why the added value is a square",head("Representation","Why the added value is a square")+'<div class="grid three"><div class="card"><h3>Start</h3><p>x²</p><p>One x-by-x region.</p></div><div class="card"><h3>Split bx</h3><p>Two rectangles, each x by b/2.</p></div><div class="card"><h3>Finish</h3><p>The missing corner is (b/2) by (b/2), with area (b/2)².</p></div></div>');
    add("Worked example","Worked example · monic expression",head("Worked example","Worked example · monic expression")+'<p>Rewrite '+math("x^2+8x+3")+' in vertex form.</p><div class="step-list"><div class="step">Half of 8 is 4; square 4 to get 16.</div><div class="step">Add and subtract 16: x²+8x+16−16+3.</div><div class="step">Collapse the square: (x+4)²−13.</div><div class="step">Expand to verify x²+8x+3.</div></div>');
    add("Student Turn","Student Turn · monic expression",head("Student Turn","Student Turn · monic expression")+studentTurn('Rewrite x²−10x+7 in vertex form and verify.','Half of −10 is −5; its square is 25. So x²−10x+7=(x−5)²−25+7=(x−5)²−18.'));
    add("Balance","Completing a square inside an equation",head("Balance","Completing a square inside an equation")+'<div class="grid"><div class="card tint"><h3>Equation rule</h3><p>Adding a value to one side requires adding the same value to the other side.</p></div><div class="card gold"><h3>Expression rule</h3><p>Inside one expression, add and subtract the same value so the net change is zero.</p></div></div>');
    add("Worked example","Worked example · solve a monic equation",head("Worked example","Worked example · solve a monic equation")+'<p>Solve '+math("x^2+6x-7=0")+'.</p><div class="step-list"><div class="step">Move the constant: x²+6x=7.</div><div class="step">Half 6 and square: add 9 to both sides.</div><div class="step">(x+3)²=16.</div><div class="step">x+3=±4, so x=1 or x=−7.</div></div>');
    add("Student Turn","Student Turn · balanced equation",head("Student Turn","Student Turn · balanced equation")+studentTurn('Solve x²−4x−5=0 by completing the square.','x²−4x=5. Add 4 to both sides: (x−2)²=9. Then x−2=±3, so x=5 or x=−1.'));
    add("Structure","Even middle coefficients",head("Structure","Even middle coefficients")+'<p>When b is even, b/2 is an integer and the completed square is especially efficient.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Expression</th><th>Half b</th><th>Square added</th></tr></thead><tbody><tr><td>x²+14x</td><td>7</td><td>49</td></tr><tr><td>x²−12x</td><td>−6</td><td>36</td></tr></tbody></table></div>');
    add("Rational coefficients","Odd middle coefficients still work",head("Rational coefficients","Odd middle coefficients still work")+'<p>For '+math("x^2+5x+1")+': half of 5 is 5/2 and its square is 25/4.</p><p class="formula">'+math("x^2+5x+1=(x+5/2)^2-21/4")+'</p><p>Rational values are expected at this prerequisite depth.</p>');
    add("Worked example","Worked example · rational coefficient",head("Worked example","Worked example · rational coefficient")+'<p>Rewrite '+math("x^2+3x-4")+'.</p><div class="step-list"><div class="step">Half of 3 is 3/2; square it to get 9/4.</div><div class="step">Add and subtract 9/4.</div><div class="step">(x+3/2)²−9/4−4.</div><div class="step">Simplify: (x+3/2)²−25/4.</div></div>');
    add("Student Turn","Student Turn · rational half",head("Student Turn","Student Turn · rational half")+studentTurn('Rewrite x²−3x−2 in vertex form.','Half of −3 is −3/2 and its square is 9/4. Thus x²−3x−2=(x−3/2)²−9/4−2=(x−3/2)²−17/4.'));
    add("Nonmonic","When the leading coefficient is not 1",head("Nonmonic","When the leading coefficient is not 1")+'<p>Factor the leading coefficient from the x² and x terms before completing the inner square.</p><p class="formula">'+math("ax^2+bx=a(x^2+(b/a)x)")+'</p><p class="callout warning">Do not factor a from a constant that is outside the grouped x-terms.</p>');
    add("Worked example","Worked example · positive leading coefficient",head("Worked example","Worked example · positive leading coefficient")+'<p>Rewrite '+math("2x^2+8x+3")+'.</p><div class="step-list"><div class="step">Group: 2(x²+4x)+3.</div><div class="step">Complete the inner square: x²+4x=(x+2)²−4.</div><div class="step">Substitute: 2[(x+2)²−4]+3.</div><div class="step">Simplify: 2(x+2)²−5.</div></div>');
    add("Student Turn","Student Turn · nonmonic expression",head("Student Turn","Student Turn · nonmonic expression")+studentTurn('Rewrite 3x²−12x+5 in vertex form.','3(x²−4x)+5=3[(x−2)²−4]+5=3(x−2)²−7.'));
    add("Negative leading","A negative leading coefficient",head("Negative leading","A negative leading coefficient")+'<p>Factor the negative coefficient first. This keeps the inner x² coefficient equal to 1 and protects the signs.</p><p class="formula">'+math("-2x^2+12x=-2(x^2-6x)")+'</p>');
    add("Worked example","Worked example · negative leading coefficient",head("Worked example","Worked example · negative leading coefficient")+'<p>Rewrite '+math("-2x^2+12x-7")+'.</p><div class="step-list"><div class="step">Factor −2: −2(x²−6x)−7.</div><div class="step">Complete inside: x²−6x=(x−3)²−9.</div><div class="step">Distribute: −2(x−3)²+18−7.</div><div class="step">Vertex form: −2(x−3)²+11.</div></div>');
    add("Student Turn","Student Turn · negative leading coefficient",head("Student Turn","Student Turn · negative leading coefficient")+studentTurn('Rewrite −x²−8x+2 in vertex form.','−(x²+8x)+2=−[(x+4)²−16]+2=−(x+4)²+18.'));
    add("Vertex form","Completed square reveals the vertex",head("Vertex form","Completed square reveals the vertex")+'<p class="formula">'+math("y=a(x-h)^2+k")+'</p><div class="grid three"><div class="card"><h3>Vertex</h3><p>(h,k)</p></div><div class="card"><h3>Axis</h3><p>x=h</p></div><div class="card"><h3>Extremum</h3><p>k is a minimum if a&gt;0 and maximum if a&lt;0.</p></div></div>');
    add("Representation","Equivalent rule, clearer graph evidence",head("Representation","Equivalent rule, clearer graph evidence")+'<div class="grid"><div>'+quadraticSvg("vertexgraph",1,2,-5,-4,8,-8,18,"Graph of y=x^2-4x-1, equivalently y=(x-2)^2-5, with vertex (2,-5) and axis x=2.")+'</div><div class="card"><p>'+math("y=x^2-4x-1")+'</p><p>'+math("y=(x-2)^2-5")+'</p><p>The completed-square form reveals the vertex and symmetry without changing the graph.</p></div></div>');
    add("Algorithm","Standard form to vertex form",head("Algorithm","Standard form to vertex form")+'<div class="step-list"><div class="step">Group x² and x terms.</div><div class="step">Factor a from that group if a≠1.</div><div class="step">Complete the inner square using half the inner x-coefficient.</div><div class="step">Simplify outside the square.</div><div class="step">Read (h,k) and expand to verify.</div></div>');
    add("Student Turn","Student Turn · vertex conversion",head("Student Turn","Student Turn · vertex conversion")+studentTurn('Rewrite 4x²−8x+9 in vertex form and state the vertex.','4(x²−2x)+9=4[(x−1)²−1]+9=4(x−1)²+5. The vertex is (1,5).'));
    add("Worked example","Worked example · exact nonfactorable roots",head("Worked example","Worked example · exact nonfactorable roots")+'<p>Solve '+math("x^2-4x-1=0")+'.</p><div class="step-list"><div class="step">Move the constant: x²−4x=1.</div><div class="step">Add 4: (x−2)²=5.</div><div class="step">Take both square roots: x−2=±√5.</div><div class="step">Exact solutions: x=2±√5.</div></div>');
    add("Student Turn","Student Turn · exact roots",head("Student Turn","Student Turn · exact roots")+studentTurn('Solve 2x²+4x−3=0 exactly by completing the square.','2(x²+2x)=3. Then 2[(x+1)²−1]=3, so 2(x+1)²=5 and (x+1)²=5/2. Thus x=−1±√10/2.'));
    add("Precision","Exact first, decimal second",head("Precision","Exact first, decimal second")+'<div class="grid"><div class="card tint"><h3>No calculator</h3><p>Retain exact radicals such as 2±√5.</p></div><div class="card gold"><h3>Calculator interpretation</h3><p>Approximate only when context or a stated precision requires it: 2±√5≈−0.236 and 4.236.</p></div></div>');
    add("Strategy","Choose factoring or completing the square",head("Strategy","Choose factoring or completing the square")+'<div class="grid"><div class="card"><h3>Factor when visible</h3><p>x²−6x+5=(x−1)(x−5), so the roots are immediate.</p></div><div class="card"><h3>Complete when structure matters</h3><p>x²−6x+1=(x−3)²−8 reveals the vertex and exact radical roots.</p></div></div><p class="callout">Strategic choice is part of mastery; not every quadratic needs the same method.</p>');
    add("Misconception","Balance and half-coefficient checks",head("Misconception","Balance and half-coefficient checks")+'<div class="grid"><div class="card maroon"><h3>Incorrect</h3><p>x²+8x=(x+8)²</p><p>Adding 16 to only one side of an equation.</p></div><div class="card tint"><h3>Correction</h3><p>Half 8 to get 4, then square 4. In an equation, add 16 to both sides.</p></div></div>');
    add("Context","Qatar context · solar shade profile",head("Context","Qatar context · solar shade profile")+'<div class="grid"><div class="card"><p>A scale model of a curved solar shade uses '+math("h(x)=-x^2+8x+1")+'. Rewrite it in vertex form and interpret its maximum height.</p><textarea class="scratch" data-save="qatar-shade" aria-label="Solar shade completing-square work"></textarea></div><div class="card gold">'+reveal("Reveal verified interpretation",'<p>h(x)=−(x²−8x)+1=−[(x−4)²−16]+1=−(x−4)²+17. The model reaches a maximum height of 17 units at x=4, subject to the physical domain.</p>')+'</div></div>');

    add("Correct","Misconception correction studio",head("Correct","Misconception correction studio")+'<div class="grid three"><article class="card maroon"><h3>Student A</h3><p>Uses b² instead of (b/2)².</p></article><article class="card maroon"><h3>Student B</h3><p>Adds the completing value to only one side of an equation.</p></article><article class="card maroon"><h3>Student C</h3><p>Forgets to factor a before completing a nonmonic square.</p></article></div><p>Correct each method and verify one correction by expansion.</p><textarea class="scratch" data-save="misconception-correction" aria-label="Misconception corrections"></textarea>');

    const state=loadState();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root){(root||document).querySelectorAll(".math").forEach(function(el){if(window.katex){try{window.katex.render(el.dataset.tex||"",el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus){if(focus===undefined)focus=true;index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach(function(el,i){const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach(function(b,i){b.classList.toggle("current",i===index);});renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;const h=slideEls[index].querySelector("h1,h2");if(h)h.focus();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map(function(s,i){return '<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>';}).join("");document.querySelectorAll("[data-map]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.map));closeDrawers();});});}
    function bind(){document.getElementById("prevBtn").addEventListener("click",function(){go(index-1);});document.getElementById("nextBtn").addEventListener("click",function(){go(index+1);});document.querySelectorAll("[data-go]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.go));});});document.querySelectorAll('input[type="radio"]').forEach(function(input){if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",function(e){state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(function(el){const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",function(){if(key.indexOf("work-")===0)state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(function(b){b.addEventListener("click",function(){checkOne(b.dataset.check);});});document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",function(){openDrawer("mapDrawer");});document.getElementById("notesBtn").addEventListener("click",function(){openDrawer("notesDrawer");});document.getElementById("fullBtn").addEventListener("click",function(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();});document.querySelectorAll(".close").forEach(function(b){b.addEventListener("click",closeDrawers);});document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",function(){state.fields.notebook=n.value;save();});window.addEventListener("keydown",function(e){if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(function(x){return x.id===id;}),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now record the half-coefficient, balance, and verification.":"Not yet. Recheck the leading coefficient, half-and-square value, equation balance, and ± roots.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(function(level){const qs=practice.filter(function(q){return q.level===level;}),n=qs.filter(function(q){return state.answers[q.id]===q.answer;}).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the constructed evidence and exit ticket.":"Use the level pattern to select targeted review.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;const b=d.querySelector("button");if(b)b.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(function(d){d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 4.4 Completing the Square","Exported: "+new Date().toLocaleString(),""];practice.forEach(function(q){lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(function(entry){if(entry[1])lines.push(entry[0]+":",entry[1],"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_4.4_Completing_the_Square.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",function(){renderMath();});document.documentElement.dataset.lessonReady="true";
  })();
  </script>
</body>
</html>

  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-3.6-composition-inverse-concepts-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Let <span class="math" data-tex="f(x)=2x+3"></span> and <span class="math" data-tex="g(x)=x-1"></span>. Find <span class="math" data-tex="f(g(4))"></span>.',options:["9","7","10","5"],answer:0,solution:'First g(4)=3. Then f(3)=2(3)+3=9.'},
      {id:"E2",level:"Easy",calc:false,prompt:'In <span class="math" data-tex="f(g(x))"></span>, which function acts first?',options:["f","g","Both at once","The order does not matter"],answer:1,solution:'The inner function g acts first; its output becomes the input of f.'},
      {id:"E3",level:"Easy",calc:false,prompt:'A table shows <span class="math" data-tex="g(2)=5"></span> and <span class="math" data-tex="f(5)=11"></span>. What is <span class="math" data-tex="f(g(2))"></span>?',options:["5","7","11","22"],answer:2,solution:'Follow the chain: 2 goes through g to 5, then 5 goes through f to 11.'},
      {id:"E4",level:"Easy",calc:false,prompt:'What does an inverse process do?',options:["Repeats the same process","Multiplies every output","Changes a function into a table","Reverses the original input-output process"],answer:3,solution:'An inverse reverses the steps and swaps the roles of inputs and outputs.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Let <span class="math" data-tex="f(x)=x^2"></span> and <span class="math" data-tex="g(x)=x+2"></span>. Find <span class="math" data-tex="f(g(-1))"></span>.',options:["1","-1","3","9"],answer:0,solution:'g(-1)=1, then f(1)=1.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Let <span class="math" data-tex="f(x)=3x-1"></span> and <span class="math" data-tex="g(x)=x+4"></span>. Find <span class="math" data-tex="g(f(2))"></span>.',options:["5","9","13","3"],answer:1,solution:'f(2)=5, then g(5)=9.'},
      {id:"M3",level:"Medium",calc:false,prompt:'A QAR 100 item is discounted by 20%, then a QAR 10 delivery fee is added. What is the final cost?',options:["QAR 70","QAR 88","QAR 90","QAR 110"],answer:2,solution:'Discount first: 100(0.80)=80. Fee second: 80+10=90 QAR.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Let <span class="math" data-tex="f(u)=\\sqrt{u}"></span> and <span class="math" data-tex="g(x)=x-5"></span>. Why is <span class="math" data-tex="f(g(3))"></span> not a real value?',options:["g cannot accept 3","f always returns a negative number","The functions must be reversed","The inner output is -2, which f cannot accept in the real numbers"],answer:3,solution:'g(3)=-2. The outer square-root function needs an input at least 0.'},
      {id:"M5",level:"Medium",calc:false,prompt:'The pairs are 1→4, 2→7, and 3→4. Is this function one-to-one?',options:["No, because two inputs share output 4","Yes, because every input has one output","Yes, because there are three inputs","No, because 7 is larger than 4"],answer:0,solution:'Inputs 1 and 3 both produce 4, so reversing would send 4 to two values.'},
      {id:"M6",level:"Medium",calc:false,prompt:'A process adds 6, then multiplies by 2. Which sequence reverses it?',options:["Subtract 6, then divide by 2","Divide by 2, then subtract 6","Multiply by 2, then add 6","Divide by 6, then subtract 2"],answer:1,solution:'Undo the last step first: divide by 2, then undo adding 6 by subtracting 6.'},
      {id:"H1",level:"Hard",calc:false,prompt:'Let <span class="math" data-tex="f(x)=2x+1"></span> and <span class="math" data-tex="g(x)=x^2"></span>. Compare <span class="math" data-tex="f(g(2))"></span> and <span class="math" data-tex="g(f(2))"></span>.',options:["Both are 9","Both are 25","They are 9 and 25, respectively","They are 25 and 9, respectively"],answer:2,solution:'f(g(2))=f(4)=9, while g(f(2))=g(5)=25. Order matters.'},
      {id:"H2",level:"Hard",calc:false,prompt:'A table gives <span class="math" data-tex="g(-1)=2"></span>, <span class="math" data-tex="g(2)=4"></span>, <span class="math" data-tex="f(2)=5"></span>, and <span class="math" data-tex="f(4)=9"></span>. Find <span class="math" data-tex="f(g(-1))"></span>.',options:["-1","2","9","5"],answer:3,solution:'g(-1)=2, and then f(2)=5.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Let <span class="math" data-tex="f(u)=\\frac{1}{u-4}"></span> and <span class="math" data-tex="g(x)=x+1"></span>. At which input is <span class="math" data-tex="f(g(x))"></span> undefined?',options:["3","4","5","-1"],answer:0,solution:'The outer input cannot equal 4. Since g(x)=x+1, solve x+1=4 to get x=3.'},
      {id:"H4",level:"Hard",calc:false,prompt:'Let <span class="math" data-tex="f(x)=3x-2"></span> and <span class="math" data-tex="g(x)=\\frac{x+2}{3}"></span>. What verifies that they reverse each other?',options:["f(x)=g(x) for every x","Both <span class=\"math\" data-tex=\"f(g(x))\"></span> and <span class=\"math\" data-tex=\"g(f(x))\"></span> simplify to x","Their slopes are equal","Their y-intercepts are opposites"],answer:1,solution:'f(g(x))=3[(x+2)/3]-2=x and g(f(x))=[(3x-2)+2]/3=x.'},
      {id:"H5",level:"Hard",calc:false,prompt:'A service cost is <span class="math" data-tex="C=5n+12"></span>, where n is the number of items. Which expression recovers n from C?',options:["5C+12","(C+12)/5","(C-12)/5","C/5-12"],answer:2,solution:'Undo +12 first, then divide by 5: n=(C-12)/5.'},
      {id:"H6",level:"Hard",calc:false,prompt:'Why does <span class="math" data-tex="f(x)=x^2"></span> on all real numbers not have a single-valued inverse function?',options:["Its outputs are never positive","It has no y-intercept","It is decreasing everywhere","Positive and negative inputs can produce the same output"],answer:3,solution:'For example, f(2)=f(-2)=4. Reversing 4 would create two possible outputs.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'Let <span class="math" data-tex="f(x)=x+4"></span> and <span class="math" data-tex="g(x)=3x"></span>. If <span class="math" data-tex="f(g(x))=19"></span>, find x.',options:["5","15","23/3","1"],answer:0,solution:'f(g(x))=3x+4. Solve 3x+4=19 to get x=5.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'Let <span class="math" data-tex="f(x)=2x-1"></span> and <span class="math" data-tex="g(x)=x+3"></span>. When are <span class="math" data-tex="f(g(x))"></span> and <span class="math" data-tex="g(f(x))"></span> equal?',options:["Only when x=3","Never","For every real x","Only when x=-3"],answer:1,solution:'f(g(x))=2x+5 and g(f(x))=2x+2. The equation 2x+5=2x+2 is impossible.'},
      {id:"C3",level:"Challenge",calc:true,prompt:'Temperature conversion uses <span class="math" data-tex="F=1.8C+32"></span>. Which reverse process converts 95°F to Celsius?',options:["95/1.8-32","(95+32)/1.8","(95-32)/1.8=35","1.8(95-32)"],answer:2,solution:'Undo adding 32, then undo multiplying by 1.8: C=(95-32)/1.8=35°C.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'A function table has outputs 2, 5, 5, and 9 for four different inputs. What happens when the table is reversed?',options:["It is always a function","Every input becomes 5","The repeated output disappears","The reversed relation is not a function because input 5 would have two outputs"],answer:3,solution:'A one-to-one function cannot repeat an output. Reversal turns the repeated 5 into one input paired with two outputs.'}
    ];

    const slides=[];
    function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function math(tex){return '<span class="math" data-tex="'+esc(tex)+'"></span>';}
    function head(stage,title){return '<div class="slide-head"><div><p class="eyebrow">'+esc(stage)+'</p><h2 tabindex="-1">'+esc(title)+'</h2></div><div class="number" aria-hidden="true">'+String(slides.length+1).padStart(2,"0")+'</div></div>';}
    function add(stage,title,body,cls){slides.push({stage:stage,title:title,body:body,cls:cls||""});}
    function reveal(label,body){return '<details class="answer-key"><summary>'+esc(label)+'</summary><div>'+body+'</div></details>';}
    function studentTurn(prompt,answer){return '<div class="grid"><div class="card tint"><h3>Your turn</h3><p>'+prompt+'</p><textarea class="scratch" data-save="turn-'+slides.length+'" aria-label="Student work"></textarea></div><div class="card gold">'+reveal("Reveal verified solution",'<p>'+answer+'</p>')+'</div></div>';}

    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root){(root||document).querySelectorAll(".math").forEach(function(el){if(window.katex){try{window.katex.render(el.dataset.tex||"",el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus){if(focus===undefined)focus=true;index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach(function(el,i){const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach(function(b,i){b.classList.toggle("current",i===index);});renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;const h=slideEls[index].querySelector("h1,h2");if(h)h.focus();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map(function(s,i){return '<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>';}).join("");document.querySelectorAll("[data-map]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.map));closeDrawers();});});}
    function bind(){document.getElementById("prevBtn").addEventListener("click",function(){go(index-1);});document.getElementById("nextBtn").addEventListener("click",function(){go(index+1);});document.querySelectorAll("[data-go]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.go));});});document.querySelectorAll('input[type="radio"]').forEach(function(input){if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",function(e){state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(function(el){const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",function(){if(key.indexOf("work-")===0)state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(function(b){b.addEventListener("click",function(){checkOne(b.dataset.check);});});document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",function(){openDrawer("mapDrawer");});document.getElementById("notesBtn").addEventListener("click",function(){openDrawer("notesDrawer");});document.getElementById("fullBtn").addEventListener("click",function(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();});document.querySelectorAll(".close").forEach(function(b){b.addEventListener("click",closeDrawers);});document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",function(){state.fields.notebook=n.value;save();});window.addEventListener("keydown",function(e){if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(function(x){return x.id===id;}),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the process order, restriction, or reversal.":"Not yet. Check which function acts first, whether the next input is allowed, and how reversal works.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(function(level){const qs=practice.filter(function(q){return q.level===level;}),n=qs.filter(function(q){return state.answers[q.id]===q.answer;}).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the constructed evidence and exit ticket.":"Use the level pattern to select targeted review.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;const b=d.querySelector("button");if(b)b.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(function(d){d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 3.6 Composition and Inverse Concepts","Exported: "+new Date().toLocaleString(),""];practice.forEach(function(q){lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(function(entry){if(entry[1])lines.push(entry[0]+":",entry[1],"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_3.6_Composition_Inverse_Concepts.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",function(){renderMath();});document.documentElement.dataset.lessonReady="true";
  })();
  </script>
</body>

  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-3.4-transformations-parent-functions-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Relative to <span class="math" data-tex="y=x^2"></span>, what does <span class="math" data-tex="y=(x-4)^2"></span> do?',options:["Shift left 4","Shift right 4","Shift up 4","Stretch vertically by 4"],answer:1,solution:'The input x−4 reaches each parent input four units later, so the graph shifts right 4.'},
      {id:"E2",level:"Easy",calc:false,prompt:'Describe <span class="math" data-tex="y=|x|+3"></span> from <span class="math" data-tex="y=|x|"></span>.',options:["Up 3","Down 3","Right 3","Vertical stretch 3"],answer:0,solution:'Adding 3 outside the function adds 3 to every output: shift up 3.'},
      {id:"E3",level:"Easy",calc:false,prompt:'Which transformation creates <span class="math" data-tex="y=-\\sqrt{x}"></span> from <span class="math" data-tex="y=\\sqrt{x}"></span>?',options:["Reflection across x-axis","Reflection across y-axis","Shift left 1","Horizontal stretch 1"],answer:0,solution:'Multiplying every output by −1 reflects the graph across the x-axis.'},
      {id:"E4",level:"Easy",calc:false,prompt:'What happens to the horizontal asymptote of <span class="math" data-tex="y=2^x"></span> in <span class="math" data-tex="y=2^x-5"></span>?',options:["It becomes x=−5","It becomes y=−5","It becomes y=5","It remains y=0"],answer:1,solution:'The entire graph, including its horizontal asymptote y=0, shifts down 5 to y=−5.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Find the vertex of <span class="math" data-tex="y=3(x+2)^2-1"></span>.',options:["(2,−1)","(−2,−1)","(−2,1)","(3,−1)"],answer:1,solution:'Vertex form a(x−h)²+k gives h=−2 and k=−1.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Describe <span class="math" data-tex="y=0.5|x|"></span>.',options:["Vertical compression by factor 0.5","Horizontal compression by factor 0.5","Shift down 0.5","Reflection across x-axis"],answer:0,solution:'The outside factor multiplies every output by 0.5, producing a vertical compression.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Where does <span class="math" data-tex="y=\\sqrt{x-6}+2"></span> begin?',options:["(−6,2)","(6,−2)","(6,2)","(2,6)"],answer:2,solution:'The square-root endpoint (0,0) maps right 6 and up 2 to (6,2).'},
      {id:"M4",level:"Medium",calc:false,prompt:'Relative to <span class="math" data-tex="y=2^x"></span>, <span class="math" data-tex="y=2^{-x}"></span> is reflected across which axis?',options:["x-axis","y-axis","Both axes","Neither axis"],answer:1,solution:'Replacing x with −x reverses input direction, a reflection across the y-axis.'},
      {id:"M5",level:"Medium",calc:false,prompt:'For any parent f, what horizontal effect does <span class="math" data-tex="g(x)=f(2x)"></span> have?',options:["Stretch by 2","Compress by factor 1/2","Shift right 2","Reflect across y-axis"],answer:1,solution:'Input effects are reciprocal: b=2 gives horizontal scale factor 1/|b|=1/2.'},
      {id:"M6",level:"Medium",calc:false,prompt:'If (1,1) lies on f, which point lies on <span class="math" data-tex="g(x)=2f(x-3)-4"></span>?',options:["(−2,−2)","(4,−2)","(4,6)","(2,−3)"],answer:1,solution:'Right 3 maps x=1 to 4; output 1 maps to 2(1)−4=−2.'},
      {id:"H1",level:"Hard",calc:false,prompt:'Which description matches <span class="math" data-tex="y=-2|x-1|+5"></span>?',options:["Vertex (1,5), opens down, vertical stretch 2","Vertex (−1,5), opens up, stretch 2","Vertex (1,−5), opens down, compression 1/2","Vertex (−1,−5), opens up"],answer:0,solution:'Right 1, vertical stretch 2, reflection across x-axis, and up 5 produce vertex (1,5) opening downward.'},
      {id:"H2",level:"Hard",calc:false,prompt:'State the domain of <span class="math" data-tex="q(x)=\\sqrt{3-x}+1"></span>.',options:["[3,∞)","(−∞,3]","[1,∞)","All real numbers"],answer:1,solution:'Require 3−x≥0, so x≤3. The endpoint is included.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Which ordered description matches <span class="math" data-tex="g(x)=3f(2(x+1))-4"></span>?',options:["Left 1; horizontal compression 1/2; vertical stretch 3; down 4","Right 1; horizontal stretch 2; down 3; up 4","Left 2; compression 1; stretch 4; down 3","Right 1; compression 1/2; reflection; up 4"],answer:0,solution:'Inside: x+1 shifts left 1 and factor 2 compresses horizontally by 1/2. Outside: stretch vertically by 3, then down 4.'},
      {id:"H4",level:"Hard",calc:false,prompt:'A parabola has vertex (−2,3), opens downward, and has vertical scale factor 1/2. Which equation fits?',options:["y=−0.5(x+2)²+3","y=0.5(x−2)²+3","y=−2(x+2)²−3","y=−0.5(x−2)²+3"],answer:0,solution:'Use y=a(x−h)²+k with h=−2, k=3, and a=−0.5.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Start with <span class="math" data-tex="f(x)=x"></span>. Shift right 2, reflect across x-axis, then shift up 5. Which equation results?',options:["y=−(x−2)+5","y=−(x+2)−5","y=x−7","y=−x−7"],answer:0,solution:'Right 2 gives f(x−2); reflect outputs to −f(x−2); then add 5.'},
      {id:"H6",level:"Hard",calc:false,prompt:'For <span class="math" data-tex="y=3\\cdot2^{x+1}-4"></span>, what are the horizontal asymptote and image of the parent point (0,1)?',options:["y=−4 and (−1,−1)","y=4 and (1,7)","x=−4 and (−1,3)","y=−1 and (0,−4)"],answer:0,solution:'Shift left 1 maps x=0 to −1; 3(1)−4=−1. The outside −4 shifts the asymptote to y=−4.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'If (−2,4) lies on p, find its image on <span class="math" data-tex="q(x)=-p(0.5(x-6))+1"></span>.',options:["(2,−3)","(5,−3)","(2,5)","(−10,−3)"],answer:0,solution:'Solve 0.5(x−6)=−2 to get x=2. Then y=−4+1=−3.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'Describe <span class="math" data-tex="g(x)=\\sqrt{4x-8}-3"></span> from <span class="math" data-tex="f(x)=\\sqrt{x}"></span>.',options:["Right 2, horizontal compression 1/4, down 3","Right 8, horizontal stretch 4, down 3","Left 2, compression 4, up 3","Right 2, vertical stretch 4, down 3"],answer:0,solution:'Factor the input: 4x−8=4(x−2). Thus right 2, horizontal scale 1/4, and down 3.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'If (2,−1) lies on f, where does it map under <span class="math" data-tex="g(x)=-2f(x+3)+5"></span>?',options:["(−1,7)","(5,7)","(−1,3)","(1,−7)"],answer:0,solution:'x+3=2 gives x=−1. The output becomes −2(−1)+5=7.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'An arch is modeled by <span class="math" data-tex="h(x)=-0.25(x-4)^2+9"></span>. Which transformation description is complete?',options:["Reflect across x-axis; vertical compression 1/4; right 4; up 9","Reflect across y-axis; stretch 4; left 4; down 9","Compression 1/4; left 4; up 9 only","Reflect across x-axis; horizontal compression 1/4; right 9; up 4"],answer:0,solution:'The outside coefficient −0.25 reflects across x-axis and compresses vertically; x−4 shifts right 4; +9 shifts up 9.'}
    ];
    const slides=[];
    function add(stage,title,body,cls){slides.push({stage:stage,title:title,body:body,cls:cls||""});}
    function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
    function head(stage,title){return '<div class="slide-head"><div><p class="eyebrow">'+esc(stage)+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';}
    function reveal(label,content){return '<details class="answer-key"><summary>'+label+'</summary>'+content+'</details>';}
    function math(tex){return '<span class="math" data-tex="'+esc(tex)+'"></span>';}
    function plot(id,curves,points,desc){
      const W=620,H=420,s=36,cx=W/2,cy=H/2;
      let grid="";
      for(let i=-8;i<=8;i++){const x=cx+i*s;grid+='<line class="gridline" x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'"/>';}
      for(let j=-5;j<=5;j++){const y=cy-j*s;grid+='<line class="gridline" x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'"/>';}
      let paths="";
      curves.forEach(function(curve){
        const lo=curve.domain?curve.domain[0]:-7.5,hi=curve.domain?curve.domain[1]:7.5;
        let d="",started=false;
        for(let n=0;n<=300;n++){const x=lo+(hi-lo)*n/300,y=curve.fn(x);if(!Number.isFinite(y)||y<-5.6||y>5.6){started=false;continue;}const X=cx+x*s,Y=cy-y*s;d+=(started?"L":"M")+X.toFixed(1)+" "+Y.toFixed(1)+" ";started=true;}
        paths+='<path d="'+d+'" fill="none" stroke="'+curve.color+'" stroke-width="'+(curve.width||4)+'" stroke-linecap="round" stroke-linejoin="round"/>';
      });
      let ps="";
      (points||[]).forEach(function(p){ps+='<circle cx="'+(cx+p.x*s)+'" cy="'+(cy-p.y*s)+'" r="6" fill="'+(p.color||"#c69b37")+'" stroke="#102a43" stroke-width="2"/><text class="gtext" x="'+(cx+p.x*s+9)+'" y="'+(cy-p.y*s-9)+'">'+esc(p.label||("("+p.x+","+p.y+")"))+'</text>';});
      const legend='<div class="legend">'+curves.map(function(c){return '<span><i class="swatch" style="background:'+c.color+'"></i>'+esc(c.label)+'</span>';}).join("")+'</div>';
      return legend+'<svg class="graph" role="img" aria-labelledby="'+id+'-title '+id+'-desc" viewBox="0 0 '+W+' '+H+'"><title id="'+id+'-title">Parent and transformed function graph</title><desc id="'+id+'-desc">'+esc(desc)+' Equal scales are used on both axes.</desc><defs><marker id="'+id+'-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#52687a"/></marker></defs>'+grid+'<line class="axis" x1="14" y1="'+cy+'" x2="'+(W-14)+'" y2="'+cy+'" marker-end="url(#'+id+'-arrow)"/><line class="axis" x1="'+cx+'" y1="'+(H-14)+'" x2="'+cx+'" y2="14" marker-end="url(#'+id+'-arrow)"/><text class="gtext" x="'+(W-30)+'" y="'+(cy-10)+'">x</text><text class="gtext" x="'+(cx+10)+'" y="25">y</text>'+paths+ps+'</svg><p class="callout">An equal-scale graph with direct color labels shows the parent and its transformation.</p>';
    }

    add("Launch","Transformations of Parent Functions",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Unit 3 · Lesson 3.4</p><h1 tabindex="-1">Transformations of Parent Functions</h1><p class="lead">Predict and construct common parent-function transformations through equations, key points, graphs, and precise parameter language.</p><p><span class="badge">Bridge Depth</span><span class="badge">3 target periods</span><span class="badge">3 maximum</span></p><button class="cta" type="button" data-go="1">Begin lesson</button></div><div class="system-art">'+plot("cover-plot",[{label:"Parent y=x²",color:"#c69b37",fn:function(x){return x*x;},domain:[-2.3,2.3]},{label:"Transformed y=−0.5(x−2)²+3",color:"#ffffff",fn:function(x){return -0.5*(x-2)*(x-2)+3;},domain:[-1.5,5.5]}],[],"A quadratic parent opens upward at the origin while a transformed parabola opens downward with vertex at (2,3).")+'</div></div>',"cover");
    add("Orientation","Depth, pacing, and boundary",head("Orientation","Depth, pacing, and boundary")+'<div class="grid three"><article class="card"><strong class="big">B</strong><h3>Bridge Depth</h3><p>Build transformation fluency needed before AP Precalculus.</p></article><article class="card"><strong class="big">3</strong><h3>Target periods</h3><p>Maximum pacing is also three periods.</p></article><article class="card"><h3>Coverage ceiling</h3><p>No AP-level chains of rational, logarithmic, or trigonometric functions and no detailed covariation justifications.</p></article></div>');
    add("Goals","Learning goals",head("Goals","Learning goals")+'<div class="grid"><article class="card tint"><h3>I can predict</h3><p>Use parameter effects to predict translations, reflections, and scaling.</p></article><article class="card tint"><h3>I can construct</h3><p>Graph transformations of linear, quadratic, absolute-value, radical, and basic exponential parents.</p></article><article class="card tint"><h3>I can write</h3><p>Build a transformed equation from a description or key graph features.</p></article><article class="card tint"><h3>I can justify</h3><p>Map key points and explain the correct reciprocal horizontal scale.</p></article></div>');
    add("Retrieve","Prerequisite retrieval",head("Retrieve","Prerequisite retrieval")+'<div class="grid"><div class="card"><h3>Identify each parent</h3><ol><li>'+math("y=x")+'</li><li>'+math("y=x^2")+'</li><li>'+math("y=|x|")+'</li><li>'+math("y=\\sqrt{x}")+'</li><li>'+math("y=2^x")+'</li></ol></div><div class="card gold"><h3>Sketch anchor features</h3><p>Record one key point, domain, range, and recognizable shape for each family.</p><textarea class="scratch" data-save="retrieval"></textarea>'+reveal("Reveal retrieval guide",'<ul><li>Linear: line through (0,0).</li><li>Quadratic: U-shape, vertex (0,0).</li><li>Absolute value: V-shape, vertex (0,0).</li><li>Square root: begins at (0,0), extends right.</li><li>Exponential: passes (0,1), approaches y=0.</li></ul>')+'</div></div>');
    add("Concept","Parent-family gallery",head("Concept","Parent-family gallery")+'<div class="grid five"><div class="card"><h3>Linear</h3>'+math("f(x)=x")+'<p>(0,0), (1,1)</p></div><div class="card"><h3>Quadratic</h3>'+math("f(x)=x^2")+'<p>(0,0), (±1,1)</p></div><div class="card"><h3>Absolute value</h3>'+math("f(x)=|x|")+'<p>(0,0), (±1,1)</p></div><div class="card"><h3>Radical</h3>'+math("f(x)=\\sqrt{x}")+'<p>(0,0), (1,1), (4,2)</p></div><div class="card"><h3>Exponential</h3>'+math("f(x)=2^x")+'<p>(0,1), (1,2)</p></div></div><p class="callout">A transformation preserves the family while relocating or rescaling its key features.</p>');
    add("Concept","The transformation frame",head("Concept","The transformation frame")+'<div class="section-banner"><div><p class="formula">'+math("g(x)=a f(b(x-h))+k")+'</p><div class="grid"><div class="card"><h3>Inside the function</h3><p>b and h change inputs: horizontal scale/reflection and horizontal translation.</p></div><div class="card"><h3>Outside the function</h3><p>a and k change outputs: vertical scale/reflection and vertical translation.</p></div></div></div><div class="section-code">IN → OUT</div></div>');
    add("Concept","Point-mapping rule",head("Concept","Point-mapping rule")+'<p>If '+math("(u,v)")+' lies on '+math("y=f(x)")+', then under '+math("g(x)=a f(b(x-h))+k")+' it maps to:</p><p class="formula">'+math("(u,v)\\longmapsto(h+u/b,\\;k+av)")+'</p><div class="flow"><span>Parent input u</span><b>→</b><span>h + u/b</span><span>Parent output v</span><b>→</b><span>k + av</span></div><p class="callout warning"><strong>Horizontal effects are reciprocal.</strong> Dividing u by b explains why f(2x) compresses by 1/2.</p>');
    add("Concept","A reliable order",head("Concept","A reliable order")+'<div class="step-list"><div class="step"><strong>Name the parent family.</strong> Record anchor points and defining features.</div><div class="step"><strong>Factor the inside expression.</strong> Write b(x−h) before naming horizontal effects.</div><div class="step"><strong>Map inputs.</strong> Apply horizontal reflection/scale and translation.</div><div class="step"><strong>Map outputs.</strong> Apply vertical reflection/scale and translation.</div><div class="step"><strong>Verify.</strong> Substitute a mapped point and check domain, range, vertex/endpoint, or asymptote.</div></div>');
    add("Translation","Horizontal translation",head("Translation","Horizontal translation")+'<div class="grid"><div class="card"><p class="formula">'+math("g(x)=f(x-h)")+'</p><p>Shift right h when h&gt;0.</p></div><div class="card"><p class="formula">'+math("g(x)=f(x+h)")+'</p><p>Shift left h when h&gt;0.</p></div></div>'+plot("hshift",[{label:"Parent y=x²",color:"#7a1734",fn:function(x){return x*x;},domain:[-2.3,2.3]},{label:"y=(x−3)²",color:"#087f8c",fn:function(x){return (x-3)*(x-3);},domain:[0.7,5.3]}],[{x:0,y:0,label:"Parent vertex"},{x:3,y:0,label:"New vertex",color:"#087f8c"}],"The transformed quadratic has the same shape and its vertex moves from (0,0) to (3,0)."));

    add("Translation","Vertical translation",head("Translation","Vertical translation")+'<div class="grid"><div class="card"><p class="formula">'+math("g(x)=f(x)+k")+'</p><p>Every output increases by k: up k if k&gt;0 and down |k| if k&lt;0.</p></div><div class="card">'+plot("vshift",[{label:"Parent y=|x|",color:"#7a1734",fn:function(x){return Math.abs(x);},domain:[-5,5]},{label:"y=|x|−2",color:"#087f8c",fn:function(x){return Math.abs(x)-2;},domain:[-5,5]}],[{x:0,y:0,label:"(0,0)"},{x:0,y:-2,label:"(0,−2)",color:"#087f8c"}],"The V-shaped parent moves down two units without changing width.")+'</div></div>');
    add("Worked example","Worked example · shift down",head("Worked example","Worked example · shift down")+'<p>For '+math("g(x)=|x|-2")+', the outside −2 subtracts 2 from each output.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Parent point</th><th>Output map</th><th>New point</th></tr></thead><tbody><tr><td>(0,0)</td><td>0−2</td><td>(0,−2)</td></tr><tr><td>(2,2)</td><td>2−2</td><td>(2,0)</td></tr><tr><td>(−2,2)</td><td>2−2</td><td>(−2,0)</td></tr></tbody></table></div><p class="callout">The x-coordinates remain unchanged because the change is outside.</p>');

    add("Reflection","Reflection across the x-axis",head("Reflection","Reflection across the x-axis")+'<p class="formula">'+math("g(x)=-f(x)")+'</p><p>Each output v maps to −v. Points cross the x-axis while x-coordinates stay fixed.</p>'+plot("xref",[{label:"Parent y=√x",color:"#7a1734",fn:function(x){return Math.sqrt(x);},domain:[0,7.5]},{label:"y=−√x",color:"#087f8c",fn:function(x){return -Math.sqrt(x);},domain:[0,7.5]}],[{x:4,y:2,label:"(4,2)"},{x:4,y:-2,label:"(4,−2)",color:"#087f8c"}],"The square-root curve above the x-axis is reflected to a matching curve below it."));

    add("Reflection","Reflection across the y-axis",head("Reflection","Reflection across the y-axis")+'<p class="formula">'+math("g(x)=f(-x)")+'</p><p>Each input u maps to −u. Points cross the y-axis while outputs stay fixed.</p>'+plot("yref",[{label:"Parent y=2^x",color:"#7a1734",fn:function(x){return Math.pow(2,x);},domain:[-5,2.4]},{label:"y=2^(−x)",color:"#087f8c",fn:function(x){return Math.pow(2,-x);},domain:[-2.4,5]}],[{x:1,y:2,label:"(1,2)"},{x:-1,y:2,label:"(−1,2)",color:"#087f8c"}],"An increasing exponential is mirrored across the y-axis to become decreasing."));

    add("Student Turn","Student Turn · y-axis reflection",head("Student Turn","Student Turn · y-axis reflection")+studentTurn('Describe the endpoint and direction of '+math("y=\\sqrt{-x}")+'. Map (0,0), (1,1), and (4,2).','Reflect across the y-axis. Endpoint remains (0,0); the graph extends left. The images are (0,0),(−1,1),(−4,2).'));

    practice.forEach(practiceSlide);

    add("Mastery","Score differentiated evidence",head("Mastery","Score differentiated evidence")+'<div class="mastery"><div><span>Easy</span><strong data-level-score="Easy">0</strong><small>/4</small></div><div><span>Medium</span><strong data-level-score="Medium">0</strong><small>/6</small></div><div><span>Hard</span><strong data-level-score="Hard">0</strong><small>/6</small></div><div><span>Challenge</span><strong data-level-score="Challenge">0</strong><small>/4</small></div><div><span>Total</span><strong id="totalScore">0</strong><small>/20</small></div></div><p><button class="check-button" id="scoreBtn" type="button">Score all responses</button></p><p id="scoreSummary" class="callout" role="status">A score of 16/20 plus accurate constructed evidence indicates readiness.</p>');
    add("Misconception clinic","Correct three high-risk errors",head("Misconception clinic","Correct three high-risk errors")+'<div class="grid three"><article class="card maroon"><h3>Inside sign</h3><p>x+4 shifts left 4, not right.</p></article><article class="card maroon"><h3>Horizontal factor</h3><p>f(3x) compresses by 1/3, not stretches by 3.</p></article><article class="card maroon"><h3>Reflection axis</h3><p>−f(x) reflects outputs across x-axis; f(−x) reflects inputs across y-axis.</p></article></div><textarea class="scratch" data-save="misconception-correction" aria-label="Misconception correction"></textarea>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","AP-readiness transfer")+'<div class="grid three"><article class="card"><h3>Parameter language</h3><p>Connect each parameter to a verifiable effect.</p></article><article class="card"><h3>Representation transfer</h3><p>Move between description, equation, table, and graph.</p></article><article class="card"><h3>Constraint awareness</h3><p>Update domain, range, endpoint, vertex, or asymptote after a transformation.</p></article></div><p class="callout success">These habits prepare students for AP function analysis while rational/log/trig chains and detailed covariation arguments remain outside this lesson.</p>');
    add("Context","Qatar context · transformed arch model",head("Context","Qatar context · transformed arch model")+'<div class="grid"><div class="card"><p>A decorative arch cross-section is modeled by '+math("h(x)=-0.25(x-4)^2+9")+', where x and h are meters.</p><ol><li>Name all transformations from y=x².</li><li>State the maximum point.</li><li>Find where the model reaches ground level.</li></ol><textarea class="scratch" data-save="qatar-context"></textarea></div><div class="card gold">'+reveal("Reveal verified model analysis",'<p>Reflect across x-axis, vertical compression 1/4, right 4, up 9. Maximum (4,9). Set 0=−0.25(x−4)²+9, so (x−4)²=36 and x=−2 or 10. The modeled span is 12 m between ground contacts.</p>')+'</div></div>');
    add("Exit ticket","Exit ticket",head("Exit ticket","Exit ticket")+'<div class="question-box"><ol><li>Describe '+math("y=-3|x+2|+5")+' from '+math("y=|x|")+'.</li><li>Map parent points (0,0),(1,1),(4,2) onto '+math("y=2\\sqrt{x-3}-1")+'.</li><li>Explain why '+math("f(4x)")+' has horizontal scale 1/4.</li><li>Write a transformed quadratic with vertex (2,−3), opening downward, and vertical scale factor 2.</li></ol><textarea class="scratch" data-save="exit-ticket" aria-label="Exit ticket work"></textarea>'+reveal("Reveal exit-ticket key",'<ol><li>Left 2; vertical stretch 3; reflect x-axis; up 5.</li><li>(3,−1),(4,1),(7,3).</li><li>Parent input u occurs when 4x=u, so x=u/4.</li><li>y=−2(x−2)²−3.</li></ol>')+'</div>');
    add("Reflect","Mastery reflection",head("Reflect","Mastery reflection")+'<div class="grid"><div class="card tint"><h3>Ready to advance</h3><p>At least 16/20, accurate point mapping, correct horizontal reciprocity, and a complete exit ticket.</p></div><div class="card gold"><h3>Targeted review</h3><p>Return to parent anchors, inside sign, reciprocal horizontal scale, reflection axis, or feature updates.</p></div></div><label for="reflection"><h3>My evidence and next action</h3></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea>');
    add("Complete","Transformation bridge secured",head("Complete","Transformation bridge secured")+'<div class="grid"><div class="card"><h3>Evidence to retain</h3><ul><li>Differentiated practice score</li><li>Mapped key points</li><li>Multiple-representation explanation</li><li>Exit-ticket construction</li></ul><button class="secondary" id="exportFinal" type="button">Export lesson work</button></div><div class="card maroon"><h3>Next lesson</h3><p><strong>3.5 Average Rate of Change</strong></p><p>Connect secant slope, units, intervals, and contextual interpretation.</p><a class="cta" href="../../lesson.html?grade=9&amp;path=common&amp;lesson=3.5">View next lesson preview</a></div></div>');

    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map(function(s,i){return '<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==="cover"?"cover":"")+'">'+s.body+'</div></section>';}).join("");
    const slideEls=[].slice.call(document.querySelectorAll(".slide"));
    let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",""))-1||0));
    function loadState(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}
    const state=loadState();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root){(root||document).querySelectorAll(".math").forEach(function(el){if(window.katex){try{window.katex.render(el.dataset.tex||"",el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus){if(focus===undefined)focus=true;index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach(function(el,i){const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach(function(b,i){b.classList.toggle("current",i===index);});renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;const h=slideEls[index].querySelector("h1,h2");if(h)h.focus();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map(function(s,i){return '<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>';}).join("");document.querySelectorAll("[data-map]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.map));closeDrawers();});});}
    function bind(){document.getElementById("prevBtn").addEventListener("click",function(){go(index-1);});document.getElementById("nextBtn").addEventListener("click",function(){go(index+1);});document.querySelectorAll("[data-go]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.go));});});document.querySelectorAll('input[type="radio"]').forEach(function(input){if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",function(e){state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(function(el){const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",function(){if(key.indexOf("work-")===0)state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(function(b){b.addEventListener("click",function(){checkOne(b.dataset.check);});});document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",function(){openDrawer("mapDrawer");});document.getElementById("notesBtn").addEventListener("click",function(){openDrawer("notesDrawer");});document.getElementById("fullBtn").addEventListener("click",function(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();});document.querySelectorAll(".close").forEach(function(b){b.addEventListener("click",closeDrawers);});document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",function(){state.fields.notebook=n.value;save();});window.addEventListener("keydown",function(e){if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(function(x){return x.id===id;}),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the parameter effects or point map.":"Not yet. Separate inside from outside changes and verify a key point.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(function(level){const qs=practice.filter(function(q){return q.level===level;}),n=qs.filter(function(q){return state.answers[q.id]===q.answer;}).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the constructed evidence and exit ticket.":"Use the level pattern to select targeted review.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;const b=d.querySelector("button");if(b)b.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(function(d){d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 3.4 Transformations of Parent Functions","Exported: "+new Date().toLocaleString(),""];practice.forEach(function(q){lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(function(entry){if(entry[1])lines.push(entry[0]+":",entry[1],"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_3.4_Transformations_Parent_Functions.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",function(){renderMath();});document.documentElement.dataset.lessonReady="true";
  })();
  </script>

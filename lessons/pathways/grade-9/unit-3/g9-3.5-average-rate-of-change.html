  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-3.5-average-rate-of-change-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'For <span class="math" data-tex="f(x)=2x+5"></span>, find the average rate of change on <span class="math" data-tex="[1,4]"></span>.',options:["2","3","7","11"],answer:0,solution:'[f(4)−f(1)]/(4−1)=(13−7)/3=2.'},
      {id:"E2",level:"Easy",calc:false,prompt:'A quantity rises from 12 meters to 27 meters in 5 seconds. What is its average rate of change?',options:["5 m/s","3 m/s","7.8 m/s","15 m/s"],answer:1,solution:'Change in output is 15 meters; change in time is 5 seconds. The rate is 3 m/s.'},
      {id:"E3",level:"Easy",calc:false,prompt:'Which expression gives the average rate of change of f on [a,b]?',options:["[f(a)−f(b)]/(b−a)","[f(b)+f(a)]/(b+a)","[f(b)−f(a)]/(b−a)","f(b)−f(a)"],answer:2,solution:'Average rate of change is change in output divided by the matching change in input.'},
      {id:"E4",level:"Easy",calc:false,prompt:'If f(2)=9 and f(6)=1, what is the average rate of change on [2,6]?',options:["2","−8","−1/2","−2"],answer:3,solution:'(1−9)/(6−2)=−8/4=−2.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Find the average rate of change of <span class="math" data-tex="f(x)=x^2"></span> on <span class="math" data-tex="[2,5]"></span>.',options:["7","3","21","9"],answer:0,solution:'(25−4)/(5−2)=21/3=7.'},
      {id:"M2",level:"Medium",calc:false,prompt:'The table gives (x,f(x))=(0,4),(2,10),(5,19). Find the average rate on [2,5].',options:["9","3","5","29/5"],answer:1,solution:'(19−10)/(5−2)=9/3=3.'},
      {id:"M3",level:"Medium",calc:false,prompt:'A tank volume changes from 180 L at 2 min to 132 L at 8 min. Interpret the average rate.',options:["Volume increased 8 L per minute","Volume decreased 48 L per minute","Volume decreased 8 L per minute on average","Volume was constant"],answer:2,solution:'(132−180)/(8−2)=−48/6=−8 L/min; the negative sign indicates decrease.'},
      {id:"M4",level:"Medium",calc:false,prompt:'For <span class="math" data-tex="g(x)=x^2-4x"></span>, find the average rate on <span class="math" data-tex="[1,3]"></span>.',options:["−2","0","2","−4"],answer:1,solution:'g(1)=−3 and g(3)=−3, so the quotient is 0/2=0.'},
      {id:"M5",level:"Medium",calc:false,prompt:'What geometric object represents average rate of change on a graph?',options:["The y-intercept","The distance between the endpoints","The area under the graph","The slope of the secant line through the two endpoint points"],answer:3,solution:'The endpoint points determine a secant line, and its slope equals the difference quotient.'},
      {id:"M6",level:"Medium",calc:true,prompt:'For <span class="math" data-tex="h(x)=1.5^x"></span>, approximate the average rate on [0,3] to the nearest hundredth.',options:["1.50","2.38","0.79","3.38"],answer:2,solution:'(1.5³−1)/(3−0)=(3.375−1)/3≈0.79.'},
      {id:"H1",level:"Hard",calc:false,prompt:'For <span class="math" data-tex="p(x)=x^3-2x"></span>, find the average rate on [−1,2].',options:["1","3","7/3","−1"],answer:0,solution:'p(−1)=1 and p(2)=4, so (4−1)/(2−(−1))=3/3=1.'},
      {id:"H2",level:"Hard",calc:false,prompt:'A quadratic has average rates 2 on [0,2] and 6 on [2,4]. What conclusion is supported?',options:["It is linear","Its output is increasing faster on the second interval","Its output decreases on both intervals","Its average rate is always 4"],answer:1,solution:'Both rates are positive, and 6>2, so the output increases faster on the second interval.'},
      {id:"H3",level:"Hard",calc:false,prompt:'For <span class="math" data-tex="f(x)=3x^2+1"></span>, which formula gives the average rate on [a,b] after simplification?',options:["3(b−a)","a+b","3(a+b)","6ab"],answer:2,solution:'[3b²+1−(3a²+1)]/(b−a)=3(b²−a²)/(b−a)=3(a+b).'},
      {id:"H4",level:"Hard",calc:false,prompt:'A function has average rate 0 on [1,5]. Which statement must be true?',options:["The function is constant everywhere","The graph never rises","The graph is linear","f(1)=f(5)"],answer:3,solution:'A zero difference quotient means f(5)−f(1)=0. Interior behavior is not determined.'},
      {id:"H5",level:"Hard",calc:false,prompt:'The average rate on [2,6] is −3. If f(2)=11, find f(6).',options:["8","−1","−7","23"],answer:1,solution:'[f(6)−11]/4=−3, so f(6)−11=−12 and f(6)=−1.'},
      {id:"H6",level:"Hard",calc:true,prompt:'For <span class="math" data-tex="q(x)=2^x"></span>, compare rates on [0,2] and [2,4].',options:["3 then 12; equal ratio 1","1.5 then 3; it doubles","1.5 then 6; the later interval is four times as large","2 then 8; it quadruples"],answer:2,solution:'(4−1)/2=1.5 and (16−4)/2=6. The second rate is 4 times the first.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'For <span class="math" data-tex="f(x)=x^2+kx"></span>, the average rate on [1,4] is 7. Find k.',options:["−2","7","5","2"],answer:3,solution:'[16+4k−(1+k)]/3=(15+3k)/3=5+k=7, so k=2.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'The average rate of <span class="math" data-tex="f(x)=x^2"></span> on [a,a+2] equals 10. Find a.',options:["3","4","5","8"],answer:1,solution:'[(a+2)²−a²]/2=(4a+4)/2=2a+2=10, so a=4.'},
      {id:"C3",level:"Challenge",calc:false,prompt:'A function has f(0)=5. Its average rate is 3 on [0,4] and −2 on [4,7]. Find f(7).',options:["17","3","11","−1"],answer:2,solution:'f(4)=5+3(4)=17. Then f(7)=17+(−2)(3)=11.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'For <span class="math" data-tex="r(x)=x^3-4x"></span>, the average rate on [−2,2] is zero. What explains this?',options:["The function is constant on [−2,2]","Every secant slope is zero","The graph has no turning behavior","The endpoint outputs are equal even though the function changes inside the interval"],answer:3,solution:'r(−2)=0 and r(2)=0, so the endpoint change is zero; this does not erase interior variation.'}
    ];

    const slides=[];
    function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function math(tex){return '<span class="math" data-tex="'+esc(tex)+'"></span>';}
    function head(stage,title){return '<div class="slide-head"><div><p class="eyebrow">'+esc(stage)+'</p><h2 tabindex="-1">'+esc(title)+'</h2></div><div class="number" aria-hidden="true">'+String(slides.length+1).padStart(2,"0")+'</div></div>';}
    function add(stage,title,body,cls){slides.push({stage:stage,title:title,body:body,cls:cls||""});}
    function reveal(label,body){return '<details class="answer-key"><summary>'+esc(label)+'</summary><div>'+body+'</div></details>';}
    function studentTurn(prompt,answer){return '<div class="grid"><div class="card tint"><h3>Your turn</h3><p>'+prompt+'</p><textarea class="scratch" data-save="turn-'+slides.length+'" aria-label="Student work"></textarea></div><div class="card gold">'+reveal("Reveal verified solution",'<p>'+answer+'</p>')+'</div></div>';}
    function plotRate(id,fn,a,b,label,desc){const W=660,H=390,xmin=-2,xmax=7,ymin=-6,ymax=30,pad=48;function X(x){return pad+(x-xmin)/(xmax-xmin)*(W-2*pad);}function Y(y){return H-pad-(y-ymin)/(ymax-ymin)*(H-2*pad);}let grid="";for(let x=-2;x<=7;x++)grid+='<line class="gridline" x1="'+X(x)+'" y1="'+Y(ymin)+'" x2="'+X(x)+'" y2="'+Y(ymax)+'"/>';for(let y=-5;y<=30;y+=5)grid+='<line class="gridline" x1="'+X(xmin)+'" y1="'+Y(y)+'" x2="'+X(xmax)+'" y2="'+Y(y)+'"/>';let d="";for(let x=xmin;x<=xmax;x+=.06){const y=fn(x);if(y<ymin-4||y>ymax+4)continue;d+=(d?" L ":"M ")+X(x).toFixed(1)+" "+Y(y).toFixed(1);}const ya=fn(a),yb=fn(b),m=(yb-ya)/(b-a),yL=ya+m*(xmin-a),yR=ya+m*(xmax-a);return '<svg class="graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-labelledby="'+id+'t '+id+'d"><title id="'+id+'t">'+esc(label)+'</title><desc id="'+id+'d">'+esc(desc)+' Equal scales are used on both axes.</desc><defs><marker id="'+id+'arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#52687a"/></marker></defs>'+grid+'<line class="axis" x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'" marker-end="url(#'+id+'arrow)"/><line class="axis" x1="'+X(0)+'" y1="'+Y(ymin)+'" x2="'+X(0)+'" y2="'+Y(ymax)+'" marker-end="url(#'+id+'arrow)"/><path d="'+d+'" fill="none" stroke="#7a1734" stroke-width="4"/><line x1="'+X(xmin)+'" y1="'+Y(yL)+'" x2="'+X(xmax)+'" y2="'+Y(yR)+'" stroke="#087f8c" stroke-width="4"/><circle cx="'+X(a)+'" cy="'+Y(ya)+'" r="7" fill="#c69b37"/><circle cx="'+X(b)+'" cy="'+Y(yb)+'" r="7" fill="#c69b37"/><text class="gtext" x="'+(X(a)+8)+'" y="'+(Y(ya)-8)+'">('+a+','+ya+')</text><text class="gtext" x="'+(X(b)+8)+'" y="'+(Y(yb)-8)+'">('+b+','+yb+')</text><text class="gtext" x="500" y="42" fill="#7a1734">function</text><text class="gtext" x="500" y="64" fill="#087f8c">secant line</text></svg>';}

    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map(function(s,i){return '<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==="cover"?"cover":"")+'">'+s.body+'</div></section>';}).join("");
    const slideEls=[].slice.call(document.querySelectorAll(".slide"));
    let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",""))-1||0));
    function loadState(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}
    const state=loadState();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root){(root||document).querySelectorAll(".math").forEach(function(el){if(window.katex){try{window.katex.render(el.dataset.tex||"",el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus){if(focus===undefined)focus=true;index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach(function(el,i){const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach(function(b,i){b.classList.toggle("current",i===index);});renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;const h=slideEls[index].querySelector("h1,h2");if(h)h.focus();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map(function(s,i){return '<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>';}).join("");document.querySelectorAll("[data-map]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.map));closeDrawers();});});}
    function bind(){document.getElementById("prevBtn").addEventListener("click",function(){go(index-1);});document.getElementById("nextBtn").addEventListener("click",function(){go(index+1);});document.querySelectorAll("[data-go]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.go));});});document.querySelectorAll('input[type="radio"]').forEach(function(input){if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",function(e){state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(function(el){const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",function(){if(key.indexOf("work-")===0)state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(function(b){b.addEventListener("click",function(){checkOne(b.dataset.check);});});document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",function(){openDrawer("mapDrawer");});document.getElementById("notesBtn").addEventListener("click",function(){openDrawer("notesDrawer");});document.getElementById("fullBtn").addEventListener("click",function(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();});document.querySelectorAll(".close").forEach(function(b){b.addEventListener("click",closeDrawers);});document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",function(){state.fields.notebook=n.value;save();});window.addEventListener("keydown",function(e){if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(function(x){return x.id===id;}),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now show the endpoint quotient, units, and interpretation.":"Not yet. Check endpoint order, interval length, sign, and units.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(function(level){const qs=practice.filter(function(q){return q.level===level;}),n=qs.filter(function(q){return state.answers[q.id]===q.answer;}).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the constructed evidence and exit ticket.":"Use the level pattern to select targeted review.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;const b=d.querySelector("button");if(b)b.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(function(d){d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 3.5 Average Rate of Change","Exported: "+new Date().toLocaleString(),""];practice.forEach(function(q){lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(function(entry){if(entry[1])lines.push(entry[0]+":",entry[1],"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_3.5_Average_Rate_of_Change.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",function(){renderMath();});document.documentElement.dataset.lessonReady="true";
  })();
  </script>
</body>
</html>

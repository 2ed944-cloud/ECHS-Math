  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-2.1-systems-graphing-substitution-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Where do <span class="math" data-tex="y=x+1"></span> and <span class="math" data-tex="y=-x+5"></span> intersect?',options:["(2, 3)","(3, 2)","(1, 4)","(0, 5)"],answer:0,solution:'Set the outputs equal: <span class="math" data-tex="x+1=-x+5\\Rightarrow 2x=4\\Rightarrow x=2"></span>. Then <span class="math" data-tex="y=3"></span>, so the intersection is <span class="math" data-tex="(2,3)"></span>.'},
      {id:"E2",level:"Easy",calc:false,prompt:'For <span class="math" data-tex="y=2x+1"></span> and <span class="math" data-tex="y=7"></span>, what value of <span class="math" data-tex="x"></span> solves the system?',options:["2","3","4","7"],answer:1,solution:'Substitute <span class="math" data-tex="y=7"></span>: <span class="math" data-tex="7=2x+1\\Rightarrow 6=2x\\Rightarrow x=3"></span>.'},
      {id:"E3",level:"Easy",calc:false,prompt:'How many solutions does <span class="math" data-tex="y=2x+1"></span> and <span class="math" data-tex="y=2x-3"></span> have?',options:["infinitely many","exactly two","no solution","exactly one"],answer:2,solution:'The lines have equal slope 2 but different intercepts. They are parallel, so there is no intersection and no solution.'},
      {id:"E4",level:"Easy",calc:false,prompt:'Classify <span class="math" data-tex="y=3x-2"></span> and <span class="math" data-tex="3x-y=2"></span>.',options:["unique solution","no solution","two solutions","infinitely many solutions"],answer:3,solution:'Rearranging <span class="math" data-tex="3x-y=2"></span> gives <span class="math" data-tex="y=3x-2"></span>. Both equations describe the same line, so every point on it solves both.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="y=x+4"></span> and <span class="math" data-tex="y=-2x+10"></span>.',options:["(6, 2)","(2, 6)","(3, 7)","(0, 10)"],answer:1,solution:'Set equal: <span class="math" data-tex="x+4=-2x+10\\Rightarrow 3x=6\\Rightarrow x=2"></span>. Then <span class="math" data-tex="y=6"></span>.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="x+y=7"></span> and <span class="math" data-tex="y=3x-1"></span>.',options:["(2, 5)","(5, 2)","(1, 6)","(3, 4)"],answer:0,solution:'Substitute: <span class="math" data-tex="x+(3x-1)=7\\Rightarrow 4x=8\\Rightarrow x=2"></span>. Then <span class="math" data-tex="y=5"></span>.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="2x+y=8"></span> and <span class="math" data-tex="y=2"></span>.',options:["(2, 4)","(4, 2)","(3, 2)","(2, 3)"],answer:2,solution:'Substitute <span class="math" data-tex="y=2"></span>: <span class="math" data-tex="2x+2=8\\Rightarrow x=3"></span>. The solution is <span class="math" data-tex="(3,2)"></span>.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Classify <span class="math" data-tex="y=4x+1"></span> and <span class="math" data-tex="y=4x-5"></span>.',options:["unique at (1, 5)","infinitely many","unique at (0, 1)","no solution"],answer:3,solution:'Equal slopes and different intercepts create distinct parallel lines. The system is inconsistent and has no solution.'},
      {id:"M5",level:"Medium",calc:false,prompt:'Classify <span class="math" data-tex="2x-2y=6"></span> and <span class="math" data-tex="x-y=3"></span>.',options:["infinitely many solutions","no solution","exactly one solution","exactly two solutions"],answer:0,solution:'Dividing the first equation by 2 gives <span class="math" data-tex="x-y=3"></span>. The equations are equivalent, so the system is dependent with infinitely many solutions.'},
      {id:"M6",level:"Medium",calc:false,prompt:'Which point satisfies both <span class="math" data-tex="y=2x-3"></span> and <span class="math" data-tex="x+y=6"></span>?',options:["(1, 5)","(2, 2)","(3, 3)","(4, 1)"],answer:2,solution:'Substitute: <span class="math" data-tex="x+(2x-3)=6\\Rightarrow 3x=9\\Rightarrow x=3"></span>, then <span class="math" data-tex="y=3"></span>.'},
      {id:"H1",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="3x+y=11"></span> and <span class="math" data-tex="y=x-1"></span>.',options:["(2, 3)","(3, 2)","(4, 1)","(1, 4)"],answer:1,solution:'Substitute: <span class="math" data-tex="3x+(x-1)=11\\Rightarrow 4x=12\\Rightarrow x=3"></span>. Then <span class="math" data-tex="y=2"></span>.'},
      {id:"H2",level:"Hard",calc:false,prompt:'Classify <span class="math" data-tex="y=\\frac12x+4"></span> and <span class="math" data-tex="2y=x+8"></span>.',options:["infinitely many solutions","no solution","unique at (0, 4)","unique at (4, 6)"],answer:0,solution:'Dividing the second equation by 2 gives <span class="math" data-tex="y=\\frac12x+4"></span>. The same line is written twice, so every point on it is a solution.'},
      {id:"H3",level:"Hard",calc:false,prompt:'Classify <span class="math" data-tex="4x-2y=10"></span> and <span class="math" data-tex="y=2x+1"></span>.',options:["unique at (0, 1)","infinitely many","unique at (3, 7)","no solution"],answer:3,solution:'The first equation becomes <span class="math" data-tex="y=2x-5"></span>. It has the same slope and a different intercept from <span class="math" data-tex="y=2x+1"></span>, so the lines are parallel.'},
      {id:"H4",level:"Hard",calc:false,prompt:'Taxi A costs <span class="math" data-tex="5+2x"></span> QAR and Taxi B costs <span class="math" data-tex="17+x"></span> QAR after <span class="math" data-tex="x"></span> km. When are costs equal?',options:["6 km, 17 QAR","12 km, 29 QAR","17 km, 39 QAR","29 km, 12 QAR"],answer:1,solution:'Solve <span class="math" data-tex="5+2x=17+x\\Rightarrow x=12"></span>. Either rule gives <span class="math" data-tex="29"></span> QAR.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="x=2y+1"></span> and <span class="math" data-tex="3x-y=13"></span>.',options:["(2, 5)","(3, 4)","(4, 3)","(5, 2)"],answer:3,solution:'Substitute: <span class="math" data-tex="3(2y+1)-y=13\\Rightarrow 5y=10\\Rightarrow y=2"></span>. Then <span class="math" data-tex="x=5"></span>.'},
      {id:"H6",level:"Hard",calc:false,prompt:'For which condition does <span class="math" data-tex="y=kx+2"></span> with <span class="math" data-tex="y=3x-4"></span> have a unique solution?',options:["k = 3","k = -4","k = 2","k is not 3"],answer:3,solution:'A unique intersection requires different slopes. Therefore <span class="math" data-tex="k\\ne3"></span>. When <span class="math" data-tex="k=3"></span>, the lines are parallel because their intercepts differ.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'If <span class="math" data-tex="b\\ne c"></span>, classify <span class="math" data-tex="y=ax+b"></span> and <span class="math" data-tex="y=ax+c"></span>.',options:["unique solution","no solution","infinitely many solutions","classification is impossible"],answer:1,solution:'Both lines have slope <span class="math" data-tex="a"></span>, but <span class="math" data-tex="b\\ne c"></span> gives different intercepts. They are distinct parallel lines, so there is no solution.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'The point <span class="math" data-tex="(3,3)"></span> solves <span class="math" data-tex="2x+y=9"></span> and <span class="math" data-tex="y=mx-3"></span>. Find <span class="math" data-tex="m"></span>.',options:["2","-2","3","6"],answer:0,solution:'Use the second equation: <span class="math" data-tex="3=3m-3\\Rightarrow 6=3m\\Rightarrow m=2"></span>. The first equation also checks: <span class="math" data-tex="2(3)+3=9"></span>.'},
      {id:"C3",level:"Challenge",calc:true,prompt:'Forty tickets sold for 360 QAR. Adult tickets cost 12 QAR and student tickets cost 7 QAR. How many of each sold?',options:["12 adults, 28 students","20 adults, 20 students","16 adults, 24 students","24 adults, 16 students"],answer:2,solution:'Let <span class="math" data-tex="a+s=40"></span> and <span class="math" data-tex="12a+7s=360"></span>. Substitute <span class="math" data-tex="s=40-a"></span>: <span class="math" data-tex="12a+7(40-a)=360\\Rightarrow 5a=80\\Rightarrow a=16"></span>, so <span class="math" data-tex="s=24"></span>.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'Classify <span class="math" data-tex="x+y=6"></span> with <span class="math" data-tex="2x+2y=k"></span> for all <span class="math" data-tex="k"></span>.',options:["always unique","k = 12 gives infinitely many; otherwise no solution","k = 6 gives infinitely many; otherwise unique","always no solution"],answer:1,solution:'Doubling the first equation gives <span class="math" data-tex="2x+2y=12"></span>. Thus <span class="math" data-tex="k=12"></span> produces the same line; any other <span class="math" data-tex="k"></span> produces a parallel line.'}
    ];
    const slides=[];
    const add=(stage,title,body,cls="")=>slides.push({stage,title,body,cls});
    const head=(label,title)=>'<div class="slide-head"><div><p class="eyebrow">'+label+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';
    const reveal=(label,body)=>'<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';
    const section=(code,title,text)=>'<div class="section-banner"><div><p class="eyebrow">Concept cycle</p><h2 tabindex="-1">'+title+'</h2><p class="lead">'+text+'</p></div><div class="section-code">'+code+'</div></div>';
    const qCard=q=>'<div class="question-layout"><div class="question-box"><div><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?'calc':'')+'">'+(q.calc?'Calculator / technology':'No calculator')+'</span></div><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map((o,i)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>').join("")+'</div><button class="check-button" type="button" data-check="'+q.id+'">Check response</button><p class="feedback" id="feedback-'+q.id+'" aria-live="polite"></p>'+reveal('Reveal complete solution','<p>'+q.solution+'</p>')+'</div><aside class="side-note"><label for="work-'+q.id+'"><strong>Show equations, substitution, ordered-pair check, and classification</strong></label><textarea class="scratch" id="work-'+q.id+'" data-save="work-'+q.id+'"></textarea></aside></div>';
    const systemSvg=(id,type="unique")=>{const title=type==="unique"?"Two lines intersect once at the ordered pair two comma three":type==="none"?"Two distinct parallel lines have no intersection":"Two equivalent equations graph as the same line";const desc=type==="unique"?"The maroon line y equals 2x minus 1 and teal line y equals negative x plus 5 cross at the gold point (2,3).":type==="none"?"The maroon line y equals 2x plus 1 and teal line y equals 2x minus 3 have equal slope and different intercepts, so they never meet.":"A solid maroon line and dashed teal line coincide because both equations describe y equals x plus 1.";const paths=type==="unique"?'<path class="line-a" d="M220 410L470 10"/><path class="line-b" d="M320 10L570 210"/><circle class="intersection" cx="420" cy="90" r="10"/><text class="gtext" x="433" y="82">(2, 3)</text><text class="gtext" x="225" y="375">y = 2x - 1</text><text class="gtext" x="455" y="185">y = -x + 5</text>':type==="none"?'<path class="line-a" d="M220 370L445 10"/><path class="line-b" d="M270 410L520 10"/><text class="gtext" x="225" y="345">y = 2x + 1</text><text class="gtext" x="390" y="165">y = 2x - 3</text>':'<path class="line-a" d="M120 370L520 50"/><path class="line-b same-line" d="M120 370L520 50"/><text class="gtext" x="380" y="120">same line</text>';return '<svg class="graph" viewBox="0 0 640 420" role="img" aria-labelledby="system-title-'+id+' system-desc-'+id+'"><title id="system-title-'+id+'">'+title+'</title><desc id="system-desc-'+id+'">'+desc+'</desc><g aria-hidden="true"><path class="gridline" d="M70 50V370M120 50V370M170 50V370M220 50V370M270 50V370M320 50V370M370 50V370M420 50V370M470 50V370M520 50V370M570 50V370M70 50H570M70 90H570M70 130H570M70 170H570M70 210H570M70 250H570M70 290H570M70 330H570M70 370H570"/><path class="axis" d="M60 210H585M320 390V30"/>'+paths+'<text class="gtext" x="570" y="235">x</text><text class="gtext" x="335" y="45">y</text></g></svg>';};

    add("Launch","Systems by Graphing and Substitution",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Lesson 2.1 · AP Precalculus readiness</p><h1 tabindex="-1">Systems by Graphing and Substitution</h1><p class="lead">Connect a shared ordered pair to a graph intersection, solve 2×2 systems exactly, and classify unique, inconsistent, and dependent systems.</p><button class="cta" type="button" data-go="1">Begin the lesson →</button></div><div class="system-art">'+systemSvg("cover","unique")+'</div></div>',"cover");
    add("Purpose","Three-period prerequisite mastery",head("Purpose","What this lesson develops—and defers")+'<p class="lead">This is a three-period prerequisite-mastery sequence, with a maximum of three periods.</p><div class="grid"><div class="card tint"><h3>Required Grade 9 coverage</h3><p>Intersection meaning, graphing systems, substitution, exact 2×2 solutions, and classification of unique, no-solution, and infinitely-many-solution cases.</p></div><div class="card gold"><h3>Deliberately deferred</h3><p>Matrix row reduction, determinant methods, and generalized linear-algebra notation are not included within this course.</p></div></div><p class="callout"><strong>Pacing:</strong> target three class periods, maximum three.</p>');
    add("Goals","Learning goals",head("Learning outcome","By the end, I can…")+'<div class="law-grid"><article class="law"><strong>Connect</strong>Explain why a graph intersection is a shared ordered-pair solution.</article><article class="law"><strong>Solve</strong>Use graphing and substitution accurately, then verify both equations.</article><article class="law"><strong>Classify</strong>Identify unique, inconsistent, and dependent systems from equations or graphs.</article></div>');
    add("Success","Mastery evidence",head("Success criteria","What counts as secure")+'<div class="grid"><div class="card"><strong class="big">16 / 20</strong><p>on differentiated practice, including exact solutions and all three classifications.</p></div><div class="card"><strong class="big">Both equations</strong><p>must be satisfied by every claimed ordered-pair solution, with organized substitution work.</p></div></div>');
    add("Retrieval","Ordered-pair retrieval",head("Prerequisite retrieval","A point satisfies an equation when substitution is true")+'<div class="grid"><div class="card"><p>Test <span class="math" data-tex="(2,5)"></span> in <span class="math" data-tex="y=2x+1"></span>:</p><p><span class="formula math" data-tex="5=2(2)+1\\Rightarrow 5=5"></span></p></div><div class="card gold"><p>An ordered pair solves a system only when it makes <strong>every</strong> equation true.</p></div></div>');
    add("Retrieval","Equation-solving retrieval",head("Prerequisite retrieval","Collect and isolate with equality preserved")+'<div class="flow"><span><span class="math" data-tex="x+4=-2x+10"></span></span><b>→</b><span><span class="math" data-tex="3x=6"></span></span><b>→</b><span><span class="math" data-tex="x=2"></span></span></div><p class="callout success">Setting two output rules equal locates the input where they predict the same output.</p>');
    add("Retrieval","Graphing retrieval",head("Prerequisite retrieval","Graph each linear equation precisely")+'<div class="grid"><div class="card"><p><span class="math" data-tex="y=2x-1"></span> has slope 2 and <span class="math" data-tex="y"></span>-intercept -1.</p><p>Points include <span class="math" data-tex="(0,-1),(1,1),(2,3)"></span>.</p></div><div class="card tint"><p><span class="math" data-tex="y=-x+5"></span> has slope -1 and <span class="math" data-tex="y"></span>-intercept 5.</p><p>Points include <span class="math" data-tex="(0,5),(1,4),(2,3)"></span>.</p></div></div>');
    add("Launch","Initial reasoning",head("Student Turn","What does one shared point mean?")+'<div class="question-box"><p class="question-prompt">Two lines cross at <span class="math" data-tex="(2,3)"></span>. Explain what the coordinates mean for both equations and how you could verify the claim without relying on the picture.</p><textarea class="scratch" data-save="launch-reasoning" aria-label="Initial systems reasoning"></textarea>'+reveal('Reveal reasoning','<p>The input <span class="math" data-tex="x=2"></span> produces the same output <span class="math" data-tex="y=3"></span> in both relationships. Substitute 2 and 3 into each original equation; both resulting statements must be true.</p>')+'</div>');

    add("Meaning","Intersection as a solution",section("shared (x,y)","One point must satisfy both equations","A 2×2 system asks for all ordered pairs that make two equations true simultaneously."));
    add("Meaning","System vocabulary",head("Concept","Describe the equations and their shared solution set")+'<div class="law-grid"><article class="law"><strong>System</strong>Two equations considered at the same time.</article><article class="law"><strong>Solution</strong>An ordered pair satisfying both equations.</article><article class="law"><strong>Intersection</strong>The graphical location shared by both lines.</article></div>');
    add("Meaning","Worked example",head("Worked example","Verify the graphical intersection")+'<div class="grid"><div>'+systemSvg("meaning","unique")+'</div><div class="step-list"><div class="step">The graph suggests <span class="math" data-tex="(2,3)"></span>.</div><div class="step">First equation: <span class="math" data-tex="3=2(2)-1"></span> is true.</div><div class="step">Second equation: <span class="math" data-tex="3=-2+5"></span> is true.</div><div class="step">Therefore <span class="math" data-tex="(2,3)"></span> solves the system.</div></div></div>');
    add("Student Turn","Shared-point turn",head("Student Turn","Test a candidate in both equations")+'<div class="question-box"><p class="question-prompt">Does <span class="math" data-tex="(3,4)"></span> solve <span class="math" data-tex="y=x+1"></span> and <span class="math" data-tex="2x+y=10"></span>? Show both checks.</p><textarea class="scratch" data-save="meaning-turn" aria-label="Shared point verification"></textarea>'+reveal('Reveal verified checks','<p>First: <span class="math" data-tex="4=3+1"></span>, true. Second: <span class="math" data-tex="2(3)+4=10"></span>, true. The point solves both equations and therefore the system.</p>')+'</div>');
    add("Misconception","One-equation check",head("Misconception check","Satisfying one equation is not enough")+'<div class="grid"><div class="card maroon"><p><span class="math" data-tex="(2,5)"></span> satisfies <span class="math" data-tex="y=2x+1"></span>, but that alone does not solve a two-equation system.</p></div><div class="card tint"><p>A valid system solution must lie on both graphs and make both original equations true.</p></div></div>');
    add("Checkpoint","Intersection evidence",head("Checkpoint","Translate among graph, equation, and context")+'<div class="question-box"><p class="question-prompt">Two cost models meet at <span class="math" data-tex="(6,38)"></span>. Interpret both coordinates and state the algebraic evidence required.</p><textarea class="scratch" data-save="meaning-check" aria-label="Intersection meaning checkpoint"></textarea>'+reveal('Reveal interpretation','<p>At input 6, both models give output 38. In context, the two options have equal cost at 6 units and cost 38 currency units. Substitution of <span class="math" data-tex="x=6,y=38"></span> must satisfy both rules.</p>')+'</div>');

    add("Graphing","Solve a system by graphing",section("plot both","The shared coordinate is the solution","Graph each complete line on the same axes, locate every intersection, and verify any read-off coordinate algebraically."));
    add("Graphing","Graphing workflow",head("Concept","Use a repeatable four-step method")+'<div class="step-list"><div class="step">Rewrite each equation in a graphable form when useful.</div><div class="step">Plot accurate points using slope/intercept or intercepts.</div><div class="step">Locate the shared point or recognize parallel/coincident lines.</div><div class="step">Substitute a claimed solution into both original equations.</div></div>');
    add("Graphing","Worked example",head("Worked example","Graph two lines and read one exact solution")+'<div class="grid"><div>'+systemSvg("graphing","unique")+'</div><div class="step-list"><div class="step"><span class="math" data-tex="y=2x-1"></span> passes through <span class="math" data-tex="(0,-1),(2,3)"></span>.</div><div class="step"><span class="math" data-tex="y=-x+5"></span> passes through <span class="math" data-tex="(0,5),(2,3)"></span>.</div><div class="step">The graphs meet once at <span class="math" data-tex="(2,3)"></span>.</div><div class="step">Both substitutions check, so the system has one exact solution.</div></div></div>');
    add("Student Turn","Graphing turn",head("Student Turn","Build both graphs from structure")+'<div class="question-box"><p class="question-prompt">Graph <span class="math" data-tex="y=x"></span> and <span class="math" data-tex="y=-x+4"></span>. Predict the intersection, then verify it in both equations.</p><textarea class="scratch" data-save="graphing-turn" aria-label="Graphing system work"></textarea>'+reveal('Reveal verified solution','<p>Set the visible outputs equal: <span class="math" data-tex="x=-x+4\\Rightarrow x=2"></span>; then <span class="math" data-tex="y=2"></span>. Both lines contain <span class="math" data-tex="(2,2)"></span>.</p>')+'</div>');
    add("Misconception","Picture-only answer",head("Misconception check","A visual estimate is not always exact")+'<div class="grid"><div class="card maroon"><p>Thick lines, an imprecise scale, or a non-integer intersection can make a graph read-off approximate.</p></div><div class="card tint"><p>Use the graph to understand and estimate; use substitution or direct algebra to confirm an exact ordered pair.</p></div></div>');
    add("Checkpoint","Graphing evidence",head("Checkpoint","Audit a claimed graph solution")+'<div class="question-box"><p class="question-prompt">A graph suggests <span class="math" data-tex="(1,3)"></span> for <span class="math" data-tex="y=2x+1"></span> and <span class="math" data-tex="x+y=5"></span>. Is the claim exact?</p><textarea class="scratch" data-save="graphing-check" aria-label="Graphing checkpoint"></textarea>'+reveal('Reveal audit','<p>The point satisfies the first equation because <span class="math" data-tex="3=2(1)+1"></span>, but not the second because <span class="math" data-tex="1+3\\ne5"></span>. The exact solution is <span class="math" data-tex="(\\frac43,\\frac{11}3)"></span>.</p>')+'</div>');

    add("Substitution","Solve exactly by substitution",section("replace","Use one equation inside the other","When one variable is isolated—or can be isolated efficiently—substitution converts a two-variable system into one equation in one variable."));
    add("Substitution","Substitution workflow",head("Concept","Preserve meaning at every replacement")+'<div class="step-list"><div class="step">Isolate one variable, unless it is already isolated.</div><div class="step">Replace that variable in the other equation with an equivalent expression.</div><div class="step">Solve the resulting one-variable equation.</div><div class="step">Back-substitute to find the second coordinate.</div><div class="step">Check the ordered pair in both original equations.</div></div>');
    add("Substitution","Worked example",head("Worked example","Solve, back-substitute, and check")+'<div class="step-list"><div class="step"><span class="math" data-tex="y=2x+1,\\quad x+y=10"></span>.</div><div class="step">Substitute: <span class="math" data-tex="x+(2x+1)=10"></span>.</div><div class="step"><span class="math" data-tex="3x=9\\Rightarrow x=3"></span>.</div><div class="step"><span class="math" data-tex="y=2(3)+1=7"></span>.</div><div class="step">Checks: <span class="math" data-tex="7=2(3)+1"></span> and <span class="math" data-tex="3+7=10"></span>. Solution: <span class="math" data-tex="(3,7)"></span>.</div></div>');
    add("Student Turn","Substitution turn",head("Student Turn","Choose the efficient replacement")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="2x-y=1"></span> and <span class="math" data-tex="y=x+2"></span>. Show the replacement and both checks.</p><textarea class="scratch" data-save="substitution-turn" aria-label="Substitution system work"></textarea>'+reveal('Reveal verified solution','<p><span class="math" data-tex="2x-(x+2)=1\\Rightarrow x=3"></span>. Then <span class="math" data-tex="y=5"></span>. Checks: <span class="math" data-tex="2(3)-5=1"></span> and <span class="math" data-tex="5=3+2"></span>.</p>')+'</div>');
    add("Misconception","Unprotected replacement",head("Misconception check","Substitute the whole equivalent expression")+'<div class="grid"><div class="card maroon"><p>For <span class="math" data-tex="2x-y=1"></span> and <span class="math" data-tex="y=x+2"></span>, writing <span class="math" data-tex="2x-x+2=1"></span> loses the subtraction around <span class="math" data-tex="y"></span>.</p></div><div class="card tint"><p>Correct: <span class="math" data-tex="2x-(x+2)=1"></span>. Parentheses protect the full substituted expression.</p></div></div>');
    add("Checkpoint","Substitution evidence",head("Checkpoint","Find and correct the first invalid step")+'<div class="question-box"><p class="question-prompt">A student solves <span class="math" data-tex="x=y+4"></span> and <span class="math" data-tex="2x+y=11"></span> by writing <span class="math" data-tex="2y+4+y=11"></span>. Correct the work and solve.</p><textarea class="scratch" data-save="substitution-check" aria-label="Substitution checkpoint"></textarea>'+reveal('Reveal correction','<p>The whole expression <span class="math" data-tex="y+4"></span> replaces <span class="math" data-tex="x"></span>: <span class="math" data-tex="2(y+4)+y=11\\Rightarrow 3y=3\\Rightarrow y=1"></span>. Then <span class="math" data-tex="x=5"></span>.</p>')+'</div>');

    add("Classify","Unique, none, or infinitely many",section("1 / 0 / ∞","The equations determine the solution count","Two lines intersect once, never meet, or coincide completely. Algebra and graphs must tell the same classification story."));
    add("Classify","Classification structure",head("Concept","Connect slopes, equations, and solution sets")+'<div class="law-grid"><article class="law"><strong>Unique</strong>Different slopes; one intersection; consistent and independent.</article><article class="law"><strong>No solution</strong>Equal slopes, different intercepts; parallel; inconsistent.</article><article class="law"><strong>Infinitely many</strong>Equivalent equations; same line; consistent and dependent.</article></div>');
    add("Classify","Worked example",head("Worked example","See all three cases")+'<div class="grid three"><div class="card">'+systemSvg("case-unique","unique")+'<p><strong>Unique:</strong> one shared point.</p></div><div class="card">'+systemSvg("case-none","none")+'<p><strong>No solution:</strong> distinct parallel lines.</p></div><div class="card">'+systemSvg("case-infinite","infinite")+'<p><strong>Infinitely many:</strong> the same line.</p></div></div>');
    add("Student Turn","Classification turn",head("Student Turn","Classify without graphing every point")+'<div class="question-box"><p class="question-prompt">Classify <span class="math" data-tex="2x+4y=8"></span> with <span class="math" data-tex="x+2y=4"></span>, then explain what its graph shows.</p><textarea class="scratch" data-save="classification-turn" aria-label="System classification work"></textarea>'+reveal('Reveal classification','<p>The first equation is exactly twice the second. They describe the same line, so the system is consistent and dependent with infinitely many solutions.</p>')+'</div>');
    add("Misconception","Equal-slope shortcut",head("Misconception check","Equal slopes do not always mean no solution")+'<div class="grid"><div class="card maroon"><p>Equal slopes with <strong>different</strong> intercepts give no solution.</p></div><div class="card tint"><p>Equal slopes with the <strong>same</strong> intercept—or fully proportional standard-form equations—give infinitely many solutions.</p></div></div>');
    add("Checkpoint","Classification evidence",head("Checkpoint","Use proportional coefficients carefully")+'<div class="question-box"><p class="question-prompt">Compare <span class="math" data-tex="3x-6y=9"></span> with <span class="math" data-tex="x-2y=5"></span>. Classify and justify.</p><textarea class="scratch" data-save="classification-check" aria-label="Classification checkpoint"></textarea>'+reveal('Reveal justification','<p>Multiplying the second left side by 3 matches the first left side, but the constant would be 15, not 9. The lines are distinct and parallel, so the system has no solution.</p>')+'</div>');

    add("Model","Represent and interpret a context",section("define → solve","Equations must preserve quantities and units","Choose variables, translate both constraints, solve with an efficient method, and interpret the ordered pair in the original situation."));
    add("Model","Modeling workflow",head("Concept","Name variables before writing equations")+'<div class="step-list"><div class="step">Define each variable with its unit.</div><div class="step">Write one equation for each independent condition.</div><div class="step">Estimate what a reasonable solution should look like.</div><div class="step">Solve and verify both conditions.</div><div class="step">Interpret the ordered pair and reject impossible contextual values.</div></div>');
    add("Model","Worked example",head("Worked example","Compare two cost plans")+'<div class="step-list"><div class="step">Plan A: <span class="math" data-tex="C=20+3h"></span>; Plan B: <span class="math" data-tex="C=8+5h"></span>.</div><div class="step">Equal cost: <span class="math" data-tex="20+3h=8+5h"></span>.</div><div class="step"><span class="math" data-tex="12=2h\\Rightarrow h=6"></span>.</div><div class="step"><span class="math" data-tex="C=20+3(6)=38"></span>.</div><div class="step">Interpretation: both plans cost 38 QAR at 6 hours.</div></div>');
    add("Student Turn","Modeling turn",head("Student Turn","Build a ticket system")+'<div class="question-box"><p class="question-prompt">A school event sells 30 tickets for 260 QAR. Adult tickets cost 10 QAR and student tickets cost 6 QAR. Define variables, write the system, solve, and interpret.</p><textarea class="scratch" data-save="model-turn" aria-label="Context system work"></textarea>'+reveal('Reveal verified model','<p>Let <span class="math" data-tex="a"></span> and <span class="math" data-tex="s"></span> be ticket counts. <span class="math" data-tex="a+s=30"></span> and <span class="math" data-tex="10a+6s=260"></span>. With <span class="math" data-tex="s=30-a"></span>, <span class="math" data-tex="10a+6(30-a)=260\\Rightarrow 4a=80\\Rightarrow a=20"></span>, so <span class="math" data-tex="s=10"></span>.</p>')+'</div>');
    add("Misconception","Uninterpreted pair",head("Misconception check","A correct pair still needs a contextual sentence")+'<div class="grid"><div class="card maroon"><p>Writing only <span class="math" data-tex="(20,10)"></span> does not identify which coordinate represents adults or students.</p></div><div class="card tint"><p>State: “20 adult tickets and 10 student tickets satisfy both the count and revenue conditions.”</p></div></div>');
    add("Checkpoint","Method choice",head("Checkpoint","Choose graphing or substitution intentionally")+'<div class="question-box"><p class="question-prompt">When is graphing especially useful, and when is substitution more efficient? Give one limitation of a graph read-off.</p><textarea class="scratch" data-save="model-check" aria-label="Method choice checkpoint"></textarea>'+reveal('Reveal comparison','<p>Graphing reveals intersection meaning and solution count visually. Substitution is efficient when a variable is isolated or has coefficient 1 and gives exact values. A graph can yield only an approximate read-off when scale or intersection coordinates are difficult.</p>')+'</div>');

    practice.forEach(q=>add("Practice",q.id+" · "+q.level,head("Differentiated practice",q.id+" · "+q.level)+qCard(q)));
    add("Mastery","Practice evidence",head("Mastery evidence","Score the differentiated set")+'<div class="grid"><div class="card"><button class="check-button" id="scoreBtn" type="button">Score all 20 responses</button><p class="lead" id="scoreSummary" aria-live="polite">Complete the set, then score your evidence.</p></div><div class="mastery"><div><strong data-level-score="Easy">—</strong>Easy / 4</div><div><strong data-level-score="Medium">—</strong>Medium / 6</div><div><strong data-level-score="Hard">—</strong>Hard / 6</div><div><strong data-level-score="Challenge">—</strong>Challenge / 4</div><div><strong id="totalScore">—</strong>Total / 20</div></div></div>');
    add("Error analysis","Correct an ordered-pair claim",head("Error analysis","Find the first invalid statement")+'<div class="grid"><div class="card"><p>System: <span class="math" data-tex="y=x+2"></span> and <span class="math" data-tex="y=5-x"></span>.</p><p><span class="math" data-tex="x+2=5-x\\Rightarrow 2x=3\\Rightarrow x=1.5"></span>.</p><p>Claimed back-substitution: <span class="math" data-tex="y=1.5+2=3"></span>.</p><p>Claimed solution: <span class="math" data-tex="(1.5,3)"></span>.</p><label for="errorAnalysis"><strong>Identify and correct the first invalid statement.</strong></label><textarea class="scratch" id="errorAnalysis" data-save="error-analysis"></textarea></div><div class="card gold"><h3>Verified correction</h3>'+reveal('Reveal correction','<p>The first error is arithmetic in back-substitution: <span class="math" data-tex="1.5+2=3.5"></span>. The solution is <span class="math" data-tex="(1.5,3.5)"></span>, and <span class="math" data-tex="5-1.5=3.5"></span> verifies the second equation.</p>')+'</div></div>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","Systems support later function and model reasoning")+'<div class="grid three"><article class="card"><h3>Shared outputs</h3><p>Equating functions locates inputs where two models agree.</p></article><article class="card"><h3>Representations</h3><p>Move among equations, graphs, ordered pairs, and context.</p></article><article class="card"><h3>Exact evidence</h3><p>Verify a candidate in every defining equation.</p></article></div><p class="callout success"><strong>Transfer:</strong> AP Precalculus uses systems to compare functions and models. This lesson secures exact 2×2 reasoning without matrix row reduction, determinant methods, or generalized linear-algebra notation.</p>');
    add("Exit ticket","Exit ticket",head("Exit ticket","Produce final mastery evidence")+'<div class="question-box"><ol><li>Solve <span class="math" data-tex="y=2x+3"></span> and <span class="math" data-tex="x+y=9"></span> by substitution.</li><li>Verify the solution in both equations and interpret it as a graph intersection.</li><li>Classify <span class="math" data-tex="2x-4y=6"></span> with <span class="math" data-tex="x-2y=3"></span>.</li><li>Explain one advantage and one limitation of solving by graphing.</li></ol><textarea class="scratch" data-save="exit-ticket" aria-label="Exit ticket work"></textarea>'+reveal('Reveal exit-ticket key','<ol><li><span class="math" data-tex="x+(2x+3)=9\\Rightarrow 3x=6\\Rightarrow x=2"></span>; then <span class="math" data-tex="y=7"></span>.</li><li><span class="math" data-tex="7=2(2)+3"></span> and <span class="math" data-tex="2+7=9"></span>; the lines share <span class="math" data-tex="(2,7)"></span>.</li><li>The first equation is twice the second, so the same line gives infinitely many solutions.</li><li>Graphing shows intersection and classification visually; a read-off can be approximate or scale-dependent.</li></ol>')+'</div>');
    add("Reflect","Mastery reflection",head("Reflect","Select the next instructional move")+'<div class="grid"><div class="card tint"><h3>Ready to advance</h3><p>At least 16/20, exact substitution, both-equation verification, and correct unique/no/infinite classification.</p></div><div class="card gold"><h3>Targeted review</h3><p>Return to the specific graph, substitution, back-substitution, or classification error identified by the evidence, then solve a parallel system independently.</p></div></div><label for="reflection"><h3>My evidence and next action</h3></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea>');
    add("Complete","Systems foundation secured",head("Complete","Lesson 2.1 mastery package")+'<div class="grid"><div class="card"><h3>Evidence to retain</h3><ul><li>Differentiated practice score</li><li>One corrected solution error</li><li>Exit-ticket classifications</li><li>Personal next action</li></ul><button class="secondary" id="exportFinal" type="button">Export lesson work</button></div><div class="card maroon"><h3>Next lesson</h3><p><strong>2.2 Systems by Elimination</strong></p><p>Use linear combinations strategically and verify exact ordered-pair solutions.</p><a class="cta" href="../../lesson.html?grade=9&amp;path=common&amp;lesson=2.2">View next lesson preview</a></div></div>');

    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map((s,i)=>'<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==='cover'?'cover':'')+'">'+s.body+'</div></section>').join('');
    const slideEls=[...document.querySelectorAll(".slide")];
    let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",''))-1||0));
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function load(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}
    const state=load();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root=document){root.querySelectorAll('.math').forEach(el=>{if(window.katex){try{window.katex.render(el.dataset.tex||'',el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"]').forEach(input=>{if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>checkOne(b.dataset.check)));document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",()=>{state.fields.notebook=n.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(x=>x.id===id),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the method, ordered pair, both-equation check, and classification.":"Not yet. Recheck the substitution, back-substitution, both original equations, and the graph or slope evidence.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(level=>{const qs=practice.filter(q=>q.level===level),n=qs.filter(q=>state.answers[q.id]===q.answer).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit ticket.":"Use the level pattern to select a targeted review block.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 2.1 Systems by Graphing and Substitution","Exported: "+new Date().toLocaleString(),""];practice.forEach(q=>{lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_2.1_Systems_Graphing_Substitution.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());document.documentElement.dataset.lessonReady="true";
  })();
  </script>

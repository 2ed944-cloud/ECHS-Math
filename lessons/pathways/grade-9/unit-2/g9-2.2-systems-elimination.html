  <script>
  (function(){
    "use strict";
    const EXPECTED_SCREEN_COUNT=64;
    const STORAGE_KEY="echs-g9-2.2-systems-elimination-v1";
    const practice=[
      {id:"E1",level:"Easy",calc:false,prompt:'Solve <span class="math" data-tex="x+y=7"></span> and <span class="math" data-tex="x-y=1"></span> by elimination.',options:["(4, 3)","(3, 4)","(6, 1)","(1, 6)"],answer:0,solution:'Add the equations: <span class="math" data-tex="2x=8\\Rightarrow x=4"></span>. Then <span class="math" data-tex="4+y=7\\Rightarrow y=3"></span>. Both equations verify <span class="math" data-tex="(4,3)"></span>.'},
      {id:"E2",level:"Easy",calc:false,prompt:'Solve <span class="math" data-tex="2x+y=8"></span> and <span class="math" data-tex="2x-y=4"></span>.',options:["(2, 3)","(3, 2)","(4, 0)","(1, 6)"],answer:1,solution:'Add: <span class="math" data-tex="4x=12\\Rightarrow x=3"></span>. Substitution gives <span class="math" data-tex="y=2"></span>; both originals are true.'},
      {id:"E3",level:"Easy",calc:false,prompt:'For <span class="math" data-tex="3x+2y=11"></span> and <span class="math" data-tex="3x-5y=-3"></span>, which direct combination eliminates <span class="math" data-tex="x"></span>?',options:["Add the equations","Double the first equation","First equation minus second equation","Swap the equations"],answer:2,solution:'Subtracting the second equation from the first gives <span class="math" data-tex="(3x+2y)-(3x-5y)=11-(-3)\\Rightarrow 7y=14"></span>.'},
      {id:"E4",level:"Easy",calc:false,prompt:'What does checking <span class="math" data-tex="(2,1)"></span> in <span class="math" data-tex="2x+y=5"></span> and <span class="math" data-tex="x-y=1"></span> show?',options:["It satisfies only the first","It satisfies only the second","It satisfies neither","It satisfies both"],answer:3,solution:'<span class="math" data-tex="2(2)+1=5"></span> and <span class="math" data-tex="2-1=1"></span>. Therefore the ordered pair solves the system.'},
      {id:"M1",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="x+2y=8"></span> and <span class="math" data-tex="x-3y=-2"></span>.',options:["(2, 3)","(4, 2)","(6, 1)","(3, 4)"],answer:1,solution:'Subtract the second equation from the first: <span class="math" data-tex="5y=10\\Rightarrow y=2"></span>. Then <span class="math" data-tex="x=4"></span>.'},
      {id:"M2",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="2x+3y=12"></span> and <span class="math" data-tex="4x-3y=6"></span>.',options:["(3, 2)","(2, 3)","(4, 1)","(1, 4)"],answer:0,solution:'Add: <span class="math" data-tex="6x=18\\Rightarrow x=3"></span>. Then <span class="math" data-tex="6+3y=12\\Rightarrow y=2"></span>.'},
      {id:"M3",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="3x+y=11"></span> and <span class="math" data-tex="x-y=1"></span>.',options:["(2, 3)","(4, -1)","(3, 2)","(1, 8)"],answer:2,solution:'Add the equations: <span class="math" data-tex="4x=12\\Rightarrow x=3"></span>. Then <span class="math" data-tex="y=2"></span>.'},
      {id:"M4",level:"Medium",calc:false,prompt:'Solve <span class="math" data-tex="x+2y=7"></span> and <span class="math" data-tex="3x-y=7"></span>.',options:["(1, 3)","(2, 2.5)","(4, 1.5)","(3, 2)"],answer:3,solution:'Multiply the second equation by 2: <span class="math" data-tex="6x-2y=14"></span>. Add to the first: <span class="math" data-tex="7x=21\\Rightarrow x=3"></span>, then <span class="math" data-tex="y=2"></span>.'},
      {id:"M5",level:"Medium",calc:false,prompt:'Classify <span class="math" data-tex="2x+4y=8"></span> and <span class="math" data-tex="x+2y=5"></span> using elimination.',options:["No solution","One solution","Two solutions","Infinitely many solutions"],answer:0,solution:'Multiply the second equation by -2 and add. The variables cancel but the constants give <span class="math" data-tex="0=-2"></span>, a contradiction. The system has no solution.'},
      {id:"M6",level:"Medium",calc:false,prompt:'Classify <span class="math" data-tex="3x-6y=9"></span> and <span class="math" data-tex="x-2y=3"></span>.',options:["No solution","One solution","Infinitely many solutions","Exactly two solutions"],answer:2,solution:'The first equation is three times the second. Elimination produces <span class="math" data-tex="0=0"></span>, so the equations represent the same line and have infinitely many solutions.'},
      {id:"H1",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="2x+5y=1"></span> and <span class="math" data-tex="3x-2y=11"></span>.',options:["(1, -1)","(3, -1)","(3, 1)","(-1, 3)"],answer:1,solution:'Multiply the first equation by 2 and the second by 5: <span class="math" data-tex="4x+10y=2"></span>, <span class="math" data-tex="15x-10y=55"></span>. Add to get <span class="math" data-tex="19x=57\\Rightarrow x=3"></span>; then <span class="math" data-tex="y=-1"></span>.'},
      {id:"H2",level:"Hard",calc:false,prompt:'Solve <span class="math" data-tex="\\frac12x+y=4"></span> and <span class="math" data-tex="x-y=2"></span>.',options:["(4, 2)","(2, 4)","(6, 1)","(3, 2.5)"],answer:0,solution:'Multiply the first equation by 2: <span class="math" data-tex="x+2y=8"></span>. Subtract the second equation to obtain <span class="math" data-tex="3y=6\\Rightarrow y=2"></span>, then <span class="math" data-tex="x=4"></span>.'},
      {id:"H3",level:"Hard",calc:false,prompt:'For what value of <span class="math" data-tex="k"></span> do <span class="math" data-tex="2x+ky=7"></span> and <span class="math" data-tex="4x+6y=14"></span> have infinitely many solutions?',options:["1","2","6","3"],answer:3,solution:'The second equation must be twice the first. Thus <span class="math" data-tex="2k=6\\Rightarrow k=3"></span>; all coefficients and the constant are then proportional.'},
      {id:"H4",level:"Hard",calc:false,prompt:'A school event sells 36 tickets for 352 QAR. Adult tickets cost 12 QAR and student tickets cost 8 QAR. How many of each are sold?',options:["20 adults, 16 students","16 adults, 20 students","18 adults, 18 students","12 adults, 24 students"],answer:1,solution:'Use <span class="math" data-tex="a+s=36"></span> and <span class="math" data-tex="12a+8s=352"></span>. Multiply the first by -8 and add: <span class="math" data-tex="4a=64\\Rightarrow a=16"></span>, so <span class="math" data-tex="s=20"></span>.'},
      {id:"H5",level:"Hard",calc:false,prompt:'Which method is structurally most efficient for <span class="math" data-tex="y=3x-5"></span> and <span class="math" data-tex="2x+y=7"></span>?',options:["Graphing only","Elimination after multiplying both equations","Substitution using the isolated y","No method can solve it exactly"],answer:2,solution:'Because <span class="math" data-tex="y"></span> is already isolated, substitution immediately gives one equation in <span class="math" data-tex="x"></span>. Elimination remains valid but requires extra setup.'},
      {id:"H6",level:"Hard",calc:true,prompt:'Solve <span class="math" data-tex="0.5x+y=5"></span> and <span class="math" data-tex="x-y=4"></span>.',options:["(4, 3)","(8, 1)","(5, 2.5)","(6, 2)"],answer:3,solution:'Add the equations: <span class="math" data-tex="1.5x=9\\Rightarrow x=6"></span>. Then <span class="math" data-tex="y=2"></span>. Both original decimal equations verify the pair.'},
      {id:"C1",level:"Challenge",calc:false,prompt:'If <span class="math" data-tex="a\\ne0"></span>, solve for <span class="math" data-tex="x"></span> in <span class="math" data-tex="ax+by=p"></span> and <span class="math" data-tex="ax-by=q"></span>.',options:["(p-q)/(2a)","(p+q)/(2a)","(p+q)/(2b)","p+q"],answer:1,solution:'Add the equations: <span class="math" data-tex="2ax=p+q"></span>. Since <span class="math" data-tex="a\\ne0"></span>, <span class="math" data-tex="x=\\frac{p+q}{2a}"></span>.'},
      {id:"C2",level:"Challenge",calc:false,prompt:'When does <span class="math" data-tex="3x-2y=5"></span> with <span class="math" data-tex="6x-4y=k"></span> have no solution?',options:["k is not 10","k = 10","k = 5","for every k"],answer:0,solution:'Twice the first equation has left side <span class="math" data-tex="6x-4y"></span> and constant 10. If <span class="math" data-tex="k=10"></span>, the equations coincide; for <span class="math" data-tex="k\\ne10"></span>, elimination gives a contradiction.'},
      {id:"C3",level:"Challenge",calc:true,prompt:'A 20-liter mixture is 42% concentrate, made from 30% and 50% solutions. How many liters of each are used?',options:["12 L of 30%, 8 L of 50%","10 L of each","8 L of 30%, 12 L of 50%","6 L of 30%, 14 L of 50%"],answer:2,solution:'Let <span class="math" data-tex="x+y=20"></span> and <span class="math" data-tex="0.30x+0.50y=8.4"></span>. Multiply the first by -0.30 and add: <span class="math" data-tex="0.20y=2.4\\Rightarrow y=12"></span>; hence <span class="math" data-tex="x=8"></span>.'},
      {id:"C4",level:"Challenge",calc:false,prompt:'For <span class="math" data-tex="x+2y=8"></span> and <span class="math" data-tex="3x-y=3"></span>, a student doubles only the left side of the second equation to write <span class="math" data-tex="6x-2y=3"></span>. What is the first correction?',options:["Change 6x to 3x","Change -2y to +2y","Double the first equation instead","The right side must also double to 6"],answer:3,solution:'Multiplying an equation by 2 changes every term on both sides: <span class="math" data-tex="6x-2y=6"></span>. Adding to <span class="math" data-tex="x+2y=8"></span> gives <span class="math" data-tex="7x=14\\Rightarrow x=2"></span>, then <span class="math" data-tex="y=3"></span>.'}
    ];
    const slides=[];
    const add=(stage,title,body,cls="")=>slides.push({stage,title,body,cls});
    const head=(label,title)=>'<div class="slide-head"><div><p class="eyebrow">'+label+'</p><h2 tabindex="-1">'+title+'</h2></div><div class="number">'+String(slides.length+1).padStart(2,"0")+'</div></div>';
    const reveal=(label,body)=>'<details class="answer-key"><summary>'+label+'</summary>'+body+'</details>';
    const section=(code,title,text)=>'<div class="section-banner"><div><p class="eyebrow">Concept cycle</p><h2 tabindex="-1">'+title+'</h2><p class="lead">'+text+'</p></div><div class="section-code">'+code+'</div></div>';
    const qCard=q=>'<div class="question-layout"><div class="question-box"><div><span class="badge level">'+q.level+'</span><span class="badge '+(q.calc?'calc':'')+'">'+(q.calc?'Calculator / technology':'No calculator')+'</span></div><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map((o,i)=>'<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>').join("")+'</div><button class="check-button" type="button" data-check="'+q.id+'">Check response</button><p class="feedback" id="feedback-'+q.id+'" aria-live="polite"></p>'+reveal('Reveal complete solution','<p>'+q.solution+'</p>')+'</div><aside class="side-note"><label for="work-'+q.id+'"><strong>Show the scaling, linear combination, ordered-pair check, and method rationale</strong></label><textarea class="scratch" id="work-'+q.id+'" data-save="work-'+q.id+'"></textarea></aside></div>';
    const eliminationSvg=id=>'<svg class="graph" viewBox="0 0 640 420" role="img" aria-labelledby="elim-title-'+id+' elim-desc-'+id+'"><title id="elim-title-'+id+'">Aligned equations combine to eliminate y</title><desc id="elim-desc-'+id+'">The equations 2x plus y equals 7 and 3x minus y equals 8 are added. Opposite y terms cancel, leaving 5x equals 15 and x equals 3.</desc><g aria-hidden="true"><rect x="55" y="45" width="530" height="330" rx="28" fill="#ffffff" stroke="#d8e0e7" stroke-width="3"/><text class="gtext" x="170" y="125" style="font-size:30px">2x + y = 7</text><text class="gtext" x="135" y="190" style="font-size:30px;fill:#7a1734">+ 3x - y = 8</text><path d="M120 215H520" stroke="#102a43" stroke-width="4"/><text class="gtext" x="205" y="270" style="font-size:31px;fill:#087f8c">5x = 15</text><path d="M305 290V325" stroke="#c69b37" stroke-width="5" marker-end="url(#arrow-'+id+')"/><text class="gtext" x="245" y="355" style="font-size:31px">x = 3</text><defs><marker id="arrow-'+id+'" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c69b37"/></marker></defs></g></svg>';

    add("Launch","Systems by Elimination",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Lesson 2.2 · AP Precalculus readiness</p><h1 tabindex="-1">Systems by Elimination</h1><p class="lead">Build equivalent equations, combine them strategically, solve exact 2×2 systems, and verify every ordered-pair solution.</p><button class="cta" type="button" data-go="1">Begin the lesson →</button></div><div class="system-art">'+eliminationSvg("cover")+'</div></div>',"cover");
    add("Purpose","Three-period prerequisite mastery",head("Purpose","What this lesson develops—and defers")+'<p class="lead">This is a three-period prerequisite-mastery sequence, with a maximum of three periods.</p><div class="grid"><div class="card tint"><h3>Required Grade 9 coverage</h3><p>Linear combinations, strategic multiplication, exact solutions, checking, efficient elimination, and justified method choice.</p></div><div class="card gold"><h3>Deliberately deferred</h3><p>Generalized linear-algebra notation and matrix row reduction are not included within this course.</p></div></div><p class="callout"><strong>Pacing:</strong> target three class periods, maximum three.</p>');
    add("Goals","Learning goals",head("Learning outcome","By the end, I can…")+'<div class="law-grid"><article class="law"><strong>Construct</strong>Create equivalent equations by multiplying every term by the same nonzero number.</article><article class="law"><strong>Eliminate</strong>Select and execute a linear combination efficiently.</article><article class="law"><strong>Justify</strong>Verify the ordered pair and explain why elimination is an efficient method.</article></div>');
    add("Success","Mastery evidence",head("Success criteria","What counts as secure")+'<div class="grid"><div class="card"><strong class="big">16 / 20</strong><p>on differentiated practice, including direct, scaled, special-case, and contextual systems.</p></div><div class="card"><strong class="big">Both originals</strong><p>must be satisfied by the claimed ordered pair, with scaling and combination steps shown clearly.</p></div></div>');
    add("Retrieval","Equivalent-equation retrieval",head("Prerequisite retrieval","Scale every term on both sides")+'<div class="grid"><div class="card"><p>Multiplying <span class="math" data-tex="x-2y=3"></span> by 4 gives</p><p><span class="formula math" data-tex="4x-8y=12"></span>.</p></div><div class="card gold"><p>Both equations have exactly the same solution set because the entire equality was multiplied by the same nonzero number.</p></div></div>');
    add("Retrieval","Signed-number retrieval",head("Prerequisite retrieval","Combine signed coefficients precisely")+'<div class="flow"><span><span class="math" data-tex="3y+(-3y)=0"></span></span><b>·</b><span><span class="math" data-tex="5-(-2)=7"></span></span><b>·</b><span><span class="math" data-tex="-4+9=5"></span></span></div><p class="callout success">Elimination depends on accurate addition, subtraction, and distribution across every term.</p>');
    add("Retrieval","Like-term retrieval",head("Prerequisite retrieval","Only like terms combine")+'<div class="grid"><div class="card"><p><span class="math" data-tex="(2x+y)+(3x-y)=5x"></span></p><p>The opposite <span class="math" data-tex="y"></span>-terms cancel.</p></div><div class="card tint"><p><span class="math" data-tex="2x+3y"></span> cannot simplify to <span class="math" data-tex="5xy"></span>.</p><p>Different variable terms remain separate.</p></div></div>');
    add("Launch","Initial reasoning",head("Student Turn","Choose the variable that is ready to disappear")+'<div class="question-box"><p class="question-prompt">For <span class="math" data-tex="2x+y=7"></span> and <span class="math" data-tex="3x-y=8"></span>, identify the variable eliminated by direct addition and explain why the operation preserves all common solutions.</p><textarea class="scratch" data-save="launch-reasoning" aria-label="Initial elimination reasoning"></textarea>'+reveal('Reveal reasoning','<p>The coefficients of <span class="math" data-tex="y"></span> are opposites, so adding produces <span class="math" data-tex="y+(-y)=0"></span>. Any ordered pair satisfying both original equations also satisfies their sum, so the common solution remains valid.</p>')+'</div>');

    add("Direct","Direct addition and subtraction",section("opposites","Cancel a variable with one valid combination","When one variable has equal or opposite coefficients, add or subtract the complete equations without preliminary scaling."));
    add("Direct","Direct-elimination workflow",head("Concept","Align, combine, solve, and verify")+'<div class="step-list"><div class="step">Write like terms in aligned columns.</div><div class="step">Choose addition for opposite coefficients or subtraction for equal coefficients.</div><div class="step">Combine every term, including the constants.</div><div class="step">Solve for the remaining variable and back-substitute.</div><div class="step">Verify the ordered pair in both originals.</div></div>');
    add("Direct","Worked example",head("Worked example","Add equations with opposite coefficients")+'<div class="grid"><div>'+eliminationSvg("direct")+'</div><div class="step-list"><div class="step"><span class="math" data-tex="2x+y=7"></span> and <span class="math" data-tex="3x-y=8"></span>.</div><div class="step">Add: <span class="math" data-tex="5x=15\\Rightarrow x=3"></span>.</div><div class="step">Back-substitute: <span class="math" data-tex="2(3)+y=7\\Rightarrow y=1"></span>.</div><div class="step">Checks: <span class="math" data-tex="6+1=7"></span> and <span class="math" data-tex="9-1=8"></span>.</div></div></div>');
    add("Student Turn","Direct-addition turn",head("Student Turn","Eliminate without scaling")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="x+2y=8"></span> and <span class="math" data-tex="-x+y=1"></span>. Name the combination, then check both equations.</p><textarea class="scratch" data-save="direct-turn" aria-label="Direct elimination work"></textarea>'+reveal('Reveal verified solution','<p>Add to eliminate <span class="math" data-tex="x"></span>: <span class="math" data-tex="3y=9\\Rightarrow y=3"></span>. Then <span class="math" data-tex="x=2"></span>. Checks: <span class="math" data-tex="2+2(3)=8"></span> and <span class="math" data-tex="-2+3=1"></span>.</p>')+'</div>');
    add("Misconception","Lost negative sign",head("Misconception check","Opposites cancel; they do not double")+'<div class="grid"><div class="card maroon"><p>In direct addition, <span class="math" data-tex="y+(-y)=0"></span>, not <span class="math" data-tex="2y"></span> or <span class="math" data-tex="-2y"></span>.</p></div><div class="card tint"><p>Write the sign with each term and combine one aligned column at a time.</p></div></div>');
    add("Checkpoint","Direct-subtraction evidence",head("Checkpoint","Use subtraction when coefficients match")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="4x+3y=17"></span> and <span class="math" data-tex="4x-y=5"></span> by subtracting complete equations.</p><textarea class="scratch" data-save="direct-check" aria-label="Direct subtraction checkpoint"></textarea>'+reveal('Reveal verified solution','<p>First minus second gives <span class="math" data-tex="4y=12\\Rightarrow y=3"></span>. Then <span class="math" data-tex="4x-3=5\\Rightarrow x=2"></span>. Both equations verify <span class="math" data-tex="(2,3)"></span>.</p>')+'</div>');

    add("Scale one","Strategic multiplication",section("one scale","Create opposite coefficients efficiently","If no coefficients are ready to cancel, multiply one complete equation by a carefully chosen nonzero number."));
    add("Scale one","Choose the multiplier",head("Concept","Use the smallest useful multiplier")+'<div class="law-grid"><article class="law"><strong>Inspect</strong>Compare coefficient pairs for <span class="math" data-tex="x"></span> and <span class="math" data-tex="y"></span>.</article><article class="law"><strong>Choose</strong>Prefer a small multiplier that creates equal or opposite coefficients.</article><article class="law"><strong>Distribute</strong>Multiply every variable term and the constant.</article></div>');
    add("Scale one","Worked example",head("Worked example","Scale one equation, then add")+'<div class="step-list"><div class="step"><span class="math" data-tex="x+2y=7,\\quad 3x-y=7"></span>.</div><div class="step">Multiply the second equation by 2: <span class="math" data-tex="6x-2y=14"></span>.</div><div class="step">Add: <span class="math" data-tex="7x=21\\Rightarrow x=3"></span>.</div><div class="step">Back-substitute: <span class="math" data-tex="3+2y=7\\Rightarrow y=2"></span>.</div><div class="step">Both originals verify <span class="math" data-tex="(3,2)"></span>.</div></div>');
    add("Student Turn","One-multiplier turn",head("Student Turn","Create an opposite coefficient")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="2x+3y=12"></span> and <span class="math" data-tex="x-y=1"></span>. State the multiplier before combining.</p><textarea class="scratch" data-save="scale-one-turn" aria-label="One multiplier elimination work"></textarea>'+reveal('Reveal verified solution','<p>Multiply the second equation by 3: <span class="math" data-tex="3x-3y=3"></span>. Add to get <span class="math" data-tex="5x=15\\Rightarrow x=3"></span>; then <span class="math" data-tex="y=2"></span>. Both originals are true.</p>')+'</div>');
    add("Misconception","Partial scaling",head("Misconception check","A multiplier applies to the entire equation")+'<div class="grid"><div class="card maroon"><p>From <span class="math" data-tex="3x-y=7"></span>, multiplying by 2 does <strong>not</strong> give <span class="math" data-tex="6x-2y=7"></span>.</p></div><div class="card tint"><p>Correct: <span class="math" data-tex="2(3x-y)=2(7)\\Rightarrow 6x-2y=14"></span>.</p></div></div>');
    add("Checkpoint","One-multiplier evidence",head("Checkpoint","Eliminate x with one strategic scale")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="3x+2y=10"></span> and <span class="math" data-tex="x+5y=12"></span> by multiplying only one equation.</p><textarea class="scratch" data-save="scale-one-check" aria-label="Strategic multiplier checkpoint"></textarea>'+reveal('Reveal verified solution','<p>Multiply the second equation by -3: <span class="math" data-tex="-3x-15y=-36"></span>. Add to get <span class="math" data-tex="-13y=-26\\Rightarrow y=2"></span>; then <span class="math" data-tex="x=2"></span>. Both originals check.</p>')+'</div>');

    add("Scale both","Least common multiples",section("two scales","Prepare both equations for cancellation","When neither coefficient divides the other, scale both equations to a common coefficient with opposite signs."));
    add("Scale both","LCM strategy",head("Concept","Plan before multiplying")+'<div class="step-list"><div class="step">Choose a variable to eliminate.</div><div class="step">Find a convenient common multiple of its coefficients.</div><div class="step">Assign multipliers that create opposite coefficients.</div><div class="step">Rewrite both full equations before adding.</div><div class="step">Simplify, back-substitute, and verify.</div></div>');
    add("Scale both","Worked example",head("Worked example","Scale both equations with small integers")+'<div class="step-list"><div class="step"><span class="math" data-tex="2x+3y=12,\\quad 5x-2y=11"></span>.</div><div class="step">Multiply the first by 2: <span class="math" data-tex="4x+6y=24"></span>.</div><div class="step">Multiply the second by 3: <span class="math" data-tex="15x-6y=33"></span>.</div><div class="step">Add: <span class="math" data-tex="19x=57\\Rightarrow x=3"></span>.</div><div class="step">Then <span class="math" data-tex="2(3)+3y=12\\Rightarrow y=2"></span>; both checks are true.</div></div>');
    add("Student Turn","Two-multiplier turn",head("Student Turn","Build opposite y-coefficients")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="3x+4y=10"></span> and <span class="math" data-tex="2x-3y=1"></span>. Show both scaled equations.</p><textarea class="scratch" data-save="scale-both-turn" aria-label="Two multiplier elimination work"></textarea>'+reveal('Reveal verified solution','<p>Multiply the first by 3 and the second by 4: <span class="math" data-tex="9x+12y=30"></span> and <span class="math" data-tex="8x-12y=4"></span>. Add: <span class="math" data-tex="17x=34\\Rightarrow x=2"></span>; then <span class="math" data-tex="y=1"></span>.</p>')+'</div>');
    add("Misconception","Oversized multipliers",head("Misconception check","A valid large multiple may still be inefficient")+'<div class="grid"><div class="card maroon"><p>Multiplying by the product of coefficients always can work, but it may create unnecessary arithmetic.</p></div><div class="card tint"><p>Use a least common multiple when practical, and reduce common factors before scaling.</p></div></div>');
    add("Checkpoint","Two-multiplier evidence",head("Checkpoint","Plan an efficient common coefficient")+'<div class="question-box"><p class="question-prompt">Solve <span class="math" data-tex="4x-3y=5"></span> and <span class="math" data-tex="6x+5y=17"></span>. State why your multipliers are efficient.</p><textarea class="scratch" data-save="scale-both-check" aria-label="Least common multiple checkpoint"></textarea>'+reveal('Reveal verified solution','<p>Use 15 as the least common multiple for the y-coefficients. Multiply by 5 and 3: <span class="math" data-tex="20x-15y=25"></span>, <span class="math" data-tex="18x+15y=51"></span>. Add to get <span class="math" data-tex="38x=76\\Rightarrow x=2"></span>, then <span class="math" data-tex="y=1"></span>.</p>')+'</div>');

    add("Special cases","Interpret elimination outcomes",section("0 = ?","Cancellation reveals the solution count","When both variables disappear, the resulting statement classifies the system instead of producing a coordinate."));
    add("Special cases","Identity or contradiction",head("Concept","Read the final statement correctly")+'<div class="law-grid"><article class="law"><strong>One solution</strong>A variable remains, such as <span class="math" data-tex="5x=15"></span>.</article><article class="law"><strong>No solution</strong>A false statement remains, such as <span class="math" data-tex="0=-2"></span>.</article><article class="law"><strong>Infinitely many</strong>A true identity remains, such as <span class="math" data-tex="0=0"></span>.</article></div>');
    add("Special cases","Worked examples",head("Worked example","Contrast a contradiction with an identity")+'<div class="grid"><div class="card maroon"><h3>No solution</h3><p><span class="math" data-tex="2x+4y=8"></span> and <span class="math" data-tex="x+2y=5"></span>.</p><p>Use <span class="math" data-tex="-2x-4y=-10"></span>; adding gives <span class="math" data-tex="0=-2"></span>.</p></div><div class="card tint"><h3>Infinitely many</h3><p><span class="math" data-tex="3x-6y=9"></span> and <span class="math" data-tex="x-2y=3"></span>.</p><p>Use <span class="math" data-tex="-3x+6y=-9"></span>; adding gives <span class="math" data-tex="0=0"></span>.</p></div></div>');
    add("Student Turn","Special-case turn",head("Student Turn","Classify from a complete cancellation")+'<div class="question-box"><p class="question-prompt">Classify <span class="math" data-tex="4x+2y=6"></span> and <span class="math" data-tex="2x+y=3"></span> using elimination. Explain what the result means geometrically.</p><textarea class="scratch" data-save="special-turn" aria-label="Special case elimination work"></textarea>'+reveal('Reveal classification','<p>Multiply the second equation by -2 and add to obtain <span class="math" data-tex="0=0"></span>. The equations are equivalent, so they graph as the same line and have infinitely many solutions.</p>')+'</div>');
    add("Misconception","Identity misread",head("Misconception check","The identity 0 = 0 is not the ordered pair (0,0)")+'<div class="grid"><div class="card maroon"><p><span class="math" data-tex="0=0"></span> says elimination removed all information because the equations were equivalent.</p></div><div class="card tint"><p>Every point on the shared line is a solution; <span class="math" data-tex="(0,0)"></span> is included only if it satisfies the original line.</p></div></div>');
    add("Checkpoint","Special-case evidence",head("Checkpoint","Distinguish proportional left sides from constants")+'<div class="question-box"><p class="question-prompt">Classify <span class="math" data-tex="5x-10y=4"></span> and <span class="math" data-tex="x-2y=1"></span> by elimination.</p><textarea class="scratch" data-save="special-check" aria-label="Special case checkpoint"></textarea>'+reveal('Reveal classification','<p>Multiply the second equation by -5: <span class="math" data-tex="-5x+10y=-5"></span>. Adding produces <span class="math" data-tex="0=-1"></span>, a contradiction, so the system has no solution.</p>')+'</div>');

    add("Apply","Choose and apply a method",section("structure","The equation form should guide the method","Elimination is powerful in standard form, but efficient mathematical work selects among graphing, substitution, and elimination intentionally."));
    add("Apply","Method-choice guide",head("Concept","Match structure to method")+'<div class="law-grid"><article class="law"><strong>Graphing</strong>Best for visual meaning, estimates, and seeing the number of intersections.</article><article class="law"><strong>Substitution</strong>Best when a variable is isolated or has coefficient 1.</article><article class="law"><strong>Elimination</strong>Best when equations are aligned and coefficients already match or scale simply.</article></div>');
    add("Apply","Worked context",head("Worked example","Model a school-supply purchase")+'<div class="step-list"><div class="step">Let <span class="math" data-tex="n"></span> be notebooks and <span class="math" data-tex="p"></span> be pens.</div><div class="step"><span class="math" data-tex="n+p=26"></span> and <span class="math" data-tex="12n+6p=216"></span>.</div><div class="step">Multiply the first by -6: <span class="math" data-tex="-6n-6p=-156"></span>.</div><div class="step">Add: <span class="math" data-tex="6n=60\\Rightarrow n=10"></span>; then <span class="math" data-tex="p=16"></span>.</div><div class="step">Interpretation: 10 notebooks and 16 pens meet both count and cost conditions.</div></div>');
    add("Student Turn","Contextual elimination turn",head("Student Turn","Build, eliminate, and interpret")+'<div class="question-box"><p class="question-prompt">Thirty snack boxes cost 204 QAR. Large boxes cost 8 QAR and regular boxes cost 5 QAR. Define variables, solve by elimination, and interpret.</p><textarea class="scratch" data-save="apply-turn" aria-label="Contextual elimination work"></textarea>'+reveal('Reveal verified model','<p>Let <span class="math" data-tex="l+r=30"></span> and <span class="math" data-tex="8l+5r=204"></span>. Multiply the first by -5 and add: <span class="math" data-tex="3l=54\\Rightarrow l=18"></span>; then <span class="math" data-tex="r=12"></span>. Thus 18 large boxes and 12 regular boxes satisfy both the count and cost conditions.</p>')+'</div>');
    add("Misconception","Uninterpreted or impossible result",head("Misconception check","A contextual solution needs units and feasibility")+'<div class="grid"><div class="card maroon"><p>An ordered pair without variable definitions is ambiguous, and negative item counts would be impossible.</p></div><div class="card tint"><p>State each quantity with units, verify both constraints, and judge whether the values make sense in context.</p></div></div>');
    add("Checkpoint","Method-choice evidence",head("Checkpoint","Defend an efficient choice")+'<div class="question-box"><p class="question-prompt">Compare methods for <span class="math" data-tex="y=4x-1"></span> with <span class="math" data-tex="3x+y=13"></span>, and for <span class="math" data-tex="2x+5y=19"></span> with <span class="math" data-tex="4x-5y=11"></span>. Choose the more efficient method for each and justify.</p><textarea class="scratch" data-save="apply-check" aria-label="Method choice checkpoint"></textarea>'+reveal('Reveal comparison','<p>Substitution is most direct for the first because <span class="math" data-tex="y"></span> is isolated. Direct addition is most efficient for the second because the y-coefficients are already opposites. Both methods remain mathematically valid.</p>')+'</div>');

    practice.forEach(q=>add("Practice",q.id+" · "+q.level,head("Differentiated practice",q.id+" · "+q.level)+qCard(q)));
    add("Mastery","Practice evidence",head("Mastery evidence","Score the differentiated set")+'<div class="grid"><div class="card"><button class="check-button" id="scoreBtn" type="button">Score all 20 responses</button><p class="lead" id="scoreSummary" aria-live="polite">Complete the set, then score your evidence.</p></div><div class="mastery"><div><strong data-level-score="Easy">—</strong>Easy / 4</div><div><strong data-level-score="Medium">—</strong>Medium / 6</div><div><strong data-level-score="Hard">—</strong>Hard / 6</div><div><strong data-level-score="Challenge">—</strong>Challenge / 4</div><div><strong id="totalScore">—</strong>Total / 20</div></div></div>');
    add("Error analysis","Correct a scaling error",head("Error analysis","Find the first invalid equation")+'<div class="grid"><div class="card"><p>System: <span class="math" data-tex="x+2y=8"></span> and <span class="math" data-tex="3x-y=3"></span>.</p><p>Claimed scale: <span class="math" data-tex="2(3x-y)=3\\Rightarrow 6x-2y=3"></span>.</p><p>Claimed addition: <span class="math" data-tex="7x=11"></span>.</p><label for="errorAnalysis"><strong>Identify the first invalid statement, correct it, and finish the solution.</strong></label><textarea class="scratch" id="errorAnalysis" data-save="error-analysis"></textarea></div><div class="card gold"><h3>Verified correction</h3>'+reveal('Reveal correction','<p>The first error is failing to double the constant. The equivalent equation is <span class="math" data-tex="6x-2y=6"></span>. Add to get <span class="math" data-tex="7x=14\\Rightarrow x=2"></span>; then <span class="math" data-tex="y=3"></span>. Both originals verify <span class="math" data-tex="(2,3)"></span>.</p>')+'</div></div>');
    add("AP bridge","AP-readiness transfer",head("AP bridge","Linear combinations preserve shared solutions")+'<div class="grid three"><article class="card"><h3>Equivalent forms</h3><p>Strategic rewriting can reveal structure without changing the solution set.</p></article><article class="card"><h3>Model comparison</h3><p>Systems locate parameter values or inputs satisfying simultaneous constraints.</p></article><article class="card"><h3>Justification</h3><p>Every transformation and claimed solution needs exact evidence.</p></article></div><p class="callout success"><strong>Transfer:</strong> AP Precalculus repeatedly uses equivalent equations and simultaneous constraints. This lesson secures exact 2×2 elimination while generalized linear-algebra notation and matrix row reduction remain deferred.</p>');
    add("Exit ticket","Exit ticket",head("Exit ticket","Produce final mastery evidence")+'<div class="question-box"><ol><li>Solve <span class="math" data-tex="2x+3y=13"></span> and <span class="math" data-tex="4x-3y=11"></span> by elimination.</li><li>Verify the ordered pair in both original equations.</li><li>Classify <span class="math" data-tex="2x-4y=6"></span> with <span class="math" data-tex="x-2y=4"></span> using elimination.</li><li>Explain why elimination is more efficient than substitution for the first system.</li></ol><textarea class="scratch" data-save="exit-ticket" aria-label="Exit ticket work"></textarea>'+reveal('Reveal exit-ticket key','<ol><li>Add to get <span class="math" data-tex="6x=24\\Rightarrow x=4"></span>; then <span class="math" data-tex="8+3y=13\\Rightarrow y=\\frac53"></span>.</li><li><span class="math" data-tex="2(4)+3(\\frac53)=13"></span> and <span class="math" data-tex="4(4)-3(\\frac53)=11"></span>.</li><li>Multiplying the second equation by -2 and adding gives <span class="math" data-tex="0=-2"></span>, so there is no solution.</li><li>The y-coefficients are already opposites, so direct addition removes a variable immediately.</li></ol>')+'</div>');
    add("Reflect","Mastery reflection",head("Reflect","Select the next instructional move")+'<div class="grid"><div class="card tint"><h3>Ready to advance</h3><p>At least 16/20, accurate whole-equation scaling, an efficient linear combination, correct back-substitution, and two-equation verification.</p></div><div class="card gold"><h3>Targeted review</h3><p>Return to the specific signed arithmetic, multiplier choice, combination, special-case interpretation, or verification error identified by the evidence.</p></div></div><label for="reflection"><h3>My evidence and next action</h3></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea>');
    add("Complete","Elimination foundation secured",head("Complete","Lesson 2.2 mastery package")+'<div class="grid"><div class="card"><h3>Evidence to retain</h3><ul><li>Differentiated practice score</li><li>One corrected scaling error</li><li>Exit-ticket solution and classification</li><li>Method-choice justification</li></ul><button class="secondary" id="exportFinal" type="button">Export lesson work</button></div><div class="card maroon"><h3>Next lesson</h3><p><strong>2.3 Systems in Three Variables</strong></p><p>Organize elimination across a 3×3 system and interpret the resulting ordered triple.</p><a class="cta" href="../../lesson.html?grade=9&amp;path=common&amp;lesson=2.3">View next lesson preview</a></div></div>');

    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map((s,i)=>'<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==='cover'?'cover':'')+'">'+s.body+'</div></section>').join('');
    const slideEls=[...document.querySelectorAll(".slide")];
    let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",''))-1||0));
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function load(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}
    const state=load();
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root=document){root.querySelectorAll('.math').forEach(el=>{if(window.katex){try{window.katex.render(el.dataset.tex||'',el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus=true){index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach((el,i)=>{const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach((b,i)=>b.classList.toggle("current",i===index));renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;slideEls[index].querySelector("h1,h2")?.focus?.();}}
    function buildMap(){document.getElementById("screenMap").innerHTML=slides.map((s,i)=>'<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-map]').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.map));closeDrawers();}));}
    function bind(){document.getElementById("prevBtn").addEventListener("click",()=>go(index-1));document.getElementById("nextBtn").addEventListener("click",()=>go(index+1));document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));document.querySelectorAll('input[type="radio"]').forEach(input=>{if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",e=>{state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(el=>{const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",()=>{if(key.startsWith("work-"))state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>checkOne(b.dataset.check)));document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",()=>openDrawer("mapDrawer"));document.getElementById("notesBtn").addEventListener("click",()=>openDrawer("notesDrawer"));document.getElementById("fullBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.querySelectorAll(".close").forEach(b=>b.addEventListener("click",closeDrawers));document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",()=>{state.fields.notebook=n.value;save();});window.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});}
    function checkOne(id){const q=practice.find(x=>x.id===id),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—now justify the multiplier, linear combination, ordered-pair check, and method choice.":"Not yet. Recheck whole-equation scaling, signed coefficients, the linear combination, and both original equations.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(level=>{const qs=practice.filter(q=>q.level===level),n=qs.filter(q=>state.answers[q.id]===q.answer).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify the exit ticket.":"Use the level pattern to select a targeted review block.");toast("Practice evidence scored");}
    function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button")?.focus();}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(d=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
    function exportWork(){const lines=["ECHS Grade 9 · 2.2 Systems by Elimination","Exported: "+new Date().toLocaleString(),""];practice.forEach(q=>{lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(([k,v])=>{if(v)lines.push(k+":",v,"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_2.2_Systems_Elimination.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    buildMap();bind();go(index,false);renderMath();window.addEventListener("load",()=>renderMath());document.documentElement.dataset.lessonReady="true";
  })();
  </script>

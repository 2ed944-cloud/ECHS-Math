  (function(){
    "use strict";

    const STORAGE_KEY="echs-g9-9.4-cumulative-capstone-v1";
    const practice=[{"id":"E1","level":"Easy","calc":false,"prompt":"Simplify 3(2x−5)−4x.","options":["2x−15","10x−15","2x−5","6x−19"],"answer":0,"solution":"Distribute and combine like terms: 6x−15−4x=2x−15."},{"id":"E2","level":"Easy","calc":false,"prompt":"Solve 5x−7=18.","options":["x=11/5","x=5","x=25","x=−5"],"answer":1,"solution":"Add 7 to obtain 5x=25, then divide by 5: x=5. Substitution gives 18."},{"id":"E3","level":"Easy","calc":false,"prompt":"For f(x)=x²+3x−1, find f(−2).","options":["9","1","−3","−11"],"answer":2,"solution":"f(−2)=4−6−1=−3."},{"id":"E4","level":"Easy","calc":false,"prompt":"What is the slope through (1,4) and (5,12)?","options":["2","1/2","4","8"],"answer":0,"solution":"m=(12−4)/(5−1)=8/4=2."},{"id":"M1","level":"Medium","calc":false,"prompt":"Solve x+y=7 and 2x−y=5.","options":["(3,4)","(4,3)","(5,2)","(6,1)"],"answer":1,"solution":"Adding eliminates y: 3x=12, so x=4 and y=3."},{"id":"M2","level":"Medium","calc":false,"prompt":"Solve 2x−3<7.","options":["x<5","x>5","x<2","x>2"],"answer":0,"solution":"Add 3 and divide by positive 2: 2x<10, so x<5."},{"id":"M3","level":"Medium","calc":false,"prompt":"What are the zeros of x²−5x+6?","options":["−2 and −3","2 and 3","1 and 6","−1 and −6"],"answer":1,"solution":"x²−5x+6=(x−2)(x−3), so the zeros are 2 and 3."},{"id":"M4","level":"Medium","calc":false,"prompt":"For (x+4)/(x²−16), which restriction statement remains true after simplification?","options":["x≠4 only","x≠−4 only","x≠−4 and x≠4","There are no restrictions"],"answer":2,"solution":"The original denominator factors as (x−4)(x+4), so both −4 and 4 are excluded even though x+4 cancels."},{"id":"M5","level":"Medium","calc":false,"prompt":"An arithmetic sequence begins 7,12,17,… Which explicit rule is correct?","options":["aₙ=7n+5","aₙ=5n+2","aₙ=7·5ⁿ","aₙ=12n−5"],"answer":1,"solution":"aₙ=7+5(n−1)=5n+2."},{"id":"M6","level":"Medium","calc":false,"prompt":"Interpret A(t)=180(0.85)^t.","options":["Starts at 0.85 and grows 180%","Starts at 180 and decreases 15% per step","Starts at 180 and decreases 85% per step","Has constant difference −15"],"answer":1,"solution":"A(0)=180 and 0.85=1−0.15, so the decay rate is 15% per step."},{"id":"H1","level":"Hard","calc":false,"prompt":"Solve √(x+5)=x−1 over the reals.","options":["x=−1 only","x=4 only","x=−1 or 4","No real solution"],"answer":1,"solution":"The right side requires x≥1. Squaring gives x²−3x−4=0, so candidates are −1 and 4; only 4 checks."},{"id":"H2","level":"Hard","calc":false,"prompt":"For p(x)=2(x+1)²(x−3), which graph behavior is correct?","options":["Touches at −1, crosses at 3, left end down and right end up","Crosses at −1, touches at 3, both ends up","Touches at both zeros, both ends down","Crosses at both zeros, left end up and right end down"],"answer":0,"solution":"Multiplicity 2 touches at −1; multiplicity 1 crosses at 3. Positive odd degree gives left down and right up."},{"id":"H3","level":"Hard","calc":false,"prompt":"For q(x)=−(x−2)²+9, which full feature set is correct?","options":["Minimum 9 at x=2; zeros 2 and 9","Maximum −9 at x=−2; zeros −1 and 5","Maximum 9 at x=2; zeros −1 and 5","Maximum 9 at x=−2; zeros 1 and 3"],"answer":2,"solution":"The vertex is (2,9) and the graph opens down. Setting q=0 gives (x−2)²=9, so x=−1 or 5."},{"id":"H4","level":"Hard","calc":true,"prompt":"A right triangle has adjacent side 18 m and angle 32°. Find the opposite side to the nearest tenth.","options":["9.6 m","11.2 m","14.4 m","28.8 m"],"answer":1,"solution":"tan(32°)=h/18, so h=18tan(32°)≈11.2476 m, which rounds to 11.2 m."},{"id":"H5","level":"Hard","calc":true,"prompt":"A table gives t=0,1,2,3 and P=40,60,90,135. If the pattern continues, predict P(4).","options":["175","195","202.5","216"],"answer":2,"solution":"Each output is multiplied by 1.5, so P(t)=40(1.5)^t and P(4)=202.5."},{"id":"H6","level":"Hard","calc":false,"prompt":"If f(x)=2x+1 and g(x)=x²−4, find f(g(3)).","options":["11","15","21","29"],"answer":0,"solution":"g(3)=9−4=5, then f(5)=2(5)+1=11."},{"id":"C1","level":"Challenge","calc":false,"prompt":"A student solves −3(2x−1)>9 and reports x>−1. What is the correct repair?","options":["x>1 because the constant changes sign","x<−1 because division by −6 reverses the inequality","x<1 because only the 3 is negative","x>−2 because distribution is optional"],"answer":1,"solution":"Distribute: −6x+3>9, so −6x>6. Dividing by −6 reverses the sign: x<−1."},{"id":"C2","level":"Challenge","calc":false,"prompt":"Find the x-coordinates where y=x+2 and y=x²−2 intersect.","options":["−1 and 4","(−1±√17)/2","(1±√17)/2","1 and 4"],"answer":2,"solution":"Set x+2=x²−2 to get x²−x−4=0. The quadratic formula gives x=(1±√17)/2."},{"id":"C3","level":"Challenge","calc":false,"prompt":"A learner earns 88% overall but has 68% in trigonometry and incomplete written rationales. What is the strongest placement conclusion?","options":["Automatic Grade 10 AP placement because the average exceeds 85%","Use the full strand and independence evidence; target the gaps before or within the readiness pathway rather than making an automatic decision","Automatic exclusion from all advanced mathematics","Ignore trigonometry because it is one strand"],"answer":1,"solution":"Placement is evidence-based, not automatic. A critical strand below about 75% and weak rationale evidence require targeted support and a conference decision."},{"id":"C4","level":"Challenge","calc":false,"prompt":"Which summer action plan is most precise and evidence-based?","options":["Review all mathematics whenever possible","Complete three short weekly sessions on rational restrictions and right-triangle trigonometry, then retest each strand and explain two corrected errors","Memorize every formula without checking work","Repeat the entire Grade 9 course regardless of evidence"],"answer":1,"solution":"The strongest plan names the exact gaps, frequency, evidence task, correction routine, and reassessment point."}];

    function turn(prompt,answer){return '<div class="question-box"><p class="question-prompt">'+prompt+'</p><textarea class="scratch" data-save="turn-'+slides.length+'" aria-label="Student reasoning"></textarea>'+reveal("Reveal verified reasoning",'<p>'+answer+'</p>')+'</div>';}
    function practiceSlide(q){add("Practice",q.level+" · "+q.id,head("Practice · "+q.level,q.id+" · "+(q.calc?"Calculator":"No calculator"))+'<div class="question-layout"><div class="question-box"><p class="question-prompt">'+q.prompt+'</p><div class="choices">'+q.options.map(function(o,i){return '<label class="choice"><input type="radio" name="'+q.id+'" value="'+i+'"><span>'+o+'</span></label>';}).join("")+'</div><p><button class="check-button" type="button" data-check="'+q.id+'">Check response</button></p><p class="feedback" id="feedback-'+q.id+'" role="status"></p>'+reveal("Reveal answer and reasoning",'<p><strong>Answer: '+String.fromCharCode(65+q.answer)+'.</strong> '+q.solution+'</p>')+'</div><aside class="side-note"><span class="badge level">'+q.level+'</span><p><strong>'+(q.calc?"Calculator permitted":"No calculator")+'</strong></p><p>Translate deliberately, show exact or supported analysis, attach units/domain, and justify the conclusion.</p><textarea class="scratch" data-save="work-'+q.id+'" aria-label="Work for '+q.id+'"></textarea></aside></div>');}

    add("Launch","Cumulative AP Readiness Capstone",'<div class="cover-grid"><div><p class="eyebrow">Grade 9 · Unit 9 · Lesson 9.4</p><h1>Cumulative AP Readiness Capstone</h1><p class="lead">Demonstrate durable prerequisite mastery, correct and explain errors, reflect on strand evidence, and build a precise Grade 10 and summer transition plan.</p><p><span class="badge">Unit pacing: weeks 34–36</span><span class="badge">64 meaningful screens</span></p><button class="cta" type="button" data-go="1">Begin capstone</button></div><div class="system-art"><svg viewBox="0 0 660 470" role="img" aria-labelledby="capstoneTitle capstoneDesc" class="graph"><title id="capstoneTitle">Cumulative readiness evidence wheel</title><desc id="capstoneDesc">Eight prerequisite strands surround a central evidence portfolio. Arrows connect benchmark work, corrections, reflection, and a transition plan.</desc><circle cx="330" cy="235" r="78" fill="#7a1734"/><g fill="#fff" stroke="#d8e0e7" stroke-width="3"><rect x="245" y="25" width="170" height="66" rx="18"/><rect x="445" y="112" width="170" height="66" rx="18"/><rect x="445" y="292" width="170" height="66" rx="18"/><rect x="245" y="380" width="170" height="66" rx="18"/><rect x="45" y="292" width="170" height="66" rx="18"/><rect x="45" y="112" width="170" height="66" rx="18"/></g><g class="gtext" text-anchor="middle"><text x="330" y="64">ALGEBRA</text><text x="530" y="151">FUNCTIONS</text><text x="530" y="331">MODELS</text><text x="330" y="419">TRIG</text><text x="130" y="331">EXPONENTIAL</text><text x="130" y="151">POLYNOMIAL</text><text x="330" y="225" fill="#fff">EVIDENCE</text><text x="330" y="250" fill="#fff">PORTFOLIO</text></g><g stroke="#c69b37" stroke-width="6"><path d="M330 91V155M415 235H445M330 313V380M215 235H245"/></g></svg></div></div>','cover');
    add("Scope","Authoritative lesson scope",head("Scope","Assess, correct, reflect, transition")+'<div class="grid"><div class="card tint"><h3>Capstone work</h3><p>Mixed prerequisite assessment, independent error correction, student reflection, strand-level evidence, and a targeted summer/Grade 10 transition plan.</p></div><div class="card maroon"><h3>Boundary</h3><p>No new AP content, released-AP complexity, automatic placement, formal calculus reasoning, advanced logarithmic/trigonometric proofs, or full AP exam simulation.</p></div></div>');
    add("Goals","Learning outcomes",head("Goals","Four outcomes, one evidence portfolio")+'<div class="grid four"><div class="card"><h3>Demonstrate</h3><p>Show mastery across all prerequisite strands.</p></div><div class="card"><h3>Correct</h3><p>Repair and explain errors independently.</p></div><div class="card"><h3>Reflect</h3><p>Name strengths, gaps, and habits using evidence.</p></div><div class="card"><h3>Transition</h3><p>Identify the appropriate next pathway and targeted summer actions.</p></div></div>');
    add("Architecture","Capstone architecture",head("Architecture","Four evidence cycles")+'<div class="flow"><span>mixed benchmark</span><b>→</b><span>strand report</span><b>→</b><span>error correction</span><b>→</b><span>reflection</span><b>→</b><span>transition plan</span></div><p class="callout">A score begins the conversation. Durable reasoning, strand balance, independence, corrections, and representation/justification evidence complete it.</p>');
    add("Placement","Evidence—not one score",head("Placement","Recommended guides, not automatic exclusions")+'<p class="lead">The placement conference weighs cumulative mastery, critical-strand floors, independence, pace, representation fluency, written rationale, growth, and completed corrections.</p><div class="grid"><div class="card tint"><h3>Strong aggregate evidence</h3><p>Approximately 85%+ can support Grade 10 AP Precalculus only when no critical strand is below about 75% and reasoning is independent.</p></div><div class="card gold"><h3>Gaps are actionable</h3><p>Grade 10 Readiness—Fast Track or Core preserves AP access and provides transfer gates or a Grade 11 AP destination.</p></div></div>');
    add("Map","Readiness strand map",head("Map","Track eight prerequisite strands")+'<div class="grid four"><div class="card">Algebra & equations</div><div class="card">Functions & representations</div><div class="card">Systems & inequalities</div><div class="card">Quadratics & polynomials</div><div class="card">Rational & radical</div><div class="card">Sequences & exponential</div><div class="card">Right-triangle trigonometry</div><div class="card">Modeling & communication</div></div>');
    add("Routines","Calculator and no-calculator routines",head("Routines","Choose tools purposefully")+'<div class="grid"><div class="card tint"><h3>No calculator</h3><p>Use exact structure for algebra, factoring, restrictions, sequences, function evaluation, and symbolic reasoning.</p></div><div class="card gold"><h3>Calculator permitted</h3><p>Use technology for trigonometric approximations or structured numerical analysis; record the equation, enough digits, rounding, units, and meaning.</p></div></div>');
    add("Errors","Error taxonomy",head("Errors","Diagnose before reteaching")+'<div class="grid four"><div class="card maroon"><h3>Conceptual</h3><p>The underlying idea or representation is misunderstood.</p></div><div class="card gold"><h3>Procedural</h3><p>The idea is known but a valid process breaks.</p></div><div class="card tint"><h3>Communication</h3><p>Reasoning, notation, domain, or units are missing.</p></div><div class="card"><h3>Attention</h3><p>A sign, value, label, or direction is copied inaccurately.</p></div></div>');
    add("Correct","Independent correction protocol",head("Correct","Locate → classify → repair → verify → generalize")+'<div class="step-list"><div class="step">Locate the first invalid claim or step.</div><div class="step">Classify the error and explain why it is invalid.</div><div class="step">Replace it with a complete valid solution.</div><div class="step">Verify in the original representation or context.</div><div class="step">Write a rule that prevents recurrence.</div></div>');
    add("Algebra","Prerequisite retrieval · algebra",head("Algebra","Structure before speed")+turn('Simplify 4(2x−3)−5(x+1), then solve when the result equals 12.','The expression is 8x−12−5x−5=3x−17. Solving 3x−17=12 gives 3x=29 and x=29/3. Substitution verifies the exact result.'));
    add("Algebra","Worked correction · inequality",head("Algebra","A negative divisor changes direction")+'<p>A learner writes −3(2x−1)&gt;9 ⇒ x&gt;−1.</p><p class="formula"><span class="math" data-tex="-6x+3&gt;9\\Rightarrow -6x&gt;6\\Rightarrow x&lt;-1"></span></p><p>The error is procedural: dividing by −6 requires reversing the inequality. Check x=−2: 15&gt;9 is true.</p>');
    add("Functions","Functions and representations",head("Functions","Read inputs, outputs, features, and rates")+'<div class="grid three"><div class="card tint"><h3>Formula</h3><p>Evaluate exactly; expose parameters and restrictions.</p></div><div class="card gold"><h3>Graph/table</h3><p>Read intercepts, extrema, intervals, differences, ratios, and average rate.</p></div><div class="card maroon"><h3>Context</h3><p>Name variables, units, feasible domain, and limitations.</p></div></div>');
    add("Functions","Worked multi-representation evidence",head("Functions","Quadratic evidence across forms")+'<p>For <span class="math" data-tex="q(x)=-(x-2)^2+9"></span>, the vertex is (2,9), the maximum is 9, and zeros satisfy (x−2)²=9, so x=−1 or 5.</p><svg viewBox="0 0 760 400" role="img" aria-labelledby="quadCapTitle quadCapDesc" class="graph"><title id="quadCapTitle">Downward parabola with vertex two comma nine</title><desc id="quadCapDesc">A downward parabola has vertex at two comma nine and crosses the x-axis at negative one and five.</desc><path class="axis" d="M55 335H710M110 375V35"/><path d="M135 335Q375 45 615 335" fill="none" stroke="#7a1734" stroke-width="7"/><g fill="#087f8c"><circle cx="375" cy="62" r="10"/><circle cx="135" cy="335" r="9"/><circle cx="615" cy="335" r="9"/></g><g class="gtext"><text x="390" y="62">(2,9)</text><text x="120" y="365">−1</text><text x="610" y="365">5</text></g></svg>');
    add("Systems","Systems and inequalities",head("Systems","Intersections and simultaneous constraints")+'<p>For x+y=7 and 2x−y=5, adding gives 3x=12, so (x,y)=(4,3). Verify in both equations.</p><p class="callout">For inequalities, boundary type, shading, interval notation, and feasible-region membership are part of the answer.</p>');
    add("Student Turn","Student Turn · system evidence",head("Student Turn","Choose and verify a method")+turn('Solve 3x+2y=16 and x−2y=0. State why elimination is efficient.','Adding the equations eliminates y: 4x=16, so x=4 and y=2. Elimination is efficient because the y-coefficients are opposites; (4,2) verifies both equations.'));
    add("Quadratics","Quadratic and polynomial structure",head("Quadratics","Forms reveal different evidence")+'<div class="grid three"><div class="card"><h3>factored</h3><p>zeros and multiplicity.</p></div><div class="card tint"><h3>vertex</h3><p>extremum and axis.</p></div><div class="card gold"><h3>standard</h3><p>degree, leading behavior, y-intercept.</p></div></div><p>For p(x)=2(x+1)²(x−3), −1 is an even-multiplicity touch and 3 is an odd-multiplicity crossing.</p>');
    add("Quadratics","Worked polynomial evidence",head("Quadratics","End behavior, zeros, and multiplicity")+'<p>The polynomial <span class="math" data-tex="p(x)=2(x+1)^2(x-3)"></span> has positive leading term 2x³. Therefore the left end falls and the right end rises. The graph touches at x=−1 and crosses at x=3.</p>');
    add("Rational","Rational restrictions",head("Rational","Cancellation does not restore a domain value")+'<p class="formula"><span class="math" data-tex="\\frac{x+4}{x^2-16}=\\frac{1}{x-4},\\quad x\\ne -4,4"></span></p><p>The simplified expression agrees only on the original domain. x=−4 remains a hole; x=4 is a vertical asymptote.</p>');
    add("Student Turn","Student Turn · rational correction",head("Student Turn","Preserve the original domain")+turn('Simplify (x²−9)/(x²+x−6) and state every restriction.','Factor: (x−3)(x+3)/[(x+3)(x−2)]=(x−3)/(x−2), with original restrictions x≠−3 and x≠2.'));
    add("Radicals","Radicals and rational exponents",head("Radicals","Domain and verification are inseparable")+'<p>Solve √(x+5)=x−1. The right side requires x≥1. Squaring gives x²−3x−4=0, so candidates are −1 and 4; only x=4 satisfies the original equation.</p><p class="callout warning">Squaring can create an extraneous candidate. Verify every candidate in the original equation.</p>');
    add("Student Turn","Student Turn · radical evidence",head("Student Turn","Solve, restrict, verify")+turn('Solve √(2x+3)=x.','Require x≥0. Squaring gives x²−2x−3=0=(x−3)(x+1), so candidates 3 and −1. Only x=3 checks.'));
    add("Sequences","Sequences and exponential change",head("Sequences","Additive or multiplicative?")+'<div class="grid"><div class="card tint"><h3>Arithmetic</h3><p>constant difference d; aₙ=a₁+d(n−1).</p></div><div class="card gold"><h3>Geometric/exponential</h3><p>constant ratio r; aₙ=a₁rⁿ⁻¹ or A(t)=abᵗ.</p></div></div>');
    add("Sequences","Worked exponential evidence",head("Sequences","Factor, rate, and prediction")+'<p>For A(t)=180(0.85)^t, the initial amount is 180 and the decay rate is 1−0.85=0.15=15% per step.</p><p>Equal input steps multiply outputs by 0.85; they do not subtract 15.</p>');
    add("Trigonometry","Right-triangle trigonometry",head("Trigonometry","Reference angle controls the ratio")+'<div class="grid three"><div class="card"><h3>sine</h3><p>opposite/hypotenuse</p></div><div class="card tint"><h3>cosine</h3><p>adjacent/hypotenuse</p></div><div class="card gold"><h3>tangent</h3><p>opposite/adjacent</p></div></div><p>Use degree mode, write the equation first, retain enough digits, then round once with units.</p>');
    add("Trigonometry","Worked trigonometric evidence",head("Trigonometry","Equation → value → interpretation")+'<p>An angle is 32° and the adjacent side is 18 m.</p><p class="formula"><span class="math" data-tex="\\tan(32^\\circ)=\\frac{h}{18}\\Rightarrow h=18\\tan(32^\\circ)\\approx 11.2\\text{ m}"></span></p><p>The approximation is to the nearest tenth; the right-triangle model and measurements bound its validity.</p>');
    add("Modeling","Modeling and representations",head("Modeling","Family evidence before regression")+'<div class="table-wrap"><table class="data-table"><thead><tr><th>Evidence</th><th>Candidate</th><th>Check</th></tr></thead><tbody><tr><td>constant differences</td><td>linear</td><td>residuals and units</td></tr><tr><td>constant second differences</td><td>quadratic</td><td>vertex/domain</td></tr><tr><td>constant ratios</td><td>exponential</td><td>positive outputs and factor</td></tr></tbody></table></div>');
    add("Modeling","Worked model evidence",head("Modeling","Structured data with a limitation")+'<p>Values 40,60,90,135 have constant ratio 1.5, so P(t)=40(1.5)^t. Then P(4)=202.5.</p><p class="callout">This prediction assumes the multiplicative pattern continues; extrapolation beyond observed conditions requires caution.</p>');
    add("Calculator","Calculator-supported analysis",head("Calculator","Transparent technology evidence")+'<div class="flow"><span>enter correctly</span><b>→</b><span>inspect</span><b>→</b><span>compute</span><b>→</b><span>record</span><b>→</b><span>interpret</span></div><p>Calculator output never replaces the governing equation, relevant precision, units, domain, or reasonableness check.</p>');
    add("Communication","Concise rationale",head("Communication","Claim → evidence → reasoning → qualifier")+'<div class="grid four"><div class="card"><h3>Claim</h3><p>State the conclusion.</p></div><div class="card tint"><h3>Evidence</h3><p>Cite exact values or features.</p></div><div class="card gold"><h3>Reasoning</h3><p>Connect evidence to the claim.</p></div><div class="card maroon"><h3>Qualifier</h3><p>State domain, units, assumption, or limitation.</p></div></div>');
    add("Communication","Worked evidence rationale",head("Communication","Defend an exponential model")+'<p class="callout success"><strong>Claim:</strong> exponential structure fits. <strong>Evidence:</strong> outputs multiply by 1.5 for equal input steps. <strong>Reasoning:</strong> a constant multiplicative factor defines exponential change, giving P(t)=40(1.5)^t. <strong>Qualifier:</strong> predictions assume the pattern remains stable.</p>');
    add("Profile","Strand-level evidence matrix",head("Profile","Record accuracy and independence")+'<div class="table-wrap"><table class="data-table"><thead><tr><th>Strand</th><th>Accuracy</th><th>Independent?</th><th>Correction complete?</th><th>Next action</th></tr></thead><tbody><tr><td>Algebra/equations</td><td>___%</td><td>yes / support</td><td>yes / pending</td><td>___</td></tr><tr><td>Functions/representations</td><td>___%</td><td>yes / support</td><td>yes / pending</td><td>___</td></tr><tr><td>Polynomial/rational/radical</td><td>___%</td><td>yes / support</td><td>yes / pending</td><td>___</td></tr><tr><td>Exponential/trig/modeling</td><td>___%</td><td>yes / support</td><td>yes / pending</td><td>___</td></tr></tbody></table></div>');
    add("Placement","Grade 10 AP Precalculus profile",head("Placement","Evidence that supports direct AP placement")+'<ul><li>Strong cumulative mastery, approximately 85%+ on the common benchmark.</li><li>No critical prerequisite strand below about 75%.</li><li>Independent algebra and representation switching at the required pace.</li><li>Accurate corrections and concise justifications.</li></ul><p class="callout">These are recommended guides considered in a placement conference—not an automatic rule.</p>');
    add("Placement","Grade 10 Readiness profiles",head("Placement","Fast Track and Core preserve AP pathways")+'<div class="grid"><div class="card tint"><h3>Readiness—Fast Track</h3><p>Core skills mostly secure, with inconsistent Algebra 2, trig, or function strands and a strong growth trajectory. Transfer Gate 1 remains available.</p></div><div class="card gold"><h3>Readiness—Core</h3><p>Several strands are not yet durable or independent. Successful completion leads directly to Grade 11 AP Precalculus.</p></div></div>');
    add("Reflect","Student reflection",head("Reflect","Use evidence, not labels")+'<div class="question-box"><label><strong>My strongest evidence, most important corrected error, remaining readiness-blocking gap, and help-seeking/independence habit:</strong></label><textarea class="scratch" data-save="capstone-reflection" aria-label="Capstone evidence reflection"></textarea></div>');
    add("Plan","Targeted summer action plan",head("Plan","Precise, limited, measurable")+'<div class="step-list"><div class="step">Name one or two exact strand gaps—not the whole course.</div><div class="step">Schedule short weekly retrieval and correction sessions.</div><div class="step">Use a named evidence task and success threshold.</div><div class="step">Retest, explain two corrected errors, then revise the plan.</div></div><textarea class="scratch" data-save="summer-plan" aria-label="Targeted summer action plan"></textarea>');
    add("Benchmark","Common readiness benchmark conditions",head("Benchmark","Evidence must be comparable and honest")+'<div class="grid four"><div class="card"><h3>Mixed</h3><p>Sample every critical prerequisite strand.</p></div><div class="card tint"><h3>Balanced</h3><p>Use meaningful no-calculator and calculator-permitted sections.</p></div><div class="card gold"><h3>Independent</h3><p>Record prompts or supports actually used.</p></div><div class="card maroon"><h3>Correctable</h3><p>Require explanations and verified revisions after scoring.</p></div></div>');
    add("Conference","Placement conference preparation",head("Conference","Bring a portfolio, not a label")+'<div class="step-list"><div class="step">Bring the strand report and benchmark responses.</div><div class="step">Show two independently corrected errors and the prevention rules.</div><div class="step">Explain one representation or rationale task aloud.</div><div class="step">Propose a next pathway and targeted action, then compare it with the full evidence.</div></div>');
    add("Misconceptions","Placement misconception check",head("Misconceptions","Repair four evidence failures")+'<div class="grid four"><div class="card maroon"><h3>average only</h3><p>ignores critical-strand gaps.</p></div><div class="card maroon"><h3>speed only</h3><p>ignores validity and explanation.</p></div><div class="card maroon"><h3>label thinking</h3><p>treats a pathway as a fixed identity.</p></div><div class="card maroon"><h3>review everything</h3><p>replaces targeted action with vague volume.</p></div></div>');
    add("AP bridge","AP-readiness transfer and boundary",head("AP bridge","Consolidate prerequisites without pre-teaching AP")+'<div class="grid"><div class="card tint"><h3>Transfer habits</h3><p>Independent retrieval, exact algebra, representation switching, strategic technology, correction, and concise rationale.</p></div><div class="card maroon"><h3>Deferred</h3><p>New AP content, full AP difficulty, released-AP assessment complexity, formal inference, calculus reasoning, and extended AP free-response scoring remain later-course work.</p></div></div>');
    add("Practice","Differentiated practice launch",head("Practice","Twenty original cumulative tasks")+'<div class="section-banner"><div><p class="lead">Progress from foundational retrieval to integrated reasoning, independent error correction, calculator-supported analysis, and evidence-based transition decisions.</p><p><span class="badge level">Easy 4</span><span class="badge level">Medium 6</span><span class="badge level">Hard 6</span><span class="badge level">Challenge 4</span></p><button class="cta" type="button" data-go="40">Start benchmark</button></div><div class="section-code">assess<br>correct<br>reflect<br>plan</div></div>');
    practice.forEach(practiceSlide);
    add("Mastery","Score differentiated evidence",head("Mastery","Score all responses")+'<div class="mastery"><div><span>Easy</span><strong data-level-score="Easy">0</strong><small>/4</small></div><div><span>Medium</span><strong data-level-score="Medium">0</strong><small>/6</small></div><div><span>Hard</span><strong data-level-score="Hard">0</strong><small>/6</small></div><div><span>Challenge</span><strong data-level-score="Challenge">0</strong><small>/4</small></div><div><span>Total</span><strong id="totalScore">0</strong><small>/20</small></div></div><p><button class="check-button" id="scoreBtn" type="button">Score all responses</button></p><p id="scoreSummary" class="callout" role="status">A score of 16/20 is one evidence point. Confirm critical-strand balance, independent work, completed corrections, and valid written rationale before a placement conference.</p>');
    add("Correct","Independent misconception correction studio",head("Correct","Correct, explain, verify, generalize")+'<div class="grid three"><article class="card maroon"><h3>Student A</h3><p>cancels a rational factor and restores an excluded value.</p></article><article class="card maroon"><h3>Student B</h3><p>accepts every candidate after squaring a radical equation.</p></article><article class="card maroon"><h3>Student C</h3><p>uses an overall average to hide a critical trig gap.</p></article></div><textarea class="scratch" data-save="capstone-corrections" aria-label="Independent capstone error corrections"></textarea>');
    add("Exit ticket","Exit ticket · readiness conference",head("Exit ticket","Evidence, correction, transition")+'<div class="question-box"><ol><li>Solve (x−4)(x+1)=0 and connect the solutions to graph features.</li><li>Correct: √(x+6)=x has solutions −2 and 3.</li><li>Name the placement evidence required beyond a total score.</li><li>Write one precise summer action with a retest condition.</li></ol><textarea class="scratch" data-save="exit-capstone" aria-label="Cumulative readiness exit ticket"></textarea>'+reveal("Reveal verified key",'<ol><li>x=4 or −1; the graph crosses or touches at those x-intercepts according to multiplicity.</li><li>Require x≥0. Squaring gives x²−x−6=0, candidates −2 and 3; only x=3 verifies.</li><li>Use strand balance, critical floors, independence, pace, representations, justification, growth, and completed corrections.</li><li>Example: three short weekly rational-restriction sessions, then score at least 4/5 and explain two corrections without prompts.</li></ol>')+'</div>');
    add("Complete","Cumulative readiness mastery evidence",head("Complete","Grade 9 pathway lesson-ready")+'<div class="grid"><div class="card"><h3>Evidence portfolio complete</h3><p>Benchmark responses, strand report, verified corrections, reflection, and targeted transition plan are ready for the placement conference.</p><label for="reflection"><strong>My recommended next pathway and evidence</strong></label><textarea class="scratch" id="reflection" data-save="reflection"></textarea><button class="secondary" id="exportFinal" type="button">Export capstone work</button></div><div class="card gold"><h3>Conference principle</h3><p>Use recommended guides, not automatic exclusions. Grade 10 AP Precalculus, Readiness—Fast Track, and Readiness—Core each preserve a purposeful route toward AP success.</p><a class="cta" href="../../../../index.html">Return to pathway catalog</a></div></div>');

    if(slides.length!==EXPECTED_SCREEN_COUNT)throw new Error("Expected "+EXPECTED_SCREEN_COUNT+" screens; found "+slides.length);
    const viewport=document.getElementById("slideViewport");
    viewport.innerHTML=slides.map(function(s,i){return '<section class="slide '+s.cls+'" data-stage="'+esc(s.stage)+'" data-title="'+esc(s.title)+'" data-index="'+i+'" aria-hidden="true"><div class="slide-inner '+(s.cls==="cover"?"cover":"")+'">'+s.body+'</div></section>';}).join("");
    const slideEls=[].slice.call(document.querySelectorAll(".slide"));let index=Math.max(0,Math.min(slides.length-1,Number(location.hash.replace("#s",""))-1||0));
    function loadState(){try{return Object.assign({answers:{},work:{},fields:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch(e){return {answers:{},work:{},fields:{}};}}const state=loadState();function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    function renderMath(root){(root||document).querySelectorAll(".math").forEach(function(el){if(window.katex){try{window.katex.render(el.dataset.tex||"",el,{throwOnError:false,strict:"ignore"});}catch(e){el.textContent=el.dataset.tex;}}else if(!el.textContent){el.textContent=el.dataset.tex;}});}
    function go(to,focus){if(focus===undefined)focus=true;index=Math.max(0,Math.min(slides.length-1,to));slideEls.forEach(function(el,i){const active=i===index;el.classList.toggle("active",active);el.setAttribute("aria-hidden",String(!active));});document.getElementById("currentStage").textContent=slides[index].stage;document.getElementById("counter").textContent=(index+1)+" / "+slides.length;document.getElementById("progressFill").style.width=((index+1)/slides.length*100)+"%";document.getElementById("prevBtn").disabled=index===0;document.getElementById("nextBtn").disabled=index===slides.length-1;location.hash="s"+(index+1);document.querySelectorAll("#screenMap button").forEach(function(b,i){b.classList.toggle("current",i===index);});renderMath(slideEls[index]);if(focus){slideEls[index].scrollTop=0;const h=slideEls[index].querySelector("h1,h2");if(h)h.focus();}}
    function closeDrawers(){document.querySelectorAll(".drawer").forEach(function(d){d.classList.remove("open");d.setAttribute("aria-hidden","true");});document.getElementById("backdrop").hidden=true;}function openDrawer(id){closeDrawers();const d=document.getElementById(id);d.classList.add("open");d.setAttribute("aria-hidden","false");document.getElementById("backdrop").hidden=false;d.querySelector("button").focus();}
    function checkOne(id){const q=practice.find(function(x){return x.id===id;}),f=document.getElementById("feedback-"+id);if(state.answers[id]===undefined){f.textContent="Choose a response first.";f.className="feedback bad";return;}const ok=state.answers[id]===q.answer;f.textContent=ok?"Correct—record the strand evidence and explain why the reasoning is valid.":"Not yet. Recheck the prerequisite strand, calculation, restriction, units, or justification.";f.className="feedback "+(ok?"good":"bad");}
    function scoreAll(){let total=0;["Easy","Medium","Hard","Challenge"].forEach(function(level){const qs=practice.filter(function(q){return q.level===level;}),n=qs.filter(function(q){return state.answers[q.id]===q.answer;}).length;total+=n;document.querySelector('[data-level-score="'+level+'"]').textContent=n;});document.getElementById("totalScore").textContent=total;document.getElementById("scoreSummary").textContent=total+" / 20 correct. "+(total>=16?"Mastery threshold reached; verify strand balance, corrections, and independence evidence.":"Use the level pattern to select targeted review.");toast("Practice evidence scored");}
    function toast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1800);}function exportWork(){const lines=["ECHS Grade 9 · 9.4 Cumulative AP Readiness Capstone","Exported: "+new Date().toLocaleString(),""];practice.forEach(function(q){lines.push(q.id+" · "+q.level+": "+(state.answers[q.id]===undefined?"unanswered":q.options[state.answers[q.id]]));if(state.work["work-"+q.id])lines.push("Work: "+state.work["work-"+q.id]);lines.push("");});Object.entries(state.fields).forEach(function(entry){if(entry[1])lines.push(entry[0]+":",entry[1],"");});const blob=new Blob([lines.join("\n")],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ECHS_G9_9.4_Cumulative_AP_Readiness_Capstone.txt";a.click();URL.revokeObjectURL(a.href);toast("Lesson work exported");}
    document.getElementById("screenMap").innerHTML=slides.map(function(s,i){return '<button type="button" data-map="'+i+'" title="'+esc(s.title)+'">'+(i+1)+'</button>';}).join("");document.querySelectorAll("[data-map]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.map));closeDrawers();});});
    document.getElementById("prevBtn").addEventListener("click",function(){go(index-1);});document.getElementById("nextBtn").addEventListener("click",function(){go(index+1);});document.querySelectorAll("[data-go]").forEach(function(b){b.addEventListener("click",function(){go(Number(b.dataset.go));});});document.querySelectorAll('input[type="radio"]').forEach(function(input){if(state.answers[input.name]===Number(input.value))input.checked=true;input.addEventListener("change",function(e){state.answers[e.target.name]=Number(e.target.value);save();});});document.querySelectorAll("[data-save]").forEach(function(el){const key=el.dataset.save;el.value=state.work[key]||state.fields[key]||"";el.addEventListener("input",function(){if(key.indexOf("work-")===0)state.work[key]=el.value;else state.fields[key]=el.value;save();});});document.querySelectorAll("[data-check]").forEach(function(b){b.addEventListener("click",function(){checkOne(b.dataset.check);});});document.getElementById("scoreBtn").addEventListener("click",scoreAll);document.getElementById("exportBtn").addEventListener("click",exportWork);document.getElementById("exportFinal").addEventListener("click",exportWork);document.getElementById("mapBtn").addEventListener("click",function(){openDrawer("mapDrawer");});document.getElementById("notesBtn").addEventListener("click",function(){openDrawer("notesDrawer");});document.getElementById("fullBtn").addEventListener("click",function(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();});document.querySelectorAll(".close").forEach(function(b){b.addEventListener("click",closeDrawers);});document.getElementById("backdrop").addEventListener("click",closeDrawers);const n=document.getElementById("notebook");n.value=state.fields.notebook||"";n.addEventListener("input",function(){state.fields.notebook=n.value;save();});window.addEventListener("keydown",function(e){if(e.target.closest("input,textarea,select,summary,[contenteditable]"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(index+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(index-1);if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="m")openDrawer("mapDrawer");if(e.key.toLowerCase()==="n")openDrawer("notesDrawer");if(e.key==="Escape")closeDrawers();});
    go(index,false);renderMath();window.addEventListener("load",function(){renderMath();});document.documentElement.dataset.lessonReady="true";

  })();

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="q6p-title q6p-desc">
  <title id="q6p-title">Arched window coordinate diagram</title>
  <desc id="q6p-desc">A symmetric arch above the x-axis. Its endpoints are negative b comma zero and b comma zero, its highest point is zero comma h, its base width is two b, and its height is h.</desc>
  <rect width="900" height="520" rx="20" fill="#FBF8F2"/>

  <rect x="60" y="55" width="780" height="390" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="120" y1="390" x2="780" y2="390" stroke="#172033" stroke-width="2"/>
  <line x1="450" y1="430" x2="450" y2="90" stroke="#172033" stroke-width="2"/>
  <path d="M 180 390 Q 450 65 720 390" fill="#F4E9ED" fill-opacity="0.55" stroke="#7A1F3D" stroke-width="5"/>
  <circle cx="180" cy="390" r="6" fill="#0E2A47"/>
  <circle cx="720" cy="390" r="6" fill="#0E2A47"/>
  <circle cx="450" cy="227.5" r="6" fill="#0E2A47"/>
  <text x="165" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033">(−b,0)</text>
  <text x="735" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033">(b,0)</text>
  <text x="467" y="215" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033">(0,h)</text>
  <line x1="180" y1="465" x2="720" y2="465" stroke="#0F766E" stroke-width="2"/>
  <path d="M180 465 l15 -8 v16 z M720 465 l-15 -8 v16 z" fill="#0F766E"/>
  <text x="450" y="495" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0F766E">base width = 2b</text>
  <line x1="790" y1="390" x2="790" y2="227.5" stroke="#C59A2A" stroke-width="2"/>
  <path d="M790 390 l-8 -15 h16 z M790 227.5 l-8 15 h16 z" fill="#C59A2A"/>
  <text x="812" y="315" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#C59A2A">h</text>
</svg>

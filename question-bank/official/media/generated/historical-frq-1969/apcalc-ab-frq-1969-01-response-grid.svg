<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="q1-title q1-desc">
  <title id="q1-title">1969 AP Calculus AB Question 1 response grid</title>
  <desc id="q1-desc">A blank yes-or-no grid. Columns are the four functions f1 through f4. Rows ask whether each function is odd, invertible, periodic, and continuous at x equals zero.</desc>
  <rect width="1120" height="540" rx="20" fill="#FBF8F2"/>

  <text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0E2A47">Write Yes or No in each blank cell</text>
  <rect x="40" y="75" width="1040" height="420" rx="12" fill="#FFFFFF" stroke="#0E2A47" stroke-width="2"/>
  <line x1="390" y1="75" x2="390" y2="495" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="562.5" y1="75" x2="562.5" y2="495" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="735" y1="75" x2="735" y2="495" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="907.5" y1="75" x2="907.5" y2="495" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="40" y1="155" x2="1080" y2="155" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="40" y1="240" x2="1080" y2="240" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="40" y1="325" x2="1080" y2="325" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="40" y1="410" x2="1080" y2="410" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="75" width="1040" height="80" rx="12" fill="#F4E9ED" opacity="0.9"/>
  <text x="215" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172033">Property</text>
  <text x="476" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172033">f₁(x) = x</text>
  <text x="648" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172033">f₂(x) = x cos x</text>
  <text x="821" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172033">f₃(x) = 3e^(2x)</text>
  <text x="994" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172033">f₄(x) = x − |x|</text>
  <text x="60" y="204.5" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172033">Does f(−x) = −f(x)?</text>
  <line x1="428" y1="214.5" x2="524" y2="214.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="600" y1="214.5" x2="696" y2="214.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="773" y1="214.5" x2="869" y2="214.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="946" y1="214.5" x2="1042" y2="214.5" stroke="#52606D" stroke-width="1.5"/>
  <text x="60" y="289.5" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172033">Does the inverse function exist?</text>
  <line x1="428" y1="299.5" x2="524" y2="299.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="600" y1="299.5" x2="696" y2="299.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="773" y1="299.5" x2="869" y2="299.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="946" y1="299.5" x2="1042" y2="299.5" stroke="#52606D" stroke-width="1.5"/>
  <text x="60" y="374.5" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172033">Is the function periodic?</text>
  <line x1="428" y1="384.5" x2="524" y2="384.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="600" y1="384.5" x2="696" y2="384.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="773" y1="384.5" x2="869" y2="384.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="946" y1="384.5" x2="1042" y2="384.5" stroke="#52606D" stroke-width="1.5"/>
  <text x="60" y="459.5" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172033">Is the function continuous at x = 0?</text>
  <line x1="428" y1="469.5" x2="524" y2="469.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="600" y1="469.5" x2="696" y2="469.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="773" y1="469.5" x2="869" y2="469.5" stroke="#52606D" stroke-width="1.5"/>
  <line x1="946" y1="469.5" x2="1042" y2="469.5" stroke="#52606D" stroke-width="1.5"/>
</svg>

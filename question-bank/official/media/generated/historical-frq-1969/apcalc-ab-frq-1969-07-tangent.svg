<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="q7t-title q7t-desc">
  <title id="q7t-title">Tangent-intercept geometry for the hyperbolic cosine curve</title>
  <desc id="q7t-desc">The curve y equals one half times e to the x plus e to the negative x is shown with a tangent at R, whose x-coordinate is r. The tangent meets the x-axis at Q with x-coordinate r minus coth r. P is directly below R at r comma zero, so the horizontal distance P Q is the absolute value of coth r.</desc>

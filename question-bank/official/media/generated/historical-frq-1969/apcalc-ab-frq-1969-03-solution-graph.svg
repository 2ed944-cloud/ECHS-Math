<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="q3-title q3-desc">
  <title id="q3-title">Graph of f of x equals one over x plus natural logarithm of x</title>
  <desc id="q3-desc">The graph on the half-open interval from e to the negative one through e. It decreases from a closed left endpoint to an absolute minimum at x equals one, then increases, changes concavity at x equals two, and approaches an open right endpoint at x equals e. A dashed horizontal line marks the average value.</desc>

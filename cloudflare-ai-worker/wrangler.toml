name = "echs-math-tutor"
main = "src/index.js"
compatibility_date = "2026-08-01"

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://2ed944-cloud.github.io,http://localhost:8000,http://127.0.0.1:8000"
PRIMARY_MODEL = "@cf/google/gemma-4-26b-a4b-it"
FALLBACK_MODEL = "@cf/zai-org/glm-4.7-flash"
REVIEW_MODEL = "@cf/zai-org/glm-4.7-flash"
ENABLE_REVIEW = "true"
RATE_LIMIT_PER_MINUTE = "12"
MAX_MESSAGE_CHARS = "3000"
MAX_HISTORY_MESSAGES = "10"
MAX_HISTORY_CHARS = "1800"
